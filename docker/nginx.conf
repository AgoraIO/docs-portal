server {
  listen 80;
  listen [::]:80;
  server_name _;
  # Keep directory redirects on the public proxy host and scheme.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  location /assets/ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control 'no-cache';
    # Chinese builds store clean public routes under zh-CN on disk.
    try_files $uri $uri/ $uri/index.html /zh-CN$uri/index.html /zh-CN$uri =404;
  }
}

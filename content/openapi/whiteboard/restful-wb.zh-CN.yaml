components:
  parameters:
    beginUUID:
      name: beginUUID
      in: query
      description: 查询的起始房间的 UUID。
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: 返回的房间列表的最大长度，取值范围为 (0,1000]。如果不填，则最多返回 100 条房间信息。
      required: false
      schema:
        type: string
        default: '100'
    sceneDir:
      name: sceneDir
      in: query
      description: 场景组的路径地址，以 `/` 开头。如果填入该参数，则返回指定场景组下的场景地址列表；如果不填，则返回当前所在场景组下的场景地址列表。
      required: false
      allowEmptyValue: true
      schema:
        type: string
    uuid:
      name: uuid
      in: path
      description: 房间的 UUID, 即房间的全局唯一标识符，可通过调用[创建房间 API](create-room) 或[获取房间信息 API](get-room) 获取。
      required: true
      schema:
        type: string
    uuid-convert:
      name: uuid
      in: path
      description: 转换任务的 UUID，即转换任务的唯一标识符，可通过调用[发起文档转换 API](start-file-conversion) 获取。
      required: true
      schema:
        type: string
        examples:
        - 2fxxxxxx367e
    region:
      name: region
      in: header
      description: |-
        指定处理该请求的数据中心，取值如下：

        - `cn-hz`：中国杭州，服务区覆盖中国大陆地区及其他数据中心未覆盖的区域。

        - `us-sv`：美国硅谷，服务区覆盖北美洲、南美洲。

        - `sg`：新加坡，服务区覆盖新加坡、东亚、东南亚。

        - `in-mum`：印度孟买，服务区覆盖印度。

        - `eu`：欧洲（法兰克福），服务区覆盖欧洲。
      required: true
      schema:
        type: string
        enum:
        - cn-hz
        - us-sv
        - sg
        - in-mum
        - eu
    token:
      name: token
      in: header
      description: |-
        SDK Token，可以通过以下方式获取：

        - 在声网控制台生成用于测试的 SDK Token，详见[获取互动白板项目的安全密钥](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/setup-and-access/enable-service#获取互动白板项目的安全密钥)。

        - 调用服务端 RESTful API， 详见[生成 SDK Token](generate-sdk-token)。

        - 在 App 服务端用代码生成，详见[在 App 服务端生成 Token](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/setup-and-access/generate-token#在-app-服务端生成-token)。
      required: true
      schema:
        type: string
        examples:
        - NETLESSSDK_YWs9xxxxxxM2MjRi
    taskToken:
      name: token
      in: header
      description: |-
        Task Token，可通过以下方式获取：

        - 调用服务端 RESTful API， 详见[生成 Task Token](generate-task-token)。

        - 在 app 服务端用代码生成，详见[在 App 服务端生成 Token](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/setup-and-access/generate-token#在-app-服务端生成-token)。
      required: true
      schema:
        type: string
  responses:
    '200':
      description: |-
        若返回的状态码为 `200` 则表示请求成功。响应 Body 中包含包含 String 型的场景地址。

        若返回的状态码不为 `200` 则表示请求失败。你可以参考[响应状态码](/zh-CN/realtime-media/whiteboard/fastboard-sdk/reference/response-code)了解可能的原因。
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
            x-examples:
              Example 1:
              - /test/cover
              - /test/page1
          examples:
            Example 1:
              value:
              - /test/cover
              - /test/page1
    '201':
      description: |-
        若返回的状态码为 `201` 则表示请求成功。响应 Body 为空对象。

        若返回的状态码不为 `201` 则表示请求失败。你可以参考[响应状态码](/zh-CN/realtime-media/whiteboard/fastboard-sdk/reference/response-code)了解可能的原因。
      content:
        application/json:
          schema:
            type: object
          examples:
            Example 1:
              value: {}
  schemas:
    ak:
      type: string
      title: ak
      description: 访问密钥 Access Key (AK)，可在声网控制台获取，详见[获取互动白板项目的安全密钥](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/setup-and-access/enable-service#获取互动白板项目的安全密钥)。
    sk:
      type: string
      title: sk
      description: 私有访问密钥 Secret Access Key (SK)，可在声网控制台获取，详见[获取互动白板项目的安全密钥](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/setup-and-access/enable-service#获取互动白板项目的安全密钥)。
    lifespan:
      type: integer
      title: lifespan
      description: Token 的有效时间（ms）。设为 `0` 表示永久有效。
      examples:
      - 36000
    role:
      type: string
      title: role
      description: |-
        权限角色，取值如下：

        - `admin`

        - `writer`

        - `reader`
        详见 [Token 的类型与权限](/zh-CN/realtime-media/whiteboard/concepts#token)。
    isRecord:
      type: boolean
      title: isRecord
      description: |-
        是否开启录制：

        - `true`：开启。

        - `false`: 不开启。
        仅 `cn-hz` 区域的 `isRecord` 字段默认值为 `true`。开启白板录制将产生费用，如果你没有录制需求，需手动传入 `false`。
      default: true
    uuid:
      type: string
      title: uuid
      description: 房间的 UUID，即房间的全局唯一标识符。
    teamUUID:
      type: string
      title: teamUUID
      description: 互动白板控制台账号的唯一标识符。
    appUUID:
      type: string
      title: appUUID
      description: 互动白板项目的唯一标识符。
    R-isRecord:
      type: boolean
      title: R-isRecord
      description: |-
        房间是否开启录制：

        - `true`：开启。

        - `false`: 不开启。
    isBan:
      type: boolean
      title: isBan
      description: |-
        房间是否被封禁：

        - `true`：已封禁。

        - `false`: 未封禁。
    createAt:
      type: string
      title: createdAt
      description: 创建房间的 UTC 时间。
      examples:
      - '2021-01-18T06:56:29.432Z'
    R-limit:
      type: integer
      title: R-limit
      description: 已废弃，值固定为 `0`。
    P-isBan:
      type: boolean
      title: P-isBan
      description: |-
        是否封禁房间：

        - `true`：封禁。

        - `false`: （默认值）不封禁。
      default: false
    scenes:
      type: array
      title: scenes
      description: 由场景组成的数组。
      items:
        type: object
        properties:
          name:
            type: string
            description: 场景名称，不能与所属场景组下的其他场景重名，不能包含 `/`。
          ppt:
            $ref: '#/components/schemas/ppt'
        required:
        - name
        - ppt
    ppt:
      type: object
      title: ppt
      description: 场景背景图的属性。
      properties:
        src:
          type: string
          description: |-
            图片的 URL。

            > 请确保你的浏览器可以访问并支持展示该图片，否则，该图片可能无法显示在白板场景中。
        width:
          type: number
          description: 图片的宽度，单位像素。
        height:
          type: number
          description: 图片的高度，单位像素。
    path-scene:
      type: string
      title: path-scene
      description: |-
        场景组的地址。

        > 如果传入的场景组地址已经存在，则在已有的场景组下插入指定的新场景；如果传入的场景组地址不存在，则自动新建一个场景组并在该场景组下插入指定的新场景。
    scenePath:
      type: string
      title: scenePath
      description: 要切换到的场景的地址。
      examples:
      - /test/page1
    currentScenePath:
      type: array
      title: currentScenePath
      description: 当前的场景地址，由场景组和场景名组成的数组。
      examples:
      - - test
        - page1
      items:
        type: string
    width:
      type: number
      title: width
      description: 截图的宽度，单位为像素。
      examples:
      - 640
    height:
      type: number
      title: height
      description: 截图的高度，单位为像素。
      examples:
      - 480
    path:
      type: string
      title: path
      description: 需要截图的场景路径，以 `/` 开头。如果不传，默认获取 `/init` 场景的截图。
      default: /init
    url:
      type: string
      title: url
      description: 截图的 URL。
      examples:
      - https://white-cover.oss-cn-hangzhou.aliyuncs.com/room_cover/2811/a7exxxxca69undefined.png
    key:
      type: string
      title: key
      description: 截图在存储空间内的文件名。
      examples:
      - room_cover/2811/a7exxxxxca69undefined.png
    bucket:
      type: string
      title: bucket
      description: 截图存放的存储空间名称。
      examples:
      - white-cover
    region-screenshot:
      type: string
      title: region-screenshot
      description: 截图存放的存储空间所属地域。
      examples:
      - oss-cn-hangzhou
    resource:
      type: string
      title: resource
      description: 待转换的源文件 URL。
      examples:
      - https://docs-test-xx.oss-cn-hangzhou.aliyuncs.com/xxx
    type:
      type: string
      title: type
      description: |-
        转换任务类型，取值如下：

        - `dynamic`：动态文档转换，即文档转网页。

        - `static`：静态文档转换，即文档转图片。
      default: dynamic
    preview:
      type: boolean
      title: preview
      description: |-
        是否需要生成预览图：

        - `true`：是。

        - `false`：否。
        该参数仅在 `type` 设为 `dynamic` 时生效。
    scale:
      type: number
      title: scale
      description: 图片缩放比例。数值越大，图片越清晰。该参数仅在 `type` 设为 `static` 时生效。
      minimum: 0.1
      maximum: 3
      default: 1.2
    outputFormat:
      type: string
      title: outputFormat
      description: |-
        输出图片格式，取值如下：

        - `png`：PNG 格式。

        - `jpg`：JPG 格式。

        -  `jpeg`：JPEG 格式。

        -  `qpdf`：QPDF 格式。仅 PDF 文件（以 `%PDF` 开头的文件）支持转换为 QPDF 格式。你可以使用 [@netless-app-pdfjs](https://github.com/netless-io/netless-app-pdfjs) 插件展示到基于 Fastboard SDK 的互动白板 App 中。
         该参数仅在 `type` 设为 `static` 时生效。
      default: png
    webhookEndpoint:
      type: string
      title: webhookEndpoint
      description: |-
        Webhook 回调地址，一般为 app 服务端地址，用于接收服务端发送的转换任务进度等信息。传入该参数即可激活 Webhook 回调，接收来自服务端的文档转换进度和运行状态信息。Webhook 配置方式和签名验证详见[接收文档转换 Webhook 事件](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/extend-whiteboard/conversion-webhook)。

        > Webhook 回调有一定概率重复回调，为保证 app 服务端在接到相同响应时的处理方式保持一致，需要做好幂等处理。
      examples:
      - https://example.com/agoracallback
    webhookRetry:
      type: number
      title: webhookRetry
      description: Webhook 回调失败时的重试次数。
      maximum: 10
      default: 3
    imageCompressionLevel:
      type: number
      title: imageCompressionLevel
      description: |-
        动态转换输出图片的压缩等级，仅能传入以下值：

        - `0`：（默认）输出原图。

        - `1`：输出图片使用的最大颜色数量限制为 256。

        - `2`：输出图片使用的最大颜色数量限制为 192。

        - `3`：输出图片使用的最大颜色数量限制为 128。

        - `4`：输出图片使用的最大颜色数量限制为 64。
        该参数仅在 `type` 设为 `dynamic` 时生效。

        > 通常，在保证画质不受明显影响的前提下，输出图片的体积最高可以压缩至原图的 10%。压缩图片体积可在弱网环境下改善转换后 PPT 的首次加载时间。
      default: 0
    uuid-convert:
      type: string
      title: uuid
      description: 转换任务的 UUID，即转换任务的唯一标识符。
      examples:
      - 2fd2dxxxxx367e"
    type-response:
      type: string
      title: type
      description: |-
        转换任务类型，取值如下：

        - `dynamic`：动态文档转换，即文档转网页。

        - `static`：静态文档转换，即文档转图片。
    status-convert:
      type: string
      title: status
      description: |-
        转换任务的状态：

        - `Waiting`：等待转换。

        - `Converting`：转换中。

        - `Finished`：已完成。

        - `Fail`：失败。
    taskId:
      type: string
      title: taskId
      description: 转换任务的 UUID，即转换任务的唯一标识符。
    convertedPercentage:
      type: number
      title: convertedPercentage
      description: 转换进度百分比。
    prefix:
      type: string
      title: prefix
      description: 转换结果文件地址前缀路径。
      examples:
      - https://xxxx.com/dynamicConvert
    pageCount:
      type: number
      title: pageCount
      description: 文档页数，转换任务失败时没有该字段。
    previews:
      type: object
      title: previews
      description: 转换后的文档预览图地址，每页对应一个预览图地址。该参数仅在[发起文档转换](start-file-conversion)时，请求 Body 中的 `preview` 设为 `true `，且 `type` 设为 `dynamic` 时才生效。
      properties:
        id:
          type: string
          examples:
          - https://xxxx.xx.xx/id.png
      examples: []
    note:
      type: string
      title: note
      description: 从文档中提取出的备注内容，只包含有备注的页面。
    images:
      type: object
      title: images
      description: 文档转图片结果的地址，每页对应一张图片。该参数仅在该参数仅在[发起文档转换](start-file-conversion)时，请求 Body 中的 `type` 设为 `static` 时才生效。
      properties:
        id:
          type: string
          examples:
          - https://xxxx.xx.xx/id.xxx
    errorCode:
      type: string
      title: errorCode
      description: 错误码。仅在转换任务失败时，才会返回该字段。所有可能的错误码详见[文档转换错误码](/zh-CN/realtime-media/whiteboard/fastboard-sdk/reference/response-code)。
    errorMessage:
      type: string
      title: errorMessage
      description: 错误码对应的错误消息，描述出错的原因。仅在转换任务失败时，才会返回该字段。

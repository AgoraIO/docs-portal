      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/uuid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                width:
                  $ref: '#/components/schemas/width'
                height:
                  $ref: '#/components/schemas/height'
                path:
                  $ref: '#/components/schemas/path'
              required:

      servers:
      - url: https://api.netless.link
        description: ''
  /v5/rooms:
    post:
      tags:
      - 房间管理
      summary: 创建房间
      description: 创建一个实时互动房间。
      operationId: post-v5-rooms
      parameters:
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/region'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isRecord:
                  $ref: '#/components/schemas/isRecord'
      responses:
        '201':
          description: |-
            若返回的状态码为 `201` 则表示请求成功。响应 Body 中包含本次请求的结果。

            若返回的状态码不为 `201` 则表示请求失败。你可以参考[响应状态码](/zh-CN/realtime-media/whiteboard/fastboard-sdk/reference/response-code)了解可能的原因。
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    $ref: '#/components/schemas/uuid'
                  teamUUID:
                    $ref: '#/components/schemas/teamUUID'
                  appUUID:
                    $ref: '#/components/schemas/appUUID'
                  isRecord:
                    $ref: '#/components/schemas/R-isRecord'
                  isBan:
                    $ref: '#/components/schemas/isBan'
                  createdAt:
                    $ref: '#/components/schemas/createAt'
                  limit:
                    $ref: '#/components/schemas/R-limit'
      servers:
      - url: https://api.netless.link
        description: ''
    get:
      tags:
      - 房间管理
      summary: 获取房间列表
      description: 获取房间列表。
      operationId: get-v5-rooms
      parameters:
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/beginUUID'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: |-
            若返回的状态码为 `200` 则表示请求成功。响应 Body 中包含本次请求的结果。

            若返回的状态码不为 `200` 则表示请求失败。你可以参考[响应状态码](/zh-CN/realtime-media/whiteboard/fastboard-sdk/reference/response-code)了解可能的原因。
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    $ref: '#/components/schemas/uuid'
                  teamUUID:
                    $ref: '#/components/schemas/teamUUID'
                  appUUID:
                    $ref: '#/components/schemas/appUUID'
                  isRecord:
                    $ref: '#/components/schemas/R-isRecord'
                  isBan:
                    $ref: '#/components/schemas/isBan'
                  createdAt:
                    $ref: '#/components/schemas/createAt'
                  limit:
                    $ref: '#/components/schemas/R-limit'
      servers:
      - url: https://api.netless.link
        description: ''
  /v5/rooms/{uuid}:
    get:
      tags:
      - 房间管理
      summary: 获取房间信息
      description: 获取指定房间的信息。
      operationId: get-v5-rooms-uuid
      parameters:
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          description: |-
            若返回的状态码为 `200` 则表示请求成功。响应 Body 中包含本次请求的结果。

            若返回的状态码不为 `200` 则表示请求失败。你可以参考[响应状态码](/zh-CN/realtime-media/whiteboard/fastboard-sdk/reference/response-code)了解可能的原因。
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    $ref: '#/components/schemas/uuid'
                  teamUUID:
                    $ref: '#/components/schemas/teamUUID'
                  appUUID:
                    $ref: '#/components/schemas/appUUID'
                  isRecord:
                    $ref: '#/components/schemas/R-isRecord'
                  isBan:
                    $ref: '#/components/schemas/isBan'
                  createdAt:
                    $ref: '#/components/schemas/createAt'
                  limit:
                    $ref: '#/components/schemas/R-limit'
                x-examples:
                  Example 1:
                    uuid: 4axxxxx96b
                    teamUUID: RMmxxxxx5aw
                    appUUID: i5xxxxx1AQ
                    isRecord: true
                    isBan: false
                    createdAt: '2021-01-18T06:56:29.432Z'
                    limit: 0
              examples:
                Example 1:
                  value:
                    uuid: 4axxxxx96b
                    teamUUID: RMmxxxxx5aw
                    appUUID: i5xxxxx1AQ
                    isRecord: true
                    isBan: false
                    createdAt: '2021-01-18T06:56:29.432Z'
                    limit: 0
      servers:
      - url: https://api.netless.link
        description: ''
    patch:
      tags:
      - 房间管理
      summary: 封禁房间
      description: 封禁或取消封禁指定的房间。
      operationId: patch-v5-rooms-uuid
      parameters:
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/uuid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isBan:
                  $ref: '#/components/schemas/P-isBan'
              required:
              - isBan
      responses:
        '201':
          description: |-
            若返回的状态码为 `201` 则表示请求成功。响应 Body 中包含本次请求的结果。

            若返回的状态码不为 `201` 则表示请求失败。你可以参考[响应状态码](/zh-CN/realtime-media/whiteboard/fastboard-sdk/reference/response-code)了解可能的原因。
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    $ref: '#/components/schemas/uuid'
                  teamUUID:
                    $ref: '#/components/schemas/teamUUID'
                  appUUID:
                    $ref: '#/components/schemas/appUUID'
                  isRecord:
                    $ref: '#/components/schemas/R-isRecord'
                  isBan:
                    $ref: '#/components/schemas/isBan'
                  createdAt:
                    $ref: '#/components/schemas/createAt'
                  limit:
                    $ref: '#/components/schemas/R-limit'
                x-examples:
                  Example 1:
                    uuid: 0e6xxxxxx95
                    teamUUID: RMxxxxxaw
                    appUUID: vVxxxxxJF-A
                    isRecord: true
                    isBan: true
                    createdAt: '2020-12-20T14:02:54.846Z'
                    limit: 0
      servers:
      - url: https://api.netless.link
        description: ''
      x-docs-sections:
      - position: after-description
        markdown: |-
          房间被封禁后，互动白板服务会移除房间内的用户并禁止新用户加入该房间。

          你可以再次调用该 API，并在请求 Body 中将 `isBan` 设为 `false`，取消对房间的封禁。
  /v5/rooms/{uuid}/scenes:
    get:
      tags:
      - 场景管理

      servers:
      - url: https://api.netless.link
        description: ''
  /v5/rooms/{uuid}/scene-state:
    patch:
      tags:
      - 场景管理
      summary: 场景跳转
      description: 当房间内存在多个场景或场景组，可调用该 API 切换场景。
      operationId: patch-v5-rooms-uuid-scene-state

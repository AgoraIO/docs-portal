    post:
      tags:
      - 旧版文档转换
      summary: 发起文档转换
      description: 发起一个文档转换任务。
      operationId: post-v5-services-conversion-tasks
      parameters:
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/region'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resource:
                  $ref: '#/components/schemas/resource'
                type:
                  $ref: '#/components/schemas/type'
                preview:
                  $ref: '#/components/schemas/preview'
                scale:
                  $ref: '#/components/schemas/scale'
                outputFormat:
                  $ref: '#/components/schemas/outputFormat'
                pack:
                  type: boolean
                  description: |-
                    进行静态文档转换时，是否生成资源包：

                    - `true`：生成资源包。该参数设为 `true` 时，声网服务端会将所有转换后的图片打包成 `{uuid}.zip` 文件，并上传到你指定的存储路径中。

                    - `false`：（默认）不生成资源包。

                    > 该参数仅在 `type` 设为 `static` 时生效。当 `type` 设为 `dynamic` 时，声网服务端会自动生成 `{uuid}.zip` 资源包。
                canvasVersion:
                  type: boolean
                  description: |-
                    进行动态文档转换时，除将源文档转换为常规的 DOM 元素外，是否额外转换为 `canvas` 元素：

                    - `true`：将源文档转换为常规的 DOM 元素和 `canvas` 元素。
                     该选项适用于源文档包含复杂动画效果的情况，例如，切页动画。转换为 `canvas` 元素后，动画的渲染效果和性能更佳，但是转换速度会降低。
                    设置 `canvasVersion` 为 `true` 后，你可以使用 Whiteboard SDK，也可以使用 Fastboard SDK 渲染并展示转换后的文档。使用 Whiteboard SDK 可以读取转换结果中的 DOM 元素，并将其渲染为 DOM 网页，部分动画效果可能无法被渲染；使用 Fastboard SDK 可以读取转换结果中的 `canvas` 元素，并将其渲染为 canvas 页面，并保留完整的动画效果。

                    - `false`：（默认）仅将源文档转换为 DOM 元素。
                    该选项适用于除源文档包含复杂动画效果外的几乎所有情况，且转换速度快。但是，当源文档包含复杂动画时（例如，切页动画），转换为 DOM 元素后，部分动画效果可能无法被渲染，且渲染时可能出现卡顿。
                     未设置 `canvasVersion` 参数或设置 `canvasVersion` 为 `false` 后，仅可以使用 Whiteboard SDK 渲染并展示转换后的文档。使用 Fastboard SDK 将无法读取转换结果。

                    > 该参数仅在 `type` 设为 `dynamic` 时生效。
              required:
              - resource
              - type
              x-examples:
                Example 1:
                  resource: https://docs-test-xx.oss-cn-hangzhou.aliyuncs.com/xxx
                  type: static
                  preview: true

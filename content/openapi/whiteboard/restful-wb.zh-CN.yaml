            application/json:
              schema:
                type: object
                properties:
                  currentScenePath:
                    $ref: '#/components/schemas/currentScenePath'
              examples:
                Example 1:
                  value:
                    currentScenePath:
                    - test
                    - page1
      servers:
      - url: https://api.netless.link
        description: ''

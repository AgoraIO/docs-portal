  /v5/projector/tasks:
    post:
      tags:
      - 文档转换
      summary: 发起文档转换
      description: 发起一个文档转换任务。
      operationId: post-v5-projector-tasks
      parameters:
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/token'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  resource: https://docs-test-xx.oss-cn-hangzhou.aliyuncs.com/xxx
                  type: dynamic
                  preview: true
                  webhookEndpoint: https://example.com/agoracallback
                  webhookRetry: 1
              required:
              - resource
              properties:
                resource:
                  $ref: '#/components/schemas/resource'
                type:
                  $ref: '#/components/schemas/type'
                preview:
                  $ref: '#/components/schemas/preview'
                scale:
                  $ref: '#/components/schemas/scale'
                outputFormat:
                  $ref: '#/components/schemas/outputFormat'
                webhookEndpoint:
                  $ref: '#/components/schemas/webhookEndpoint'
                webhookRetry:
                  $ref: '#/components/schemas/webhookRetry'
                imageCompressionLevel:
                  $ref: '#/components/schemas/imageCompressionLevel'
                buildSpa:
                  type: boolean
                  x-stoplight:
                    id: 2xlwdh8i39o3w
                  default: true
                  description: |-
                    是否在转换完成后构建一个可独立渲染的单页应用程序 (SPA, Single-page Application)：

                    - `true`：（默认）构建 SPA 文件。文件为 HTML 格式，其中包含渲染 PPT 的所有资源，可用于单页预览，但服务器需要耗时（约 3 至 300 秒）下载所需资源和编译文件。

                    - `false`：不构建 SPA 文件。
            examples:

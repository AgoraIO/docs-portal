                  - name: page1
                    ppt:
                      src: xxxx
                      width: 640
                      height: 360
                  - name: page2
                    ppt:
                      src: xxxx
                      width: 640
                      height: 360
                  path: /test
            examples:
              Example 1:
                value:
                  scenes:
                  - name: page1
                    ppt:
                      src: xxxx
                      width: 640
                      height: 360
                  - name: page2
                    ppt:
                      src: xxxx
                      width: 640
                      height: 360

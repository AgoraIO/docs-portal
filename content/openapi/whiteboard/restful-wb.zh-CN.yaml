          application/json:
            schema:
              type: object
              properties:
                ? ''
                : $ref: '#/components/schemas/scenePath'
              required:
              - ''
      responses:
        '201':
          description: |-
            若返回的状态码为 `201` 则表示请求成功。响应 Body 中包含本次请求的结果。

            若返回的状态码不为 `201` 则表示请求失败。你可以参考[响应状态码](/zh-CN/realtime-media/whiteboard/fastboard-sdk/reference/response-code)了解可能的原因。

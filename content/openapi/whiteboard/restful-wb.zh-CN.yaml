openapi: 3.1.0
info:
  version: ''
  title: API 概述
  description: |-
    本文介绍声网互动白板服务端 RESTful API 的基本信息。

    ## 数据格式

    所有 HTTP 请求 Header 的 Content-Type 类型为 `application/json`。所有请求和响应内容的格式均为 JSON。所有的请求 URL 和请求 Body 内容都是区分大小写的。

    > 互动白板服务器会对部分请求格式做兼容，但是无法保证完全兼容。当请求参数填写正确，但请求仍然失败时，请确认请求格式是否正确。

    ## 主要功能

    声网互动白板服务端 RESTful API 提供以下功能：

    - **生成 Token**：生成互动白板的 Token，包括 SDK Token、Room Token 和 Task Token。

    - **房间管理**：互动白板房间的相关操作，包括创建房间、获取房间信息、获取房间列表和封禁房间。

    - **截图管理**：对指定场景或指定场景组下的所有场景进行截图，生成 PNG 格式的图片并上传至你提供的第三方云存储空间中。在调用截图管理 API 之前，请确保：

      - 已开通第三方云存储账号，并创建了存储空间。目前互动白板支持的第三方云存储包括：[阿里云存储](https://help.aliyun.com/product/31815.html?spm=5176.7933691.J_1309819.8.2e392a66QiJZD3)、[七牛云存储](https://www.qiniu.com/products/kodo)和 [AWS 云存储](https://amazonaws-china.com/cn/products/storage/?nc2=h_ql_prod_st)。
      - 已在声网控制台开启截图服务，并添加了存储配置。详见[开启互动白板配套服务](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/setup-and-access/enable-service#开启互动白板配套服务)。

    - **场景管理**：互动白板场景的相关操作，包括插入新场景、场景跳转和获取场景地址列表。

    - **文档转换**：文档转换服务支持将 PPT、PPTX、DOC、DOCX、PDF 格式的文件转换成静态图片，将 PPT 和 PPTX 的文件转换为动态 HTML 网页，转换后的图片或网页可作为演示资料在互动白板中展示。详见[文档转换服务](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/extend-whiteboard/convert-files)。

      调用文档转换 API 前，请确保：

      - 已在[声网控制台](https://console.shengwang.cn/)开启**文档转图片**或**文档转网页**服务并添加存储配置。详见[开启互动白板配套服务](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/setup-and-access/enable-service#开启互动白板配套服务)。
      - 已为待转换的文档生成一个公网可访问的 URL 地址。

    > 本文仅适用于新版文档转换服务。新版本和旧版本的差异详见[文档转换服务](/zh-CN/realtime-media/whiteboard/fastboard-sdk/build/extend-whiteboard/convert-files)。如果使用旧版文档转换服务，请查看[旧版文档转换服务 API 参考](/zh-CN/api-reference/api-ref/whiteboard/restful/start-file-conversion) 。

    ## 响应状态码

    调用互动白板 RESTful API 可能返回的响应状态码包括**通用响应状态码**和**文档转换错误码**，详见[响应状态码](/zh-CN/realtime-media/whiteboard/fastboard-sdk/reference/response-code)。
servers:
- url: https://api.netless.link
  description: ''
paths:
  /v5/tokens/teams:
    post:
      tags:
      - 生成 Token
      summary: 生成 SDK Token
      description: 生成一个 SDK Token。
      operationId: post-v5-tokens-teams
      parameters:
      - $ref: '#/components/parameters/region'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                accessKey:
                  $ref: '#/components/schemas/ak'
                secretAccessKey:
                  $ref: '#/components/schemas/sk'
                lifespan:
                  $ref: '#/components/schemas/lifespan'
                role:
                  $ref: '#/components/schemas/role'
              required:
              - accessKey
              - secretAccessKey
              - lifespan
              - role
            examples:
              Example 1:
                value:
                  accessKey: BUxxxxxxrc
                  secretAccessKey: CxxxxxxxauY3
                  lifespan: 3600000
                  role: admin
      responses:
        '201':
          $ref: '#/components/responses/201'
      servers:
      - url: https://api.netless.link
        description: ''
  /v5/tokens/rooms/{uuid}:
    post:
      tags:
      - 生成 Token
      summary: 生成 Room Token
      description: 生成一个 Room Token。
      operationId: post-v5-tokens-rooms-uuid
      parameters:
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/uuid'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                lifespan:
                  $ref: '#/components/schemas/lifespan'
                role:
                  $ref: '#/components/schemas/role'
              required:
              - lifespan
              - role
              x-examples:
                Example 1:
                  lifespan: 3600000
                  role: admin
      responses:
        '201':
          $ref: '#/components/responses/201'
      servers:
      - url: https://api.netless.link
        description: ''
  /v5/tokens/tasks/{uuid}:
    post:
      tags:
      - 生成 Token
      summary: 生成 Task Token
      description: 生成一个 Task Token。
      operationId: post-v5-tokens-tasks-uuid
      parameters:
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/uuid-convert'
      requestBody:
        description: ''

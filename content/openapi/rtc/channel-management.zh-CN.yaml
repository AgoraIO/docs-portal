      operationId: put-dev-v1-kicking-rule
      parameters:
      - name: Content-Type
        in: header
        description: '`application/json`。表示所有请求和响应内容的格式均为 JSON。'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                appid:
                  type: string
                  description: '项目的 App ID。可通过以下方式获取：


        schema:
          type: string
      responses:
        '200':
          description: 如果状态码为 200，则请求成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: 本次请求的状态。`success` 表示请求成功。
                  rules:
                    type: array
                    description: 封禁用户权限的规则列表。该数组由多个 object 组成，每个 object 表示一条规则的信息。
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: 规则 ID。当更新或删除封禁用户权限规则时，需要传入规则 ID。
                        uid:
                          type: number
                          description: 用户 ID。
                        opid:
                          type: number
                          description: 操作 ID，用于问题排查时核对操作记录。
                        cname:
                          type: string
                          description: 频道名。
                        ip:
                          type: string
                          description: 用户的 IP 地址。
                        ts:
                          type: string
                          description: 该规则过期时间（UTC 时间）。
                        privileges:
                          type: array
                          description: '被封禁的用户权限，可能包含的字段如下：

                            - `join_channel`：加入频道

                            - `publish_audio`：发送音频流

                            - `publish_video`：发送视频流'
                          items:
                            type: string
                        createAt:
                          type: string
                          description: 该规则的创建时间（UTC 时间）。
                        updateAt:
                          type: string
                          description: 该规则的更新时间（UTC 时间）。
                x-examples:
                  Example 1:
                    status: success
                    rules:
                    - id: 1953
                      appid: 4855xxxxxxxxxxxxxxxxxxxxxxxxeae2
                      uid: 589517928
                      opid: 1406
                      cname: '11'
                      ip: 192.168.0.1
                      ts: '2018-01-09T07:23:06.000Z'
                      privileges:
                      - join_channel
                      createAt: '2018-01-09T06:23:06.000Z'
                      updateAt: '2018-01-09T14:23:06.000Z'
              examples:
                Example 1:
                  value:
                    status: success
                    rules:
                    - id: 1953
                      appid: 4855xxxxxxxxxxxxxxxxxxxxxxxxeae2
                      uid: 589517928
                      opid: 1406
                      cname: '11'
                      ip: 192.168.0.1
                      ts: '2018-01-09T07:23:06.000Z'
                      privileges:
                      - join_channel
                      createAt: '2018-01-09T06:23:06.000Z'
                      updateAt: '2018-01-09T14:23:06.000Z'
        非 200:
          description: 如果状态码不为 200，则请求失败。你可以参考[响应状态码](/zh-CN/api-reference/response-code)排查问题。
      servers:
      - url: https://api.sd-rtn.com
        description: ''
      x-stoplight:
        id: kui1nwcqkgvy5
      security:
      - Basic Auth: []
      x-docs-sections:
      - position: after-description
        markdown: 该方法获取封禁用户权限的规则列表。
      x-docs-callouts:
      - type: warning
        title: 注意

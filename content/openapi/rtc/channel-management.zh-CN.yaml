  /dev/v1/channel/user/property/{appid}/{uid}/{channelName}:
    get:
      tags:
      - 查询在线频道信息
      summary: 查询用户状态
      description: 查询指定频道中指定用户的在线状态。
      operationId: get-user-property
      parameters:
      - name: appid
        in: path
        description: '项目的 App ID。可通过以下方式获取：

          - 从声网控制台获取。

          - 调用[获取所有项目信息 API](/zh-CN/api-reference/api-ref/console/list-projects)，并读取响应包体中 `vendor_key` 字段的值。'
        required: true
      - name: uid
        in: path
        description: '用户 ID。


          注意：该参数暂不支持 String 型用户名（User Account），请确保使用整型用户 ID。'
        required: true
      - name: channelName
        in: path
        description: 频道名称。
        required: true
      responses:
        '200':
          description: 如果状态码为 200，则请求成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '本次请求的状态：

                      - `true`：请求成功

                      - `false`：预留'
                  data:
                    type: object
                    description: 用户状态数据。
                    properties:
                      in_channel:
                        type: boolean
                        description: '用户当前是否在频道内：

                          - `true`：是

                          - `false`：否


                          **注意：**

                          当 `in_channel` 的值为 `false` 时不会返回其他字段。'
                      join:
                        type: number
                        description: 用户加入频道的 Unix 时间戳，单位为秒。
                      uid:
                        type: number
                        description: 用户 ID。
                      role:
                        type: number
                        description: '用户在频道内的角色：

                          - `0`：未知

                          - `1`：通信场景下的用户

                          - `2`：直播场景下的主播

                          - `3`：直播场景下的观众'
                      platform:
                        type: number
                        description: '用户设备所属平台，常见的返回值如下：

                          - `1`：Android

                          - `2`：iOS

                          - `5`：Windows

                          - `6`：Linux

                          - `7`：Web

                          - `8`：macOS

                          - `0`：其它平台'
                x-examples:
                  Example 1:
                    success: true
                    data:
                      join: 1640330382
                      uid: 2845863044
                      in_channel: true
                      platform: 7
                      role: 2
              examples:
                Example 1:
                  value:
                    success: true
                    data:
                      join: 1640330382
                      uid: 2845863044
                      in_channel: true
                      platform: 7
                      role: 2
        非 200:

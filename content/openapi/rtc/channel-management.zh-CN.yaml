                    - 调用[获取所有项目信息 API](/zh-CN/api-reference/api-ref/console/list-projects)，并读取响应包体中 `vendor_key` 字段的值。'
                id:
                  type: number
                  description: 规则 ID。
                time:
                  type: number
                  description: '封禁时间，单位为分钟，取值范围为 [1,1440]。


                    **注意：**

                    - 当设置的值在 `0` 到 `1` 之间时，服务端自动改设为 `1`。


openapi: 3.1.0
info:
  version: ''
  title: RTC REST API
  description: >-
    Manage RTC channel state and operational controls with Agora REST APIs. This OpenAPI
    source is shared by Voice Calling and Video Calling entries, so those product pages
    provide context while this RTC reference remains the authoritative source for
    endpoints.


    All requests are sent to the host `api.agora.io`.


    - **Authentication**: All APIs require Basic Auth for authentication.

    - **Request and response**: The content is in JSON format.

    - All request URLs and request bodies are case-sensitive. All requests must use
    HTTPS.
servers:
  - url: https://api.agora.io
    description: Base host for the channel management APIs.
tags:
  - name: Query channel information
    description: Query online channel and user information.
  - name: Ban user privileges
    description: Create and manage banning rules for channel users.
  - name: Message notification service
    description: Retrieve Agora Notifications service IP addresses.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: All channel management REST APIs require Basic Auth for authentication.
  parameters:
    appidPath:
      name: appid
      in: path
      required: true
      schema:
        type: string
      description: |-
        The App ID of the project. You can get it through one of the following methods:
        - Copy from the [Agora Console](https://console.agora.io)
        - Call the Get all projects API, and read the value of the `vendor_key`
          field in the response body.
    channelNamePath:
      name: channelName
      in: path
      required: true
      schema:
        type: string
      description: The channel name.
security:
  - basicAuth: []
paths:
  /dev/v1/channel/{appid}:
    get:
      tags:
        - Query channel information
      summary: Query the channel list
      description: >-
        Use this endpoint to get the list of all channels under a specified project. The
        channel list is returned by page; specify the page number and page size in the
        request URL.


        > If the number of users in a channel changes frequently, the query results may
        be inaccurate. A channel may appear repeatedly on different pages, or may not
        appear on any page.
      operationId: cma-query-channel-list
      parameters:
        - $ref: '#/components/parameters/appidPath'
        - name: page_no
          in: query
          required: false
          schema:
            type: number
            default: 0
          description: >-
            The page number to query. The default value is `0`, which is the first page.
            The value of `page_no` cannot exceed `(total number of channels / page_size)
            - 1`; otherwise, the specified page contains no channels.
        - name: page_size
          in: query
          required: false
          schema:
            type: number
            default: 100
          description: The number of channels per page. The value range is [1,500].
      responses:
        '200':
          description: >-
            A `200` status code indicates success. The response body contains the result
            of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: |-
                      The state of this request:
                      - `true`: Success.
                      - `false`: Reserved for future use.
                  data:
                    type: object
                    description: Channel statistics.
                    properties:
                      channels:
                        type: array
                        description: >-
                          The list of channels. If the specified page contains no
                          channels, this field is empty.
                        items:
                          type: object
                          properties:
                            channel_name:
                              type: string
                              description: The channel name.
                            user_count:
                              type: number
                              description: The total number of users in the channel.
                      total_size:
                        type: number
                        description: The total number of channels under the specified project.
              example:
                success: true
                data:
                  channels:
                    - channel_name: lkj144
                      user_count: 3
                  total_size: 1
        default:
          description: >-
            The request failed. See the `message` field in the response body for the
            reason. Refer to Response status codes for details.
  /dev/v1/channel/user/{appid}/{channelName}:
    get:
      tags:
        - Query channel information
      summary: Query the user list
      description: >-
        Use this endpoint to get the list of all users in a specified channel. All users
        in the channel must use the same channel profile; otherwise, the query results
        may be inaccurate.


        The returned list differs based on the channel profile:

        - `COMMUNICATION` profile: Returns the list of all users in the channel.

        - `LIVE_BROADCASTING` profile: Returns the list of all hosts and
          audience members in the channel.
      operationId: cma-query-user-list
      parameters:
        - $ref: '#/components/parameters/appidPath'
        - $ref: '#/components/parameters/channelNamePath'
        - name: hosts_only
          in: query
          required: false
          schema:
            type: string
          description: >-
            When specified, only the host list is returned. Applicable to the
            `LIVE_BROADCASTING` profile only.
      responses:
        '200':
          description: >-
            A `200` status code indicates success. The response body contains the result
            of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: |-
                      The state of this request:
                      - `true`: Success.
                      - `false`: Reserved for future use.
                  data:
                    type: object
                    description: User information.
                    properties:
                      channel_exist:
                        type: boolean
                        description: >-
                          Whether the specified channel exists. When `false`, no other
                          fields are returned.
                      mode:
                        type: number
                        description: |-
                          The channel profile:
                          - `1`: The `COMMUNICATION` profile.
                          - `2`: The `LIVE_BROADCASTING` profile.
                      total:
                        type: number
                        description: >-
                          The total number of users in the channel. Returned only when
                          `mode` is `1`.
                      users:
                        type: array
                        items:
                          type: number
                        description: >-
                          User IDs of all users in the channel. Returned only when
                          `mode` is `1`.
                      broadcasters:
                        type: array
                        items:
                          type: number
                        description: >-
                          User IDs of all hosts in the channel. Returned only when
                          `mode` is `2`.
                      audience:
                        type: array
                        items:
                          type: number
                        description: >-
                          User IDs of the first 10,000 audience members in the channel.
                          Returned only when `mode` is `2` and `hosts_only` is not
                          specified.
                      audience_total:
                        type: number
                        description: >-
                          The total number of audience members in the channel. Returned
                          only when `mode` is `2` and `hosts_only` is not specified.
              example:
                success: true
                data:
                  channel_exist: true
                  mode: 2
                  broadcasters:
                    - 2206227541
                    - 2845863044
                  audience:
                    - 906219905
                  audience_total: 1
        default:
          description: >-
            The request failed. See the `message` field in the response body for the
            reason. Refer to Response status codes for details.
  /dev/v1/channel/user/{appid}/{channelName}/hosts_only:
    get:
      tags:
        - Query channel information
      summary: Query the host list
      description: >-
        Use this endpoint to get the list of hosts in a specified channel. This endpoint
        is only available in the `LIVE_BROADCASTING` profile (`mode = 2`); all users in
        the channel must use the same profile, otherwise query results may be
        inaccurate.
      operationId: cma-query-host-list
      parameters:
        - $ref: '#/components/parameters/appidPath'
        - $ref: '#/components/parameters/channelNamePath'
      responses:
        '200':
          description: >-
            A `200` status code indicates success. The response body contains the result
            of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: |-
                      The state of this request:
                      - `true`: Success.
                      - `false`: Reserved for future use.
                  data:
                    type: object
                    description: User information.
                    properties:
                      channel_exist:
                        type: boolean
                        description: >-
                          Whether the specified channel exists. When `false`, no other
                          fields are returned.
                      mode:
                        type: number
                        description: |-
                          The channel profile:
                          - `1`: The `COMMUNICATION` profile.
                          - `2`: The `LIVE_BROADCASTING` profile.
                      broadcasters:
                        type: array
                        items:
                          type: number
                        description: >-
                          User IDs of all hosts in the channel. Returned only when
                          `mode` is `2`.
              example:
                success: true
                data:
                  channel_exist: true
                  mode: 2
                  broadcasters:
                    - 574332
                    - 1347839
        default:
          description: >-
            The request failed. See the `message` field in the response body for the
            reason. Refer to Response status codes for details.
  /dev/v1/channel/user/property/{appid}/{uid}/{channelName}:
    get:
      tags:
        - Query channel information
      summary: Query user status
      description: >-
        Use this endpoint to get the status of a specified user. It checks whether the
        user is in the specified channel and, if present, returns the user's role and
        the time they joined.
      operationId: cma-query-user-status
      parameters:
        - $ref: '#/components/parameters/appidPath'
        - name: uid
          in: path
          required: true
          schema:
            type: number
          description: >-
            The user ID. This parameter does not support string user accounts; use the
            integer user ID only.
        - $ref: '#/components/parameters/channelNamePath'
      responses:
        '200':
          description: >-
            A `200` status code indicates success. The response body contains the result
            of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: |-
                      The state of this request:
                      - `true`: Success.
                      - `false`: Reserved for future use.
                  data:
                    type: object
                    description: User statistics.
                    properties:
                      in_channel:
                        type: boolean
                        description: >-
                          Whether the user is in the channel. When `false`, no other
                          fields are returned.
                      uid:
                        type: number
                        description: The user ID.
                      join:
                        type: number
                        description: >-
                          The Unix timestamp (in seconds) of when the user joined the
                          channel.
                      role:
                        type: number
                        description: |-
                          The role of the user in the channel:
                          - `0`: Unknown user role.
                          - `1`: User, in a communication channel.
                          - `2`: Host, in a live broadcast channel.
                          - `3`: Audience, in a live broadcast channel.
                      platform:
                        type: number
                        description: >-
                          The platform of the user's device. Common values: `1`:
                          Android, `2`: iOS, `5`: Windows, `6`: Linux, `7`: Web, `8`:
                          macOS, `0`: Others.
              example:
                success: true
                data:
                  join: 1640330382
                  uid: 2845863044
                  in_channel: true
                  platform: 7
                  role: 2
        default:
          description: >-
            The request failed. See the `message` field in the response body for the
            reason. Refer to Response status codes for details.
  /dev/v1/kicking-rule:
    post:
      tags:
        - Ban user privileges
      summary: Create a banning rule
      description: Use this endpoint to create a rule for banning specified user privileges.
      operationId: cma-create-ban-rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appid
                - privileges
              properties:
                appid:
                  type: string
                  description: >-
                    The App ID of the project. You can get it through one of the
                    following methods:

                    - Copy from the [Agora Console](https://console.agora.io)

                    - Call the Get all projects API, and read the value of the
                      `vendor_key` field in the response body.
                cname:
                  type: string
                  description: The channel name.
                uid:
                  type: number
                  description: The user ID. Do not set it to `0`.
                ip:
                  type: string
                  description: The IP address of the user. Do not set it to `0`.
                time:
                  type: number
                  description: >-
                    The time duration (in minutes) to ban the user. Values outside the
                    range [1,1440] are clamped to the nearest bound. Setting this to `0`
                    disables the rule: users are set offline but can rejoin immediately.
                time_in_seconds:
                  type: number
                  description: >-
                    The time duration (in seconds) to ban the user. Values outside the
                    range [10,86430] are clamped to the nearest bound. Setting this to
                    `0` disables the rule: users are set offline but can rejoin
                    immediately.


                    > Use either `time` or `time_in_seconds`, not both. If both are set,
                    `time_in_seconds` takes effect. If neither is set, the default ban
                    duration is 60 minutes (3600 seconds).
                privileges:
                  type: array
                  items:
                    type: string
                  description: >-
                    The user privileges you want to block. Possible values:

                    - `join_channel`: Bans a user from joining a channel or
                      kicks a user out of a channel.

                    - `publish_audio`: Bans a user from publishing audio.

                    - `publish_video`: Bans a user from publishing video.


                    To ban a user from both publishing audio and video, specify both
                    `publish_audio` and `publish_video`.
            example:
              appid: 4855xxxxxxxxxxxxxxxxxxxxxxxxeae2
              cname: channel1
              uid: 589517928
              ip: ''
              time: 60
              privileges:
                - join_channel
      responses:
        '200':
          description: >-
            A `200` status code indicates success. The response body contains the result
            of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of this request. `success` means the request succeeds.
                  id:
                    type: number
                    description: The rule ID. Save the rule ID to update or delete this rule later.
              example:
                status: success
                id: 1953
        default:
          description: >-
            The request failed. See the `message` field in the response body for the
            reason. Refer to Response status codes for details.
    delete:
      tags:
        - Ban user privileges
      summary: Delete a banning rule
      description: Use this endpoint to delete a specified banning rule.
      operationId: cma-delete-ban-rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appid
                - id
              properties:
                appid:
                  type: string
                  description: >-
                    The App ID of the project. You can get it through one of the
                    following methods:

                    - Copy from the [Agora Console](https://console.agora.io)

                    - Call the Get all projects API, and read the value of the
                      `vendor_key` field in the response body.
                id:
                  type: number
                  description: The ID of the rule to delete.
            example:
              appid: 4855xxxxxxxxxxxxxxxxxxxxxxxxeae2
              id: 1953
      responses:
        '200':
          description: >-
            A `200` status code indicates success. The response body contains the result
            of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of this request. `success` means the request succeeds.
                  id:
                    type: number
                    description: The ID of the deleted rule.
              example:
                status: success
                id: 1953
        default:
          description: >-
            The request failed. See the `message` field in the response body for the
            reason. Refer to Response status codes for details.
    get:
      tags:
        - Ban user privileges
      summary: Get the banning rule list
      description: Use this endpoint to get the list of all banning rules.
      operationId: cma-get-ban-rule-list
      parameters:
        - name: appid
          in: query
          required: true
          schema:
            type: string
          description: >-
            The App ID of the project. You can get it through one of the following
            methods:

            - Copy from the [Agora Console](https://console.agora.io)

            - Call the Get all projects API, and read the value of the
              `vendor_key` field in the response body.
      responses:
        '200':
          description: >-
            A `200` status code indicates success. The response body contains the result
            of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of this request. `success` means the request succeeds.
                  rules:
                    type: array
                    description: >-
                      The list of banning rules. Each object in the array represents one
                      banning rule.
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: The rule ID. Required to update or delete the rule.
                        appid:
                          type: string
                          description: The App ID of the project.
                        uid:
                          type: number
                          description: The user ID.
                        opid:
                          type: number
                          description: >-
                            The operation ID, which can be used to track operation
                            records when troubleshooting.
                        cname:
                          type: string
                          description: The channel name.
                        ip:
                          type: string
                          description: The IP address of the user.
                        ts:
                          type: string
                          description: The UTC time when this rule expires.
                        privileges:
                          type: array
                          items:
                            type: string
                          description: >-
                            The banned user privileges. Possible values: `join_channel`,
                            `publish_audio`, `publish_video`.
                        createAt:
                          type: string
                          description: The UTC time when this rule was created.
                        updateAt:
                          type: string
                          description: The UTC time when this rule was last updated.
              example:
                status: success
                rules:
                  - id: 1953
                    appid: 4855xxxxxxxxxxxxxxxxxxxxxxxxeae2
                    uid: 589517928
                    opid: 1406
                    cname: '11'
                    ip: 192.168.0.1
                    ts: 2026-01-09T07:23:06.000Z
                    privileges:
                      - join_channel
                    createAt: 2026-01-09T06:23:06.000Z
                    updateAt: 2026-01-09T14:23:06.000Z
        default:
          description: >-
            The request failed. See the `message` field in the response body for the
            reason. Refer to Response status codes for details.
    put:
      tags:
        - Ban user privileges
      summary: Update the expiration time of a banning rule
      description: Use this endpoint to update the expiration time of a specified banning rule.
      operationId: cma-update-ban-expiration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appid
                - id
              properties:
                appid:
                  type: string
                  description: >-
                    The App ID of the project. You can get it through one of the
                    following methods:

                    - Copy from the [Agora Console](https://console.agora.io)

                    - Call the Get all projects API, and read the value of the
                      `vendor_key` field in the response body.
                id:
                  type: number
                  description: The ID of the rule to update.
                time:
                  type: number
                  description: >-
                    The time duration (in minutes) to ban the user. Values outside the
                    range [1,1440] are clamped to the nearest bound. Setting this to `0`
                    disables the rule: users are set offline but can rejoin immediately.


                    > Use either `time` or `time_in_seconds`, not both. If both are set,
                    `time_in_seconds` takes effect. If neither is set, the default ban
                    duration is 60 minutes (3600 seconds).
                time_in_seconds:
                  type: number
                  description: >-
                    The time duration (in seconds) to ban the user. Values outside the
                    range [10,86430] are clamped to the nearest bound. Setting this to
                    `0` disables the rule: users are set offline but can rejoin
                    immediately.
            example:
              appid: 4855xxxxxxxxxxxxxxxxxxxxxxxxeae2
              id: 1953
              time: 60
      responses:
        '200':
          description: >-
            A `200` status code indicates success. The response body contains the result
            of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of this request. `success` means the request succeeds.
                  result:
                    type: object
                    description: The result of the update.
                    properties:
                      id:
                        type: number
                        description: The rule ID.
                      ts:
                        type: string
                        description: The UTC time when the rule expires.
              example:
                status: success
                result:
                  id: 1953
                  ts: 2026-01-09T08:45:54.545Z
        default:
          description: >-
            The request failed. See the `message` field in the response body for the
            reason. Refer to Response status codes for details.
  /v2/ncs/ip:
    get:
      tags:
        - Message notification service
      summary: Query the IP address
      description: >-
        Use this endpoint to retrieve the IP addresses of the Agora Notifications
        service (NCS) server. If your server is behind a firewall, add these IP
        addresses to your allowlist to receive channel event notifications.


        > Agora occasionally adjusts the NCS IP addresses. Call this endpoint at least
        every 24 hours and automatically update your firewall configuration with the
        latest addresses.
      operationId: cma-query-ip-address
      responses:
        '200':
          description: >-
            A `200` status code indicates success. The response body contains the result
            of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      service:
                        type: object
                        properties:
                          hosts:
                            type: array
                            description: A list of NCS server host objects.
                            items:
                              type: object
                              properties:
                                primaryIP:
                                  type: string
                                  description: >-
                                    The IP address of the NCS server. Add all IP
                                    addresses returned in this field to your firewall
                                    allowlist.
              example:
                data:
                  service:
                    hosts:
                      - primaryIP: xxx.xxx.xxx.xxx
                      - primaryIP: xxx.xxx.xxx.xxx
        default:
          description: >-
            The request failed. See the `message` field in the response body for the
            reason. Refer to Response status codes for details.

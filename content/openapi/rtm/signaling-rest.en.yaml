  /{appid}/rtm/vendor/user_events:
    get:
      summary: Get user events
      description: Retrieves Signaling user login and logout events.
      x-docs-callouts:
        - type: info
          title: Note
          position: after-description
          markdown: >
            Events acquired using this API are removed from the server and cannot be retrieved
            again. The Signaling backend stores a maximum of 2,000 events, replaces the oldest event
            when this limit is exceeded, returns at most 1,000 events per request, and allows up to
            10 requests per second for each App ID.
        - markdown: >-
            Agora does not guarantee event time sequence across geographical regions. Events pulled
            from different regions may contain duplicates since synchronization only occurs within
            regions, not across them.
          position: after-description
          title: Caution
          type: warning
      x-docs-sections:
        - position: after-description
          markdown: >-
            This method retrieves user events from the Agora Signaling server. Events you acquire
            using this API are removed from the server and cannot be retrieved again.


            The Signaling backend stores a maximum of 2,000 events, with the latest event replacing
            the oldest when this limit is exceeded. The backend returns a maximum of 1,000 events
            per request, and the number of requests for each app ID must not exceed 10 per second.
        - title: Request
          position: after-parameters
          markdown: This endpoint does not require any query parameters or a request body.
        - title: Response
          position: before-response-body
          markdown: >
            - If the returned status code is `200`, the request was successful. The response body
            contains the result of the request.

            - If the returned status code is not `200`, the request failed. The response body
            includes the error code and description. Refer to [status
            codes](/en/realtime-media/rtm/reference/error-codes#restful-api-error-codes) to understand the possible reasons
            for failure.
      operationId: get-user-events
      x-codeSamples:
        - lang: bash
          label: curl
          source: >-
            curl -X GET
            'https://api.agora.io/dev/v2/project/876922cbca0098dff4323566daa89675/rtm/vendor/user_events'
            \
                 -H 'Authorization: Basic <your_base64_encoded_credentials>'
        - lang: python
          label: Python
          source: |-
            import requests

               url = 'https://api.agora.io/dev/v2/project/876922cbca0098dff4323566daa89675/rtm/vendor/user_events'

               headers = {
                 'Authorization': 'Basic <your_base64_encoded_credentials>'
               }

               try:
                 response = requests.get(url, headers=headers)
                 print("Status:", response.status_code)
                 print("Response:", response.json())
               except Exception as error:
                 print("Error:", error)
        - lang: javascript
          label: Node.js
          source: |-
            const axios = require('axios');

               const url = 'https://api.agora.io/dev/v2/project/876922cbca0098dff4323566daa89675/rtm/vendor/user_events';

               const headers = {
                 'Authorization': 'Basic <your_base64_encoded_credentials>'
               };

               axios.get(url, { headers })
               .then(response => {
                 console.log("Status:", response.status);
                 console.log("Response:", response.data);
               })
               .catch(error => {
                 console.error("Error:", error.response ? error.response.data : error.message);
               });
      parameters:
        - $ref: "#/components/parameters/appid"
      responses:
        "200":
          description: The request was successful. The response body contains the result of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: The result of this request. `success` if it succeeds, `failed` if it fails.
                  request_id:
                    type: string
                    description: The unique ID of this request.
                  events:
                    type: array
                    description: An array of login and logout events.
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                          description: The corresponding user ID.
                        type:
                          type: string
                          description: >-
                            Event type: `Login` when the user logged in to Signaling, `Logout` when
                            the user logged out.


                            Event type:

                             - Login: The user logged in to Signaling.
                             - Logout: The user logged out of Signaling.
                        ms:
                          type: integer
                          description: >-
                            Number of milliseconds since January 1, 1970 (UTC) to the UTC time when
                            the server receives the message.
              example:
                result: success
                request_id: "10116762670167749259"
                events:
                  - user_id: rtmtest_RTM_4852_4857w7%
                    type: Login
                    ms: 1578027420761
        default:
          description: The request failed. The response body includes the error code and description.

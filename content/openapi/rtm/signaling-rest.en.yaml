openapi: 3.1.0
info:
  version: ""
  title: Signaling RESTful API Overview
  description: >-
    The Signaling REST APIs provide server-side messaging capabilities that complement the Signaling
    SDK. Send messages to users and channels, retrieve conversation history, and track user events
    from your backend without requiring recipients to be actively connected.

    ## API basics

    All requests are sent to the host `api.agora.io`.

    - **Authentication**: All APIs require Basic Auth for authentication.

    - **Request**: Refer to the respective API examples.

    - **Response**: The response content is in JSON format.

    - **Base URL**: `https://api.agora.io/dev/v2/project/<appid>`, where `<appid>` is the Agora app
    ID for your project.
  x-docs-callouts:
    - type: info
      title: Note
      position: after-description
      markdown: |
        - All the request URLs and request bodies are case-sensitive.

        - For each app ID, the maximum combined frequency of the peer-to-peer
        message and channel message APIs is 500 calls per second.
servers:
  - url: https://api.agora.io/dev/v2/project
    description: Base host for messaging and event APIs.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: All Signaling REST APIs require Basic Auth for authentication.
  parameters:
    appid:
      name: appid
      in: path
      required: true
      schema:
        type: string
      description: The App ID of your Agora project.
security:
  - basicAuth: []
paths:
  /{appid}/rtm/users/{user_id}/peer_messages:
    post:
      summary: Send peer-to-peer message
      description: Sends a peer-to-peer Signaling message from the server.
      x-docs-sections:
        - position: after-description
          markdown: >-
            Sends a peer-to-peer message from the server. The user sending the message does not have
            to log in to Signaling.


            - You can send peer-to-peer or channel messages with any user ID when using basic HTTP
            authentication.

            - When you use token authentication, you may send peer-to-peer or channel messages using
            only the user ID you used to generate the Signaling token.


            For more information about how to generate a Signaling token, see [Secure authentication
            with tokens](/en/realtime-media/rtm/build/connect-and-authenticate/authentication-workflow).
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body
            contains the result of the request.


            - If the returned status code is not `200`, the request failed. The response body
            includes the error code and description. Refer to [status
            codes](/en/realtime-media/rtm/reference/error-codes#restful-api-error-codes) to understand the possible reasons for
            failure.
        - markdown: >-
            For more information about how to generate a Signaling token, see Secure authentication
            with tokens.
          position: after-parameters
          title: Request
      operationId: send-peer-message
      x-codeSamples:
        - lang: bash
          label: curl
          source: >-
            curl -X POST
            'https://api.agora.io/dev/v2/project/876922cbca0098dff4323566daa89675/rtm/users/userA/peer_messages?wait_for_ack=true'
            \
                  -H 'Content-Type: application/json;charset=utf-8' \
                  -H 'Authorization: Basic <your_base64_encoded_credentials>' \
                  -d '{
                    "destination": "userB",
                    "enable_offline_messaging": false,
                    "enable_historical_messaging": false,
                    "payload": "Hello"
                  }'
        - lang: python
          label: Python
          source: |-
            import requests
                import json

                url = 'https://api.agora.io/dev/v2/project/876922cbca0098dff4323566daa89675/rtm/users/userA/peer_messages?wait_for_ack=true'

                headers = {
                  'Content-Type': 'application/json;charset=utf-8',
                  'Authorization': 'Basic <your_base64_encoded_credentials>'
                }

                data = {
                  "destination": "userB",
                  "enable_offline_messaging": False,
                  "enable_historical_messaging": False,
                  "payload": "Hello"
                }

                try:
                  response = requests.post(url, headers=headers, data=json.dumps(data))
                  print("Status:", response.status_code)
                  print("Response:", response.json())
                except Exception as error:
                  print("Error:", error)
        - lang: javascript
          label: Node.js
          source: |-
            const axios = require('axios');

                const url = 'https://api.agora.io/dev/v2/project/876922cbca0098dff4323566daa89675/rtm/users/userA/peer_messages?wait_for_ack=true';

                const headers = {
                'Content-Type': 'application/json;charset=utf-8',
                'Authorization': 'Basic <your_base64_encoded_credentials>'
                };

                const data = {
                destination: "userB",
                enable_offline_messaging: false,
                enable_historical_messaging: false,
                payload: "Hello"
                };

                axios.post(url, data, { headers })
                .then(response => {
                  console.log("Status:", response.status);
                  console.log("Response:", response.data);
                })
                .catch(error => {
                  console.error("Error:", error.response ? error.response.data : error.message);
                });
      parameters:
        - $ref: "#/components/parameters/appid"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: |-
            Signaling user ID to send a peer-to-peer message. It must not exceed 64 characters in length or be an empty string. This parameter supports the following characters:

            - All lowercase English letters: `a-z`.
            - All uppercase English letters: `A-Z`.
            - All numeric characters: `0-9`.
            - The space character. (Not recommended): If the user ID contains a space, then the user ID cannot communicate with the Signaling SDK.
            - Punctuation characters and other symbols, including: `!`, `#`, `$`, `%`, `&`, `(`, `)`, `+`, `-`, `:`, `;`, `<`, `=`, `.`, `>`, `?`, `@`, `[`, `]`, `^`, `_`, `{`, `}`, `|`, `~`, `,`, `'`.
          x-docs-callouts:
            - type: info
              title: Note
              markdown: >
                Since `user_id` is a URL parameter, the first character and the last characters must
                not be a space.
        - name: wait_for_ack
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Whether the API returns the HTTP response after Signaling receives the acknowledgement
            from the receiver.


            - `true`: The API waits for the receiver to acknowledge receipt of
              the message before returning the HTTP response.

            - `false`: The API returns the HTTP response immediately after the
              Agora RTM server receives the message, without waiting for
              receiver acknowledgement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destination
                - payload
              properties:
                destination:
                  type: string
                  description: |-
                    Signaling user ID to receive a peer-to-peer message. It must not exceed 64 characters in length or be an empty string. This parameter supports the following characters:

                    - All lowercase English letters: `a-z`.
                    - All uppercase English letters: `A-Z`.
                    - All numeric characters: `0-9`.
                    - The space character. (Not recommended): If the user ID contains a space, then the user ID cannot communicate with the Signaling SDK.
                    - Punctuation characters and other symbols, including: `!`, `#`, `$`, `%`, `&`, `(`, `)`, `+`, `-`, `:`, `;`, `<`, `=`, `.`, `>`, `?`, `@`, `[`, `]`, `^`, `_`, `{`, `}`, `|`, `~`, `,`, `'`.
                enable_offline_messaging:
                  type: boolean
                  default: false
                  description: >-
                    Whether to enable offline messages.

                    - `true`: Enable offline messages. If the receiver is offline when you send a
                    peer-to-peer message, Signaling saves the message (maximum 200 per receiver) and
                    delivers it when the receiver is online.

                    - `false`: Disable offline messages.
                  x-docs-callouts:
                    - type: warning
                      title: Caution
                      position: after-description
                      markdown: >
                        The offline message feature is deprecated and will be removed in a future
                        version. Agora recommends that you do not use it.
                enable_historical_messaging:
                  type: boolean
                  default: false
                  description: |-
                    Whether to save as a historical message.

                    - `true`: Save as a historical message.
                    - `false`: Do not save as a historical message.
                payload:
                  type: string
                  description: >-
                    Content of the peer-to-peer message. It must not be an empty string or exceed 32
                    KB in length.
            example:
              destination: userB
              enable_offline_messaging: false
              enable_historical_messaging: false
              payload: Hello
      responses:
        "200":
          description: The request was successful. The response body contains the result of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: |-
                      Request result. `success` if the request succeeds, `failed` if it fails.

                      Request result.

                       - success: The request succeeds.
                       - failed: The request fails.
                  request_id:
                    type: string
                    description: Unique ID to identify this request.
                  code:
                    type: string
                    description: |-
                      Message status: `message_sent`, `message_delivered`, or `message_offline`.

                      Message status.

                       - message_sent: The message is sent.
                       - message_delivered: The message is received.
                       - message_offline: The receiver is offline.
              example:
                result: success
                request_id: "123"
                code: message_sent
        default:
          description: The request failed. The response body includes the error code and description.

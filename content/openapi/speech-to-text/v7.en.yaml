openapi: 3.1.0
x-stoplight:
  id: v54qxj1s68u71
info:
  title: Speech-to-Text REST API
  version: 7.x
  description: >-
    Agora provides the Real-Time STT REST API for real-time transcription, translation, and caption
    recording.
  summary: This page introduces the basic information of the Real-Time STT server-side REST API.
servers:
  - url: https://api.agora.io
    description: ""
paths:
  /api/speech-to-text/v1/projects/{appid}/join:
    post:
      tags:
        - Speech-to-Text
      summary: Start a Real-time STT agent
      description: Starts subtitle recording and translation.
      x-docs-sections:
        - position: after-description
          markdown: Use this method to start subtitle recording and subtitle translation.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body
            contains the result of the request.
        - markdown: Refer to the detail and reason fields to understand the possible reasons for failure.
          position: after-response-body
          title: Response
      operationId: join
      parameters:
        - $ref: "#/components/parameters/appid"
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
            examples:
              fullExample:
                value:
                  languages:
                    - en-US
                  keywords:
                    - Agora
                    - STT
                  name: agora-test
                  maxIdleTime: 50
                  rtcConfig:
                    channelName: agora-test
                    pubBotUid: "88222"
                  translateConfig:
                    languages:
                      - source: en-US
                        target:
                          - ar-SA
                          - id-ID
                          - fr-FR
                          - ja-JP
                  captionConfig:
                    sliceDuration: 60
                    storage:
                      accessKey: test-oss
                      secretKey: test-oss
                      bucket: test-oss
                      vendor: 2
                      region: 3
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
              examples:
                Example 1:
                  value:
                    agent_id: Agent ID.
                    create_ts: null
                    status: RUNNING
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Example 1:
                  value:
                    detail: Details of the request failure.
                    reason: The reason why the request failed.
      x-stoplight:
        id: 8cszmljwg1pj9
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request POST \
              --url https://api.agora.io/api/speech-to-text/v1/projects/:appid/join \
              --header 'Authorization: Basic <credentials>' \
              --data '{
              "languages": [
                "en-US"
              ],
              "keywords": [
                "Agora",
                "STT"
              ],
              "name": "agora-test",
              "maxIdleTime": 50,
              "rtcConfig": {
                "channelName": "agora-test",
                "pubBotUid": "88222"
              },
              "translateConfig": {
                "languages": [
                  {
                    "source": "en-US",
                    "target": [
                      "ar-SA",
                      "id-ID",
                      "fr-FR",
                      "ja-JP"
                    ]
                  }
                ]
              },
              "captionConfig": {
                "sliceDuration": 60,
                "storage": {
                  "accessKey": "test-oss",
                  "secretKey": "test-oss",
                  "bucket": "test-oss",
                  "vendor": 2,
                  "region": 3
                }
              }
            }'
        - lang: python
          label: Python
          source: |-
            import requests

            url = "https://api.agora.io/api/speech-to-text/v1/projects/:appid/join"

            payload = {
                "languages": ["en-US"],
                "keywords": ["Agora","STT"],
                "name": "agora-test",
                "maxIdleTime": 50,
                "rtcConfig": {
                    "channelName": "agora-test",
                    "pubBotUid": "88222"
                },
                "translateConfig": {
                    "languages": [
                        {
                            "source": "en-US",
                            "target": ["ar-SA", "id-ID", "fr-FR", "ja-JP"]
                        }
                    ]
                },
                "captionConfig": {
                    "sliceDuration": 60,
                    "storage": {
                        "accessKey": "test-oss",
                        "secretKey": "test-oss",
                        "bucket": "test-oss",
                        "vendor": 2,
                        "region": 3
                    }
                }
            }
            headers = {"Authorization": "Basic <credentials>"}

            response = requests.request("POST", url, json=payload, headers=headers)

            print(response.text)
        - lang: javascript
          label: Node.js
          source: |-
            const url = 'https://api.agora.io/api/speech-to-text/v1/projects/:appid/join';
            const options = {
              method: 'POST',
              headers: {Authorization: 'Basic <credentials>'},
              body: JSON.stringify({
                languages: ['en-US'],
                keywords: ['Agora','STT'],
                name: 'agora-test',
                maxIdleTime: 50,
                rtcConfig: {channelName: 'agora-test', pubBotUid: '88222'},
                translateConfig: {
                  languages: [{source: 'en-US', target: ['ar-SA', 'id-ID', 'fr-FR', 'ja-JP']}]
                },
                captionConfig: {
                  sliceDuration: 60,
                  storage: {
                    accessKey: 'test-oss',
                    secretKey: 'test-oss',
                    bucket: 'test-oss',
                    vendor: 2,
                    region: 3
                  }
                }
              })
            };

            fetch(url, options)
              .then(res => res.json())
              .then(json => console.log(json))
              .catch(err => console.error(err));
  /api/speech-to-text/v1/projects/{appid}/agents/{agentId}:
    get:
      tags:
        - Speech-to-Text
      summary: Query the task status
      description: Queries the status of a Real-time STT task.
      x-docs-sections:
        - position: after-description
          markdown: Use this method to query the status of a Real-time STT task.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body
            contains the result of the request.
        - markdown: Refer to message and code fields to understand the possible reasons for failure.
          position: after-response-body
          title: Response
      operationId: query
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/appid"
        - $ref: "#/components/parameters/agentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusResponse"
              examples:
                Example 1:
                  value:
                    message: Details of the request result.
                    agent_id: Agent ID.
                    create_ts: null
                    status: RUNNING
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentErrorResponse"
              examples:
                Example 1:
                  value:
                    message: Details of the failed request.
                    agent_id: Agent ID.
                    create_ts: null
                    status: FAILED
      x-stoplight:
        id: q5zhmt9clu0jy
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request GET \
              --url https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents/:agentId \
              --header 'Authorization: Basic <credentials>'
        - lang: python
          label: Python
          source: |-
            import requests

            url = "https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents/:agentId"

            headers = {"Authorization": "Basic <credentials>"}

            response = requests.request("GET", url, headers=headers)

            print(response.text)
        - lang: javascript
          label: Node.js
          source: >-
            const url =
            'https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents/:agentId';

            const options = {method: 'GET', headers: {Authorization: 'Basic <credentials>'}};


            fetch(url, options)
              .then(res => res.json())
              .then(json => console.log(json))
              .catch(err => console.error(err));
  /api/speech-to-text/v1/projects/{appid}/agents/{agentId}/leave:
    post:
      tags:
        - Speech-to-Text
      summary: Stop a Real-time STT agent
      description: Stops a Real-time STT task and leaves the channel.
      x-docs-sections:
        - position: after-description
          markdown: Use this method to leave the channel and stop Real-time STT.
        - title: Response
          position: before-response-body
          markdown: |-
            - If the returned status code is `200`, the request was successful.

            - If the returned status code is not `200`, the request failed.
      operationId: leave
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/appid"
        - $ref: "#/components/parameters/agentId"
      responses:
        "200":
          description: OK
        default:
          description: Error response.
      x-stoplight:
        id: n1q3bmienpsha
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request POST \
              --url https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents/:agentId/leave \
              --header 'Authorization: Basic <credentials>'
        - lang: python
          label: Python
          source: |-
            import requests

            url = "https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents/:agentId/leave"

            headers = {"Authorization": "Basic <credentials>"}

            response = requests.request("POST", url, headers=headers)

            print(response.text)
        - lang: javascript
          label: Node.js
          source: >-
            const url =
            'https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents/:agentId/leave';

            const options = {method: 'POST', headers: {Authorization: 'Basic <credentials>'}};


            fetch(url, options)
              .then(res => res.json())
              .then(json => console.log(json))
              .catch(err => console.error(err));
  /api/speech-to-text/v1/projects/{appid}/agents/{agentId}/update:
    post:
      tags:
        - Speech-to-Text
      summary: Update task configuration
      description: Updates the configuration of a Real-time STT task.
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this method to update the configuration of a Real-time STT task. Updating the
            transcription languages, translation languages, or subscribed users does not reset the
            idle-timeout timer or the maximum task lifetime timer. Both timers start from the
            moment the task was created.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body
            contains the result of the request.
        - markdown: Refer to the detail and reason fields to understand the possible reasons for failure.
          position: after-response-body
          title: Response
      operationId: update
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/appid"
        - $ref: "#/components/parameters/agentId"
        - name: sequenceId
          in: query
          required: true
          deprecated: true
          schema:
            type: integer
            format: int64
          description: >-
            The sequence number of `update` requests. The integer value must be greater than or
            equal to 0. Ensure that the `sequenceId` of the next `update` request is greater than
            the value you specified for the previous request. The parameter ensures that Agora
            updates the transcription task according to the latest configuration you specified.
        - name: updateMask
          in: query
          required: true
          deprecated: true
          schema:
            type: string
          description: >-
            The specified update configuration item. To update multiple fields, use a comma
            separator. For example:
            `updateMask=languages,rtcConfig.subscribeAudioUids,translateConfig.enable,translateConfig.languages`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
              examples:
                Example 1:
                  value:
                    agent_id: Agent ID.
                    create_ts: null
                    status: RUNNING
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Example 1:
                  value:
                    detail: Details of the request failure.
                    reason: The reason why the request failed.
      x-stoplight:
        id: 22wvkg0m89suu
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request POST \
              --url 'https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents/:agentid/update?sequenceId=1&updateMask=translateConfig.enable,translateConfig.languages' \
              --header 'Authorization: Basic <credentials>' \
              --data '{
              "translateConfig": {
                "enable": true,
                "languages": [
                  {
                    "source": "en-US",
                    "target": ["ja-JP"]
                  }
                ]
              }
            }'
        - lang: python
          label: Python
          source: >-
            import requests


            url =
            "https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents/:agentid/update"

            params = {
                "sequenceId": 1,
                "updateMask": "translateConfig.enable,translateConfig.languages"
            }

            payload = {
                "translateConfig": {
                    "enable": True,
                    "languages": [
                        {
                            "source": "en-US",
                            "target": ["ja-JP"]
                        }
                    ]
                }
            }

            headers = {"Authorization": "Basic <credentials>"}


            response = requests.request("POST", url, params=params, json=payload, headers=headers)

            print(response.text)
        - lang: javascript
          label: Node.js
          source: >-
            const url =
            'https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents/:agentid/update?sequenceId=1&updateMask=translateConfig.enable,translateConfig.languages';

            const options = {
              method: 'POST',
              headers: {Authorization: 'Basic <credentials>'},
              body: JSON.stringify({
                translateConfig: {
                  enable: true,
                  languages: [
                    {
                      source: 'en-US',
                      target: ['ja-JP']
                    }
                  ]
                }
              })
            };


            fetch(url, options)
              .then(res => res.json())
              .then(json => console.log(json))
              .catch(err => console.error(err));
  /api/speech-to-text/v1/projects/{appid}/agents:
    get:
      tags:
        - Speech-to-Text
      summary: List Real-time STT agents
      description: Retrieves Real-time STT agents that match specified criteria.
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this method to retrieve a list of real-time transcription and translation agents
            that match specified criteria.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body
            contains the result of the request.
        - markdown: Refer to the detail and reason fields to understand the possible reasons for failure.
          position: after-response-body
          title: Response
      operationId: list
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/appid"
        - name: channel
          in: query
          description: Filters the agent list by channel name.
          schema:
            type: string
            examples:
              - TEST
        - name: from_time
          in: query
          description: >-
            The start of the query time range, as a Unix timestamp in seconds. Defaults to `1 day
            ago`.
          schema:
            type: integer
            examples:
              - 1733013296
        - name: to_time
          in: query
          description: >-
            The end of the query time range, as a Unix timestamp in seconds. Defaults to the current
            time.
          schema:
            type: integer
            examples:
              - 1734016896
        - name: state
          in: query
          description: |-
            Filters agents by status. Only one status value can be specified per request:
            - `0` - `IDLE`: The agent is not initialized.
            - `1` - `STARTING`: The agent is starting.
            - `2` - `RUNNING`: The agent is running.
            - `3` - `STOPPING`: The agent is exiting.
            - `4` - `STOPPED`: The agent exited successfully.
            - `5` - `RECOVERING`: The agent is recovering.
            - `6` - `FAILED`: The agent exited with a failure.
          schema:
            type: string
            default: "2"
            examples:
              - "1"
        - name: limit
          in: query
          description: The maximum number of agents to return per page.
          schema:
            type: integer
            default: 20
            examples:
              - 20
        - name: cursor
          in: query
          description: >-
            The pagination cursor. Set this to the `agent_id` of the last item from the previous
            page to retrieve the next page of results.
          schema:
            type: string
            examples:
              - agent_id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
              examples:
                Example 1:
                  value:
                    data:
                      count: 1
                      list:
                        - start_ts: 1735035893
                          status: RUNNING
                          agent_id: 1NT29X11GQSxxxxx80BEIN56XF
                    meta:
                      cursor: ""
                      total: 1
                    status: ok
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Example 1:
                  value:
                    detail: Details of the request failure.
                    reason: The reason why the request failed.
      x-stoplight:
        id: 0ar5tao1h52r0
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request GET \
              --url 'https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents?state=2&limit=20' \
              --header 'Authorization: Basic <credentials>'
        - lang: python
          label: Python
          source: |-
            import requests

            url = "https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents"

            params = {
                "state": 2,
                "limit": 20
            }
            headers = {"Authorization": "Basic <credentials>"}

            response = requests.request("GET", url, headers=headers, params=params)

            print(response.text)
        - lang: javascript
          label: Node.js
          source: >-
            const url =
            'https://api.agora.io/api/speech-to-text/v1/projects/:appid/agents?state=2&limit=20';

            const options = {
              method: 'GET',
              headers: {Authorization: 'Basic <credentials>'}
            };


            fetch(url, options)
              .then(res => res.json())
              .then(json => console.log(json))
              .catch(err => console.error(err));
components:
  parameters:
    appid:
      name: appid
      in: path
      required: true
      schema:
        type: string
      description: The App ID of the project.
    agentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
      description: The unique identifier of the agent you received in the response body of the `join` method.
  schemas:
    JoinRequest:
      type: object
      x-stoplight:
        id: 36ei71ylbtt9v
      required:
        - languages
        - rtcConfig
        - name
      properties:
        languages:
          type: array
          description: >-
            The transcription languages you want to recognize. You can specify up to four languages.
            For a complete list, see [Supported
            languages](/en/realtime-media/speech-to-text/reference/supported-languages). Choosing
            multiple transcription languages can affect both quality and cost. For best practices,
            see [Optimize transcription quality and
            cost](/en/realtime-media/speech-to-text/build/extend-and-optimize/optimize-quality).
          maxItems: 4
          items:
            type: string
        uidLanguagesConfig:
          type: array
          description: >-
            Configure the transcription language for the specified user ID. Supports up to 5
            configuration items.
          maxItems: 5
          items:
            $ref: "#/components/schemas/UidLanguagesConfig"
        maxIdleTime:
          type: integer
          description: >-
            Maximum channel idle time, in seconds. Value range: [0,259200]. Set `maxIdleTime` to
            `0` to disable automatic termination due to idle time. When the specified time is
            exceeded, the task ends automatically. Idle time means that there is no host in a live
            broadcast channel, or there is no user in a communication channel.


            Independent of `maxIdleTime`, every task also has a maximum lifetime of 72 hours
            (259200 seconds). Once a task reaches this limit, Agora terminates it, even if
            `maxIdleTime` is `0`.
          minimum: 0
          maximum: 259200
          default: 30
        rtcConfig:
          $ref: "#/components/schemas/RtcConfig"
        translateConfig:
          $ref: "#/components/schemas/TranslateConfig"
        captionConfig:
          $ref: "#/components/schemas/CaptionConfig"
        extensionParams:
          $ref: "#/components/schemas/CaptionExtensionParams"
        keywords:
          type: array
          description: >-
            Keyword list. Use it to improve the recognition accuracy of specific words during
            transcription. Supports up to 500 words.
          maxItems: 500
          items:
            type: string
        name:
          type: string
          description: >-
            Unique ID of the agent. Maximum length is 64 characters. You cannot use the same ID
            repeatedly.
          maxLength: 64
    UidLanguagesConfig:
      type: object
      required:
        - uid
        - languages
      properties:
        uid:
          type: string
          description: >-
            The ID of the user to be transcribed. You may configure a maximum of 5 uids for language
            recognition at the uid level.
        languages:
          type: array
          items:
            type: string
          description: >-
            The transcription languages to recognize. Each uid can support a maximum of 4 languages.
            Refer to [Supported
            Languages](/en/realtime-media/speech-to-text/reference/supported-languages) for details.
          maxItems: 4
      x-stoplight:
        id: 0i2gh4n8s058x
      description: >-
        Configure the transcription language for the specified user ID. Supports up to 5
        configuration items.
    RtcConfig:
      type: object
      description: >-
        Real-time subtitle configuration. After a user's voice is converted to text, the information
        is pushed to the channel as subtitles to match the UI real-time display.
      x-stoplight:
        id: b7wlo0hwvbigp
      required:
        - channelName
        - pubBotUid
      properties:
        channelName:
          type: string
          description: The name of the channel to transcribe.
        subBotUid:
          type: string
          deprecated: true
          description: >-
            The ID of the bot that subscribes to the audio stream. This is always identical to the
            value of the `pubBotUid`.
        subBotToken:
          type: string
          deprecated: true
          description: >-
            The token used by the subscribing bot for channel authentication. Required only when
            your project has [App
            Certificate](/en/realtime-media/video/core-concepts#app-certificate) enabled. Generate
            this token on your token server. For details, see [Token
            authentication](/en/realtime-media/video/build/authenticate-users/deploy-token-server).
        pubBotUid:
          type: string
          description: >-
            The ID of the bot that pushes subtitle information to the channel. All UIDs within a
            channel must be unique. Ensure no other user or service bot is using this UID in the
            same channel.
        pubBotToken:
          type: string
          description: >-
            The token used by the subtitle-pushing bot for channel authentication. Required only
            when your project has [App
            Certificate](/en/realtime-media/video/core-concepts#app-certificate) enabled. Generate
            this token on your token server. For details, see [Token
            authentication](/en/realtime-media/video/build/authenticate-users/deploy-token-server).
        subscribeAudioUids:
          type: array
          description: >-
            The user IDs for the audio streams you want to subscribe. Set this parameter if you need
            to subscribe to the audio stream of certain users. Maximum array length: 32. You can set
            either `subscribeAudioUids` or `unSubscribeAudioUids`.
          maxItems: 32
          items:
            type: string
        unSubscribeAudioUids:
          type: array
          description: >-
            The user IDs for the audio streams you **do not** want to subscribe. Set this parameter
            if you don't need to subscribe to the audio stream of certain users. Maximum array
            length: 5. You can set either `subscribeAudioUids` or `unSubscribeAudioUids`.
          maxItems: 5
          items:
            type: string
        cryptionMode:
          type: integer
          deprecated: true
          description: >-
            The encryption and decryption mode. When enabled, this mode is used for both decrypting
            incoming streams and encrypting outgoing subtitles.

            - `0`: No encryption

            - `1`: `AES_128_XTS` 128-bit AES encryption, XTS mode

            - `2`: `AES_128_ECB` 128-bit AES encryption, ECB mode

            - `3`: `AES_256_XTS` 256-bit AES encryption, XTS mode

            - `4`: `SM4_128_ECB` 128-bit SM4 encryption, ECB mode

            - `5`: `AES_128_GCM` 128-bit AES encryption, GCM mode

            - `6`: `AES_256_GCM` 256-bit AES encryption, GCM mode


          description: |-
            服务的状态：
            - `STARTING`：服务开始启动。
            - `RUNNING`：服务进行中。
            - `STOPPING`：服务退出中。
            - `STOPPED`：服务退出成功。
            - `RECOVERING`：服务恢复中。
            - `FAILED`：服务退出失败。
    ErrorResponse:

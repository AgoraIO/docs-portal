                                the silent state (`IDLE`) before exiting the channel. After this time is exceeded, the
                                agent will exit the channel immediately even if it is not in the silent state. This
                                field only takes effect when `graceful_enabled` is `true`, and the value range is
                                [0,120].
                              default: 30
                        data_channel:
                          type: string
                          description: "Agent data transmission channel, optional following values:\r\n- `rtm`: Use RTM transport. This configuration only takes effect when `advanced_features.enable_rtm` is `true`. \r\n- `datastream`: (Default) Use RTC's [`DataStream`](https://doc.shengwang.cn/api-ref/rtc/android/API/toc_datastream#callback_irtcengineeventhandler_onstreammessage) transmission."
                        enable_metrics:

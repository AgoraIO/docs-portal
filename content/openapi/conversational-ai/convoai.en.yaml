                                configuration according to `mode`.
                    parameters:
                      type: object
                      description: Agent parameter configuration.
                      properties:
                        silence_config:
                          type: object
                          description: Agent silent settings.
                          properties:
                            timeout_ms:
                              type: integer
                              description: "The maximum silent time of the agent (ms), the value range is [0,60000]. After the agent is successfully created and the user joins the channel, the duration during which the agent is not listening, thinking or speaking is called the agent silent time. After the silent time reaches the set value, the agent will broadcast a silent prompt message. This feature can be used to have the agent remind the user when they are inactive.\r\n- Set to `0` (default): disables this feature.\r\n- When set to `(0,60000]`, `content` must be set at the same time to properly broadcast the silent prompt, otherwise the setting is invalid."
                            action:
                              type: string
                              description: "After the silent time reaches the set value, the behavior taken by the agent can be set to the following values:\r\n- `\"speak\"`: (default) uses the TTS module to speak the silent prompt content (`content`).\r\n- `\"think\"`: Append the silent prompt content (`content`) to the end of the context and pass it to LLM."
                            content:
                              type: string
                              description: >-
                                The content of the silent prompt message. The content of the settings will be used in
                                different ways depending on the settings in `action`.
                        farewell_config:

  /v2/projects/{appid}/agents:
    get:
      summary: Retrieve a list of agents
      operationId: get-agent-list
      description: |-
        Retrieve a list of agents that match specified criteria.
        > This interface only supports querying the list of agents created within the last 7 days.
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/appid"
        - name: channel
          in: query
          description: Query the list of agents under the specified channel name.
          schema:
            type: string
            examples:
              - TEST
        - name: from_time
          in: query
          description: Query list start timestamp (s), default is 1 day ago.
          schema:
            type: integer
            examples:
              - 1733013296
        - name: to_time
          in: query
          description: Query list end timestamp (s), default is the current time.
          schema:
            type: integer
            examples:
              - 1734016896
        - name: state
          in: query
          description: >-
            Specify the status of the agent to be queried. A single query does not support specifying multiple states:
            <li>`IDLE` (0): Agent in idle state. </li><li>`STARTING` (1): The agent being started. </li><li>`RUNNING`
            (2): Running agent. </li><li>`STOPPING` (3): Stopping agent. </li><li>`STOPPED` (4): Agent that has
            completed exit. </li><li>`RECOVERING` (5): The recovering agent. </li><li>`FAILED` (6): Agent that failed to
            execute. </li>
          schema:
            type: string
            default: "2"
            examples:
              - "1"
        - name: limit
          in: query
          description: Paginate to obtain the maximum number of items returned at a time.
          schema:
            type: integer
            default: 20
            examples:
              - 20
        - name: cursor
          in: query
          description: The paging cursor is the `agent_id` of the starting position of paging.
          schema:
            type: string
            examples:
              - agent_id
      responses:
        "200":
          description: "- If the returned status code is `200`, the request is successful. The response body contains the results of this request.\r\n- If the returned status code is not `200`, it means the request failed. The response package body contains the error category and description. You can refer to [Response Status Code](https://doc.shengwang.cn/doc/convoai/restful/api/response-code) to learn about possible causes."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: The number of agents returned this time.
                      list:
                        type: array
                        description: List of agents that meet the conditions.
                        items:
                          type: object
                          properties:
                            start_ts:
                              type: integer
                              description: Agent creation timestamp.
                            status:
                              type: string
                              description: "Agent running status:\r\n- `IDLE` (0): Agent in idle state.\r\n- `STARTING` (1): The agent being started.\r\n- `RUNNING` (2): The running agent.\r\n- `STOPPING` (3): Stopping agent.\r\n- `STOPPED` (4): Agent that has finished exiting.\r\n- `RECOVERING` (5): The recovering agent.\r\n- `FAILED` (6): Agent that failed to execute."
                            agent_id:
                              type: string
                              description: The unique identifier of the agent.
                  meta:
                    type: object
                    description: Returns the meta information of the list.
                    properties:
                      cursor:
                        type: string
                        description: Pagination cursor.
                      total:
                        type: integer
                        description: The total number of agents that meet the query conditions.
                  status:
                    type: string
                    description: Request status.
              examples:
                Example 1:
                  value:
                    data:
                      count: 1
                      list:
                        - start_ts: 1735035893
                          status: RUNNING
                          agent_id: 1NT29X11GQSxxxxx80BEIN56XF
                    meta:
                      cursor: ""
                      total: 1
                    status: ok
      servers:
        - url: https://api.agora.io/cn/api/conversational-ai-agent
          description: ""
  /v2/projects/{appid}/agents/{agentId}/speak:
    parameters:
      - $ref: "#/components/parameters/Authorization"
      - $ref: "#/components/parameters/appid"
      - $ref: "#/components/parameters/agentId"
    post:
      summary: Broadcast a message using TTS
      responses:
        "200":
          description: "- If the returned status code is `200`, the request is successful. The response packet body is agent information, and the agent starts broadcasting the specified content.\r\n- If the returned status code is not `200`, it means the request failed. The response package body contains the error category and description. You can refer to [Response Status Code](https://doc.shengwang.cn/doc/convoai/restful/api/response-code) to learn about possible causes."
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    agent_id: 1NT29X10YHxxxxxWJOXLYHNYB
                    channel: test_channel
                    start_ts: "178444582"
                properties:
                  agent_id:
                    $ref: "#/components/schemas/agent_id"
                  channel:
                    $ref: "#/components/schemas/channel"
                  start_ts:
                    $ref: "#/components/schemas/start_ts"
              examples:
                Example 1:
                  value:
                    agent_id: 1NT29XxxxxxxxxELWEHC8OS
                    channel: test_channel
                    start_ts: 1744877089
      operationId: agent-speak
      description: "Let the specified agent broadcast a custom message.\r\n\r\nDuring the conversation with the agent, calling this interface allows the agent to use the TTS module to immediately broadcast a custom message. After the agent receives the request, the broadcast behavior will interrupt the current speaking and thinking process."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: The text content to be broadcast must not exceed 512 bytes.
                priority:
                  type: string
                  description: >-
                    The priority of the reporting behavior can be set to the following values:

                    - `"INTERRUPT"`: (Default) High priority, interrupt and broadcast. The agent will terminate the
                    current interaction and directly broadcast the message.

                    - `"APPEND"`: Medium priority, additional broadcast. The agent will announce the message after the
                    current interaction ends.

                    - `"IGNORE"`: low priority, broadcast when idle. If the agent is interacting at this time, the agent
                    will directly ignore and discard the message to be broadcast; the message will be broadcast only
                    when the agent is not interacting.
                interruptable:
                  type: boolean
                  description: "Whether to allow the user to interrupt the agent's broadcast by speaking:\r\n- `true`: (default) allowed.\r\n- `false`: not allowed."
                  default: true
            examples:
              Example 1:
                value:
                  text: Sorry, the conversation content does not comply with the policy.
                  priority: INTERRUPT
                  interruptable: false
  /v2/projects/{appid}/agents/{agentId}/interrupt:
    parameters:
      - $ref: "#/components/parameters/Authorization"
      - $ref: "#/components/parameters/appid"
      - $ref: "#/components/parameters/agentId"
    post:
      summary: Interrupt the agent
      responses:
        default:
          description: "- If the returned status code is `200`, the request is successful. The response packet body is agent information, and the agent starts broadcasting the specified content.\r\n- If the returned status code is not `200`, it means the request failed. The response package body contains the error category and description. You can refer to [Response Status Code](https://doc.shengwang.cn/doc/convoai/restful/api/response-code) to learn about possible causes."
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    $ref: "#/components/schemas/agent_id"
                  channel:
                    $ref: "#/components/schemas/channel"
                  start_ts:
                    $ref: "#/components/schemas/start_ts"
              examples:
                Example 1:
                  value:
                    agent_id: 1NT29XxxxxxxxxELWEHC8OS
                    channel: test_channel
                    start_ts: 1744877089
      operationId: agent-interrupt
      description: Interrupt the specified agent from speaking or thinking.
      requestBody:
        description: The request body is empty.
        content:
          application/json:
            schema:
              type: object
              properties: {}
            examples:
              Example 1:
                value: {}
  /v2/projects/{appid}/agents/{agentId}/think:
    parameters:
      - $ref: "#/components/parameters/Authorization"
      - $ref: "#/components/parameters/appid"
      - $ref: "#/components/parameters/agentId"
    post:
      summary: Send a custom instruction
      operationId: agent-think
      description: >-
        Send a custom text command to the specified agent.


        The interface will inject incoming text as user input into the current conversation link, and the conversational
        AI engine will continue to reason and respond according to the processing logic of ordinary user input. You can
        use this interface to implement scenarios such as implicit command injection, client-side event triggering, and
        voice and text collaboration.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: >-
                    Customize the text content of the command. This will be injected into the current conversation link
                    as user input.
                on_listening_action:
                  type: string
                  description: >-
                    The processing action when the agent is in the listening state, supports the following values:

                    - `"inject"`: (Default) Custom text command is injected into the current round without interrupting
                    the current round.

                    - `"ignore"`: Ignore this request.
                on_thinking_action:
                  type: string
                  description: |-
                    The processing action when the agent is in the thinking state supports the following values:
                    - `"interrupt"`: (Default) Interrupt the current state and initiate a new round of dialogue.
                    - `"ignore"`: Ignore this request.
                on_speaking_action:
                  type: string
                  description: |-
                    The processing action when the agent is in the speaking state, supports the following values:
                    - `"interrupt"`: Interrupt the current state and initiate a new round of dialogue.
                    - `"ignore"`: (Default) Ignore this request.
                interruptable:
                  type: boolean
                  description: |-
                    Whether to allow users to interrupt custom instructions by speaking:
                    - `true`: (default) allowed.
                    - `false`: not allowed.
                  default: true
                metadata:
                  type: object
                  description: Custom metadata. You can pass in additional information such as business ID through this field.
                  additionalProperties: {}
            examples:
              Example 1:
                value:
                  text: The user just clicked the purchase button.
                  on_listening_action: inject
                  on_thinking_action: interrupt
                  on_speaking_action: ignore
                  interruptable: true
                  metadata:
                    publisher: user123
                    model: deepseek-r1
      responses:
        "200":
          description: "- If the returned status code is `200`, the request is successful. The response package body is agent information.\r\n- If the returned status code is not `200`, it means the request failed. The response package body contains the error category and description. You can refer to [Response Status Code](https://doc.shengwang.cn/doc/convoai/restful/api/response-code) to learn about possible causes."
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    $ref: "#/components/schemas/agent_id"
                  channel:
                    $ref: "#/components/schemas/channel"
                  start_ts:
                    $ref: "#/components/schemas/start_ts"
              examples:
                Example 1:
                  value:
                    agent_id: 1NT29XxxxxxxxxELWEHC8OS
                    channel: test_channel
                    start_ts: 1744877089
  /v2/projects/{appid}/agents/{agentId}/history:
    parameters:
      - $ref: "#/components/parameters/Authorization"
      - $ref: "#/components/parameters/appid"
      - $ref: "#/components/parameters/agentId"
    get:
      summary: Retrieve agent history
      operationId: get-history
      description: "Capture the short-term memory of the conversation between the user and the agent.\r\nYou can call this API during the running of the agent (`RUNNING`) to obtain the short-term memory information stored until the creation of the agent, including:\r\n- timestamps when the agent was created and stopped\r\n- User and agent conversation messages"
      responses:
        default:
          description: "- If the returned status code is `200`, the request is successful. The response body contains the results of this request.\r\n- If the returned status code is not `200`, it means the request failed. The response package body contains the error category and description. You can refer to [Response Status Code](https://doc.shengwang.cn/doc/convoai/restful/api/response-code) to learn about possible causes."
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    agent_id: xxxx
                    start_ts: 123
                    end_ts: 144
                    status: STOPPED
                    contents:
                      - role: user
                        content: hello.
                      - role: assistant
                        content: hi, how can I help you?
                properties:
                  agent_id:
                    type: string
                    description: The unique identifier of the agent.
                  start_ts:
                    type: integer
                    description: Agent creation timestamp.
                  status:
                    type: string
                    description: >-
                      The running status of the agent. Only the query status of `RUNNING` (2), that is, the running
                      agent, is supported.
                  contents:
                    type: array
                    description: Agent short-term memory.
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                          description: "Message sender. Possible values are:\r\n- `user`: user.\r\n- `assistant`: agent."
                        content:
                          type: string
                          description: Message content.
              examples:
                Example 1:
                  value:
                    agent_id: xxxx
                    start_ts: 123
                    status: RUNNING
                    contents:
                      - role: user
                        content: hello.
                      - role: assistant
                        content: hi, how can I help you?
  /v2/projects/{appid}/agents/{agentId}/turns:
    get:
      summary: Query conversation turn information
      description: >-
        After the session with the agent ends, call this interface to query the dialogue round information of this
        session, including the start information, end information, and performance indicators of each dialogue round.

        > Only supports querying sessions within 7 days.
      operationId: get-turns
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/appid"
        - $ref: "#/components/parameters/agentId"
      responses:
        "200":
          description: "- If the returned status code is `200`, the request is successful. The response body contains the results of this request.\r\n- If the returned status code is not `200`, it means the request failed. The response package body contains the error category and description. You can refer to [Response Status Code](https://doc.shengwang.cn/doc/convoai/restful/api/response-code) to learn about possible causes."
          content:
            application/json:
              schema:
                type: object
                properties:
                  turns:
                    type: array
                    description: List of dialogue turns.
                    items:
                      type: object
                      properties:
                        agent_id:
                          type: string
                          description: The unique identifier of the agent.
                        channel:
                          type: string
                          description: Conversation channel name.
                        turn_id:
                          type: integer
                          description: Conversation turn ID, starting from 1 and increasing.
                        start:
                          type: object
                          description: Round start message.
                          properties:
                            start_at:
                              type: integer
                              description: Start timestamp, UTC time in milliseconds.
                            type:
                              type: string
                              description: >-
                                Start type:

                                - `voice_input`: Started by user voice input.

                                - `greeting`: starts when the agent broadcasts a greeting.

                                - `silence_timeout`: Started due to agent silence timeout.

                                - `api_speak`: Started by calling the [Report custom
                                information](/doc/convoai/restful/convoai/operations/agent-speak) interface to broadcast
                                information.
                            metadata:
                              $ref: "#/components/schemas/sos_metadata"
                              description: Start appending metadata, including different fields depending on the `type` field.
                        end:
                          type: object
                          description: Round end message.
                          properties:
                            end_at:
                              type: integer
                              description: End timestamp, UTC time in milliseconds.
                            type:
                              type: string
                              description: |-
                                Round end type:
                                - `ok`: End normally.
                                - `interrupted`: interrupted.
                                - `ignored`: ignored.
                                - `error`: execution error.
                            metadata:
                              $ref: "#/components/schemas/eos_metadata"
                              description: End additional metadata, containing different fields depending on the `type` field.
                        metrics:
                          type: object
                          description: Dialogue turn performance metric details.
                          properties:
                            e2e_latency_ms:
                              type: integer
                              description: Total end-to-end latency (ms).
                            segmented_latency_ms:
                              type: array
                              description: List of segment latency metric details.
                              items:
                                type: object
                                properties:
                                  name:
                                    $ref: "#/components/schemas/metrics_modality"
                                    description: >-
                                      Delay module name. Different delay modules are returned depending on the LLM input
                                      mode set when [Creating Conversational
                                      Agent](/doc/convoai/restful/convoai/operations/start-agent).
                                  latency:
                                    type: integer
                                    description: Delay time (ms).
              examples:
                Example 1:
                  value:
                    turns:
                      - agent_id: A42Axxxxxxxxx37MT56J
                        channel: test_channel
                        turn_id: 1
                        start:
                          start_at: 1774579820147
                          type: greeting
                          metadata:
                            greeting_nth: 1
                        end:
                          end_at: 1774579822412
                          type: interrupted
                          metadata:
                            caused_by: api_interrupt
                            transport: rtm
                        metrics:
                          e2e_latency_ms: 337
                          segmented_latency_ms:
                            - name: tts_ttfb
                              latency: 337
      servers:
        - url: https://api.agora.io/cn/api/conversational-ai-agent
          description: ""
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: >-
        When sending an HTTP request, you need to choose one of the following authentication methods: <ol><li>**
        (Recommended) Use RTC Token**: Fill in the `Authorization` field with the RTC Token used by the Agora
        conversational AI engine project. You can choose the following methods to obtain Token: <ul><li>In the test
        environment, you can generate a temporary Token (valid for 24 hours) for your project from [Shengwang
        Console](https://console.shengwang.cn/). </li><li>In a production environment, you can refer to [Using Token
        Authentication](https://doc.shengwang.cn/doc/rtc/android/basic-features/token-authentication) to deploy the
        Token server to generate Token. </li></ul>Example of passing parameters: `Authorization: agora
        token="007abcxxxxxxx123"`</li><li>**Use Basic Auth**: Refer to [Implementing HTTP security
        authentication](https://doc.shengwang.cn/doc/convoai/restful/user-guides/http-basic-auth#Use-http-basic
        authentication) to generate the Base64-encoded `Authorization` field. <br/>Parameter passing example:
        `Authorization: Basic NDI1OTQ3N2I4MzYy...YwZjA=`</li></ol>
      required: true
      schema:
        type: string
        example: agora token=007abcxxxxxxxxxxxxxx123
    appid:
      name: appid
      in: path
      description: >-
        [App ID](http://doc.shengwang.cn/doc/convoai/restful/get-started/enable-service#%E8%8E%B7%E5%8F%96-app-id) used
        by your project.
      required: true
      schema:
        type: string
    agentId:
      name: agentId
      in: path
      description: >-
        Agent instance ID, which is the unique identifier of the agent. After calling [POST to create a conversational
        agent](https://doc.shengwang.cn/doc/convoai/restful/convoai/operations/start-agent) successfully, it will be
        obtained in the response package body.
      required: true
      schema:
        type: string
    phone_number:
      name: phone_number
      in: path
      description: "A phone number in E.164 format (for example: +11234567890) as a unique identifier."
      required: true
      schema:
        type: string
  responses:
    "200":
      description: >-
        - If the returned status code is `200`, the request is successful. The response body contains the results of
        this request.

        - If the returned status code is not `200`, it means the request failed. The response package body contains the
        error category and description. You can refer to [Response Status
        Code](https://doc.shengwang.cn/doc/convoai/restful/api/response-code) to learn about possible causes.
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                agent_id: 1NT29X10YHxxxxxWJOXLYHNYB
                create_ts: 1737111452
                state: RUNNING
            properties:
              agent_id:
                $ref: "#/components/schemas/agent_id"
                description: The unique identifier of the agent.
              create_ts:
                $ref: "#/components/schemas/start_ts"
                description: Agent creation timestamp.
              status:
                type: string
                description: "Agent running status:\r\n- `IDLE` (0): Agent in idle state.\r\n- `STARTING` (1): The agent being started.\r\n- `RUNNING` (2): The running agent.\r\n- `STOPPING` (3): Stopping agent.\r\n- `STOPPED` (4): Agent that has finished exiting.\r\n- `RECOVERING` (5): The recovering agent.\r\n- `FAILED` (6): Agent that failed to execute."
          examples:
            Example 1:
              value:
                agent_id: 1NT29X10YHxxxxxWJOXLYHNYB
                create_ts: 1737111452
                status: RUNNING
    phone_number_error:
      description: >-
        If the returned HTTP status code is not a success status code, it means that the request failed. The response
        body will contain a JSON object containing the type and description of the error.


        **Possible status codes and reasons:**


        - 401 `unauthorized`: Authentication failed, please check your credentials.

        - 404 `not_found`: The specified phone number was not found.

        - 409 `phone_number_exists`: The phone number already exists and repeated import is not allowed.

        - 409 `conflict`: Concurrent modification conflicts or the resource is locked.

        - 422 `unprocessable_content`: The request format is incorrect or parameter verification failed.

        - 500 `internal_server_error`: Server internal error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error_type:
                type: string
                description: Error type.
              description:
                type: string
                description: Error description.
          examples:
            Example 1:
              value:
                error_type: unauthorized
                description: Authentication failed, please check your credentials.
    outbound_call_error:
      description: >-
        If the returned HTTP status code is not 200, it means the request failed. The response body will contain a JSON
        object containing the type and description of the error.


        **Possible status codes and reasons:**


        - 400 `invalid_phone_format`: The phone number format is invalid (not E.164 format).

        - 401 `unauthorized`: Authentication failed, please check your credentials.

        - 500 `internal_server_error`: Server internal error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error_type:
                type: string
                description: Error type.
              description:
                type: string
                description: Error description.
          examples:
            Example 1:
              value:
                error_type: invalid_phone_format
                description: The phone number format is invalid (not E.164 format).
  schemas:
    voice_id:
      type: string
      title: voice_id
      description: >-
        Agent voice ID. For details of supported voice IDs, see [voice ID
        table](https://doc.shengwang.cn/doc/convoai/doc/convoai/restful/api/voice-ids).
    max_history:
      type: integer
      description: >-
        Number of short-term memory entries cached in LLM. The value range is `[1,1024]`. Short-term memory includes
        user and agent conversation messages, tool call information, and timestamps. The agent and user record
        short-term memory entries separately.
      default: 32
    tts_params:
      title: params
      description: >-
        TTS configuration parameters. The parameter structure is different under different TTS vendors.

        > The Agora conversational AI engine does not guarantee full support for parameters not mentioned in each
        supplier's sample code.
      oneOf:
        - $ref: "#/components/schemas/tts_minimax"
        - $ref: "#/components/schemas/tts_tencent"
        - $ref: "#/components/schemas/tts_bytedance"
        - $ref: "#/components/schemas/tts_microsoft"
        - $ref: "#/components/schemas/tts_cosyvoice"
        - $ref: "#/components/schemas/tts_duplex"
        - $ref: "#/components/schemas/tts_stepfun"
    tts_minimax:
      title: Minimax
      type: object
      additionalProperties: {}
      description: >-
        Minimax TTS, please see [Minimax official
        documentation](https://platform.minimaxi.com/docs/api-reference/speech-t2a-http) for specific protocol details.
        The following are examples:

        ```json

        "params": {
            "key": "xxxx",
            "model": "speech-01-turbo",
            "voice_setting": {
                "voice_id": "female-shaonv",
                "speed": 1,
                "vol": 1,
                "pitch": 0,
                "emotion": "happy",
                "latex_read": True,
                "english_normalization": True,
            },
            "audio_setting": {
                "sample_rate": 16000
            },
            "pronunciation_dict": {
                "tone": ["This is/(zei3)(si4)", "Message/(xiao3)(xi4)"]
            },
            # Voice_id and timber_weights are required.
            # "timber_weights": [{
            # "voice_id": "male-qn-qingse",
            # "weight": 1
            # },
            # {
            # "voice_id": "female-shaonv",
            # "weight": 5
            # }],
            "language_boost": "auto"
        }

        ```
    tts_tencent:
      title: Tencent
      type: object
      additionalProperties: {}
      description: >-
        Tencent Cloud TTS, please see [Tencent Cloud official
        document](https://cloud.tencent.com/document/product/1073/94308) for details of the protocol. The following are
        examples:

        ```json

        "params": {
            "app_id": "xxxx",
            "secret_id": "xxxx",
            "secret_key": "xxxx",
            "voice_type": 601005,
            "volume": 0,
            "speed": 0,
            "emotion_category": "happy",
            "emotion_intensity": 100
        }

        ```
    tts_bytedance:
      title: Bytedance
      type: object
      description: >-
        Volcano TTS, for specific protocol details, see [Volcan Engine Official
        Documentation](https://www.volcengine.com/docs/6561/79823). The following are examples:

        ```json

        "params": {
            "token": "xxxxx",
            "app_id": "xxxx",
            "cluster": "volcano_tts",
            "voice_type": "BV700_streaming",
            "speed_ratio": 1.0,
            "volume_ratio": 1.0,
            "pitch_ratio": 1.0,
            "emotion": "happy"
        }

        ```
      additionalProperties: {}
    tts_cosyvoice:
      title: CosyVoice
      type: object
      additionalProperties: {}
      description: >-
        Alibaba Cloud CosyVoice TTS, for specific protocol details, please see [Alibaba Cloud official
        documentation](https://help.aliyun.com/zh/model-studio/cosyvoice-large-model-for-speech-synthesis/). The
        following are examples:

        ```json

        "params": {
          "api_key": "your_cosyvoice_api_key",
          "model": "cosyvoice-v1",
          "sample_rate": 16000,
          "voice": "longxiaochun"
        }

        ```
    tts_duplex:
      title: Bytedance Duplex
      type: object
      additionalProperties: {}
      description: >-
        Volcano engine bidirectional streaming TTS, for specific protocol details, please see [Volcano Engine official
        documentation](https://www.volcengine.com/docs/6561/1329505). The following are examples:
         ```json
         "params": {
           "app_id": "your_bytedance_tts_app_id",
           "token": "your_bytedance_tts_token",
           "speaker": "zh_female_shuangkuaisisi_moon_bigtts"
         }
         ```
    tts_stepfun:
      title: StepFun
      type: object
      additionalProperties: {}
      description: >-
        Step Star TTS, for details on the protocol, see [Step Star Official
        Document](https://platform.stepfun.com/docs/api-reference/audio/ws_audio). The following are examples:
         ```json
         "params": {
           "api_key": "your_stepfun_tts_key",
           "model": "step-tts-mini",
           "voice_id": "cixingnansheng"
         }
         ```
    agent_id:
      title: agent_id
      type: string
      description: Conversational agent ID, which is the unique identifier of the agent.
    channel:
      title: channel
      type: string
      description: The name of the RTC channel where the agent is located.
    start_ts:
      title: start_ts
      type: integer
      description: Agent creation timestamp.
    tts_microsoft:
      title: Microsoft
      type: object
      additionalProperties: {}
      description: >-
        Microsoft Azure TTS. The following are examples and parameter descriptions:

        ```json

        "params": {
            "key": "<your_microsoft_key>",
            "region": "chinaeast2",
            "voice_name": "zh-CN-YunxiNeural",
            "speed": 1.0,
            "volume": 70
        }

        ```

        - `key`: (required) String. Microsoft Azure API key.

        - `region`: (required) String. Regions served by Microsoft TTS.

        - `voice_name`: (required) String. timbre.

        - `speed`: (optional) Number. Speech rate. The value range is [0.5, 2.0], and the default value is 1.0. Used to
        indicate the speech rate of text. Speech rate can be applied at the word or sentence level.

        - `volume`: (optional) Number. volume. The value range is [0.0, 100.0], and the default value is 100. For
        example, a value of 75 means the volume is set to 75% of maximum volume.

        - `sample_rate`: (optional) Integer. Audio sample rate (Hz). The available values ​​are [16000, 24000, 48000],
        and the default value is 24000.


        > For more information, please refer to [Microsoft official
        documentation](https://docs.azure.cn/zh-cn/ai-services/speech-service/).
    metrics_modality:
      title: modality
      type: string
      description: >-
        Delay module name. Different delay modules are returned depending on the LLM input mode set when [Creating
        Conversational Agent](/doc/convoai/restful/convoai/operations/start-agent).
      oneOf:
        - $ref: "#/components/schemas/metrics_modality_text"
        - $ref: "#/components/schemas/metrics_modality_audio"
    metrics_modality_text:
      title: text
      type: string
      description: |-
        When the LLM input mode is `text`, the returned delay module is:
          - `algorithm_processing`: algorithm processing delay.
          - `asr_ttlw`: The ttlw (Time To Last Word) indicator of the ASR module, which represents the delay time from detecting the end of the user's speaking to ASR outputting the last word.
          - `llm_ttft`: The ttft (Time To First Token) indicator of the LLM module, which represents the delay time from the end of the user speaking to the time when LLM outputs the first token.
          - `llm_ftfs`: The ftfs (First token To First Sentence) indicator of the LLM module, indicating the delay time from LLM outputting the first token to outputting the first complete sentence.
          - `tts_ttfb`: The ttfb (Time To First Byte) indicator of the TTS module, which represents the delay time from when the TTS module receives a text request to when TTS outputs the first audio byte.
          - `transport`: network transmission delay (ms). Currently, this field is not returned when the user uses the RTC Web SDK.
    metrics_modality_audio:
      title: audio
      type: string
      description: |-
        When the LLM input mode is `audio`, the returned delay module is:
          - `algorithm_processing`: algorithm processing delay.
          - `asr_ttlw`: The ttlw (Time To Last Word) indicator of the ASR module, which represents the delay time from detecting the end of the user's speaking to ASR outputting the last word.
          - `llm_ttfa`: The ttfa (Time To First Audio to First Byte) indicator of the LLM module, which represents the delay time from the end of the user speaking to the LLM outputting the first audio byte to the TTS module receiving the first audio byte.
          - `transport`: network transmission delay (ms). Currently, this field is not returned when the user uses the RTC Web SDK.
    eos_metadata:
      title: metadata
      description: End additional metadata, containing different fields depending on the `type` field.
      oneOf:
        - $ref: "#/components/schemas/eos_metadata_ok"
        - $ref: "#/components/schemas/eos_metadata_interrupted"
        - $ref: "#/components/schemas/eos_metadata_ignored"
        - $ref: "#/components/schemas/eos_metadata_error"
    eos_metadata_ok:
      title: ok
      type: object
      description: End appending metadata normally.
      properties:
        playback_duration_ms:
          type: integer
          description: Voice playback duration (ms).
    eos_metadata_interrupted:
      title: interrupted
      type: object
      description: Break appending metadata.
      properties:
        caused_by:
          type: string
          description: >-
            Reason for round interruption:

            - `start_of_speech`: starts a new speech request.

            - `api_speak`: Interrupted due to calling the [Report custom
            information](/doc/convoai/restful/convoai/operations/agent-speak) interface to report information.

            - `api_interrupt`: Interrupted by calling the [Interrupt
            Agent](/doc/convoai/restful/convoai/operations/agent-interrupt) interface.

            - `api_leave`: Interrupted by calling the [Stop Conversational
            Agent](/doc/convoai/restful/convoai/operations/leave-channel) interface to leave the channel.
        transport:
          type: string
          description: |-
            Transport protocol (returned when `caused_by` is `api_speak` or `api_interrupt`):
            - `http`: HTTP protocol.
            - `rtm`: transmitted via RTM Presence channel.
    eos_metadata_ignored:
      title: ignored
      type: object
      description: Ignore additional metadata.
      properties:
        caused_by:
          type: string
          description: >-
            Reasons for round ignoring:

            - `semantic`: After turning on the graceful interruption function
            (`turn_detection.config.end_of_speech.mode` is `semantic`) when [creating a conversational
            agent](/doc/convoai/restful/convoai/operations/start-agent), it is ignored because the semantic rules
            determine that no response is required.

            - `keywords`: After turning on the keyword-based dialogue start detection function
            (`turn_detection.config.start_of_speech.mode` is `keywords`) when [Creating a conversational
            agent](/doc/convoai/restful/convoai/operations/start-agent), the round of dialogue is ignored due to missing
            keywords in the round start detection.

            - `disable`: Because the dialogue round detection function is set to uninterruptible, this round of dialogue
            is ignored.
    eos_metadata_error:
      title: error
      type: object
      description: Error attaching metadata.
      properties:
        reason:
          type: string
          description: |-
            Error type, may contain the following values:
            - `LLM_REQUEST_ERR`: LLM request error.
            - `INTERNAL_ERR`: Internal error.
        details:
          type: string
          description: Error details.
    sos_metadata:
      title: metadata
      description: Start appending metadata, including different fields depending on the `type` field.
      oneOf:
        - $ref: "#/components/schemas/sos_metadata_voice_input"
        - $ref: "#/components/schemas/sos_metadata_greeting"
        - $ref: "#/components/schemas/sos_metadata_silence_timeout"
        - $ref: "#/components/schemas/sos_metadata_api_speak"
    sos_metadata_voice_input:
      title: voice_input
      type: object
      description: Speech input appends metadata.
      properties:
        speech_duration_ms:
          type: integer
          description: Voice duration (ms).
        interrupt_duration_ms:
          type: integer
          description: Vocal duration threshold (ms) when the agent is idle or listening.
    sos_metadata_greeting:
      title: greeting
      type: object
      description: Greeting with additional metadata.
      properties:
        greeting_nth:
          type: integer
          description: Number of times the greeting has been played.
    sos_metadata_silence_timeout:
      title: silence_timeout
      type: object
      description: Silent timeout appended metadata.
      properties:
        action:
          type: string
          description: |-
            - `speak`: broadcast the silent prompt content.
            - `think`: Append the silent prompt content to the end of the context and pass it to LLM.
    sos_metadata_api_speak:
      title: api_speak
      type: object
      description: Broadcast custom information with additional metadata.
      properties:
        transport:
          type: string
          description: |-
            Transport protocol:
            - `http`: HTTP protocol.
            - `rtm`: transmitted via RTM Presence channel.
    asr_params:
      title: params
      description: >-
        ASR configuration parameters. The parameter structure is different under different ASR vendors.

        > The Agora conversational AI engine does not guarantee full support for parameters not mentioned in each
        supplier's sample code.
      oneOf:
        - $ref: "#/components/schemas/asr_tencent"
        - $ref: "#/components/schemas/asr_microsoft"
        - $ref: "#/components/schemas/asr_xfyun"
        - $ref: "#/components/schemas/asr_xfyun_bigmodel"
        - $ref: "#/components/schemas/asr_xfyun_dialect"
    asr_tencent:
      title: Tencent
      type: object
      additionalProperties: {}
      description: >-
        Tencent Cloud ASR, please see [Tencent Cloud official
        document](https://cloud.tencent.com/document/product/1093/48982) for details of the protocol. The following are
        examples:

        ```json

        "params": {
            "key": secret_key,
            "app_id": app_id,
            "secret": secret,
            "engine_model_type": "16k_zh",
            "voice_id": "TBgVFCsxdn3i2DGt",
        }

        ```
    asr_xfyun:
      title: xfyun
      type: object
      additionalProperties: {}
      description: >-
        iFlytek traditional speech transcription recognition service, please see [iFlytek official
        document](https://www.xfyun.cn/doc/spark/asr_llm/rtasr_llm.html) for details of the agreement. The following are
        examples:

        ```json

        "params": {
            "api_key": "XFYUN_ASR_API_KEY",
            "app_id": "XFYUN_ASR_APP_ID",
            "api_secret": "XFYUN_ASR_API_SECRET",
            "language": "zh_cn"
        }

        ```
    asr_xfyun_bigmodel:
      title: xfyun_bigmodel
      type: object
      additionalProperties: {}
      description: >-
        iFlytek Cloud Speech Recognition Large Model Service, for details of the agreement, please see [iFlytek official
        document](https://www.xfyun.cn/doc/spark/asr_llm/rtasr_llm.html). The following are examples:

        ```json

        "params": {
            "api_key": "XFYUN_ASR_BIGMODEL_API_KEY",
            "app_id": "XFYUN_ASR_BIGMODEL_APP_ID",
            "api_secret": "XFYUN_ASR_BIGMODEL_API_SECRET",
            "language_name": "cn",
            "language":"mix"
        }

        ```
    asr_xfyun_dialect:
      title: xfyun_dialect
      type: object
      additionalProperties: {}
      description: >-
        iFlytek Cloud Dialect Free Speech Recognition Service, for details of the agreement, please see [iFlytek
        official document](https://www.xfyun.cn/doc/spark/asr_llm/rtasr_llm.html). The following are examples:

        ```json

        "params": {
            "app_id": "XFYUN_ASR_DIALOG_APP_ID",
            "access_key_id": "XFYUN_ASR_DIALOG_ACCESS_KEY_ID",
            "access_key_secret":"XFYUN_ASR_DIALOG_ACCESS_KEY_SECRET",
            "language": "zh-CN"
        }

        ```
    asr_microsoft:
      title: Microsoft
      type: object
      additionalProperties: {}
      description: >-
        Microsoft ASR. The following are examples:

        ```json

        "params": {
            "key": "<your_microsoft_key>",
            "region": "chinaeast2",
            "language": "zh-CN",
            "phrase_list": ["agora", "fengming"],
        }

        ```

        - `key`: (required) String. API key for Microsoft ASR service.

        - `region`: (required) String. Regions served by Microsoft ASR. For details, see [Supported
        Regions](https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support?tabs=stt).

        - `language`: (required) String. language. For details, see [Supported
        Languages](https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support?tabs=stt).

        - `phrase_list`: (optional) Array[String]. Hot word list.
    avatar_params:
      title: params
      description: >-
        Digital human configuration parameters. The parameter structure is different under different digital human
        suppliers.

        > The Agora conversational AI engine does not guarantee full support for parameters not mentioned in each
        supplier's sample code.
      oneOf:
        - $ref: "#/components/schemas/avatar_sensetime"
    avatar_sensetime:
      title: Sensetime
      type: object
      additionalProperties: {}
      description: >-
        SenseTime digital human configuration parameters, the specific protocol details can be found in [SenseTime
        official document](https://aigc.softsugar.com/html/help/5-%E7%9B%B4%E6%92%AD.
        html#%E7%9B%B4%E6%92%AD%E8%84%9A%E6%9C%ACjson%E5%AE%9A%E4%B9%89%E8%AF%B4%E6%98%8E). The following are examples:

        ```json

        "params": {
            "agora_token": "agora_token",
            "agora_uid": "agora_uid",
            "appId": "sensetime_app_id",
            "app_key": "sensetime_app_key",
            "sceneList": [
                {
                    "digital_role": {
                        "face_feature_id": "face_feature_id",
                        "position": {"x": 0, "y": 0},
                        "url": "https://example-digital-human-models/avatar_id.zip"
                    }
                }
            ]
        }

        ```

        > - The following SenseTime digital human configuration fields currently do not support transparent transmission
        in `params`: `tts_config`, `tts_query`, `audios`, `quick_response`, `quick_response_preload_list`,
        `opening_words`.

        > - `agora_uid` must be a purely numeric string of no more than 32 bits (`0` to `2^32-1`)), for example
        `"1234"`.
    filler_words_trigger_config:
      title: config
      description: >-
        Pad words trigger configuration parameters. The parameter name and structure are different in different trigger
        modes.

        > - The configuration type passed in needs to match `mode`. For example, when `mode` is `"fixed_time"`, the
        corresponding configuration of `fixed_time_config` needs to be passed in.

        > - Multiple mode configurations cannot be passed in at the same time.
      oneOf:
        - $ref: "#/components/schemas/filler_words_trigger_fixed_time_config"
    filler_words_trigger_fixed_time_config:
      title: fixed_time_config
      type: object
      description: |-
        Fixed time trigger configuration. The following are examples:
        ```json
        "config": {
            "response_wait_ms": 1500
        }
        ```
      properties:
        response_wait_ms:
          type: integer
          description: >-
            LLM response waiting threshold (ms), the value range is [100, 10000]. When the duration of LLM in the
            waiting state (such as waiting for RAG retrieval results, tool call results) reaches this threshold and no
            response content is generated, the pad word broadcast is triggered.
          default: 1500
    filler_words_content_config:
      title: config
      description: >-
        The configuration parameters of the padding content. The parameter name and structure are different in different
        content modes.

        > - The configuration type passed in needs to match `mode`. For example, when `mode` is `"static"`, the
        corresponding configuration of `static_config` needs to be passed in.

        > - Multiple mode configurations cannot be passed in at the same time.
      oneOf:
        - $ref: "#/components/schemas/filler_words_content_static_config"
    filler_words_content_static_config:
      title: static_config
      type: object
      description: |-
        Static word configuration. The following are examples:
        ```json
        "static_config": {
            "phrases": [
                "Please wait.",
                "Okay.",
                "Hmm."
            ],
            "selection_rule": "shuffle"
        }
        ```
      properties:
        phrases:
          type: array
          description: |-
            List of padding phrases.
            > - Supports up to 100 pad words.
            > - The length of each pad word shall not exceed 50 Chinese characters or 50 English words.
          items:
            type: string
          maxItems: 100
        selection_rule:
          type: string
          description: >-
            Pad word selection rules support the following values:

            - `"shuffle"`: randomly shuffle. Before all the pad words have been used in a round, the used pad words will
            not be broadcast again; only after all the pad words have been broadcast, they will be randomly shuffled
            again and a new round will start.

            - `"round_robin"`: Polling. Select and broadcast sequentially from the list of pad words. After all the pad
            words have been broadcast for one round, a new cycle of broadcasting begins.
          enum:
            - shuffle
            - round_robin
          default: shuffle
    start_of_speech_config:
      title: "{mode}_config"
      description: >-
        The dialog starts detecting configuration parameters. The parameter structure and supported fields are different
        in different detection modes.

        You need to pass in the corresponding configuration fields according to `mode`. For example, when `mode` is
        `"vad"`, `vad_config` needs to be passed in. Multiple mode configurations cannot be passed in at the same time.
      oneOf:
        - $ref: "#/components/schemas/start_of_speech_vad_config"
        - $ref: "#/components/schemas/start_of_speech_keywords_config"
        - $ref: "#/components/schemas/start_of_speech_disabled_config"
    start_of_speech_vad_config:
      title: vad_config
      type: object
      description: |-
        VAD based dialog starts detecting configuration. The following are examples:
        ```json
        "vad_config": {
            "interrupt_duration_ms": 160,
            "speaking_interrupt_duration_ms": 160,
            "prefix_padding_ms": 800,
        }
        ```
      properties:
        interrupt_duration_ms:
          type: integer
          description: >-
            The vocal duration threshold (ms) when the agent is idle or listening, ranging from [120, 1200]. The minimum
            length of time for continuous detection of human voice signals to avoid false interruptions.
          default: 160
        speaking_interrupt_duration_ms:
          type: integer
          description: >-
            The vocal duration threshold (ms) when the agent is speaking, the value range is [120, 1200]. The minimum
            length of time for continuous detection of human voice signals to avoid false interruptions. Usually set
            longer than `interrupt_duration_ms` to avoid being accidentally interrupted by shorter human voices when the
            agent is speaking.
          default: 160
        prefix_padding_ms:
          type: integer
          description: >-
            Prefix padding threshold (ms), range [0, 5000]. Minimum speech duration required to start a new speech
            segment, to avoid very short sounds triggering speech activity detection.
          default: 800
    start_of_speech_keywords_config:
      title: keywords_config
      type: object
      deprecated: true
      description: >-
        Deprecated. Please use the top-level `interruption.mode = "keywords"` instead with
        `interruption.keywords_config.trigger_keywords` to implement keyword interruption.
      properties: {}
    start_of_speech_semantic_config:
      title: semantic_config
      type: object
      description: |-
        Semantics-based conversation start detection configuration. The following are examples:
        ```json
        "semantic_config": {
            "interrupt_duration_ms": 160,
            "prefix_padding_ms": 800,
        }
        ```
      properties:
        interrupt_duration_ms:
          type: integer
          description: >-
            Vocal duration threshold (ms), value range is [120, 1200]. The minimum length of time for continuous
            detection of human voice signals to avoid false interruptions.
          default: 160
        prefix_padding_ms:
          type: integer
          description: >-
            Prefix padding threshold (ms), range [0, 5000]. Minimum speech duration required to start a new speech
            segment, to avoid very short sounds triggering speech activity detection.
          default: 800
    start_of_speech_disabled_config:
      title: disabled_config
      type: object
      deprecated: true
      description: >-
        Deprecated. Please use `interruption.enable = false` instead and `interruption.disabled_config.strategy` to
        configure the processing strategy after turning off interruption.
      properties: {}
    end_of_speech_config:
      title: "{mode}_config"
      description: >-
        The end of the session checks the configuration parameters. The parameter structure and supported fields are
        different in different detection modes.

        You need to pass in the corresponding configuration fields according to `mode`. For example, when `mode` is
        `"vad"`, `vad_config` needs to be passed in. Multiple mode configurations cannot be passed in at the same time.
      oneOf:
        - $ref: "#/components/schemas/end_of_speech_vad_config"
        - $ref: "#/components/schemas/end_of_speech_semantic_config"
    end_of_speech_vad_config:
      title: vad_config
      type: object
      description: |-
        VAD based end of conversation detection configuration. The following are examples:
        ```json
        "vad_config": {
            "silence_duration_ms": 480
        }
        ```
      properties:
        silence_duration_ms:
          type: integer
          description: >-
            Silence duration threshold (ms), value range is [120, 2000]. The minimum duration of silence at the end of
            speech, ensuring that brief pauses don't end the speech segment prematurely.
          default: 480
    end_of_speech_semantic_config:
      title: semantic_config
      type: object
      description: |-
        Semantics-based conversation end detection configuration. The following are examples:
        ```json
        "semantic_config": {
            "silence_duration_ms": 240,
            "max_wait_ms": 3000,
            "pause_state_enabled": true
        }
        ```
      properties:
        silence_duration_ms:
          type: integer
          description: >-
            Silence duration threshold (ms), value range is [120, 2000]. The minimum duration of silence at the end of
            speech, ensuring that brief pauses don't end the speech segment prematurely.
          default: 240
        max_wait_ms:
          type: integer
          description: >-
            Maximum waiting time (ms), the value range is [500, 10000], passing `-1` means waiting forever. The maximum
            time to wait for semantic determination. After timeout, it will be determined whether the conversation ends
            based on the current status.
          default: 3000
        pause_state_enabled:
          type: boolean
          default: true
          description: >-
            Whether to determine that the user intends to pause the conversation:

            - `true`: (Default) The agent will determine whether the user wants to pause the conversation based on
            semantics. For example, when the user input ends with words such as "wait a moment" or "wait a moment", the
            agent can determine based on semantics that the user intends to pause the conversation and wait for the
            user's subsequent input, instead of determining that the user input is completed and directly sending it to
            the LLM.

            - `false`: The agent does not determine whether the user wants to pause the conversation.
    phone_number_object:
      title: phone_number_object
      type: object
      description: A phone number object containing the details of a phone number.
      properties:
        provider:
          type: string
          description: |-
            Number provider, optional following values:
            - `"byo"`: BYO (Bring Your Own).
            - `"aliyun"`: Alibaba Cloud.
        phone_number:
          type: string
          description: A phone number in E.164 format as a unique identifier.
        label:
          type: string
          description: The label used to identify this number.
        inbound:
          type: boolean
          description: Whether the number supports incoming calls.
        outbound:
          type: boolean
          description: Whether the number supports outbound calls.
        associated_pipeline:
          type: object
          nullable: true
          description: The associated Pipeline information, or `null`.
          properties:
            pipeline_id:
              type: string
              description: Pipeline ID。
            pipeline_name:
              type: string
              description: Pipeline name.
        inbound_config:
          type: object
          nullable: true
          description: SIP incoming call configuration details, or `null`.
        outbound_config:
          type: object
          nullable: true
          description: SIP outbound call configuration details, or `null`.
  securitySchemes:
    Basic Auth:
      type: http
      scheme: basic
      description: >-
        When sending an HTTP request, you need to pass Basic HTTP authentication and fill in the generated credentials
        into the `Authorization` Header of the HTTP request. For the specific method of generating the `Authorization`
        field, please refer to [Implementing HTTP Security
        Authentication](https://doc.shengwang.cn/doc/convoai/restful/user-guides/http-basic-auth).
security:
  - {}
  - Basic Auth: []

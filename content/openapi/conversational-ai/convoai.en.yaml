openapi: 3.1.0
info:
  version: ""
  title: Conversational AI Agent API Overview
  description: >-
    This article introduces the basic information of Agora conversational agent service RESTful API.


    ## Data format


    The `Content-Type` request header of all HTTP requests is `application/json`. All request and response content are
    formatted as JSON.
servers:
  - url: https://api.agora.io/cn/api/conversational-ai-agent
    description: ""
paths:
  /v2/projects/{appid}/join:
    post:
      summary: Start a conversational AI agent
      description: Create a Conversational AI agent instance and join the RTC channel.
      operationId: start-agent
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/appid"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - properties
              properties:
                name:
                  type: string
                  description: The unique identifier of the agent, and the same identifier cannot be created repeatedly.
                properties:
                  type: object
                  description: Detailed configuration of the agent.
                  required:
                    - channel
                    - agent_rtc_uid
                    - remote_rtc_uids
                    - tts
                    - llm
                  properties:
                    channel:
                      type: string
                      description: The name of the RTC channel that the agent joins.
                    token:
                      type: string
                      description: >-
                        The Token used to join the RTC channel is the dynamic key used for authentication. If your
                        project has App Certificates enabled, be sure to pass your project's dynamic key in this field.
                        For details, see [Using Token
                        Authentication](https://doc.shengwang.cn/doc/rtc/android/basic-features/token-authentication).
                    agent_rtc_uid:
                      type: string
                      description: The user ID of the agent in the RTC channel.
                    remote_rtc_uids:
                      type: array
                      description: >-
                        A list of user IDs subscribed by the agent in the RTC channel. Only subscribed users can
                        interact with the agent. Currently, only subscribing to one user ID is supported.
                      items:
                        type: string
                    enable_string_uid:
                      type: boolean
                      default: false
                      description: >-
                        Whether to enable String UID:

                        - `true`: Both agent and subscriber IDs use String UIDs.

                        - `false`: (Default) Both agent and subscriber IDs use Int UID.

                        > In the same channel, user IDs of type Int and String cannot be mixed. For more information
                        about using String UID, please refer to [How to use String user
                        ID](https://doc.shengwang.cn/faq/integration-issues/string-uid).
                    idle_timeout:
                      type: integer
                      description: >-
                        Maximum idle time of RTC channel (s). The time after it is detected that all users specified in
                        `remote_rtc_uids` have left the channel is regarded as the channel idle time. When it exceeds
                        the set maximum value, the channel's agent will automatically stop and exit the channel. If
                        filled with `0`, the agent will not stop until manually exited.
                      default: 30
                    advanced_features:
                      type: object
                      description: Advanced feature configuration.
                      properties:
                        enable_rtm:
                          type: boolean
                          description: >-
                            Whether to enable the real-time messaging RTM service. After being enabled, the agent will
                            automatically log in to RTM and subscribe to the channel specified in `channel`. It can
                            combine the capabilities provided by RTM to implement some advanced functions, such as
                            [delivering custom
                            information](https://doc.shengwang.cn/doc/convoai/restful/user-guides/custom-data).


                            > Before enabling the RTM service, you need to ensure that the Token has both RTC and RTM
                            permissions. When an agent joins the RTM channel, it will reuse the Token configured in the
                            `token` field. You can refer to
                            [FAQ](https://doc.shengwang.cn/faq/integration-issues/generate-token) to learn how to
                            generate a Token with both RTC and RTM permissions.
                          default: false
                        enable_sal:
                          type: boolean
                          description: >-
                            Whether to enable the Selective Attention Locking (SAL) function. After enabling it,
                            complete the relevant settings in the `sal` field, and the agent can identify the user's
                            voiceprint characteristics, effectively distinguish between different speakers, and block
                            95% of ambient human voices and noise.

                            > This feature is currently in beta.
                          default: false
                        enable_tools:
                          type: boolean
                          description: >-
                            Whether to enable the tool calling function. Once enabled, the agent can call the tools
                            provided by the MCP server to implement more complex business logic.
                          default: false
                    asr:
                      type: object
                      description: Automatic speech recognition (ASR) configuration.
                      properties:
                        language:
                          type: string
                          description: "Language used when the user interacts with the agent:\r\n- `zh-CN`: Chinese (supports mixed Chinese and English)\r\n- `en-US`: English"
                          default: zh-CN
                        vendor:
                          type: string
                          description: |-
                            ASR service provider, optional values:
                            - `fengming`: (Default) SoundNet Fengming ASR.
                            - `tencent`: Tencent ASR.
                            - `microsoft`: Microsoft ASR.
                            - `xfyun`: iFlytek traditional speech transcription recognition service.
                            - `xfyun_bigmodel`: iFlytek speech recognition large model service.
                            - `xfyun_dialect`: iFlytek dialect free speaking recognition service.
                        params:
                          $ref: "#/components/schemas/asr_params"
                          description: >-
                            Specify configuration parameters for the ASR provider.

                            > You can refer to the parameter filling examples of different ASR vendors in the calling
                            example.
                    tts:
                      type: object
                      description: Text-to-speech (TTS) module configuration.
                      required:
                        - vendor
                        - params
                      properties:
                        vendor:
                          type: string
                          description: |-
                            TTS provider, supports passing in the following values:
                            - `minimax`: Minimax TTS
                            - `tencent`: Tencent TTS
                            - `bytedance`: Volcano engine TTS
                            - `microsoft`: Microsoft Azure TTS
                            - `cosyvoice`: (Beta) Alibaba Cloud CosyVoice TTS
                            - `bytedance_duplex`: Volcano engine bidirectional streaming TTS
                            - `stepfun`: (Beta) Step Star TTS
                        skip_patterns:
                          type: array
                          description: >-
                            Filter mode configuration is used to control whether to skip the content in brackets in the
                            LLM return text to avoid the agent from broadcasting unnecessary structural prompt
                            information such as tone, action description, etc. The default value is `[]`, which does not
                            filter anything. The optional values are as follows. Passing in will enable this function:


                            - `1`: Skip the content in Chinese parentheses ( )

                            - `2`: Skip the content in Chinese square brackets [ ]

                            - `3`: Skip the content in English parentheses ( )

                            - `4`: Skip the content in English square brackets [ ]

                            - `5`: Skip the content in English curly braces \{ }


                            > - When there are nested brackets in the input text and multiple bracket types are
                            configured to skip, the agent only processes the outermost brackets, that is, the system
                            will start matching from the starting position of the text. Once the first outermost bracket
                            pair that meets the skip rules is found, the bracket pair and all the content it contains
                            (including any nested brackets of other types) will be skipped as a whole.

                            > - Regardless of whether [real-time
                            subtitles](https://doc.shengwang.cn/doc/convoai/restful/user-guides/realtime-sub) is turned
                            on or not, the agent short-term memory will contain the filtered content, that is, the
                            complete text generated by LLM.

                            > - When [Real-time
                            Subtitles](https://doc.shengwang.cn/doc/convoai/restful/user-guides/realtime-sub) is turned
                            on, the real-time subtitles will not include filtered content when TTS is broadcast. After
                            the sentence is broadcast, the subtitles will add these contents back.

                            > - Volcano engine bidirectional streaming TTS does not currently support this feature.
                          items:
                            type: integer
                          default: []
                        params:
                          $ref: "#/components/schemas/tts_params"
                          description: >-
                            Specify configuration parameters for the TTS provider.

                            > You can refer to the parameter filling examples for different TTS providers in the calling
                            example.
                    llm:
                      type: object
                      description: Large language model (LLM) configuration.
                      required:
                        - url
                      properties:
                        url:
                          type: string
                          description: LLM callback address, required to be compatible with the OpenAI protocol.
                        api_key:
                          type: string
                          description: >-
                            LLM authentication API key. The default is empty. The API key must be enabled in the
                            production environment.
                        system_messages:
                          type: array
                          description: >-
                            A set of predefined messages that are prepended every time LLM is called to control the LLM
                            output. It can be role settings, prompt words, answer samples, etc. Requires compatibility
                            with OpenAI protocol.
                          items:
                            type: object
                            additionalProperties: {}
                        max_history:
                          $ref: "#/components/schemas/max_history"
                        input_modalities:
                          type: array
                          description: "The input mode of LLM supports:\r\n- `[\"text\"]`: (default) text only.\r\n- `[\"text\", \"image\"]`: text plus image, requires the selected LLM to support visual modal input."
                          items:
                            type: string
                            default: text
                        output_modalities:
                          type: array
                          description: "The output mode of LLM supports:\r\n- `[\"text\"]`: (default) text only. The output text will be converted into speech by the TTS module and then published to the RTC channel.\r\n- `[\"audio\"]`: Speech only. Voice is posted directly to the RTC channel.\r\n- `[\"text\", \"audio\"]`: text plus voice. You can write your own logic to process the LLM output as needed."
                          items:
                            type: string
                        greeting_message:
                          type: string
                          description: >-
                            Agent greeting. If filled in, when there is no user in the subscriber list
                            (`remote_rtc_uids`) in the channel, the agent will automatically send a greeting to the
                            first subscriber who joins the channel.
                        greeting_configs:
                          type: object
                          description: Agent greeting broadcast configuration.
                          properties:
                            mode:
                              type: string
                              description: >-
                                Agent greeting broadcast mode supports the following options:

                                - `"single_every"`: (Default) The agent broadcasts a greeting every time a user joins
                                the empty channel.

                                - `"single_first"`: When only the first user joins the empty channel, the agent
                                broadcasts the greeting once.
                            delay_ms:
                              type: integer
                              description: >-
                                Agent greeting broadcast delay time (ms), the value range is [0, 5000]. After
                                configuration, the agent greeting will wait for the specified time before broadcasting
                                after the user joins the channel.
                        template_variables:
                          type: object
                          description: >-
                            Dynamic parameter configuration for inserting variables in the agent's `system_messages`,
                            `greeting_message`, `failure_message` and `parameters.silence_config.content` text. In the
                            form of key-value pairs, the key is the variable name and the value is the variable value.


                            **Usage**: Use the `{{variable_name}}` format to reference variables in the Prompt text, and
                            the system will automatically replace them with the corresponding values ​​defined in
                            `template_variables`.

                            > Note: Variable names and variable values ​​do not support referencing other variables. For
                            example, in the custom variable `"farewell": "Looking forward to seeing you next time,
                            {{name}}"`, the `{{name}}` in it will not be parsed.
                          additionalProperties:
                            type: string
                        failure_message:
                          type: string
                          description: >-
                            Agent processing failure prompt. If filled in, this will be returned via the TTS module on
                            an error in the LLM call.
                        vendor:
                          type: string
                          description: >-
                            LLM provider, supports the following two settings:

                            - Commercial large model provider, supports the following values:
                              - `aliyun`: Alibaba Cloud
                              - `bytedance`: Bytedance
                              - `deepseek`: deep search
                              - `tencent`：Tencent

                              Once set, it can improve compatibility and reduce request failures caused by carrying information not supported by LLM.
                            - Customize LLM, i.e. set to `"custom"`. After setting, when the agent calls custom LLM, in
                            addition to `role` and `content`, it will carry the following additional information:
                              - `turn_id`: unique conversation turn identifier. `turn_id` starts from 0 and increments, and a round of dialogue between the user and the agent corresponds to one `turn_id`.
                              - `timestamp`: request timestamp, precision is milliseconds.
                        mcp_servers:
                          type: array
                          description: >-
                            MCP (Model Context Protocol) server configuration list. By configuring the MCP server, the
                            agent can call tools provided by external services to implement more complex business logic.
                          items:
                            type: object
                            required:
                              - name
                              - endpoint
                            properties:
                              name:
                                type: string
                                description: >-
                                  The unique identifier of the MCP server. The length must not exceed 48 characters, and
                                  the following characters are supported:

                                  - All lowercase English letters: a to z

                                  - All uppercase English letters: A to Z

                                  - All numeric characters: 0 to 9

                                  - "." and "-"
                              endpoint:
                                type: string
                                description: >-
                                  The endpoint address of the MCP server through which the agent will communicate with
                                  the MCP server.
                              transport:
                                type: string
                                description: |-
                                  Transport protocol type, supports the following values:
                                  - `"streamable_http"`: streaming HTTP protocol
                              headers:
                                type: object
                                description: >-
                                  HTTP header information carried when requesting the MCP server, such as authentication
                                  information.
                                additionalProperties:
                                  type: string
                              allowed_tools:
                                type: array
                                description: >-
                                  A list of tools that the agent is allowed to call. Only tools in this list can be used
                                  by the agent.

                                  > `allowed_tools` field validation rules:

                                  > - Leave `allowed_tools` field unfilled: all tools take effect

                                  > - Fill in the `allowed_tools` field:

                                  > - Fill in as `[]`: all tools will not take effect

                                  > - Fill in as `["*"]`: all tools will take effect

                                  > - Fill in as `["aa", "bb", "cc"]`: `aa`, `bb`, `cc` are valid

                                  > - Fill in as `["aa", "bb", "*"]`: all tools will take effect
                                items:
                                  type: string
                              timeout_ms:
                                type: integer
                                description: >-
                                  MCP server request timeout, in milliseconds. After the request times out, the agent
                                  will not wait for the MCP server to respond, but will continue to execute subsequent
                                  logic.
                                default: 10000
                        headers:
                          type: object
                          description: >-
                            Custom request header included when requesting LLM. You can use this field to transparently
                            transmit business-related information such as business custom fields and tenant IDs.

                            > - The request header passed in by this parameter will be merged with the request header
                            generated by the conversational AI engine by default; when there is a key conflict, the
                            request header generated by the conversational AI engine will prevail (such as
                            authentication-related headers).

                            > - Header keys are merged according to exact string matching (case-sensitive). Shengwang
                            recommends using standard writing to avoid ambiguity caused by different case names with the
                            same name.
                          additionalProperties: {}
                        params:
                          type: object
                          description: >-
                            LLM additional information transmitted in the message body, such as the model used, the
                            maximum number of Tokens, etc. Different LLM vendors support different configurations.
                            Please refer to the corresponding documents to fill in the configuration as needed.
                          additionalProperties: {}
                    avatar:
                      type: object
                      description: Digital Man (Avatar) configuration.
                      properties:
                        enable:
                          type: boolean
                          description: >-
                            Whether to enable digital human functionality for the agent:

                            - `true`: enabled. After enabling, the `vendor` and `params` fields need to be configured.

                            - `false`: (Default) Not enabled.


                            > Enabling the digital human function will incur RTC video call charges. For details, please
                            see [RTC Billing
                            Instructions](https://doc.shengwang.cn/doc/rtc/android/billing/billing-strategy).
                        vendor:
                          type: string
                          description: |-
                            Digital human supplier, supports passing in the following values:
                            - `sensetime`: Sensetime digital person
                        params:
                          $ref: "#/components/schemas/avatar_params"
                          description: >-
                            Specify configuration parameters for the digital human provider.

                            > You can refer to the parameter filling examples of different digital human suppliers in
                            the calling example.
                    turn_detection:
                      type: object
                      description: >-
                        Conversation turn detection settings, used to control voice activity detection and conversation
                        turn determination logic.


                        > Since v2.6, `turn_detection` is only responsible for start of speech (SoS) and end of speech
                        (EoS) detection. The processing strategies for keyword interruption and closing interruptions
                        have been moved to the top-level `interruption` field.
                      properties:
                        mode:
                          type: string
                          description: >-
                            Dialog turn detection mode, currently supports the following values:

                            - `"default"`: (Default) Default mode, using standard conversation turn detection
                            configuration.
                          enum:
                            - default
                          default: default
                        config:
                          type: object
                          description: Conversation turn detection detailed configuration.
                          properties:
                            speech_threshold:
                              type: number
                              description: >-
                                Speech recognition sensitivity, the value range is (0.0, 1.0). Determines what level of
                                sound in the audio signal is considered "speech activity". Lower values ​​will make it
                                easier for the agent to detect speech, higher values ​​may ignore faint sounds.
                              format: float
                              default: 0.5
                            start_of_speech:
                              type: object
                              description: Start of Speech (SoS) detection configuration to determine when a user starts speaking.
                              properties:
                                mode:
                                  type: string
                                  description: >-
                                    Conversation start detection mode, supports the following values:

                                    - `"vad"`: (Default) Trigger based on VAD (Voice Activity Detection), using audio
                                    signal detection.

                                    - `"keywords"`: Deprecated, please use `properties.interruption.mode = "keywords"`
                                    to configure keyword interruption instead.

                                    - `"disabled"`: Deprecated, please use `properties.interruption.enable = false`
                                    instead with `properties.interruption.disabled_config.strategy` to configure the
                                    processing strategy after turning off interruption.
                                "{mode}_config":
                                  $ref: "#/components/schemas/start_of_speech_config"
                                  description: >-
                                    The dialog starts detecting configuration parameters. Pass in the corresponding
                                    configuration fields according to `mode`.
                            end_of_speech:
                              type: object
                              description: >-
                                End of Speech (EoS) detection configuration, used to determine when the user has
                                finished speaking.
                              properties:
                                mode:
                                  type: string
                                  description: >-
                                    Conversation end detection mode, supports the following values:

                                    - `"vad"`: (Default) Trigger based on VAD (Voice Activity Detection), detecting
                                    silence duration.

                                    - `"semantic"`: Based on semantic triggering, the semantic understanding module is
                                    used to determine the end of the conversation. This mode currently only supports
                                    recognition of Chinese and English text.
                                "{mode}_config":
                                  $ref: "#/components/schemas/end_of_speech_config"
                                  description: >-
                                    The end of the session checks the configuration parameters. Pass in the
                                    corresponding configuration fields according to `mode`.
                    interruption:
                      type: object
                      description: >-
                        Intelligent interruption control configuration is used to uniformly manage the behavior strategy
                        of agents interrupted by users.
                      properties:
                        enable:
                          type: boolean
                          default: true
                          description: |-
                            Whether to enable the agent interruption function:
                            - `true`: (default) enabled.
                            - `false`: off. After closing, the agent will not be interrupted midway.
                        mode:
                          type: string
                          default: start_of_speech
                          description: >-
                            Interrupt triggering mode, supports the following values:

                            - `"start_of_speech"`: (Default) Trigger interrupt when user starts speaking.

                            - `"keywords"`: Trigger interruption when the user speaks the specified keyword. Configure
                            the trigger keyword in the `keywords_config` field.
                        keywords_config:
                          type: object
                          description: >-
                            Configuration of triggering interrupts based on keywords. Only takes effect when `mode =
                            "keywords"`.
                          properties:
                            trigger_keywords:
                              type: array
                              description: List of keywords that trigger interruption. Supports setting up to 128 keywords.
                              items:
                                type: string
                        disabled_config:
                          type: object
                          description: >-
                            The processing strategy after turning off the interruption function. Only takes effect when
                            `interruption.enable` is `false`.
                          properties:
                            strategy:
                              type: string
                              description: >-
                                The processing strategy after turning off the interrupt function supports the following
                                values:

                                - `"append"`: Append mode, the human voice does not interrupt the agent. The agent will
                                process the vocal request just received after the current interaction ends.

                                - `"ignore"`: ignore mode, the agent ignores vocal requests. If the agent receives a
                                human voice while speaking or thinking, the agent will directly ignore and discard the
                                human voice request without storing the context.
                    sal:
                      type: object
                      description: |-
                        Selective Attention Locking (SAL) configuration.
                        > This feature is currently in beta.
                      properties:
                        sal_mode:
                          type: string
                          description: >-
                            Selective attention lock mode, supports the following options:

                            - `"locking"`: (Default) presenter locking mode. The intelligent body locks on the speaker
                            and blocks 95% of ambient human voices and noise. This mode can be enabled in two ways:
                              - Senseless recognition: If the user speaks loudly and clearly at the beginning of the conversation, the agent can automatically identify the user as the speaker.
                              - Pre-registration: When creating an agent, pre-register the voiceprint URL of a speaker through the `sample_urls` field, and the agent will lock the speaker based on the pre-registered voiceprint URL.
                            - `"recognition"`: Voiceprint recognition mode. You can pre-register the voiceprint URL
                            through the `sample_urls` field. Currently, only single voiceprint registration is
                            supported. The agent will recognize different speakers and suppress other background vocals
                            and environmental noise. The recognized speaker identity will be identified and sent to LLM
                            through the `vpids` field in the `metadata` field. You need to set `llm.vendor` to
                            `"custom"` and refer to [Customized Large
                            Model](/doc/convoai/restful/user-guides/custom-llm) to learn how to let LLM process speaker
                            information.
                          default: locking
                        sample_urls:
                          type: object
                          description: >-
                            The registered voiceprint URL is in the form of a key-value pair. The key is the registered
                            voiceprint name, and the value is the voiceprint URL download address of the corresponding
                            speaker.

                            > - The incoming voiceprint name cannot be set to `"unknown"`, which is a reserved keyword
                            used to identify unknown speakers.

                            > - For registered voiceprints, the following conditions must be met:

                            > - Quantity: The number of registered voiceprint URLs requested by each task. Currently,
                            only single voiceprint is supported, and the quantity is 1.

                            > - Size: A single voiceprint file must not exceed 2 MB.

                            > - Duration: The duration is 10 to 15 seconds, of which the effective audio is not less
                            than 8 seconds (cannot have too many silent segments).

                            > - Format: Must be a 16k sampling rate, 16bit bit depth, mono PCM audio file, the file name
                            suffix must be `.pcm`.
                    labels:
                      type: object
                      description: >-
                        Custom tags, in the form of key-value pairs, where the key is the tag name and the value is the
                        tag value. Used to allow intelligent agents to carry customized business information.


                        These custom information will be bound to the agent and returned in the `payload` field of all
                        types of message notification callbacks in the conversational AI engine. It can be used to
                        implement custom business logic, such as marking activity IDs, customer groupings, business
                        scenarios, etc.
                      additionalProperties:
                        type: string
                    rtc:
                      type: object
                      description: RTC media content encryption configuration.
                      properties:
                        encryption_key:
                          type: string
                          description: |-
                            Encryption key of type string with no limit on length. Agora recommends using a 32-byte key.
                            > If the encryption key is not set or is set to empty, built-in encryption cannot be used.
                        encryption_salt:
                          type: string
                          description: >-
                            Salt value used for encryption, Base64 encoded string, decoded to 32 bytes in length.

                            > This parameter only takes effect when `encryption_mode` is set to `7` (AES_128_GCM2) or
                            `8` (AES_256_GCM2). In this case, make sure the parameter is not empty.
                        encryption_mode:
                          type: integer
                          description: >-
                            Built-in encryption mode, supports the following values:

                            - `1`: AES_128_XTS - 128-bit AES encryption, XTS mode.

                            - `2`: AES_128_ECB - 128-bit AES encryption, ECB mode.

                            - `3`: AES_256_XTS - 256-bit AES encryption, XTS mode.

                            - `4`: SM4_128_ECB - 128-bit SM4 encryption, ECB mode.

                            - `5`: AES_128_GCM - 128-bit AES encryption, GCM mode.

                            - `6`: AES_256_GCM - 256-bit AES encryption, GCM mode.

                            - `7`: AES_128_GCM2 - 128-bit AES encryption, GCM mode. This mode requires salt
                            (`encryption_salt`) to be set.

                            - `8`: AES_256_GCM2 - 256-bit AES encryption, GCM mode. This mode requires salt
                            (`encryption_salt`) to be set.


                            > Agora recommends using `7` (AES_128_GCM2) or `8` (AES_256_GCM2) mode. These two modes
                            support the use of encryption salts to improve security.
                    filler_words:
                      type: object
                      description: >-
                        The padding function (Beta) configuration is used to broadcast padding when LLM is waiting for a
                        response, so as to relieve the user's waiting anxiety and improve the smoothness of the
                        conversation.


                        Pre-word broadcasting follows the following rules:

                        - **Broadcast Order**: When multiple pad words or LLM responses are waiting to be broadcast,
                        they will be broadcast in the order in which the texts arrive.

                        - **Interruption Control**: Inherit the interruption mode setting in the global configuration
                        (`turn_detection.config`).
                      properties:
                        enable:
                          type: boolean
                          description: |-
                            Whether to enable the padding function:
                            - `true`: enabled.
                            - `false`: (Default) Not enabled.
                          default: false
                        trigger:
                          type: object
                          description: The pre-word trigger configuration defines when to trigger the pre-word broadcast.
                          properties:
                            mode:
                              type: string
                              description: >-
                                Pad word trigger mode supports the following values:

                                - `"fixed_time"`: Fixed time trigger. When the LLM response waiting time exceeds the set
                                threshold, a pad word broadcast is triggered.
                            "{mode}_config":
                              $ref: "#/components/schemas/filler_words_trigger_config"
                              description: >-
                                Pad words trigger configuration parameters. Select the corresponding configuration
                                according to `mode`.
                        content:
                          type: object
                          description: >-
                            Configure the content of the pad words, and define the source and selection rules of the pad
                            words.
                          properties:
                            mode:
                              type: string
                              description: |-
                                Pad content mode, supports the following values:

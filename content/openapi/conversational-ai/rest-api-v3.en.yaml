          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Campaigns
      summary: Update a campaign
      description: Changes the pacing, schedule, or dialing limits of a campaign.
      operationId: update-campaign
      x-docs-sections:
        - position: after-description
          markdown: >-
            Before the campaign starts dialing, you can change `pacing`, `schedule`, `lifecycle`,
            and `transport.call_policy`. After it starts, you can change only `pacing`.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
            example:
              pacing:
                max_concurrent: 2
      responses:
        "200":
          description: The campaign was updated. The response body contains the full campaign.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`MissingRequiredField`: The `If-Match` header is missing."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `CampaignNotEditable`: The field can't be changed in the campaign's current state.
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Campaigns
      summary: Delete a campaign
      description: Deletes a campaign that has finished or been canceled.
      operationId: delete-campaign
      x-docs-sections:
        - position: after-description
          markdown: >-
            You can delete a campaign whose status is `completed`, `canceled`, or `failed`. To
            delete a campaign that is `scheduled`, `running`, or `paused`, [cancel
            it](/en/api-reference/api-ref/conversational-ai/v3/cancel-campaign) first.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: The campaign was deleted.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `CampaignActive`: The campaign is `scheduled`, `running`, or `paused`. Cancel it first.
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Delete of a `failed` campaign is assumed allowed (only canceled was
      # tested).
  /v3/projects/{appid}/campaigns/{campaign_id}:pause:
    post:
      tags:
        - Campaigns
      summary: Pause a campaign
      description: Stops a running campaign from placing new calls.
      operationId: pause-campaign
      x-docs-sections:
        - position: after-description
          markdown: >-
            You can pause a campaign whose status is `running`. To continue dialing, [resume the
            campaign](/en/api-reference/api-ref/conversational-ai/v3/resume-campaign).
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: The campaign was paused. The response body contains the campaign.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`CampaignInvalidState`: The campaign isn't `running`."
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Whether calls in progress continue when the campaign is paused. Only the
      # 409 path was tested on staging.
  /v3/projects/{appid}/campaigns/{campaign_id}:resume:
    post:
      tags:
        - Campaigns
      summary: Resume a campaign
      description: Continues dialing a paused campaign.
      operationId: resume-campaign
      x-docs-sections:
        - position: after-description
          markdown: You can resume a campaign whose status is `paused`.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: The campaign was resumed. The response body contains the campaign.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`CampaignInvalidState`: The campaign isn't `paused`."
        default:
          $ref: "#/components/responses/Error"
  /v3/projects/{appid}/campaigns/{campaign_id}:cancel:
    post:
      tags:
        - Campaigns
      summary: Cancel a campaign
      description: Ends a campaign permanently.
      operationId: cancel-campaign
      x-docs-sections:
        - position: after-description
          markdown: >-
            Canceling is permanent. Contacts that haven't been called yet change to `canceled`,
            and you can't resume the campaign.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: The campaign was canceled. The response body contains the campaign.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`CampaignInvalidState`: The campaign has already ended or been canceled."
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Whether calls in progress are hung up on cancel.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use Basic HTTP authentication with your Agora customer ID and customer secret.
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Use an RTC token in the format `agora token=<your_token>`.
  parameters:
    AppId:
      name: appid
      in: path
      required: true
      schema:
        type: string
      description: The App ID of your project.
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The ID of the agent, returned in `agent_id` when you create the agent.
    SecretSetName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: The name of the secret set.
    SecretKeyName:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: >-
        The name of the key in the secret set. When you add a key, use 1 to 64 characters from
        `A-Z`, `a-z`, `0-9`, `_`, and `-`.
    NumberId:
      name: number_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The ID of the phone number, returned in `number_id` when you create the number.
    AgentSessionId:
      name: agent_session_id
      in: path
      required: true
      schema:
        type: string
      description: >-
        The ID of the session, returned in `agent_session_id` when you start the session.
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The ID of the campaign, returned in `campaign_id` when you create the campaign.
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
      description: >-
        The `ETag` value from the most recent response for this resource. If the resource has
        changed since then, the request fails with `412` and reason `PreconditionFailed`. Retrieve
        the resource to get the current `ETag`, and try again.
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
      description: >-
        The `ETag` value from the most recent response for this resource. When you include it,
        the request fails with `412` and reason `PreconditionFailed` if the resource has changed
        since then. Use it to avoid overwriting a concurrent change.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
      description: >-
        A unique key that makes the request safe to retry. If you send the same key with the same
        body again, the API returns the original response with the `Idempotent-Replayed: true`
        header instead of creating another resource. If you send the same key with a different
        body, the request fails with `409` and reason `IdempotencyKeyConflict`.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
      description: >-
        The `next_cursor` value from the previous page of results. Omit it to get the first page.
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum:
          - create_ts.desc
          - create_ts.asc
        default: create_ts.desc
      description: |-
        The sort order of the results:

        - `create_ts.desc`: Newest first.
        - `create_ts.asc`: Oldest first.
  headers:
    Agora-Request-Id:
      description: A unique ID for the request. Include it when you contact Agora support.
      schema:
        type: string
    ETag:
      description: >-
        The current version of the resource. Pass this value in the `If-Match` header of your next
        update or delete request for this resource.
      schema:
        type: string
    Location:
      description: The path of the new resource.
      schema:
        type: string
    Idempotent-Replayed:
      description: >-
        `true` when the response replays an earlier request that used the same `Idempotency-Key`.
      schema:
        type: string
  responses:
    BadRequest:
      description: >-
        The request is invalid. Check `reason` and `detail` in the response body.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: >-
        Authentication failed. The reason is `InvalidPermission`. Check your credentials in the
        `Authorization` header.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource doesn't exist. The reason is `ResourceNotFound`.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionFailed:
      description: >-
        The `If-Match` value doesn't match the current version of the resource. The reason is
        `PreconditionFailed`. The `ETag` header contains the current version.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error:
      description: >-
        The request failed. The response body contains the `reason` and `detail` of the failure.
        For possible reasons, see [Status codes](/en/api-reference/api-ref/conversational-ai/v3/status-codes).
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - detail
        - reason
      properties:
        detail:
          type: string
          description: A human-readable description of the error.
        reason:
          type: string
          description: >-
            A machine-readable error reason, such as `InvalidFieldValue` or `ResourceNotFound`.
            For all reasons, see [Status codes](/en/api-reference/api-ref/conversational-ai/v3/status-codes).
      example:
        detail: Resource not found.
        reason: ResourceNotFound
    Deleted:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
          const: true
          description: Always `true`. The resource is deleted.
      example:
        deleted: true
    ListPageInfo:
      type: object
      properties:
        has_more:
          type: boolean
          description: Whether more results are available after this page.
        next_cursor:
          type:
            - string
            - "null"
          description: >-
            The cursor for the next page. Pass it in the `cursor` query parameter of your next
            request. `null` when there are no more results.

    # ---------------------------------------------------------------------------------------------
    # Agents
    # ---------------------------------------------------------------------------------------------
    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
          description: |-
            The author of the message:

            - `system`: An instruction to the model.
            - `user`: A message from the user.
            - `assistant`: A message from the agent.
        content:
          type: string
          description: The text of the message.
    Greeting:
      type: object
      required:
        - mode
        - text
      description: The message the agent speaks when a user joins.
      properties:
        mode:
          type: string
          enum:
            - text
            - audio
          description: |-
            How the agent delivers the greeting:

            - `text`: The agent speaks `text` using the TTS module.
            - `audio`: The agent plays the pre-recorded audio file at `url`. If the file can't be
              downloaded or played, the agent speaks `text` instead.
        "on":
          type: string
          enum:
            - each_join
            - first_join
          default: each_join
          description: |-
            When the agent greets users:

            - `each_join`: Every time a user joins.
            - `first_join`: Only when the first user joins.
        delay_ms:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
          description: >-
            The delay in milliseconds between a user joining and the agent starting the greeting.
        text:
          type: string
          minLength: 1
          description: >-
            The greeting text. When `mode` is `audio`, the agent uses this text as a fallback if the
            audio file fails, and to keep the conversation context accurate if the user interrupts
            the greeting.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            The `http://` or `https://` URL of the greeting audio file. Supported formats are
            `mp3`, `wav`, and `pcm`. Required when `mode` is `audio`.
        download_timeout_ms:
          type: integer
          minimum: 200
          maximum: 10000
          default: 1000
          description: >-
            The timeout in milliseconds for downloading the audio file. If the download times out,
            the agent speaks `text` instead. Applies only when `mode` is `audio`.
        pcm_sample_rate:
          type: integer
          minimum: 1
          default: 16000
          description: >-
            The sample rate in Hz of the audio file when its format is `pcm`. Not needed for `mp3`
            or `wav` files. Applies only when `mode` is `audio`.
    VariableDefinition:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - str
            - int
            - float
            - bool
            - date
            - datetime
          description: The data type of the variable value.
        required:
          type: boolean
          default: false
          description: >-
            Whether you must pass a value for this variable in `values` when you start a session.
        options:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type:
              - string
              - number
              - boolean
          description: The allowed values for the variable. Omit it to allow any value of `type`.
        extract:
          type: boolean
          default: false
          description: >-
            Whether to fill this variable from the conversation transcript after the session ends.
            When `true`, `description` is required and serves as the extraction instruction. The
            extracted values appear in the session's `analysis.result`.
        description:
          type: string
          maxLength: 2000
          description: >-
            What the variable represents. Required when `extract` is `true`.
    Variables:
      type: object
      propertyNames:
        pattern: ^[a-z][a-z0-9_]{0,63}$
      additionalProperties:
        $ref: "#/components/schemas/VariableDefinition"
      description: >-
        The template variables the agent accepts, keyed by variable name. A name starts with a
        lowercase letter and contains up to 64 lowercase letters, digits, and underscores. To
        reference a variable in the agent's text, use `{{variable_name}}`. Pass the values in
        `values` when you start a session or in each campaign contact.
      example:
        customer_name:
          type: str
          required: true
        appointment_confirmed:
          type: bool
          extract: true
          description: Whether the customer confirmed the appointment.
    FillerWords:
      type: object
      description: >-
        Filler words that the agent plays while it waits for the LLM to respond, such as when it
        waits for a tool call or retrieval result. Filler words follow the `interruption` settings
        of the pipeline.
      properties:
        enable:
          type: boolean
          default: false
          description: Whether to play filler words.
        trigger:
          type: object
          required:
            - mode
            - response_wait_ms
          description: When to play a filler word.
          properties:
            mode:
              type: string
              const: fixed_time
              description: >-
                `fixed_time`: Play a filler word when the LLM hasn't responded within
                `response_wait_ms`.
            response_wait_ms:
              type: integer
              minimum: 100
              maximum: 10000
              default: 1500
              description: >-
                How long in milliseconds to wait for the LLM response before playing a filler word.
        content:
          type: object
          required:
            - mode
          description: Where the filler words come from.
          properties:
            mode:
              type: string
              enum:
                - static
                - generated
              description: |-
                The source of the filler words:

                - `static`: Pick a phrase from `phrases`.
                - `generated`: Generate a phrase that fits the conversation, based on
                  `instructions`.
            phrases:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: string
                minLength: 1
              description: >-
                The filler word phrases. Each phrase is up to 20 words for Latin scripts, or 20
                characters for Chinese and other non-Latin scripts. Required when `mode` is
                `static`.
            selection_rule:
              type: string
              enum:
                - shuffle
                - round_robin
              default: shuffle
              description: |-
                How the agent picks the next phrase. Applies when `mode` is `static`.

                - `shuffle`: In random order, without repeats until every phrase is used once.
                - `round_robin`: In list order, starting over after the last phrase.
            instructions:
              type: string
              description: >-
                The prompt used to generate filler words. Required when `mode` is `generated`.
            fallback_strategy:
              type: string
              const: static
              description: >-
                What to do when a generated phrase isn't ready in time. `static`: Play a static
                filler word instead. Applies when `mode` is `generated`.
    Credential:
      type: object
      required:
        - mode
      description: How this stage authenticates with the vendor.
      properties:
        mode:
          type: string
          enum:
            - managed
            - byok
          description: |-
            The credential mode:

            - `managed`: Agora provides the vendor credentials. You don't need a vendor account.
            - `byok`: Bring your own key. Pass your vendor API key in `api_key`.
        api_key:
          type: string
          minLength: 1
          writeOnly: true
          description: >-
            Your vendor API key. Required when `mode` is `byok`. To keep the key out of the agent
            configuration, store it in a [secret set](/en/api-reference/api-ref/conversational-ai/v3/create-secret-set)
            and pass a reference in the format `$secrets.<set_name>.<key>` instead. The API never
            returns this value.
      # TODO(v3-confirm): `$secrets.<set>.<key>` references in api_key come from the contract
      # schema and were not exercised in the staging tests. Confirm before publishing.
    AsrConfig:
      type: object
      description: The automatic speech recognition (ASR) stage, which transcribes the user's speech.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          description: The ASR vendor, for example `deepgram`.
        model:
          type: string
          description: The vendor model to use.
        language:
          type: string
          description: The language of the user's speech, for example `en`.
        params:
          type: object
          additionalProperties: true
          description: >-
            Vendor-specific settings, passed to the vendor as they are. When `credential.mode` is
            `managed`, include the vendor's default endpoint in `params.url`, for example
            `wss://api.deepgram.com/v1/listen`. Keep API keys in `credential.api_key`, not here.
      # TODO(v3-confirm): The staging guide puts the managed ASR endpoint in `params.url` (verified
      # by a session start on 13 Oct). Staging correction C3 says `pipeline.asr.url` is required.
      # Confirm the one location, and get the list of accepted managed endpoints per vendor.
    LlmConfig:
      type: object
      description: The large language model (LLM) stage, which generates the agent's replies.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        url:
          type: string
          format: uri
          description: >-
            The vendor's chat completions endpoint, for example
            `https://api.openai.com/v1/chat/completions`. Required when `credential.mode` is
            `managed`. Only the vendor's default endpoint is supported.
        vendor:
          type: string
          description: The LLM vendor, for example `openai`.
        style:
          type: string
          enum:
            - openai
            - gemini
            - anthropic
            - dify
          description: |-
            The request format of the chat completions API:

            - `openai`: OpenAI and OpenAI-compatible APIs.
            - `gemini`: Google Gemini and Google Vertex AI.
            - `anthropic`: Anthropic Claude.
            - `dify`: Dify.
        model:
          type: string
          description: The vendor model to use, for example `gpt-4.1-mini`.
        params:
          type: object
          additionalProperties: true
          description: >-
            Vendor-specific settings, such as the maximum number of tokens, passed to the vendor as
            they are. Keep API keys in `credential.api_key`, not here.
        input_modalities:
          type: array
          items:
            type: string
          description: |-
            The input types the LLM accepts:

            - `["text"]`: Text only.
            - `["text", "image"]`: Text and images. The model must support image input.
        output_modalities:
          type: array
          items:
            type: string
          description: >-
            The output types the LLM produces. `["text"]`: The TTS stage converts the text to
            speech.
        max_history:
          type: integer
          minimum: 1
          maximum: 1024
          default: 32
          description: >-
            The number of recent conversation messages the LLM keeps as context. The agent's
            `instructions` don't count toward this limit.
        failure_message:
          type: string
          description: >-
            The message the agent speaks when the LLM request fails. If you omit it, the agent says
            nothing.
    TtsConfig:
      type: object
      description: The text-to-speech (TTS) stage, which converts the agent's replies to speech.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          description: The TTS vendor, for example `minimax`.
        model:
          type: string
          description: The vendor model to use.
        params:
          type: object
          additionalProperties: true
          description: >-
            Vendor-specific settings, such as the voice and sample rate, passed to the vendor as
            they are. When `credential.mode` is `managed`, include the vendor's default endpoint in
            `params.url`, for example `wss://api.minimax.io/ws/v1/t2a_v2`. Keep API keys in
            `credential.api_key`, not here.
        skip_patterns:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - fullwidth_parentheses
              - lenticular_brackets
              - parentheses
              - square_brackets
              - curly_braces
          description: |-
            Bracketed text that the agent doesn't speak, such as tone or action notes in the LLM
            output:

            - `fullwidth_parentheses`: Text in `（）`.
            - `lenticular_brackets`: Text in `【】`.
            - `parentheses`: Text in `( )`.
            - `square_brackets`: Text in `[ ]`.
            - `curly_braces`: Text in `{ }`.

            The agent's conversation history keeps the full text.
      # TODO(v3-confirm): Several managed TTS setups returned `InvalidModuleParameter` on staging
      # (Microsoft, Deepgram, MiniMax without `audio_setting`). Get the supported managed TTS
      # vendors and their required params.
    AvatarConfig:
      type: object
      description: The avatar that represents the agent on video.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to show the avatar.
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          enum:
            - akool
            - liveavatar
            - anam
            - generic
          description: The avatar vendor.
        params:
          type: object
          additionalProperties: true
          description: Vendor-specific settings, passed to the vendor as they are.
    MllmConfig:
      type: object
      required:
        - vendor
      description: >-
        The multimodal LLM (MLLM) that listens and speaks directly, without separate ASR and TTS
        stages.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          description: The MLLM vendor, for example `openai`.
        model:
          type: string
          description: The vendor model to use.
        params:
          type: object
          additionalProperties: true
          description: >-
            Vendor-specific settings, such as the voice, passed to the vendor as they are. Keep API
            keys in `credential.api_key`, not here.
        input_modalities:
          type: array
          items:
            type: string
            enum:
              - text
              - audio
          description: The input types the MLLM accepts.
        output_modalities:
          type: array
          items:
            type: string
            enum:
              - text
              - audio
          description: The output types the MLLM produces.
    StartOfSpeech:
      type: object
      required:
        - type
      description: How the agent detects that the user starts speaking.
      properties:
        type:
          type: string
          enum:
            - semantic
            - vad
            - manual
          description: |-
            The detection method:

            - `semantic`: Uses semantic understanding of the speech.
            - `vad`: Uses voice activity detection (VAD) on the audio signal.
            - `manual`: Turns off automatic detection. Your client signals when the user starts
              speaking.
        interrupt_duration_ms:
          type: integer
          default: 160
          description: >-
            How long in milliseconds the user's voice must exceed the VAD threshold to count as
            speech. Applies when `type` is `vad`.
        speaking_interrupt_duration_ms:
          type: integer
          default: 160
          description: >-
            How long in milliseconds the user must speak to interrupt the agent while the agent is
            speaking. Applies when `type` is `semantic` or `vad`.
        prefix_padding_ms:
          type: integer
          default: 800
          description: >-
            How many milliseconds of audio before the detected start of speech to include, so the
            beginning of the speech isn't lost. Applies when `type` is `vad`.
    EndOfSpeech:
      type: object
      required:
        - type
      description: How the agent detects that the user has finished speaking.
      properties:
        type:
          type: string
          enum:
            - semantic
            - vad
            - manual
          description: |-
            The detection method:

            - `semantic`: Uses semantic understanding to decide whether the user has finished.
              Supports English and Chinese. For other languages, the agent uses VAD.
            - `vad`: Uses the length of the silence after the speech.
            - `manual`: Turns off automatic detection. Your client signals when the user stops
              speaking.
        silence_duration_ms:
          type: integer
          minimum: 120
          maximum: 2000
          description: >-
            The minimum silence in milliseconds at the end of speech, so that a short pause doesn't
            end the turn. Defaults to `320` when `type` is `semantic` and `640` when `type` is
            `vad`.
        max_wait_ms:
          type: integer
          minimum: 500
          maximum: 10000
          default: 3000
          description: >-
            The maximum time in milliseconds to wait for a semantic decision. After this time, the
            agent decides based on the current state. Applies when `type` is `semantic`.
        pause_state_enabled:
          type: boolean
          default: true
          description: >-
            Whether the agent waits for more input when the user signals a pause, for example by
            saying "hold on" or "just a moment". Applies when `type` is `semantic`.
    Interruption:
      type: object
      required:
        - mode
      description: How the user can interrupt the agent while it speaks or thinks.
      properties:
        mode:
          type: string
          enum:
            - start_of_speech
            - keywords
            - "off"
          default: start_of_speech
          description: |-
            The interruption mode:

            - `start_of_speech`: Any user speech interrupts the agent.
            - `keywords`: Only the phrases in `keywords` interrupt the agent.
            - `off`: The user can't interrupt the agent. Set `when_off` to choose what happens to
              the user's speech.
        keywords:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: string
            minLength: 1
          description: >-
            The words or phrases that interrupt the agent. Recognition depends on the ASR vendor.
            Required when `mode` is `keywords`.
        when_off:
          type: string
          enum:
            - append
            - ignore
          default: append
          description: |-
            What happens to user speech that arrives while the agent speaks or thinks. Applies when
            `mode` is `off`.

            - `append`: The agent responds to the speech after it finishes the current reply.
            - `ignore`: The agent discards the speech and doesn't keep it in the context.
    TurnDetection:
      type: object
      description: How the agent detects when the user starts and stops speaking, and handles interruptions.
      properties:
        speech_threshold:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          default: 0.5
          description: >-
            The voice activity detection sensitivity. Lower values detect quieter speech. Higher
            values ignore weak sounds.
        start_of_speech:
          $ref: "#/components/schemas/StartOfSpeech"
        end_of_speech:
          $ref: "#/components/schemas/EndOfSpeech"
        interruption:
          $ref: "#/components/schemas/Interruption"
      # TODO(v3-confirm): V2 manual mode needs RTM enabled. V3 exposes no RTM setting. Confirm how
      # clients signal turns in `manual` mode.
    RealtimeTurnDetection:
      type: object
      required:
        - type
      description: How the realtime pipeline detects turns.
      properties:
        type:
          type: string
          enum:
            - agora_vad
            - server_vad
            - semantic_vad
          description: |-
            The detection method:

            - `agora_vad`: Agora voice activity detection (VAD).
            - `server_vad`: The vendor's VAD. Supported by OpenAI Realtime API and Gemini Live.
            - `semantic_vad`: The vendor's semantic detection. Supported by OpenAI Realtime API.
        interrupt_duration_ms:
          type: integer
          minimum: 0
          description: >-
            The minimum duration of speech in milliseconds that interrupts the agent. Applies when
            `type` is `agora_vad`.
        prefix_padding_ms:
          type: integer
          minimum: 0
          description: >-
            How many milliseconds of audio before the detected start of speech to include. Applies
            when `type` is `agora_vad` or `server_vad`.
        silence_duration_ms:
          type: integer
          minimum: 0
          description: >-
            The silence in milliseconds that marks the end of speech. Applies when `type` is
            `agora_vad` or `server_vad`.
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            The VAD sensitivity. Higher values reduce false detections. Applies when `type` is
            `agora_vad`, or `server_vad` with OpenAI Realtime API.
        idle_timeout_ms:
          type: integer
          minimum: 0
          description: >-
            The idle timeout in milliseconds. Applies when `type` is `server_vad` with OpenAI
            Realtime API.
        start_of_speech_sensitivity:
          type: string
          enum:
            - START_SENSITIVITY_HIGH
            - START_SENSITIVITY_LOW
          description: >-
            The sensitivity of start-of-speech detection. Applies when `type` is `server_vad` with
            Gemini Live.
        end_of_speech_sensitivity:
          type: string
          enum:
            - END_SENSITIVITY_HIGH
            - END_SENSITIVITY_LOW
          description: >-
            The sensitivity of end-of-speech detection. Applies when `type` is `server_vad` with
            Gemini Live.
        eagerness:
          type: string
          enum:
            - auto
            - low
            - medium
            - high
          description: >-
            How readily the model ends its turn. Applies when `type` is `semantic_vad`.
    SilenceConfig:
      type: object
      required:
        - enabled
        - timeout_ms
        - action
        - content
      description: What the agent does when the conversation is silent for too long.
      properties:
        enabled:
          type: boolean
          description: Whether to act on silence.
        timeout_ms:
          type: integer
          description: >-
            How long in milliseconds the agent can stay silent before it acts. The agent is silent
            when it isn't listening, thinking, or speaking.
        action:
          type: string
          enum:
            - speak
            - think
          description: |-
            What the agent does when the timeout is reached:

            - `speak`: Speaks `content` using the TTS module.
            - `think`: Adds `content` to the LLM context as a prompt and responds to it.
        content:
          type: string
          description: The message to speak, or the prompt to send to the LLM, depending on `action`.
    CascadedPipeline:
      type: object
      title: Cascaded pipeline
      required:
        - mode
      description: >-
        A pipeline of separate ASR, LLM, and TTS stages. The agent transcribes the user's speech,
        generates a reply, and converts the reply to speech.
      properties:
        mode:
          type: string
          const: cascaded
          description: "`cascaded`: A pipeline of separate ASR, LLM, and TTS stages."
        asr:
          $ref: "#/components/schemas/AsrConfig"
        llm:
          $ref: "#/components/schemas/LlmConfig"
        tts:
          $ref: "#/components/schemas/TtsConfig"
        turn_detection:
          $ref: "#/components/schemas/TurnDetection"
        silence_config:
          $ref: "#/components/schemas/SilenceConfig"
        avatar:
          $ref: "#/components/schemas/AvatarConfig"
    RealtimePipeline:
      type: object
      title: Realtime pipeline
      required:
        - mode
      description: >-
        A pipeline built on one multimodal LLM (MLLM) that listens and speaks directly.
      properties:
        mode:
          type: string
          const: realtime
          description: "`realtime`: A pipeline built on one multimodal LLM."
        mllm:
          $ref: "#/components/schemas/MllmConfig"
        turn_detection:
          $ref: "#/components/schemas/RealtimeTurnDetection"
        avatar:
          $ref: "#/components/schemas/AvatarConfig"
    Pipeline:
      description: >-
        The models that power the agent. Use a cascaded pipeline of ASR, LLM, and TTS stages, or a
        realtime pipeline built on one multimodal LLM.
      oneOf:
        - $ref: "#/components/schemas/CascadedPipeline"
        - $ref: "#/components/schemas/RealtimePipeline"
      discriminator:
        propertyName: mode
        mapping:
          cascaded: "#/components/schemas/CascadedPipeline"
          realtime: "#/components/schemas/RealtimePipeline"
    AgentName:
      type: string
      minLength: 1
      description: A name for the agent that helps you identify it.
    Instructions:
      type: string
      description: >-
        The system prompt that tells the agent how to behave, such as its role, tone, and the task
        to complete.
    Messages:
      type: array
      items:
        $ref: "#/components/schemas/Message"
      description: >-
        Messages that start the LLM context, such as examples of the conversation you expect.
    AgentCreate:
      type: object
      required:
        - agent_name
      properties:
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        greeting:
          $ref: "#/components/schemas/Greeting"
        variables:
          $ref: "#/components/schemas/Variables"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        filler_words:
          $ref: "#/components/schemas/FillerWords"
    EphemeralAgent:
      type: object
      description: >-
        The agent configuration for this session. It has the same fields as
        [Create an agent](/en/api-reference/api-ref/conversational-ai/v3/create-agent), but
        `agent_name` is optional. The agent isn't saved.
      properties:
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        greeting:
          $ref: "#/components/schemas/Greeting"
        variables:
          $ref: "#/components/schemas/Variables"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        filler_words:
          $ref: "#/components/schemas/FillerWords"
    AgentUpdate:
      type: object
      description: >-
        The fields to change, as a JSON merge patch. Fields you include replace the saved values,
        and nested objects merge field by field. Fields you omit keep their saved values. To remove
        a variable, set it to `null`.
      properties:
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        greeting:
          type: object
          additionalProperties: true
          description: >-
            Changes to the greeting. Pass any of the `greeting` fields of [Create an
            agent](/en/api-reference/api-ref/conversational-ai/v3/create-agent). The fields you
            pass merge into the saved greeting.
        variables:
          type: object
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/VariableUpdate"
              - type: "null"
          description: >-
            Changes to the variables, keyed by variable name. The fields you pass for a variable
            merge into its saved definition. To add a variable, pass its full definition, including
            `type`. Set a variable to `null` to remove it.
        pipeline:
          type: object
          additionalProperties: true
          description: >-
            Changes to the pipeline. Pass any of the `pipeline` fields of [Create an
            agent](/en/api-reference/api-ref/conversational-ai/v3/create-agent). The fields you
            pass merge into the saved pipeline, stage by stage.
        filler_words:
          type: object
          additionalProperties: true
          description: >-
            Changes to the filler words. Pass any of the `filler_words` fields of [Create an
            agent](/en/api-reference/api-ref/conversational-ai/v3/create-agent). The fields you
            pass merge into the saved settings.
      # TODO(v3-confirm): The staging spec says the patch model has a "merge limitation" but
      # doesn't say what it is. Confirm merge vs replace for arrays (messages, keywords, phrases)
      # and whether `null` clears top-level fields such as `greeting`.
    VariableUpdate:
      type: object
      description: The fields of the variable definition to change.
      properties:
        type:
          $ref: "#/components/schemas/VariableDefinition/properties/type"
        required:
          $ref: "#/components/schemas/VariableDefinition/properties/required"
        options:
          $ref: "#/components/schemas/VariableDefinition/properties/options"
        extract:
          $ref: "#/components/schemas/VariableDefinition/properties/extract"
        description:
          $ref: "#/components/schemas/VariableDefinition/properties/description"
    Agent:
      type: object
      required:
        - agent_id
        - agent_name
        - create_ts
        - update_ts
      properties:
        agent_id:
          type: string
          format: uuid
          description: The ID of the agent.
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        greeting:
          $ref: "#/components/schemas/Greeting"
        variables:
          $ref: "#/components/schemas/Variables"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        filler_words:
          $ref: "#/components/schemas/FillerWords"
        create_ts:
          type: integer
          description: The time the agent was created, as a Unix timestamp in seconds.
        update_ts:
          type: integer
          description: The time the agent was last updated, as a Unix timestamp in seconds.
    AgentSummary:
      type: object
      required:
        - agent_id
        - agent_name
        - create_ts
        - update_ts
      properties:
        agent_id:
          type: string
          format: uuid
          description: The ID of the agent.
        agent_name:
          $ref: "#/components/schemas/AgentName"
        create_ts:
          type: integer
          description: The time the agent was created, as a Unix timestamp in seconds.
        update_ts:
          type: integer
          description: The time the agent was last updated, as a Unix timestamp in seconds.
    AgentList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of agents on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/AgentSummary"
                  description: The agents on this page.
        - $ref: "#/components/schemas/ListPageInfo"

    # ---------------------------------------------------------------------------------------------
    # Secrets
    # ---------------------------------------------------------------------------------------------
    SecretValues:
      type: object
      minProperties: 1
      propertyNames:
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      additionalProperties:
        type: string
        format: password
        writeOnly: true
      description: >-
        The secrets, as key-value pairs. Each key is 1 to 64 characters from `A-Z`, `a-z`, `0-9`,
        `_`, and `-`. Values are write-only and are never returned.
    SecretSetCreate:
      type: object
      required:
        - name
        - secrets
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            A name for the secret set, unique in the project. Use 1 to 64 characters from `A-Z`,
            `a-z`, `0-9`, `_`, and `-`.
        secrets:
          $ref: "#/components/schemas/SecretValues"
    SecretSetReplace:
      type: object
      required:
        - secrets
      properties:
        secrets:
          $ref: "#/components/schemas/SecretValues"
    SecretSetUpdate:
      type: object
      required:
        - secrets
      properties:
        secrets:
          type: object
          minProperties: 1
          propertyNames:
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
          additionalProperties:
            type:
              - string
              - "null"
            format: password
            writeOnly: true
          description: >-
            The keys to change. A string value adds the key, or replaces its value if the key
            exists. A `null` value removes the key. Keys you omit don't change.
    SecretSet:
      type: object
      required:
        - name
        - keys
        - create_ts
        - update_ts
      properties:
        name:
          type: string
          description: The name of the secret set.
        keys:
          type: array
          items:
            type: string
          description: The names of the keys in the set. Values are never returned.
        create_ts:
          type: integer
          description: The time the set was created, as a Unix timestamp in seconds.
        update_ts:
          type: integer
          description: The time the set was last updated, as a Unix timestamp in seconds.
    SecretSetList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of secret sets on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/SecretSet"
                  description: The secret sets on this page.
        - $ref: "#/components/schemas/ListPageInfo"
    SecretKeyWrite:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: The secret value. It is write-only and is never returned.
    SecretKey:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          description: The name of the key.

    # ---------------------------------------------------------------------------------------------
    # Phone numbers
    # ---------------------------------------------------------------------------------------------
    SipAuth:
      type: object
      required:
        - username
        - password
      writeOnly: true
      description: >-
        The credentials Agora uses to authenticate with your SIP trunk. They are write-only and are
        never returned.
      properties:
        username:
          type: string
          writeOnly: true
          description: The SIP username.
        password:
          type: string
          format: password
          writeOnly: true
          description: >-
            The SIP password, as plain text. Secret references in the format
            `$secrets.<set_name>.<key>` aren't supported yet.
    SipTrunk:
      type: object
      required:
        - hostname
      description: The SIP trunk that carries calls for this number.
      properties:
        name:
          type: string
          description: A name for the SIP trunk that helps you identify it.
        hostname:
          type: string
          description: >-
            The hostname or IP address of your SIP trunk, without a scheme, port, or path. For
            example, `sip.example.com`.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port of your SIP trunk.
        transport:
          type: string
          enum:
            - udp
            - tcp
            - tls
          default: tls
          description: The transport protocol for SIP signaling.
        auth:
          $ref: "#/components/schemas/SipAuth"
      # TODO(v3-confirm): Default `port` when omitted (staging responses always echo it).
    SipTrunkResponse:
      type: object
      required:
        - hostname
        - port
        - transport
      properties:
        name:
          type: string
          description: The name of the SIP trunk.
        hostname:
          type: string
          description: The hostname or IP address of the SIP trunk.
        port:
          type: integer
          description: The port of the SIP trunk.
        transport:
          type: string
          enum:
            - udp
            - tcp
            - tls
          description: The transport protocol for SIP signaling.
    InboundCallPolicy:
      type: object
      description: Limits for inbound calls to this number.
      properties:
        max_call_duration_seconds:
          type: integer
          minimum: 1
          description: The maximum length of an inbound call, in seconds.
        max_silence_duration_ms:
          type: integer
          minimum: 1
          description: >-
            The maximum silence in milliseconds before the agent ends an inbound call.
    Inbound:
      type: object
      required:
        - agent
      description: How the number handles inbound calls.
      properties:
        agent:
          type:
            - string
            - "null"
          format: uuid
          description: >-
            The ID of the agent that answers inbound calls to this number. Set to `null` to not
            answer inbound calls.
        call_policy:
          $ref: "#/components/schemas/InboundCallPolicy"
    PhoneNumber:
      type: string
      minLength: 1
      maxLength: 128
      description: >-
        The phone number. Numbers in international format are normalized to E.164, for example
        `+12025550123`. Numbers in national format are normalized to their national significant
        digits.
    NumberDescription:
      type: string
      description: A description of the number that helps you identify it.
    NumberCreate:
      type: object
      required:
        - number
        - sip_trunk
      properties:
        number:
          $ref: "#/components/schemas/PhoneNumber"
        description:
          $ref: "#/components/schemas/NumberDescription"
        sip_trunk:
          $ref: "#/components/schemas/SipTrunk"
        inbound:
          $ref: "#/components/schemas/Inbound"
    NumberUpdate:
      type: object
      description: The fields to change. Fields you omit keep their saved values.
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The phone number in a different format. You can reformat the number, but you can't
            change it to a different number.
        description:
          $ref: "#/components/schemas/NumberDescription"
        sip_trunk:
          $ref: "#/components/schemas/SipTrunk"
        inbound:
          $ref: "#/components/schemas/Inbound"
    Number:
      type: object
      required:
        - number_id
        - number
        - create_ts
      properties:
        number_id:
          type: string
          format: uuid
          description: The ID of the phone number.
        number:
          type: string
          description: The normalized phone number.
        description:
          $ref: "#/components/schemas/NumberDescription"
        sip_trunk:
          $ref: "#/components/schemas/SipTrunkResponse"
        inbound:
          $ref: "#/components/schemas/Inbound"
        create_ts:
          type: integer
          description: The time the number was created, as a Unix timestamp in seconds.
    NumberList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of phone numbers on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/Number"
                  description: The phone numbers on this page.
        - $ref: "#/components/schemas/ListPageInfo"

    # ---------------------------------------------------------------------------------------------
    # Sessions
    # ---------------------------------------------------------------------------------------------
    RtcTransport:
      type: object
      title: RTC
      required:
        - type
        - channel
        - uid
        - subscribe_uids
      description: Joins the agent to an RTC channel.
      properties:
        type:
          type: string
          const: rtc
          description: "`rtc`: The agent joins an RTC channel."
        channel:
          type: string
          description: The name of the RTC channel the agent joins.
        token:
          type: string
          writeOnly: true
          description: >-
            The RTC token the agent uses to join the channel. Required when the project has an App
            Certificate enabled.
        uid:
          type: string
          description: >-
            The user ID the agent uses in the channel. Pass numeric user IDs as strings, for
            example `"1002"`.
        subscribe_uids:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
          description: >-
            The user ID of the user the agent talks to. Only this user can interact with the agent.
            Pass exactly one user ID.
        audio_scenario:
          type: string
          enum:
            - aiserver
            - chorus
          default: aiserver
          description: |-
            The audio scenario of the agent in the channel:

            - `aiserver`: Optimized for latency and network resilience in conversations with an
              agent.
            - `chorus`: For users with good network conditions who need ultra-low latency.
    TelephonyTransport:
      type: object
      title: Telephony
      required:
        - type
        - from
        - to
      description: >-
        Places an outbound phone call. The number in `from` must be registered in the project, and
        its SIP trunk must be configured.
      properties:
        type:
          type: string
          const: telephony
          description: "`telephony`: The agent places a phone call."
        from:
          type: string
          description: >-
            The phone number the agent calls from. Pass the `number_id` of a number in the project,
            or the number itself in E.164 format.
        to:
          type: string
          description: The phone number to call, in E.164 format, for example `+12025550199`.
      # TODO(v3-confirm): Telephony start was not tested on staging (it places a real call). The
      # staging schema allows extra properties here. Confirm the full field list.
    SessionTransport:
      description: How the agent connects to the user.
      oneOf:
        - $ref: "#/components/schemas/RtcTransport"
        - $ref: "#/components/schemas/TelephonyTransport"
      discriminator:
        propertyName: type
        mapping:
          rtc: "#/components/schemas/RtcTransport"
          telephony: "#/components/schemas/TelephonyTransport"
    SessionLifecycle:
      type: object
      description: When the session ends on its own.
      properties:
        idle_timeout_ms:
          type: integer
          minimum: 0
          maximum: 3600000
          default: 30000
          description: >-
            How long in milliseconds the session continues after the user leaves. When the timeout
            is reached, the session stops.
        max_duration_ms:
          type: integer
          minimum: 1000
          default: 259200000
          description: >-
            The maximum length of the session in milliseconds. When it's reached, the session
            stops. Defaults to 72 hours.
        graceful_stop:
          type: object
          description: How the session stops when you stop it.
          properties:
            enabled:
              type: boolean
              default: false
              description: >-
                Whether the agent finishes what it's doing before it leaves. When `true`, the
                agent waits until it's idle, up to `timeout_ms`.
            timeout_ms:
              type: integer
              default: 30000
              description: >-
                The maximum time in milliseconds to wait for the agent to become idle before it
                leaves. Applies when `enabled` is `true`.
      # TODO(v3-confirm): Defaults for max_duration_ms and graceful_stop are taken from a staging
      # campaign response; the exact max_duration_ms limit was not tested. Confirm whether
      # idle_timeout_ms 0 means "never time out" as in V2, and the graceful_stop semantics.
    SessionDataPolicy:
      type: object
      description: How Agora handles the session's data.
      properties:
        retention:
          type: string
          enum:
            - 30_days
            - none
          default: 30_days
          description: |-
            How long Agora keeps the session data, such as the transcript:

            - `30_days`: Agora keeps the data for 30 days.
            - `none`: Agora doesn't keep the data. Post-session analysis, such as variable
              extraction, is skipped.
    SessionValues:
      type: object
      additionalProperties: true
      description: >-
        Values for the agent's variables, keyed by variable name. Pass a value for every variable
        that the agent marks as `required`.
      example:
        customer_name: Alex
    ClientReference:
      type: string
      maxLength: 256
      description: Your own identifier for the session, such as an order or ticket ID.
    SessionLabels:
      type: object
      additionalProperties:
        type: string
      description: Key-value labels that help you organize sessions.
    SessionStart:
      type: object
      required:
        - agent_id
        - transport
      properties:
        agent_id:
          type: string
          format: uuid
          description: The ID of the saved agent to run.
        transport:
          $ref: "#/components/schemas/SessionTransport"
        values:
          $ref: "#/components/schemas/SessionValues"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        data_policy:
          $ref: "#/components/schemas/SessionDataPolicy"
        client_reference:
          $ref: "#/components/schemas/ClientReference"
        labels:
          $ref: "#/components/schemas/SessionLabels"
      # TODO(v3-confirm): client_reference and labels are accepted but not returned by any
      # deployed endpoint. Confirm where they surface (events, webhooks, List filters).
    EphemeralSessionStart:
      type: object
      required:
        - agent
        - transport
      properties:
        agent:
          $ref: "#/components/schemas/EphemeralAgent"
        transport:
          $ref: "#/components/schemas/SessionTransport"
        values:
          $ref: "#/components/schemas/SessionValues"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        data_policy:
          $ref: "#/components/schemas/SessionDataPolicy"
        client_reference:
          $ref: "#/components/schemas/ClientReference"
        labels:
          $ref: "#/components/schemas/SessionLabels"
    SessionStarted:
      type: object
      required:
        - agent_session_id
        - status
        - created_at
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        status:
          type: string
          description: The status of the session. `running` when the session has started.
        created_at:
          type: integer
          description: The time the session was created, as a Unix timestamp in seconds.
      # TODO(v3-confirm): Start returns lowercase `status` and `created_at`; Retrieve and List
      # return uppercase `status` and `start_ts`. Confirm whether Start will be aligned.
    SessionStatus:
      type: string
      enum:
        - IDLE
        - STARTING
        - RUNNING
        - STOPPING
        - STOPPED
        - FAILED
      description: |-
        The status of the session:

        - `IDLE`: The session is idle.
        - `STARTING`: The session is starting.
        - `RUNNING`: The session is running.
        - `STOPPING`: The session is stopping.
        - `STOPPED`: The session has ended.
        - `FAILED`: The session failed.
    SessionAnalysis:
      type: object
      required:
        - status
      description: >-
        The post-session analysis, which fills the agent's variables that have `extract` set to
        `true`.
      properties:
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - skipped
          description: |-
            The status of the analysis:

            - `pending`: The analysis hasn't finished.
            - `completed`: The analysis finished. The results are in `result`.
            - `failed`: The analysis failed. The reason is in `error`.
            - `skipped`: The analysis didn't run. The reason is in `skip_reason`.
        skip_reason:
          type:
            - string
            - "null"
          enum:
            - no_user_turns
            - retention_none
            - null
          description: |-
            Why the analysis was skipped:

            - `no_user_turns`: The user didn't speak during the session.
            - `retention_none`: The session's `data_policy.retention` is `none`.
        complete_ts:
          type:
            - integer
            - "null"
          description: The time the analysis finished, as a Unix timestamp in seconds.
        result:
          type:
            - object
            - "null"
          additionalProperties:
            type:
              - string
              - number
              - boolean
              - "null"
          description: The extracted variable values, keyed by variable name.
        error:
          type:
            - string
            - "null"
          description: The reason the analysis failed.
      # TODO(v3-confirm): `analysis` is in the response schema but never appeared in staging
      # responses. Confirm when it is returned.
    Session:
      type: object
      required:
        - agent_session_id
        - start_ts
        - status
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        status:
          $ref: "#/components/schemas/SessionStatus"
        start_ts:
          type: integer
          description: The time the session started, as a Unix timestamp in seconds.
        stop_ts:
          type: integer
          description: >-
            The time the session stopped, as a Unix timestamp in seconds. Returned when the session
            has ended.
        message:
          type: string
          description: >-
            Details about the status, such as the reason the session stopped.
        agent_name:
          type: string
          description: The internal name of the session's agent task.
        analysis:
          $ref: "#/components/schemas/SessionAnalysis"
      # TODO(v3-confirm): `agent_name` is the engine's task name (`session-...` or
      # `ephemeral-...`), not the agent's name. Engineering is discussing a rename.
    SessionSummary:
      type: object
      required:
        - agent_session_id
        - start_ts
        - status
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        status:
          $ref: "#/components/schemas/SessionStatus"
        start_ts:
          type: integer
          description: The time the session started, as a Unix timestamp in seconds.
    SessionList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of sessions on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/SessionSummary"
                  description: The sessions on this page.
        - $ref: "#/components/schemas/ListPageInfo"

    # ---------------------------------------------------------------------------------------------
    # Campaigns
    # ---------------------------------------------------------------------------------------------
    CampaignCallPolicy:
      type: object
      description: Limits for each call in the campaign.
      properties:
        max_ring_duration_ms:
          type: integer
          description: >-
            How long in milliseconds a call rings before the agent stops waiting for an answer.
        max_call_duration_seconds:
          type: integer
          description: The maximum length of each call, in seconds.
    CampaignTransport:
      type: object
      required:
        - type
        - from
      description: The phone numbers the campaign calls from.
      properties:
        type:
          type: string
          const: telephony
          description: "`telephony`: The campaign places phone calls."
        from:
          oneOf:
            - type: string
              format: uuid
            - type: array
              minItems: 1
              items:
                type: string
                format: uuid
          description: >-
            The `number_id` of the phone number to call from, or a list of `number_id` values. Each
            number must be registered in the project.
        call_policy:
          $ref: "#/components/schemas/CampaignCallPolicy"
      # TODO(v3-confirm): How calls are distributed across several `from` numbers.
    CampaignContact:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          description: The phone number to call, in E.164 format, for example `+12025550199`.
        values:
          type: object
          additionalProperties: true
          description: >-
            Values for the agent's variables for this contact, keyed by variable name.
    CampaignPacing:
      type: object
      description: How fast the campaign dials.
      properties:
        max_concurrent:
          type: integer
          description: The maximum number of calls in progress at the same time.
        max_calls_per_second:
          type: number
          description: The maximum number of new calls per second.
        max_attempts:
          type: integer
          description: The maximum number of times to call each contact.
        retry_backoff_ms:
          type: integer
          description: How long in milliseconds to wait before calling a contact again.
      # TODO(v3-confirm): Defaults and limits for pacing; pacing is not returned in the campaign.
    CampaignScheduleWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          description: The start of the calling window, as a local time in `HH:MM` format.
        end:
          type: string
          description: The end of the calling window, as a local time in `HH:MM` format.
    CampaignScheduleDay:
      type: object
      required:
        - weekday
        - ranges
      properties:
        weekday:
          type: string
          enum:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          description: The day of the week.
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/CampaignScheduleWindow"
          description: The calling windows on this day.
    CampaignSchedule:
      type: object
      required:
        - mode
      description: When the campaign dials.
      properties:
        mode:
          type: string
          enum:
            - immediate
            - scheduled
          description: |-
            When the campaign starts:

            - `immediate`: The campaign starts dialing as soon as you create it.
            - `scheduled`: The campaign dials between `start` and `end`, during the windows in
              `days`.
        timezone:
          type: string
          description: >-
            The IANA time zone for `start`, `end`, and `days`, for example `America/New_York`.
            Required when `mode` is `scheduled`.
        start:
          type: string
          description: >-
            When the campaign starts, as a local date and time in `YYYY-MM-DDTHH:MM` format, for
            example `2027-01-04T09:00`. Required when `mode` is `scheduled`.
        end:
          type: string
          description: >-
            When the campaign ends, as a local date and time in `YYYY-MM-DDTHH:MM` format. Required
            when `mode` is `scheduled`.
        days:
          type: array
          items:
            $ref: "#/components/schemas/CampaignScheduleDay"
          description: >-
            The days and times when the campaign can dial, between `start` and `end`. Applies when
            `mode` is `scheduled`.
      # TODO(v3-confirm): Behavior when `days` is omitted for a scheduled campaign (dial any time
      # between start and end?).
    CampaignCreate:
      type: object
      required:
        - name
        - agent_id
        - transport
        - contacts
        - schedule
      properties:
        name:
          type: string
          description: A name for the campaign that helps you identify it.
        agent_id:
          type: string
          format: uuid
          description: The ID of the saved agent that talks to each contact.
        transport:
          $ref: "#/components/schemas/CampaignTransport"
        contacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CampaignContact"
          description: The contacts to call. Pass at least one contact.
        schedule:
          $ref: "#/components/schemas/CampaignSchedule"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        pacing:
          $ref: "#/components/schemas/CampaignPacing"
    CampaignUpdate:
      type: object
      description: >-
        The fields to change. Before the campaign starts dialing, you can change `pacing`,
        `schedule`, `lifecycle`, and `transport.call_policy`. After it starts, you can change only
        `pacing`.
      properties:
        pacing:
          $ref: "#/components/schemas/CampaignPacing"
        schedule:
          $ref: "#/components/schemas/CampaignSchedule"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        transport:
          type: object
          properties:
            call_policy:
              $ref: "#/components/schemas/CampaignCallPolicy"
    CampaignStatus:
      type: string
      enum:
        - scheduled
        - running
        - paused
        - completed
        - canceled
        - failed
      description: |-
        The status of the campaign:

        - `scheduled`: The campaign is waiting for its start time.
        - `running`: The campaign is dialing.
        - `paused`: You paused the campaign.
        - `completed`: The campaign has finished.
        - `canceled`: You canceled the campaign.
        - `failed`: The campaign failed. The details are in `failure`.
    CampaignCounts:
      type: object
      description: The number of contacts in each state. Retrieve the campaign to get current counts.
      properties:
        contacts:
          type: integer
          description: The total number of contacts.
        pending:
          type: integer
          description: Contacts not called yet.
        calling:
          type: integer
          description: Contacts in a call now.
        completed:
          type: integer
          description: Contacts whose call has finished.
        failed:
          type: integer
          description: Contacts whose call failed.
        canceled:
          type: integer
          description: Contacts that won't be called because the campaign was canceled.
    Campaign:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
          description: The ID of the campaign.
        name:
          type: string
          description: The name of the campaign.
        status:
          $ref: "#/components/schemas/CampaignStatus"
        agent_id:
          type: string
          format: uuid
          description: The ID of the agent that talks to each contact.
        transport:
          type: object
          properties:
            type:
              type: string
              const: telephony
              description: Always `telephony`.
            from:
              type: array
              items:
                type: string
                format: uuid
              description: The `number_id` values of the numbers the campaign calls from.
            call_policy:
              $ref: "#/components/schemas/CampaignCallPolicy"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        schedule:
          $ref: "#/components/schemas/CampaignSchedule"
        counts:
          $ref: "#/components/schemas/CampaignCounts"
        create_ts:
          type: integer
          description: The time the campaign was created, as a Unix timestamp in seconds.
        start_ts:
          type:
            - integer
            - "null"
          description: >-
            The time the campaign started dialing, as a Unix timestamp in seconds. `null` before it
            starts.
        complete_ts:
          type:
            - integer
            - "null"
          description: >-
            The time the campaign finished, as a Unix timestamp in seconds. `null` until it
            finishes.
        failure:
          type:
            - object
            - "null"
          description: Details of the failure when `status` is `failed`. Otherwise `null`.
      # TODO(v3-confirm): Shape of `failure`.
    CampaignList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of campaigns on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/Campaign"
                  description: The campaigns on this page.
        - $ref: "#/components/schemas/ListPageInfo"

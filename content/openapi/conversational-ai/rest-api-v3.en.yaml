      operationId: update-secret-set
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to rotate a secret or change a few keys without resending the whole
            set. Pass a string to add or replace a key, or `null` to remove it. Keys you omit don't
            change. To replace the whole set, use [Replace a secret
            set](/en/api-reference/api-ref/conversational-ai/v3/replace-secret-set).
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretSetUpdate"
            example:
              secrets:
                llm: <your_new_llm_api_key>
                tts: <your_tts_api_key>
                asr: null
      responses:
        "200":
          description: The secret set was updated. The response body lists its keys.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSet"
              example:
                name: vendor-keys
                keys:
                  - llm
                  - tts
                create_ts: 1791651848
                update_ts: 1791651852
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`InvalidRequestBody`: The body contains an unknown field."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`SecretSetEmpty`: The update would remove every key from the set."
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Whether removing all keys through PATCH returns SecretSetEmpty (only
      # verified for Delete Key).
    put:
      tags:
        - Secrets
      summary: Replace a secret set
      description: Replaces all the keys in a secret set.
      operationId: replace-secret-set
      x-docs-sections:
        - position: after-description
          markdown: >-
            The set contains only the keys in the request after the update. Keys you omit are
            removed.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretSetReplace"
            example:
              secrets:
                asr: <your_asr_api_key>
                llm: <your_llm_api_key>
      responses:
        "200":
          description: The secret set was replaced. The response body lists its keys.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSet"
              example:
                name: vendor-keys
                keys:
                  - asr
                  - llm
                create_ts: 1791651848
                update_ts: 1791651856
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`MissingRequiredField`: The `If-Match` header is missing."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Secrets
      summary: Delete a secret set
      description: Deletes a secret set and all its keys.
      operationId: delete-secret-set
      x-docs-sections:
        - position: after-description
          markdown: >-
            Changing a key also changes the set's `ETag`. After you change any key, retrieve the
            set to get the current `ETag` before you delete it.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/IfMatchRequired"
      responses:
        "200":
          description: The secret set was deleted.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`MissingRequiredField`: The `If-Match` header is missing."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`SecretSetInUse`: An agent references a secret in this set."
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): SecretSetInUse is in the reason enum but was not triggered on staging.
  /v3/projects/{appid}/secrets/{name}/keys/{key}:
    put:
      tags:
        - Secrets
      summary: Set a secret key
      description: Adds a key to a secret set, or replaces the value of an existing key.
      operationId: set-secret-key
      x-docs-sections:
        - position: after-description
          markdown: >-
            The response returns `201` when the key is new and `200` when it replaces an existing
            value. Each key has its own `ETag`. To create the key only if it doesn't exist yet,
            send `If-None-Match: *`.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/SecretKeyName"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
          description: >-
            The `ETag` of the key from the most recent response for it. When you include it, the
            request fails with `412` if the key has changed since then.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            const: "*"
          description: >-
            Set to `*` to create the key only if it doesn't exist. If the key exists, the request
            fails with `412`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretKeyWrite"
            example:
              value: <your_tts_api_key>
      responses:
        "200":
          description: The key's value was replaced.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretKey"
              example:
                key: tts
        "201":
          description: The key was added to the set.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretKey"
              example:
                key: tts
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
          description: >-
            `PreconditionFailed`: The key has changed since the `If-Match` value, or the key exists
            and you sent `If-None-Match: *`.
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Secrets
      summary: Delete a secret key
      description: Removes a key from a secret set.
      operationId: delete-secret-key
      x-docs-sections:
        - position: after-description
          markdown: >-
            A secret set must contain at least one key. To remove the last key, [delete the
            set](/en/api-reference/api-ref/conversational-ai/v3/delete-secret-set) instead.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/SecretKeyName"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
          description: >-
            The `ETag` of the key from the most recent response for it. When you include it, the
            request fails with `412` if the key has changed since then.
      responses:
        "200":
          description: The key was removed.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`SecretSetEmpty`: The key is the last key in the set."
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"

  # -----------------------------------------------------------------------------------------------
  # Phone numbers
  # -----------------------------------------------------------------------------------------------
  /v3/projects/{appid}/numbers:
    post:
      tags:
        - Phone numbers
      summary: Create a phone number
      description: Registers a phone number and its SIP trunk in your project.
      operationId: create-number
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to register a number that your SIP trunk provider assigned to you.
            Agents use the number to place outbound calls and, if you set `inbound.agent`, to
            answer inbound calls.
      x-docs-callouts:
        - type: caution
          title: Caution
          position: after-description
          markdown: >-
            If the request returns `503` with reason `ServiceUnavailable`, don't retry it with
            the same or a different number. Contact Agora support with the `Agora-Request-Id`
            value from the response.
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberCreate"
            example:
              number: "+12025550123"
              description: Support line
              sip_trunk:
                name: Primary trunk
                hostname: sip.example.com
                port: 5061
                transport: tls
                auth:
                  username: <your_sip_username>
                  password: <your_sip_password>
              inbound:
                agent: 1fa9d015-7457-44ec-8b8f-0273c2f1ce88
                call_policy:
                  max_call_duration_seconds: 600
      responses:
        "201":
          description: The number was created. The response body contains the saved number.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Number"
              example:
                number_id: 80a5519c-6138-4b72-abb5-34f465ac1951
                number: "+12025550123"
                description: Support line
                sip_trunk:
                  name: Primary trunk
                  hostname: sip.example.com
                  port: 5061
                  transport: tls
                inbound:
                  agent: 1fa9d015-7457-44ec-8b8f-0273c2f1ce88
                  call_policy:
                    max_call_duration_seconds: 600
                create_ts: 1791651960
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `InvalidFieldValue` when the phone number isn't
            valid, or `NotImplemented` when the SIP password is a secret reference.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Error"
          description: >-
            `ServiceUnavailable`: The phone number service is unavailable. Don't retry the request.
            Contact Agora support with the `Agora-Request-Id` value.
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): On staging a 503 left a hidden pending record that blocked the number
      # (List, Get, and Delete can't see it), and Idempotency-Key is accepted but ignored. The
      # caution above is the user-facing workaround; confirm the production fix and remove it.
      # Also: is there a 409 NumberAlreadyExists for a duplicate number?
    get:
      tags:
        - Phone numbers
      summary: List phone numbers
      description: Retrieves the phone numbers in your project.
      operationId: list-numbers
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: The maximum number of phone numbers to return on each page.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: >-
            The request was successful. The response body contains a page of phone numbers.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberList"
              example:
                data:
                  count: 1
                  list:
                    - number_id: 80a5519c-6138-4b72-abb5-34f465ac1951
                      number: "+12025550123"
                      description: Support line
                      sip_trunk:
                        name: Primary trunk
                        hostname: sip.example.com
                        port: 5061
                        transport: tls
                      create_ts: 1791651960
                has_more: false
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`InvalidFieldValue`: `limit` is out of range."
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /v3/projects/{appid}/numbers/{number_id}:
    get:
      tags:
        - Phone numbers
      summary: Retrieve a phone number
      description: Retrieves a phone number and its SIP trunk settings.
      operationId: retrieve-number
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/NumberId"
      responses:
        "200":
          description: >-
            The request was successful. The response body contains the number. SIP credentials

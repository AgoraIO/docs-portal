# Conversational AI RESTful API v3
#
# Source: engineering implementation spec (commit a6f5f25) as corrected by staging tests on
# 10-14 Oct 2026. Only operations that are deployed on staging are documented here.
#
# TODO(v3-prod): The server URL, path prefix, and authentication mirror V2 and are placeholders.
# Staging uses a different host and path prefix, and gateway authentication. Confirm the
# production base URL, path prefix, and auth with engineering before publishing.
openapi: 3.1.0
info:
  version: ""
  title: Conversational AI RESTful API v3
  description: >-
    The Conversational AI RESTful API v3 lets you save agents, secrets, and phone numbers in your
    project, and use them to start agent sessions and outbound call campaigns from your server.
servers:
  - url: https://api.agora.io/api/conversational-ai-agent
    description: Base endpoint for Conversational AI RESTful APIs.
x-docs-auth-links:
  tokenAuth: /en/api-reference/api-ref/conversational-ai/v3/authentication#token-authentication
  basicAuth: /en/api-reference/api-ref/conversational-ai/v3/authentication#basic-http-authentication
security:
  - tokenAuth: []
  - basicAuth: []
tags:
  - name: Agents
    description: >-
      Save agent configurations, including instructions, variables, greeting, and the speech
      pipeline, so that you can start sessions and campaigns from them.
  - name: Sessions
    description: >-
      Start, monitor, and stop agent sessions. A session runs one agent in one RTC channel or
      phone call.
  - name: Secrets
    description: >-
      Store vendor API keys and other credentials in named secret sets. Agents reference secrets
      instead of embedding them. Secret values are write-only and are never returned.
  - name: Phone numbers
    description: >-
      Register phone numbers and the SIP trunks that carry their calls, and assign an agent to
      answer inbound calls.
  - name: Campaigns
    description: >-
      Dial a list of contacts with a saved agent, on a schedule or right away. Each call starts a
      telephony session.
paths:
  # -----------------------------------------------------------------------------------------------
  # Agents
  # -----------------------------------------------------------------------------------------------
  /v3/projects/{appid}/agents:
    post:
      tags:
        - Agents
      summary: Create an agent
      description: Saves an agent configuration in your project.
      operationId: create-agent
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to save an agent that you can then use to start sessions and
            campaigns. Only `agent_name` is required, but to start a session the agent needs a
            `pipeline`.
      x-docs-callouts:
        - type: info
          title: Note
          position: after-description
          markdown: >-
            When a pipeline stage uses `managed` credentials, you must set the vendor's default
            endpoint for that stage: `url` for the LLM, and `params.url` for ASR and TTS. If the
            endpoint is missing, the request fails with `MissingRequiredField`. Custom endpoints
            fail with `NotImplemented`.
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
            example:
              agent_name: Support agent
              instructions: You are a friendly support agent. Answer briefly and clearly.
              greeting:
                mode: text
                text: Hi {{customer_name}}, how can I help you today?
              variables:
                customer_name:
                  type: str
                  required: true
              pipeline:
                mode: cascaded
                asr:
                  credential:
                    mode: managed
                  vendor: deepgram
                  params:
                    url: wss://api.deepgram.com/v1/listen
                    model: nova-3
                    language: en
                llm:
                  credential:
                    mode: managed
                  vendor: openai
                  style: openai
                  model: gpt-4.1-mini
                  url: https://api.openai.com/v1/chat/completions
                tts:
                  credential:
                    mode: managed
                  vendor: minimax
                  params:
                    url: wss://api.minimax.io/ws/v1/t2a_v2
                    model: speech-2.8-turbo
                    audio_setting:
                      sample_rate: 44100
                    voice_setting:
                      speed: 1.0
                      voice_id: English_captivating_female1
      responses:
        "201":
          description: The agent was created. The response body contains the saved agent.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
              example:
                agent_id: 1fa9d015-7457-44ec-8b8f-0273c2f1ce88
                agent_name: Support agent
                instructions: You are a friendly support agent. Answer briefly and clearly.
                variables:
                  customer_name:
                    type: str
                    required: true
                    extract: false
                create_ts: 1791651865
                update_ts: 1791651865
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `MissingRequiredField` when a stage with
            `managed` credentials has no endpoint, or `NotImplemented` when a field isn't
            supported yet.
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags:
        - Agents
      summary: List agents
      description: Retrieves the agents saved in your project.
      operationId: list-agents
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: The maximum number of agents to return on each page.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: The request was successful. The response body contains a page of agents.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
              example:
                data:
                  count: 1
                  list:
                    - agent_id: 1fa9d015-7457-44ec-8b8f-0273c2f1ce88
                      agent_name: Support agent
                      create_ts: 1791651865
                      update_ts: 1791651865
                has_more: false
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`InvalidFieldValue`: `limit` is out of range."
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /v3/projects/{appid}/agents/{agent_id}:
    get:
      tags:
        - Agents
      summary: Retrieve an agent
      description: Retrieves the configuration of a saved agent.
      operationId: retrieve-agent
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The request was successful. The response body contains the agent.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
              example:
                agent_id: 1fa9d015-7457-44ec-8b8f-0273c2f1ce88
                agent_name: Support agent
                instructions: You are a friendly support agent. Answer briefly and clearly.
                variables:
                  customer_name:
                    type: str
                    required: true
                    extract: false
                create_ts: 1791651865
                update_ts: 1791651865
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`InvalidFieldValue`: `agent_id` isn't a valid UUID."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Agents
      summary: Update an agent
      description: Changes the configuration of a saved agent.
      operationId: update-agent
      x-docs-sections:
        - position: after-description
          markdown: >-
            Send only the fields you want to change. The request body is a JSON merge patch:
            nested objects merge field by field, and fields you omit keep their saved values.
            Changes apply to sessions that start after the update.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
            example:
              instructions: You are a friendly support agent. Answer briefly, clearly, and politely.
              variables:
                customer_name:
                  description: The customer's preferred name.
      responses:
        "200":
          description: The agent was updated. The response body contains the full agent.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
              example:
                agent_id: 1fa9d015-7457-44ec-8b8f-0273c2f1ce88
                agent_name: Support agent
                instructions: You are a friendly support agent. Answer briefly, clearly, and politely.
                variables:
                  customer_name:
                    type: str
                    required: true
                    extract: false
                    description: The customer's preferred name.
                create_ts: 1791651865
                update_ts: 1791651871
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`MissingRequiredField`: The `If-Match` header is missing."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): "Changes apply to sessions that start after the update" is assumed.
      # Confirm that running sessions keep their configuration.
    delete:
      tags:
        - Agents
      summary: Delete an agent
      description: Deletes a saved agent.
      operationId: delete-agent
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The agent was deleted.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Behavior when the agent is referenced by a number's inbound config, a
      # campaign, or a running session.

  # -----------------------------------------------------------------------------------------------
  # Sessions
  # -----------------------------------------------------------------------------------------------
  /v3/projects/{appid}/sessions:
    post:
      tags:
        - Sessions
      summary: Start a session
      description: Starts a session with a saved agent.
      operationId: start-session
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to run a saved agent in an RTC channel or a phone call. The session
            ends when you [stop it](/en/api-reference/api-ref/conversational-ai/v3/stop-session),
            when the user has been gone for `lifecycle.idle_timeout_ms`, or when it reaches
            `lifecycle.max_duration_ms`.


            To start a session without saving an agent first, use [Start an ephemeral
            session](/en/api-reference/api-ref/conversational-ai/v3/start-ephemeral-session).
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionStart"
            example:
              agent_id: 1fa9d015-7457-44ec-8b8f-0273c2f1ce88
              values:
                customer_name: Alex
              transport:
                type: rtc
                channel: support-channel
                token: <your_rtc_token>
                uid: "1002"
                subscribe_uids:
                  - "1001"
              lifecycle:
                idle_timeout_ms: 10000
      responses:
        "201":
          description: The session has started.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStarted"
              example:
                agent_session_id: a42aj23vm97hc68dm52jk84fj47nv28p
                status: running
                created_at: 1791854705
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `MissingRequiredField` when `agent_id` is
            missing, `InvalidFieldValue` when a value is out of range, or `InvalidModuleParameter`
            when the agent's pipeline is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`AgentNotFound`: No agent has this `agent_id`."
        default:
          $ref: "#/components/responses/Error"
    get:
      tags:
        - Sessions
      summary: List sessions
      description: Retrieves the sessions in your project that match the filters.
      operationId: list-sessions
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: RUNNING
          description: >-
            The statuses to include, separated by commas. For example, `RUNNING,STOPPED`. Valid
            statuses are `IDLE`, `STARTING`, `RUNNING`, `STOPPING`, `STOPPED`, and `FAILED`.
        - name: channel
          in: query
          required: false
          schema:
            type: string
          description: Return only sessions in this RTC channel.
        - name: started_after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: >-
            Return only sessions that started after this time, as a Unix timestamp in seconds.
        - name: started_before
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: >-
            Return only sessions that started before this time, as a Unix timestamp in seconds.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
          description: The maximum number of sessions to return on each page.
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The request was successful. The response body contains a page of sessions.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
              example:
                data:
                  count: 1
                  list:
                    - agent_session_id: a42aj23vm97hc68dm52jk84fj47nv28p
                      start_ts: 1791854706
                      status: RUNNING
                has_more: false
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Maximum `limit`.
  /v3/projects/{appid}/sessions/ephemeral:
    post:
      tags:
        - Sessions
      summary: Start an ephemeral session
      description: Starts a session with an agent configuration that you pass in the request.
      operationId: start-ephemeral-session
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to start a session without saving an agent first, for example to
            test a configuration. The request body is the same as [Start a
            session](/en/api-reference/api-ref/conversational-ai/v3/start-session), but with the
            agent configuration in `agent` instead of `agent_id`. The agent isn't saved.
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EphemeralSessionStart"
            example:
              agent:
                instructions: You are a friendly assistant. Say hello once, then answer briefly.
                pipeline:
                  mode: cascaded
                  asr:
                    credential:
                      mode: managed
                    vendor: deepgram
                    params:
                      url: wss://api.deepgram.com/v1/listen
                      model: nova-3
                      language: en
                  llm:
                    credential:
                      mode: managed
                    vendor: openai
                    style: openai
                    model: gpt-4.1-mini
                    url: https://api.openai.com/v1/chat/completions
                  tts:
                    credential:
                      mode: managed
                    vendor: minimax
                    params:
                      url: wss://api.minimax.io/ws/v1/t2a_v2
                      model: speech-2.8-turbo
                      audio_setting:
                        sample_rate: 44100
                      voice_setting:
                        speed: 1.0
                        voice_id: English_captivating_female1
              transport:
                type: rtc
                channel: test-channel
                token: <your_rtc_token>
                uid: "1002"
                subscribe_uids:
                  - "1001"
              lifecycle:
                idle_timeout_ms: 10000
      responses:
        "201":
          description: The session has started.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStarted"
              example:
                agent_session_id: a42al97tw77hv93ja98dm74fk56lw97x
                status: running
                created_at: 1791854680
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `MissingRequiredField` when a required field is
            missing, or `InvalidModuleParameter` when the pipeline is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /v3/projects/{appid}/sessions/{agent_session_id}:
    get:
      tags:
        - Sessions
      summary: Retrieve a session
      description: Retrieves the status of a session.
      operationId: retrieve-session
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentSessionId"
      responses:
        "200":
          description: The request was successful. The response body contains the session.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                agent_session_id: a42aj23vm97hc68dm52jk84fj47nv28p
                start_ts: 1791854706
                stop_ts: 1791854718
                status: STOPPED
                message: "agent exits with reason: Idle for too long"
                agent_name: session-50522d42-0b80-40a3-844c-8a2481c72788
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            `InvalidFieldValue`: `agent_session_id` contains characters other than letters,
            digits, `_`, and `-`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`TaskNotFound`: No session has this `agent_session_id`."
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Retrieve returned 404 TaskNotFound for a few seconds right after Stop on
      # staging. Confirm whether that is fixed or needs documenting.
  /v3/projects/{appid}/sessions/{agent_session_id}/stop:
    post:
      tags:
        - Sessions
      summary: Stop a session
      description: Stops a running session.
      operationId: stop-session
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to end a session as soon as its task is complete. Send the request
            without a body. After the session stops, [Retrieve a
            session](/en/api-reference/api-ref/conversational-ai/v3/retrieve-session) returns the
            `STOPPED` status and `stop_ts`.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentSessionId"
      responses:
        "200":
          description: The session is stopping. The response body is an empty object.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                type: object
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`InvalidRequestBody`: The request has a body."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: >-
            `TaskNotFound`: No session has this `agent_session_id`, or the session has already
            ended.
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): The implementation spec says an ended session returns 409
      # TaskNotRunning; staging returns 404 TaskNotFound. Documented as staging behaves.

  # -----------------------------------------------------------------------------------------------
  # Secrets
  # -----------------------------------------------------------------------------------------------
  /v3/projects/{appid}/secrets:
    post:
      tags:
        - Secrets
      summary: Create a secret set
      description: Creates a named set of secrets in your project.
      operationId: create-secret-set
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use secret sets to keep vendor API keys out of your agent configurations. To use a
            secret in an agent, pass `$secrets.<set_name>.<key>` instead of the key itself.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretSetCreate"
            example:
              name: vendor-keys
              secrets:
                asr: <your_asr_api_key>
                llm: <your_llm_api_key>
      responses:
        "201":
          description: The secret set was created. The response body lists its keys.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSet"
              example:
                name: vendor-keys
                keys:
                  - asr
                  - llm
                create_ts: 1791651848
                update_ts: 1791651848
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `SecretSetAlreadyExists`: A set with this name exists. `IdempotencyKeyConflict`: The
            `Idempotency-Key` was used with a different body.
        "422":
          $ref: "#/components/responses/Error"
          description: "`ResourceQuotaLimitExceeded`: The project has reached its secret set quota."
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): SecretSetAlreadyExists is in the reason enum but was not triggered on
      # staging. Also get the secret set quota per project.
    get:
      tags:
        - Secrets
      summary: List secret sets
      description: Retrieves the secret sets in your project.
      operationId: list-secret-sets
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: The maximum number of secret sets to return on each page.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: >-
            The request was successful. The response body contains a page of secret sets.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSetList"
              example:
                data:
                  count: 1
                  list:
                    - name: vendor-keys
                      keys:
                        - asr
                        - llm
                      create_ts: 1791651848
                      update_ts: 1791651848
                has_more: false
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`InvalidFieldValue`: `limit` is out of range."
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /v3/projects/{appid}/secrets/{name}:
    get:
      tags:
        - Secrets
      summary: Retrieve a secret set
      description: Retrieves the key names in a secret set.
      operationId: retrieve-secret-set
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
      responses:
        "200":
          description: >-
            The request was successful. The response body lists the keys in the set. Secret
            values are never returned.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSet"
              example:
                name: vendor-keys
                keys:
                  - asr
                  - llm
                create_ts: 1791651848
                update_ts: 1791651848
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Secrets
      summary: Update a secret set

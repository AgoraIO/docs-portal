          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Number"
              example:
                number_id: 80a5519c-6138-4b72-abb5-34f465ac1951
                number: "+12025550123"
                description: Support line
                sip_trunk:
                  name: Primary trunk
                  hostname: sip.example.com
                  port: 5061
                  transport: tls
                create_ts: 1791651960
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Phone numbers
      summary: Update a phone number
      description: Changes the settings of a phone number.
      operationId: update-number
      x-docs-sections:
        - position: after-description
          markdown: >-
            Send only the fields you want to change. You can reformat the phone number, but you
            can't change it to a different number. To use a different number, create a new one.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/NumberId"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberUpdate"
            example:
              description: Support line, US
      responses:
        "200":
          description: The number was updated. The response body contains the full number.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Number"
              example:
                number_id: 80a5519c-6138-4b72-abb5-34f465ac1951
                number: "+12025550123"
                description: Support line, US
                sip_trunk:
                  name: Primary trunk
                  hostname: sip.example.com
                  port: 5061
                  transport: tls
                create_ts: 1791651960
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`MissingRequiredField`: The `If-Match` header is missing."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Whether `sip_trunk` in a patch merges or replaces (for example, whether
      # omitting `auth` clears the saved credentials).
    delete:
      tags:
        - Phone numbers
      summary: Delete a phone number
      description: Removes a phone number from your project.
      operationId: delete-number
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/NumberId"
      responses:
        "200":
          description: The number was deleted.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Behavior when an active campaign uses the number.

  # -----------------------------------------------------------------------------------------------
  # Campaigns
  # -----------------------------------------------------------------------------------------------
  /v3/projects/{appid}/campaigns:
    post:
      tags:
        - Campaigns
      summary: Create a campaign
      description: Creates an outbound campaign that dials a list of contacts with a saved agent.
      operationId: create-campaign
      x-docs-sections:
        - position: after-description
          markdown: >-
            Each call in the campaign starts a telephony session with the agent in `agent_id`.
            Before you create a campaign, [create the
            agent](/en/api-reference/api-ref/conversational-ai/v3/create-agent) and [register the
            phone number](/en/api-reference/api-ref/conversational-ai/v3/create-number) to call
            from.
      x-docs-callouts:
        - type: caution
          title: Caution
          position: after-description
          markdown: >-
            A campaign places real phone calls. When `schedule.mode` is `immediate`, dialing
            starts as soon as the campaign is created. To test, create a `scheduled` campaign with
            a start date in the future, then [cancel
            it](/en/api-reference/api-ref/conversational-ai/v3/cancel-campaign).
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreate"
            example:
              name: Appointment reminders
              agent_id: 1fa9d015-7457-44ec-8b8f-0273c2f1ce88
              transport:
                type: telephony
                from: 80a5519c-6138-4b72-abb5-34f465ac1951
                call_policy:
                  max_ring_duration_ms: 30000
                  max_call_duration_seconds: 300
              contacts:
                - phone: "+12025550199"
                  values:
                    customer_name: Alex
              pacing:
                max_concurrent: 1
                max_calls_per_second: 1
                max_attempts: 1
              schedule:
                mode: scheduled
                timezone: America/New_York
                start: "2027-01-04T09:00"
                end: "2027-01-05T17:00"
                days:
                  - weekday: mon
                    ranges:
                      - start: "09:00"
                        end: "12:00"
      responses:
        "201":
          description: The campaign was created. The response body contains the campaign.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
              example:
                campaign_id: 3852ce5d-4259-4418-bf44-641abeb65fee
                name: Appointment reminders
                status: scheduled
                agent_id: 1fa9d015-7457-44ec-8b8f-0273c2f1ce88
                transport:
                  type: telephony
                  from:
                    - 80a5519c-6138-4b72-abb5-34f465ac1951
                  call_policy:
                    max_ring_duration_ms: 30000
                    max_call_duration_seconds: 300
                lifecycle:
                  idle_timeout_ms: 30000
                  max_duration_ms: 259200000
                  graceful_stop:
                    enabled: false
                    timeout_ms: 30000
                schedule:
                  mode: scheduled
                  timezone: America/New_York
                  start: "2027-01-04T09:00"
                  end: "2027-01-05T17:00"
                  days:
                    - weekday: mon
                      ranges:
                        - start: "09:00"
                          end: "12:00"
                counts:
                  contacts: 1
                  pending: 1
                  calling: 0
                  completed: 0
                  failed: 0
                  canceled: 0
                create_ts: 1791976303
                start_ts: null
                complete_ts: null
                failure: null
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `InvalidFieldValue` when `contacts` is empty or
            `schedule.start` isn't a date-time string, or `NotImplemented` when a field isn't
            supported yet.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: >-
            `AgentNotFound`: No agent has this `agent_id`. `NumberNotFound`: A number in
            `transport.from` isn't in the project.
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `IdempotencyKeyConflict`: The `Idempotency-Key` was used with a different body.
        "422":
          $ref: "#/components/responses/Error"
          description: "`ResourceQuotaLimitExceeded`: The project has reached its campaign quota."
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Limits on contacts per campaign, and the campaign quota.
    get:
      tags:
        - Campaigns
      summary: List campaigns
      description: Retrieves the campaigns in your project.
      operationId: list-campaigns
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CampaignStatus"
          description: Return only campaigns with this status.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: The maximum number of campaigns to return on each page.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: The request was successful. The response body contains a page of campaigns.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
      # TODO(v3-confirm): Default and maximum `limit`; whether `status` accepts several values.
  /v3/projects/{appid}/campaigns/{campaign_id}:
    get:
      tags:
        - Campaigns

openapi: 3.1.0
info:
  version: ''
  title: 对话式智能体 API 概述
  description: |-
    本文介绍声网对话式智能体服务 RESTful API 的基本信息。

    ## 数据格式

    所有 HTTP 请求的 `Content-Type` 请求 Header 均为 `application/json`。所有请求和响应内容的格式均为 JSON。
servers:
  - url: 'https://api.agora.io/cn/api/conversational-ai-agent'
    description: ''
paths:
  '/v2/projects/{appid}/join':
    post:
      # tags:
      #   - 智能体管理
      summary: 创建对话式智能体
      description: 创建一个对话式智能体 (Conversational AI agent) 实例，并加入 RTC 频道。
      operationId: start-agent
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/appid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - properties
              properties:
                name:
                  type: string
                  description: 智能体唯一标识，相同标识不可重复创建。
                properties:
                  type: object
                  description: 智能体详细配置。
                  required:
                    - channel
                    - agent_rtc_uid
                    - remote_rtc_uids
                    - tts
                    - llm
                  properties:
                    channel:
                      type: string
                      description: 智能体加入的 RTC 频道名。
                    token:
                      type: string
                      description: '加入 RTC 频道使用的 Token，即用于鉴权的动态密钥。如果你的项目已启用 App 证书，则务必在该字段中传入你项目的动态密钥。详见[使用 Token 鉴权](/zh-CN/realtime-media/rtc/basic-features/token-authentication)。'
                    agent_rtc_uid:
                      type: string
                      description: |-
                        智能体在 RTC 频道内的用户 ID。
                        > 同一 `channel` 内的用户 ID 不可重复，否则智能体加入频道会失败。
                    remote_rtc_uids:
                      type: array
                      description: '智能体在 RTC 频道中订阅的用户 ID 列表，只有订阅的用户才能与智能体互动。目前只支持订阅一个用户 ID。 '
                      items:
                        type: string
                    # agent_rtm_uid:
                    #   type: string
                    #   description: |-
                    #     > 该字段已废弃，请参考 [FAQ](https://doc.shengwang.cn/faq/integration-issues/generate-token) 生成同时具备 RTC 和 RTM 权限的 Token，之后改用 `agent_rtc_uid` 字段。

                    #     智能体在 RTM 频道内的用户 ID。仅在 `advanced_features.enable_rtm` 为 `true` 时生效。
                    enable_string_uid:
                      type: boolean
                      default: false
                      description: |
                        是否启用 String UID：
                        - `true`：智能体和订阅用户 ID 均使用 String UID。
                        - `false`：（默认）智能体和订阅用户 ID 均使用 Int UID。
                        > 同一频道内，Int 型和 String 型的用户 ID 不可混用。更多使用 String UID 的相关信息请参考[如何使用 String 型用户 ID](https://doc.shengwang.cn/faq/integration-issues/string-uid)。
                    idle_timeout:
                      type: integer
                      minimum: 0
                      maximum: 259200
                      description: |-
                        RTC 频道的最大空闲时间，单位为秒。系统检测到 `remote_rtc_uids` 中指定的用户已全部离开频道后，会开始计算空闲时长；空闲时长超过该值时，智能体会自动停止并退出频道。
                        - 取值范围为 `[0, 259200]`，默认值为 `30`。其中 `259200` 秒即 72 小时，超过该值会报错。
                        - 设置为 `0` 仅表示不因“频道空闲超时”退出。
                        - 无论 `idle_timeout` 取值为何，单次任务的最长运行时间均为 72 小时；达到 72 小时后，智能体会自动退出。
                      default: 30
                    # silence_timeout:
                    #   type: integer
                    #   default: 0
                    #   description: |-
                    #     > 该字段已废弃，请改用 `parameters.silence_config`。

                    #     智能体最大静默时间 (s)，取值范围为 [0,60]。智能体创建成功，且用户加入频道后，智能体不处于倾听、思考或说话状态的持续时间称为智能体静默时间。静默时间达到设定值后，智能体将播报 `llm.silence_message` 中填写的静默提示消息，之后重新计算静默时间。
                    #     - 设置为 `0`（默认值）：表示不启用该功能。
                    #     - 设置为 (0,60] 时，必须同时设置 `llm.silence_message` 才能正常播报静默提示消息，否则设置无效。
                    advanced_features:
                      type: object
                      description: 高级功能配置。
                      properties:
                        # enable_aivad:
                        #   type: boolean
                        #   default: false
                        #   description: |-
                        #     > 该字段已废弃，请改用 `turn_detection.config.end_of_speech.mode` 为 `semantic` 实现。
                        enable_rtm:
                          type: boolean
                          description: |-
                            是否启用实时消息 RTM 服务。启用后智能体会自动登录 RTM 并订阅 `channel` 中指定的频道，可结合 RTM 提供的能力实现一些进阶功能，例如[传递自定义信息](/zh-CN/ai/user-guides/custom-data)。

                            > 启用 RTM 服务前需要确保 Token 同时具备 RTC 和 RTM 权限。智能体加入 RTM 频道会复用 `token` 字段配置的 Token。你可以参考 [FAQ](https://doc.shengwang.cn/faq/integration-issues/generate-token) 了解如何生成同时具备 RTC 和 RTM 权限的 Token。
                          default: false
                        enable_sal:
                          type: boolean
                          description: |-
                            是否启用选择性注意力锁定（Selective Attention Locking, SAL）功能。启用后，在 `sal` 字段中完成相关设置，智能体即可识别用户的声纹特征，有效区分不同说话者，屏蔽 95% 的环境人声、噪声。
                            > 该功能目前处于 Beta 阶段。
                          default: false
                        enable_tools:
                          type: boolean
                          description: |-
                            是否启用工具调用功能。启用后，智能体可以调用 MCP 服务器提供的工具，实现更复杂的业务逻辑。
                          default: false
                    asr:
                      type: object
                      description: 自动语音识别 (ASR) 配置。
                      properties:
                        language:
                          type: string
                          description: "用户与智能体互动时使用的语言：\r\n- `zh-CN`：中文（支持中英文混合）\r\n- `en-US`：英语"
                          default: zh-CN
                        vendor:
                          type: string
                          description: |-
                            ASR 服务供应商，可选以下值：
                            - `fengming`：（默认）声网凤鸣 ASR。
                            - `tencent`：腾讯 ASR。
                            - `microsoft`：微软 ASR。
                            - `xfyun`：(Beta) 讯飞云传统语音转写识别服务。
                            - `xfyun_bigmodel`：(Beta) 讯飞云语音识别大模型服务。
                            - `xfyun_dialect`：(Beta) 讯飞云方言自由说识别服务。
                        params:
                          $ref: '#/components/schemas/asr_params'
                          description: |
                            指定 ASR 供应商的配置参数。
                            > 你可以参考调用示例中不同 ASR 供应商的参数填写样例。
                    tts:
                      type: object
                      description: 文本转语音 (TTS) 模块配置。
                      required:
                        - vendor
                        - params
                      properties:
                        vendor:
                          type: string
                          description: |
                            TTS 供应商，支持传入以下值：
                            - `minimax`：Minimax TTS
                            - `tencent`：腾讯 TTS
                            - `bytedance`：火山引擎 TTS
                            - `microsoft`：微软 Azure TTS
                            - `cosyvoice`：(Beta) 阿里云 CosyVoice TTS
                            - `bytedance_duplex`：火山引擎双向流式 TTS
                            - `stepfun`：(Beta) 阶跃星辰 TTS
                        skip_patterns:
                          type: array
                          description: |
                            过滤模式配置，用于控制是否跳过 LLM 返回文本中括号内的内容，避免智能体播报不必要的结构性提示信息如语气、动作描述等。默认值为 `[]`，即不过滤任何内容。可选值如下，传入即启用该功能：
                            
                            - `1`：跳过中文圆括号（ ）中的内容
                            - `2`：跳过中文方括号【 】中的内容
                            - `3`：跳过英文圆括号 ( ) 中的内容
                            - `4`：跳过英文方括号 [ ] 中的内容
                            - `5`：跳过英文花括号 \{ } 中的内容

                            > - 当输入文本中存在嵌套括号，且多种括号类型都被配置为跳过时，智能体只处理最外层括号，即系统将从文本的起始位置开始匹配，一旦找到第一个符合跳过规则的最外层括号对，该括号对及其包含的所有内容（包括任何嵌套的其他类型括号）都将被整体跳过。
                            > - 无论是否打开[实时字幕](/zh-CN/ai/user-guides/realtime-sub)，智能体短期记忆都会包含被过滤的内容，即 LLM 生成的完整文本。
                            > - 开启[实时字幕](/zh-CN/ai/user-guides/realtime-sub)时，实时字幕在 TTS 播报时不会包含被过滤的内容，等这句话播报完毕后，字幕会把这些内容添加回来。
                            > - 火山引擎双向流式 TTS 暂不支持该功能。
                          items:
                            type: integer
                          default: []
                        params:
                          $ref: '#/components/schemas/tts_params'
                          description: |
                            指定 TTS 供应商的配置参数。
                            > 你可以参考调用示例中不同 TTS 供应商的参数填写样例。
                    llm:
                      type: object
                      description: 大语言模型 (LLM) 配置。
                      required:
                        - url
                      properties:
                        url:
                          type: string
                          description: LLM 回调地址，要求与 OpenAI 协议兼容。
                        api_key:
                          type: string
                          description: LLM 鉴权 API key。默认为空，生产环境中务必启用 API key。
                        system_messages:
                          type: array
                          description: 一组每次调用 LLM 时被附加在最前的预定义信息，用于控制 LLM 输出。可以是角色设定、提示词和回答样例等。要求与 OpenAI 协议兼容。
                          items:
                            type: object
                            additionalProperties: {}
                        max_history:
                          $ref: '#/components/schemas/max_history'
                        input_modalities:
                          type: array
                          description: |
                            LLM 的输入模态，支持：
                            - `["text"]`：（默认）仅文字。
                            - `["text", "image"]`：文字加图片。推荐配置，要求所选 LLM 支持视觉模态输入。
                          items:
                            type: string
                        output_modalities:
                          type: array
                          
                          description: "LLM 的输出模态，支持：\r\n- `[\"text\"]`：（默认）仅文字。输出的文字会经过 TTS 模块转换成语音后发布至 RTC 频道。\r\n- `[\"audio\"]`：仅语音。语音会直接发布至 RTC 频道。\r\n- `[\"text\", \"audio\"]`：文字加语音。你可以自行编写逻辑，按需处理 LLM 的输出。"
                          items:
                            type: string
                        greeting_message:
                          type: string
                          description: |-
                            智能体问候语文本。如果填写，则在频道内没有订阅用户列表 (`remote_rtc_uids`) 中的用户时，智能体会自动向首位加入频道的订阅用户发送问候语。

                            - 你可以单独配置该字段，走原有实时 TTS 开场白路径。
                            - 也可以在配置 `greeting_audio_url` 时，将该字段作为录音开场白的兜底文本。
                            - 当 `greeting_configs.interruptable = true` 且录音开场白被用户打断时，系统会结合 `greeting_message` 估算已播报的文本片段，并将其注入短期记忆以保持对话上下文连贯。
                        
                        greeting_audio_url:
                          type: string
                          maxLength: 2048
                          format: uri
                          description: |-
                            智能体问候语录音文件的 URL。配置后，系统会优先下载并播放该录音作为开场白。

                            支持以下格式的音频文件：
                            - `mp3`
                            - `wav`
                            - `pcm`

                            使用说明如下：
                            - 仅支持 `http://` 或 `https://` 开头的 URL；空字符串、非 URL 字符串或长度超过 `2048` 字节时，请求会返回 `400` 错误。
                            - 对于 `pcm` 文件，需要额外通过 `greeting_configs.audio_pcm_sample_rate` 指定采样率。
                            - 系统会将导入的音频统一转换为与 `tts.params.sample_rate` 一致的采样率后再进行播报。
                            >- 配置 `greeting_audio_url` 时，必须同时配置 `greeting_message`用于异常回退；否则请求会返回 `400` 错误。
                            >- 当 `greeting_audio_url` 对应的录音下载失败、解码失败或格式不支持时，系统会自动使用 `greeting_message` 进行 TTS 合成并继续播报。
                        greeting_configs:
                          type: object
                          description: |
                            智能体问候语播报配置。
                          properties:
                            mode:
                              type: string
                              description: |
                                智能体问候语播报模式，支持以下选项：
                                - `"single_every"`：（默认）每次有用户加入空频道时，智能体都播报一次问候语。
                                - `"single_first"`：仅首位用户加入空频道时，智能体播报一次问候语。
                            delay_ms:
                              type: integer
                              minimum: 0
                              maximum: 5000
                              default: 0
                              description: 智能体问候语播报延迟时间 (ms)，取值范围为 [0, 5000]。配置后，智能体问候语会在用户加入频道后等待指定时间再播报。
                            interruptable:
                              type: boolean
                              description: |
                                智能体问候语是否可被打断：
                                - `true`：（默认）可打断，遵循全局打断配置 (`interruption`)。
                                - `false`：不可打断，问候语会完整播放；播放期间识别到的用户 ASR 文本会被静默接收，待问候语结束后拼接为单轮 user 消息，再统一送入大模型进行一次推理和回复。
                            audio_download_timeout_ms:
                              type: integer
                              minimum: 200
                              maximum: 10000
                              default: 1000
                              description: |-
                                录音开场白下载超时时间，单位为毫秒。仅在配置 `greeting_audio_url` 时生效。
                                - 取值范围为 `[200, 10000]`。
                                - `null` 和字段缺失均视为未配置，此时使用默认值 `1000`。
                                - 超时后系统会回退到 `greeting_message` 的 TTS 路径。
                            audio_pcm_sample_rate:
                              type: integer
                              default: 16000
                              description: |-
                                录音开场白为 PCM 文件时的采样率，单位为 Hz。仅在配置 `greeting_audio_url` 且录音格式为 PCM 时生效。
                                - 默认值为 `16000`。
                                - `mp3` 和 `wav` 文件无需配置该字段。
                        template_variables:
                          type: object
                          description: |-
                            动态参数配置，用于在智能体的 `system_messages`、`greeting_message`、`failure_message` 和 `parameters.silence_config.content` 文本中插入变量。键值对形式，键为变量名，值为变量值。
                            
                            **使用方式**:在 Prompt 文本中使用 `{{variable_name}}` 格式引用变量，系统会自动将其替换为 `template_variables` 中定义的对应值。
                            > 变量名和变量值不支持引用其他变量。例如自定义变量 `"farewell": "期待下次再见，{{name}}"`，其中的 `{{name}}` 不会被解析。
                          additionalProperties:
                            type: string
                        failure_message:
                          type: string
                          description: 智能体处理失败提示语。如果填写，则在 LLM 调用错误时会通过 TTS 模块返回。
                        # silence_message:
                        #   type: string
                          
                        #   description: |-
                        #     > 该字段已废弃，请改用 `parameters.silence_config`。

                        #     静默提示消息。默认为空字符串。智能体创建成功，且用户加入频道后，智能体不处于倾听、思考或说话状态的持续时间称为智能体静默时间。静默时间达到 `silence_timeout` 中设定的值后，智能体将播报静默提示消息。`silence_timeout` 设置为 `0` 时，该参数无效。
                        # style:
                        #   type: string
                        #   description: "LLM 协议，支持以下值：\r\n- `\"openai\"`（默认）\r\n- `\"dify\"`\r\n- `\"gemini\"`\r\n- `\"anthropic\"`"
                        vendor:
                          type: string
                          
                          description: |-
                            LLM 供应商，支持以下两种设置：
                            - 商业大模型供应商，支持以下值：
                              - `aliyun`：阿里云
                              - `bytedance`：字节跳动
                              - `deepseek`：深度求索
                              - `tencent`：腾讯

                              设置后，可提高兼容性，减少因携带 LLM 不支持的信息而导致请求失败的情况。
                            - 自定义 LLM，即设为 `"custom"`。设置后智能体调用 custom LLM 时，除了 `role` 和 `content` 外，将额外携带以下信息：
                              - `turn_id`：唯一的对话轮次标识符。`turn_id` 从 0 开始递增，用户和智能体的一轮对话对应一个 `turn_id`。
                              - `timestamp`：请求时间戳，精度为毫秒。
                        mcp_servers:
                          type: array
                          description: MCP (Model Context Protocol) 服务器配置列表。通过配置 MCP 服务器，智能体可以调用外部服务提供的工具，实现更复杂的业务逻辑。
                          items:
                            type: object
                            required:
                              - name
                              - endpoint
                            properties:
                              name:
                                type: string
                                description: |
                                  MCP 服务器的唯一标识。长度不超过 48 字符，支持以下字符：
                                  - 所有小写英文字母：a 到 z
                                  - 所有大写英文字母：A 到 Z
                                  - 所有数字字符：0 到 9
                                  - "." 和 "-"
                              endpoint:
                                type: string
                                description: MCP 服务器的端点地址，智能体将通过该地址与 MCP 服务器通信。
                              transport:
                                type: string
                                description: |
                                  传输协议类型，支持传入以下值：
                                  - `"streamable_http"`：流式 HTTP 协议
                              headers:
                                type: object
                                description: 请求 MCP 服务器时携带的 HTTP 头部信息，例如认证信息。
                                additionalProperties:
                                  type: string
                              allowed_tools:
                                type: array
                                description: |
                                  允许智能体调用的工具列表。只有在此列表中的工具才能被智能体使用。
                                  > `allowed_tools` 字段生效规则:
                                  > - 不填写 `allowed_tools` 字段：所有工具都生效
                                  > - 填写 `allowed_tools` 字段：
                                  >    - 填写为 `[]`：所有工具不生效
                                  >    - 填写为 `["*"]`：所有工具生效
                                  >    - 填写为 `["aa", "bb", "cc"]`：`aa`、`bb`、`cc` 生效
                                  >    - 填写为 `["aa", "bb", "*"]`：所有工具生效
                                items:
                                  type: string
                              timeout_ms:
                                type: integer
                                description: MCP 服务器请求超时时间，单位为毫秒。请求超时后，智能体将不会等待 MCP 服务器响应，而是继续执行后续逻辑。
                                default: 10000
                        headers:
                          type: object
                          description: |
                            请求 LLM 时附带的自定义请求 Header。你可以通过该字段透传业务自定义字段、租户标识等业务相关信息。
                            > - 该参数传入的请求 Header 会与对话式 AI 引擎默认生成的请求 Header 合并；当键冲突时，以对话式 AI 引擎生成的请求 Header 为准（例如认证相关 Header）。
                            > - Header 键按字符串精确匹配进行合并（区分大小写），声网建议统一使用标准写法，避免同名不同大小写导致歧义。
                          additionalProperties: {}
                        params:
                          type: object
                          
                          description: 在消息体内传输的 LLM 附加信息，例如使用的模型、最大 Token 数限制等。不同的 LLM 供应商支持的配置不同，请参考对应文档按需填入。
                          additionalProperties: {}
                    avatar:
                      type: object
                      description: 数字人 (Avatar) 配置。
                      properties:
                        enable:
                          type: boolean
                          description: |
                            是否为智能体启用数字人功能：
                            - `true`：启用。启用后需配置 `vendor` 和 `params` 字段。
                            - `false`：（默认）不启用。

                            > 开启数字人功能将产生 RTC 视频通话费用，详见 [RTC 计费说明](/zh-CN/realtime-media/rtc/billing/billing-strategy)。
                        vendor:
                          type: string
                          description: |
                            数字人供应商，支持传入以下值：
                            - `sensetime`：商汤数字人
                            - `spatius`：Spatius 数字人
                        params:
                          $ref: '#/components/schemas/avatar_params'
                          description: |
                            指定数字人供应商的配置参数。
                            > 你可以参考调用示例中不同数字人供应商的参数填写样例。
                    turn_detection:
                      type: object
                      description: |-
                        对话轮次检测设置，用于控制语音活动检测和对话轮次判定逻辑。

                        > 自 v2.6 起，`turn_detection` 仅负责开始说话（SoS）和结束说话（EoS）的检测。关键词打断和关闭打断后的处理策略已迁移至顶级 `interruption` 字段。
                      properties:
                        mode:
                          type: string
                          
                          description: |-
                            对话轮次检测模式，当前支持以下值：
                            - `"default"`：（默认）默认模式，使用标准的对话轮次检测配置。
                          enum:
                            - default
                          default: default
                        config:
                          type: object
                          
                          description: 对话轮次检测详细配置。
                          properties:
                            speech_threshold:
                              type: number
                              description: 语音识别灵敏度，取值范围为 (0.0, 1.0)。决定音频信号中何种程度的声音被视为"语音活动"。较低的值会使智能体更容易检测到语音，较高的值则可能忽略微弱声音。
                              format: float
                              default: 0.5
                            start_of_speech:
                              type: object
                              description: 对话开始 (Start of Speech, SoS) 检测配置，用于判定用户何时开始说话。
                              properties:
                                mode:
                                  type: string
                                  description: |-
                                    对话开始检测模式，支持以下值：
                                    - `"vad"`：（默认）基于 VAD（语音活动检测）触发，使用音频信号检测。
                                    - `"manual"`：手动 SoS 模式。关闭服务端自动 SoS 检测，由客户端通过 RTM 消息显式声明用户开始说话。
                                    - `"keywords"`：已废弃，请改用 `properties.interruption.mode = "keywords"` 配置关键词打断。
                                    - `"disabled"`：已废弃，请改用 `properties.interruption.enable = false` 配合 `properties.interruption.disabled_config.strategy` 配置关闭打断后的处理策略。

                                    > 使用 `"manual"` 时：
                                    > - 必须同时开启 `advanced_features.enable_rtm = true`。
                                    > - 必须同时设置 `parameters.data_channel = "rtm"`。
                                    > - 不支持传入 `manual_config`；该模式下无需公开配置项。

                                '{mode}_config':
                                  $ref: '#/components/schemas/start_of_speech_config'
                                  description: |
                                    对话开始检测配置参数。根据 `mode` 传入对应的配置字段。
                                    - 当 `mode = "manual"` 时无需传入额外配置字段。
                            end_of_speech:
                              type: object
                              description: 对话结束 (End of Speech, EoS) 检测配置，用于判定用户何时结束说话。
                              properties:
                                mode:
                                  type: string
                                  description: |-
                                    对话结束检测模式，支持以下值：
                                    - `"vad"`：（默认）基于 VAD（语音活动检测）触发，检测静音持续时间。
                                    - `"semantic"`：优雅打断，基于语义触发，使用语义理解模块判定用户是否结束说话还是短暂停顿。该模式目前仅支持识别中文和英文文本。
                                    - `"manual"`：手动 EoS 模式。关闭服务端自动 EoS 判停，由客户端通过 RTM 消息显式声明用户结束说话。

                                    > 使用 `"manual"` 时：
                                    > - 必须同时开启 `advanced_features.enable_rtm = true`。
                                    > - 必须同时设置 `parameters.data_channel = "rtm"`。
                                    > - 不支持传入 `manual_config`；该模式下无需公开配置项。
                                '{mode}_config':
                                  $ref: '#/components/schemas/end_of_speech_config'
                                  description: |
                                    对话结束检测配置参数。根据 `mode` 传入对应的配置字段。
                                    - 当 `mode = "manual"` 时，不支持传入 `manual_config`。
                    interruption:
                      type: object
                      description: |-
                        智能打断控制配置，用于统一管理智能体被用户打断的行为策略。
                      properties:
                        enable:
                          type: boolean
                          default: true
                          description: |-
                            是否开启智能体打断功能：
                            - `true`：（默认）开启。
                            - `false`：关闭。关闭后，智能体不会被中途打断。
                        mode:
                          type: string
                          default: start_of_speech
                          description: |-
                            打断触发方式，支持以下值：
                            - `"start_of_speech"`：（默认）用户开始说话时触发打断。
                            - `"keywords"`：用户说出指定关键词时触发打断，在 `keywords_config` 字段中配置触发关键词。
                        keywords_config:
                          type: object
                          description: |-
                            基于关键词触发打断的配置。仅在 `mode = "keywords"` 时生效。
                          properties:
                            trigger_keywords:
                              type: array
                              description: 触发打断的关键词列表。最多支持设置 128 个关键词。
                              items:
                                type: string
                        disabled_config:
                          type: object
                          description: |-
                            关闭打断功能后的处理策略。仅在 `interruption.enable` 为 `false` 时生效。
                          properties:
                            strategy:
                              type: string
                              description: |
                                关闭打断功能后的处理策略，支持以下值：
                                - `"append"`：追加模式，人声不打断智能体。智能体会在当前交互结束后处理刚才收到的人声请求。
                                - `"ignore"`：忽略模式，智能体忽略人声请求。如果智能体正在说话或思考中途收到人声，智能体会直接忽略并丢弃人声请求，不存入上下文。
                    sal:
                      type: object
                      description: |-
                        选择性注意力锁定（Selective Attention Locking, SAL）配置。
                        > 该功能目前处于 Beta 阶段。
                      properties:
                        sal_mode: 
                          type: string
                          description: |-
                            选择性注意力锁定模式，支持以下选项：
                            - `"locking"`：（默认）主讲人锁定模式。智能体锁定主讲人，屏蔽 95% 的环境人声、噪声。该模式可通过两种方式启用：
                              - 无感识别：用户在对话初期大声、清晰地说话，智能体即可自动将用户识别为主讲人。
                              - 预注册：创建智能体时，通过 `sample_urls` 字段预注册一名主讲人的声纹 URL，智能体将根据预注册的声纹 URL 锁定主讲人。
                            - `"recognition"`：声纹识别模式。你可以通过 `sample_urls` 字段预注册声纹 URL，目前仅支持单声纹注册。智能体将识别不同的说话人并抑制其他背景人声和环境噪音。识别到的说话人身份会通过 `metadata` 字段里的 `vpids` 字段标识并发送给 LLM，你需要将 `llm.vendor` 设置为 `"custom"`，并参考[自定义大模型](/zh-CN/ai/user-guides/custom-llm)了解如何让 LLM 处理说话人信息。
                          default: "locking"
                        sample_urls:
                          type: object
                          description: |-
                            注册声纹 URL，为键值对形式，键为注册的声纹名称，值为对应说话者的声纹 URL 下载地址。
                            > - 传入的声纹名称不可设置为 `"unknown"`，这是一个保留关键字，用于标识未知说话人。
                            > - 对于注册的声纹，需满足以下条件：
                            >   - 数量: 每个任务请求的注册声纹URL数量，目前仅支持单声纹，数量为 1 个。
                            >   - 大小: 单个声纹文件不得超过 2 MB。
                            >   - 时长：时长为 10 到 15 秒, 其中有效音频不小于 8 秒（不能有太多静音段）。
                            >   - 格式: 必须为 16k 采样率、16bit 位深、单声道的 PCM 音频文件，文件名后缀必须为 `.pcm`。
                    labels:
                      type: object
                      description: |-
                        自定义标签，键值对形式，键为标签名，值为标签值。用于让智能体携带自定义业务信息。
                        
                        这些自定义信息会与智能体绑定，并在对话式 AI 引擎所有类型消息通知回调的 `payload` 字段中返回，可用于实现自定义业务逻辑，例如标记活动 ID、客户分组、业务场景等。
                      additionalProperties:
                        type: string
                    rtc:
                      type: object
                      description: RTC 媒体内容加密配置。
                      properties:
                        encryption_key:
                          type: string
                          description: |-
                            字符串类型的加密密钥，长度不受限制。声网建议使用 32 字节的密钥。
                            > 如果未设置加密密钥或将其设置为空，则无法使用内置加密。
                        encryption_salt:
                          type: string
                          description: |-
                            用于加密的盐值，Base64 编码的字符串，解码后长度为 32 字节。
                            > 该参数仅在 `encryption_mode` 设为 `7`（AES_128_GCM2）或 `8`（AES_256_GCM2）时生效。在此情况下，请确保该参数不为空。
                        encryption_mode:
                          type: integer
                          description: |-
                            内置加密模式，支持以下值：
                            - `1`: AES_128_XTS - 128 位 AES 加密，XTS 模式。
                            - `2`: AES_128_ECB - 128 位 AES 加密，ECB 模式。
                            - `3`: AES_256_XTS - 256 位 AES 加密，XTS 模式。
                            - `4`: SM4_128_ECB - 128 位 SM4 加密，ECB 模式。
                            - `5`: AES_128_GCM - 128 位 AES 加密，GCM 模式。
                            - `6`: AES_256_GCM - 256 位 AES 加密，GCM 模式。
                            - `7`: AES_128_GCM2 - 128 位 AES 加密，GCM 模式。该模式需设置 salt（`encryption_salt`）。
                            - `8`: AES_256_GCM2 - 256 位 AES 加密，GCM 模式。该模式需设置 salt（`encryption_salt`）。
                            
                            > 声网建议使用 `7`（AES_128_GCM2）或 `8`（AES_256_GCM2）模式，这两种模式支持使用加密盐以提升安全性。
                    filler_words:
                      type: object
                      description: |-
                        垫词功能 (Beta) 配置，用于在 LLM 响应等待时播报垫词，缓解用户等待焦虑，提升对话流畅度。
                        
                        垫词播报遵循以下规则：
                        - **播报顺序**：当多个垫词或 LLM 响应等待播报时，按照文本到达的先后顺序进行播报。
                        - **打断控制**：继承全局配置中的打断模式设置 (`turn_detection.config`)。
                      properties:
                        enable:
                          type: boolean
                          description: |-
                            是否启用垫词功能：
                            - `true`：启用。
                            - `false`：（默认）不启用。
                          default: false
                        trigger:
                          type: object
                          description: 垫词触发配置，定义何时触发垫词播报。
                          properties:
                            mode:
                              type: string
                              description: |-
                                垫词触发模式，支持以下值：
                                - `"fixed_time"`：固定时间触发。当 LLM 响应等待时间超过设定阈值时触发垫词播报。
                            '{mode}_config':
                              $ref: '#/components/schemas/filler_words_trigger_config'
                              description: |
                                垫词触发配置参数。根据 `mode` 选择对应的配置。
                        content:
                          type: object
                          description: 垫词内容配置，定义垫词的来源和选择规则。
                          properties:
                            mode:
                              type: string
                              description: |-
                                垫词内容模式，支持以下值：
                                - `"static"`：静态垫词。使用预定义的垫词列表。
                            '{mode}_config':
                              $ref: '#/components/schemas/filler_words_content_config'
                              description: |
                                垫词内容配置参数。根据 `mode` 选择对应的配置。
                    parameters:
                      type: object
                      description: 智能体参数配置。
                      properties:
                        silence_config:
                          type: object
                          
                          description: 智能体静默设置。
                          properties:
                            timeout_ms:
                              type: integer
                              description: "智能体最大静默时间 (ms)，取值范围为 [0,60000]。智能体创建成功，且用户加入频道后，智能体不处于倾听、思考或说话状态的持续时间称为智能体静默时间。静默时间达到设定值后，智能体将播报静默提示消息。该功能可用于在用户不活跃时让智能体提醒用户。\r\n- 设置为 `0`（默认值）：表示不启用该功能。\r\n- 设置为 `(0,60000]` 时，必须同时设置 `content` 才能正常播报静默提示，否则设置无效。"
                            action:
                              type: string
                              description: "静默时间达到设定值后，智能体采取的行为，可设为以下值：\r\n- `\"speak\"`：（默认）使用 TTS 模块播报静默提示内容 (`content`)。\r\n- `\"think\"`：将静默提示内容 (`content`) 追加在上下文的最后，并传递给 LLM。"
                            content:
                              type: string
                              description: 静默提示消息的内容。设置的内容会根据 `action` 中的设置以不同的方式使用。
                        farewell_config:
                          type: object
                          description: 智能体优雅挂断设置。
                          properties:
                            graceful_enabled:
                              type: boolean
                              description: |-
                                是否启用优雅退出（Graceful Leave）功能：
                                - `true`：启用。开启后，调用 [POST 停止对话式智能体](/zh-CN/api-reference/api-ref/conversational-ai/leave)接口，让智能体退出频道时，会确保智能体处于静默状态（`IDLE`）后再离开频道。
                                - `false`：（默认）不启用。
                              default: false
                            graceful_timeout_seconds:
                              type: integer
                              description: 优雅退出超时时间 (s)，表示在退出频道前等待智能体进入静默状态（`IDLE`）的最长时间，超出该时间后，即便智能体不处于静默状态，也会立即退出频道。该字段仅在 `graceful_enabled` 为 `true` 时生效，取值范围为 [0,120]。
                              default: 30
                        data_channel:
                          type: string
                          description: |-
                            智能体数据传输通道，可选以下值：
                            - `rtm`：使用 RTM 传输。该配置仅在 `advanced_features.enable_rtm` 为 `true` 时生效。
                            - `datastream`：（默认）使用 RTC 的 [`DataStream`](https://doc.shengwang.cn/api-ref/rtc/android/API/toc_datastream#callback_irtcengineeventhandler_onstreammessage) 传输。

                            > 如果 `turn_detection.config.start_of_speech.mode` 或 `turn_detection.config.end_of_speech.mode` 为 `manual`，则必须同时开启 `advanced_features.enable_rtm = true`，并将该字段设为 `rtm`。
                        enable_metrics:
                          type: boolean
                          
                          default: false
                          description: |-
                            是否接收智能体性能数据：
                            - `true`：接收。
                            - `false`：（默认）不接收。
                            
                            该配置仅在 `advanced_features.enable_rtm` 为 `true` 时生效。你可以参考[监听智能体事件](/zh-CN/ai/user-guides/listen-agent-events)了解如何使用客户端组件接收智能体性能数据，或参考[接收 Webhook 事件](/zh-CN/ai/webhook/enable-ncs)了解如何使用 Webhook 接收智能体性能数据。
                        enable_error_message:
                          type: boolean
                          default: false
                          description: |-
                            是否接收智能体错误事件：
                            - `true`：接收。
                            - `false`：（默认）不接收。
                            
                            该配置仅在 `advanced_features.enable_rtm` 为 `true` 时生效。你可以参考[监听智能体事件](/zh-CN/ai/user-guides/listen-agent-events)了解如何使用客户端组件接收智能体错误事件。
                        opt_out:
                          type: boolean
                          default: false
                          description: |-
                            是否关闭当前会话的数据留存:
                            - `false`：（默认）不关闭。
                            - `true`：关闭会话数据留存。关闭后将无法依托历史内容开展故障排查、效果复盘与智能体优化。

                            > 为保障服务运行、智能体迭代调优与故障排查，默认在最短必要周期内临时留存会话交互文本、音频。若您的业务对数据存储有严格的安全或合规要求，建议启用该字段，关闭当前会话的数据留存。
                        # ifttt:
                        #   type: object
                        #   description: |-
                        #     IFTTT (If This Then That) 自动化触发配置，用于根据智能体的状态自动执行特定操作。
                            
                        #     通过配置触发条件（如智能体处于特定状态持续一定时间），系统可以自动调用 MCP 服务器提供的工具，实现自动挂断、自动留言、状态转换等自动化流程。
                        #   properties:
                        #     jobs:
                        #       type: array
                        #       description: 自动化任务列表，每个任务定义一个触发条件和对应的执行动作。
                        #       items:
                        #         type: object
                        #         properties:
                        #           state:
                        #             type: string
                        #             description: |-
                        #               触发条件的状态匹配规则。支持以下格式：
                        #               - `"state_name"`：智能体处于指定状态时触发。
                        #               - `"!state_name"`：智能体不处于指定状态时触发（使用 `!` 前缀表示否定）。
                                      
                        #               常见状态包括：`listening`（倾听中）、`thinking`（思考中）、`speaking`（说话中）、`idle`（空闲）等。
                        #           duration_ms:
                        #             type: integer
                        #             description: 状态持续时间阈值 (ms)。当智能体持续处于指定状态达到该时间后，触发执行动作。
                        #           tool:
                        #             type: string
                        #             description: 要调用的工具名称，该工具必须在 `mcp_servers` 配置的 `allowed_tools` 列表中。
                        #           from:
                        #             type: string
                        #             description: 工具所属的 MCP 服务器引用，格式为 `"mcp_servers/{server_name}"`，其中 `{server_name}` 是 `mcp_servers` 中定义的服务器名称。
                        #           args:
                        #             type: object
                        #             description: 调用工具时传递的参数，具体参数结构取决于工具的定义。
                        #             additionalProperties: true
            examples:
              Defalut:
                value:
                  name: unique_name
                  properties:
                    channel: channel_name
                    token: token
                    agent_rtc_uid: '123'
                    remote_rtc_uids:
                      - '321'
                    enable_string_uid: false
                    idle_timeout: 120
                    llm:
                      url: 'https://api.minimax.chat/v2/text/chatcompletion_v2'
                      api_key: xxx
                      system_messages:
                        - role: system
                          content: You are a helpful chatbot.
                      greeting_message: 您好，有什么可以帮您？
                      failure_message: 抱歉，我无法回答这个问题。
                      max_history: 32
                      params:
                        model: abab6.5s-chat
                        max_token: 1024
                        userName: Tomas
                    asr:
                      language: zh-CN
                      vendor: fengming
                    tts:
                      vendor: minimax
                      skip_patterns: [1]
                      params:
                        group_id: xxxx
                        key: xxxx
                        model: speech-01-turbo
                        voice_setting:
                          voice_id: female-shaonv
                          speed: 1
                          vol: 1
                          pitch: 0
                          emotion: happy
                        audio_setting:
                          sample_rate: 16000
              # 录音开场白:
              #   value:
              #     name: outbound_voice_agent
              #     properties:
              #       channel: outbound_call_channel_001
              #       token: token
              #       agent_rtc_uid: '123'
              #       remote_rtc_uids:
              #         - '321'
              #       enable_string_uid: false
              #       idle_timeout: 120
              #       llm:
              #         url: 'https://api.minimax.chat/v2/text/chatcompletion_v2'

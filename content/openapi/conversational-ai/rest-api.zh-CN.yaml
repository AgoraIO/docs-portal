components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: |
       发送 HTTP 请求时，你需要从以下鉴权方式中任选其一：
        1. **（推荐）使用 RTC Token**：将用于声网对话式 AI 引擎项目使用的 RTC Token 填入 `Authorization` 字段。你可以选择以下方式获取 Token：
            - 测试环境下，你可以从[声网控制台](https://console.shengwang.cn/)为你的项目生成临时 Token（有效期为 24 小时）。
            - 生产环境下，你可以参考[使用 Token 鉴权](/zh-CN/ai/build/http-basic-auth#使用-rtc-token-鉴权-推荐)部署 Token 服务器以生成 Token。
              - 传参示例：`Authorization: agora token="007abcxxxxxxx123"`
        2. **使用 Basic Auth**：参考[实现 HTTP 安全认证](/zh-CN/ai/build/http-basic-auth#使用-http-基本认证)生成 Base64 编码的 `Authorization` 字段。
              - 传参示例：`Authorization: Basic NDI1OTQ3N2I4MzYy...YwZjA=`
      required: true
      schema:
        type: string
    appid:
      name: appid
      in: path
      description: '你的项目使用的 [App ID](/zh-CN/ai/get-started/enable-service#%E8%8E%B7%E5%8F%96-app-id)。'
      required: true
      schema:
        type: string
    agentId:
      name: agentId
      in: path
      description: '智能体实例 ID，即智能体的唯一标识。调用 [POST 创建对话式智能体](/zh-CN/api-reference/api-ref/conversational-ai/join) 成功后在响应包体中获取。'
      required: true
      schema:
        type: string
    phone_number:
      name: phone_number
      in: path
      description: E.164 格式的电话号码（如：+11234567890），作为唯一标识符。
      required: true
      schema:
        type: string
  responses:
    '200':
      description: |-
        - 若返回的状态码为 `200` 则表示请求成功。响应包体中包含本次请求的结果。
        - 若返回的状态码不为 `200` 则表示请求失败。响应包体中包含错误的类别和描述，你可以参考[响应状态码](/zh-CN/ai/api/response-code)了解可能的原因。
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                agent_id: 1NT29X10YHxxxxxWJOXLYHNYB
                create_ts: 1737111452
                state: RUNNING
            properties:
              agent_id:
                $ref: '#/components/schemas/agent_id'
                description: 智能体唯一标识。
              create_ts:
                $ref: '#/components/schemas/start_ts'
                description: 智能体创建时间戳。
              status:
                type: string
                description: "智能体运行状态：\r\n- `IDLE` (0)：空闲状态的智能体。\r\n- `STARTING` (1)：正在启动的智能体。\r\n- `RUNNING` (2)：正在运行的智能体。\r\n- `STOPPING` (3)：正在停止的智能体。\r\n- `STOPPED` (4)：已完成退出的智能体。\r\n- `FAILED` (6)：执行失败的智能体。"
          examples:
            Example 1:
              value:
                agent_id: 1NT29X10YHxxxxxWJOXLYHNYB
                create_ts: 1737111452
                status: RUNNING
    phone_number_error:
      description: |
        若返回的 HTTP 状态码不为成功状态码，则表示请求失败。响应包体将包含一个 JSON 对象，其中包含错误的类型和描述。
        
        **可能的状态码及原因:**
        
        - 401 `unauthorized`：认证失败，请检查您的凭证。
        - 404 `not_found`：未找到指定的电话号码。
        - 409 `phone_number_exists`：电话号码已存在，不允许重复导入。
        - 409 `conflict`：并发修改冲突或资源被锁定。
        - 422 `unprocessable_content`：请求格式错误或参数校验失败。
        - 500 `internal_server_error`：服务器内部错误。
      content:
        application/json:
          schema:
            type: object
            properties:
              error_type:
                type: string
                description: 错误类型。
              description:
                type: string
                description: 错误描述。
          examples:
            Example 1:
              value:
                error_type: "unauthorized"
                description: "认证失败，请检查您的凭证。"
    outbound_call_error:
      description: |
        若返回的 HTTP 状态码不为 200，则表示请求失败。响应包体将包含一个 JSON 对象，其中包含错误的类型和描述。
        
        **可能的状态码及原因:**
        
        - 400 `invalid_phone_format`：电话号码格式无效（非 E.164 格式）。
        - 401 `unauthorized`：认证失败，请检查您的凭证。
        - 500 `internal_server_error`：服务器内部错误。
      content:
        application/json:
          schema:
            type: object
            properties:
              error_type:
                type: string
                description: 错误类型。
              description:
                type: string
                description: 错误描述。
          examples:
            Example 1:
              value:
                error_type: "invalid_phone_format"
                description: "电话号码格式无效（非E.164格式）。"
  schemas:
    voice_id:
      type: string
      title: voice_id
      description: '智能体音色 ID，支持的音色 ID 详见[音色 ID 表](/zh-CN/ai/api/voice-ids)。'
    max_history:
      type: integer
      description: LLM 中缓存的短期记忆条目数。取值范围为 `[1,1024]`。短期记忆包括用户和智能体对话消息、工具调用信息和时间戳。智能体和用户会单独记录短期记忆条目。
      default: 32
    tts_params:
      title: params
      description: |-
        TTS 配置参数。不同 TTS 供应商下该参数结构不同。
        > 各供应商示例代码中未提及的参数，声网对话式 AI 引擎不保证完全支持。
      oneOf:
        - $ref: '#/components/schemas/tts_minimax'
        - $ref: '#/components/schemas/tts_tencent'
        - $ref: '#/components/schemas/tts_bytedance'
        - $ref: '#/components/schemas/tts_microsoft'
        - $ref: '#/components/schemas/tts_cosyvoice'
        - $ref: '#/components/schemas/tts_duplex'
        - $ref: '#/components/schemas/tts_stepfun'
    tts_minimax:
      title: Minimax
      type: object
      additionalProperties: {}
      description: |-
        Minimax TTS，具体协议详见 [Minimax 官方文档](https://platform.minimaxi.com/docs/api-reference/speech-t2a-http)。以下为示例：
        ```json
        "params": {
            "key": "xxxx",
            "model": "speech-01-turbo",
            "voice_setting": {
                "voice_id": "female-shaonv",
                "speed": 1,
                "vol": 1,
                "pitch": 0,
                "emotion": "happy",
                "latex_read": True,
                "english_normalization": True,
            },
            "audio_setting": {
                "sample_rate": 16000
            },
            "pronunciation_dict": {
                "tone": ["这是/(zei3)(si4)", "消息/(xiao3)(xi4)"]
            },
            # voice_id和timber_weights二选一必填
            # "timber_weights": [{
            #     "voice_id": "male-qn-qingse",
            #     "weight": 1
            # },
            # {
            #     "voice_id": "female-shaonv",
            #     "weight": 5
            # }],
            "language_boost": "auto"
        }
        ```
    tts_tencent:
      title: Tencent
      type: object
      additionalProperties: {}
      description: |-
        腾讯云 TTS，具体协议详见[腾讯云官方文档](https://cloud.tencent.com/document/product/1073/94308)。以下为示例：
        ```json
        "params": {
            "app_id": "xxxx",
            "secret_id": "xxxx",
            "secret_key": "xxxx",
            "voice_type": 601005,
            "volume": 0,
            "speed": 0,
            "emotion_category": "happy",
            "emotion_intensity": 100
        }
        ```
    tts_bytedance:
      title: Bytedance
      type: object
      description: |-
        火山 TTS，具体协议详见[火山引擎官方文档](https://www.volcengine.com/docs/6561/79823)。以下为示例：
        ```json
        "params": {
            "token": "xxxxx",
            "app_id": "xxxx",
            "cluster": "volcano_tts",
            "voice_type": "BV700_streaming",
            "speed_ratio": 1.0,
            "volume_ratio": 1.0,
            "pitch_ratio": 1.0,
            "emotion": "happy"
        }
        ```
      additionalProperties: {}
    tts_cosyvoice:
      title: CosyVoice
      type: object
      additionalProperties: {}
      description: |-
        阿里云 CosyVoice TTS，具体协议详见[阿里云官方文档](https://help.aliyun.com/zh/model-studio/cosyvoice-large-model-for-speech-synthesis/)。以下为示例：
        ```json
        "params": {
          "api_key": "your_cosyvoice_api_key",
          "model": "cosyvoice-v1",
          "sample_rate": 16000,
          "voice": "longxiaochun"
        }
        ```
    tts_duplex:
      title: Bytedance Duplex
      type: object
      additionalProperties: {}
      description: |-
       火山引擎双向流式 TTS，具体协议详见[火山引擎官方文档](https://www.volcengine.com/docs/6561/1329505)。以下为示例：
        ```json
        "params": {
          "app_id": "your_bytedance_tts_app_id",
          "token": "your_bytedance_tts_token",
          "speaker": "zh_female_shuangkuaisisi_moon_bigtts"
        }
        ```
    tts_stepfun:
      title: StepFun
      type: object
      additionalProperties: {}
      description: |-
       阶跃星辰 TTS，具体协议详见[阶跃星辰官方文档](https://platform.stepfun.com/docs/api-reference/audio/ws_audio)。以下为示例：
        ```json
        "params": {
          "api_key": "your_stepfun_tts_key",
          "model": "step-tts-mini",
          "voice_id": "cixingnansheng"
        }
        ```
    agent_id:
      title: agent_id
      type: string
      description: 对话式智能体 ID，即智能体唯一标识。
    channel:
      title: channel
      type: string
      description: 智能体所在 RTC 频道名。
    start_ts:
      title: start_ts
      type: integer
      description: 智能体创建时间戳。
    tts_microsoft:
      title: Microsoft
      type: object
      additionalProperties: {}
      description: |-
        微软 Azure TTS。以下为示例和参数说明：
        ```json
        "params": {
            "key": "<your_microsoft_key>",
            "region": "chinaeast2",
            "voice_name": "zh-CN-YunxiNeural",
            "speed": 1.0,
            "volume": 70
        }
        ```
        - `key`：（必需）String。微软 Azure 的 API key。
        - `region`：（必需）String。微软 TTS 服务的区域。
        - `voice_name`：（必需）String。音色。
        - `speed`：（可选）Number。语速。取值范围为 [0.5, 2.0]，默认值为 1.0。用于指示文本的语速。语速可以在单词或句子级别应用。
        - `volume`：（可选）Number。音量。取值范围为 [0.0, 100.0]，默认值为 100。例如，值为 75 表示音量设置为最大音量的 75%。
        - `sample_rate`：（可选）Integer。音频采样率 (Hz)。可选取值为 [16000, 24000, 48000]，默认值为 24000。

        > 更多信息请参考[微软官方文档](https://docs.azure.cn/zh-cn/ai-services/speech-service/)。
    metrics_modality:
      title: modality
      type: string
      description: 延迟模块名称，根据[创建对话式智能体](/zh-CN/api-reference/api-ref/conversational-ai/join)时设置的 LLM 输入模态的不同，返回不同的延迟模块。
      oneOf:
        - $ref: '#/components/schemas/metrics_modality_text'
        - $ref: '#/components/schemas/metrics_modality_audio'
    metrics_modality_text:
      title: text
      type: string
      description: |
        LLM 输入模态为 `text` 时，返回的延迟模块：
          - `algorithm_processing`：算法处理延迟，表示从用户说话结束的实际时间到判定出用户说话结束的延迟时间。
          - `asr_ttlw`：ASR 模块的 ttlw（Time To Last Word）指标，表示从检测到用户说话结束到 ASR 输出最后一个词的延迟时间。
          - `llm_ttft`：LLM 模块的 ttft（Time To First Token）指标，表示从 LLM 收到请求到输出第一个 token 的延迟时间。
          - `llm_ftfs`：LLM 模块的 ftfs（First token To First Sentence）指标，表示从 LLM 输出第一个 token 到输出第一个完整句子的延迟时间。
          - `tts_ttfb`：TTS 模块的 ttfb（Time To First Byte）指标，表示从 TTS 模块收到文本请求开始到 TTS 输出第一个音频字节的延迟时间。
          - `transport`：网络传输延迟 (ms)。目前，当用户使用 RTC Web SDK 时，不返回该字段。
    metrics_modality_audio:
      title: audio
      type: string
      description: |
        LLM 输入模态为 `audio` 时，返回的延迟模块：
          - `algorithm_processing`：算法处理延迟，表示从用户说话结束的实际时间到判定出用户说话结束的延迟时间。
          - `asr_ttlw`：ASR 模块的 ttlw（Time To Last Word）指标，表示从检测到用户说话结束到 ASR 输出最后一个词的延迟时间。
          - `llm_ttfa`：LLM 模块的 ttfa（Time To First Audio）指标，表示从 LLM 收到请求到输出第一个音频字节的延迟时间。
          - `transport`：网络传输延迟 (ms)。目前，当用户使用 RTC Web SDK 时，不返回该字段。
    eos_metadata:
      title: metadata
      description: |-
        结束附加元数据，根据 `type` 字段的不同，包含不同的字段。
      oneOf:
        - $ref: '#/components/schemas/eos_metadata_ok'
        - $ref: '#/components/schemas/eos_metadata_interrupted'
        - $ref: '#/components/schemas/eos_metadata_ignored'
        - $ref: '#/components/schemas/eos_metadata_error'
    eos_metadata_ok:
      title: ok
      type: object
      description: 正常结束附加元数据。
      properties:
        playback_duration_ms:
          type: integer
          description: 语音播放时长(ms)。
    eos_metadata_interrupted:
      title: interrupted
      type: object
      description: 中断附加元数据。
      properties:
        caused_by:
          type: string
          description: |
            轮次中断原因：
            - `start_of_speech`：新一条语音请求开始。
            - `api_speak`：因调用[播报自定义信息](/zh-CN/api-reference/api-ref/conversational-ai/speak)接口播报信息而中断。
            - `api_interrupt`：因调用[打断智能体](/zh-CN/api-reference/api-ref/conversational-ai/interrupt)接口而中断。
            - `api_leave`：因调用[停止对话式智能体](/zh-CN/api-reference/api-ref/conversational-ai/leave)接口离开频道而中断。
            - `user_no_longer_present`：因智能体检测不到可订阅用户而中断。
        transport:
          type: string
          description: |
            传输协议（`caused_by` 为 `api_speak` 或 `api_interrupt` 时返回）：
            - `http`：HTTP 协议。
            - `rtm`：通过 RTM Presence 通道传输。
    eos_metadata_ignored:
      title: ignored
      type: object
      description: 忽略附加元数据。
      properties:
        caused_by:
          type: string
          description: |
            轮次忽略原因：
            - `semantic`：在[创建对话式智能体](/zh-CN/api-reference/api-ref/conversational-ai/join)时开启优雅打断功能（`turn_detection.config.end_of_speech.mode` 为 `semantic`）后，因语义规则判断无需响应而被忽略。
            - `keywords`：在[创建对话式智能体](/zh-CN/api-reference/api-ref/conversational-ai/join)时开启基于关键词的对话开始检测功能（`turn_detection.config.start_of_speech.mode` 为 `keywords`）后，因未命中轮次开始检测关键词导致该轮对话被忽略。
            - `disable`：因对话轮次检测功能设置为不可打断，导致该轮对话被忽略。
    eos_metadata_error:
      title: error
      type: object
      description: 错误附加元数据。
      properties:
        reason:
          type: string
          description: |
            错误类型，可能包含以下值：
            - `LLM_REQUEST_ERR`：LLM 请求错误。
            - `INTERNAL_ERR`：内部错误。
        details:
          type: string
          description: 错误详情。
    sos_metadata:
      title: metadata
      description: |-
        开始附加元数据，根据 `type` 字段的不同，包含不同的字段。
      oneOf:
        - $ref: '#/components/schemas/sos_metadata_voice_input'
        - $ref: '#/components/schemas/sos_metadata_greeting'
        - $ref: '#/components/schemas/sos_metadata_silence_timeout'
        - $ref: '#/components/schemas/sos_metadata_api_speak'
    sos_metadata_voice_input:
      title: voice_input
      type: object
      description: 语音输入附加元数据。
      properties:
        speech_duration_ms:
          type: integer
          description: 语音持续时长(ms)。
        interrupt_duration_ms:
          type: integer
          description: 智能体空闲或倾听时的人声持续阈值 (ms)。
    sos_metadata_greeting:
      title: greeting
      type: object
      description: 问候语附加元数据。
      properties:
        greeting_nth:
          type: integer
          description: 问候语播放次数。
    sos_metadata_silence_timeout:
      title: silence_timeout
      type: object
      description: 静默超时附加元数据。
      properties:
        action:
          type: string
          description: |
            - `speak`：播报静默提示内容。
            - `think`：将静默提示内容追加在上下文的最后，并传递给 LLM。
    sos_metadata_api_speak:
      title: api_speak
      type: object
      description: 播报自定义信息附加元数据。
      properties:
        transport:
          type: string
          description: |
            传输协议：
            - `http`：HTTP 协议。
            - `rtm`：通过 RTM Presence 通道传输。
    asr_params:
      title: params
      description: |-
        ASR 配置参数。不同 ASR 供应商下该参数结构不同。
        > 各供应商示例代码中未提及的参数，声网对话式 AI 引擎不保证完全支持。
      oneOf:
        - $ref: '#/components/schemas/asr_tencent'
        - $ref: '#/components/schemas/asr_microsoft'
        - $ref: '#/components/schemas/asr_xfyun'
        - $ref: '#/components/schemas/asr_xfyun_bigmodel'
        - $ref: '#/components/schemas/asr_xfyun_dialect'
    asr_tencent:
      title: Tencent
      type: object
      additionalProperties: {}
      description: |-
        腾讯云 ASR，具体协议详见[腾讯云官方文档](https://cloud.tencent.com/document/product/1093/48982)。以下为示例：
        ```json
        "params": {
            "secret_id": secret_id,
            "app_id": app_id,
            "secret_key": secret_key,
            "engine_model_type": "16k_zh",
            "voice_id": "TBgVFCsxdn3i2DGt",
        }
        ```
    asr_xfyun:
      title: xfyun
      type: object
      additionalProperties: {}
      description: |-
        讯飞云传统语音转写识别服务，具体协议详见[讯飞官方文档](https://www.xfyun.cn/doc/spark/asr_llm/rtasr_llm.html)。以下为示例：
        ```json
        "params": {
            "api_key": "XFYUN_ASR_API_KEY",
            "app_id": "XFYUN_ASR_APP_ID",
            "api_secret": "XFYUN_ASR_API_SECRET",
            "language": "zh_cn"
        }
        ```
    asr_xfyun_bigmodel:
      title: xfyun_bigmodel
      type: object
      additionalProperties: {}
      description: |-
        讯飞云语音识别大模型服务，具体协议详见[讯飞官方文档](https://www.xfyun.cn/doc/spark/asr_llm/rtasr_llm.html)。以下为示例：
        ```json
        "params": {
            "api_key": "XFYUN_ASR_BIGMODEL_API_KEY",
            "app_id": "XFYUN_ASR_BIGMODEL_APP_ID",
            "api_secret": "XFYUN_ASR_BIGMODEL_API_SECRET",
            "language_name": "cn",
            "language":"mix"
        }
        ```
    asr_xfyun_dialect:
      title: xfyun_dialect
      type: object
      additionalProperties: {}
      description: |-
        讯飞云方言自由说识别服务，具体协议详见[讯飞官方文档](https://www.xfyun.cn/doc/spark/asr_llm/rtasr_llm.html)。以下为示例：
        ```json
        "params": {
            "app_id": "XFYUN_ASR_DIALOG_APP_ID",
            "access_key_id": "XFYUN_ASR_DIALOG_ACCESS_KEY_ID",
            "access_key_secret":"XFYUN_ASR_DIALOG_ACCESS_KEY_SECRET",
            "language": "zh-CN"
        }
        ```
    asr_microsoft:
      title: Microsoft
      type: object
      additionalProperties: {}
      description: |-
        微软 ASR。以下为示例：
        ```json
        "params": {
            "key": "<your_microsoft_key>",
            "region": "chinaeast2",
            "language": "zh-CN",
            "phrase_list": ["agora", "fengming"],
        }
        ```
        - `key`：（必需）String。微软 ASR 服务的 API key。
        - `region`：（必需）String。微软 ASR 服务的区域。详见[支持的区域](https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support?tabs=stt)。
        - `language`：（必需）String。语言。详见[支持的语言](https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support?tabs=stt)。
        - `phrase_list`：（可选）Array[String]。热词列表。
    avatar_params:
      title: params
      description: |-
        数字人配置参数。不同数字人供应商下该参数结构不同。
        > 各供应商示例代码中未提及的参数，声网对话式 AI 引擎不保证完全支持。
      oneOf:
        - $ref: '#/components/schemas/avatar_sensetime'
        - $ref: '#/components/schemas/avatar_spatius'
    avatar_sensetime:
      title: Sensetime
      type: object
      additionalProperties: {}
      description: |-
        商汤数字人配置参数，具体协议详见[商汤官方文档](https://aigc.softsugar.com/html/help/5-%E7%9B%B4%E6%92%AD.html#%E7%9B%B4%E6%92%AD%E8%84%9A%E6%9C%ACjson%E5%AE%9A%E4%B9%89%E8%AF%B4%E6%98%8E)。以下为示例：
        ```json
        "params": {
            "agora_token": "agora_token",
            "agora_uid": "agora_uid",
            "appId": "sensetime_app_id",
            "app_key": "sensetime_app_key",
            "sceneList": [
                {
                    "digital_role": {
                        "face_feature_id": "face_feature_id",
                        "position": {"x": 0, "y": 0},
                        "url": "https://example-digital-human-models/avatar_id.zip"
                    }
                }
            ]
        }
        ```
        > - 以下商汤数字人配置字段当前不支持在 `params` 中透传：`tts_config`、`tts_query`、`audios`、`quick_response`、`quick_response_preload_list`、`opening_words`。
        > - `agora_uid` 必须为大小不超过 32 位(`0` 到 `2^32-1`))的纯数字字符串，例如 `"1234"`。
        > - `agora_uid` 作为数字人在 RTC 频道内使用的用户 ID，同一 `channel` 内的用户 ID 不可重复，否则数字人加入频道会失败。
    avatar_spatius:
      title: Spatius
      type: object
      additionalProperties: {}
      description: |-
        Spatius 数字人配置参数。以下为示例：
        ```json
        "params": {
            "spatius_api_key": "spatius_api_key",
            "spatius_app_id": "spatius_app_id",
            "spatius_avatar_id": "spatius_avatar_id",
            "agora_uid": "agora_uid",
            "agora_token": "agora_token",
            "region": "cn-beijing",
            "sample_rate": 16000,
            "session_expire_minutes": 30
        }
        ```
        - `spatius_api_key`：（必需）String。Spatius API Key，仅在服务端使用。
        - `spatius_app_id`：（必需）String。Spatius App ID。
        - `spatius_avatar_id`：（必需）String。要渲染的数字人形象 ID。
        - `agora_uid`：（必需）String。Avatar Publisher 的 Agora UID，必须独立于用户 UID 和 Agent UID。
        - `agora_token`：（可选）String。为 `agora_uid` 在目标频道生成的 RTC Token。
        - `region`：（可选）String。Spatius 服务节点。中国大陆场景可设为 `cn-beijing`。
        - `sample_rate`：（可选）Integer。音频采样率，建议与 `tts.params.audio_setting.sample_rate` 保持一致，通常为 `16000` 或 `24000`。
        - `session_expire_minutes`：（可选）Integer。Spatius 会话有效时长，单位为分钟，默认为 `30`。
    filler_words_trigger_config:
      title: config
      description: |-
        垫词触发配置参数。不同触发模式下该参数名称和结构不同。
        > - 传入的配置类型需要和 `mode` 相匹配。例如 `mode` 为 `"fixed_time"` 时，需传入 `fixed_time_config` 对应的配置。
        > - 不可同时传入多个模式配置。
      oneOf:
        - $ref: '#/components/schemas/filler_words_trigger_fixed_time_config'
        # - $ref: '#/components/schemas/filler_words_trigger_semantic_config'
    filler_words_trigger_fixed_time_config:
      title: fixed_time_config
      type: object
      description: |-
        固定时间触发配置。以下为示例：
        ```json
        "config": {
            "response_wait_ms": 1500
        }
        ```
      properties:
        response_wait_ms:
          type: integer
          description: LLM 响应等待阈值 (ms)，取值范围为 [100, 10000]。当 LLM 处于等待状态（例如等待 RAG 检索结果、工具调用结果）的持续时间达到该阈值且未生成响应内容时，触发垫词播报。
          default: 1500
    # filler_words_trigger_semantic_config:
    #   title: semantic_config
    #   type: object
    #   description: |-
    #     语义触发配置（未来支持）。以下为示例：
    #     ```json
    #     "config": {
    #     }
    #     ```
    #   properties: {}
    filler_words_content_config:
      title: config
      description: |-
        垫词内容配置参数。不同内容模式下该参数名称和结构不同。
        > - 传入的配置类型需要和 `mode` 相匹配。例如 `mode` 为 `"static"` 时，需传入 `static_config` 对应的配置。
        > - 不可同时传入多个模式配置。
      oneOf:
        - $ref: '#/components/schemas/filler_words_content_static_config'
        # - $ref: '#/components/schemas/filler_words_content_generated_config'
    filler_words_content_static_config:
      title: static_config
      type: object
      description: |-
        静态垫词配置。以下为示例：
        ```json
        "static_config": {
            "phrases": [
                "请稍等。",
                "好的。",
                "嗯嗯。"
            ],
            "selection_rule": "shuffle"
        }
        ```
      properties:
        phrases:
          type: array
          description: |-
            垫词短语列表。
            > - 最多支持 100 个垫词。
            > - 每个垫词长度不超过 50 个中文字符或 50 个英文单词。
          items:
            type: string
          maxItems: 100
        selection_rule:
          type: string
          description: |-
            垫词选择规则，支持以下值：
            - `"shuffle"`：随机打乱。在所有垫词都被使用完一轮前，已使用的垫词不会重复播报；只有所有垫词播报完后，才会重新随机打乱并开始新的一轮。
            - `"round_robin"`：轮询。从垫词列表中顺序选取并播报，所有垫词播报完一轮后，开始新的循环播报。
          enum:
            - shuffle
            - round_robin
          default: shuffle
    # filler_words_content_generated_config:
    #   title: generated_config
    #   type: object
    #   description: |-
    #     动态生成垫词配置（未来支持）。以下为示例：
    #     ```json
    #     "config": {
    #         "llm_provider": "tongyi_qianwen",
    #         "prompt": "生成一个5字以内的简短回应，表示正在处理中",
    #         "fallback_strategy": "none",
    #         "generation_timeout_ms": 2000
    #     }
    #     ```
    #   properties:
    #     llm_provider:
    #       type: string
    #       description: |-
    #         用于生成垫词的 LLM 供应商，支持以下值：
    #         - `"tongyi_qianwen"`：通义千问。
    #         - `"openai"`：OpenAI。
    #     prompt:
    #       type: string
    #       description: 生成垫词的 Prompt 指令。例如："生成一个 5 字以内的简短回应，表示正在处理中"。
    #     fallback_strategy:
    #       type: string
    #       description: |-
    #         生成失败时的降级策略，支持以下值：
    #         - `"none"`：不降级，不播报垫词。
    #       enum:
    #         - none
    #     generation_timeout_ms:
    #       type: integer
    #       description: 生成超时时间 (ms)，取值范围为 [100, 5000]。超时后将根据 `fallback_strategy` 处理。
    #       default: 2000
    #       minimum: 100
    #       maximum: 5000
    start_of_speech_config:
      title: '{mode}_config'
      description: |-
        对话开始检测配置参数。不同检测模式下该参数结构和支持的字段不同。
        你需要根据 `mode` 传入对应的配置字段。例如 `mode` 为 `"vad"` 时，需传入 `vad_config`。不可同时传入多个模式配置。
        当 `mode` 为 `"manual"` 时，无需传入任何 `manual_config`，且公开接口不支持该字段。
      oneOf:
        - $ref: '#/components/schemas/start_of_speech_vad_config'
        - $ref: '#/components/schemas/start_of_speech_keywords_config'
        - $ref: '#/components/schemas/start_of_speech_disabled_config'
    start_of_speech_vad_config:
      title: vad_config
      type: object
      description: |-
        基于 VAD 的对话开始检测配置。以下为示例：
        ```json
        "vad_config": {
            "interrupt_duration_ms": 160,
            "speaking_interrupt_duration_ms": 160,
            "prefix_padding_ms": 800,
        }
        ```
      properties:
        interrupt_duration_ms:
          type: integer
          description: 智能体空闲或倾听时的人声持续阈值 (ms)，取值范围为 [120, 1200]。持续检测到人声信号的最小时间长度，避免误打断。
          default: 160
        speaking_interrupt_duration_ms:
          type: integer
          description: 智能体说话时的人声持续阈值 (ms)，取值范围为 [120, 1200]。持续检测到人声信号的最小时间长度，避免误打断。通常设置得比 `interrupt_duration_ms` 更长，以避免智能体说话时被较短人声误打断。
          default: 160
        prefix_padding_ms:
          type: integer
          description: 前缀填充阈值 (ms)，取值范围为 [0, 5000]。开始新的语音片段所需的最短语音持续时间，避免非常短的声音触发语音活动检测。
          default: 800
        # ignored_words:
        #   type: array
        #   description: |-
        #     忽略词列表。使用语义模块识别这些词语，当检测到这些词语时不触发对话开始（例如："嗯嗯"、"好的"、"uh-huh"、"okay"）。
        #     > - 忽略词的识别能力与你所选择的 ASR 供应商有关。
        #     > - 最多支持设置 128 个忽略词。
        #   items:
        #     type: string
        #   maxItems: 128
    start_of_speech_keywords_config:
      title: keywords_config
      type: object
      deprecated: true
      description: 已废弃。请改用顶级 `interruption.mode = "keywords"` 配合 `interruption.keywords_config.trigger_keywords` 实现关键词打断。
      properties: {}
    start_of_speech_semantic_config:
      title: semantic_config
      type: object
      description: |-
        基于语义的对话开始检测配置。以下为示例：
        ```json
        "semantic_config": {
            "interrupt_duration_ms": 160,
            "prefix_padding_ms": 800,
        }
        ```
      properties:
        interrupt_duration_ms:
          type: integer
          description: 人声持续阈值 (ms)，取值范围为 [120, 1200]。持续检测到人声信号的最小时间长度，避免误打断。
          default: 160
        prefix_padding_ms:
          type: integer
          description: 前缀填充阈值 (ms)，取值范围为 [0, 5000]。开始新的语音片段所需的最短语音持续时间，避免非常短的声音触发语音活动检测。
          default: 800
        # ignored_words:
        #   type: array
        #   description: |-
        #     忽略词列表。使用语义模块识别这些词语，当检测到这些词语时不触发对话开始（例如："嗯嗯"、"好的"）。
        #     > - 该字段为可选。若不设置，则只要语义触发就会开始对话。
        #     > - 若设置了该字段，则只有在不匹配忽略词且语义触发的情况下才会开始对话。
        #     > - 忽略词的识别能力与你所选择的 ASR 供应商有关。
        #     > - 最多支持设置 128 个忽略词。
        #   items:
        #     type: string
        #   maxItems: 128
    start_of_speech_disabled_config:
      title: disabled_config
      type: object
      deprecated: true
      description: 已废弃。请改用 `interruption.enable = false` 配合 `interruption.disabled_config.strategy` 配置关闭打断后的处理策略。
      properties: {}
    end_of_speech_config:
      title: '{mode}_config'
      description: |-
        对话结束检测配置参数。不同检测模式下该参数结构和支持的字段不同。
        你需要根据 `mode` 传入对应的配置字段。例如 `mode` 为 `"vad"` 时，需传入 `vad_config`。不可同时传入多个模式配置。
        当 `mode` 为 `"manual"` 时，无需传入任何 `manual_config`，且公开接口不支持该字段。
      oneOf:
        - $ref: '#/components/schemas/end_of_speech_vad_config'
        - $ref: '#/components/schemas/end_of_speech_semantic_config'
    end_of_speech_vad_config:
      title: vad_config
      type: object
      description: |-
        基于 VAD 的对话结束检测配置。以下为示例：
        ```json
        "vad_config": {
            "silence_duration_ms": 480
        }
        ```
      properties:
        silence_duration_ms:
          type: integer
          description: 静音持续阈值 (ms)，取值范围为 [120, 2000]。语音结束时的最短静音持续时间，确保短暂的停顿不会过早结束语音片段。
          default: 480
    end_of_speech_semantic_config:
      title: semantic_config
      type: object
      description: |-
        基于语义的对话结束检测配置。以下为示例：
        ```json
        "semantic_config": {
            "silence_duration_ms": 240,
            "max_wait_ms": 3000,
            "pause_state_enabled": true
        }
        ```
      properties:
        silence_duration_ms:
          type: integer
          description: 静音持续阈值 (ms)，取值范围为 [120, 2000]。语音结束时的最短静音持续时间，确保短暂的停顿不会过早结束语音片段。
          default: 240
        max_wait_ms:
          type: integer
          description: 最大等待时间 (ms)，取值范围为 [500, 10000]，传入 `-1` 表示永远等待。等待语义判定的最长时间，超时后将基于当前状态判定对话是否结束。
          default: 3000
        pause_state_enabled:
          type: boolean
          default: true
          description: |
            是否判定用户有暂停对话的意图:
            - `true`：（默认）智能体会根据语义判断用户是否想要暂停对话。例如，当用户输入以“等一下”、“稍等”等词结束时，智能体可根据语义判断用户有暂停对话的意图并等待用户后续输入，而不是判断用户输入结束并直接发送给 LLM。
            - `false`：智能体不判定用户是否想要暂停对话。
    phone_number_object:
      title: phone_number_object
      type: object
      description: 电话号码对象，包含电话号码的详细信息。
      properties:
        provider:
          type: string
          description: |
            号码提供商，可选以下值：
            - `"byo"`：BYO（Bring Your Own）。
            - `"aliyun"`：阿里云。
        phone_number:
          type: string
          description: E.164 格式的电话号码，作为唯一标识符。
        label:
          type: string
          description: 用于标识该号码的标签。
        inbound:
          type: boolean
          description: 号码是否支持内呼。
        outbound:
          type: boolean
          description: 号码是否支持外呼。
        associated_pipeline:
          type: object
          nullable: true
          description: 关联的 Pipeline 信息，或为 `null`。
          properties:
            pipeline_id:
              type: string
              description: Pipeline ID。
            pipeline_name:
              type: string
              description: Pipeline 名称。
        inbound_config:
          type: object
          nullable: true
          description: SIP 内呼配置详情，或为 `null`。
        outbound_config:
          type: object
          nullable: true
          description: SIP 外呼配置详情，或为 `null`。
  securitySchemes:
    Basic Auth:
      type: http
      scheme: basic
      description: '发送 HTTP 请求时，你需要通过 Basic HTTP 认证，并将生成的凭证填入 HTTP 请求的 `Authorization` Header。具体生成 `Authorization` 字段的方法请参考[实现 HTTP 安全认证](/zh-CN/ai/user-guides/http-basic-auth)。'
security:
  - {}
  - Basic Auth: []

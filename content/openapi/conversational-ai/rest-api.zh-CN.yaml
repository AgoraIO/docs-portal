      operationId: agent-think
      description: 向指定智能体发送一段自定义文本指令。
      x-docs-sections:
        - position: after-description
          markdown: 该接口会将传入文本作为用户输入注入当前对话链路，并由对话式 AI 引擎继续按照普通用户输入的处理逻辑进行推理和响应。你可以使用该接口实现隐式指令注入、客户端事件触发和语音与文本协同等场景。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: 自定义指令文本内容。系统会将其作为用户输入注入当前对话链路。
                on_listening_action:
                  type: string
                  description: |
                    智能体处于倾听状态时的处理动作，支持以下值：
                    - `"inject"`：自定义文本指令注入当前轮次，不打断当前轮次。
                    - `"interrupt"`：（默认）立即打断当前处理流程，并发起新一轮对话。
                    - `"ignore"`：忽略本次请求。
                on_thinking_action:
                  type: string
                  description: |
                    智能体处于思考状态时的处理动作，支持以下值：
                    - `"interrupt"`：（默认）打断当前状态，并发起新一轮对话。
                    - `"ignore"`：忽略本次请求。
                on_speaking_action:
                  type: string
                  description: |
                    智能体处于说话状态时的处理动作，支持以下值：
                    - `"interrupt"`：打断当前状态，并发起新一轮对话。
                    - `"ignore"`：（默认）忽略本次请求。
                interruptable:
                  type: boolean
                  description: |
                    是否允许用户说话打断自定义指令：
                    - `true`：（默认）允许。
                    - `false`：不允许。
                  default: true
                metadata:
                  type: object
                  description: 自定义元数据。你可以通过该字段传入业务标识等附加信息。
                  additionalProperties: {}
            examples:
              Example 1:
                value:
                  text: 用户刚才点击了购买按钮
                  on_listening_action: interrupt
                  on_thinking_action: interrupt
                  on_speaking_action: ignore
                  interruptable: true
                  metadata:
                    publisher: user123
                    model: deepseek-r1

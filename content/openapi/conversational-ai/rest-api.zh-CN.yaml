            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: 播报的文本内容，最长不超过 512 字节 (bytes)。
                priority:
                  type: string
                  description: |-
                    播报行为的优先级，支持设为以下值：
                    - `"INTERRUPT"`：（默认）高优先级，打断并播报。智能体会终止当前交互，直接播报消息。
                    - `"APPEND"`: 中优先级，追加播报。智能体会在当前交互结束后播报消息。
                    - `"IGNORE"`: 低优先级，空闲时播报。如果此时智能体正在交互，智能体会直接忽略并丢弃要播报的消息；只有智能体不在交互中才会播报消息。
                interruptable:
                  type: boolean
                  description: "是否允许用户说话打断智能体播报：\r\n- `true`：（默认）允许。\r\n- `false`：不允许。"

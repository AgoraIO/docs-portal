          title: Preset models
      parameters:
        - name: appid
          in: path
          required: true
          schema:
            type: string
          description: The App ID of the project.
      responses:
        "200":
          description: The request was successful. The response body contains the result of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                    description: Unique id of the agent instance
                  create_ts:
                    type: integer
                    description: Timestamp of when the agent was created
                  status:
                    type: string
                    enum:
                      - IDLE
                      - STARTING
                      - RUNNING
                      - STOPPING
                      - STOPPED
                      - FAILED
                    description: |-
                      Current status.

                      - `IDLE` (0): Agent is idle.

                      - `STARTING` (1): The agent is being started.

                      - `RUNNING` (2): The agent is running.

                      - `STOPPING` (3): The agent is stopping.

                      - `STOPPED` (4): The agent has exited.

                      - `FAILED` (6): The agent failed to execute.
              example:
                agent_id: 1NT29X10YHxxxxxWJOXLYHNYB
                create_ts: 1737111452
                status: RUNNING
        default:
          description: The request failed. The response body includes the error details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: >-
                    The unique identifier of the agent. The same identifier cannot be used
                    repeatedly.
                preset:
                  type: string
                  description: >-
                    Deprecated. Use `credential_mode: "managed"` within the `asr`, `llm`, or `tts`
                    block instead. See [Use managed
                    mode](/en/ai/build/custom-model-integration/managed-mode).


                    A comma-separated string of one or more presets. Each preset provides a
                    predefined configuration for ASR, LLM, and TTS. You can specify a preset for any
                    or all of ASR, LLM, and TTS. When a preset is specified, you do not need to
                    provide the endpoint URL, API key, or model for the preset providers. Use the
                    `asr`, `llm`, and `tts` fields to configure additional settings.
                  deprecated: true
                pipeline_id:
                  type: string
                  description: >-
                    The unique ID of a published agent in Conversational AI
                    Studio. When provided, the saved agent
                    configuration is used as the base configuration. Any fields specified in
                    `properties` override the corresponding agent settings. When you specify a
                    `pipeline_id`, the `asr`, `tts`, and `llm` fields in `properties` are optional.


                    The unique ID of a published agent in STUDIO. When provided, the saved agent
                    configuration is used as the base configuration. Any fields specified in
                    properties override the corresponding agent settings. When you specify a
                    pipeline_id, the asr, tts, and llm fields in properties are optional.
                properties:
                  type: object
                  additionalProperties: true
                  description: Configuration details of the agent.
                  properties:
                    channel:
                      type: string
                      description: The name of the channel to join.
                    token:
                      type: string
                      description: The authentication token used by the agent to join the channel.
                    agent_rtc_uid:
                      type: string
                      description: >-
                        The user ID of the agent in the channel. All UIDs within an RTC channel must
                        be unique. Ensure no other user or service bot is using this UID. A value of
                        `0` means that a unique random UID is generated and assigned. Set the
                        `token` accordingly.
                    remote_rtc_uids:
                      type: array
                      items:
                        type: string
                      description: >-
                        A list of user IDs that the agent subscribes to in the channel. Only
                        subscribed users can interact with the agent.
                      x-docs-callouts:
                        - type: info
                          title: Note
                          position: after-description
                          markdown: |
                            Currently, only one user ID is supported.
                    enable_string_uid:
                      type: boolean
                      default: false
                      description: |-
                        Whether to enable String uid:

                        - `true`: Both agent and subscriber user IDs use strings.

                        - `false`: Both agent and subscriber user IDs must be integers.
                    idle_timeout:
                      type: integer
                      default: 30
                      minimum: 0
                      maximum: 259200
                      description: >-
                        The maximum idle time in seconds after all users specified in
                        `remote_rtc_uids` are detected to have left the channel. When the idle time
                        exceeds this value, the agent automatically stops and exits the channel. The
                        valid range is `0` to `259200` (72 hours).

                        - When set to `0`, the agent does not exit due to channel idle timeout.

                        - Regardless of the `idle_timeout` value, the maximum running time for a
                        single session is 72 hours. The agent automatically exits after 72 hours.
                      x-docs-callouts:
                        - type: idea
                          title: Agent lifecycle best practice
                          position: after-description
                          markdown: >
                            For precise and reliable control over the agent's lifecycle, use the
                            [`leave`](/en/api-reference/api-ref/conversational-ai/leave) API to
                            terminate the agent as soon as its task is complete.
                    geofence:
                      type: object
                      description: >-
                        Regional access restriction configuration. Use this to limit which Agora
                        servers the Conversational AI Engine can access based on geographic regions.
                      additionalProperties: true
                      properties:
                        area:
                          type: string
                          enum:
                            - GLOBAL
                            - NORTH_AMERICA
                            - EUROPE
                            - ASIA
                            - INDIA
                            - JAPAN
                          description: The allowed region for server access.
                        exclude_area:
                          type: string
                          enum:
                            - NORTH_AMERICA
                            - EUROPE
                            - ASIA
                            - INDIA
                            - JAPAN
                          description: The excluded region. Only available when `area` is set to `GLOBAL`.
                      required:
                        - area
                    advanced_features:
                      type: object
                      additionalProperties: true
                      description: Advanced features configuration.
                      properties:
                        enable_mllm:
                          type: boolean
                          default: false
                          description: >-
                            Use [mllm.enable](#request-body-properties-mllm-enable) instead.


                            Enable Multimodal Large Language Model for voice-to-voice processing.
                            Enabling MLLM automatically disables ASR, LLM, and TTS since the MLLM
                            handles end-to-end voice processing directly. See `turn_detection.type`
                            for turn detection options available with MLLM.
                          deprecated: true
                        enable_rtm:
                          type: boolean
                          default: false
                          description: >-
                            Whether to enable the Signaling (RTM) service. When enabled, the agent
                            can combine the capabilities provided by Signaling to implement advanced
                            functions, such as delivering [custom
                            information](/en/ai/build/shape-the-conversation/custom-information).
                          x-docs-callouts:
                            - type: info
                              title: Note
                              position: after-description
                              markdown: >
                                Before enabling the Signaling service, make sure the token includes
                                both

                                RTC and RTM privileges. When an agent joins an RTM channel, it
                                reuses

                                the token specified in the `token` field. For more information, see

                                ["How can I generate a token with both RTC and Signaling

                                privileges?"](/en/api-reference/faq/integration/rtc_rtm_token).
                        enable_sal:
                          type: boolean
                          default: false
                          description: >-
                            Enable Selective Attention Locking (SAL). When enabled, configure the
                            `sal` field to set up speaker recognition or locking modes. See the
                            `sal` parameter for configuration details.
                        enable_tools:
                          type: boolean
                          default: false
                          description: >-
                            Enable tool invocation. When enabled, the agent can invoke tools
                            provided by the MCP server to implement advanced functionality.
                    asr:
                      type: object
                      additionalProperties: true
                      description: Automatic Speech Recognition (ASR) configuration.
                      properties:
                        credential_mode:
                          type: string
                          default: byok
                          enum:
                            - managed
                            - byok
                          description: >-
                            The credential mode for this provider:


                            - `managed`: Use Agora-managed credentials. You do not need to provide an
                            API key. See [Use managed
                            mode](/en/ai/build/custom-model-integration/managed-mode).


                            - `byok`: Bring your own key. Provide your own provider credentials,
                            including the API key.
                        language:
                          type: string
                          default: en-US
                          description: >-
                            The BCP-47 language tag identifying the primary language used for agent
                            interaction. If `params` contains a vendor-specific language code, it
                            takes precedence over this setting.
                        vendor:
                          type: string
                          default: ares
                          enum:
                            - ares
                            - microsoft
                            - deepgram
                            - openai
                            - google
                            - gemini
                            - amazon
                            - assemblyai
                            - sarvam
                            - xai
                          description: >-
                            ASR provider:

                            - `ares`: [Adaptive Recognition Engine for
                            Speech](/en/ai/models/asr/ares)

                            - `microsoft`: [Microsoft
                            Azure](/en/ai/models/asr/microsoft)

                            - `deepgram`: [Deepgram](/en/ai/models/asr/deepgram)

                            - `openai`: [OpenAI](/en/ai/models/asr/openai)

                            - `speechmatics`:
                            [Speechmatics](/en/ai/models/asr/speechmatics)

                            - `assemblyai`: [AssemblyAI](/en/ai/models/asr/assembly-ai)

                            - `amazon`: Amazon Transcribe

                            - `google`: [Google](/en/ai/models/asr/google)

                            - `gemini`: [Gemini](/en/ai/models/asr/gemini)

                            - `sarvam`: [Sarvam](/en/ai/models/asr/sarvam)

                            - `xai`: [xAI](/en/ai/models/asr/xai)
                        params:
                          type: object
                          additionalProperties: true
                          description: >-
                            The configuration parameters for the selected ASR vendor. For
                            vendor-specific parameters, see the corresponding ASR provider page
                            listed in `asr.vendor`.
                      required:
                        - params
                    tts:
                      type: object
                      additionalProperties: true
                      description: Text-to-speech (TTS) module configuration.
                      properties:
                        credential_mode:
                          type: string
                          default: byok
                          enum:
                            - managed
                            - byok
                          description: >-
                            The credential mode for this provider:


                            - `managed`: Use Agora-managed credentials. You do not need to provide an
                            API key. See [Use managed
                            mode](/en/ai/build/custom-model-integration/managed-mode).



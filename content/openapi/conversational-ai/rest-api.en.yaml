  /v2/projects/{appid}/agents/{agentId}/think:
    post:
      summary: Send a custom instruction
      description: Sends a custom text instruction to a specified Conversational AI agent instance.
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to send a custom text instruction to the specified Conversational AI
            agent instance. The instruction is injected into the current conversation pipeline as
            user input, and the agent processes and responds to it following the standard user input
            logic.


            Use this endpoint for the following scenarios:


            - **Implicit instruction injection**: Inject hidden context or directives into the
            conversation.

            - **Client-side event triggering**: Notify the agent of client-side events, such as a
            user clicking a button.

            - **Voice and text collaboration**: Combine text instructions with voice input for
            richer interaction.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body
            contains the result of the request.


            - If the returned status code is not `200`, the request failed. The response body
            includes the `detail` and `reason` for failure. Refer to [status
            codes](/en/api-reference/api-ref/conversational-ai/status-codes) to understand the
            possible reasons for failure.
      operationId: agent-think
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request POST \
                --url https://api.agora.io/api/conversational-ai-agent/v2/projects/:appid/agents/:agentId/think \
                --header 'Authorization: Basic <credentials>' \
                --header 'Content-Type: application/json' \
                --data '{
                  "text": "The user just clicked the purchase button.",
                  "on_listening_action": "interrupt",
                  "on_thinking_action": "interrupt",
                  "on_speaking_action": "ignore",
                  "interruptable": true,
                  "metadata": {
                    "publisher": "user123",
                    "model": "deepseek-r1"
                  }
                }'
        - lang: python
          label: Python
          source: |-
            import requests

              url = "https://api.agora.io/api/conversational-ai-agent/v2/projects/:appid/agents/:agentId/think"
              headers = {
                  "Authorization": "Basic <credentials>",
                  "Content-Type": "application/json"
              }
              payload = {
                  "text": "The user just clicked the purchase button.",
                  "on_listening_action": "interrupt",
                  "on_thinking_action": "interrupt",
                  "on_speaking_action": "ignore",
                  "interruptable": True,
                  "metadata": {
                      "publisher": "user123",
                      "model": "deepseek-r1"
                  }
              }

              response = requests.post(url, json=payload, headers=headers)
              print(response.text)
        - lang: javascript
          label: Node.js
          source: >-
            const axios = require("axios");


            const url =
            "https://api.agora.io/api/conversational-ai-agent/v2/projects/:appid/agents/:agentId/think";

            const headers = {
                Authorization: "Basic <credentials>",
                "Content-Type": "application/json"
            };

            const payload = {
                text: "The user just clicked the purchase button.",
                on_listening_action: "interrupt",
                on_thinking_action: "interrupt",
                on_speaking_action: "ignore",
                interruptable: true,
                metadata: {
                    publisher: "user123",
                    model: "deepseek-r1"
                }
            };


            axios.post(url, payload, { headers })
              .then(response => console.log(response.data))
              .catch(error => console.error(error.response ? error.response.data : error.message));
      parameters:
        - name: appid
          in: path
          required: true
          schema:
            type: string
          description: The App ID of the project.
        - name: agentId
          in: path
          required: true
          schema:
            type: string
          description: >-
            The agent instance ID you obtained after successfully calling `join` to [Start a
            conversational AI agent](/en/api-reference/api-ref/conversational-ai/join).
      responses:
        "200":
          description: The request was successful. The response body contains the result of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                    description: Unique identifier of the agent instance.
                  channel:
                    type: string
                    description: The name of the RTC channel where the agent is located.
                  start_ts:
                    type: integer
                    description: Timestamp indicating when the agent was created.
              example:
                agent_id: 1NT29XxxxxxxxxELWEHC8OS
                channel: test_channel
                start_ts: 1744877089
        default:
          description: The request failed. The response body includes the error details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: >-
                    The custom instruction text to inject into the current conversation pipeline.
                    The system processes this as user input.
                on_listening_action:
                  type: string
                  default: interrupt
                  enum:
                    - inject
                    - interrupt
                    - ignore
                  description: >-
                    The action to take when the agent is in a listening state:

                    - `inject`: Inject the custom text instruction into the current turn without
                    interrupting it.

                    - `interrupt`: Immediately interrupt the current flow and initiate a new round
                    of dialogue.

                    - `ignore`: Ignore the request.
                on_thinking_action:
                  type: string
                  default: interrupt
                  enum:
                    - interrupt
                    - ignore
                  description: |-
                    The action to take when the agent is in a thinking state:
                    - `interrupt`: Interrupt the current state and start a new conversation turn.
                    - `ignore`: Ignore the request.
                on_speaking_action:
                  type: string
                  default: ignore
                  enum:
                    - interrupt
                    - ignore
                  description: |-
                    The action to take when the agent is in a speaking state:
                    - `interrupt`: Interrupt the current state and start a new conversation turn.
                    - `ignore`: Ignore the request.
                interruptable:
                  type: boolean
                  default: true
                  description: |-
                    Whether user speech can interrupt the injected instruction:
                    - `true`: User speech can interrupt the instruction.
                    - `false`: User speech cannot interrupt the instruction.
                metadata:
                  type: object
                  additionalProperties: true
                  description: >-
                    Custom metadata in key-value pair format. Use this field to pass additional
                    business information such as identifiers or model references.
              required:
                - text

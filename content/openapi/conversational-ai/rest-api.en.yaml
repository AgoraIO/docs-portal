                                - For a registered voiceprint, ensure that:


                                - Size: The voiceprint file does not exceed 2 MB.


                                - Duration: Contains 10 to 15 seconds of audio, with at least 8
                                seconds

                                of effective audio excluding silent segments.


                                - Format: 16kHz sampling rate, 16-bit depth, mono PCM audio file.
                                The

                                file name extension must be ".pcm".

  /v2/projects/{appid}/agents/{agentId}/speak:
    post:
      summary: Broadcast a message using TTS
      description: Broadcasts a custom message through the TTS module.
      x-docs-callouts:
        - markdown: The speak API is not supported when using `mllm` configuration.
          position: after-description
          title: Note
          type: info
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to broadcast a custom message using the TTS module.


            During a conversation with a Conversational AI agent, call this endpoint to immediately
            broadcast a custom message using the TTS module. Upon receiving the request,
            Conversational AI interrupts the agent’s speech and thought process to deliver the
            message. This broadcast can be interrupted by human voice.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body is
            empty, and the agent starts to broadcast the specified message.


            - If the returned status code is not `200`, the request failed. The response body
            includes the error code and description. Refer to [status
            codes](/en/api-reference/api-ref/conversational-ai/status-codes) to understand the
            possible reasons for failure.
      operationId: agent-speak
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request post \
                    --url https://api.agora.io/api/conversational-ai-agent/v2/projects/:appid/agents/:agentId/speak \
                    --header 'Authorization: Basic <credentials>' \
                    --data '
                  {
                    "text": "Sorry, the conversation content is not compliant.",
                    "priority": "INTERRUPT",
                    "interruptable": false
                  }'
        - lang: python
          label: Python
          source: |-
            import requests

                url = "https://api.agora.io/api/conversational-ai-agent/v2/projects/:appid/agents/:agentId/speak"

                payload = {
                    "text": "Sorry, the conversation content is not compliant.",
                    "priority": "INTERRUPT",
                    "interruptable": False
                }
                headers = {"Authorization": "Basic <credentials>"}

                response = requests.request("post", url, json=payload, headers=headers)

                print(response.text)
        - lang: javascript
          label: Node.js
          source: >-
            const url =
            'https://api.agora.io/api/conversational-ai-agent/v2/projects/:appid/agents/:agentId/speak';
                const options = {
                  method: 'post',
                  headers: { Authorization: 'Basic <credentials>' },
                  body: JSON.stringify({
                    text: 'Sorry, the conversation content is not compliant.',
                    priority: 'INTERRUPT',
                    interruptable: false
                  })
                };

                fetch(url, options)
                  .then(res => res.json())
                  .then(json => console.log(json))
                  .catch(err => console.error(err));
      parameters:
        - name: appid
          in: path
          required: true
          schema:
            type: string
          description: The App ID of the project.
        - name: agentId
          in: path
          required: true
          schema:
            type: string
          description: >-
            The agent instance ID you obtained after successfully calling `join` to [Start a
            conversational AI agent](/en/api-reference/api-ref/conversational-ai/join).
      responses:
        "200":
          description: The request was successful. The response body contains the result of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                    description: Unique id of the agent instance.
                  channel:
                    type: integer
                    description: The name of the channel.
                  start_ts:
                    type: integer
                    description: Agent creation timestamp.
              example:
                agent_id: 1NT29XxxxxxxxxELWEHC8OS
                channel: test_channel
                start_ts: 1744877089
        default:
          description: The request failed. The response body includes the error details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The broadcast message text. The maximum length of the text content is 512 bytes.
                priority:
                  type: string
                  default: INTERRUPT
                  enum:
                    - INTERRUPT
                    - APPEND
                    - IGNORE
                  description: >-
                    Sets the priority of the message broadcast.


                    - `INTERRUPT`: High priority. The agent immediately interrupts the current
                    interaction to announce the message.

                    - `APPEND`: Medium priority. The agent announces the message after the current
                    interaction ends.

                    - `IGNORE`: Low priority. If the agent is busy interacting, it ignores and
                    discards the broadcast; the message is only announced if the agent is not
                    interacting.
                interruptable:
                  type: boolean
                  default: true
                  description: |-
                    Whether to allow users to interrupt the agent's broadcast by speaking:
                    - `true`: Allow
                    - `false`: Don't allow
              required:
                - text

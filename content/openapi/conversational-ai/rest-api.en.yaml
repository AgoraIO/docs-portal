                    rtc:
                      type: object
                      additionalProperties: true
                      description: RTC media encryption configuration.
                      properties:
                        encryption_key:
                          type: string
                          description: >-
                            The encryption key for RTC media content. The key has no length limit.
                            Agora recommends using a 32-byte key. If no encryption key is set or if
                            the key is empty, built-in encryption is not used.
                        encryption_salt:
                          type: string
                          description: >-
                            The salt value used for encryption. This is a Base64-encoded string that
                            is 32 bytes long after decoding. This parameter only takes effect when
                            `encryption_mode` is set to `7` (`AES_128_GCM2`) or `8`
                            (`AES_256_GCM2`). Ensure that the salt parameter is not empty for these
                            encryption modes.
                        encryption_mode:
                          type: integer
                          enum:
                            - 1
                            - 2
                            - 3
                            - 4
                            - 5
                            - 6
                            - 7
                            - 8
                          description: >-
                            The built-in encryption mode.

                            - `1`: `AES_128_XTS` - 128-bit AES encryption, XTS mode.

                            - `2`: `AES_128_ECB` - 128-bit AES encryption, ECB mode.

                            - `3`: `AES_256_XTS` - 256-bit AES encryption, XTS mode.

                            - `4`: `SM4_128_ECB` - 128-bit SM4 encryption, ECB mode.

                            - `5`: `AES_128_GCM` - 128-bit AES encryption, GCM mode.

                            - `6`: `AES_256_GCM` - 256-bit AES encryption, GCM mode.

                            - `7`: `AES_128_GCM2` - 128-bit AES encryption, GCM mode. Requires
                            setting `encryption_salt`.

                            - `8`: `AES_256_GCM2` - 256-bit AES encryption, GCM mode. Requires
                            setting `encryption_salt`.


                            Agora recommends using either `7` (`AES_128_GCM2`) or `8`
                            (`AES_256_GCM2`) mode. Both modes support cryptographic salts to enhance
                            security.
                    filler_words:
                      type: object
                      additionalProperties: true
                      description: >-
                        Filler word configuration. Plays filler words while waiting for LLM
                        responses to reduce user anxiety and improve conversation flow.


                        Filler word playback follows these rules:

                        - **Playback order**: When multiple filler words or LLM responses are
                        waiting to be played, they are played in the order they arrive.

                        - **Interruption control**: Inherits the interruption mode setting from the
                        [`interruption`](#request-body-properties-interruption) field.
                      properties:
                        enable:
                          type: boolean
                          default: false
                          description: |-
                            Whether to enable filler words:
                            - `true`: Enable filler words.
                            - `false`: Disable filler words.
                        trigger:
                          type: object
                          additionalProperties: true
                          description: >-
                            Filler word trigger configuration. Defines when to trigger filler word
                            playback.
                          properties:
                            mode:
                              type: string
                              description: >-
                                Filler word trigger mode:

                                - `fixed_time`: Fixed time trigger. Triggers filler word playback
                                when LLM response wait time exceeds the threshold.
                            "{mode}_config":
                              type: object
                              additionalProperties: true
                              description: >-
                                Filler word trigger configuration parameters. The parameter name and
                                structure vary depending on the trigger mode.

                                **Configuration example:**

                                ```json

                                "fixed_time_config": {

                                "response_wait_ms": 1500

                                }

                                ```
                              x-docs-callouts:
                                - type: info
                                  title: Note
                                  position: after-description
                                  markdown: >
                                    - The configuration type must match `mode`. For example, when
                                    `mode`

                                    is `fixed_time`, you must provide `fixed_time_config`.


                                    - You cannot provide multiple mode configurations
                                    simultaneously.
                              properties:
                                response_wait_ms:
                                  type: integer
                                  default: 1500
                                  description: >-
                                    LLM response wait threshold in milliseconds. Triggers filler
                                    word playback when the LLM waits this duration without
                                    generating a response, such as when waiting for RAG retrieval or
                                    tool call results.
                        content:
                          type: object
                          additionalProperties: true
                          description: >-
                            Filler word content configuration. Defines the source and selection
                            rules for filler words.
                          properties:
                            mode:
                              type: string
                              description: >-
                                Filler word content mode:

                                - `static`: Static filler words. Uses a predefined list of filler
                                words.
                            "{mode}_config":
                              type: object
                              additionalProperties: true
                              description: >-
                                Filler word content configuration parameters. The parameter name and
                                structure vary depending on the content mode.
                              x-docs-callouts:
                                - type: info
                                  title: Note
                                  position: after-description
                                  markdown: >
                                    - The configuration type must match `mode`. For example, when
                                    `mode`

                                    is `static`, you must provide `static_config`.


                                    - You cannot provide multiple mode configurations
                                    simultaneously.


                                    **Static filler word configuration example:**


                                    ```json


                                    "static_config": {


                                    "phrases": [


                                    "Please wait.",


                                    "Okay.",


                                    "Uh-huh."


                                    ],


                                    "selection_rule": "shuffle"


                                    }


                                    ```
                              properties:
                                phrases:
                                  type: array
                                  items:
                                    type: string
                                  description: |-
                                    List of filler word phrases.

                                    **Limits:**
                                    - Maximum 100 filler words.
                                    - Each filler word must not exceed 50 English words.
                                selection_rule:
                                  type: string
                                  enum:
                                    - shuffle
                                    - round_robin
                                  description: >-
                                    Filler word selection rule:

                                    - `shuffle`: Random shuffle. Already-used filler words are not
                                    repeated until all filler words have been used once. After all
                                    filler words are played, they are reshuffled randomly and a new
                                    round begins.

                                    - `round_robin`: Round-robin. Selects and plays filler words
                                    sequentially from the list. After all filler words are played
                                    once, a new cycle begins.
                              required:
                                - phrases
                    parameters:
                      type: object
                      additionalProperties: true
                      description: Agent configuration parameters.
                      properties:
                        silence_config:
                          type: object
                          additionalProperties: true
                          description: Settings related to agent silence behavior.
                          x-docs-callouts:
                            - type: info
                              title: Note
                              position: after-description
                              markdown: |
                                `silence_config` does not apply when you integrate a `mllm`.
                          properties:
                            timeout_ms:
                              type: integer
                              default: 0
                              description: >-
                                Specifies the maximum duration (in milliseconds) that the agent can
                                remain silent.

                                After the agent is successfully created and the user joins the
                                channel, any time during which the agent is not listening, thinking,
                                or speaking is considered silent time. When the silent time reaches
                                the specified value, the agent broadcasts a silent reminder message.
                                This feature is useful for prompting users when they become
                                inactive.

                                - `0`: Disables the silent reminder feature.

                                - `(0, 60000]`: Enables the silent reminder. You must also set
                                `content`; otherwise, the configuration is invalid.
                            action:
                              type: string
                              default: speak
                              description: >-
                                Specifies how the agent behaves when the silent timeout is reached.
                                Valid values:

                                - `speak`: Uses the TTS module to announce the silent prompt
                                (`content`).

                                - `think`: Appends the silent prompt (`content`) to the context and
                                passes it to the LLM.
                            content:
                              type: string
                              description: >-
                                Specifies the silent prompt message. The message use depends on the
                                value of `action` parameter.
                        farewell_config:
                          type: object
                          additionalProperties: true
                          description: Graceful hang-up settings for the agent.
                          properties:
                            graceful_enabled:
                              type: boolean
                              default: false
                              description: >-
                                Enable graceful leave:

                                * `true`: Enabled. When enabled, calling the POST method to stop the
                                agent ensures that the agent is in an `IDLE` state before leaving
                                the channel.

                                * `false`: Disabled.
                            graceful_timeout_seconds:
                              type: integer
                              default: 30
                              description: >-
                                Graceful exit timeout (in seconds). Represents the maximum time to
                                wait for the agent to enter an `IDLE` state before exiting the
                                channel. After this time, the agent will exit the channel
                                immediately, even if it is not in an idle state. This field is only
                                effective when `graceful_enabled` is `true`.
                        data_channel:
                          type: string
                          default: datastream
                          description: >-
                            Agent data transmission channel:

                            - `rtm`: Use RTM transmission. This configuration takes effect only when
                            `advanced_features.enable_rtm` is `true`.

                            - `datastream`: Use RTC data stream transport.
                        enable_metrics:
                          type: boolean
                          default: false
                          description: >-
                            Whether to receive agent performance data:

                            - `true`: Receive agent performance data.

                            - `false`: Do not receive agent performance data.


                            This setting only takes effect when `advanced_features.enable_rtm` is
                            `true`. See [Listen to agent
                            events](/en/ai/build/handle-runtime-events/webhooks) to learn how to use client
                            components to receive agent performance data.
                        enable_error_message:
                          type: boolean
                          default: false
                          description: >-
                            Whether to receive agent error events:

                            - `true`: Receive agent error events.

                            - `false`: Do not receive agent error events.


                            This setting only takes effect when `advanced_features.enable_rtm` is
                            `true`. See [Listen to agent
                            events](/en/ai/build/handle-runtime-events/webhooks) to learn how to use client
                            components to receive agent error events.
                        audio_scenario:
                          type: string
                          default: default
                          enum:
                            - default
                            - chorus
                            - aiserver
                          description: >-
                            The audio scenario for the RTC channel.


                            - `default`: Maps to `aiserver`.

                            - `chorus`: Real-time chorus scenario, where users have good network
                            conditions and require ultra-low latency.

                            - `aiserver`: Optimized for interactions between the user and the
                            conversational AI agent in terms of latency and network resilience.
                        opt_out:
                          type: boolean
                          default: false
                          description: >-
                            Whether to disable data retention for the current session.

                            - `false`: (Default) Data retention is enabled.

                            - `true`: Data retention is disabled. When disabled, session interaction
                            text and audio are not retained, which means troubleshooting,
                            performance review, and agent optimization based on session history will
                            not be available.
                          x-docs-callouts:
                            - type: info
                              title: Note
                              position: after-description
                              markdown: >
                                To support service operation, agent optimization, and
                                troubleshooting,

                                session interaction text and audio are temporarily retained for the

                                minimum necessary period by default. If your business has strict

                                security or compliance requirements, enable this setting to prevent

                                session data from being stored.
                  required:
                    - channel
                    - token
                    - agent_rtc_uid
                    - remote_rtc_uids
                    - tts
                    - llm
              required:
                - name
                - properties
  /v2/projects/{appid}/agents/{agentId}/leave:
    post:
      summary: Stop a conversational AI agent
      description: Stops a specified Conversational AI agent instance.
      x-docs-sections:
        - position: after-description
          markdown: Use this endpoint to stop the specified Conversational AI agent instance.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body is
            empty.


            - If the returned status code is not `200`, the request failed. The response body
            includes the error code and description. Refer to [status
            codes](/en/api-reference/api-ref/conversational-ai/status-codes) to understand the
            possible reasons for failure.
      operationId: stop-agent
      parameters:
        - name: appid
          in: path
          required: true
          schema:
            type: string
          description: The App ID of the project.
        - name: agentId
          in: path
          required: true
          schema:
            type: string
          description: >-
            The agent instance ID you obtained after successfully calling `join` to [Start a
            conversational AI agent](/en/api-reference/api-ref/conversational-ai/join).

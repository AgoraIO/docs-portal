                    sal:
                      type: object
                      additionalProperties: true
                      description: Selective Attention Locking (SAL) configuration. **(Beta)**
                      properties:
                        sal_mode:
                          type: string
                          default: locking
                          enum:
                            - locking
                            - recognition
                          description: >-
                            Selective attention lock mode. Supports the following options:


                            - `locking`: Speaker Lock Mode. The agent locks onto the speaker,
                            blocking 95% of ambient human voices and noise. You can enable this mode
                            in two ways:


                            - Seamless mode: When a user speaks loudly and clearly at the beginning
                            of a conversation, the intelligent agent automatically recognizes the
                            user as the speaker.

                            - Personalized mode: When creating an agent, a speaker's voiceprint URL
                            is pre-registered through the `sample_urls` field. The agent then
                            locates the speaker based on the pre-registered voiceprint.


                            - `recognition`: Voiceprint recognition mode. You can pre-register only
                            one voiceprint URL using the `sample_urls` field. The agent identifies
                            different speakers and suppresses other background voices and
                            environmental noise. The target speaker is identified through the
                            `vpids` field in the `metadata` field and sent to the LLM. Set
                            `llm.vendor` to "custom" and refer to [Custom
                            LLM](/en/ai/build/custom-model-integration/custom-llm) for instructions on how to
                            make the LLM process speaker information.
                        sample_urls:
                          type: object
                          additionalProperties: true
                          description: >-
                            The registered voiceprint URL as a key-value pair, where the key is the
                            voiceprint name and the value is the download URL for the speaker's
                            voiceprint. Only one voiceprint URL is supported.

                            Example:

                            ```json

                            {

                            "speaker1": "https://example.com/speaker1.pcm"

                            }

                            ```
                          x-docs-callouts:
                            - type: info
                              title: Note
                              position: after-description

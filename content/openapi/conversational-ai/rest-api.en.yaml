openapi: 3.1.0
info:
  version: ""
  title: Conversational AI RESTful API
  description: >-
    The Conversational AI RESTful API lets you create and manage Conversational AI agent instances
    from your server.
servers:
  - url: https://api.agora.io/api/conversational-ai-agent
    description: Base endpoint for Conversational AI RESTful APIs.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use Basic HTTP authentication with your Agora customer ID and customer secret.
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Use an RTC token in the format `agora token=<your_token>`.
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: >-
        Authentication credential. Use `agora token=<your_token>` for token authentication or `Basic
        <base64_credentials>` for Basic HTTP authentication.
  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Detailed error information.
        reason:
          type: string
          description: The reason for the failure.
security:
  - tokenAuth: []
  - basicAuth: []
paths:
  /v2/projects/{appid}/join:
    post:
      summary: Start a conversational AI agent
      description: Creates and starts a Conversational AI agent instance.
      x-docs-sections:
        - position: after-description
          markdown: Use this endpoint to create and start a Conversational AI agent instance.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body
            contains the result of the request.


            - If the returned status code is not `200`, the request failed. The response body
            includes the `detail` and `reason` for failure. Refer to [status
            codes](/en/api-reference/api-ref/conversational-ai/status-codes) to understand the possible reasons for
            failure.


            - The following turn detection configuration is deprecated. To create more natural
            conversations and reduce unintended interruptions, Agora recommends using the latest
            version of `turn_detection` above.
      operationId: start-agent
      x-docs-code-sample-groups:
        - samples:
            - lang: bash
              label: curl
              source: |-
                curl --request post \
                --url https://api.agora.io/api/conversational-ai-agent/v2/projects/:appid/join \
                --header 'Authorization: Basic <your_base64_encoded_credentials>' \
                --data '
                {
                    "name": "unique_name",
                    "properties": {
                        "channel": "channel_name",
                        "token": "token",
                        "agent_rtc_uid": "1001",
                        "remote_rtc_uids": [
                            "1002"
                        ],
                        "idle_timeout": 120,
                        "llm": {
                            "url": "https://api.openai.com/v1/chat/completions",
                            "api_key": "<your_llm_key>",
                            "system_messages": [
                                {
                                    "role": "system",
                                    "content": "You are a helpful chatbot."
                                }
                            ],
                            "max_history": 32,
                            "greeting_message": "Hello, how can I assist you today?",
                            "failure_message": "Please hold on a second.",
                            "params": {
                                "model": "gpt-4o-mini"
                            }
                        },
                        "tts": {
                            "vendor": "microsoft",
                            "params": {
                                "key": "<your_tts_api_key>",
                                "region": "eastus",
                                "voice_name": "en-US-AndrewMultilingualNeural"
                            }
                        },
                        "asr": {
                            "language": "en-US"
                        }
                    }
                }'
            - lang: python
              label: Python
              source: |-
                import requests
                import json

                url = "https://api.agora.io/api/conversational-ai-agent/v2/projects/:appid/join"

                headers = {"Authorization": "Basic <your_base64_encoded_credentials>"}

                data = {
                    "name": "unique_name",
                    "properties": {
                        "channel": "channel_name",
                        "token": "token",
                        "agent_rtc_uid": "1001",
                        "remote_rtc_uids": ["1002"],
                        "idle_timeout": 120,
                        "llm": {
                            "url": "https://api.openai.com/v1/chat/completions",
                            "api_key": "<your_llm_key>",
                            "system_messages": [
                                {
                                    "role": "system",
                                    "content": "You are a helpful chatbot."
                                }
                            ],
                            "max_history": 32,
                            "greeting_message": "Hello, how can I assist you today?",
                            "failure_message": "Please hold on a second.",
                            "params": {
                                "model": "gpt-4o-mini"
                            }
                        },
                        "tts": {
                            "vendor": "microsoft",
                            "params": {
                                "key": "<your_tts_api_key>",
                                "region": "eastus",
                                "voice_name": "en-US-AndrewMultilingualNeural"
                            }
                        },
                        "asr": {
                            "language": "en-US"
                        }
                    }
                }

                response = requests.post(url, headers=headers, data=json.dumps(data))

                print(response.status_code)
                print(response.json())
            - lang: js
              label: Node.js
              source: >-
                const axios = require("axios");


                const url =
                "https://api.agora.io/api/conversational-ai-agent/v2/projects/:appid/join";


                const headers = {
                    "Authorization": "Basic <your_base64_encoded_credentials>"
                };


                const data = {
                    name: "unique_name",
                    properties: {
                    channel: "channel_name",
                    token: "token",
                    agent_rtc_uid: "1001",
                    remote_rtc_uids: ["1002"],
                    idle_timeout: 120,
                    llm: {
                        url: "https://api.openai.com/v1/chat/completions",
                        api_key: "<your_llm_key>",
                        system_messages: [
                        {
                            role: "system",
                            content: "You are a helpful chatbot."
                        }
                        ],
                        max_history: 32,
                        greeting_message: "Hello, how can I assist you today?",
                        failure_message: "Please hold on a second.",
                        params: {
                        model: "gpt-4o-mini"
                        }
                    },
                    tts: {
                        vendor: "microsoft",
                        params: {
                        key: "<your_tts_api_key>",
                        region: "eastus",
                        voice_name: "en-US-AndrewMultilingualNeural"
                        }
                    },
                    asr: {
                        language: "en-US"
                    }
                    }
                };


                axios
                    .post(url, data, { headers })
                    .then(response => {
                    console.log("Status:", response.status);
                    console.log("Response:", response.data);
                    })
                    .catch(error => {
                    console.error("Error:", error.response ? error.response.data : error.message);
                    });
          title: Basic configuration
        - samples:
            - lang: bash
              label: curl
              source: >-
                curl -X POST
                'https://api.agora.io/api/conversational-ai-agent/v2/projects/<your_app_id>/join' \
                  -H 'Content-Type: application/json' \
                  -H 'Authorization: agora token=<your_token>' \
                  -d '{
                    "name": "<unique_agent_name>",
                    "pipeline_id": "<your_pipeline_id>",
                    "properties": {
                      "channel": "<your_channel_name>",
                      "token": "<your_rtc_token>",
                      "agent_rtc_uid": "1001",
                      "agent_rtm_uid": "<agent_rtm_uid>",
                      "remote_rtc_uids": ["1002"],
                      "enable_string_uid": false
                    }
                  }'
            - lang: python
              label: Python
              source: >-
                import requests

                import json


                url =
                "https://api.agora.io/api/conversational-ai-agent/v2/projects/<your_app_id>/join"


                headers = {
                    "Content-Type": "application/json",
                    "Authorization": "agora token=<your_token>"
                }


                data = {
                    "name": "<unique_agent_name>",
                    "pipeline_id": "<your_pipeline_id>",
                    "properties": {
                        "channel": "<your_channel_name>",
                        "token": "<your_rtc_token>",
                        "agent_rtc_uid": "1001",
                        "agent_rtm_uid": "<agent_rtm_uid>",
                        "remote_rtc_uids": ["1002"],
                        "enable_string_uid": False
                    }
                }


                response = requests.post(url, headers=headers, data=json.dumps(data))

                print(response.json())
            - lang: js
              label: Node.js
              source: >-
                const url =
                "https://api.agora.io/api/conversational-ai-agent/v2/projects/<your_app_id>/join";


                const headers = {
                  "Content-Type": "application/json",
                  "Authorization": "agora token=<your_token>"
                };


                const data = {
                  name: "<unique_agent_name>",
                  pipeline_id: "<your_pipeline_id>",
                  properties: {
                    channel: "<your_channel_name>",
                    token: "<your_rtc_token>",
                    agent_rtc_uid: "1001",
                    agent_rtm_uid: "<agent_rtm_uid>",
                    remote_rtc_uids: ["1002"],
                    enable_string_uid: false
                  }
                };


                fetch(url, {
                  method: "POST",
                  headers: headers,
                  body: JSON.stringify(data)
                })
                  .then(response => response.json())
                  .then(json => console.log(json))
                  .catch(error => console.error("Error:", error));

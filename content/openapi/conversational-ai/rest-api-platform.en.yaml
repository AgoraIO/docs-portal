  /v1/projects/{appid}/campaigns:
    post:
      tags:
        - Campaigns
      summary: Create a campaign
      description: Creates an outbound campaign that dials a list of contacts with a saved agent.
      operationId: create-campaign
      x-docs-sections:
        - position: after-description
          markdown: >-
            Each contact is one dial task, and each dial starts a telephony session with the agent
            in `agent_id`. Retries follow `pacing`. You supply the contacts when you create the
            campaign, and you can't change them afterward.


            Before you create a campaign, [create the
            agent](/en/api-reference/api-ref/conversational-ai/platform/create-agent) and [register the
            phone number](/en/api-reference/api-ref/conversational-ai/platform/create-number) to call
            from. Send an `Idempotency-Key` so that retrying the request can't create a second
            campaign.
      x-docs-callouts:
        - type: caution
          title: Caution
          position: after-description
          markdown: >-
            A campaign places real phone calls. When `schedule.mode` is `immediate`, dialing
            starts as soon as the campaign is created. To test, create a `scheduled` campaign with
            a start time in the future, then [cancel
            it](/en/api-reference/api-ref/conversational-ai/platform/cancel-campaign).
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreate"
            examples:
              scheduled:
                summary: Scheduled campaign
                value:
                  name: q3-renewals
                  agent_id: agent_renewals
                  transport:
                    type: telephony
                    from: num_2v9c4q
                  contacts:
                    - phone: "+12025550123"
                      values:
                        name: Ava
                        renewal_year: 2027
                  lifecycle:
                    idle_timeout_ms: 30000
                  pacing:
                    max_concurrent: 10
                    max_calls_per_second: 2
                    max_attempts: 3
                    retry_backoff_ms: 600000
                  schedule:
                    mode: scheduled
                    timezone: America/New_York
                    start: "2026-11-02T09:00"
                    end: "2026-11-13T17:00"
                    days:
                      - weekday: mon
                        ranges:
                          - start: "09:00"
                            end: "12:00"
                          - start: "13:00"
                            end: "17:00"
                      - weekday: wed
                        ranges:
                          - start: "09:00"
                            end: "17:00"
              immediate:
                summary: Immediate campaign
                value:
                  name: q3-renewals-now
                  agent_id: agent_renewals
                  transport:
                    type: telephony
                    from: num_2v9c4q
                  contacts:
                    - phone: "+12025550123"
                      values:
                        name: Ava
                        renewal_year: 2027
                  schedule:
                    mode: immediate
      responses:
        "201":
          description: The campaign was created. The response body contains the campaign.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
              example:
                campaign_id: camp_7r2n9k
                name: q3-renewals
                status: scheduled
                agent_id: agent_renewals
                transport:
                  type: telephony
                  from:
                    - num_2v9c4q
                lifecycle:
                  idle_timeout_ms: 30000
                  max_duration_ms: 259200000
                  graceful_stop:
                    enabled: false
                    timeout_ms: 30000
                schedule:
                  mode: scheduled
                  timezone: America/New_York
                  start: "2026-11-02T09:00"
                  end: "2026-11-13T17:00"
                counts:
                  contacts: 1
                  pending: 1
                  calling: 0
                  completed: 0
                  failed: 0
                  canceled: 0
                create_ts: 1787673602
                start_ts: null
                complete_ts: null
                failure: null
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `InvalidFieldValue` when `contacts` is empty or
            `max_calls_per_second` is above the project's limit, or `NotImplemented` when a field
            isn't available yet.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: >-
            `AgentNotFound`: No agent has this `agent_id`. `NumberNotFound`: A number in

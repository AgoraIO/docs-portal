  /v1/projects/{appid}/numbers:
    post:
      tags:
        - Phone numbers
      summary: Create a phone number
      description: Registers a phone number, its SIP trunk, and its inbound routing in your project.
      operationId: create-number
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to import a number that your carrier assigned to you. Importing a
            number doesn't purchase one. Outbound sessions and campaigns can use the number as
            their caller ID, and `inbound` chooses the agent that answers calls to it.
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberCreate"
            example:
              number: "+14155550100"
              description: Primary customer support line for North America.
              sip_trunk:
                name: support-line
                hostname: acme.pstn.example.com
                transport: tls
                auth:
                  username: acme
                  password: <your_sip_password>
              inbound:
                agent: 3f6c2a9e-8d1b-4e7a-9c55-0b2f7d1e4a10
                call_policy:
                  max_call_duration_seconds: 1800
                  max_silence_duration_ms: 60000
                  end_call:
                    on_user_request: true
      responses:
        "201":
          description: The number was created. The response body contains the saved number.
          headers:

              schema:
                $ref: "#/components/schemas/Number"
              example:
                number_id: 92e68758-3d3a-4f27-8b93-3fd8d834467c
                number: "+14155550100"
                description: Primary customer support line for North America.
                sip_trunk:
                  name: support-line
                  hostname: acme.pstn.example.com
                  port: 5061
                  transport: tls
                inbound:
                  agent: 3f6c2a9e-8d1b-4e7a-9c55-0b2f7d1e4a10
                  call_policy:
                    max_call_duration_seconds: 1800
                    max_silence_duration_ms: 60000
                    end_call:
                      on_user_request: true
                create_ts: 1787223852
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `InvalidFieldValue` when the phone number isn't
            valid, `MissingRequiredField` when `inbound.agent` is set without
            `inbound.call_policy`, or `NotImplemented` when the SIP password is a `$secrets`
            reference.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`AgentNotFound`: The agent in `inbound.agent` doesn't exist."
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `NumberAlreadyExists`: The number is already registered in the project.

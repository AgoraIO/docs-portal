components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Use Basic HTTP authentication with your Agora customer ID and customer secret.
        Recommended for telephony-only use. See [Choose an authentication
        method](/en/api-reference/api-ref/conversational-ai/platform/authentication#choose-an-authentication-method).
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Use a token generated with your App ID and App Certificate, in the format
        `agora token="<your_token>"`. Recommended when your agent joins an RTC channel. See
        [Choose an authentication
        method](/en/api-reference/api-ref/conversational-ai/platform/authentication#choose-an-authentication-method).
        A token with the ConvoAI service authenticates any request.
        To start an RTC session, also include the RTC service and pass the same token in
        `transport.token`.
  parameters:
    AppId:
      name: appid
      in: path
      required: true
      schema:
        type: string
      description: The App ID of your project.
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The ID of the agent, returned in `agent_id` when you create the agent.
    SecretSetName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: The name of the secret set.
    SecretKeyName:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: >-
        The name of the key in the secret set. When you add a key, use 1 to 64 characters from
        `A-Z`, `a-z`, `0-9`, and `_`.
    NumberId:
      name: number_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The ID of the phone number, returned in `number_id` when you create the number.
    AgentSessionId:
      name: agent_session_id
      in: path
      required: true
      schema:
        type: string
      description: >-
        The ID of the session, returned in `agent_session_id` when you start the session.
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The ID of the campaign, returned in `campaign_id` when you create the campaign.
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: >-
        The `ETag` value from the most recent response for this resource. If the resource has
        changed since then, the request fails with `412` and reason `PreconditionFailed`. Retrieve
        the resource, apply your change again, and retry with the new `ETag`.
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: >-
        The `ETag` value from the most recent response for this resource. When you include it,
        the request fails with `412` and reason `PreconditionFailed` if the resource has changed
        since then. Use it to avoid overwriting a concurrent change.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[\x21-\x7E]+$
      description: >-
        A unique key, so that retrying the request can't start a second session. If a session was
        already started with this key, the request fails with `409` and reason
        `IdempotencyKeyConflict`, and no new session starts. The API doesn't return the original
        response. To find the session, [list
        sessions](/en/api-reference/api-ref/conversational-ai/platform/list-sessions). Keep the same
        key when you retry; never switch keys.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >-
        The `next_cursor` value from the previous page of results. Omit it to get the first page.
        The cursor is opaque, so pass it back unchanged.
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum:
          - create_ts.desc
          - create_ts.asc
        default: create_ts.desc
      description: |-
        The sort order of the results:

        - `create_ts.desc`: Newest first.
        - `create_ts.asc`: Oldest first.
  headers:
    Agora-Request-Id:
      description: A unique ID for the request. Include it when you contact Agora support.
      schema:
        type: string
    ETag:
      description: >-
        The current version of the resource. Pass this value in the `If-Match` header of your next
        update or delete request for this resource.
      schema:
        type: string
  responses:
    BadRequest:
      description: >-
        The request is invalid. Check `reason` and `detail` in the response body.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: >-
        Authentication is missing or invalid. The reason is `InvalidPermission`.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource in the path doesn't exist. The reason is `ResourceNotFound`.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionFailed:
      description: >-
        The `If-Match` value doesn't match the current version of the resource. The reason is
        `PreconditionFailed`. Retrieve the resource, apply your change again, and retry with the
        new `ETag`.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: >-
        Too many requests. The reason is `RateLimitExceeded`. Retry with exponential backoff.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error:
      description: >-
        The request failed. The response body contains the `reason` and `detail` of the failure.
        For possible reasons, see [Status codes](/en/api-reference/api-ref/conversational-ai/platform/status-codes).
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - detail
        - reason
      properties:
        detail:
          type: string
          description: >-
            A human-readable description of the error. It names the field or resource involved,
            when there is one. Don't parse it; branch on `reason` instead.
        reason:
          type: string
          description: >-
            A machine-readable error reason, such as `InvalidFieldValue` or `ResourceNotFound`.
            For all reasons, see [Status codes](/en/api-reference/api-ref/conversational-ai/platform/status-codes).
      example:
        detail: The requested session was not found.
        reason: TaskNotFound
    Deleted:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
          const: true
          description: Always `true`. The resource is deleted.
      example:
        deleted: true
    ListPageInfo:
      type: object
      properties:
        has_more:
          type: boolean
          description: Whether more results are available after this page.
        next_cursor:
          type:
            - string
            - "null"
          description: >-
            The cursor for the next page. Pass it in the `cursor` query parameter of your next
            request. `null` on the last page.
    Failure:
      type: object
      required:
        - code
        - message
        - ts
      description: Details of a failure.
      properties:
        code:
          type: string
          description: A stable runtime error code, for example `provider_error`.
        provider:
          type: string
          description: The model provider that caused the failure, for example `openai`.
        message:
          type: string
          description: A human-readable explanation.
        ts:
          type: integer
          description: The time the failure occurred, as a Unix timestamp in seconds.

    # ---------------------------------------------------------------------------------------------
    # Agents
    # ---------------------------------------------------------------------------------------------
    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
          description: |-
            The author of the message:

            - `system`: An instruction to the model.
            - `user`: A message from the user.
            - `assistant`: A message from the agent.
        content:
          type: string
          description: The text of the message.
    Greeting:
      type: object
      required:
        - mode
        - text
      description: >-
        The message the agent speaks when a participant joins. If you omit it, the agent doesn't
        greet participants automatically.
      properties:
        mode:
          type: string
          const: text
          description: "`text`: The agent speaks `text` using the TTS stage."
        "on":
          type: string
          enum:
            - each_join
            - first_join
          default: each_join
          description: |-
            Which participants the agent greets:

            - `each_join`: Every participant who joins.
            - `first_join`: Only the first participant to join.
        delay_ms:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
          description: >-
            The delay in milliseconds between a participant joining and the agent starting the
            greeting.
        text:
          type: string
          description: The greeting text.
    VariableDefinition:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - str
            - int
            - float
            - bool
            - date
            - datetime
          description: >-
            The data type of the variable value. Pass `date` and `datetime` values as ISO 8601
            strings, for example `"2026-09-30"` and `"2026-09-30T14:00:00Z"`.
        required:
          type: boolean
          default: false
          description: >-
            Whether a value is required in `values` when you start a session, or in each campaign
            contact. If a required value is missing, the session or the contact is rejected with
            `MissingRequiredField`.
        options:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type:
              - string
              - number
              - boolean
          description: >-
            The allowed values, 1 to 100 unique items of the declared `type`. Values you supply
            must be one of them, and extraction chooses one of them.
        extract:
          type: boolean
          default: false
          description: >-
            Whether to extract this variable from the transcript after the session ends. The
            Preview API doesn't return the extracted values. When `true`, `description` is required. An agent can have up to 50 extract variables.
        description:
          type: string
          maxLength: 2000
          description: >-
            What the variable means. Required when `extract` is `true`, where it serves as the
            extraction instruction.
    Variables:
      type: object
      propertyNames:
        pattern: ^[a-z][a-z0-9_]{0,63}$
      additionalProperties:
        $ref: "#/components/schemas/VariableDefinition"
      description: >-
        Every variable the agent uses, keyed by variable name. A name starts with a lowercase
        letter and contains up to 64 lowercase letters, digits, and underscores. Reference a
        variable as `{{variable_name}}` in `instructions`, `messages`, `greeting.text`,
        `pipeline.llm.failure_message`, `pipeline.silence_config.content`, and generated filler
        instructions. The agent doesn't store values: pass them in `values` when you start a
        session, or in each campaign contact. Expansion is single-pass, so a value that contains a
        placeholder isn't expanded again.
      example:
        customer_name:
          type: str
          required: true
        resolution_status:
          type: str
          options:
            - resolved
            - follow_up
            - unresolved
          extract: true
          description: Outcome of the conversation.
    FillerWords:
      type: object
      description: >-
        Short phrases the agent says while it waits for the LLM to respond, such as when it waits
        for a tool call.
      properties:
        enable:
          type: boolean
          default: false
          description: Whether to play filler words.
        trigger:
          type: object
          required:
            - mode
            - response_wait_ms
          description: When to play a filler word.
          properties:
            mode:
              type: string
              const: fixed_time
              description: >-
                `fixed_time`: Play a filler word when the LLM hasn't responded within
                `response_wait_ms`.
            response_wait_ms:
              type: integer
              minimum: 100
              maximum: 10000
              description: >-
                How long in milliseconds to wait for the LLM response before playing a filler word,
                for example `1500`.
        content:
          $ref: "#/components/schemas/FillerWordsContent"
    FillerWordsContent:
      description: Where the filler words come from. Pass the fields of one source only.
      oneOf:
        - $ref: "#/components/schemas/StaticFillerWordsContent"
        - $ref: "#/components/schemas/GeneratedFillerWordsContent"
      discriminator:
        propertyName: mode
        mapping:
          static: "#/components/schemas/StaticFillerWordsContent"
          generated: "#/components/schemas/GeneratedFillerWordsContent"
    StaticFillerWordsContent:
      type: object
      title: Static
      required:
        - mode
        - phrases
      properties:
        mode:
          type: string
          const: static
          description: "`static`: Pick a phrase from `phrases`."
        phrases:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
          description: The filler phrases, 1 to 100 non-empty strings.
        selection_rule:
          type: string
          enum:
            - shuffle
            - round_robin
          default: shuffle
          description: |-
            How the agent picks the next phrase:

            - `shuffle`: In random order.
            - `round_robin`: In list order, starting over after the last phrase.
    GeneratedFillerWordsContent:
      type: object
      title: Generated
      required:
        - mode
        - instructions
      description: >-
        Generates filler phrases with the agent's LLM. The LLM stage must be a BYOK `openai`,
        `groq`, or `xai` stage with `style: openai`, a `model`, and no custom `headers`. Managed
        LLMs aren't supported.
      properties:
        mode:
          type: string
          const: generated
          description: "`generated`: Generate a phrase from `instructions`."
        instructions:
          type: string
          minLength: 1
          description: The instructions used to generate filler phrases. They can't be empty or only whitespace.
        fallback_strategy:
          type: string
          const: static
          default: static
          description: What to use when a generated phrase isn't available.
    Credential:
      description: >-
        How this stage authenticates with the provider. Set it explicitly on each stage. Pass the
        fields of one credential mode only. Responses return only `mode`.
      oneOf:
        - $ref: "#/components/schemas/ManagedCredential"
        - $ref: "#/components/schemas/ByokCredential"
      discriminator:
        propertyName: mode
        mapping:
          managed: "#/components/schemas/ManagedCredential"
          byok: "#/components/schemas/ByokCredential"
    ManagedCredential:
      type: object
      title: Managed
      required:
        - mode
      description: >-
        Agora provides access to the provider. Don't set a custom `url` on the stage.
      properties:
        mode:
          type: string
          const: managed
          description: "`managed`: Agora provides the provider authentication."
    ByokCredential:
      type: object
      title: BYOK
      required:
        - mode
      description: >-
        Bring your own key. Pass your provider credentials in `fields`. `fields` is required,
        except for a Google Gemini LLM stage in an ephemeral session whose `url` contains the
        key. Then omit `fields`.
      properties:
        mode:
          type: string
          const: byok
          description: "`byok`: You pass your own provider credentials."
        fields:
          type: object
          minProperties: 1
          maxProperties: 8
          additionalProperties:
            type: string
            minLength: 1
          writeOnly: true
          description: >-
            Your provider credentials, keyed by the provider's field name. Most providers take one
            field, `api_key`. Some use other names, such as `key` or `credentials`, or take more than
            one field, such as an AWS access key ID and secret access key. Each model page lists its
            provider's fields. In an agent, each value must be a `$secrets.<set_name>.<key>`
            reference to a [secret
            set](/en/api-reference/api-ref/conversational-ai/platform/create-secret-set). An
            ephemeral session also accepts the values themselves. Agora resolves references when
            each session starts. The values are never returned.
    StageHeaders:
      type: object
      additionalProperties:
        type: string
      writeOnly: true
      description: >-
        Custom HTTP headers sent to the provider endpoint, at most 32. They are write-only and are
        never returned. A value can be a whole `$secrets.<set>.<key>` reference when the stage uses
        `byok` and an approved provider endpoint. Agora resolves it when each session starts. A
        header name that looks like a credential, such as `X-Api-Key`, must use a reference.
        Transport, identity, and provider authentication headers are reserved. Set provider
        authentication in `credential`.
    AsrConfig:
      type: object
      description: The automatic speech recognition (ASR) stage, which transcribes the user's speech.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          description: The ASR provider, for example `deepgram`.
        model:
          type: string
          description: The provider model, for example `nova-3`.
        language:
          type: string
          description: The language of the user's speech, for example `en-US`.
        url:
          type: string
          description: >-
            A custom provider endpoint. Don't also put the endpoint in `params`.
        params:
          type: object
          additionalProperties: true
          description: >-
            Provider-specific settings that aren't secret, such as `keywords`, passed to the
            provider as they are. Keep API keys in `credential`, not here.
    LlmConfig:
      type: object
      description: The large language model (LLM) stage, which generates the agent's replies.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          description: The LLM provider, for example `openai`.
        style:
          type: string
          description: >-
            The API style used to communicate with the model, for example `openai` for OpenAI and
            OpenAI-compatible APIs.
        model:
          type: string
          description: The provider model.
        url:
          type: string
          description: >-
            A custom provider endpoint. Don't also put the endpoint in `params`. For Google Gemini
            in an ephemeral session, the URL can include your API key as `key=<your_api_key>`, with
            `credential.fields` left out. A saved agent's `url` can't contain a key.
        headers:
          $ref: "#/components/schemas/StageHeaders"
        params:
          type: object
          additionalProperties: true
          description: >-
            Provider-specific settings that aren't secret, such as `reasoning_effort`, passed to
            the provider as they are. Keep API keys in `credential`, not here.
        input_modalities:
          type: array
          items:
            type: string
          description: The input types sent to the model, for example `["text"]`.
        output_modalities:
          type: array
          items:
            type: string
          description: The output types requested from the model, for example `["text"]`.
        max_history:
          type: integer
          minimum: 1
          maximum: 1024
          default: 32
          description: >-
            The number of recent conversation messages the LLM keeps as context. It counts
            messages, not user and agent pairs. The agent's `instructions` don't count toward this
            limit.
        failure_message:
          type: string
          description: >-
            The message the agent speaks with the TTS stage when the LLM fails to produce a
            response.
        tools:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/FunctionTool"
          description: >-
            Function tools the model can call. An agent can have up to 32 tools in total, including
            tools discovered from `mcp_servers`. Tool names must be unique, ignoring case.
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/McpServer"
          description: MCP servers whose tools the model can call.
    FunctionTool:
      type: object
      required:
        - type
        - name
        - description
        - parameters
        - execution
        - server
      properties:
        type:
          type: string
          const: function
          description: Always `function`.
        name:
          type: string
          maxLength: 64
          description: >-
            The tool name shown to the model. It starts with a letter and contains only letters and
            digits, up to 64 characters. It can't start with `mcp`, can't be `ragsearch_tool`, and
            can't match an MCP, built-in, or model-native tool.
        description:
          type: string
          minLength: 1
          maxLength: 1024
          description: What the tool does, 1 to 1,024 characters. The model uses it to decide when to call the tool.
        parameters:
          type: object
          additionalProperties: true
          description: A JSON Schema that describes the tool's arguments.
        execution:
          type: object
          required:
            - mode
          description: How the agent runs the tool.
          properties:
            mode:
              type: string
              const: sync
              description: "`sync`: The agent waits for the tool response before it continues."
        server:
          type: object
          required:
            - method
            - url
          description: The HTTP endpoint the agent calls to run the tool.
          properties:
            method:
              type: string
              enum:
                - GET
                - POST
              description: The HTTP method.
            url:
              type: string
              minLength: 1
              maxLength: 2048
              pattern: ^https://
              description: The HTTPS URL of the endpoint, up to 2,048 characters.
            headers:
              type: object
              maxProperties: 32
              propertyNames:
                minLength: 1
                maxLength: 128
              additionalProperties:
                type: string
              writeOnly: true
              description: HTTP headers sent to the endpoint, up to 32. They are write-only and are never returned.
            body:
              type: object
              additionalProperties: true
              description: Additional fields to include in the request body.
            timeout_ms:
              type: integer
              minimum: 1000
              maximum: 100000
              default: 10000
              description: The request timeout in milliseconds.
    McpServer:
      type: object
      required:
        - name
        - endpoint
        - transport
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 48
          description: A name for the MCP server, 1 to 48 letters and digits.
        endpoint:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^https://
          description: The HTTPS URL of the MCP server, up to 2,048 characters.
        transport:
          type: string
          const: streamable_http
          description: "The MCP transport. `streamable_http`: Streamable HTTP."
        headers:
          type: object
          additionalProperties:
            type: string
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 128
          writeOnly: true
          description: HTTP headers sent to the MCP server, up to 32. They are write-only and are never returned.
        allowed_tools:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: |-
            The tools the model can call from this server:

            - Omit the field, or include `*` in the list, to allow every tool.
            - Pass an empty list to allow no tools.
            - Otherwise, only the listed tools are allowed.
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 100000
          description: The request timeout in milliseconds.
    TtsConfig:
      type: object
      description: The text-to-speech (TTS) stage, which converts the agent's replies to speech.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          description: The TTS provider, for example `microsoft`.
        model:
          type: string
          readOnly: true
          description: The TTS model the agent uses. Returned in responses only.
        url:
          type: string
          description: >-
            A custom provider endpoint. Don't also put the endpoint in `params`.
        headers:
          $ref: "#/components/schemas/StageHeaders"
        params:
          type: object
          additionalProperties: true
          description: >-
            Provider-specific settings that aren't secret, such as the voice and, where the
            provider requires it, the model, passed to the provider as they are. Keep API keys in
            `credential`, not here.
        skip_patterns:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - fullwidth_parentheses
              - lenticular_brackets
              - parentheses
              - square_brackets
              - curly_braces
          description: |-
            Bracketed text that the agent doesn't speak, such as tone or action notes in the LLM
            output:

            - `fullwidth_parentheses`: Text in `（）`.
            - `lenticular_brackets`: Text in `【】`.
            - `parentheses`: Text in `( )`.
            - `square_brackets`: Text in `[ ]`.
            - `curly_braces`: Text in `{ }`.
    AvatarConfig:
      type: object
      description: The avatar that represents the agent on video.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to show the avatar.
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          enum:
            - akool
            - liveavatar
            - anam
            - sensetime
            - spatius
            - generic
          description: >-
            The avatar provider. `generic` passes provider-neutral parameters through.
        params:
          type: object
          additionalProperties: true
          description: Provider-specific settings, passed to the provider as they are.
      # TODO(platform-confirm): Ticket: avatar runtime support needs Samyak's confirmation before the
      # Models pages publish it.
    StartOfSpeech:
      description: >-
        How the agent detects that the user starts speaking. Pass the fields of one detection type
        only. If you omit it, the agent uses `semantic` detection with its defaults.
      oneOf:
        - $ref: "#/components/schemas/SemanticStartOfSpeech"
        - $ref: "#/components/schemas/VadStartOfSpeech"
        - $ref: "#/components/schemas/ManualStartOfSpeech"
      discriminator:
        propertyName: type
        mapping:
          semantic: "#/components/schemas/SemanticStartOfSpeech"
          vad: "#/components/schemas/VadStartOfSpeech"
          manual: "#/components/schemas/ManualStartOfSpeech"
    SemanticStartOfSpeech:
      type: object
      title: Semantic
      required:
        - type
      properties:
        type:
          type: string
          const: semantic
          default: semantic
          description: "`semantic`: Detects a meaningful start of speech. If you omit `type`, the agent uses `semantic`."
        speaking_interrupt_duration_ms:
          type: integer
          default: 160
          description: >-
            How long in milliseconds the user must speak to interrupt the agent while it's
            speaking.
    VadStartOfSpeech:
      type: object
      title: VAD
      required:
        - type
      properties:
        type:
          type: string
          const: vad
          description: "`vad`: Uses voice activity detection (VAD) on the audio signal."
        interrupt_duration_ms:
          type: integer
          minimum: 120
          maximum: 1200
          default: 160
          description: Speech shorter than this, in milliseconds, is ignored.
        speaking_interrupt_duration_ms:
          type: integer
          minimum: 120
          maximum: 1200
          default: 160
          description: >-
            How long in milliseconds the user must speak to interrupt the agent while it's
            speaking.
        prefix_padding_ms:
          type: integer
          minimum: 0
          maximum: 5000
          default: 800
          description: >-
            How many milliseconds of audio before the detected start of speech to keep, so the
            beginning of the speech isn't clipped.
    ManualStartOfSpeech:
      type: object
      title: Manual
      required:
        - type
      properties:
        type:
          type: string
          const: manual
          description: >-
            `manual`: Your client signals when the user starts speaking. This needs client
            signaling, which isn't available yet.
    EndOfSpeech:
      description: >-
        How the agent detects that the user has finished speaking. Pass the fields of one
        detection type only. If you omit it, the agent uses `semantic` detection with its
        defaults.
      oneOf:
        - $ref: "#/components/schemas/SemanticEndOfSpeech"
        - $ref: "#/components/schemas/VadEndOfSpeech"
        - $ref: "#/components/schemas/ManualEndOfSpeech"
      discriminator:
        propertyName: type
        mapping:
          semantic: "#/components/schemas/SemanticEndOfSpeech"
          vad: "#/components/schemas/VadEndOfSpeech"
          manual: "#/components/schemas/ManualEndOfSpeech"
    SemanticEndOfSpeech:
      type: object
      title: Semantic
      required:
        - type
      properties:
        type:
          type: string
          const: semantic
          default: semantic
          description: "`semantic`: Considers whether the utterance sounds complete. If you omit `type`, the agent uses `semantic`."
        silence_duration_ms:
          type: integer
          minimum: 120
          maximum: 2000
          default: 320
          description: The silence in milliseconds that ends the turn.
        max_wait_ms:
          oneOf:
            - type: integer
              minimum: 500
              maximum: 10000
            - type: integer
              const: -1
          default: 3000
          description: >-
            The maximum time in milliseconds to wait before ending the turn, from 500 to 10,000. Set
            to `-1` to wait without a timeout.
        pause_state_enabled:
          type: boolean
          default: true
          description: >-
            Whether the agent detects a pause within an utterance, such as "hold on", and waits for
            more input.
    VadEndOfSpeech:
      type: object
      title: VAD
      required:
        - type
      properties:
        type:
          type: string
          const: vad
          description: "`vad`: Uses the length of the silence after the speech."
        silence_duration_ms:
          type: integer
          minimum: 120
          maximum: 2000
          default: 640
          description: The silence in milliseconds that ends the turn.
    ManualEndOfSpeech:
      type: object
      title: Manual
      required:
        - type
      properties:
        type:
          type: string
          const: manual
          description: >-
            `manual`: Your client signals when the user stops speaking. This needs client
            signaling, which isn't available yet.
    Interruption:
      description: >-
        How the user can interrupt the agent while it speaks or thinks. Pass the fields of one
        interruption mode only. If you omit it, any user speech interrupts the agent.
      oneOf:
        - $ref: "#/components/schemas/StartOfSpeechInterruption"
        - $ref: "#/components/schemas/KeywordsInterruption"
        - $ref: "#/components/schemas/OffInterruption"
      default:
        mode: start_of_speech
      discriminator:
        propertyName: mode
        mapping:
          start_of_speech: "#/components/schemas/StartOfSpeechInterruption"
          keywords: "#/components/schemas/KeywordsInterruption"
          "off": "#/components/schemas/OffInterruption"
    StartOfSpeechInterruption:
      type: object
      title: Start of speech
      required:
        - mode
      properties:
        mode:
          type: string
          const: start_of_speech
          description: "`start_of_speech`: Any user speech interrupts the agent."
    KeywordsInterruption:
      type: object
      title: Keywords
      required:
        - mode
        - keywords
      properties:
        mode:
          type: string
          const: keywords
          description: "`keywords`: Only the phrases in `keywords` interrupt the agent."
        keywords:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: string
            minLength: 1
          description: The phrases that interrupt the agent, 1 to 128.
    OffInterruption:
      type: object
      title: "Off"
      required:
        - mode
      properties:
        mode:
          type: string
          const: "off"
          description: "`off`: The user can't interrupt the agent."
        when_off:
          type: string
          enum:
            - append
            - ignore
          default: append
          description: |-
            What happens to user speech that arrives while the agent speaks or thinks:

            - `append`: The agent responds to the speech after the current reply.
            - `ignore`: The agent discards the speech.
    TurnDetection:
      type: object
      description: How the agent detects when the user starts and stops speaking, and handles interruptions.
      properties:
        speech_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: >-
            The speech detection threshold. Lower values detect speech more easily. Higher values
            ignore weak speech.
        start_of_speech:
          $ref: "#/components/schemas/StartOfSpeech"
        end_of_speech:
          $ref: "#/components/schemas/EndOfSpeech"
        interruption:
          $ref: "#/components/schemas/Interruption"
    SilenceConfig:
      type: object
      required:
        - enabled
        - timeout_ms
        - action
        - content
      description: >-
        What the agent does after a period of silence. This only prompts the user. To hang up a
        phone call after silence, use `call_policy.max_silence_duration_ms`.
      properties:
        enabled:
          type: boolean
          description: Whether to act on silence.
        timeout_ms:
          type: integer
          minimum: 0
          maximum: 60000
          description: >-
            How long the silence lasts, in milliseconds, before the agent acts, up to 60,000.
            Applies only when `enabled` is `true`.
        action:
          type: string
          enum:
            - speak
            - think
          description: |-
            What the agent does when the timeout is reached:

            - `speak`: Speaks `content` as written.
            - `think`: Gives `content` to the LLM as an instruction, and responds to it.
        content:
          type: string
          description: The text to speak, or the instruction for the LLM, depending on `action`.
    Pipeline:
      type: object
      required:
        - mode
        - llm
        - tts
      description: >-
        The models that power the agent: separate ASR, LLM, and TTS stages. When you pass a
        pipeline, `llm` and `tts` are required.
      # TODO(platform-confirm): The launch contract says an omitted pipeline gets a managed default. In
      # pre-release testing (2026-10-27), sessions for an agent without a pipeline failed with 502. Confirm.
      properties:
        mode:
          type: string
          const: cascaded
          description: "`cascaded`: Separate ASR, LLM, and TTS stages."
        asr:
          $ref: "#/components/schemas/AsrConfig"
        llm:
          $ref: "#/components/schemas/LlmConfig"
        tts:
          $ref: "#/components/schemas/TtsConfig"
        turn_detection:
          $ref: "#/components/schemas/TurnDetection"
        silence_config:
          $ref: "#/components/schemas/SilenceConfig"
        avatar:
          $ref: "#/components/schemas/AvatarConfig"
    AgentName:
      type: string
      minLength: 1
      maxLength: 255
      description: A name for the agent, 1 to 255 characters. It doesn't need to be unique.
    Instructions:
      type: string
      description: >-
        The system instructions that define how the agent behaves. The model receives them as the
        first `system` message, before `messages`.
    Messages:
      type: array
      items:
        $ref: "#/components/schemas/Message"
      description: Messages that start the conversation history. They follow `instructions`.
    AgentCreate:
      type: object
      required:
        - agent_name
      properties:
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        variables:
          $ref: "#/components/schemas/Variables"
        greeting:
          $ref: "#/components/schemas/Greeting"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        filler_words:
          $ref: "#/components/schemas/FillerWords"
    EphemeralAgent:
      type: object
      description: >-
        The agent configuration for this session. It has the same fields as
        [Create an agent](/en/api-reference/api-ref/conversational-ai/platform/create-agent), except
        `agent_name`. The configuration isn't saved.
      properties:
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        variables:
          $ref: "#/components/schemas/Variables"
        greeting:
          $ref: "#/components/schemas/Greeting"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        filler_words:
          $ref: "#/components/schemas/FillerWords"
    AgentUpdate:
      type: object
      description: >-
        The fields to change, as a JSON merge patch. Fields you omit keep their saved values.
      properties:
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        variables:
          type: object
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/VariableDefinition"
              - type: "null"
          description: >-
            Changes to the variables, keyed by variable name. Each definition you pass merges into
            the saved definition field by field, so set a field such as `options` to `null` to
            remove it. Set a variable to `null` to remove the variable.
        greeting:
          type: object
          additionalProperties: true
          description: >-
            Changes to the greeting. Pass any of the `greeting` fields of [Create an
            agent](/en/api-reference/api-ref/conversational-ai/platform/create-agent). Set it to `null`
            to remove the greeting.
        pipeline:
          type: object
          additionalProperties: true
          description: >-
            Changes to the pipeline. Pass any of the `pipeline` fields of [Create an
            agent](/en/api-reference/api-ref/conversational-ai/platform/create-agent). Nested objects
            merge field by field.
        filler_words:
          type: object
          additionalProperties: true
          description: >-
            Changes to the filler words. Pass any of the `filler_words` fields of [Create an
            agent](/en/api-reference/api-ref/conversational-ai/platform/create-agent).
    Agent:
      type: object
      required:
        - agent_id
        - agent_name
        - create_ts
        - update_ts
      properties:
        agent_id:
          type: string
          format: uuid
          description: The ID of the agent, a UUID.
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        variables:
          $ref: "#/components/schemas/Variables"
        greeting:
          $ref: "#/components/schemas/Greeting"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        filler_words:
          $ref: "#/components/schemas/FillerWords"
        create_ts:
          type: integer
          description: The time the agent was created, as a Unix timestamp in seconds.
        update_ts:
          type: integer
          description: The time the agent was last updated, as a Unix timestamp in seconds.
    AgentSummary:
      type: object
      required:
        - agent_id
        - agent_name
        - create_ts
        - update_ts
      properties:
        agent_id:
          type: string
          format: uuid
          description: The ID of the agent.
        agent_name:
          type: string
          description: The name of the agent.
        create_ts:
          type: integer
          description: The time the agent was created, as a Unix timestamp in seconds.
        update_ts:
          type: integer
          description: The time the agent was last updated, as a Unix timestamp in seconds.
    AgentList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of agents on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/AgentSummary"
                  description: The agents on this page. Retrieve an agent to get its configuration.
        - $ref: "#/components/schemas/ListPageInfo"

    # ---------------------------------------------------------------------------------------------
    # Sessions
    # ---------------------------------------------------------------------------------------------
    RtcEncryption:
      type: object
      required:
        - mode
        - key
      writeOnly: true
      description: Media encryption for the RTC channel. These values are never returned.
      properties:
        mode:
          type: string
          enum:
            - aes_128_xts
            - aes_128_ecb
            - aes_256_xts
            - sm4_128_ecb
            - aes_128_gcm
            - aes_256_gcm
            - aes_128_gcm2
            - aes_256_gcm2
          description: >-
            The encryption mode. Agora recommends `aes_128_gcm2` or `aes_256_gcm2`, which use a
            salt.
        key:
          type: string
          minLength: 1
          writeOnly: true
          description: The encryption key.
        salt:
          type: string
          pattern: ^[A-Za-z0-9+/]{43}=$
          writeOnly: true
          description: >-
            A Base64-encoded salt that is 32 bytes long after decoding. Required when `mode` is
            `aes_128_gcm2` or `aes_256_gcm2`.
    EndCallPolicy:
      type: object
      description: >-
        Conditions under which the agent can end the call itself. Every condition is off unless you
        set it to `true`.
      properties:
        on_user_request:
          type: boolean
          default: false
          description: End the call when the caller clearly says goodbye or asks to hang up.
        on_voicemail:
          type: boolean
          default: false
          description: >-
            End the call when the agent reaches voicemail, such as a "please leave a message after
            the tone" announcement.
        on_ai_assistant:
          type: boolean
          default: false
          description: >-
            End the call when the call is answered by an AI assistant, a voice secretary, or another
            automated answering system.
    CallPolicy:
      type: object
      description: >-
        Limits and behavior for outbound phone calls. Each limit you omit adds no limit.
      properties:
        max_ring_duration_ms:
          type: integer
          minimum: 1
          description: >-
            The maximum time in milliseconds from starting the dial until the call is answered. If
            the call isn't answered in time, the dial attempt ends.
        max_call_duration_seconds:
          type: integer
          minimum: 1
          description: >-
            The maximum length of the call in seconds, measured from when it's answered. The
            session's `lifecycle` limits can end the call earlier.
        max_silence_duration_ms:
          type: integer
          minimum: 1
          description: >-
            Hang up when nobody on the call has spoken for this many milliseconds. This is separate
            from `pipeline.silence_config`, which only prompts the user.
        end_call:
          $ref: "#/components/schemas/EndCallPolicy"
    CampaignCallPolicy:
      type: object
      description: >-
        Limits and behavior for each call the campaign places. Each limit you omit adds no limit.
      properties:
        max_ring_duration_ms:
          type: integer
          minimum: 1
          maximum: 259200000
          description: >-
            The maximum time in milliseconds from starting the dial until the call is answered. If
            the call isn't answered in time, the dial attempt ends.
        max_call_duration_seconds:
          type: integer
          minimum: 1
          maximum: 259200
          description: >-
            The maximum length of the call in seconds, measured from when it's answered. The
            session's `lifecycle` limits can end the call earlier.
        max_silence_duration_ms:
          type: integer
          minimum: 30000
          maximum: 259200000
          description: >-
            Hang up when nobody on the call has spoken for this many milliseconds. This is separate
            from `pipeline.silence_config`, which only prompts the user.
        end_call:
          $ref: "#/components/schemas/EndCallPolicy"
    RtcTransport:
      type: object
      title: RTC
      required:
        - type
        - channel
        - subscribe_uids
      description: Joins the agent to an RTC channel.
      properties:
        type:
          type: string
          const: rtc
          description: "`rtc`: The agent joins an RTC channel."
        channel:
          type: string
          minLength: 1
          maxLength: 256
          description: The name of the RTC channel to join, 1 to 256 characters.
        token:
          type: string
          writeOnly: true
          description: >-
            The RTC token the agent uses to join the channel. Required when the project has an App
            Certificate enabled. To renew it, [update the
            session](/en/api-reference/api-ref/conversational-ai/platform/update-session).
        # TODO(platform-confirm): uid and subscribe_uids are documented as string or integer, as the
        # product supports both. On 2026-10-30, studio-backend main (v3 RtcTransport) accepted only
        # strings and returned 400 for an integer uid.
        uid:
          oneOf:
            - type: string
              title: String
              minLength: 1
              maxLength: 255
            - type: integer
              title: Integer
              minimum: 0
              maximum: 4294967295
          default: "0"
          description: >-
            The user ID the agent uses in the channel. Pass a string of up to 255 characters, such
            as `"1002"` or `"agent-bot"`, or an integer from 0 to 4294967295, such as `1002`. Omit
            it, or pass `0`, to let Agora assign a user ID that differs from `subscribe_uids`.
        subscribe_uids:
          type: array
          minItems: 1
          maxItems: 1
          items:
            oneOf:
              - type: string
                title: String
                minLength: 1
                maxLength: 255
              - type: integer
                title: Integer
                minimum: 1
                maximum: 4294967295
          description: >-
            The user ID of the participant the agent talks to, as a string or an integer. Pass
            exactly one user ID.
        audio_scenario:
          type: string
          enum:
            - aiserver
            - chorus
          default: aiserver
          description: |-
            The audio scenario of the agent in the channel:

            - `aiserver`: Optimized for latency and network resilience in conversations with an
              agent.
            - `chorus`: For participants with good network conditions who need ultra-low latency.
        encryption:
          $ref: "#/components/schemas/RtcEncryption"
    TelephonyTransport:
      type: object
      title: Telephony
      required:
        - type
        - from
        - to
      description: Places an outbound phone call from a number registered in the project.
      properties:
        type:
          type: string
          const: telephony
          description: "`telephony`: The agent places a phone call."
        from:
          type: string
          format: uuid
          description: >-
            The `number_id` of the number in the project to call from. Phone numbers aren't
            accepted. [Import the number](/en/api-reference/api-ref/conversational-ai/platform/create-number)
            first.
        to:
          type: string
          pattern: ^\+[1-9][0-9]{1,14}$
          description: The phone number to call, in E.164 format, for example `+14155550100`.
        call_policy:
          $ref: "#/components/schemas/CallPolicy"
    SessionTransport:
      description: >-
        How the agent connects to the participant. Pass the fields of one transport type only.
      oneOf:
        - $ref: "#/components/schemas/RtcTransport"
        - $ref: "#/components/schemas/TelephonyTransport"
      discriminator:
        propertyName: type
        mapping:
          rtc: "#/components/schemas/RtcTransport"
          telephony: "#/components/schemas/TelephonyTransport"
    SessionLifecycle:
      type: object
      description: When the session ends on its own.
      properties:
        idle_timeout_ms:
          type: integer
          minimum: 0
          maximum: 3600000
          default: 30000
          description: >-
            How long in milliseconds the session continues with no participant present: after the
            subscribed user leaves the RTC channel, or after the other side of a phone call hangs
            up. It isn't silence detection. Set to `0` to turn off the idle timer. Can't be greater
            than `max_duration_ms`.
        max_duration_ms:
          type: integer
          minimum: 1000
          maximum: 3600000
          default: 300000
          description: >-
            The maximum length of the session in milliseconds, measured from `start_ts`. Defaults to
            5 minutes. The maximum is 1 hour.
        graceful_stop:
          type: object
          description: >-
            How the agent finishes when you stop the session, or when the idle timer expires. It
            doesn't extend `max_duration_ms`, and it doesn't add a farewell message.
          properties:
            enabled:
              type: boolean
              default: false
              description: Whether the agent finishes what it's saying before it leaves.
            timeout_ms:
              type: integer
              minimum: 0
              maximum: 120000
              default: 30000
              description: The longest time in milliseconds the agent can take to finish.
    CampaignLifecycle:
      type: object
      description: When each session the campaign starts ends on its own.
      properties:
        idle_timeout_ms:
          type: integer
          minimum: 0
          maximum: 3600000
          default: 30000
          description: >-
            How long in milliseconds the session continues with no participant present: after the
            subscribed user leaves the RTC channel, or after the other side of a phone call hangs
            up. It isn't silence detection. Set to `0` to turn off the idle timer. Can't be greater
            than `max_duration_ms`.
        max_duration_ms:
          type: integer
          minimum: 1000
          maximum: 3600000
          default: 300000
          description: >-
            The maximum length of each session in milliseconds, measured from `start_ts`. Defaults to
            5 minutes. The maximum is 1 hour.
        graceful_stop:
          type: object
          description: >-
            How the agent finishes when you stop the session, or when the idle timer expires. It
            doesn't extend `max_duration_ms`, and it doesn't add a farewell message.
          properties:
            enabled:
              type: boolean
              default: false
              description: Whether the agent finishes what it's saying before it leaves.
            timeout_ms:
              type: integer
              minimum: 0
              maximum: 120000
              default: 30000
              description: The longest time in milliseconds the agent can take to finish.
    SessionDataPolicy:
      type: object
      description: >-
        How Agora handles the session's data. You set it when the session starts and can't change it
        afterward.
      properties:
        retention:
          type: string
          enum:
            - 30_days
            - none
          default: 30_days
          description: |-
            How long Agora keeps the conversation data:

            - `30_days`: Agora keeps the data for 30 days.
            - `none`: Agora doesn't keep the data, and variable extraction doesn't run. Use it, for
              example, when a caller declines recording.
    SessionValues:
      type: object
      propertyNames:
        pattern: ^[a-z][a-z0-9_]{0,63}$
      additionalProperties: true
      description: >-
        Values for the agent's variables, keyed by variable name, for this session only. Each key
        must be a variable the agent declares, and each value must match its `type` and `options`.
        Pass a value for every `required` variable. `null` values are rejected.
      example:
        customer_name: Ada
    SessionLabels:
      type: object
      additionalProperties:
        type: string
      description: >-
        Key-value labels for this session, such as a team or customer ID. They're included in the
        `payload` of [notification events](/en/ai/reference/event-types).
    SessionStart:
      type: object
      required:
        - agent_id
        - transport
      properties:
        agent_id:
          type: string
          format: uuid
          description: The ID of the saved agent to run.
        transport:
          $ref: "#/components/schemas/SessionTransport"
        values:
          $ref: "#/components/schemas/SessionValues"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        data_policy:
          $ref: "#/components/schemas/SessionDataPolicy"
        labels:
          $ref: "#/components/schemas/SessionLabels"
    EphemeralSessionStart:
      type: object
      required:
        - agent
        - transport
      properties:
        agent:
          $ref: "#/components/schemas/EphemeralAgent"
        transport:
          $ref: "#/components/schemas/SessionTransport"
        values:
          $ref: "#/components/schemas/SessionValues"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        data_policy:
          $ref: "#/components/schemas/SessionDataPolicy"
        labels:
          $ref: "#/components/schemas/SessionLabels"
    SessionStarted:
      type: object
      required:
        - agent_session_id
        - create_ts
        - status
      properties:
        agent_session_id:
          type: string
          pattern: ^[a-z0-9]{32}$
          description: The ID of the session.
        create_ts:
          type: integer
          description: The time the session was created, as a Unix timestamp in seconds.
        status:
          type: string
          enum:
            - STARTING
            - RUNNING
          description: >-
            The status of the session when it starts. For a phone call, `RUNNING` doesn't mean the
            call was answered.
      # Pre-release testing (28 Oct) returned 200 with `create_ts` and uppercase `RUNNING` for Start a
      # session and Start an ephemeral session, matching the launch contract. Earlier builds returned 201
      # with lowercase `running` and `created_at`.
    SessionUpdated:
      type: object
      required:
        - agent_session_id
        - create_ts
        - status
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        create_ts:
          type: integer
          description: The time the session was created, as a Unix timestamp in seconds.
        status:
          $ref: "#/components/schemas/SessionStatus"
    SessionUpdate:
      type: object
      properties:
        transport:
          type: object
          required:
            - token
          description: Changes to the transport. Only the RTC token can change.
          properties:
            token:
              type: string
              minLength: 1
              writeOnly: true
              description: >-
                A new RTC token for the agent. Applies only to sessions that started with a token.
        agent:
          type: object
          description: Changes to the running agent.
          properties:
            overrides:
              type: object
              description: Values that replace the running agent's current values.
              properties:
                messages:
                  $ref: "#/components/schemas/Messages"
                  description: >-
                    The conversation messages the agent uses. They replace all of the current
                    messages, including the agent's `instructions`, which the session received as
                    its first `system` message. To keep the instructions, pass them as the first
                    `system` message in this list.
                pipeline:
                  type: object
                  description: Runtime model parameters.
                  properties:
                    llm:
                      type: object
                      properties:
                        params:
                          type: object
                          additionalProperties: true
                          description: >-
                            Provider-specific LLM parameters. They replace the current `params`
                            object as a whole, so include every parameter that must stay.
    SessionStatus:
      type: string
      enum:
        - IDLE
        - STARTING
        - RUNNING
        - STOPPING
        - STOPPED
        - FAILED
      description: |-
        The status of the session:

        - `IDLE`: The session is idle.
        - `STARTING`: The session is starting.
        - `RUNNING`: The session is running.
        - `STOPPING`: The session is stopping.
        - `STOPPED`: The session has ended.
        - `FAILED`: The session failed.
    Session:
      type: object
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        agent_name:
          type: string
          description: The name of the agent that the session runs.
        status:
          $ref: "#/components/schemas/SessionStatus"
        start_ts:
          type: integer
          description: The time the session was created, as a Unix timestamp in seconds.
        stop_ts:
          type:
            - integer
            - "null"
          description: >-
            The time the session ended, as a Unix timestamp in seconds. `null` while the session is
            active.
        message:
          type:
            - string
            - "null"
          description: >-
            Additional details about the status, such as a failure diagnosis. `null` when there are
            none.
      # TODO(platform-confirm): On staging, `agent_name` returned the engine's task name
      # (`session-...` or `ephemeral-...`), not the agent's name.
    SessionSummary:
      type: object
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        status:
          $ref: "#/components/schemas/SessionStatus"
        start_ts:
          type: integer
          description: The time the session was created, as a Unix timestamp in seconds.
    SessionList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of sessions on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/SessionSummary"
                  description: The sessions on this page.
        - $ref: "#/components/schemas/ListPageInfo"

    # ---------------------------------------------------------------------------------------------
    # Secrets
    # ---------------------------------------------------------------------------------------------
    SecretValues:
      type: object
      minProperties: 1
      propertyNames:
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_]+$
      additionalProperties:
        type: string
        format: password
        writeOnly: true
      description: >-
        The secrets, as key-value pairs. Each key is 1 to 64 characters from `A-Z`, `a-z`, `0-9`,
        and `_`, and must be unique within the set. Values are write-only and are never
        returned. A set can hold at most 64 KiB, measured as the UTF-8 size of its keys and values
        encoded as a JSON object. A larger set is rejected with `400`.
    SecretSetCreate:
      type: object
      required:
        - name
        - secrets
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            A name for the secret set, unique in the project. Use 1 to 64 characters from `A-Z`,
            `a-z`, `0-9`, and `_`. Names are case-sensitive.
        secrets:
          $ref: "#/components/schemas/SecretValues"
    SecretSetReplace:
      type: object
      required:
        - secrets
      properties:
        secrets:
          $ref: "#/components/schemas/SecretValues"
    SecretSetUpdate:
      type: object
      required:
        - secrets
      properties:
        secrets:
          type: object
          minProperties: 1
          propertyNames:
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9_]+$
          additionalProperties:
            type:
              - string
              - "null"
            format: password
            writeOnly: true
          description: >-
            The keys to change. A string value adds the key, or replaces its value if the key
            exists. A `null` value removes the key. Keys you omit don't change.
    SecretKey:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          description: The name of the key.
    SecretSet:
      type: object
      required:
        - name
        - keys
        - create_ts
        - update_ts
      properties:
        name:
          type: string
          description: The name of the secret set.
        keys:
          type: array
          items:
            type: string
          description: The names of the keys in the set. Values are never returned.
        create_ts:
          type: integer
          description: The time the set was created, as a Unix timestamp in seconds.
        update_ts:
          type: integer
          description: The time the set was last updated, as a Unix timestamp in seconds.
    SecretSetList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of secret sets on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/SecretSet"
                  description: The secret sets on this page.
        - $ref: "#/components/schemas/ListPageInfo"
    SecretKeyWrite:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: >-
            The secret value. It is write-only and is never returned. The whole set, including this
            value, can hold at most 64 KiB.

    # ---------------------------------------------------------------------------------------------
    # Phone numbers
    # ---------------------------------------------------------------------------------------------
    SipAuth:
      type: object
      required:
        - username
        - password
      writeOnly: true
      description: >-
        The credentials for your SIP trunk. They are write-only and are never returned.
      properties:
        username:
          type: string
          writeOnly: true
          description: The SIP username.
        password:
          type: string
          writeOnly: true
          description: >-
            The SIP password. Referring to a secret set, such as
            `$secrets.support_prod.sip_password`, isn't supported in the Preview.
    SipTrunk:
      type: object
      required:
        - hostname
      description: The carrier connection for this number.
      properties:
        name:
          type: string
          description: A name for the carrier connection that helps you identify it.
        hostname:
          type: string
          pattern: ^[^:/\s]+$
          description: >-
            The carrier's SIP hostname, without a scheme or port. For example,
            `acme.pstn.example.com`.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: >-
            The SIP signaling port. Defaults to `5061` when `transport` is `tls`, and `5060` when
            it's `udp` or `tcp`.
        transport:
          type: string
          enum:
            - udp
            - tcp
            - tls
          default: tls
          description: The transport protocol for the carrier connection.
        auth:
          $ref: "#/components/schemas/SipAuth"
        allowed_ips:
          type: array
          items:
            type: string
          description: >-
            The addresses allowed to send inbound SIP traffic to this number. Each entry is an IPv4
            address, such as `54.172.60.1`, or an IPv4 CIDR range, such as `54.172.60.0/23`. IPv6
            addresses and hostnames aren't accepted. If you omit it, inbound SIP traffic is
            accepted from any address, so set it to your carrier's signaling addresses.
    SipTrunkResponse:
      type: object
      properties:
        name:
          type: string
          description: The name of the carrier connection.
        hostname:
          type: string
          description: The carrier's SIP hostname.
        port:
          type: integer
          description: The SIP signaling port.
        transport:
          type: string
          enum:
            - udp
            - tcp
            - tls
          description: The transport protocol for the carrier connection.
        allowed_ips:
          type: array
          items:
            type: string
          description: The addresses allowed to send inbound SIP traffic.
    InboundCallPolicy:
      type: object
      description: >-
        Limits and behavior for inbound calls to this number. Each limit you omit adds no limit.
      properties:
        max_call_duration_seconds:
          type: integer
          minimum: 1
          description: The maximum length of a call in seconds, measured from when it's answered.
        max_silence_duration_ms:
          type: integer
          minimum: 1
          description: >-
            Hang up when nobody on the call has spoken for this many milliseconds.
        end_call:
          $ref: "#/components/schemas/EndCallPolicy"
    Inbound:
      type: object
      required:
        - agent
      description: >-
        What happens when someone calls this number. If you omit it, inbound calls are rejected.
        `call_policy` is required when `agent` isn't `null`.
      properties:
        agent:
          type:
            - string
            - "null"
          description: >-
            The ID of the agent that answers inbound calls. Set to `null` to reject inbound calls.
        call_policy:
          $ref: "#/components/schemas/InboundCallPolicy"
    NumberDescription:
      type: string
      description: >-
        A description of the number's purpose. It's separate from `sip_trunk.name`, which names the
        carrier connection.
    NumberCreate:
      type: object
      required:
        - number
        - sip_trunk
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 128
          description: The phone number in E.164 format, for example `+14155550100`.
        description:
          $ref: "#/components/schemas/NumberDescription"
        sip_trunk:
          $ref: "#/components/schemas/SipTrunk"
        inbound:
          $ref: "#/components/schemas/Inbound"
    NumberUpdate:
      type: object
      description: >-
        The fields to change. Fields you omit keep their saved values. `sip_trunk` and `inbound`
        replace the saved object as a whole, so pass every field you want to keep. Set `inbound` to
        `null` to stop routing inbound calls to an agent. Other fields can't be `null`.
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The phone number in a different format. You can reformat the number, but you can't
            change it to a different number.
        description:
          $ref: "#/components/schemas/NumberDescription"
        sip_trunk:
          $ref: "#/components/schemas/SipTrunk"
        inbound:
          $ref: "#/components/schemas/Inbound"
    Number:
      type: object
      properties:
        number_id:
          type: string
          format: uuid
          description: The ID of the phone number, a UUID.
        number:
          type: string
          description: The phone number in E.164 format.
        description:
          $ref: "#/components/schemas/NumberDescription"
        sip_trunk:
          $ref: "#/components/schemas/SipTrunkResponse"
        inbound:
          $ref: "#/components/schemas/Inbound"
        create_ts:
          type: integer
          description: The time the number was added, as a Unix timestamp in seconds.
    NumberList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of phone numbers on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/Number"
                  description: The phone numbers on this page.
        - $ref: "#/components/schemas/ListPageInfo"

    # ---------------------------------------------------------------------------------------------
    # Campaigns
    # ---------------------------------------------------------------------------------------------
    CampaignTransport:
      type: object
      required:
        - type
        - from
      description: How the campaign reaches its contacts.
      properties:
        type:
          type: string
          const: telephony
          description: "`telephony`: The campaign places phone calls."
        from:
          oneOf:
            - type: string
              format: uuid
              title: One number
            - type: array
              title: Several numbers
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                type: string
                format: uuid
          description: >-
            The `number_id` of the number to call from, or a list of up to 100 unique `number_id`
            values. With a list, the campaign rotates across the numbers.
        call_policy:
          $ref: "#/components/schemas/CampaignCallPolicy"
    CampaignContact:
      type: object
      required:
        - phone
      description: One contact to call. Each contact is a separate dial task.
      properties:
        phone:
          type: string
          description: The phone number to call, in E.164 format, for example `+12025550123`.
        values:
          type: object
          maxProperties: 100
          additionalProperties: true
          description: >-
            Values for the agent's variables for this contact, keyed by variable name, up to 100.
            Each key must be a variable the agent declares, and each value must match its `type` and
            `options`. Pass a value for every `required` variable. If any contact breaks these
            rules, the whole request fails with `400`, and no campaign is created. `null` values are
            rejected.
    CampaignPacing:
      type: object
      description: How fast the campaign dials. Each contact is called once.
      properties:
        max_concurrent:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
          description: The maximum number of calls in progress at the same time.
        max_calls_per_second:
          type: integer
          minimum: 1
          maximum: 1000
          description: >-
            The maximum number of new dials in any one-second window. If you omit it, the campaign
            uses your project's default dial rate. A value above the project's limit is rejected
            with `InvalidFieldValue`.
    CampaignScheduleWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          description: The start of the window, as a local time in 24-hour `HH:MM` format.
        end:
          type: string
          description: >-
            The end of the window, as a local time in `HH:MM` format, later than `start`. Use
            `24:00` for the end of the day.
    CampaignScheduleDay:
      type: object
      required:
        - weekday
        - ranges
      properties:
        weekday:
          type: string
          enum:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          description: The day of the week. Each day can appear only once.
        ranges:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/CampaignScheduleWindow"
          description: One to 10 windows on this day, which can't overlap.
    CampaignSchedule:
      description: >-
        When the campaign dials. Pass the fields of one schedule mode only.
      oneOf:
        - $ref: "#/components/schemas/ImmediateCampaignSchedule"
        - $ref: "#/components/schemas/ScheduledCampaignSchedule"
      discriminator:
        propertyName: mode
        mapping:
          immediate: "#/components/schemas/ImmediateCampaignSchedule"
          scheduled: "#/components/schemas/ScheduledCampaignSchedule"
    ImmediateCampaignSchedule:
      type: object
      title: Immediate
      required:
        - mode
      properties:
        mode:
          type: string
          const: immediate
          description: "`immediate`: The campaign starts dialing as soon as it's created."
        timezone:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The IANA time zone for `days`, for example `America/New_York`. Daylight saving time is
            handled automatically. Required when you pass `days`.
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/CampaignScheduleDay"
          description: >-
            The weekly hours when new calls can start. Outside these hours, no new calls start. A
            day you don't list has no dialing. Omit `days` to dial at any time.
    ScheduledCampaignSchedule:
      type: object
      title: Scheduled
      required:
        - mode
        - timezone
        - start
        - end
      properties:
        mode:
          type: string
          const: scheduled
          description: "`scheduled`: The campaign dials from `start` until `end`."
        timezone:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The IANA time zone for `start`, `end`, and `days`, for example `America/New_York`.
            Daylight saving time is handled automatically.
        start:
          type: string
          description: >-
            When the campaign can start dialing, as a local date and time in `YYYY-MM-DDTHH:MM`
            format with no offset, for example `2026-11-02T09:00`. A local time that doesn't exist
            or occurs twice because of a daylight saving change is rejected.
        end:
          type: string
          description: >-
            When the campaign stops placing new calls, as a local date and time in
            `YYYY-MM-DDTHH:MM` format, later than `start`. Calls in progress continue. A local time
            that doesn't exist or occurs twice because of a daylight saving change is rejected.
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/CampaignScheduleDay"
          description: >-
            The weekly hours when new calls can start. Outside these hours, no new calls start. A
            day you don't list has no dialing. Omit `days` to dial at any time.
    CampaignCreate:
      type: object
      required:
        - name
        - agent_id
        - transport
        - contacts
        - schedule
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: A name for the campaign that helps you identify it, 1 to 255 characters.
        agent_id:
          type: string
          format: uuid
          description: The ID of the saved agent that makes the calls.
        transport:
          $ref: "#/components/schemas/CampaignTransport"
        contacts:
          type: array
          minItems: 1
          maxItems: 50000
          items:
            $ref: "#/components/schemas/CampaignContact"
          description: >-
            The contacts to call, from 1 to 50,000. The whole request body can be at most 10 MiB. You can't change the list after you create the
            campaign. A phone number that appears more than once is called once for each entry.
        schedule:
          $ref: "#/components/schemas/CampaignSchedule"
        lifecycle:
          $ref: "#/components/schemas/CampaignLifecycle"
          description: >-
            The lifecycle settings for each session the campaign starts. Each session can last up to
            1 hour, and lasts up to 5 minutes by default.
        pacing:
          $ref: "#/components/schemas/CampaignPacing"
        data_policy:
          $ref: "#/components/schemas/SessionDataPolicy"
          description: The data policy for each session the campaign starts. Defaults to 30-day retention.
    CampaignUpdate:
      type: object
      description: >-
        The fields to change. Before the campaign starts dialing, you can change `pacing`,
        `schedule`, `lifecycle`, and `transport.call_policy`. After it starts, you can change only
        `pacing`.
      properties:
        pacing:
          type: object
          description: >-
            Changes to the pacing. Pass any of the `pacing` fields of [Create a
            campaign](/en/api-reference/api-ref/conversational-ai/platform/create-campaign). Fields you
            omit keep their saved values.
          properties:
            max_concurrent:
              type: integer
              minimum: 1
              maximum: 10000
              description: The maximum number of calls in progress at the same time.
            max_calls_per_second:
              type: integer
              minimum: 1
              maximum: 1000
              description: The maximum number of new dials in any one-second window.
        schedule:
          $ref: "#/components/schemas/CampaignSchedule"
        lifecycle:
          $ref: "#/components/schemas/CampaignLifecycle"
          description: >-
            The lifecycle settings for each session the campaign starts. They replace the saved
            settings, and fields you omit use their defaults.
        transport:
          type: object
          description: The transport settings that can change. You can't change `type` or `from`.
          properties:
            call_policy:
              $ref: "#/components/schemas/CampaignCallPolicy"
    CampaignStatus:
      type: string
      enum:
        - scheduled
        - running
        - paused
        - completed
        - canceled
        - failed
      description: |-
        The status of the campaign:

        - `scheduled`: The campaign is waiting for its start time.
        - `running`: The campaign is dialing, or can dial during its schedule.
        - `paused`: You paused the campaign.
        - `completed`: The campaign has finished.
        - `canceled`: You canceled the campaign.
        - `failed`: The campaign failed. The details are in `failure`.
    CampaignCounts:
      type: object
      description: The number of contacts in each state. Retrieve the campaign to get current counts.
      properties:
        contacts:
          type: integer
          description: The total number of contacts.
        pending:
          type: integer
          description: Contacts not called yet, or waiting for a retry.
        calling:
          type: integer
          description: Contacts in a call now.
        completed:
          type: integer
          description: Contacts whose call has finished.
        failed:
          type: integer
          description: Contacts not reached after all attempts.
        canceled:
          type: integer
          description: Contacts that won't be called because the campaign was canceled.
    Campaign:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
          description: The ID of the campaign, a UUID.
        name:
          type: string
          description: The name of the campaign.
        status:
          $ref: "#/components/schemas/CampaignStatus"
        agent_id:
          type: string
          format: uuid
          description: The ID of the agent that makes the calls.
        transport:
          type: object
          properties:
            type:
              type: string
              const: telephony
              description: Always `telephony`.
            from:
              type: array
              items:
                type: string
              description: The `number_id` values of the numbers the campaign calls from.
            call_policy:
              $ref: "#/components/schemas/CampaignCallPolicy"
        lifecycle:
          $ref: "#/components/schemas/CampaignLifecycle"
        schedule:
          $ref: "#/components/schemas/CampaignSchedule"
        counts:
          $ref: "#/components/schemas/CampaignCounts"
        create_ts:
          type: integer
          description: The time the campaign was created, as a Unix timestamp in seconds.
        start_ts:
          type:
            - integer
            - "null"
          description: >-
            The time the campaign started dialing, as a Unix timestamp in seconds. `null` before it
            starts.
        complete_ts:
          type:
            - integer
            - "null"
          description: >-
            The time the campaign finished, as a Unix timestamp in seconds. `null` until it
            finishes.
        failure:
          oneOf:
            - $ref: "#/components/schemas/Failure"
            - type: "null"
          description: Details of the failure when `status` is `failed`. Otherwise `null`.
    CampaignList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of campaigns on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/Campaign"
                  description: The campaigns on this page.
        - $ref: "#/components/schemas/ListPageInfo"

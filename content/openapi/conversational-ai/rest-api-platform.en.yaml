          markdown: >-
            Send only the fields you want to change. `sip_trunk` and `inbound` are each replaced as
            a whole, so pass the complete object, including `sip_trunk.auth` if the trunk uses
            authentication. If you leave out `auth` or `allowed_ips`, the saved values are removed.
            To stop routing inbound calls to an agent, set `inbound` to `null`. You can't change
            the phone number itself. To use a different number, create a new one.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/NumberId"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberUpdate"
            example:
              inbound:
                agent: 3f6c2a9e-8d1b-4e7a-9c55-0b2f7d1e4a10
                call_policy:
                  max_call_duration_seconds: 1800
      responses:
        "200":
          description: The number was updated. The response body contains the full number.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Number"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `MissingRequiredField` when the `If-Match` header
            is missing or `inbound.agent` is set without `inbound.call_policy`, or `NotImplemented`
            when the SIP password is a `$secrets` reference or `number` is a different phone
            number.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: >-
            `ResourceNotFound`: No number has this ID. `AgentNotFound`: The agent in
            `inbound.agent` doesn't exist.
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `ResourceConflict`: Another project in your account already routes this number's
            inbound calls to an agent.
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Phone numbers
      summary: Delete a phone number
      description: Removes a phone number and its SIP trunk settings from your project.
      operationId: delete-number
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/NumberId"
      responses:
        "200":
          description: The number was deleted.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `ResourceConflict`: A campaign that hasn't finished still calls from this number.
            Wait for the campaign to finish, or cancel it, before you delete the number.
        default:
          $ref: "#/components/responses/Error"

  # -----------------------------------------------------------------------------------------------
  # Campaigns

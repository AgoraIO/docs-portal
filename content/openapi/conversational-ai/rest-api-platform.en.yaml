# Conversational AI Platform REST API (Preview)
#
# Source: the launch contract (OpenAPI download with availability=current, and the reference pages)
# from the internal reference site, reviewed 18 Oct 2026. Deferred APIs and fields are omitted.
# MLLM and realtime pipelines are out of scope for the Preview and are omitted on purpose.
#
# Authentication: Basic HTTP authentication and the ConvoAI token (confirmed by the PM, 20 Oct
# 2026). See the RESTful authentication page in the Platform reference.
openapi: 3.1.0
info:
  version: ""
  title: Conversational AI Platform REST API (Preview)
  description: >-
    The Conversational AI Platform REST API lets you save agents, secrets, and phone numbers in
    your project, and use them to run agent sessions and outbound call campaigns from your server.
servers:
  - url: https://preview.ai.agora.io/conversational-ai
    description: Base endpoint for the Conversational AI Platform REST API (Preview).
x-docs-auth-links:
  tokenAuth: /en/api-reference/api-ref/conversational-ai/platform/authentication#token-authentication
  basicAuth: /en/api-reference/api-ref/conversational-ai/platform/authentication#basic-http-authentication
security:
  - tokenAuth: []
  - basicAuth: []
tags:
  - name: Agents
    description: >-
      Save reusable agent configurations, including instructions, variables, greeting, and the
      speech pipeline, so that you can start sessions and campaigns from them.
  - name: Sessions
    description: >-
      Start, control, and stop agent sessions. A session runs one agent in one RTC channel or
      phone call.
  - name: Secrets
    description: >-
      Store provider API keys and other credentials in named secret sets. Agents reference secrets
      instead of embedding them. Secret values are write-only and are never returned.
  - name: Phone numbers
    description: >-
      Register phone numbers and the SIP trunks that carry their calls, and choose the agent that
      answers inbound calls.
  - name: Campaigns
    description: >-
      Dial a list of contacts with a saved agent, on a schedule or right away. Each call starts a
      telephony session.
paths:
  # -----------------------------------------------------------------------------------------------
  # Agents
  # -----------------------------------------------------------------------------------------------
  /v1/projects/{appid}/agents:
    post:
      tags:
        - Agents
      summary: Create an agent
      description: Saves a reusable agent configuration in your project.
      operationId: create-agent
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to save an agent that you can then use to start sessions and
            campaigns. Only `agent_name` is required. If you omit `greeting`, the agent doesn't greet
            participants automatically.


            Saving or updating an agent doesn't change sessions that are already running.
      x-docs-callouts:
        - type: info
          title: Keep provider keys in secrets
          position: after-description
          markdown: >-
            Set `credential` on each pipeline stage. With `byok`, pass your provider keys in
            `credential.fields` as `$secrets.<set>.<key>` references to a [secret
            set](/en/api-reference/api-ref/conversational-ai/platform/create-secret-set). Most
            providers take one field, `api_key`. Agora checks that each reference exists when you
            create the agent. Keep credentials out of `params`.
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
            example:
              agent_name: Customer Support Agent
              instructions: >-
                You are a support agent for Acme. Address the caller as {{customer_name}}. Be
                concise.
              variables:
                customer_name:
                  type: str
                  required: true
                resolution_status:
                  type: str
                  options:
                    - resolved
                    - follow_up
                    - unresolved
                  extract: true
                  description: Outcome of the conversation.
              pipeline:
                mode: cascaded
                asr:
                  credential:
                    mode: managed
                  vendor: deepgram
                  model: nova-3
                  language: en-US
                llm:
                  credential:
                    mode: byok
                    fields:
                      api_key: $secrets.support_prod.llm
                  vendor: openai
                  style: openai
                  model: <model_name>
                  max_history: 12
                  failure_message: I'm sorry, I couldn't generate a response. Please try again.
                tts:
                  credential:
                    mode: managed
                  vendor: minimax
                  params:
                    model: speech-2.6-turbo
                    voice_setting:
                      voice_id: English_captivating_female1
                      speed: 1
                silence_config:
                  enabled: true
                  timeout_ms: 3000
                  action: speak
                  content: Hello, how can I help you?
              greeting:
                mode: text
                "on": each_join
                delay_ms: 0
                text: Hi, thanks for calling Acme.
      responses:
        "201":
          description: The agent was created. The response body contains the saved agent.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
              example:
                agent_id: 3f6c2a9e-8d1b-4e7a-9c55-0b2f7d1e4a10
                agent_name: Customer Support Agent
                instructions: >-
                  You are a support agent for Acme. Address the caller as {{customer_name}}. Be
                  concise.
                variables:
                  customer_name:
                    type: str
                    required: true
                  resolution_status:
                    type: str
                    options:
                      - resolved
                      - follow_up
                      - unresolved
                    extract: true
                    description: Outcome of the conversation.
                pipeline:
                  mode: cascaded
                  asr:
                    credential:
                      mode: managed
                    vendor: deepgram
                    model: nova-3
                    language: en-US
                  llm:
                    credential:
                      mode: byok
                    vendor: openai
                    style: openai
                    model: <model_name>
                    max_history: 12
                    failure_message: I'm sorry, I couldn't generate a response. Please try again.
                  tts:
                    credential:
                      mode: managed
                    vendor: minimax
                    params:
                      model: speech-2.6-turbo
                      voice_setting:
                        voice_id: English_captivating_female1
                        speed: 1
                  silence_config:
                    enabled: true
                    timeout_ms: 3000
                    action: speak
                    content: Hello, how can I help you?
                greeting:
                  mode: text
                  "on": each_join
                  delay_ms: 0
                  text: Hi, thanks for calling Acme.
                create_ts: 1786543331
                update_ts: 1786543331
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `InvalidFieldValue` when a pipeline stage has an
            unsupported vendor, model, or credential mode, `MissingRequiredField` when a stage is
            missing a provider parameter or its BYOK `fields`, `UnknownSecretReference` when a
            `$secrets` reference names a set or key that doesn't exist, `InvalidModuleParameter`
            when the resulting pipeline is invalid, or `NotImplemented` when a field isn't
            available yet.
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
      # TODO(platform-confirm): Staging (14 Oct) required `params.url` for managed ASR and TTS and `url`
      # for a managed LLM, and rejected other URLs. The contract describes `url` only as a custom
      # endpoint and lets you omit the pipeline entirely. Confirm the launch behavior.
    get:
      tags:
        - Agents
      summary: List agents
      description: Retrieves the agents saved in your project.
      operationId: list-agents
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: The maximum number of agents to return on each page.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: The request was successful. The response body contains a page of agents.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
              example:
                data:
                  count: 1
                  list:
                    - agent_id: 3f6c2a9e-8d1b-4e7a-9c55-0b2f7d1e4a10
                      agent_name: Customer Support Agent
                      create_ts: 1786543331
                      update_ts: 1787733713
                has_more: false
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /v1/projects/{appid}/agents/{agent_id}:
    get:
      tags:
        - Agents
      summary: Retrieve an agent
      description: Retrieves the configuration of a saved agent.
      operationId: retrieve-agent
      x-docs-sections:
        - position: after-description
          markdown: >-
            The response includes the agent's current `ETag`. Pass it in the `If-Match` header when
            you [update the agent](/en/api-reference/api-ref/conversational-ai/platform/update-agent).
            Pipeline stages report only `credential.mode`. API keys and secret references are never
            returned.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The request was successful. The response body contains the agent.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
              example:
                agent_id: 3f6c2a9e-8d1b-4e7a-9c55-0b2f7d1e4a10
                agent_name: Customer Support Agent
                instructions: You are a support agent for Acme. Be concise.
                pipeline:
                  mode: cascaded
                  llm:
                    credential:
                      mode: byok
                    vendor: openai
                    style: openai
                    model: <model_name>
                create_ts: 1786543331
                update_ts: 1787733713
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Agents
      summary: Update an agent
      description: Changes the configuration of a saved agent.
      operationId: update-agent
      x-docs-sections:
        - position: after-description
          markdown: >-
            The request body is a JSON merge patch. Send only the fields you want to change.
            Nested objects merge field by field, arrays replace the saved value, and `null` removes
            a field. Variable definitions merge field by field too: to drop a saved `options`,
            `extract`, or `description`, set it to `null`.


            The update applies to sessions that start afterward. Running sessions keep the
            configuration they started with. To change a running session, use [Update a
            session](/en/api-reference/api-ref/conversational-ai/platform/update-session).
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
            example:
              instructions: >-
                You are a support agent for Acme. Address the caller as {{customer_name}}. Be
                concise and polite.
              variables:
                follow_up_date: null
      responses:
        "200":
          description: The agent was updated. The response body contains the full agent.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request is invalid. For example, `MissingRequiredField` when the `If-Match` header
            is missing, `InvalidModuleParameter` when a pipeline stage is invalid, or
            `UnknownSecretReference` when a `$secrets` reference doesn't exist.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Agents
      summary: Delete an agent
      description: Deletes a saved agent.
      operationId: delete-agent
      x-docs-sections:
        - position: after-description
          markdown: >-
            You can't delete an agent that a phone number routes inbound calls to, or that a
            campaign that hasn't finished uses. Remove those references first.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The agent was deleted.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `AgentInUse`: A phone number's inbound routing or an unfinished campaign references the
            agent. `detail` names the reference.
        default:
          $ref: "#/components/responses/Error"

  # -----------------------------------------------------------------------------------------------
  # Sessions
  # -----------------------------------------------------------------------------------------------
  /v1/projects/{appid}/sessions:
    post:
      tags:
        - Sessions
      summary: Start a session
      description: Starts a session that runs a saved agent in an RTC channel or over the phone.
      operationId: start-session
      x-docs-sections:
        - position: after-description
          markdown: >-
            The session uses the agent's configuration as saved when the session starts. To run a
            configuration without saving an agent first, use [Start an ephemeral
            session](/en/api-reference/api-ref/conversational-ai/platform/start-ephemeral-session).


            A `200` response confirms that the session exists. It doesn't confirm that the agent
            has joined the RTC channel or that an outbound call was answered. To follow the
            session, [retrieve it](/en/api-reference/api-ref/conversational-ai/platform/retrieve-session).
            The session ends when you [stop it](/en/api-reference/api-ref/conversational-ai/platform/stop-session),
            or when it reaches a limit in `lifecycle`.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionStart"
            examples:
              rtc:
                summary: RTC channel
                value:
                  agent_id: 3f6c2a9e-8d1b-4e7a-9c55-0b2f7d1e4a10
                  values:
                    customer_name: Ada
                  labels:
                    team: support
                  transport:
                    type: rtc
                    channel: support-4821
                    token: <your_rtc_token>
                    uid: "1002"
                    subscribe_uids:
                      - "1001"
                  lifecycle:
                    idle_timeout_ms: 30000
                    max_duration_ms: 3600000
              telephony:
                summary: Outbound phone call
                value:
                  agent_id: 3f6c2a9e-8d1b-4e7a-9c55-0b2f7d1e4a10
                  values:
                    customer_name: Ada
                  transport:
                    type: telephony
                    from: 92e68758-3d3a-4f27-8b93-3fd8d834467c
                    to: "+14155550100"
                    call_policy:
                      max_ring_duration_ms: 30000
                      max_call_duration_seconds: 600
                      end_call:
                        on_voicemail: true
      responses:
        "200":
          description: The session was created.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStarted"
              example:
                agent_session_id: a42ac95tp25py49fc37hp94vm67ht52h
                create_ts: 1737111452
                status: RUNNING
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request was rejected and no session was created. For example,
            `InvalidModuleParameter` when the agent's pipeline is invalid, `MissingRequiredField`
            when a required variable has no value, or `InvalidFieldValue` when a telephony session
            uses an agent that is deployed for inbound calls.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: >-
            `AgentNotFound`: No agent has this `agent_id`. `NumberNotFound`: The number in
            `transport.from` isn't in the project.
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `TaskConflict`: An agent is already running with the same RTC channel and UID.
            `IdempotencyKeyConflict`: A session was already started with this `Idempotency-Key`.
        "422":
          $ref: "#/components/responses/Error"
          description: "`ResourceQuotaLimitExceeded`: The project has reached its session quota."
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: >-
            `ConcurrencyLimitExceeded`: The project has reached its concurrent session limit. Stop
            a session, or retry later with exponential backoff.
        "503":
          $ref: "#/components/responses/Error"
          description: >-
            `ResourceAllocationFailed`: No capacity is available to start the session. Retry with
            exponential backoff.
        "504":
          $ref: "#/components/responses/Error"
          description: >-
            `TaskOperationTimeout`: Starting the session didn't finish in time. The session may
            still start. Retrieve or list sessions before you retry.
        default:
          $ref: "#/components/responses/Error"
    get:
      tags:
        - Sessions
      summary: List sessions
      description: Retrieves the sessions in your project that match the filters.
      operationId: list-sessions
      x-docs-sections:
        - position: after-description
          markdown: >-
            By default, the response contains running sessions that started in the last two hours.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: channel
          in: query
          required: false
          schema:
            type: string
          description: >-
            Return only sessions in this RTC channel. The match is exact and case-sensitive.
            Telephony sessions have no RTC channel and never match.
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: RUNNING
          description: >-
            The statuses to include, separated by commas, for example `RUNNING,STOPPED`. Valid
            statuses are `IDLE`, `STARTING`, `RUNNING`, `STOPPING`, `STOPPED`, and `FAILED`.
        - name: started_after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: >-
            Return only sessions that started after this time, as a Unix timestamp in seconds.
            Defaults to two hours before the request.
        - name: started_before
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: >-
            Return only sessions that started before this time, as a Unix timestamp in seconds.
            Defaults to the time of the request.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
          description: The maximum number of sessions to return on each page.
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The request was successful. The response body contains a page of sessions.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
              example:
                data:
                  count: 1
                  list:
                    - agent_session_id: a42ac95tp25py49fc37hp94vm67ht52h
                      start_ts: 1735035893
                      status: RUNNING
                has_more: true
                next_cursor: a42aj97dh44ve73km82yr34rr67pk75e
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /v1/projects/{appid}/sessions/ephemeral:
    post:
      tags:
        - Sessions
      summary: Start an ephemeral session
      description: Starts a session with an agent configuration that you pass in the request.
      operationId: start-ephemeral-session
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to start a session without saving an agent first, for example to
            test a configuration. The request body is the same as [Start a
            session](/en/api-reference/api-ref/conversational-ai/platform/start-session), but with the
            agent configuration in `agent` instead of `agent_id`. The configuration isn't saved.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EphemeralSessionStart"
            example:
              agent:
                instructions: Answer account questions concisely.
                pipeline:
                  mode: cascaded
                  asr:
                    credential:
                      mode: managed
                    vendor: deepgram
                    model: nova-3
                    language: en-US
                  llm:
                    credential:
                      mode: byok
                      fields:
                        api_key: $secrets.support_prod.llm
                    vendor: openai
                    style: openai
                    model: <model_name>
                  tts:
                    credential:
                      mode: managed
                    vendor: minimax
                    params:
                      model: speech-2.6-turbo
                      voice_setting:
                        voice_id: English_captivating_female1
                        speed: 1
              transport:
                type: rtc
                channel: support-4821
                token: <your_rtc_token>
                uid: "1002"
                subscribe_uids:
                  - "1001"
      responses:
        "200":
          description: The session was created.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStarted"
              example:
                agent_session_id: a42al97tw77hv93ja98dm74fk56lw97x
                create_ts: 1737111452
                status: RUNNING
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The request was rejected and no session was created. For example,
            `InvalidModuleParameter` when the pipeline is invalid, or `UnknownSecretReference`
            when a `$secrets` reference doesn't exist.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`NumberNotFound`: The number in `transport.from` isn't in the project."
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `TaskConflict`: An agent is already running with the same RTC channel and UID.
            `IdempotencyKeyConflict`: A session was already started with this `Idempotency-Key`.
        "422":
          $ref: "#/components/responses/Error"
          description: "`ResourceQuotaLimitExceeded`: The project has reached its session quota."
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: >-
            `ConcurrencyLimitExceeded`: The project has reached its concurrent session limit. Stop
            a session, or retry later with exponential backoff.
        "503":
          $ref: "#/components/responses/Error"
          description: >-
            `ResourceAllocationFailed`: No capacity is available to start the session. Retry with
            exponential backoff.
        "504":
          $ref: "#/components/responses/Error"
          description: >-
            `TaskOperationTimeout`: Starting the session didn't finish in time. The session may
            still start. Retrieve or list sessions before you retry.
        default:
          $ref: "#/components/responses/Error"
  /v1/projects/{appid}/sessions/{agent_session_id}:
    get:
      tags:
        - Sessions
      summary: Retrieve a session
      description: Retrieves the status of a session.
      operationId: retrieve-session
      x-docs-sections:
        - position: after-description
          markdown: >-
            Starting and stopping a session happen asynchronously. Retrieve the session to follow
            its `status`. After the session ends, the response includes `stop_ts`.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentSessionId"
      responses:
        "200":
          description: The request was successful. The response body contains the session.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                running:
                  summary: Running session
                  value:
                    agent_session_id: a42ac95tp25py49fc37hp94vm67ht52h
                    agent_name: Customer Support Agent
                    status: RUNNING
                    start_ts: 1735035893
                    stop_ts: null
                    message: null
                ended:
                  summary: Ended session
                  value:
                    agent_session_id: a42ac95tp25py49fc37hp94vm67ht52h
                    agent_name: Customer Support Agent
                    status: STOPPED
                    start_ts: 1735035893
                    stop_ts: 1735036193
                    message: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`TaskNotFound`: No session has this `agent_session_id`."
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Sessions
      summary: Update a session
      description: Changes the RTC token or the model context of a running session.
      operationId: update-session
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to renew the agent's RTC token, or to replace the conversation
            messages or LLM parameters of a running session. Each field you pass replaces its
            current value as a whole, so include every LLM parameter that must stay. `messages`
            also replaces the agent's `instructions`, so pass the instructions as the first
            `system` message to keep them. You can't change other session or transport fields after
            the session starts.


            Support for runtime changes depends on the provider. If the provider can't apply a
            change, the request fails with `NotImplemented` and the session doesn't change.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
            example:
              transport:
                token: <your_new_rtc_token>
              agent:
                overrides:
                  messages:
                    - role: system
                      content: You are helping the customer with a billing question.
                  pipeline:
                    llm:
                      params:
                        temperature: 0.2
      responses:
        "200":
          description: The session was updated.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUpdated"
              example:
                agent_session_id: a42ac95tp25py49fc37hp94vm67ht52h
                create_ts: 1737111452
                status: RUNNING
        "400":
          $ref: "#/components/responses/BadRequest"
          description: >-
            The update was rejected and the session didn't change. For example,
            `InvalidModuleParameter` when a parameter is invalid for the provider, or
            `NotImplemented` when the provider doesn't support this runtime change.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`TaskNotFound`: No session has this `agent_session_id`."
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `TaskNotRunning`: The session has ended or isn't running yet. `TaskConflict`: Another
            operation on the session is in progress.
        default:
          $ref: "#/components/responses/Error"
      # TODO(platform-confirm): The contract's Runtime updates guide describes If-Match, recursive merge
      # of params, and lifecycle updates. The endpoint page and the OpenAPI schema describe no
      # If-Match, replacement, and no lifecycle. Documented as the endpoint page and schema say.
  /v1/projects/{appid}/sessions/{agent_session_id}/stop:
    post:
      tags:
        - Sessions
      summary: Stop a session
      description: Stops a running session.
      operationId: stop-session
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to end a session as soon as its task is complete. Send the request
            without a body. The stop happens asynchronously. [Retrieve the
            session](/en/api-reference/api-ref/conversational-ai/platform/retrieve-session) to confirm
            that its status is `STOPPED`.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/AgentSessionId"
      responses:
        "200":
          description: The stop request was accepted. The response body is an empty object.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                type: object
              example: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: >-
            `TaskNotFound`: No session has this `agent_session_id`, or the session has already ended
            or failed to start and is no longer tracked.
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `TaskConflict`: The session is already stopping. `TaskNotRunning`: The session has
            already ended.
        "504":
          $ref: "#/components/responses/Error"
          description: >-
            `TaskOperationTimeout`: Stopping didn't finish in time. Retrieve the session to check
            its status.
        default:
          $ref: "#/components/responses/Error"
  /v1/projects/{appid}/secrets:
    post:
      tags:
        - Secrets
      summary: Create a secret set
      description: Creates a named set of secrets in your project.
      operationId: create-secret-set
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use secret sets to keep provider API keys out of your agent configurations. To use a
            secret, pass `$secrets.<set_name>.<key>` in an agent's `credential.fields`, for example
            in `credential.fields.api_key`. Agora resolves references when each session starts.


            If a set with the same name exists, the request fails with `SecretSetAlreadyExists`.
            To change values, [update the
            set](/en/api-reference/api-ref/conversational-ai/platform/update-secret-set) or [set a
            key](/en/api-reference/api-ref/conversational-ai/platform/set-secret-key).
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretSetCreate"
            example:
              name: support_prod
              secrets:
                asr: <your_asr_api_key>
                llm: <your_llm_api_key>
                tts: <your_tts_api_key>
      responses:
        "201":
          description: The secret set was created. The response body lists its keys.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSet"
              example:
                name: support_prod
                keys:
                  - asr
                  - llm
                  - tts
                create_ts: 1789898400
                update_ts: 1789898400
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `SecretSetAlreadyExists`: A set with this name exists.
        "422":
          $ref: "#/components/responses/Error"
          description: >-
            `ResourceQuotaLimitExceeded`: The account has reached its secret set quota. By default,
            an account can have up to 10 secret sets across all of its projects.
        default:
          $ref: "#/components/responses/Error"
    get:
      tags:
        - Secrets
      summary: List secret sets
      description: Retrieves the secret sets in your project and their key names.
      operationId: list-secret-sets
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: The maximum number of secret sets to return on each page.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: >-
            The request was successful. The response body contains a page of secret sets. Secret
            values are never returned.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSetList"
              example:
                data:
                  count: 1
                  list:
                    - name: support_prod
                      keys:
                        - llm
                      create_ts: 1789898400
                      update_ts: 1790000000
                has_more: false
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /v1/projects/{appid}/secrets/{name}:
    get:
      tags:
        - Secrets
      summary: Retrieve a secret set
      description: Retrieves the key names in a secret set.
      operationId: retrieve-secret-set
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
      responses:
        "200":
          description: >-
            The request was successful. The response body lists the keys in the set. Secret
            values are never returned.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSet"
              example:
                name: support_prod
                keys:
                  - llm
                create_ts: 1789898400
                update_ts: 1790000000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Secrets
      summary: Update a secret set
      description: Adds, changes, or removes several keys in a secret set in one change.
      operationId: update-secret-set
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to rotate keys that must change together. Pass a string to add or
            replace a key, or `null` to remove it. Keys you omit don't change. To change one key,
            [set the key](/en/api-reference/api-ref/conversational-ai/platform/set-secret-key) instead.
            To replace the whole set, use [Replace a secret
            set](/en/api-reference/api-ref/conversational-ai/platform/replace-secret-set).


            Running sessions keep the values they resolved when they started. New sessions use the
            new values.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretSetUpdate"
            example:
              secrets:
                llm: <your_new_llm_api_key>
                tts: <your_new_tts_api_key>
                asr: null
      responses:
        "200":
          description: The secret set was updated. The response body lists its keys.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `SecretSetInUse`: An agent references a key you're removing. `SecretSetEmpty`: The
            change would remove every key from the set.
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags:
        - Secrets
      summary: Replace a secret set
      description: Replaces all the keys in a secret set in one change.
      operationId: replace-secret-set
      x-docs-sections:
        - position: after-description
          markdown: >-
            After the request, the set contains only the keys you pass. Keys you omit are removed.
            Agents keep referencing the set by name, so you don't need to change them.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretSetReplace"
            example:
              secrets:
                asr: <your_asr_api_key>
                llm: <your_llm_api_key>
      responses:
        "200":
          description: The secret set was replaced. The response body lists its keys.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSet"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`MissingRequiredField`: The `If-Match` header is missing."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`SecretSetInUse`: An agent references a key that the replacement removes."
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Secrets
      summary: Delete a secret set
      description: Deletes a secret set and all its keys.
      operationId: delete-secret-set
      x-docs-sections:
        - position: after-description
          markdown: >-
            You can't delete a set that an agent references. Remove the references first. Changing
            a key also changes the set's `ETag`, so retrieve the set to get its current `ETag`
            before you delete it.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/IfMatchRequired"
      responses:
        "200":
          description: The secret set was deleted.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`MissingRequiredField`: The `If-Match` header is missing."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`SecretSetInUse`: An agent references the set. `detail` names the agent."
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"
  /v1/projects/{appid}/secrets/{name}/keys/{key}:
    put:
      tags:
        - Secrets
      summary: Set a secret key
      description: Adds a key to a secret set, or replaces the value of an existing key.
      operationId: set-secret-key
      x-docs-sections:
        - position: after-description
          markdown: >-
            Use this endpoint to add or rotate one key without sending the set's other values.
            Repeating the request is safe. Agents keep referencing `$secrets.<set>.<key>` without
            changes, and new sessions use the new value.


            The response returns `201` when the key is new and `200` when it replaces an existing
            value. Both headers are optional. Without them, the last write to the key wins.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/SecretKeyName"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: >-
            The key's `ETag` from your last write to it. The request fails with `412` if the key
            has changed since then.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            const: "*"
          description: >-
            Set to `*` to create the key only if it doesn't exist. If the key exists, the request
            fails with `412`, so a live value is never overwritten by accident.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretKeyWrite"
            example:
              value: <your_new_llm_api_key>
      responses:
        "200":
          description: The key's value was replaced.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretKey"
              example:
                key: llm
        "201":
          description: The key was added to the set.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretKey"
              example:
                key: tts
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`ResourceNotFound`: No secret set has this name."
        "412":
          $ref: "#/components/responses/PreconditionFailed"
          description: >-
            `PreconditionFailed`: The key has changed since the `If-Match` value, or the key exists
            and you sent `If-None-Match: *`.
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Secrets
      summary: Delete a secret key
      description: Removes a key from a secret set.
      operationId: delete-secret-key
      x-docs-sections:
        - position: after-description
          markdown: >-
            You can't remove a key that an agent references. A secret set must also keep at least
            one key. To remove the last key, [delete the
            set](/en/api-reference/api-ref/conversational-ai/platform/delete-secret-set) instead.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/SecretSetName"
        - $ref: "#/components/parameters/SecretKeyName"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: >-
            The key's `ETag` from your last write to it. The request fails with `412` if the key
            has changed since then.
      responses:
        "200":
          description: The key was removed.
          headers:
            Agora-Request-Id:
              $ref: "#/components/headers/Agora-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `SecretSetInUse`: An agent references the key. `SecretSetEmpty`: The key is the last
            key in the set.
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Error"


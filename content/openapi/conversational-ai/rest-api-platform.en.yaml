      schema:
        type: string
      description: The App ID of your project.
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the agent, returned in `agent_id` when you create the agent.
    SecretSetName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: The name of the secret set.
    SecretKeyName:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: >-
        The name of the key in the secret set. When you add a key, use 1 to 64 characters from
        `A-Z`, `a-z`, `0-9`, `_`, and `-`.
    NumberId:
      name: number_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the phone number, returned in `number_id` when you create the number.
    AgentSessionId:
      name: agent_session_id
      in: path
      required: true
      schema:
        type: string
      description: >-
        The ID of the session, returned in `agent_session_id` when you start the session.
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the campaign, returned in `campaign_id` when you create the campaign.
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: >-
        The `ETag` value from the most recent response for this resource. If the resource has
        changed since then, the request fails with `412` and reason `PreconditionFailed`. Retrieve
        the resource, apply your change again, and retry with the new `ETag`.
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: >-
        The `ETag` value from the most recent response for this resource. When you include it,
        the request fails with `412` and reason `PreconditionFailed` if the resource has changed
        since then. Use it to avoid overwriting a concurrent change.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: >-
        A unique key that makes the request safe to retry for 24 hours. If you retry with the same
        key and body, the API returns the original response with the `Idempotent-Replayed: true`
        header and doesn't repeat the operation. If you reuse the key with a different body, or
        while the original request is still in progress, the request fails with `409` and reason
        `IdempotencyKeyConflict`. Keep the same key when you retry; never switch keys.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >-
        The `next_cursor` value from the previous page of results. Omit it to get the first page.
        The cursor is opaque, so pass it back unchanged.
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum:
          - create_ts.desc
          - create_ts.asc
        default: create_ts.desc
      description: |-
        The sort order of the results:

        - `create_ts.desc`: Newest first.
        - `create_ts.asc`: Oldest first.
  headers:
    Agora-Request-Id:
      description: A unique ID for the request. Include it when you contact Agora support.
      schema:
        type: string
    ETag:
      description: >-
        The current version of the resource. Pass this value in the `If-Match` header of your next
        update or delete request for this resource.
      schema:
        type: string
    Location:
      description: The path of the new resource.
      schema:
        type: string
    Idempotent-Replayed:
      description: >-
        `true` when the response replays an earlier request that used the same `Idempotency-Key`.
      schema:
        type: string
    Retry-After:
      description: The number of seconds to wait before you retry the request.
      schema:
        type: integer
  responses:
    BadRequest:
      description: >-
        The request is invalid. Check `reason` and `detail` in the response body.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: >-
        Authentication is missing or invalid. The reason is `InvalidPermission`.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource in the path doesn't exist. The reason is `ResourceNotFound`.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionFailed:
      description: >-
        The `If-Match` value doesn't match the current version of the resource. The reason is
        `PreconditionFailed`. Retrieve the resource, apply your change again, and retry with the
        new `ETag`.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: >-
        Too many requests. The reason is `RateLimitExceeded`. Try again after `Retry-After`
        seconds.
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error:
      description: >-
        The request failed. The response body contains the `reason` and `detail` of the failure.
        For possible reasons, see [Status codes](/en/api-reference/api-ref/conversational-ai/platform/status-codes).
      headers:
        Agora-Request-Id:
          $ref: "#/components/headers/Agora-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - detail
        - reason
      properties:
        detail:
          type: string
          description: >-
            A human-readable description of the error. It names the field or resource involved,
            when there is one. Don't parse it; branch on `reason` instead.
        reason:
          type: string
          description: >-
            A machine-readable error reason, such as `InvalidFieldValue` or `ResourceNotFound`.
            For all reasons, see [Status codes](/en/api-reference/api-ref/conversational-ai/platform/status-codes).
      example:
        detail: The requested session was not found.
        reason: TaskNotFound
    Deleted:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
          const: true
          description: Always `true`. The resource is deleted.
      example:
        deleted: true
    ListPageInfo:
      type: object
      properties:
        has_more:
          type: boolean
          description: Whether more results are available after this page.
        next_cursor:
          type:
            - string
            - "null"
          description: >-
            The cursor for the next page. Pass it in the `cursor` query parameter of your next
            request. `null` on the last page.
    Failure:
      type: object
      required:
        - code
        - message
        - ts
      description: Details of a failure.
      properties:
        code:
          type: string
          description: A stable runtime error code, for example `provider_error`.
        provider:
          type: string
          description: The model provider that caused the failure, for example `openai`.
        message:
          type: string
          description: A human-readable explanation.
        ts:
          type: integer
          description: The time the failure occurred, as a Unix timestamp in seconds.

    # ---------------------------------------------------------------------------------------------
    # Agents
    # ---------------------------------------------------------------------------------------------
    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
          description: |-
            The author of the message:

            - `system`: An instruction to the model.
            - `user`: A message from the user.
            - `assistant`: A message from the agent.
        content:
          type: string
          description: The text of the message.
    Greeting:
      type: object
      required:
        - mode
        - text
      description: >-
        The message the agent speaks when a participant joins. If you omit it, the agent doesn't
        greet participants automatically.
      properties:
        mode:
          type: string
          enum:
            - text
            - audio
          description: |-
            How the agent delivers the greeting:

            - `text`: The agent speaks `text` using the TTS stage.
            - `audio`: The agent plays the audio file at `url`. If the file can't be downloaded or
              played, the agent speaks `text` instead.
        "on":
          type: string
          enum:
            - each_join
            - first_join
          description: |-
            Which participants the agent greets:

            - `each_join`: Every participant who joins.
            - `first_join`: Only the first participant to join.
        delay_ms:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
          description: >-
            The delay in milliseconds between a participant joining and the agent starting the
            greeting.
        text:
          type: string
          minLength: 1
          description: >-
            The greeting text. When `mode` is `audio`, this is the transcript of the audio file.
            The agent uses it as conversation context, and speaks it with the TTS stage if the
            audio download fails.
        url:
          type: string
          maxLength: 2048
          description: >-
            The URL of the greeting audio file. Supported formats are MP3, WAV, and PCM. Required
            when `mode` is `audio`.
        download_timeout_ms:
          type: integer
          minimum: 200
          maximum: 10000
          default: 1000
          description: >-
            The timeout in milliseconds for downloading the audio file. If the download times out,
            the agent speaks `text` instead. Applies only when `mode` is `audio`.
        pcm_sample_rate:
          type: integer
          minimum: 1
          default: 16000
          description: >-
            The sample rate in Hz of the audio file when its format is raw PCM. Not needed for MP3
            or WAV files. Applies only when `mode` is `audio`.
    VariableDefinition:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - str
            - int
            - float
            - bool
            - date
            - datetime
          description: >-
            The data type of the variable value. Pass `date` and `datetime` values as ISO 8601
            strings, for example `"2026-09-30"` and `"2026-09-30T14:00:00Z"`.
        required:
          type: boolean
          default: false
          description: >-
            Whether a value is required in `values` when you start a session, or in each campaign
            contact. If a required value is missing, the session or the contact is rejected with
            `MissingRequiredField`.
        options:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type:
              - string
              - number
              - boolean
          description: >-
            The allowed values, 1 to 100 unique items of the declared `type`. Values you supply
            must be one of them, and extraction chooses one of them.
        extract:
          type: boolean
          default: false
          description: >-
            Whether to extract this variable from the transcript after the session ends. The
            extracted values appear in the session's `analysis.result`. When `true`, `description`
            is required. An agent can have up to 50 extract variables.
        description:
          type: string
          maxLength: 2000
          description: >-
            What the variable means. Required when `extract` is `true`, where it serves as the
            extraction instruction.
    Variables:
      type: object
      propertyNames:
        pattern: ^[a-z][a-z0-9_]{0,63}$
      additionalProperties:
        $ref: "#/components/schemas/VariableDefinition"
      description: >-
        Every variable the agent uses, keyed by variable name. A name starts with a lowercase
        letter and contains up to 64 lowercase letters, digits, and underscores. Reference a
        variable as `{{variable_name}}` in `instructions`, `messages`, `greeting.text`,
        `pipeline.llm.failure_message`, `pipeline.silence_config.content`, and generated filler
        instructions. The agent doesn't store values: pass them in `values` when you start a
        session, or in each campaign contact. Expansion is single-pass, so a value that contains a
        placeholder isn't expanded again.
      example:
        customer_name:
          type: str
          required: true
        resolution_status:
          type: str
          options:
            - resolved
            - follow_up
            - unresolved
          extract: true
          description: Outcome of the conversation.
    FillerWords:
      type: object
      description: >-
        Short phrases the agent says while it waits for the LLM to respond, such as when it waits
        for a tool call.
      properties:
        enable:
          type: boolean
          description: Whether to play filler words.
        trigger:
          type: object
          required:
            - mode
            - response_wait_ms
          description: When to play a filler word.
          properties:
            mode:
              type: string
              const: fixed_time
              description: >-
                `fixed_time`: Play a filler word when the LLM hasn't responded within
                `response_wait_ms`.
            response_wait_ms:
              type: integer
              minimum: 100
              maximum: 10000
              default: 1500
              description: >-
                How long in milliseconds to wait for the LLM response before playing a filler word.
        content:
          type: object
          required:
            - mode
          description: Where the filler words come from.
          properties:
            mode:
              type: string
              enum:
                - static
                - generated
              description: |-
                The source of the filler words:

                - `static`: Pick a phrase from `phrases`.
                - `generated`: Generate a phrase from `instructions`.
            phrases:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: string
                minLength: 1
              description: The filler phrases, 1 to 100 non-empty strings. Required when `mode` is `static`.
            selection_rule:
              type: string
              enum:
                - shuffle
                - round_robin
              default: shuffle
              description: |-
                How the agent picks the next phrase. Applies when `mode` is `static`.

                - `shuffle`: In random order.
                - `round_robin`: In list order, starting over after the last phrase.
            instructions:
              type: string
              description: >-
                The instructions used to generate filler phrases. Required when `mode` is
                `generated`.
            fallback_strategy:
              type: string
              const: static
              description: >-
                What to use when a generated phrase isn't available. Applies when `mode` is
                `generated`.
    Credential:
      type: object
      required:
        - mode
      description: >-
        How this stage authenticates with the provider. Set it explicitly on each stage. Responses
        return only `mode`.
      properties:
        mode:
          type: string
          enum:
            - byok
            - managed
          description: |-
            The credential mode:

            - `byok`: Bring your own key. Pass your provider API key in `api_key`.
            - `managed`: Agora provides the provider authentication. Don't pass `api_key`.
        api_key:
          type: string
          minLength: 1
          writeOnly: true
          description: >-
            Your provider API key, as a `$secrets.<set_name>.<key>` reference to a [secret
            set](/en/api-reference/api-ref/conversational-ai/platform/create-secret-set) or as the key
            itself. Required when `mode` is `byok`, and not accepted when `mode` is `managed`. Agora
            resolves references when each session starts. This value is never returned.
    StageHeaders:
      type: object
      additionalProperties:
        type: string
      writeOnly: true
      description: >-
        Custom HTTP headers sent to the provider endpoint. They are write-only and are never
        returned.
    AsrConfig:
      type: object
      description: The automatic speech recognition (ASR) stage, which transcribes the user's speech.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          description: The ASR provider, for example `deepgram`.
        model:
          type: string
          description: The provider model, for example `nova-3`.
        language:
          type: string
          description: The language of the user's speech, for example `en-US`.
        url:
          type: string
          description: >-
            A custom provider endpoint. Don't also put the endpoint in `params`.
        params:
          type: object
          additionalProperties: true
          description: >-
            Provider-specific settings that aren't secret, such as `keywords`, passed to the
            provider as they are. Keep API keys in `credential`, not here.
    LlmConfig:
      type: object
      description: The large language model (LLM) stage, which generates the agent's replies.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          description: The LLM provider, for example `openai`.
        style:
          type: string
          description: >-
            The API style used to communicate with the model, for example `openai` for OpenAI and
            OpenAI-compatible APIs.
        model:
          type: string
          description: The provider model.
        url:
          type: string
          description: >-
            A custom provider endpoint. Don't also put the endpoint in `params`.
        headers:
          $ref: "#/components/schemas/StageHeaders"
        params:
          type: object
          additionalProperties: true
          description: >-
            Provider-specific settings that aren't secret, such as `reasoning_effort`, passed to
            the provider as they are. Keep API keys in `credential`, not here.
        input_modalities:
          type: array
          items:
            type: string
          description: The input types sent to the model, for example `["text"]`.
        output_modalities:
          type: array
          items:
            type: string
          description: The output types requested from the model, for example `["text"]`.
        max_history:
          type: integer
          minimum: 1
          maximum: 1024
          default: 32
          description: >-
            The number of recent conversation messages the LLM keeps as context. It counts
            messages, not user and agent pairs. The agent's `instructions` don't count toward this
            limit.
        failure_message:
          type: string
          description: >-
            The message the agent speaks with the TTS stage when the LLM fails to produce a
            response.
        tools:
          type: array
          items:
            $ref: "#/components/schemas/FunctionTool"
          description: >-
            Function tools the model can call. An agent can have up to 32 tools in total, including
            tools discovered from `mcp_servers`. Tool names must be unique, ignoring case.
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/McpServer"
          description: MCP servers whose tools the model can call.
    FunctionTool:
      type: object
      required:
        - type
        - name
        - description
        - parameters
        - execution
        - server
      properties:
        type:
          type: string
          const: function
          description: Always `function`.
        name:
          type: string
          maxLength: 64
          description: >-
            The tool name shown to the model. It starts with a letter and contains only letters and
            digits, up to 64 characters. It can't start with `mcp`, can't be `ragsearch_tool`, and
            can't match an MCP, built-in, or model-native tool.
        description:
          type: string
          minLength: 1
          maxLength: 1024
          description: What the tool does, 1 to 1,024 characters. The model uses it to decide when to call the tool.
        parameters:
          type: object
          additionalProperties: true
          description: A JSON Schema that describes the tool's arguments.
        execution:
          type: object
          required:
            - mode
          description: How the agent runs the tool.
          properties:
            mode:
              type: string
              const: sync
              description: "`sync`: The agent waits for the tool response before it continues."
        server:
          type: object
          required:
            - method
            - url
          description: The HTTP endpoint the agent calls to run the tool.
          properties:
            method:
              type: string
              enum:
                - GET
                - POST
              description: The HTTP method.
            url:
              type: string
              description: The HTTPS URL of the endpoint.
            headers:
              type: object
              additionalProperties:
                type: string
              writeOnly: true
              description: HTTP headers sent to the endpoint. They are write-only and are never returned.
            body:
              type: object
              additionalProperties: true
              description: Additional fields to include in the request body.
            timeout_ms:
              type: integer
              minimum: 1000
              maximum: 100000
              default: 10000
              description: The request timeout in milliseconds.
    McpServer:
      type: object
      required:
        - name
        - endpoint
        - transport
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 48
          description: A name for the MCP server, 1 to 48 letters and digits.
        endpoint:
          type: string
          description: The URL of the MCP server.
        transport:
          type: string
          const: streamable_http
          description: "The MCP transport. `streamable_http`: Streamable HTTP."
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: HTTP headers sent to the MCP server. They are write-only and are never returned.
        allowed_tools:
          type: array
          items:
            type: string
          description: |-
            The tools the model can call from this server:

            - Omit the field, or include `*` in the list, to allow every tool.
            - Pass an empty list to allow no tools.
            - Otherwise, only the listed tools are allowed.
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 100000
          description: The request timeout in milliseconds.
    TtsConfig:
      type: object
      description: The text-to-speech (TTS) stage, which converts the agent's replies to speech.
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          description: The TTS provider, for example `microsoft`.
        url:
          type: string
          description: >-
            A custom provider endpoint. Don't also put the endpoint in `params`.
        headers:
          $ref: "#/components/schemas/StageHeaders"
        params:
          type: object
          additionalProperties: true
          description: >-
            Provider-specific settings that aren't secret, such as the voice and, where the
            provider requires it, the model, passed to the provider as they are. Keep API keys in
            `credential`, not here.
        skip_patterns:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - fullwidth_parentheses
              - lenticular_brackets
              - parentheses
              - square_brackets
              - curly_braces
          description: |-
            Bracketed text that the agent doesn't speak, such as tone or action notes in the LLM
            output:

            - `fullwidth_parentheses`: Text in `（）`.
            - `lenticular_brackets`: Text in `【】`.
            - `parentheses`: Text in `( )`.
            - `square_brackets`: Text in `[ ]`.
            - `curly_braces`: Text in `{ }`.
    AvatarConfig:
      type: object
      description: The avatar that represents the agent on video.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether to show the avatar.
        credential:
          $ref: "#/components/schemas/Credential"
        vendor:
          type: string
          enum:
            - akool
            - liveavatar
            - anam
            - generic
          description: >-
            The avatar provider. `generic` passes provider-neutral parameters through.
        params:
          type: object
          additionalProperties: true
          description: Provider-specific settings, passed to the provider as they are.
      # TODO(platform-confirm): Ticket: avatar runtime support needs Samyak's confirmation before the
      # Models pages publish it.
    StartOfSpeech:
      type: object
      required:
        - type
      description: >-
        How the agent detects that the user starts speaking. If you omit it, the agent uses
        `semantic` detection with its defaults.
      properties:
        type:
          type: string
          enum:
            - semantic
            - vad
            - manual
          default: semantic
          description: |-
            The detection method:

            - `semantic`: Detects a meaningful start of speech.
            - `vad`: Uses voice activity detection (VAD) on the audio signal.
            - `manual`: Your client signals when the user starts speaking. This needs client
              signaling, which isn't available yet.
        speaking_interrupt_duration_ms:
          type: integer
          default: 160
          description: >-
            How long in milliseconds the user must speak to interrupt the agent while it's
            speaking. Applies when `type` is `semantic` or `vad`.
        interrupt_duration_ms:
          type: integer
          default: 160
          description: >-
            Speech shorter than this, in milliseconds, is ignored. Applies when `type` is `vad`.
        prefix_padding_ms:
          type: integer
          default: 800
          description: >-
            How many milliseconds of audio before the detected start of speech to keep, so the
            beginning of the speech isn't clipped. Applies when `type` is `vad`.
    EndOfSpeech:
      type: object
      required:
        - type
      description: >-
        How the agent detects that the user has finished speaking. If you omit it, the agent uses
        `semantic` detection with its defaults.
      properties:
        type:
          type: string
          enum:
            - semantic
            - vad
            - manual
          default: semantic
          description: |-
            The detection method:

            - `semantic`: Considers whether the utterance sounds complete.
            - `vad`: Uses the length of the silence after the speech.
            - `manual`: Your client signals when the user stops speaking. This needs client
              signaling, which isn't available yet.
        silence_duration_ms:
          type: integer
          minimum: 120
          maximum: 2000
          description: >-
            The silence in milliseconds that ends the turn. Defaults to `320` when `type` is
            `semantic` and `640` when `type` is `vad`. Not valid when `type` is `manual`.
        max_wait_ms:
          type: integer
          minimum: 500
          maximum: 10000
          default: 3000
          description: >-
            The maximum time in milliseconds to wait before ending the turn. Applies when `type` is
            `semantic`.
        pause_state_enabled:
          type: boolean
          default: true
          description: >-
            Whether the agent detects a pause within an utterance, such as "hold on", and waits for
            more input. Applies when `type` is `semantic`.
    Interruption:
      type: object
      required:
        - mode
      description: >-
        How the user can interrupt the agent while it speaks or thinks. If you omit it, any user
        speech interrupts the agent.
      properties:
        mode:
          type: string
          enum:
            - start_of_speech
            - keywords
            - "off"
          description: |-
            The interruption mode:

            - `start_of_speech`: Any user speech interrupts the agent.
            - `keywords`: Only the phrases in `keywords` interrupt the agent.
            - `off`: The user can't interrupt the agent. Set `when_off` to choose what happens to
              the user's speech.
        keywords:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: string
            minLength: 1
          description: >-
            The phrases that interrupt the agent, 1 to 128 non-empty strings. Required when `mode`
            is `keywords`.
        when_off:
          type: string
          enum:
            - append
            - ignore
          default: append
          description: |-
            What happens to user speech that arrives while the agent speaks or thinks. Applies when
            `mode` is `off`.

            - `append`: The agent responds to the speech after the current reply.
            - `ignore`: The agent discards the speech.
    TurnDetection:
      type: object
      description: How the agent detects when the user starts and stops speaking, and handles interruptions.
      properties:
        speech_threshold:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          default: 0.5
          description: >-
            The speech detection threshold. Lower values detect speech more easily. Higher values
            ignore weak speech.
        start_of_speech:
          $ref: "#/components/schemas/StartOfSpeech"
        end_of_speech:
          $ref: "#/components/schemas/EndOfSpeech"
        interruption:
          $ref: "#/components/schemas/Interruption"
    SilenceConfig:
      type: object
      required:
        - enabled
        - timeout_ms
        - action
        - content
      description: >-
        What the agent does after a period of silence. This only prompts the user. To hang up a
        phone call after silence, use `call_policy.max_silence_duration_ms`.
      properties:
        enabled:
          type: boolean
          description: Whether to act on silence.
        timeout_ms:
          type: integer
          description: How long the silence lasts, in milliseconds, before the agent acts.
        action:
          type: string
          enum:
            - speak
            - think
          description: |-
            What the agent does when the timeout is reached:

            - `speak`: Speaks `content` as written.
            - `think`: Gives `content` to the LLM as an instruction, and responds to it.
        content:
          type: string
          description: The text to speak, or the instruction for the LLM, depending on `action`.
    Pipeline:
      type: object
      required:
        - mode
      description: >-
        The models that power the agent: separate ASR, LLM, and TTS stages. If you omit the
        pipeline, the platform selects a managed pipeline when a session starts.
      properties:
        mode:
          type: string
          const: cascaded
          description: "`cascaded`: Separate ASR, LLM, and TTS stages."
        asr:
          $ref: "#/components/schemas/AsrConfig"
        llm:
          $ref: "#/components/schemas/LlmConfig"
        tts:
          $ref: "#/components/schemas/TtsConfig"
        turn_detection:
          $ref: "#/components/schemas/TurnDetection"
        silence_config:
          $ref: "#/components/schemas/SilenceConfig"
        avatar:
          $ref: "#/components/schemas/AvatarConfig"
    AgentName:
      type: string
      minLength: 1
      description: A name for the agent. It doesn't need to be unique.
    Instructions:
      type: string
      description: >-
        The system instructions that define how the agent behaves. The model receives them as the
        first `system` message, before `messages`.
    Messages:
      type: array
      items:
        $ref: "#/components/schemas/Message"
      description: Messages that start the conversation history. They follow `instructions`.
    AgentCreate:
      type: object
      required:
        - agent_name
      properties:
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        variables:
          $ref: "#/components/schemas/Variables"
        greeting:
          $ref: "#/components/schemas/Greeting"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        filler_words:
          $ref: "#/components/schemas/FillerWords"
    EphemeralAgent:
      type: object
      description: >-
        The agent configuration for this session. It has the same fields as
        [Create an agent](/en/api-reference/api-ref/conversational-ai/platform/create-agent), except
        `agent_name`. The configuration isn't saved.
      properties:
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        variables:
          $ref: "#/components/schemas/Variables"
        greeting:
          $ref: "#/components/schemas/Greeting"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        filler_words:
          $ref: "#/components/schemas/FillerWords"
    AgentUpdate:
      type: object
      description: >-
        The fields to change, as a JSON merge patch. Fields you omit keep their saved values.
      properties:
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        variables:
          type: object
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/VariableDefinition"
              - type: "null"
          description: >-
            Changes to the variables, keyed by variable name. Each definition you pass replaces the
            saved definition as a whole. Set a variable to `null` to remove it.
        greeting:
          type: object
          additionalProperties: true
          description: >-
            Changes to the greeting. Pass any of the `greeting` fields of [Create an
            agent](/en/api-reference/api-ref/conversational-ai/platform/create-agent). Set it to `null`
            to remove the greeting.
        pipeline:
          type: object
          additionalProperties: true
          description: >-
            Changes to the pipeline. Pass any of the `pipeline` fields of [Create an
            agent](/en/api-reference/api-ref/conversational-ai/platform/create-agent). Nested objects
            merge field by field.
        filler_words:
          type: object
          additionalProperties: true
          description: >-
            Changes to the filler words. Pass any of the `filler_words` fields of [Create an
            agent](/en/api-reference/api-ref/conversational-ai/platform/create-agent).
    Agent:
      type: object
      required:
        - agent_id
        - agent_name
        - create_ts
        - update_ts
      properties:
        agent_id:
          type: string
          description: The ID of the agent, with the prefix `agent_`.
        agent_name:
          $ref: "#/components/schemas/AgentName"
        instructions:
          $ref: "#/components/schemas/Instructions"
        messages:
          $ref: "#/components/schemas/Messages"
        variables:
          $ref: "#/components/schemas/Variables"
        greeting:
          $ref: "#/components/schemas/Greeting"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        filler_words:
          $ref: "#/components/schemas/FillerWords"
        create_ts:
          type: integer
          description: The time the agent was created, as a Unix timestamp in seconds.
        update_ts:
          type: integer
          description: The time the agent was last updated, as a Unix timestamp in seconds.
    AgentList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of agents on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/Agent"
                  description: The agents on this page.
        - $ref: "#/components/schemas/ListPageInfo"

    # ---------------------------------------------------------------------------------------------
    # Sessions
    # ---------------------------------------------------------------------------------------------
    RtcEncryption:
      type: object
      required:
        - mode
        - key
      writeOnly: true
      description: Media encryption for the RTC channel. These values are never returned.
      properties:
        mode:
          type: string
          enum:
            - aes_128_xts
            - aes_128_ecb
            - aes_256_xts
            - sm4_128_ecb
            - aes_128_gcm
            - aes_256_gcm
            - aes_128_gcm2
            - aes_256_gcm2
          description: >-
            The encryption mode. Agora recommends `aes_128_gcm2` or `aes_256_gcm2`, which use a
            salt.
        key:
          type: string
          minLength: 1
          writeOnly: true
          description: The encryption key.
        salt:
          type: string
          writeOnly: true
          description: >-
            A Base64-encoded salt that is 32 bytes long after decoding. Required when `mode` is
            `aes_128_gcm2` or `aes_256_gcm2`.
    EndCallPolicy:
      type: object
      description: >-
        Conditions under which the agent can end the call itself. Every condition is off unless you
        set it to `true`.
      properties:
        on_conversation_complete:
          type: boolean
          default: false
          description: End the call when the conversation has clearly concluded.
        on_user_request:
          type: boolean
          default: false
          description: End the call when the caller asks to hang up.
        on_fax:
          type: boolean
          default: false
          description: End the call when a fax machine is on the other end.
        on_ai_assistant:
          type: boolean
          default: false
          description: >-
            End the call when another AI assistant or automated screening system is on the other
            end.
    TransferPolicy:
      type: object
      required:
        - phone_number
        - description
      description: >-
        Lets the agent transfer the call to a person. The agent decides when to transfer based on
        `description`, and then leaves the call. Omit it to turn off transfers.
      properties:
        phone_number:
          type: string
          description: The phone number to transfer to, in E.164 format.
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            When the agent should transfer, in natural language, for example "when the caller asks
            for a human". 1 to 1,000 characters.
    CallPolicy:
      type: object
      description: >-
        Limits and behavior for outbound phone calls. Each limit you omit adds no limit.
      properties:
        max_ring_duration_ms:
          type: integer
          minimum: 1
          description: >-
            The maximum time in milliseconds from starting the dial until the call is answered. If
            the call isn't answered in time, the dial attempt ends.
        max_call_duration_seconds:
          type: integer
          minimum: 1
          description: >-
            The maximum length of the call in seconds, measured from when it's answered. The
            session's `lifecycle` limits can end the call earlier.
        max_silence_duration_ms:
          type: integer
          minimum: 1
          description: >-
            Hang up when nobody on the call has spoken for this many milliseconds. This is separate
            from `pipeline.silence_config`, which only prompts the user.
        voicemail:
          type: object
          required:
            - mode
          description: What the agent does when it detects voicemail.
          properties:
            mode:
              type: string
              enum:
                - continue
                - hangup
              description: |-
                The voicemail behavior:

                - `continue`: The agent continues the call.
                - `hangup`: The agent ends the call.
        end_call:
          $ref: "#/components/schemas/EndCallPolicy"
        transfer:
          $ref: "#/components/schemas/TransferPolicy"
    RtcTransport:
      type: object
      title: RTC
      required:
        - type
        - channel
        - uid
        - subscribe_uids
      description: Joins the agent to an RTC channel.
      properties:
        type:
          type: string
          const: rtc
          description: "`rtc`: The agent joins an RTC channel."
        channel:
          type: string
          description: The name of the RTC channel to join.
        token:
          type: string
          writeOnly: true
          description: >-
            The RTC token the agent uses to join the channel. Required when the project has an App
            Certificate enabled. To renew it, [update the
            session](/en/api-reference/api-ref/conversational-ai/platform/update-session).
        uid:
          type: string
          description: >-
            The user ID the agent uses in the channel. Pass numeric user IDs as strings, for
            example `"1002"`.
        subscribe_uids:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
          description: >-
            The user ID of the participant the agent talks to. Pass exactly one user ID.
        audio_scenario:
          type: string
          enum:
            - aiserver
            - chorus
          default: aiserver
          description: |-
            The audio scenario of the agent in the channel:

            - `aiserver`: Optimized for latency and network resilience in conversations with an
              agent.
            - `chorus`: For participants with good network conditions who need ultra-low latency.
        encryption:
          $ref: "#/components/schemas/RtcEncryption"
    TelephonyTransport:
      type: object
      title: Telephony
      required:
        - type
        - from
        - to
      description: Places an outbound phone call from a number registered in the project.
      properties:
        type:
          type: string
          const: telephony
          description: "`telephony`: The agent places a phone call."
        from:
          type: string
          description: >-
            The number to call from: the `number_id` of a number in the project, or the number
            itself in E.164 format.
        to:
          type: string
          description: The phone number to call, in E.164 format, for example `+14155550100`.
        call_policy:
          $ref: "#/components/schemas/CallPolicy"
    SessionTransport:
      description: >-
        How the agent connects to the participant. Pass the fields of one transport type only.
      oneOf:
        - $ref: "#/components/schemas/RtcTransport"
        - $ref: "#/components/schemas/TelephonyTransport"
      discriminator:
        propertyName: type
        mapping:
          rtc: "#/components/schemas/RtcTransport"
          telephony: "#/components/schemas/TelephonyTransport"
    SessionLifecycle:
      type: object
      description: When the session ends on its own.
      properties:
        idle_timeout_ms:
          type: integer
          minimum: 0
          maximum: 259200000
          default: 30000
          description: >-
            How long in milliseconds the session continues with no participant present: after the
            subscribed user leaves the RTC channel, or after the other side of a phone call hangs
            up. It isn't silence detection. Set to `0` to turn off the idle timer. Can't be greater
            than `max_duration_ms`.
        max_duration_ms:
          type: integer
          minimum: 1000
          maximum: 259200000
          default: 259200000
          description: >-
            The maximum length of the session in milliseconds, measured from `start_ts`. Defaults to
            72 hours, which is also the maximum.
        graceful_stop:
          type: object
          description: >-
            How the agent finishes when you stop the session, or when the idle timer expires. It
            doesn't extend `max_duration_ms`, and it doesn't add a farewell message.
          properties:
            enabled:
              type: boolean
              default: false
              description: Whether the agent finishes what it's saying before it leaves.
            timeout_ms:
              type: integer
              minimum: 0
              maximum: 120000
              default: 30000
              description: The longest time in milliseconds the agent can take to finish.
    SessionDataPolicy:
      type: object
      description: >-
        How Agora handles the session's data. You set it when the session starts and can't change it
        afterward.
      properties:
        retention:
          type: string
          enum:
            - 30_days
            - none
          default: 30_days
          description: |-
            How long Agora keeps the conversation data:

            - `30_days`: Agora keeps the data for 30 days.
            - `none`: Agora doesn't keep the data. Variable extraction doesn't run, and the session
              reports `analysis.skip_reason: "retention_none"`. Use it, for example, when a caller
              declines recording.
    SessionValues:
      type: object
      additionalProperties: true
      description: >-
        Values for the agent's variables, keyed by variable name, for this session only. Each key
        must be a variable the agent declares, and each value must match its `type` and `options`.
        Pass a value for every `required` variable. `null` values are rejected.
      example:
        customer_name: Ada
    ClientReference:
      type: string
      maxLength: 256
      description: Your own identifier for the session, such as a ticket ID. It doesn't need to be unique.
    SessionLabels:
      type: object
      additionalProperties:
        type: string
      description: >-
        Key-value labels for this session, such as a team or customer ID. They're included in the
        `payload` of [notification events](/en/ai/reference/event-types).
    SessionStart:
      type: object
      required:
        - agent_id
        - transport
      properties:
        agent_id:
          type: string
          description: The ID of the saved agent to run.
        transport:
          $ref: "#/components/schemas/SessionTransport"
        values:
          $ref: "#/components/schemas/SessionValues"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        data_policy:
          $ref: "#/components/schemas/SessionDataPolicy"
        client_reference:
          $ref: "#/components/schemas/ClientReference"
        labels:
          $ref: "#/components/schemas/SessionLabels"
    EphemeralSessionStart:
      type: object
      required:
        - agent
        - transport
      properties:
        agent:
          $ref: "#/components/schemas/EphemeralAgent"
        transport:
          $ref: "#/components/schemas/SessionTransport"
        values:
          $ref: "#/components/schemas/SessionValues"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        data_policy:
          $ref: "#/components/schemas/SessionDataPolicy"
        client_reference:
          $ref: "#/components/schemas/ClientReference"
        labels:
          $ref: "#/components/schemas/SessionLabels"
    SessionStarted:
      type: object
      required:
        - agent_session_id
        - create_ts
        - status
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        create_ts:
          type: integer
          description: The time the session was created, as a Unix timestamp in seconds.
        status:
          type: string
          enum:
            - STARTING
            - RUNNING
          description: >-
            The status of the session. `RUNNING` means the agent is live. For a phone call, it
            doesn't mean the call was answered.
      # TODO(platform-confirm): Staging (13 Oct) returned 201 with lowercase `running` and `created_at`.
    SessionUpdated:
      type: object
      required:
        - agent_session_id
        - create_ts
        - status
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        create_ts:
          type: integer
          description: The time the session was created, as a Unix timestamp in seconds.
        status:
          $ref: "#/components/schemas/SessionStatus"
    IfBusy:
      description: >-
        What happens if the agent is busy. Pass one policy for every state, or an object with a
        policy for each state:

        - `interrupt`: Cut in now.

        - `queue`: Wait until the current turn finishes.

        - `drop`: Skip the action if the agent isn't idle.
      oneOf:
        - type: string
          title: One policy for every state
          enum:
            - interrupt
            - queue
            - drop
        - type: object
          title: A policy for each state
          properties:
            listening:
              type: string
              enum:
                - interrupt
                - queue
                - drop
              description: The policy while the agent is listening.
            thinking:
              type: string
              enum:
                - interrupt
                - queue
                - drop
              description: The policy while the agent is generating a response.
            speaking:
              type: string
              enum:
                - interrupt
                - queue
                - drop
              description: The policy while the agent is speaking.
    InjectIfBusy:
      description: >-
        What happens if the agent is busy. Pass one policy for every state, or an object with a
        policy for each state. Defaults to `{"listening": "interrupt", "thinking": "interrupt",
        "speaking": "drop"}`.

        - `interrupt`: Cut in now.

        - `queue`: Wait until the current turn finishes.

        - `drop`: Skip the action if the agent isn't idle.

        - `merge`: Add the messages to the current turn without interrupting. Only valid for
        `listening`, in the object form.
      oneOf:
        - type: string
          title: One policy for every state
          enum:
            - interrupt
            - queue
            - drop
        - type: object
          title: A policy for each state
          properties:
            listening:
              type: string
              enum:
                - interrupt
                - queue
                - drop
                - merge
              default: interrupt
              description: The policy while the agent is listening.
            thinking:
              type: string
              enum:
                - interrupt
                - queue
                - drop
              default: interrupt
              description: The policy while the agent is generating a response.
            speaking:
              type: string
              enum:
                - interrupt
                - queue
                - drop
              default: drop
              description: The policy while the agent is speaking.
    SpeakAction:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 2000
          description: What the agent says, up to 2,000 characters.
        if_busy:
          $ref: "#/components/schemas/IfBusy"
          default: interrupt
        interruptible:
          type: boolean
          default: true
          description: Whether user speech can interrupt the line.
    InjectAction:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum:
                  - system
                  - user
                description: |-
                  How the agent treats the message:

                  - `system`: Silent context for the agent.
                  - `user`: As if the user said it.
              content:
                type: string
                description: The text of the message.
          description: The messages to add, in order.
        respond:
          type: boolean
          default: true
          description: >-
            Whether the agent responds to the messages. When `false`, the messages are only added
            to the context.
        if_busy:
          $ref: "#/components/schemas/InjectIfBusy"
        interruptible:
          type: boolean
          default: true
          description: Whether user speech can interrupt the agent's response.
    ActionAccepted:
      type: object
      required:
        - agent_session_id
        - channel
        - start_ts
      description: Confirms that the action was accepted.
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        channel:
          type: string
          description: The RTC channel of the session.
        start_ts:
          type: integer
          description: The time the session started, as a Unix timestamp in seconds.
      example:
        agent_session_id: a42ac95tp25py49fc37hp94vm67ht52h
        channel: support-4821
        start_ts: 1737111460
    SessionUpdate:
      type: object
      properties:
        transport:
          type: object
          required:
            - token
          description: Changes to the transport. Only the RTC token can change.
          properties:
            token:
              type: string
              minLength: 1
              writeOnly: true
              description: >-
                A new RTC token for the agent. Applies only to sessions that started with a token.
        agent:
          type: object
          description: Changes to the running agent.
          properties:
            overrides:
              type: object
              description: Values that replace the running agent's current values.
              properties:
                messages:
                  $ref: "#/components/schemas/Messages"
                  description: >-
                    The conversation messages the agent uses. They replace the current messages.
                pipeline:
                  type: object
                  description: Runtime model parameters.
                  properties:
                    llm:
                      type: object
                      properties:
                        params:
                          type: object
                          additionalProperties: true
                          description: >-
                            Provider-specific LLM parameters. They replace the current `params`
                            object as a whole, so include every parameter that must stay.
    SessionStatus:
      type: string
      enum:
        - IDLE
        - STARTING
        - RUNNING
        - STOPPING
        - STOPPED
        - FAILED
      description: |-
        The status of the session:

        - `IDLE`: The session is idle.
        - `STARTING`: The session is starting.
        - `RUNNING`: The session is running.
        - `STOPPING`: The session is stopping.
        - `STOPPED`: The session has ended.
        - `FAILED`: The session failed.
    SessionAnalysis:
      type: object
      description: >-
        The values extracted after the session ends, for the agent's variables with `extract: true`.
      properties:
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - skipped
          description: |-
            The status of the extraction:

            - `pending`: The session hasn't ended, or extraction hasn't finished.
            - `completed`: Extraction finished. The values are in `result`.
            - `failed`: Extraction failed. The reason is in `error`.
            - `skipped`: Extraction didn't run. The reason is in `skip_reason`.
        skip_reason:
          type:
            - string
            - "null"
          enum:
            - no_user_turns
            - retention_none
            - null
          description: |-
            Why extraction was skipped. `null` unless `status` is `skipped`.

            - `no_user_turns`: The user didn't speak during the session.
            - `retention_none`: The session's `data_policy.retention` is `none`.
        complete_ts:
          type:
            - integer
            - "null"
          description: >-
            The time extraction finished, as a Unix timestamp in seconds. `null` while it's
            pending.
        result:
          type:
            - object
            - "null"
          additionalProperties:
            type:
              - string
              - number
              - boolean
              - "null"
          description: >-
            The extracted values, keyed by variable name. A value the transcript doesn't establish
            is `null`. The whole object is `null` until `status` is `completed`.
        error:
          type:
            - string
            - "null"
          description: Why extraction failed. `null` unless `status` is `failed`.
    Session:
      type: object
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        agent_name:
          type: string
          description: The name of the agent that the session runs.
        status:
          $ref: "#/components/schemas/SessionStatus"
        start_ts:
          type: integer
          description: The time the session was created, as a Unix timestamp in seconds.
        stop_ts:
          type:
            - integer
            - "null"
          description: >-
            The time the session ended, as a Unix timestamp in seconds. `null` while the session is
            active.
        message:
          type:
            - string
            - "null"
          description: >-
            Additional details about the status, such as a failure diagnosis. `null` when there are
            none.
        analysis:
          oneOf:
            - $ref: "#/components/schemas/SessionAnalysis"
            - type: "null"
          description: >-
            The values extracted for the agent's variables with `extract: true`. `null` when the
            agent declares no extract variables.
      # TODO(platform-confirm): On staging, `agent_name` returned the engine's task name
      # (`session-...` or `ephemeral-...`), not the agent's name.
    SessionSummary:
      type: object
      properties:
        agent_session_id:
          type: string
          description: The ID of the session.
        status:
          $ref: "#/components/schemas/SessionStatus"
        start_ts:
          type: integer
          description: The time the session was created, as a Unix timestamp in seconds.
    SessionList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of sessions on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/SessionSummary"
                  description: The sessions on this page.
        - $ref: "#/components/schemas/ListPageInfo"

    # ---------------------------------------------------------------------------------------------
    # Secrets
    # ---------------------------------------------------------------------------------------------
    SecretValues:
      type: object
      minProperties: 1
      propertyNames:
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      additionalProperties:
        type: string
        format: password
        writeOnly: true
      description: >-
        The secrets, as key-value pairs. Each key is 1 to 64 characters from `A-Z`, `a-z`, `0-9`,
        `_`, and `-`, and must be unique within the set. Values are write-only and are never
        returned.
    SecretSetCreate:
      type: object
      required:
        - name
        - secrets
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            A name for the secret set, unique in the project. Use 1 to 64 characters from `A-Z`,
            `a-z`, `0-9`, `_`, and `-`. Names are case-sensitive.
        secrets:
          $ref: "#/components/schemas/SecretValues"
    SecretSetReplace:
      type: object
      required:
        - secrets
      properties:
        secrets:
          $ref: "#/components/schemas/SecretValues"
    SecretSetUpdate:
      type: object
      required:
        - secrets
      properties:
        secrets:
          type: object
          minProperties: 1
          propertyNames:
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
          additionalProperties:
            type:
              - string
              - "null"
            format: password
            writeOnly: true
          description: >-
            The keys to change. A string value adds the key, or replaces its value if the key
            exists. A `null` value removes the key. Keys you omit don't change.
    SecretKey:
      type: object
      required:
        - key
        - create_ts
        - update_ts
      properties:
        key:
          type: string
          description: The name of the key.
        create_ts:
          type: integer
          description: The time the key was added, as a Unix timestamp in seconds.
        update_ts:
          type: integer
          description: The time the key's value last changed, as a Unix timestamp in seconds.
    SecretSet:
      type: object
      required:
        - name
        - keys
        - create_ts
        - update_ts
      properties:
        name:
          type: string
          description: The name of the secret set.
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SecretKey"
          description: The keys in the set. Values are never returned.
        create_ts:
          type: integer
          description: The time the set was created, as a Unix timestamp in seconds.
        update_ts:
          type: integer
          description: The time the set was last updated, as a Unix timestamp in seconds.
      # TODO(platform-confirm): Staging (10 Oct) returned `keys` as a list of names and Set Key as
      # `{key}` only. The contract returns key objects with timestamps.
    SecretSetList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of secret sets on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/SecretSet"
                  description: The secret sets on this page.
        - $ref: "#/components/schemas/ListPageInfo"
    SecretKeyWrite:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: The secret value. It is write-only and is never returned.

    # ---------------------------------------------------------------------------------------------
    # Phone numbers
    # ---------------------------------------------------------------------------------------------
    SipAuth:
      type: object
      required:
        - username
        - password
      writeOnly: true
      description: >-
        The credentials for your SIP trunk. They are write-only and are never returned.
      properties:
        username:
          type: string
          writeOnly: true
          description: The SIP username.
        password:
          type: string
          writeOnly: true
          description: >-
            The SIP password, as a reference to a secret set, for example
            `$secrets.support-prod.sip_password`.
    SipTrunk:
      type: object
      required:
        - hostname
      description: The carrier connection for this number.
      properties:
        name:
          type: string
          description: A name for the carrier connection that helps you identify it.
        hostname:
          type: string
          description: >-
            The carrier's SIP hostname, without a scheme or port. For example,
            `acme.pstn.example.com`.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: >-
            The SIP signaling port. Defaults to `5061` when `transport` is `tls`, and `5060` when
            it's `udp` or `tcp`.
        transport:
          type: string
          enum:
            - udp
            - tcp
            - tls
          default: tls
          description: The transport protocol for the carrier connection.
        auth:
          $ref: "#/components/schemas/SipAuth"
        allowed_ips:
          type: array
          items:
            type: string
          description: >-
            The CIDR ranges allowed to send inbound SIP traffic, for example `54.172.60.0/23`. Omit
            it to accept the carrier's published ranges.
    SipTrunkResponse:
      type: object
      properties:
        name:
          type: string
          description: The name of the carrier connection.
        hostname:
          type: string
          description: The carrier's SIP hostname.
        port:
          type: integer
          description: The SIP signaling port.
        transport:
          type: string
          enum:
            - udp
            - tcp
            - tls
          description: The transport protocol for the carrier connection.
        allowed_ips:
          type: array
          items:
            type: string
          description: The CIDR ranges allowed to send inbound SIP traffic.
    InboundCallPolicy:
      type: object
      description: >-
        Limits and behavior for inbound calls to this number. Each limit you omit adds no limit.
      properties:
        max_call_duration_seconds:
          type: integer
          minimum: 1
          description: The maximum length of a call in seconds, measured from when it's answered.
        max_silence_duration_ms:
          type: integer
          minimum: 1
          description: >-
            Hang up when nobody on the call has spoken for this many milliseconds.
        end_call:
          $ref: "#/components/schemas/EndCallPolicy"
        transfer:
          $ref: "#/components/schemas/TransferPolicy"
    Inbound:
      type: object
      required:
        - agent
      description: >-
        What happens when someone calls this number. If you omit it, inbound calls are rejected.
      properties:
        agent:
          type:
            - string
            - "null"
          description: >-
            The ID of the agent that answers inbound calls. Set to `null` to reject inbound calls.
        call_policy:
          $ref: "#/components/schemas/InboundCallPolicy"
    NumberDescription:
      type: string
      description: >-
        A description of the number's purpose. It's separate from `sip_trunk.name`, which names the
        carrier connection.
    NumberCreate:
      type: object
      required:
        - number
        - sip_trunk
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 128
          description: The phone number in E.164 format, for example `+14155550100`.
        description:
          $ref: "#/components/schemas/NumberDescription"
        sip_trunk:
          $ref: "#/components/schemas/SipTrunk"
        inbound:
          $ref: "#/components/schemas/Inbound"
    NumberUpdate:
      type: object
      description: The fields to change. Fields you omit keep their saved values.
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The phone number in a different format. You can reformat the number, but you can't
            change it to a different number.
        description:
          $ref: "#/components/schemas/NumberDescription"
        sip_trunk:
          $ref: "#/components/schemas/SipTrunk"
        inbound:
          $ref: "#/components/schemas/Inbound"
      # TODO(platform-confirm): Whether `sip_trunk` in a patch merges or replaces (for example, whether
      # omitting `auth` clears the saved credentials).
    Number:
      type: object
      properties:
        number_id:
          type: string
          description: The ID of the phone number, with the prefix `num_`.
        number:
          type: string
          description: The phone number in E.164 format.
        description:
          $ref: "#/components/schemas/NumberDescription"
        sip_trunk:
          $ref: "#/components/schemas/SipTrunkResponse"
        inbound:
          $ref: "#/components/schemas/Inbound"
        create_ts:
          type: integer
          description: The time the number was added, as a Unix timestamp in seconds.
    NumberList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of phone numbers on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/Number"
                  description: The phone numbers on this page.
        - $ref: "#/components/schemas/ListPageInfo"

    # ---------------------------------------------------------------------------------------------
    # Campaigns
    # ---------------------------------------------------------------------------------------------
    CampaignTransport:
      type: object
      required:
        - type
        - from
      description: How the campaign reaches its contacts.
      properties:
        type:
          type: string
          const: telephony
          description: "`telephony`: The campaign places phone calls."
        from:
          oneOf:
            - type: string
              title: One number
            - type: array
              title: Several numbers
              minItems: 1
              items:
                type: string
          description: >-
            The `number_id` of the number to call from, or a list of `number_id` values. With a
            list, the campaign rotates across the numbers.
        call_policy:
          $ref: "#/components/schemas/CallPolicy"
    CampaignContact:
      type: object
      required:
        - phone
      description: One contact to call. Each contact is a separate dial task.
      properties:
        phone:
          type: string
          description: The phone number to call, in E.164 format, for example `+12025550123`.
        values:
          type: object
          additionalProperties: true
          description: >-
            Values for the agent's variables for this contact, keyed by variable name. Pass a value
            for every `required` variable, or the contact is rejected before it's dialed. `null`
            values are rejected.
    CampaignPacing:
      type: object
      description: How fast the campaign dials, and how many times it retries.
      properties:
        max_concurrent:
          type: integer
          default: 10
          description: The maximum number of calls in progress at the same time.
        max_calls_per_second:
          type: integer
          minimum: 1
          description: >-
            The maximum number of new dials in any one-second window. Omit it to dial as fast as
            `max_concurrent` and the project's carrier limits allow. A value above the project's
            limit is rejected with `InvalidFieldValue`.
        max_attempts:
          type: integer
          default: 3
          description: The number of attempts for each contact before it's marked `failed`.
        retry_backoff_ms:
          type: integer
          default: 600000
          description: How long in milliseconds to wait between attempts to the same contact.
    CampaignScheduleWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          description: The start of the window, as a local time in 24-hour `HH:MM` format.
        end:
          type: string
          description: >-
            The end of the window, as a local time in `HH:MM` format, later than `start`. Use
            `24:00` for the end of the day.
    CampaignScheduleDay:
      type: object
      required:
        - weekday
        - ranges
      properties:
        weekday:
          type: string
          enum:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          description: The day of the week. Each day can appear only once.
        ranges:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/CampaignScheduleWindow"
          description: One to 10 windows on this day, which can't overlap.
    CampaignSchedule:
      type: object
      required:
        - mode
      description: >-
        When the campaign dials. A local time that doesn't exist because of a daylight saving
        change moves forward to the next valid time. A repeated local time uses its first
        occurrence.
      properties:
        mode:
          type: string
          enum:
            - immediate
            - scheduled
          description: |-
            When the campaign starts:

            - `immediate`: The campaign starts dialing as soon as it's created. Don't pass `start`
              or `end`.
            - `scheduled`: The campaign dials from `start` until `end`.
        timezone:
          type: string
          description: >-
            The IANA time zone for `start`, `end`, and `days`, for example `America/New_York`.
            Daylight saving time is handled automatically. Required when `mode` is `scheduled` or
            when you pass `days`.
        start:
          type: string
          description: >-
            When the campaign can start dialing, as a local date and time in `YYYY-MM-DDTHH:MM`
            format with no offset, for example `2026-11-02T09:00`. Required when `mode` is
            `scheduled`.
        end:
          type: string
          description: >-
            When the campaign stops placing new calls, as a local date and time in
            `YYYY-MM-DDTHH:MM` format, later than `start`. Calls in progress continue. Required
            when `mode` is `scheduled`.
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/CampaignScheduleDay"
          description: >-
            The weekly hours when new calls can start. Outside these hours, no new calls start and
            retries wait for the next window. A day you don't list has no dialing. Omit `days` to
            dial at any time.
    CampaignCreate:
      type: object
      required:
        - name
        - agent_id
        - transport
        - contacts
        - schedule
      properties:
        name:
          type: string
          description: A name for the campaign that helps you identify it.
        agent_id:
          type: string
          description: The ID of the saved agent that makes the calls.
        transport:
          $ref: "#/components/schemas/CampaignTransport"
        contacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CampaignContact"
          description: >-
            The contacts to call. Pass at least one. You can't change the list after you create the
            campaign. A phone number that appears more than once is called once for each entry.
        schedule:
          $ref: "#/components/schemas/CampaignSchedule"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
          description: >-
            The lifecycle settings for each session the campaign starts. See [Start a
            session](/en/api-reference/api-ref/conversational-ai/platform/start-session) for the fields
            and limits.
        pacing:
          $ref: "#/components/schemas/CampaignPacing"
    CampaignUpdate:
      type: object
      description: >-
        The fields to change. Before the campaign starts dialing, you can change `pacing`,
        `schedule`, `lifecycle`, and `transport.call_policy`. After it starts, you can change only
        `pacing`.
      properties:
        pacing:
          type: object
          description: >-
            Changes to the pacing. Pass any of the `pacing` fields of [Create a
            campaign](/en/api-reference/api-ref/conversational-ai/platform/create-campaign). Fields you
            omit keep their saved values.
          properties:
            max_concurrent:
              type: integer
              description: The maximum number of calls in progress at the same time.
            max_calls_per_second:
              type: integer
              minimum: 1
              description: The maximum number of new dials in any one-second window.
            max_attempts:
              type: integer
              description: The number of attempts for each contact before it's marked `failed`.
            retry_backoff_ms:
              type: integer
              description: How long in milliseconds to wait between attempts to the same contact.
        schedule:
          $ref: "#/components/schemas/CampaignSchedule"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
          description: >-
            The lifecycle settings for each session the campaign starts. They replace the saved
            settings, and fields you omit use their defaults.
        transport:
          type: object
          description: The transport settings that can change. You can't change `type` or `from`.
          properties:
            call_policy:
              $ref: "#/components/schemas/CallPolicy"
    CampaignStatus:
      type: string
      enum:
        - scheduled
        - running
        - paused
        - completed
        - canceled
        - failed
      description: |-
        The status of the campaign:

        - `scheduled`: The campaign is waiting for its start time.
        - `running`: The campaign is dialing, or can dial during its schedule.
        - `paused`: You paused the campaign.
        - `completed`: The campaign has finished.
        - `canceled`: You canceled the campaign.
        - `failed`: The campaign failed. The details are in `failure`.
    CampaignCounts:
      type: object
      description: The number of contacts in each state. Retrieve the campaign to get current counts.
      properties:
        contacts:
          type: integer
          description: The total number of contacts.
        pending:
          type: integer
          description: Contacts not called yet, or waiting for a retry.
        calling:
          type: integer
          description: Contacts in a call now.
        completed:
          type: integer
          description: Contacts whose call has finished.
        failed:
          type: integer
          description: Contacts not reached after all attempts.
        canceled:
          type: integer
          description: Contacts that won't be called because the campaign was canceled.
    Campaign:
      type: object
      properties:
        campaign_id:
          type: string
          description: The ID of the campaign, with the prefix `camp_`.
        name:
          type: string
          description: The name of the campaign.
        status:
          $ref: "#/components/schemas/CampaignStatus"
        agent_id:
          type: string
          description: The ID of the agent that makes the calls.
        transport:
          type: object
          properties:
            type:
              type: string
              const: telephony
              description: Always `telephony`.
            from:
              type: array
              items:
                type: string
              description: The `number_id` values of the numbers the campaign calls from.
            call_policy:
              $ref: "#/components/schemas/CallPolicy"
        lifecycle:
          $ref: "#/components/schemas/SessionLifecycle"
        schedule:
          $ref: "#/components/schemas/CampaignSchedule"
        counts:
          $ref: "#/components/schemas/CampaignCounts"
        create_ts:
          type: integer
          description: The time the campaign was created, as a Unix timestamp in seconds.
        start_ts:
          type:
            - integer
            - "null"
          description: >-
            The time the campaign started dialing, as a Unix timestamp in seconds. `null` before it
            starts.
        complete_ts:
          type:
            - integer
            - "null"
          description: >-
            The time the campaign finished, as a Unix timestamp in seconds. `null` until it
            finishes.
        failure:
          oneOf:
            - $ref: "#/components/schemas/Failure"
            - type: "null"
          description: Details of the failure when `status` is `failed`. Otherwise `null`.
    CampaignList:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of campaigns on this page.
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/Campaign"
                  description: The campaigns on this page.
        - $ref: "#/components/schemas/ListPageInfo"

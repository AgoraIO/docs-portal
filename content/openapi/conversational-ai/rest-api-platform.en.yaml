        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Campaigns
      summary: Update a campaign
      description: Changes the pacing, schedule, or dialing limits of a campaign.
      operationId: update-campaign
      x-docs-sections:
        - position: after-description
          markdown: >-
            Before the campaign starts dialing, you can change `pacing`, `schedule`, `lifecycle`,
            and `transport.call_policy`. After it starts, you can change only `pacing`, and other
            fields fail with `CampaignNotEditable`. After the campaign is `completed`, `canceled`,
            or `failed`, you can't change it. You can never change `agent_id`,
            `transport.type`, `transport.from`, or `contacts`.
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:

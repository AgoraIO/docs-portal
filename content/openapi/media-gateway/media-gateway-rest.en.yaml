openapi: 3.1.0
info:
  title: Media Gateway REST API Reference
  version: ""
  description: >-
    RESTful APIs for creating streaming keys, managing live ingress sessions,
    templates, and notification IP ranges.
paths:
  /{region}/v1/projects/{appId}/rtls/ingress/streamkeys:
    post:
      summary: Create streaming key
      description: Create a streaming key for a channel and host UID.
      operationId: create-streaming-key
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamingKeyRequest"
      responses:
        "200":
          description: Streaming key created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /{region}/v1/projects/{appId}/rtls/ingress/streamkeys/{streamkey}:
    get:
      summary: Query streaming key
      description: Query metadata for a streaming key.
      operationId: query-streaming-key
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/streamkey"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Streaming key returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
    delete:
      summary: Delete streaming key
      description: Delete a streaming key.
      operationId: delete-streaming-key
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/streamkey"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Streaming key deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /{region}/v1/projects/{appId}/rtls/ingress/online-streams:
    get:
      summary: Query streaming list
      description: Query the list of online ingress streams.
      operationId: query-streaming-list
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
        - name: channel
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Streaming list returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /{region}/v1/projects/{appId}/rtls/ingress/online-streams/{sid}:
    get:
      summary: Query streaming information
      description: Query an online stream by SID.
      operationId: query-streaming-information
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/sid"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Streaming information returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
    delete:
      summary: Force disconnect
      description: Disconnect an online stream by SID.
      operationId: force-disconnection
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/sid"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Stream disconnected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /{region}/v1/projects/{appId}/rtls/ingress/stream-templates/{templateId}:
    put:
      summary: Create or reset template
      description: Create a new flow configuration template or reset an existing one.
      operationId: create-reset-template
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/templateId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRequest"
      responses:
        "200":
          description: Template created or reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
    patch:
      summary: Update template
      description: Update an existing flow configuration template.
      operationId: update-template
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/templateId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRequest"
      responses:
        "200":
          description: Template updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
    delete:
      summary: Delete template
      description: Delete a flow configuration template.
      operationId: delete-template
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/templateId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Template deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /{region}/v1/projects/{appId}/rtls/ingress/appconfig:
    put:
      summary: Set global template
      description: Set the default flow configuration template for an App ID.
      operationId: set-global-template
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - defaultStreamTemplate
              properties:
                defaultStreamTemplate:
                  type: string
      responses:
        "200":
          description: Global template set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /{region}/v1/projects/{appId}/rtls/ingress/notifications/ip:
    get:
      summary: Query notification service IP address
      description: Query the IP ranges used by the notification service.
      operationId: query-ip-address
      parameters:
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/Authorization"
      responses:
        "200":
          description: Notification service IP ranges returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /{region}/{version}/projects/{appId}/rtls/ingress/online-streams/mute/{sid}:
    post:
      summary: Mute or unmute streaming
      description: Mute or unmute audio and video on an online stream.
      operationId: mute-streaming
      parameters:
        - $ref: "#/components/parameters/region"
        - name: version
          in: path
          required: true
          schema:
            type: string
            default: v1
        - $ref: "#/components/parameters/appId"
        - $ref: "#/components/parameters/sid"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - videoMuted
                - audioMuted
              properties:
                videoMuted:
                  type: boolean
                audioMuted:
                  type: boolean
      responses:
        "200":
          description: Mute state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
components:
  parameters:
    region:
      name: region
      in: path
      required: true
      schema:
        type: string
    appId:
      name: appId
      in: path
      required: true
      schema:
        type: string
    streamkey:
      name: streamkey
      in: path
      required: true
      schema:
        type: string
    sid:
      name: sid
      in: path
      required: true
      schema:
        type: string
    templateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      schema:
        type: string
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    StreamingKeyRequest:
      type: object
      required:
        - channel
        - expiresAfter
      properties:
        channel:
          type: string
        uid:
          type: string
        expiresAfter:
          type: integer
        streamType:
          type: string
        metadata:
          type: object
          additionalProperties: true
    TemplateRequest:
      type: object
      additionalProperties: true

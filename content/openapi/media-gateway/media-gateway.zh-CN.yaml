        markdown: '查询消息通知服务器的 IP 地址或 IP 地址列表。


          **背景**：开通消息通知服务后，声网消息通知服务可以将云端转码业务中的发生的一些事件以 HTTPS 请求的方式通知到你的服务器。声网会动态调整消息通知服务器的 IP 地址，周期为 24 小时。


          **用法**：你可以通过本方法查询 IP 地址。查询后，你需要将 IP 地址（或 IP 地址列表）添加到白名单中。'

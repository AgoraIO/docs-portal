openapi: 3.1.0
info:
  version: ''
  title: RTMP 网关 RESTful API
  summary: ''
  description: "RTMP 网关服务能够把使用标准推流协议（RTMP 和 SRT）的媒体流推送到声网 SD-RTN™，并以主播身份将这些内容发布到对应的频道内。RTMP 网关服务包含以下三套 API：\n1. **推流码 API**\n\n    开始推流前，你需要先创建推流码，它能够确保媒体流被推送到正确的频道与主播 uid 下。这套 RESTful API 可供你创建、查询和删除推流码。\n2. **流配置模板 API**\n\n    在使用 RTMP 网关推流进频道时，你可以自行控制网关将流推送到频道之前的处理，比如开启音频或视频转码，并指定相应的转码参数。同时，一个流配置模板，既可以用于所属 App ID 的全局配置，也可以只关联到指定的推流码。你可以使用这套 RESTful API 来创建、查询和删除流配置模板。\n3. **查询在推流信息 API**\n\n    你可以使用这套 RESTful API 来查询指定 App ID 下当前正在推送到 RTMP 网关的流列表信息，包括使用的推流域名、推流码和音视频流的基础参数（分辨率、码率、声道数、采样率、GOP 等信息），也可以强制断开正在推送的流。\n\n> 请确保声网频道的场景为直播，而非通信，否则 RTMP 网关服务会失败。有关直播与通信场景的信息，请参考[设置频道场景](/zh-CN/api-reference/rtc/android/channel#api_irtcengine_setchannelprofile)。\n为方便你监听 RTMP 网关的状态，声网提供[消息通知服务](/zh-CN/realtime-media/rtmp-gateway/build/monitor-events/enable-ncs)。开通该服务后，你可以通过 Webhook 接收相关的[事件回调](/zh-CN/realtime-media/rtmp-gateway/reference/ncs-events)。\n\n因为声网会动态调整消息通知服务器的 IP 地址，为了不影响你接收事件，你需要定期[查询 IP 地址](/zh-CN/api-reference/api-ref/rtmp-gateway/query-ip-address)并更新防火墙白名单配置。"
servers:
- url: https://api.sd-rtn.com/
paths:
  /{region}/v1/projects/{appId}/rtls/ingress/streamkeys:
    post:
      tags:
      - 推流码
      summary: 创建推流码
      description: 创建用于将媒体流推送到指定频道和主播 UID 的推流码。
      operationId: post-region-v1-projects-appId-rtls-ingress-streamkeys
      parameters:
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/appId'
      requestBody:
        description: 请求包体为 JSON Object 类型的 `settings` 字段。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/settings'
            examples:
              Example 1:
                value:
                  settings:
                    channel: shx001
                    uid: '1001'
                    expiresAfter: 0
      responses:
        2XX:
          $ref: '#/components/responses/success'
        default:
          $ref: '#/components/responses/failure'
      servers:
      - url: https://api.sd-rtn.com/
      security:
      - Basic Auth: []
      - API Key: []
      x-docs-sections:
      - position: after-description
        markdown: '该接口创建一个推流码。


          推流码也叫推流密钥，能够确保媒体流被推送到正确的频道与主播 uid 下。在开启推流前，你需要先创建推流码。'
      x-docs-callouts:
      - type: warning
        title: 注意
        position: after-description
        markdown: 请合理保管已创建的推流码，不要暴露，否则任何人都可以凭借该推流码推流到频道内。
    get:
      tags:
      - 推流码
      summary: 列出指定 App ID 下所有推流码
      description: 分页列出指定 App ID 下的推流码。
      operationId: get-region-v1-projects-appId-rtls-ingress-streamkeys-limit-cursor
      parameters:
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - $ref: '#/components/parameters/appId'
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        default:
          description: 如果状态码不为 `2XX`，则请求失败。你可以参考[响应状态码](/zh-CN/realtime-media/rtmp-gateway/reference/response-code)了解可能的原因。
        2XX:
          description: 如果状态码为 `2XX`，则请求成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: 请求状态，值为 `success`。
                  data:
                    type: object
                    properties:
                      hasMore:
                        type: boolean
                        description: 表示是否有更多数据未返回。如果为 `true`，则需要执行下一次请求。
                      streamKeys:
                        type: array
                        description: 包含本次返回的推流码信息列表。每个数组元素为 Object 型，包含下列字段：
                        items:
                          type: object
                          properties:
                            streamKey:
                              type: string
                              description: 返回的推流码。
                            channel:
                              type: string
                              description: 推流码绑定的声网频道名称。
                            uid:
                              type: string
                              description: 推流码绑定的声网频道内的用户 UID。
                            expiresAfter:
                              type: number
                              description: 推流码的有效时长，从创建时开始计算，单位为秒。
                            createdAt:
                              type: string
                              description: 推流码创建的 Unix 时间戳，单位为秒。
                      cursor:
                        type: string
                        description: '下次查询时的起始位置值。


                          > 请根据 `hasMore` 字段决定是否需要进行下一次查询，而不是仅依据 `cursor` 字段是否为空。'
              examples:
                Example 1:
                  value:
                    status: success
                    data:
                      hasMore: false
                      streamKeys:
                      - streamKey: 2waAf2n****JSXpJQ
                        channel: test001
                        uid: '100'
                        expiresAfter: 0
                        createdAt: '1714297679'
                      cursor: 662e1****72e026
      servers:
      - url: https://api.sd-rtn.com/
      security:
      - Basic Auth: []
      - API Key: []
  /{region}/v1/projects/{appId}/rtls/ingress/streamkeys/{streamkey}:
    get:
      tags:
      - 推流码
      summary: 查询推流码信息
      description: 查询指定推流码绑定的频道、UID 和有效期等信息。
      operationId: get-region-v1-projects-appId-rtls-ingress-streamkeys-streamkey
      parameters:
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/appId'
      - name: streamkey
        in: path
        description: 要查询的推流码。
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/failure'
        2XX:
          $ref: '#/components/responses/success'
      servers:
      - url: https://api.sd-rtn.com/
      security:
      - Basic Auth: []
      - API Key: []
    put:
      tags:
      - 推流码
      summary: 更新推流码信息
      description: 更新指定推流码关联的流配置模板。
      operationId: put-region-v1-projects-appId-rtls-ingress-streamkeys-streamkey
      parameters:
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/appId'
      - name: streamkey
        in: path
        description: 要更新的推流码。
        required: true
        schema:
          type: string
      requestBody:
        description: 请求包体为 JSON Object 类型的 `settings` 字段。
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                  properties:
                    templateId:
                      type: string
                      nullable: true
                      description: '关联的流配置模板 ID，具体请见[流配置模板](/zh-CN/api-reference/api-ref/rtmp-gateway/create-reset-template)。请确保它已经被创建。


                        如果想要解除之前绑定的模板，且不再绑定新的模板，可以设置为 `null`。'
                  required:
                  - templateId
              required:
              - settings
            examples:
              更新模板 ID:
                value:
                  settings:
                    templateId: test
              解除绑定模板:
                value:
                  settings:
                    templateId: null
      responses:
        default:
          $ref: '#/components/responses/failure'
        2XX:
          $ref: '#/components/responses/success-with-status'
      servers:
      - url: https://api.sd-rtn.com/
      security:
      - Basic Auth: []
      - API Key: []
      x-docs-callouts:
      - type: warning
        title: 注意
        position: after-description
        markdown: 该接口仅支持更新已绑定的流配置模板。
    delete:
      tags:
      - 推流码
      summary: 销毁推流码
      description: 销毁不再使用的推流码。
      operationId: delete-region-v1-projects-appId-rtls-ingress-streamkeys-streamkey
      parameters:
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/appId'
      - $ref: '#/components/parameters/streamkey'
      responses:
        default:
          $ref: '#/components/responses/failure'
        2XX:
          $ref: '#/components/responses/success-with-status'
      servers:
      - url: https://api.sd-rtn.com/
      security:
      - Basic Auth: []
      - API Key: []
      x-docs-sections:
      - position: after-description
        markdown: '调用该接口销毁不再使用的推流码。


          销毁后，你无法再使用该推流码进行推流。但如果推流码正在使用中，销毁推流码并不会影响当前正在推送的流。如果要立即禁用该条流，请搭配调用[使用 SID 强制断开推流 API](force-disconnection)。'
  /{region}/v1/projects/{appId}/rtls/ingress/stream-templates/{templateId}:
    put:
      tags:
      - 流配置模板
      summary: 创建或重置流配置模板
      description: 创建或重置指定的流配置模板。
      operationId: put-region-v1-projects-appId-rtls-ingress-stream-templates-templateId
      parameters:
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - $ref: '#/components/parameters/region2'
      - $ref: '#/components/parameters/appId'
      - $ref: '#/components/parameters/templateId'
      requestBody:
        description: '请求包体为 JSON Object 类型的 `settings` 字段。


          > 为确保请求成功，请不要将必填字段设为 `null` 或 `""`。'
        content:
          application/json:
            schema:
              type: object
              properties:
                transcoding:
                  $ref: '#/components/schemas/transcoding'
                jitterBuffer:
                  $ref: '#/components/schemas/jitterBuffer'
            examples:
              Example 1:
                value:
                  settings:
                    transcoding:
                      video:
                        enabled: true
                        codec: H.264
                        width: 1280
                        height: 720
                        fps: 24
                        bitrate: 2200
                        simulcastStream:
                          width: 960
                          height: 540
                          fps: 24
                          bitrate: 1670
                      audio:
                        enabled: true
                        profile: 3
                    jitterBuffer:
                      size: 500
                      maxSize: 800
      responses:
        default:
          $ref: '#/components/responses/failure'
        2XX:
          $ref: '#/components/responses/success-with-status'
      servers:
      - url: https://api.sd-rtn.com/
      security:
      - Basic Auth: []
      - API Key: []
      x-docs-sections:
      - position: after-description
        markdown: '该方法创建一个流配置模板（Stream Template）。在流配置模板中，你可以配置视频或音频流的转码参数，以及用于缓解网络延迟的参数。


          每个 App ID 下最多可以创建 10 个流配置模板，每个流配置模板都有唯一的 ID 标识（templatedId）。在创建流配置模板时，你需要为其指定一个 templateId。如果该 templateId 对应的模板已经存在，则会以传入的 Body 数据重置整个流配置模板的值。


          流配置模板有两种使用方式，可结合使用：


          - **为 App ID 指定全局的流配置模板**：该 App ID 下所有的推流码（Stream Key），默认都会使用该模板；

          - **为特定的推流码指定特定的流配置模板**：使用该推流码推流时，就会使用特定的流配置模板。'
      x-docs-callouts:
      - type: warning
        title: 注意
        position: after-description
        markdown: 所有 App ID 默认情况下不设置流配置模板，即不会默认开启视频转码。
    patch:
      tags:
      - 流配置模板
      summary: 更新流配置模板
      description: 更新已创建的流配置模板。
      operationId: patch-region-v1-projects-appId-rtls-ingress-stream-templates-templateId
      parameters:
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - $ref: '#/components/parameters/region2'
      - $ref: '#/components/parameters/appId'
      - $ref: '#/components/parameters/templateId'
      requestBody:
        description: '请求包体为 JSON Object 类型的 `settings` 字段。


          > - 为确保请求成功，请不要将必填字段设为 `null` 或 `""`。

          > - 更新支持的最小单元为：

          >   - `transcoding.video`

          >   - `transcoding.audio`

          >   - `jitterBuffer`

          >   举例来说，如果只希望更新 `transcoding.video` 中的 `fps` 字段，也需要再次传入整个 `transcoding.video` ，仅修改 `fps` 字段，其他字段保持不变一起传入。不能单独传入 `fps` 字段。

          > - `transcoding.video`、`transcoding.audio`、`jitterBuffer` 之间相互独立，互不影响。如果只传入 `transcoding.video`，那么就只会更新它的参数，不会影响 `transcoding.audio` 和 `jitterBuffer` 的参数值。'
        content:
          application/json:
            schema:
              type: object
              properties:
                transcoding:
                  $ref: '#/components/schemas/transcoding'
                jitterBuffer:
                  $ref: '#/components/schemas/jitterBuffer'
            examples:
              仅修改视频转码参数:
                value:
                  settings:
                    transcoding:
                      video:
                        enabled: true
                        codec: H.264
                        width: 1280
                        height: 720
                        fps: 24
                        bitrate: 2200
                        simulcastStream:
                          width: 960
                          height: 540
                          fps: 24
                          bitrate: 1670
      responses:
        default:
          $ref: '#/components/responses/failure'
        2XX:
          $ref: '#/components/responses/success-with-status'
      servers:
      - url: https://api.sd-rtn.com/
      security:
      - Basic Auth: []
      - API Key: []
      x-docs-callouts:
      - type: warning
        title: 注意
        position: after-description
        markdown: '- 该接口只能在流配置模板已经存在的情况下调用。

          - 流配置模板的修改只有在重新推流后才会生效，且考虑到网关与数据库之间的同步延迟，请在调用该接口 3 分钟后再重新推流。'
    delete:
      tags:
      - 流配置模板
      summary: 删除流配置模板
      description: 删除指定的流配置模板。
      operationId: delete-region-v1-projects-appId-rtls-ingress-stream-templates-templateId
      parameters:
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - $ref: '#/components/parameters/region2'
      - $ref: '#/components/parameters/appId'
      - $ref: '#/components/parameters/templateId'
      responses:
        default:
          $ref: '#/components/responses/failure'
        2XX:
          $ref: '#/components/responses/success-with-status'
      servers:
      - url: https://api.sd-rtn.com/
      security:
      - Basic Auth: []
      - API Key: []
      x-docs-callouts:
      - type: warning
        title: 注意
        position: after-description
        markdown: '- 删除后，当前正在使用该模板推送的流不受影响，仍然按照模板参数完成推送。删除从下一次推流开始生效（包括正常推流和断线重连）。

          - 如果删除了推流码关联的模板，则默认使用该 App ID 下的全局模板。若未配置全局模板，则推流将按照无模板设置进行，即不开启视频转码。'
  /{region}/v1/projects/{appId}/rtls/ingress/appconfig:
    put:
      tags:
      - 流配置模板
      summary: 设置全局流配置模板
      description: 为指定 App ID 设置全局流配置模板。
      operationId: put-region-v1-projects-appId-rtls-ingress-appconfig
      parameters:
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - $ref: '#/components/parameters/region2'
      - $ref: '#/components/parameters/appId'
      requestBody:
        description: 请求包体为 JSON Object 类型的 `settings` 字段。
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                  properties:
                    defaultStreamTemplate:
                      type: string
                      description: '流配置模板 ID，必须已经创建。


                        如果将 `defaultStreamTemplate` 的值设为 `null`，那么会清除之前为该 App ID 设置的全局流配置模板。该 App ID 下的所有推流都将按照无模板设置进行，即默认不开启视频转码。


                        > 针对使用过 Beta 版本的用户：在 Beta 版本中，此 API 还可以设置 `transcoding` 转码参数，现在建议你改用[创建或重置流配置模板 API](create-reset-template) 设置。


                        > 如果你之前使用此 API 设置过 `transcoding`，目前的生效机制如下：

                        >   - 如果现在重新设置 `defaultStreamTemplate`，那么之前通过此 API 设置的 `transcoding` 就会自动失效，以新模板中的参数为准。

                        >   - 如果现在不设置新的 `defaultStreamTemplate`，那么之前通过此 API 设置的 `transcoding` 仍会保留，作为此 App ID 的默认全局配置参数。'
      responses:
        default:
          $ref: '#/components/responses/failure'
        2XX:
          $ref: '#/components/responses/success-with-status'
      servers:
      - url: https://api.sd-rtn.com/
      security:
      - Basic Auth: []
      - API Key: []
      x-docs-callouts:
      - type: warning
        title: 注意
        position: after-description
        markdown: 调用该接口前，必须有一个已创建的模板，可参考[创建或重置流配置模板 API](create-reset-template) 来创建模板。
  /{region}/{version}/projects/{appId}/rtls/ingress/online-streams:
    get:
      summary: 查询当前在推流列表
      description: 查询当前正在推送到 RTMP 网关的流列表。
      operationId: get-region-v1-projects-appId-rtls-ingress-online-streams
      parameters:
      - schema:
          type: string
        name: region
        in: path
        required: true
        description: '创建推流码的区域。声网支持分区域创建推流码，目前支持以下区域：

          - `cn`：中国大陆

          - `ap`：除中国大陆以外的亚洲区域

          - `na`：北美

          - `eu`：欧洲


          > - 请确保设置的 `region` 与输出的源流在同一个区域。

          > - 请确保设置的 `region` 与推流使用的域名在同一个区域。

          > - 请确保传入的 `region` 的值为小写。'
      - schema:
          type: string
        name: version
        in: path
        required: true
        description: 查询信息的版本，可以设为 `v1` 或 `v2`。不同版本返回的结果详见**响应**。
      - schema:
          type: string
        name: appId
        in: path
        required: true
        description: 声网为每个开发者提供的 App ID。在声网控制台创建一个项目后即可得到一个 App ID。App ID 是一个项目的唯一标识。
      - $ref: '#/components/parameters/Rtmp-gateway_X-request-id'
      - schema:
          type: string
        in: query
        name: channel
        description: 查询在推流所在的频道名。如果指定 channel，那么只返回推往指定频道内的在线流信息。注意，因为声网频道名允许包含一些特殊字符，因此需要先进行 URL转义。
      responses:
        2XX:
          description: 如果状态码为 `2XX`，则请求成功。
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/query-body'
                - $ref: '#/components/schemas/query-body-v2'
              examples:
                v1 版本:
                  value:
                    status: success
                    data:
                    - sid: eba0c189-15ab-b852-b51d-6705****00ce
                      channel: shx1013001
                      uid: '123'
                      url: shxtest1-rtcpush-test-cn.agoramdn.com/live/pIdY42WEm5****fblM-Q8M1vMMXQ
                      status: Running
                      beginAt: '2023-10-16 11:36:12.293'
                      bitrate: 4147
                      video:
                        width: 1920
                        height: 1080
                        fps: 30
                      audio:
                        channels: 2
                        sampleRate: 48000
                v2 版本:
                  value:
                    status: success
                    data:
                    - sid: 48de7de5-4326-1be5-fc70-46ce****2aed
                      channel: shxtest
                      uid: '100'
                      url: rtls-ingress-test-cn.agoramdn.com/live/xTm0FSTJ****cZ20QE4rq
                      status: Running
                      beginAt: '2024-08-28 04:06:05.597'
                      input:
                        video:
                          codec: H.264
                          width: 1280
                          height: 720
                          fps: 30
                          bitrate: 2509
                          gop: 2000
                        audio:
                          codec: AAC
                          channels: 2
                          sampleRate: 48000
                          bitrate: 166
                      output:
                        video:
                          codec: H.264
                          width: 1280
                          height: 720

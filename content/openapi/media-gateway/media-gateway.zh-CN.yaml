      headers:
        X-Request-ID:
          schema:
            type: string
          description: 本次请求的 UUID（通用唯一识别码）。该值为本次请求 Header 中的 `X-Request-ID`。
  schemas:
    settings:
      type: object
      properties:
        settings:
          type: object
          properties:
            channel:
              type: string
              description: '声网频道名称，字符串长度必须在 64 字节以内，支持以下字符集（共 89 个字符）：

                - 所有小写英文字母（a-z）

                - 所有大写英文字母（A-Z）

                - 数字 0-9

                - 空格

                - `!`, `#`, `$`, `%`, `&`, `(`, `)`, `+`, `-`, `:`, `;`, `<`, `=`, `.`, `>`, `?`, `@`, `[`, `]`, `^`, `_`, `{`, `}`, `|`, `~`, `,`。'
            uid:
              type: string
              description: 'RTMP 网关在声网频道内的主播用户 UID，可以为数字 ID 或[字符串 ID](/zh-CN/api-reference/faq/integration/string_uid)。如果为数字 ID，取值范围为 1 到 2^32 - 1（即 4294967295，大于此数值则会被识别为字符串）；如果为字符串 ID，不能超过 255 字节。支持以下字符集（共 89 个字符）：

                - 所有小写英文字母（a-z）

                - 所有大写英文字母（A-Z）

                - 数字 0-9

                - 空格

                - `!`, `#`, `$`, `%`, `&`, `(`, `)`, `+`, `-`, `:`, `;`, `<`, `=`, `.`, `>`, `?`, `@`, `[`, `]`, `^`, `_`, `{`, `}`, `|`, `~`, `,`

                允许填 "" 或者 "0"，此时会使用随机的整型 uid 进入频道。具体 uid 的值可通过[查询在推流列表 API](query-streaming-list)  或[接收 NCS 回调](/zh-CN/realtime-media/rtmp-gateway/reference/ncs-events)获得。

                > `uid` 和 `channel` 不能同时为空，即在 `channel` 为 "" 的情况下，`uid` 就不能为 "0" 或 ""。

                输入的 `uid` 与实际识别值举例：

                > - "123" → 整型 uid，123

                > - "0123" → 整型 uid，123

                > - "4294967295" → 整型 uid，4294967295

                > - "4294967296" → 字符串 uid，"4294967296"

                > - "123abc" → 字符串 uid，"123abc"'
            expiresAfter:
              type: number
              description: '创建的推流码的有效时长，单位为秒。从创建时开始计算。如果填 `0`，则推流码永远有效。

                > 为确保请求成功，请不要将该必填字段设为 `null` 或 `""`。'
            templateId:
              type: string
              description: 关联的流配置模板 ID，具体请见[流配置模板](create-reset-template)。如果你不确定它的作用，请不要提供此字段。
          required:
          - channel
          - uid
          - expiresAfter
    transcoding:
      type: object
      description: 音视频转码参数配置。
      properties:
        video:
          $ref: '#/components/schemas/video'
        audio:
          $ref: '#/components/schemas/audio'
    video:
      type: object
      description: 视频转码参数。
      properties:
        enabled:
          type: boolean
          description: 是否开启视频转码，默认关闭。
          default: false
        mode:
          type: string
          description: "转码模式。\n- `force`（默认）：强制开启转码。\n- `adaptive`：自适应开启转码。\n    - 当源流有 B 帧时，则开启转码。\n    - 如果推流开始的 2 秒内有 B 帧，则以转码模式开始推流。\n    - 如果推流中途出现 B 帧，则先以不转码模式推流，待有 B 帧后再切换为转码模式，切换过程观众端会感知到主播先暂停发流，再恢复发流。"
          default: force
        codec:
          type: string
          description: 转码的编解码格式。支持取值：`H.264`，`VP8`。
          default: H.264
        width:
          type: number
          description: 视频编码宽度，单位为 px。如不填或填 `0`，则跟随源流的宽度。
          minimum: 0
          maximum: 1920
        height:
          type: number
          description: '视频编码高度，单位为 px。如不填或填 `0`，则跟随源流的高度。


            > width 和 height 需要同时填入或同时都不填，目前暂不支持只填其中 1 个。'
          minimum: 0
          maximum: 1920
        fps:
          type: number
          description: 视频编码帧率，单位为 fps。如不填或填 `0`，则跟随源流的帧率。
          minimum: 0
          maximum: 60
        bitrate:
          type: number
          description: "视频编码码率，单位为 Kbps。\n- 如果开启小流（提供下面的 `simulcastStream`），则该字段为必填，且要保证值大于 `simulcastStream.bitrate`。\n- 如果未开启小流（不提供 `simulcastStream`），则该字段为选填。如果不填，会跟随源流码率；如果填 `0`，会根据 `width`、`height` 和 `fps` 三个字段的值自动匹配声网推荐的码率，详见[常用视频属性](/zh-CN/realtime-media/rtmp-gateway/reference/video-profile)。\n    > 在不开启小流的情况下，建议使用自动匹配的码率，无需自行设置码率。"
          minimum: 0
          maximum: 14000
        simulcastStream:
          $ref: '#/components/schemas/simulcastStream'
          description: 视频小流配置项。如果提供，则开启小流，并指定小流的转码参数。
      required:
      - enabled
    simulcastStream:
      type: object
      properties:
        width:
          type: number
          description: 视频小流的宽度，单位为 px。该参数的值需要小于上面 `video.width` 的值。如不填或填 `0`，则采用 `video.width` ÷ 2 的值。
          minimum: 0
          maximum: 1920
        height:
          type: number
          description: 视频小流的高度，单位为 px。该参数的值需要小于上面 `video.height` 的值。如不填或填 `0`，则采用 `video.height` ÷ 2 的值。
          minimum: 0
          maximum: 1920
        fps:
          type: number
          description: 视频小流的帧率，单位为 fps。该参数的值需要小于等于 `video.fps` 的值。如不填或填 `0`，则使用 `15` 作为默认值。
          minimum: 0
          maximum: 60
          default: 15
        bitrate:
          type: number
          description: '视频小流的码率，单位为 Kbps。该参数的值需要小于上面 `video.bitrate` 的值。如果不填或填 `0`，则根据 `video.bitrate`、小流的分辨率和 fps，自动计算声网推荐码率。

            > 当开启小流且指定小流 bitrate 时，需要同时指定 `video.bitrate`。'
    audio:
      type: object
      description: 音频转码参数。
      properties:
        enabled:
          type: boolean
          description: 是否开启音频转码，默认开启。
          default: true
        profile:
          type: number
          description: 编码音频场景。默认值为 `0`，表示 48 KHz 采样率、音乐编码、单声道、编码码率最大值为 64 Kbps。如果要设置其他 `profile`，请[联系技术支持](https://ticket.shengwang.cn)。
          default: 0
        bitrate:
          type: number
          description: 编码码率，单位为 Kbps。如果不填，则码率由 `profile` 的值确定。
          minimum: 64
          maximum: 320
      required:
      - enabled
    jitterBuffer:
      type: object
      description: 网络抖动缓冲，仅在开启视频转码时生效。
      properties:
        size:
          type: number
          description: '`jitterBuffer` 的数据长谷，单位 ms。默认值为 500，表示 RTMP 网关会增加 500 ms 的端到端延迟，以降低网络抖动带来的卡顿。'
          default: 500
        maxSize:
          type: number
          description: '`jitterBuffer` 的最大长度，单位 ms，默认值为1000。请确保该字段的值大于 `jitterBuffer.size`。当 `jitterBuffer` 长度超过此值时，网关就会开启加速，直到恢复至 `jitterBuffer.size`。'
          default: 1000
    query-body:
      title: v1 版本
      type: object
      description: 如果请求路径中 `version` 填 `v1`，则返回如下字段。
      properties:
        status:

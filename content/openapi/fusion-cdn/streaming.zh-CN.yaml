      required: true
      schema:
        type: string
      description: 自定义转码模版的名称。
    name_standard:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: '预置转码模版的名称。各名称对应的预置转码模版如下：


        - `ld`，流畅，高度 240 px，宽度自适应，码率 400 Kbps，编码格式 H.264

        - `sd1`，标清一 ，高度 360 px，宽度自适应，码率 640 Kbps，编码格式 H.264

        - `sd2`，标清二，高度 480 px，宽度自适应，码率 800 Kbps，编码格式 H.264

        - `sd3`，标清三，高度 540 px，宽度自适应，码率 1,200 Kbps，编码格式 H.264

        - `hd`，高清，高度 720 px，宽度自适应，码率 1,500 Kbps，编码格式 H.264

        - `fhd`，超清，高度 1080 px，宽度自适应，码率 2,100 Kbps，编码格式 H.264'
  requestBodies:

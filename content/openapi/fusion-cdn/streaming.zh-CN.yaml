            - `5`：[Microsoft Azure](https://azure.microsoft.com/zh-cn/services/storage/blobs/)

            - `6`：[谷歌云](https://cloud.google.com/storage)

            - `7`：[华为云](https://www.huaweicloud.com/product/obs.html)

            - `8`：[百度智能云](https://cloud.baidu.com/product/bos.html)

            该参数对 `region` 的设置有限制作用。详见[第三方云存储地区说明](/zh-CN/api-reference/fusion-cdn/restful/api/reference)。'
        region:
          type: number
          description: '第三方云存储指定的地区信息。为了确保录制文件上传的成功率和实时性，第三方云存储的 `region` 与你发起请求的应用服务器必须在同一个区域中。例如：你发起请求的应用服务器在中国大陆地区，则第三方云存储需要设置为中国大陆区域内。

            该参数受 `vendor` 参数设置的限制。详见[第三方云存储地区说明](/zh-CN/api-reference/fusion-cdn/restful/api/reference)。'
        bucket:
          type: string
          description: 第三方云存储的 bucket，bucket 名称需要符合对应第三方云存储服务的命名规则。
        accessKey:
          type: string
          description: 第三方云存储的 access key。在一般情况下，建议提供只写权限的访问密钥。如需延时转码，则访问密钥必须同时具备读写权限。
        secretKey:
          type: string
          description: 第三方云存储的 secret key。

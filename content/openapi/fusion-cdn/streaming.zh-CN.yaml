      description: ''
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                width: 0
                height: 360
                videoCodec: h264
                videoBitrate: 1200
                profile: base
                audioCodec: aac
                audioBitrate: 320
                audioSampleRate: 44100
                advancedTranscode: true
            required:
            - width
            - height
            properties:
              width:
                type: integer
                description: 视频的宽，取值范围 [0,1920]，0 表示按原视频比例自适应。
                minimum: 0
                maximum: 1920
              height:
                type: integer
                description: 视频的高，取值范围 [0,1920]，0 表示按原视频比例自适应。
                minimum: 0
                maximum: 1920
              videoCodec:
                type: string
                description: 视频编码格式，目前只支持 H.264。如果 `videoBitrate` 和 `profile` 指定了值，该字段必填。
              videoBitrate:
                type: integer
                description: 视频码率（Kbps）。
                minimum: 200
                maximum: 6000
              profile:
                type: string
                description: '编码级别，每个级别对应一组特定的编码参数。一般来说级别越高，画面质量越好，同时编解码消耗的资源也越高。取值包括：

                  - `base`：基础级别，适合移动设备。

                  - `main`：标准级别，适合标准分辨率设备。

                  - `high`：高等级别，适合高分辨率设备。'
              audioCodec:
                type: string
                description: 音频编码格式，目前只支持 AAC。如果指定了 `audioBitrate` 和 `audioSampleRate`，该字段必填。
              audioBitrate:
                type: integer
                description: 音频码率（Kbps）。
                minimum: 100
                maximum: 500
              audioSampleRate:
                type: integer
                description: 音频采样率（Hz）。取值包括：96000、88200、64000、48000、44100、32000、16000。
          examples:
            请求 body:
              value:
                width: 0
                height: 360
                videoCodec: h264
                videoBitrate: 1200
                profile: base
                audioCodec: aac
                audioBitrate: 320
                audioSampleRate: 44100

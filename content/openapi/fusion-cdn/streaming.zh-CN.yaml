  securitySchemes:
    API Key:
      name: API Key
      type: apiKey
      in: header
      description: '融合 CDN 直播 RESTful API 使用 HTTP HMAC (Hash-based Message Authentication Code) 认证。


        在发送 HTTP 请求时，你需要通过 HMAC-SHA256 算法生成一个签名，并在请求头部的 `Authorization` 字段传入签名及相关信息。详见[认证方式](/zh-CN/realtime-media/fusion-cdn/build/setup-and-access/http-hmac-auth)。'
    Basic Auth:
      type: http
      scheme: basic
      description: 声网频道管理 RESTful API 仅支持 HTTPS 协议。发送请求时，你需要使用声网提供的客户 ID 和客户密钥生成一个 Base64 算法编码的凭证，并填入 HTTP 请求头部的 Authorization 字段中。详见[使用 HTTP 认证](/zh-CN/realtime-media/rtc/build/setup-and-access/http-basic-auth)。

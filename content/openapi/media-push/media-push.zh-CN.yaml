openapi: 3.1.0
x-stoplight:
  id: oi9e1upp2vkfd
info:
  version: ''
  title: 旁路推流 RESTful API
  description: >-
    你可以使用推流 RESTful API 订阅声网频道内的音视频流，将音视频流转码后（或选择不转码），通过标准协议（如 RTMP）推送到 CDN（Content Delivery
    Network）。这个过程相当于声网通过一个 Converter 将音视频流处理后输出并推到 CDN。你可以通过如下方法控制 Converter：


    - [Create](create)：创建一个 Converter。

    - [Delete](delete)：销毁指定的 Converter。

    - [Update](update)：更新指定的 Converter 配置。

    - [Get](get)：获取指定 Converter 的推流状态。

    - [List](list)：查询一个项目下所有 Converter。

    - [List by channel](list-by-channel)：查询一个项目下指定频道内的 Converter。


    > 请确保声网频道的场景为直播，而非通信，否则旁路推流会失败。


    为方便你监听旁路推流的状态，声网提供[消息通知服务](https://doc.shengwang.cn/doc/media-push/restful/webhook/enable-ncs)。开通该服务后，你可以通过
    Webhook 接收如下事件：


    - [创建推流成功](https://doc.shengwang.cn/api-ref/media-push/restful/converter-created)。

    - [推流配置更新](https://doc.shengwang.cn/api-ref/media-push/restful/converter-updated)。

    - [推流状态变化](https://doc.shengwang.cn/api-ref/media-push/restful/converter-state-changed)。

    - [停止推流成功](https://doc.shengwang.cn/api-ref/media-push/restful/converter-destroyed)。


    因为声网会动态调整消息通知服务器的 IP 地址，为不影响你接收事件，你需要定期[查询 IP 地址](get-ncs-ip)并更新防火墙白名单配置。
servers:
  - url: https://api.sd-rtn.com
paths:
  /{region}/v1/projects/{appId}/rtmp-converters:
    post:
      summary: 创建 Converter
      description: 在项目中创建一个 Converter，用于处理音视频流并推流到 CDN。
      operationId: post-region-v1-projects-appId-rtmp-converters
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/regionHintIp'
        - $ref: '#/components/parameters/region'
        - $ref: '#/components/parameters/appId'
      requestBody:
        description: '`Create` 请求可创建**转码**推流和**不转码**推流的 Converter。'
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - type: object
                  title: 转码推流
                  properties:
                    converter:
                      type: object
                      description: '**转码**推流时需设置如下字段。'
                      properties:
                        name:
                          $ref: '#/components/schemas/name'
                        transcodeOptions:
                          type: object
                          description: '**转码**推流的配置。'
                          properties:
                            rtcChannel:
                              $ref: '#/components/schemas/rtcChannel'
                            audioOptions:
                              type: object
                              description: >-
                                Converter 的音频转码配置。


                                **注意**：

                                - 该字段仅需在有音频的场景下设置。如果有音频但是无需自定义音频配置，那么将该字段设为空，即 `"audioOptions": {}`。

                                - 暂时只支持不超过 3 名用户进行混音，如果参与混音的用户人数大于
                                3，请联系[技术支持](https://ticket.shengwang.cn)。
                              properties:
                                rtcStreamUids:
                                  $ref: '#/components/schemas/rtcStreamUids'
                                codecProfile:
                                  $ref: '#/components/schemas/codecProfile'
                                sampleRate:
                                  $ref: '#/components/schemas/sampleRate'
                                bitrate:
                                  $ref: '#/components/schemas/bitrate'
                                audioChannels:
                                  $ref: '#/components/schemas/audioChannels'
                                volumes:
                                  $ref: '#/components/schemas/volumes'
                            videoOptions:
                              type: object
                              description: |-
                                Converter 的视频转码配置。

                                **注意**：该字段仅需在有视频的场景下设置。并且在音视频场景下，该字段不能为空。
                              properties:
                                canvas:
                                  type: object
                                  description: 视频画布的配置。
                                  properties:
                                    width:
                                      $ref: '#/components/schemas/canvas-width'
                                    height:
                                      $ref: '#/components/schemas/canvas-height'
                                    color:
                                      $ref: '#/components/schemas/canvas-color'
                                  required:
                                    - width
                                    - height
                                layoutType:
                                  $ref: '#/components/schemas/layoutType'
                                layout:
                                  anyOf:
                                    - $ref: '#/components/schemas/layout-rtc'
                                      description: |-
                                        画布上各用户的视频画面的配置。

                                        > 仅需在 `layoutType` 为自定义布局时设置 `layout` 字段。
                                    - $ref: '#/components/schemas/layout-image'
                                      description: |-
                                        画布上视频图片的配置。画布上视频图片可充当水印。

                                        > 仅需在 `layoutType` 为自定义布局时设置 `layout` 字段。
                                vertical:
                                  type: object
                                  description: |-
                                    垂直布局的画面配置。

                                    > 仅需在 `layoutType` 为垂直布局时设置 `vertical` 字段。
                                  properties:
                                    maxResolutionUid:
                                      $ref: '#/components/schemas/max-uid'
                                    fillMode:
                                      $ref: '#/components/schemas/fillMode'
                                    refreshIntervalSec:
                                      $ref: '#/components/schemas/refresh-sec'
                                defaultPlaceholderImageUrl:
                                  $ref: '#/components/schemas/default-image'
                                bitrate:
                                  $ref: '#/components/schemas/v-bitrate'
                                frameRate:
                                  $ref: '#/components/schemas/v-framerate'
                                gop:
                                  $ref: '#/components/schemas/v-gop'
                                codec:
                                  $ref: '#/components/schemas/v-codec'
                                codecProfile:
                                  $ref: '#/components/schemas/v-codec-profile'
                                seiOptions:
                                  type: object
                                  description: >-
                                    设置携带的用户 SEI（Supplemental Enhancement
                                    Information）信息。默认为空。不设置则不携带用户 SEI 信息。
                                  properties:
                                    source:
                                      type: object
                                      description: 设置 SEI 信息的数据来源。默认为空。
                                      properties:
                                        metadata:
                                          $ref: '#/components/schemas/metadata'
                                        datastream:
                                          $ref: '#/components/schemas/datastream'
                                        customized:
                                          type: object
                                          description: >-
                                            自定义 SEI 信息。默认为空。


                                            自定义 SEI 信息会被转换为[声网 SEI
                                            规范](https://doc.shengwang.cn/faq/quality-issues/sei)的
                                            SEI 信息。
                                          properties:
                                            prefixForAgoraSei:
                                              $ref: '#/components/schemas/prefix'
                                            payload:
                                              $ref: '#/components/schemas/source-payload'
                                    sink:
                                      type: object
                                      description: 设置输出的 SEI 信息。默认为空。
                                      properties:
                                        type:
                                          $ref: '#/components/schemas/sink-type'
                              required:
                                - canvas
                                - bitrate
                          required:
                            - rtcChannel
                        rtmpUrl:
                          $ref: '#/components/schemas/rtmpUrl'
                        idleTimeout:
                          $ref: '#/components/schemas/idle'
                        jitterBufferSizeMs:
                          $ref: '#/components/schemas/jitter'
                      required:
                        - transcodeOptions
                        - rtmpUrl
                  required:
                    - converter
                - type: object
                  title: 不转码推流
                  properties:
                    converter:
                      type: object
                      description: '**不转码**推流时需设置如下字段。'
                      properties:
                        name:
                          $ref: '#/components/schemas/name'
                        rawOptions:
                          type: object
                          description: '**不转码**推流配置。'
                          properties:
                            rtcChannel:
                              $ref: '#/components/schemas/rtcChannel'
                            rtcStreamUid:
                              $ref: '#/components/schemas/raw-uid'
                          required:
                            - rtcChannel
                            - rtcStreamUid
                        rtmpUrl:
                          $ref: '#/components/schemas/rtmpUrl'
                        idleTimeout:
                          $ref: '#/components/schemas/idle'
                        jitterBufferSizeMs:
                          $ref: '#/components/schemas/jitter'
                      required:
                        - rawOptions
                        - rtmpUrl
                  required:
                    - converter
            examples:
              转码且自定义布局:
                value:
                  converter:
                    name: show68_vertical
                    transcodeOptions:
                      rtcChannel: show68
                      audioOptions:
                        codecProfile: HE-AAC
                        sampleRate: 48000
                        bitrate: 128
                        audioChannels: 1
                        rtcStreamUids:
                          - 201
                          - 202
                        volumes:
                          - volume: 50
                            rtcStreamUid: 201
                          - volume: 150
                            rtcStreamUid: 202
                      videoOptions:
                        canvas:
                          width: 360
                          height: 640
                          color: 0
                        layout:
                          - rtcStreamUid: 201
                            region:
                              xPos: 0
                              yPos: 0
                              zIndex: 1
                              width: 360
                              height: 320
                            fillMode: fill
                            placeholderImageUrl: http://example.agora.io/host_placeholder.jpg
                          - rtcStreamUid: 202
                            region:
                              xPos: 0
                              yPos: 320
                              zIndex: 1
                              width: 360
                              height: 320
                          - imageUrl: http://example.agora.io/watchmark.jpg
                            region:
                              xPos: 0
                              yPos: 0
                              zIndex: 2
                              width: 36
                              height: 64
                            fillMode: fit
                        codec: H.264
                        codecProfile: high
                        frameRate: 15
                        gop: 30
                        bitrate: 400
                        seiOptions:
                          source:
                            metadata: true
                            datastream: true
                            customized:
                              payload: example
                          sink:
                            type: 100
                    rtmpUrl: rtmp://example/live/show68
                    idleTimeout: 300
      responses:
        2XX:
          $ref: '#/components/responses/success-basic'
        非 2XX:
          $ref: '#/components/responses/failure-message'
      servers:
        - url: https://api.sd-rtn.com
      x-stoplight:
        id: aj79hthjtq9ii
      security:
        - Basic Auth: []
      x-docs-sections:
        - position: after-description
          markdown: >-
            `Create` 请求的 Body 字段设置较为复杂，请阅读如下文档后再进一步了解本文的字段说明：


            -
            [设置不转码推流](https://doc.shengwang.cn/doc/media-push/restful/user-guides/set-no-transcode)

            - [设置转码推流](https://doc.shengwang.cn/doc/media-push/restful/user-guides/update-transcode)

            - [设置混音音量](https://doc.shengwang.cn/doc/media-push/restful/user-guides/set-volume)

            - [设置 SEI 信息](https://doc.shengwang.cn/doc/media-push/restful/user-guides/set-sei)
  /{region}/v1/projects/{appId}/rtmp-converters/{converterId}:
    delete:
      summary: 销毁指定 Converter
      description: 在项目中销毁指定 Converter。
      operationId: delete-region-v1-projects-appId-rtmp-converters-converterId
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/region2'
        - $ref: '#/components/parameters/appId'
        - $ref: '#/components/parameters/converterId'
      responses:
        非 2XX:
          $ref: '#/components/responses/failure-message'
        2XX:
          description: 如果状态码为 2XX，请求成功。响应 Body 为空。
          headers:
            X-Request-ID:
              schema:
                type: string
              description: >-
                UUID（通用唯一识别码），标识本次请求。该值为本次请求 Header 中 `X-Request-ID`。如果请求出错，请在日志中打印出该值，排查问题。如果你已在请求
                Header 中对 `X-Request-ID` 赋值，那么你在响应中收到的参数名为 `X-Custom-Request-ID`，而非 `X-Request-ID`。
            X-Resource-ID:
              schema:
                type: string
              description: UUID（通用唯一识别码），标识本次请求销毁的 Converter 的 ID。
      servers:
        - url: https://api.sd-rtn.com
      x-stoplight:
        id: r12kntwnth6pp
      security:
        - Basic Auth: []
    patch:
      summary: 更新指定 Converter
      description: 在项目中更新指定 Converter 的配置。
      operationId: patch-region-v1-projects-appId-rtmp-converters-converterId
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/sequence'
        - $ref: '#/components/parameters/region2'
        - $ref: '#/components/parameters/appId'
        - $ref: '#/components/parameters/converterId'
      requestBody:
        description: |-
          `Update` 请求可更新**转码**推流和**不转码**推流的 Converter。

          > `Update` 不支持更新 Converter 的如下配置：
          > - `name`
          > - `idleTimeOut`
          > - `transcodeOptions.rtcChannel`
          > - `transcodeOptions.audioOptions.codecProfile`
          > - `transcodeOptions.audioOptions.sampleRate`
          > - `transcodeOptions.audioOptions.bitrate`
          > - `transcodeOptions.audioOptions.audioChannels`
          > - `transcodeOptions.videoOptions.codec`
          > - `transcodeOptions.videoOptions.codecProfile`
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - type: object
                  title: 转码推流
                  required:
                    - fields
                  properties:
                    converter:
                      type: object
                      properties:
                        transcodeOptions:
                          type: object
                          description: '**转码**推流的配置。'
                          properties:
                            audioOptions:
                              type: object
                              description: Converter 的音频转码配置。
                              properties:
                                rtcStreamUids:
                                  $ref: '#/components/schemas/rtcStreamUids'
                                volumes:
                                  $ref: '#/components/schemas/volumes'
                            videoOptions:
                              type: object
                              description: Converter 的视频转码配置。
                              properties:
                                canvas:
                                  type: object
                                  description: 视频画布的配置。
                                  properties:
                                    width:
                                      $ref: '#/components/schemas/canvas-width'
                                    height:
                                      $ref: '#/components/schemas/canvas-height'
                                    color:
                                      $ref: '#/components/schemas/canvas-color'
                                layout:
                                  anyOf:
                                    - $ref: '#/components/schemas/layout-rtc'
                                      description: |-
                                        画布上各用户的视频画面的配置。

                                        > 仅需在 `layoutType` 为自定义布局时设置 `layout` 字段。
                                    - $ref: '#/components/schemas/layout-image'
                                      description: |-
                                        画布上视频图片的配置。画布上视频图片可充当水印。

                                        > 仅需在 `layoutType` 为自定义布局时设置 `layout` 字段。
                                defaultPlaceholderImageUrl:
                                  $ref: '#/components/schemas/default-image'
                                bitrate:
                                  $ref: '#/components/schemas/v-bitrate'
                                frameRate:
                                  $ref: '#/components/schemas/v-framerate'
                                gop:
                                  $ref: '#/components/schemas/v-gop'
                                seiOptions:
                                  type: object
                                  description: >-
                                    设置携带的用户 SEI（Supplemental Enhancement
                                    Information）信息。默认为空。不设置则不携带用户 SEI 信息。
                                  properties:
                                    source:
                                      type: object
                                      description: 设置 SEI 信息的数据来源。默认为空。
                                      properties:
                                        metadata:
                                          $ref: '#/components/schemas/metadata'
                                        datastream:
                                          $ref: '#/components/schemas/datastream'
                                        customized:
                                          type: object
                                          properties:
                                            prefixForAgoraSei:
                                              $ref: '#/components/schemas/prefix'
                                            payload:
                                              $ref: '#/components/schemas/source-payload'
                                    sink:
                                      type: object
                                      description: 设置输出的 SEI 信息。默认为空。
                                      properties:
                                        type:
                                          $ref: '#/components/schemas/sink-type'
                        rtmpUrl:
                          $ref: '#/components/schemas/rtmpUrl'
                        jitterBufferSizeMs:
                          $ref: '#/components/schemas/jitter'
                    fields:
                      $ref: '#/components/schemas/request-fields'
                - type: object
                  title: 不转码推流
                  properties:
                    converter:
                      type: object
                      properties:
                        rtmpUrl:
                          $ref: '#/components/schemas/rtmpUrl'
                    fields:
                      $ref: '#/components/schemas/request-fields'
            examples:
              更新推流地址:
                value:
                  converter:
                    rtmpUrl: rtmp://example.agora.io/live/show68_backup
                  fields: rtmpUrl
      responses:
        2XX:
          $ref: '#/components/responses/success-basic'
        非 2XX:
          $ref: '#/components/responses/failure-message'
      servers:
        - url: https://api.sd-rtn.com
      x-stoplight:
        id: d2ablxsq5m9rk
      security:
        - Basic Auth: []
      x-docs-sections:
        - position: after-description
          markdown: >-
            `Update` 请求的 Body 字段设置较为复杂，请阅读如下文档后再进一步了解本文的字段说明：


            -
            [更新不转码推流](https://doc.shengwang.cn/doc/media-push/restful/user-guides/set-no-transcode)

            - [更新转码推流](https://doc.shengwang.cn/doc/media-push/restful/user-guides/update-transcode)

            - [更新混音音量](https://doc.shengwang.cn/doc/media-push/restful/user-guides/set-volume)

            - [更新 SEI 信息](https://doc.shengwang.cn/doc/media-push/restful/user-guides/set-sei)
    get:
      summary: 获取指定 Converter 的推流状态
      description: 获取指定 Converter 的推流状态。
      operationId: get-region-v1-projects-appId-rtmp-converters-converterId
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/region2'
        - $ref: '#/components/parameters/appId'
        - $ref: '#/components/parameters/converterId'
      responses:
        2XX:
          $ref: '#/components/responses/success-get'
        非 2XX:
          $ref: '#/components/responses/failure-reason'
      servers:
        - url: https://api.sd-rtn.com
      x-stoplight:
        id: ai3d9yk1a6uue
      security:
        - Basic Auth: []
  /v1/projects/{appId}/rtmp-converters:
    get:
      summary: 查询项目下所有 Converter
      description: 查询项目下所有 Converter 的信息。
      operationId: get-v1-projects-appId-rtmp-converters
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/appId'
      responses:
        2XX:
          $ref: '#/components/responses/success-list'
        非 2XX:
          $ref: '#/components/responses/failure-message-list'
      servers:
        - url: https://api.sd-rtn.com
      x-stoplight:
        id: 71jf81v9dfzyz
      security:
        - Basic Auth: []
  /v1/projects/{appId}/channels/{cname}/rtmp-converters:
    get:
      summary: 查询频道内 Converter
      description: 查询指定频道内所有 Converter 的信息。
      operationId: get-v1-projects-appId-channels-cname-rtmp-converters
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/appId'
        - $ref: '#/components/parameters/cname'
      responses:
        2XX:
          $ref: '#/components/responses/success-list'
        非 2XX:
          $ref: '#/components/responses/failure-message-list'
      servers:
        - url: https://api.sd-rtn.com
      x-stoplight:
        id: 6xotv8f5c74bq
      security:
        - Basic Auth: []
  /v1/ncs/ip:
    get:
      summary: 查询消息通知服务器 IP
      description: 查询消息通知服务器的 IP 地址或 IP 地址列表。
      operationId: get-v1-ncs-ip
      responses:
        2XX:
          description: |-
            如果返回的 HTTP 状态码为 `2XX`，表示请求成功。

            你只需关心响应 Body 中的 `primaryIP` 字段，无需关心响应 Header 以及响应 Body 中的其他字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      service:
                        type: object
                        properties:
                          hosts:
                            type: array
                            items:
                              type: object
                              properties:
                                primaryIP:
                                  type: string
                                  description: 声网消息通知服务器的 IP 地址。
      servers:
        - url: https://api.sd-rtn.com
      x-stoplight:
        id: f8hsf3fsyiqj5
      security:
        - Basic Auth: []
      x-docs-sections:
        - position: after-description
          markdown: >-
            **背景**：开通消息通知服务后，声网消息通知服务可以将旁路推流业务中发生的一些事件以 HTTPS 请求的方式通知到你的服务器。声网会动态调整消息通知服务器的 IP
            地址，周期为 24 小时。


            **用法**：你可以通过本方法查询 IP 地址。查询后，你需要将 IP 地址（或 IP 地址列表）添加到白名单中。
      x-docs-callouts:
        - position: after-description
          markdown: 我们强烈推荐你至少每 24 小时进行一次查询，并自动更新防火墙配置，否则可能会影响你接收通知。
components:
  parameters:
    regionHintIp:
      name: regionHintIp
      in: query
      description: CDN 源站 IP 地址，必须为有效的 IPv4 地址。该参数可以保障 RTMP 流的稳定性。
      required: false
      schema:
        type: string
    sequence:
      name: sequence
      in: query
      description: >-
        `Update` 请求的序列号。取值需要大于或等于 0。请确保后一次 `Update` 请求的序列号大于前一次 `Update`
        请求的序列号。序列号可以确保声网服务器按照你指定的最新配置来更新 Converter。


        **推荐用法**：声网推荐你在第一次调用 `Update` 时，将 `sequence` 填 `0`。在第二次调用 `Update` 时，将 `sequence` 填
        `1`。在第三次调用 `Update` 时，将 `sequence` 填 `2`。依次类推。声网服务器会按照最新 `Update` 请求（即最大的序列号）更新 Converter。
      required: false
      schema:
        type: number
    cursor:
      name: cursor
      in: query
      description: >-
        游标，用于分页查询 Converter 信息。取值必须大于或等于 0。


        首次发起 List 请求时，无需设置 `cursor` 参数，请求成功后返回第一页的 Converter 信息。每次请求最多返回 500 条 Converter 信息。推荐你根据响应
        Body 判断是否需要再次发起请求：

        - 如果响应 Body 中的 `cursor` 为 0，那么表示已经查询到所有 Converter 信息，无需再次发起请求。

        - 如果响应 Body 中的 `cursor` 不为 0，那么表示你的 Converter 超过 500 个，你需要再次发起请求继续查询。举例来说，首次发起请求时，不设置
        `cursor` 参数，返回的响应包体中 `cursor` 假设为 3009；再次发起请求，设置 `cursor` 参数为 3009；以此类推设置 `cursor`
        参数并循环请求，直到响应包体中 `cursor` 为 0 才停止请求。
      required: false
      schema:
        type: number
    appId:
      name: appId
      in: path
      description: 声网为每个开发者提供的 **App ID**。在声网控制台创建一个项目后即可得到一个 App ID。一个 App ID 是一个项目的唯一标识。
      required: true
      schema:
        type: string
    region:
      name: region
      in: path
      description: >-
        创建 Converter 的区域。声网支持分区域创建 Converter。请保证设置的 `region` 与你的 CDN 源站在同一个区域且传入 `region`
        的值为小写。目前支持以下区域：

        - `cn`：中国大陆

        - `ap`：除中国以外的亚洲区域

        - `na`：北美

        - `eu`：欧洲
      required: true
      schema:
        type: string
    region2:
      name: region
      in: path
      description: Converter 所在的区域，必须与创建 Converter 时设置的 `region` 一致。
      required: true
      schema:
        type: string
    converterId:
      name: converterId
      in: path
      description: Converter 的 ID。
      required: true
      schema:
        type: string
    cname:
      name: cname
      in: path
      description: >-
        声网频道名称，即 Converter 处理的流所属的频道的名称。字符串长度必须在 64 字节以内，支持以下字符集（共 89 个字符）：

        - 所有小写英文字母（a-z）

        - 所有大写英文字母（A-Z）

        - 数字 0-9

        - 空格

        - "!", "#", "$", "%", "&", "(", ")", "+", "-", ":", ";", "<", "=", ".", ">", "?", "@", "[",
        "]", "^", "_", " {", "}", "\|", "~", ","
      required: true
      schema:
        type: string
    Content-Type:
      name: Content-Type
      in: header
      description: '`application/json`'
      required: true
      schema:
        type: string
    X-Request-ID:
      name: X-Request-ID
      in: header
      description: >-
        UUID（通用唯一识别码），标识本次请求。推荐你赋值，赋值后，声网服务器会在响应 Header 中返回一个对应的 `X-Custom-Request-ID`
        字段，你可以用此进行问题排查。如果你不赋值，那么声网服务器会自动生成一个 UUID 并在响应 Header 中返回一个对应的 `X-Request-ID` 字段。
      schema:
        type: string
  securitySchemes:
    Basic Auth:
      type: http
      description: >-
        声网旁路推流 RESTful API 仅支持 HTTPS 协议。发送请求时，你需要使用声网提供的客户 ID 和客户密钥生成 Base64 编码凭证，并填入请求头部的
        `Authorization` 字段中。详见[实现 HTTP
        基本认证](https://doc.shengwang.cn/doc/media-push/restful/user-guides/http-basic-auth)。
      scheme: basic

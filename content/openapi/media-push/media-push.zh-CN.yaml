            Header 中对 `X-Request-ID` 赋值，那么你在响应中收到的参数名为 `X-Custom-Request-ID`，而非
            `X-Request-ID`。如果本次请求的响应状态码非 2XX，那么响应 Header 中可能无该字段。
        X-Resource-ID:
          schema:
            type: string
          description: UUID（通用唯一识别码），标识本次请求操作的 Converter 的 ID。
    failure-message-list:

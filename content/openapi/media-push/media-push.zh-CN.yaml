  schemas:
    name:
      type: string
      title: name
      description: >-
        Converter 的名字。长度必须在 64 个字符以内，支持的字符集范围如下：

        - 所有小写英文字母（a-z）

        - 所有大写英文字母（A-Z）

        - 数字 0-9

        - "-", "_"

        > - 不传值时该字段为空。

        > - 同一时间，一个项目下不允许出现重名的 Converter，否则在尝试创建同名的 Converter 时会收到响应状态码 `409(Conflict)`。

        > - 为避免重复创建多个 Converter 重复推流，请使用 `name` 字段管理指定项目下的 Converter。声网推荐你以“频道名（`rtcChannel`）”和

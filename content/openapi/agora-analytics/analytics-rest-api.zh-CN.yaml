                  value:
                    code: 200
                    message: 'null'
                    data:
                    - sdkVersion: 3.6.1.1
                      userCount: 42
                    - sdkVersion: 4.1.1
                      userCount: 37
                示例 3：请求查询中国通话人数 TOP 20 的地区和这些地区的通话人数:
                  value:
                    code: 200
                    message: 'null'
                    data:
                    - region: Shanghai
                      userCount: 42
                    - region: Beijing
                      userCount: 37
      security:
      - Authorization: []
      servers:
      - url: https://api.sd-rtn.com
      x-stoplight:

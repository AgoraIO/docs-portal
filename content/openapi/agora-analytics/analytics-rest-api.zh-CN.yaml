tags:
- name: 通话调查
- name: 数据洞察
- name: 实时监控
components:
  parameters:
    start_ts:
      name: start_ts
      in: query
      description: 查询的时间范围起点。Unix 时间戳（秒）。
      required: true
      schema:
        type: number
        examples:
        - 1550024508
    end_ts:
      name: end_ts
      in: query
      description: 查询的时间范围终点。Unix 时间戳（秒）。
      required: true
      schema:
        type: number
        examples:
        - '1550025508'
    cname:
      name: cname
      in: query
      description: 频道名称
      required: false
      schema:
        type: string
    appid:
      name: appid
      in: query
      description: 你的项目使用的 [App ID](https://doc.shengwang.cn/basics/glossary#appid)。
      required: true
      schema:
        type: string
    page_no:
      name: page_no
      in: query
      description: 翻页序号。
      required: false
      schema:
        type: number
        default: 1
    page_size:
      name: page_size
      in: query
      description: 每页的用户通话数，最大不能超过 100。如果指定的值超过 100，每页的用户通话数最多仍为 100 个。
      required: false
      schema:
        type: number
        default: '20'
    call_id:
      name: call_id
      in: query
      description: 通话 ID，即通话的唯一标识。
      required: true
      schema:
        type: string
        examples:
        - 15c995xxxxxxxxxxxd39be9b
    uids:
      name: uids
      in: query
      description: 请求的用户 uid 列表，多个 uid 用逗号隔开（如 `uids=10001,10002,10003`），最多可以指定 10 个 uid。用户 ID 根据实际的场景会存在复用的情况，如果请求指定 10 个 uid，那么返回的用户通话数会大于等于 10。
      required: false
      schema:
        type: string
    exclude_server_user:
      name: exclude_server_user
      in: query
      description: '是否排除 Linux 用户。

        - `true`: 排除 Linux 用户。

        - `false`: 不排除 Linux 用户。'
      required: false
      schema:
        type: boolean
        default: true
    sids:
      name: sids
      in: query
      description: 请求的用户通话 sid 列表。最多可以指定 20 个 sid，多个 sid 用逗号隔开。
      required: true
      schema:
        type: string
        examples:
        - sids=SXXXXXXXXXXXXXXXX1,SXXXXXXXXXXXXXXXX2
    metric:
      name: metric
      in: query
      description: '要查询的指标，支持设为以下值：

        - `userCount`：通话人数，一个用户 ID 在一个频道中计为一人，在多个频道中计为多人。

        - `sessionCount`：通话进出人次，用户每加入一次频道计为一个通话人次。

        - `channelCount`：频道数，从有用户加入频道到所有用户离开频道计为一个通话频道。

        - `peakConcurrentChannels`：最大同时在线频道数。

        - `peakConcurrentUsers`：最大同时在线人数。

        - `totalDuration`：音视频通话时长（分钟）。

        - `totalVideoDuration`：视频通话时长（分钟）。

        - `totalAudioDuration`：音频通话时长（分钟）。'
      required: true
      schema:
        type: string
    aggregateGranularity:
      name: aggregateGranularity
      in: query
      description: '返回数据的粒度，支持设为以下值：

        - `1d`：按天。此时返回查询时间范围内以  UTC 时间为零点起始的一整天的数据。

        - `1h`：按小时。此时返回查询时间范围内 UTC 时间为整小时的数据。'
      required: true
      schema:
        type: string
    metric-quality:
      name: metric
      in: query
      description: '要查询的指标，支持设为以下值：

        - `joinSuccessRate`：加入频道成功率。

        - `joinSuccessIn5sRate`：5s 内加入频道成功率。

        - `audioFreezeRate`：音频卡顿率。

        - `videoFreezeRate`：视频卡顿率。

        - `networkDelay` ：网络延迟率。'
      required: true
      schema:
        type: string
    productType:
      name: productType
      in: query
      description: '要查询的产品类型，支持设为以下值：

        - `Native`：指 Android、iOS、macOS、Windows 平台的声网 RTC SDK。

        - `WebRTC`：指 Web 平台的声网 RTC SDK。'
      required: true
      schema:
        type: string
    startTs-realtime:
      name: startTs
      in: query
      description: 查询的时间范围起点，Unix 时间戳（秒）。响应中会包含起点所在的时间窗口。
      required: true
      schema:
        type: number
        examples:
        - 1631837410
    endTs-realtime:
      name: endTs
      in: query
      description: 查询的时间范围终点，Unix 时间戳（秒）。响应中不会包含终点所在的时间窗口。
      required: true
      schema:
        type: number
        examples:
        - 1631837470
    metric-realtime:
      name: metric
      in: query
      description: '要查询的指标，支持设为以下值：

        - `userCount`：通话人数，一个用户 ID 在一个频道中计为一人，在多个频道中计为多人。

        - `channelCount`：频道数，从有用户加入频道到所有用户离开频道计为一个通话频道。'
      required: true
      schema:
        type: string
    dimension-realtime:
      name: dimension
      in: query
      description: '统计维度，仅支持单维度指定。仅在 `metric` 为 `userCount` 时生效。支持设为以下值：

        - `country`：国家。

        - `region`：地区。

        - `net`：网络类型。

        - `sdk`：SDK 版本。

        - `os`：操作系统。

        - `device`：设备型号。 你可以通过[获取实时规模 TOP 20 分组](realtime-usage-top20)获取当前 `dimension` 下的 TOP 值，再根据业务需要从中选取几个值，来作为下次请求时传入 `dimensionValues` 的值。'
      required: false
      schema:
        type: string
    dimensionValues:
      name: dimensionValues
      in: query
      description: 统计维度的值 ，即对 `dimension` 中设定的维度指定取值，仅在传入 `dimension` 时有效。所有值必须用双引号包括，并以逗号分隔。
      required: false
      schema:
        type: string
    ts:
      name: ts
      in: query
      description: 查询的时间范围起点，Unix 时间戳（秒）。实际查询范围为 [`ts`, `ts` + 20s ]。
      required: true
      schema:
        type: number
        examples:
        - 1631837410
    dimension:
      name: dimension
      in: query
      description: '统计维度，仅支持单维度指定。支持设为以下值：

        - `country`：国家。


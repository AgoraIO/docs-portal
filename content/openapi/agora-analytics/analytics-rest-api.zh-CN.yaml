      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startTs:
                  $ref: '#/components/schemas/startTs'
                endTs:
                  $ref: '#/components/schemas/endTs'
                metric:
                  $ref: '#/components/schemas/metric'
                dimension:
                  $ref: '#/components/schemas/dimension'
                dimensionValues:
                  $ref: '#/components/schemas/dimensionValues'

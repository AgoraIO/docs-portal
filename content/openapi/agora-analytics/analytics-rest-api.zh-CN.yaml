  /beta/analytics/call/statistics:
    get:
      tags:
      - 通话调查
      summary: 获取通话统计数据
      description: 获取指定通话在指定时间范围内、指定维度下的音频卡顿率或视频卡顿率统计数据。
      operationId: get-beta-analytics-call-statistics
      parameters:
      - $ref: '#/components/parameters/call_id'
      - $ref: '#/components/parameters/start_ts'
      - $ref: '#/components/parameters/end_ts'
      - $ref: '#/components/parameters/appid'
      - name: metric
        in: query
        description: '要查询的指标，支持设为以下值：

          - `audio_freeze_rate`：音频卡顿率。

          - `video_freeze_rate`：视频卡顿率。'
        required: true
        schema:
          type: string
      - name: dimension
        in: query
        description: '统计维度，支持设为以下值：

          - `country`：国家。

          - `region`：地区。

          - `net`：网络类型。

          - `sdk`：SDK 版本。

          - `os`：操作系统。

          - `device`：设备型号。'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: '#/components/schemas/code'
                  message:
                    $ref: '#/components/schemas/message'
                  requestId:
                    $ref: '#/components/schemas/requestId'
                  data:
                    type: array
                    description: 由纬度、用户数和指标值组成的数组。
                    items:
                      type: object
                      properties:
                        dimension_value:
                          type: string
                          description: 统计维度的值，对应请求时传入的 `dimension`。
                        user_count:
                          type: number
                          description: 用户数。
                        value:
                          type: number
                          description: 查询时间范围内的平均指标值，对应请求时传入的 `metric`。
                x-examples:
                  Example 1:
                    code: 200
                    message: 'Success request: /beta/analytics/call/statistics'
                    requestId: 191356c1318c8714b6b1800b1269b6084860f
                    data:
                    - dimension_value: 3.7.1.247
                      user_count: 6
                      value: 0.007
              examples:
                以统计维度为 SDK 版:
                  value:
                    code: 200
                    message: 'Success request: /beta/analytics/call/statistics'
                    requestId: 191xxxxxxxxxxxxxxxx0f
                    data:
                    - dimension_value: 3.7.1.247
                      user_count: 6
                      value: 0.007
      security:
      - Authorization: []
      servers:
      - url: https://api.sd-rtn.com
      x-stoplight:
        id: bafyc73rgbpl6

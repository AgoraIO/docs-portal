openapi: 3.1.0
x-stoplight:
  id: 9r0isom11hvse
info:
  version: ''
  title: API 概述
  description: '水晶球为实时音视频（RTC）产品提供 RESTful API，让你直接通过网络请求获取水晶球里的数据，在自己的网页或应用中灵活使用。


    调用水晶球 RESTful API 之前，我们推荐你先在[控制台](https://console.shengwang.cn)中试用水晶球，以便对各项参数和数据指标有更直观的了解。详情可参考以下使用指南：


    - [通话调查](https://doc.shengwang.cn/doc/analytics/general/rtc/call-search/overview)

    - [数据洞察普通版](https://doc.shengwang.cn/doc/analytics/general/rtc/data-insight/basic)

    - [数据洞察 Plus](https://doc.shengwang.cn/doc/analytics/general/rtc/data-insight/plus)

    - [实时监控](https://doc.shengwang.cn/doc/analytics/general/rtc/monitor)


    ## 认证方式


    水晶球 RESTful API 仅支持 HTTPS 协议。发送请求时，你需要使用声网提供的客户 ID 和客户密钥生成一个 Base64 算法编码的凭证，并填入 HTTP 请求头部的 Authorization 字段中。详见[使用 HTTP 认证](https://doc.shengwang.cn/doc/rtc/restful/user-guides/http-basic-auth)。


    ## 数据格式


    为了提高请求的响应速度，你需要根据业务服务器所在的地址选择发送请求的域名：

    - 业务服务器 DNS 地址位于中国大陆时，设置主域名为 `api.sd-rtn.com`。

    - 业务服务器 DNS 地址位于中国大陆以外的国家或地区时，设置主域名为 `api.agora.io`。


    > 水晶球 RESTful API 参考文档将以 `api.sd-rtn.com` 为例。


    请求直接在 URL 中使用查询字符串参数（query String）；响应内容的格式为 JSON。


    ## 调用限制


    水晶球 RESTful API 根据项目订阅的水晶球套餐包具有不同的调用限制，包括请求频率、查询范围、数据延迟等，详见[调用限制](https://doc.shengwang.cn/doc/analytics/general/rtc/api-limits)。'
servers:
- url: https://api.sd-rtn.com

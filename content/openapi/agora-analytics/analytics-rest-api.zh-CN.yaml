                  $ref: '#/components/schemas/filters'
              required:
              - startTs
              - endTs
              - metric
              x-examples:
                Example 1:
                  startTs: 1625097600
                  endTs: 1625184000
                  metric: userCount
                  dimension: country
            examples:
              示例 1：请求查询通话人数 TOP 20 的国家和各国通话人数:
                value:
                  startTs: 1625097600
                  endTs: 1625184000
                  metric: userCount
                  dimension: country
              示例 2：请求查询 SDK 版本为 "3.6.1.1" 和 "4.1.1"  的通话人数:
                value:
                  startTs: 1625097600
                  endTs: 1625184000
                  metric: userCount
                  dimension: sdkVersion
                  dimensionValues:
                  - 3.6.1.1
                  - 4.1.1
              示例 3：请求查询中国通话人数 TOP 20 的地区和这些地区的通话人数:
                value:
                  startTs: 1625097600
                  endTs: 1625184000
                  metric: userCount
                  dimension: region
                  filters:

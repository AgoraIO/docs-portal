                    id: l7ys1zs33s3xi
                dimension:
                  $ref: '#/components/schemas/dimension_quality'
                dimensionValues:
                  type: string
                  description: '统计维度的值 ，即对 `dimension` 中设定的维度指定取值，仅在传入 `dimension` 时有效。所有值必须用双引号包括，并以逗号分隔。设置该参数后，将返回 `dimensionValues` 中传入的值对应的聚合指标数据。

                    > 你可以在首次请求时，通过不传 `dimensionValues` 来获取当前 `dimension` 下的 TOP 值，再根据业务需要从中选取几个值，来作为下次请求时传入 `dimensionValues` 的值。'
                filters:
                  $ref: '#/components/schemas/filters'
            examples:
              示例 1：请求查询音频卡顿率 TOP 20 的国家和各国音频卡顿率:
                value:
                  startTs: 1625097600
                  endTs: 1625184000
                  metric: audioFreezeRate
                  dimension: country
                  productType: Native
              示例 2：请求查询 SDK 版本为"3.6.1.1" 和 "4.1.1" 的音频卡顿率:
                value:
                  startTs: 1625097600
                  endTs: 1625184000
                  metric: audioFreezeRate
                  dimension: sdkVersion
                  dimensionValues:
                  - 3.6.1.1
                  - 4.1.1
                  productType: Native
              示例 3：请求查询音频卡顿率 TOP 20 的中国地区和各地区音频卡顿率:
                value:
                  startTs: 1625097600
                  endTs: 1625184000
                  metric: audioFreezeRate
                  dimension: region
                  filters:
                  - name: country
                    value: China
                  productType: Native
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: '#/components/schemas/code'
                  message:
                    $ref: '#/components/schemas/message'
                  data:
                    type: array
                    description: "- 请求中没有填入 `dimension` 字段：返回 App ID 维度的指标数据。\n- 请求中填入了 `dimension` 字段：由维度、`refUsage` 和指标数据组成的数组。\n    - `refUsage`：辅助用量数据。每组返回数据中，每个 `metric` 将对应返回一个辅助用量数据，用于辅助判断数据的有效性。以下为 `metric` 和 `refUsage` 对应关系：\n        - `metric` 为 `joinSuccessRate` 时，`refUsage` 表示尝试加入频道次数。\n        - `metric` 为 `joinSuccessIn5sRate` 时，`refUsage` 表示尝试加入频道次数。\n        - `metric` 为 `audioFreezeRate` 时，`refUsage` 表示音频通话时长（分钟）。\n        - `metric` 为 `videoFreezeRate` 时，`refUsage` 表示视频通话时长（分钟）。\n        - `metric` 为 `networkDelay`  时，`refUsage` 表示音视频总通话时长（分钟）。"
                    items:
                      type: object
              examples:
                示例 1：请求查询音频卡顿率 TOP 20 的国家和各国音频卡顿率:
                  value:
                    code: 200
                    message: 'null'
                    data:
                    - country: China
                      refUsage: 231234
                      audioFreezeRate: 0.0017
                    - country: United States
                      refUsage: 213212
                      audioFreezeRate: 0.0014
                示例 2：请求查询 SDK 版本为`"3.6.1.1"` 和 `"4.1.1"` 的音频卡顿率:
                  value:
                    code: 200
                    message: 'null'
                    data:
                    - sdkVersion: 3.6.1.1
                      refUsage: 231234
                      audioFreezeRate: 0.0017
                    - sdkVersion: 4.1.1
                      refUsage: 213212
                      audioFreezeRate: 0.0014
                示例 3：请求查询音频卡顿率 TOP 20 的中国地区和各地区音频卡顿率:
                  value:
                    code: 200
                    message: 'null'
                    data:
                    - region: Shanghai
                      refUsage: 231234
                      audioFreezeRate: 0.0017
                    - region: Beijing
                      refUsage: 213212
                      audioFreezeRate: 0.0014
      security:
      - Authorization: []
      servers:
      - url: https://api.sd-rtn.com
      x-stoplight:
        id: pwrvuezqcyq0i

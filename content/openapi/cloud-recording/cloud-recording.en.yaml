  /v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/update:
    post:
      summary: Update task settings
      description: Updates the settings of an active cloud recording task.
      x-docs-sections:
        - position: after-description
          markdown: >-
            After starting a recording task, call this endpoint to update the subscription list,
            pause or resume web page recording, or update the CDN push address.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful.


            - If the returned status code is not `200`, the request failed. See [Response status
            codes](/en/api-reference/api-ref/cloud-recording/status-codes) for troubleshooting.
        - markdown: |-
            ```json
            {
                "code": 404,
                "reason": "failed to find worker"
              }
            ```
          position: after-response-example
          title: Response example
      operationId: update-cloud-recording
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request POST \
                --url https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/update \
                --header 'Authorization: Basic <credentials>' \
                --header 'Content-Type: application/json' \
                --data '{
                "cname": "httpClient463224",
                "uid": "527841",
                "clientRequest": {
                  "streamSubscribe": {
                    "audioUidList": {
                      "subscribeAudioUids": ["#allstream#"]
                    },
                    "videoUidList": {
                      "unsubscribeVideoUids": ["444", "555", "666"]
                    }
                  }
                }
              }'
        - lang: python
          label: Python
          source: |-
            import requests
              import json

              url = "https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/update"
              headers = {
                  "Authorization": "Basic <credentials>",
                  "Content-Type": "application/json"
              }

              data = {
                  "cname": "httpClient463224",
                  "uid": "527841",
                  "clientRequest": {
                      "streamSubscribe": {
                          "audioUidList": {
                              "subscribeAudioUids": ["#allstream#"]
                          },
                          "videoUidList": {
                              "unsubscribeVideoUids": ["444", "555", "666"]
                          }
                      }
                  }
              }

              response = requests.post(url, headers=headers, data=json.dumps(data))

              print(response.status_code)
              print(response.json())
        - lang: javascript
          label: Node.js
          source: |-
            const axios = require('axios');

              const url = 'https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/update';
              const headers = {
                'Authorization': 'Basic <credentials>',
                'Content-Type': 'application/json'
              };

              const data = {
                cname: "httpClient463224",
                uid: "527841",
                clientRequest: {
                  streamSubscribe: {
                    audioUidList: {
                      subscribeAudioUids: ["#allstream#"]

  /v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/stop:
    post:
      summary: Stop a cloud recording task
      description: Stops an active cloud recording task.
      x-docs-sections:
        - position: after-description
          markdown: >-
            Call this endpoint to leave the channel and stop cloud recording. To start recording
            again after stopping, call [`acquire`](acquire) to get a new resource ID.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful.


            - If the returned status code is not `200`, the request failed. See [Response status
            codes](/en/api-reference/api-ref/cloud-recording/status-codes) for troubleshooting.
        - markdown: |-
            ```json
            {
                "resourceId": "JyvK8nXHuV1BE.....",
                "sid": "38f8e3cfdc474cd56fc1ceba380d7e1a",
                "serverResponse": {
                  "extensionServiceState": [
                    {
                      "payload": {
                        "uploadingStatus": "uploaded"
                      },
                      "serviceName": "upload_service"
                    }
                  ]
                },
                "cname": "httpClient463224",
                "uid": "527841"
              }
            ```

            ```json
            {
                "code": 62,
                "reason": "request timeout"
               }

              url = "https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/mix/updateLayout"
              headers = {
                  "Authorization": "Basic <credentials>",
                  "Content-Type": "application/json"
              }

              data = {
                  "cname": "httpClient463224",
                  "uid": "527841",
                  "clientRequest": {
                      "mixedVideoLayout": 3,
                      "backgroundColor": "#FF0000",
                      "layoutConfig": [
                          {
                              "uid": "1",
                              "x_axis": 0.1,
                              "y_axis": 0.1,
                              "width": 0.1,
                              "height": 0.1,
                              "alpha": 1,
                              "render_mode": 1
                          },
                          {
                              "uid": "2",
                              "x_axis": 0.2,
                              "y_axis": 0.2,
                              "width": 0.1,
                              "height": 0.1,
                              "alpha": 1,
                              "render_mode": 1
                          }
                      ]
                  }
              }

              response = requests.post(url, headers=headers, data=json.dumps(data))

              print(response.status_code)
              print(response.json())
        - lang: javascript
          label: Node.js
          source: |-
            const axios = require('axios');

              const url = 'https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/mix/updateLayout';
              const headers = {
                'Authorization': 'Basic <credentials>',
                'Content-Type': 'application/json'
              };

              const data = {
                cname: "httpClient463224",
                uid: "527841",
                clientRequest: {
                  mixedVideoLayout: 3,
                  backgroundColor: "#FF0000",
                  layoutConfig: [
                    {
                      uid: "1",
                      x_axis: 0.1,
                      y_axis: 0.1,
                      width: 0.1,
                      height: 0.1,
                      alpha: 1,
                      render_mode: 1
                    },
                    {
                      uid: "2",
                      x_axis: 0.2,
                      y_axis: 0.2,
                      width: 0.1,
                      height: 0.1,
                      alpha: 1,
                      render_mode: 1
                    }
                  ]
                }
              };

              axios.post(url, data, { headers })
                .then(response => {
                  console.log('Status:', response.status);
                  console.log('Data:', response.data);
                })
                .catch(error => {
                  console.error('Error:', error.response ? error.response.data : error.message);
                });
      parameters:
        - $ref: "#/components/parameters/Content-Type"
        - $ref: "#/components/parameters/appid"
          description: >-
            The App ID of your project. Use the same App ID as the channel being recorded. Ensure
            that the cloud recording service has been enabled for this App ID.
        - $ref: "#/components/parameters/resourceid"
          description: The resource ID obtained from the `acquire` endpoint.
        - $ref: "#/components/parameters/sid"
          description: The recording ID obtained from the `start` endpoint.
        - name: mode
          in: path
          required: true
          schema:

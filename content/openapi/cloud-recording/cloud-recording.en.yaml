                layoutConfig:
                  - uid: "1"
                    x_axis: 0.1
                    y_axis: 0.1
                    width: 0.1
                    height: 0.1
                    alpha: 1
                    render_mode: 1
                  - uid: "2"
                    x_axis: 0.2
                    y_axis: 0.2
                    width: 0.1
                    height: 0.1
                    alpha: 1
                    render_mode: 1
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session-response"
              example:
                cname: string
                uid: string
                resourceId: string
                sid: string
        default:
          $ref: "#/components/responses/not-200"
  /v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/query:
    get:
      summary: Query status
      description: Queries the current status of a cloud recording task.
      x-docs-sections:
        - position: after-description
          markdown: After starting a recording, call this endpoint to query its current status.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful.


            - If the returned status code is not `200`, the request failed. See [Response status
            codes](/en/api-reference/api-ref/cloud-recording/status-codes) for troubleshooting.
        - markdown: |-
            ```json
            {
                "cname": "httpClient463224",
                "uid": "527841",
                "resourceId": "JyvK8nXHuV1BE.....",
                "sid": "38f8e3c.....",
                "serverResponse": {
                  "status": 0,
                  "extensionServiceState": [
                    {
                      "payload": {
                        "fileList": [
                          {
                            "filename": "xxx.m3u8",
                            "sliceStartTime": 0
                          }
                        ],
                        "onhold": true,
                        "state": "inProgress"
                      },
                      "serviceName": "web_recorder_service"
                    }
                  ]
                }
              }
            ```

            ```json
            {
                "code": 62,
                "reason": "request timeout"
              }
            ```
          position: after-response-example
          title: Response example
      operationId: query-cloud-recording
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request GET \
                --url https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/query \
                --header 'Authorization: Basic <credentials>'
        - lang: python
          label: Python
          source: |-
            import requests

              url = "https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/query"
              headers = {
                  "Authorization": "Basic <credentials>"
              }

              response = requests.get(url, headers=headers)

              print(response.status_code)
              print(response.json())
        - lang: javascript
          label: Node.js
          source: |-
            const axios = require('axios');

              const url = 'https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/query';
              const headers = {
                'Authorization': 'Basic <credentials>'
              };

              axios.get(url, { headers })
                .then(response => {

        - lang: python
          label: Python
          source: |-
            import requests
              import json

              url = "https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/stop"
              headers = {
                  "Authorization": "Basic <credentials>",
                  "Content-Type": "application/json"

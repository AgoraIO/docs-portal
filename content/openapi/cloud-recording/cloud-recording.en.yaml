  /v1/ncs/ip:
    get:
      summary: Query message notification server IP addresses
      description: Queries the IP address or IP address list of the message notification server.
      x-docs-sections:
        - position: after-description
          markdown: >-
            The Agora message notification service notifies your server of Cloud Recording events
            through HTTPS requests. Agora dynamically adjusts the IP addresses of the message
            notification server. Call this endpoint regularly and update your firewall configuration
            whenever the addresses change.
        - title: Request
          position: after-parameters
          markdown: "- This endpoint has no path parameters or request body."
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. Only the `primaryIP`
            field in the response body is relevant; the response header and all other fields can be
            ignored.


            - If the returned status code is not `200`, the request failed. See [Response status
            codes](/en/realtime-media/cloud-recording/reference/common-errors#status-codes) for troubleshooting.
      operationId: get-ncs-ip
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request GET \
                --url https://api.sd-rtn.com/v1/ncs/ip \
                --header 'Authorization: Basic <credentials>'
        - lang: python
          label: Python
          source: |-
            import requests

              url = "https://api.sd-rtn.com/v1/ncs/ip"
              headers = {
                  "Authorization": "Basic <credentials>"
              }

              response = requests.get(url, headers=headers)

              print(response.status_code)
              print(response.json())
        - lang: javascript
          label: Node.js
          source: |-
            const axios = require('axios');

              const url = 'https://api.sd-rtn.com/v1/ncs/ip';
              const headers = {
                'Authorization': 'Basic <credentials>'
              };

              axios.get(url, { headers })
                .then(response => {
                  console.log('Status:', response.status);
                  console.log('Data:', response.data);
                })
                .catch(error => {
                  console.error('Error:', error.response ? error.response.data : error.message);
                });
      x-docs-callouts:
        - markdown: >-
            Query the IP addresses at least once every 24 hours and update your firewall whitelist
            automatically to avoid interruptions in notification delivery.
          position: after-description
          title: Note
          type: info
      responses:
        "200":
          $ref: "#/components/responses/ncs-ip"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Cloud Recording REST APIs use Basic HTTP authentication. Generate a Base64-encoded
        credential from your customer ID and customer secret, and send it in the `Authorization`
        header.
  parameters:
    Content-Type:
      name: Content-Type
      in: header
      required: false
      schema:
        type: string
        default: application/json
      description: "`application/json`."
    appid:
      name: appid
      in: path
      required: true
      schema:
        type: string
      description: >-
        The App ID of your project.

        - For web page recording mode, enter the App ID for which the cloud recording service is
        enabled.

        - For individual and composite recording modes, use the same App ID as the channel to be
        recorded. Ensure that the cloud recording service has been enabled for this App ID.
    resourceid:
      name: resourceid
      in: path
      required: true
      schema:
        type: string
      description: The resource ID obtained from the `acquire` endpoint.
    sid:
      name: sid
      in: path
      required: true
      schema:
        type: string
      description: The recording ID obtained from the `start` endpoint.
    mode:
      name: mode
      in: path
      required: true
      schema:
        type: string
        enum:
          - individual
          - mix
          - web
      description: |-
        The recording mode:
        - `individual`: Individual recording mode.
        - `mix`: Composite recording mode.
        - `web`: Web page recording mode.
  responses:
    not-200:
      description: >-
        The request failed. If the HTTP status code is not `200`, see the Cloud Recording response
        status codes for troubleshooting.
    ncs-ip:
      description: The request succeeded. You only need to use the `primaryIP` field in the response body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ncs-ip-response"
          example:
            data:
              service:
                hosts:
                  - primaryIP: xxx.xxx.xxx.xxx
                  - primaryIP: xxx.xxx.xxx.xxx
  schemas:
    acquire-request:
      type: object
      required:
        - cname
        - uid
        - clientRequest
      properties:
        cname:
          $ref: "#/components/schemas/cname"
          description: |-
            The channel name.

             - In individual recording and composite recording modes, this is the name of the channel to be recorded.
             - In web page recording mode, this field differentiates the recording process. The string length cannot exceed 1024 bytes.

             A unique recording instance is identified by appid, cname, and uid. To record the same channel multiple times, use the same appId and cname but different uid values.
        uid:
          $ref: "#/components/schemas/uid"
          description: >-
            The UID used by the cloud recording service in the channel to identify itself. For
            example, "527841". The value must meet these conditions:

             - In the range from 1 to (2³²−1), and cannot be 0.
             - Must not duplicate any UID already in the channel.
             - Must be an integer value enclosed in quotes; all users in the channel must use integer UIDs.
        clientRequest:
          type: object
          properties:
            scene:
              type: integer
              default: 0
              description: |-
                The use case for the cloud recording resource:
                - `0`: Real-time audio and video recording.
                - `1`: Web page recording.
            resourceExpiredHour:
              type: number
              default: 72
              minimum: 1
              maximum: 720
              description: >-
                The validity period (hours) for calling the cloud recording RESTful API. The
                countdown starts after the cloud recording service starts and the `sid` (recording
                ID) is obtained.

                 After timeout, you cannot call the `query`, `update`, `updateLayout`, or `stop` methods.
            startParameter:
              $ref: "#/components/schemas/acquire-startParameter"
              description: |-
                Optional start parameters that improve availability and load balancing.

                Set this field to improve availability and optimize load balancing.
            excludeResourceIds:
              type: array
              description: >-
                The `resourceId` values of other recording tasks to exclude, so that the new task
                uses resources from a different region. Used for cross-regional multi-stream
                recording. See Multi-channel task assurance.
              items:
                type: string
            region:
              type: string
              description: >-
                Restricts the cloud recording service to a specific region. By default, the service
                uses the region of the server where the request originates. Once set, the service
                does not access servers outside this region.

                - `"CN"`: Mainland China.

                - `"AP"`: Asia excluding Mainland China.

                - `"EU"`: Europe.

                - `"NA"`: North America.

                 When calling `start`, the `region` of the third-party cloud storage must match this value.
    acquire-startParameter:
      allOf:
        - $ref: "#/components/schemas/client-request"
      x-docs-callouts:
        - type: info
          title: Note
          markdown: >
            Values must be valid and consistent with the `clientRequest` in the subsequent
            [`start`](start) request body; otherwise the `start` request returns an error.
      description: Set this field to improve availability and optimize load balancing.
    start-clientRequest:
      allOf:
        - $ref: "#/components/schemas/client-request"
      x-docs-callouts:
        - type: info
          title: Note
          markdown: >
            Values must be valid and consistent with the `startParameter` in the
            [`acquire`](acquire) request body; otherwise the `start` request returns an error.
      description: Set this field to improve availability and optimize load balancing.
    client-request:
      type: object
      required:
        - storageConfig
      properties:
        token:
          type: string
          description: >-
            A dynamic key used for authentication. Required if your project has enabled the App
            Certificate. See Token authentication for details.

             Only required in individual recording and composite recording modes. Cloud recording does not support token updates, so ensure the token validity period is longer than your expected recording duration to prevent the task from exiting the channel prematurely.
        storageConfig:
          $ref: "#/components/schemas/storageConfig"
          description: Configuration for third-party cloud storage.
        recordingConfig:
          $ref: "#/components/schemas/recordingConfig"
        recordingFileConfig:
          $ref: "#/components/schemas/recordingFileConfig"
        snapshotConfig:
          $ref: "#/components/schemas/snapshotConfig"
        extensionServiceConfig:
          $ref: "#/components/schemas/extensionServiceConfig"
    storageConfig:
      type: object
      description: >-
        Updates the third-party cloud storage configuration. Use this to refresh an expiring
        `stsToken`.
      required:
        - vendor
        - region
        - bucket
        - accessKey
        - secretKey
      properties:
        vendor:
          type: integer
          description: |-
            Third-party cloud storage platform:
            - `1`: Amazon S3
            - `2`: Alibaba Cloud
            - `3`: Tencent Cloud
            - `5`: Microsoft Azure
            - `6`: Google Cloud
            - `7`: Huawei Cloud
            - `8`: Baidu IntelligentCloud
            - `11`: S3-compatible storage. Specify the domain name in `extensionParams.endpoint`.
        region:
          type: integer
          description: The region of the third-party cloud storage.
          x-docs-callouts:
            - type: info
              title: Note
              markdown: >
                To ensure upload success and real-time performance, the cloud storage region must
                match the region of the server where you initiate the request. See [Third-party
                cloud storage regions](/en/realtime-media/cloud-recording/reference/region-vendor).
        bucket:
          type: string
          description: >-
            The cloud storage bucket name. Must comply with the naming rules of the corresponding
            cloud storage service.
        accessKey:
          type: string
          description: The access key for the third-party cloud storage.
        secretKey:
          type: string
          description: The secret key for the third-party cloud storage.
        stsToken:
          type: string
          description: >-
            A temporary security token issued by the cloud provider's Security Token Service (STS),
            granting limited access to cloud storage resources.

             Currently supported only for Amazon S3 (`1`), Alibaba Cloud (`2`), and Tencent Cloud (`3`).
        stsExpiration:
          type: integer
          description: >-
            The `stsToken` expiration time as a Unix timestamp in seconds.

            - Use Uint64 storage to avoid timestamp overflow.

            - Set the longest possible validity period when applying the token. The minimum validity
            period is 4 hours.

            - If the recording task runs longer than 1 hour, reapply a new `stsToken` every 60
            minutes and call `update` again to refresh the `storageConfig`.
        fileNamePrefix:
          type: array
          description: >-
            The storage path prefix for recorded files. For example, setting
            `["directory1","directory2"]` results in a file name prefix of `directory1/directory2/`.
            The total prefix length, including slashes, cannot exceed 128 characters. Supported
            characters: lowercase letters `a-z`, uppercase letters `A-Z`, digits `0-9`.
          items:
            type: string
        extensionParams:
          $ref: "#/components/schemas/extensionParams"
    extensionParams:
      type: object
      description: >-
        Encryption and tagging settings applied to uploaded recording files by the cloud storage
        service.
      required:
        - sse
        - tag
      properties:
        sse:
          type: string
          description: >-
            The encryption mode for uploaded files. Applicable to Amazon S3 only. See the Amazon S3
            documentation.

            - `kms`: KMS encryption.

            - `aes256`: AES256 encryption.
        tag:
          type: string
          description: Tag content applied to uploaded files. Applicable to Alibaba Cloud and Amazon S3 only.
        endpoint:
          type: string
          description: >-
            The domain name for S3 protocol cloud storage. This field is required when you set
            `vendor` to `11`.
    recordingConfig:
      type: object
      description: >-
        Configuration for recorded audio and video streams. Set this object in individual and
        composite recording modes.
      required:
        - channelType
      properties:
        channelType:
          type: integer
          default: 0
          description: |-
            The channel profile:
            - `0`: Communication.
            - `1`: Live streaming.

             Must match the channel profile set in the Agora RTC SDK.
        decryptionMode:
          type: integer
          default: 0
          description: |-
            The decryption mode, required if channel encryption is enabled in the SDK client:
            - `0`: No encryption.
            - `1`: AES_128_XTS.
            - `2`: AES_128_ECB.
            - `3`: AES_256_XTS.
            - `4`: SM4_128_ECB.
            - `5`: AES_128_GCM.
            - `6`: AES_256_GCM.
            - `7`: AES_128_GCM2. Requires setting `secret` and `salt`.
            - `8`: AES_256_GCM2. Requires setting `secret` and `salt`.
        secret:
          type: string
          description: The encryption key. Required when `decryptionMode` is not `0`.
        salt:
          type: string
          description: >-
            The encryption salt. Base64-encoded, 32 bytes. Required when `decryptionMode` is `7` or
            `8`.
        maxIdleTime:
          type: integer
          default: 30
          minimum: 5
          maximum: 2592000
          description: >-
            Maximum channel idle time, in seconds. The recording service exits after the channel is
            idle for longer than this value.
        streamTypes:
          type: integer
          default: 2
          description: |-
            The type of media stream to subscribe to:
            - `0`: Audio only.
            - `1`: Video only.
            - `2`: Audio and video.
        videoStreamType:
          type: integer
          default: 0
          description: |-
            The remote video stream type to subscribe to when dual-stream mode is enabled:
            - `0`: High-quality video stream (high resolution and high bitrate).
            - `1`: Low-quality video stream (low resolution and low bitrate).
        subscribeAudioUids:
          $ref: "#/components/schemas/uid-list"
          description: >-
            Audio UIDs to subscribe to. Use `["#allstream#"]` to subscribe to all audio streams. Do
            not set together with `unsubscribeAudioUids`.


            Audio streams to subscribe to. The array length cannot exceed 32. Set to ["#allstream#"]
            to subscribe to all UIDs. Cannot be set together with unsubscribeAudioUids.

             Only applicable when streamTypes is 0 or 2. If a subscription list is set for only one media type, the service will not subscribe to the other type.
        unsubscribeAudioUids:
          $ref: "#/components/schemas/uid-list"
          description: >-
            Audio UIDs not to subscribe to. Do not set together with `subscribeAudioUids`.


            Audio streams to exclude. The service subscribes to all other UIDs. The array length
            cannot exceed 32. Cannot be set together with subscribeAudioUids.
        subscribeVideoUids:
          $ref: "#/components/schemas/uid-list"
          description: >-
            Video UIDs to subscribe to. Use `["#allstream#"]` to subscribe to all video streams. Do
            not set together with `unsubscribeVideoUids`.


            Video streams to subscribe to. The array length cannot exceed 32. Set to ["#allstream#"]
            to subscribe to all UIDs. Cannot be set together with unsubscribeVideoUids.

             Only applicable when streamTypes is 1 or 2. If a subscription list is set for only one media type, the service will not subscribe to the other type.
        unsubscribeVideoUids:
          $ref: "#/components/schemas/uid-list"
          description: >-
            Video UIDs not to subscribe to. Do not set together with `subscribeVideoUids`.


            Video streams to exclude. The service subscribes to all other UIDs. The array length
            cannot exceed 32. Cannot be set together with subscribeVideoUids.
        subscribeUidGroup:
          type: integer
          description: |-
            Estimated peak number of subscribed UIDs. Required in individual recording mode.
            - `0`: 1–2 UIDs.
            - `1`: 3–7 UIDs.
            - `2`: 8–12 UIDs.
            - `3`: 13–17 UIDs.
            - `4`: 18–32 UIDs.
            - `5`: 33–49 UIDs.

             For example, if `subscribeVideoUids` is `["100","101","102"]` and `subscribeAudioUids` is `["101","102","103"]`, the subscriber count is 4.
        streamMode:
          type: string
          default: default
          description: >-
            Output mode of the media stream. Only applicable in individual recording mode. See Media
            streaming output modes.

            - `"default"`: Audio transcoding generates separate M3U8 audio and video index files.

            - `"standard"`: Generates separate M3U8 audio and video index files, plus a merged
            audio-and-video index file. If VP8 encoding is used on the Web client, a merged MPD file
            is generated instead.

            - `"original"`: Original encoding mode for individual non-transcoding audio recording.
            Only takes effect when `streamTypes` is `0`. No transcoding occurs; generates an M3U8
            audio index file.
        audioProfile:
          type: integer
          default: 0
          description: >-
            Audio output sampling rate, bitrate, encoding mode, and channel count. Only applicable
            in composite recording mode.

            - `0`: 48 kHz, music encoding, mono, ~48 Kbps.

            - `1`: 48 kHz, music encoding, mono, ~128 Kbps.

            - `2`: 48 kHz, music encoding, stereo, ~192 Kbps.
        transcodingConfig:
          $ref: "#/components/schemas/transcodingConfig"
    transcodingConfig:
      type: object
      description: >-
        Transcoded video output settings. Only applicable in composite recording mode. See Set the
        video profile.
      properties:
        width:
          type: integer
          default: 360
          description: Video width in pixels. `width` × `height` cannot exceed 1920 × 1080.
        height:
          type: integer
          default: 640
          description: Video height in pixels. `width` × `height` cannot exceed 1920 × 1080.
        fps:
          type: integer
          default: 15
          description: Video frame rate in fps.
        bitrate:
          type: integer
          default: 500
          description: Video bitrate in Kbps.
        maxResolutionUid:
          type: string
          description: >-
            The UID of the large video window in vertical layout. Must be an integer from 1 to
            (2³²−1), cannot be `0`. Only required in vertical layout.
        mixedVideoLayout:
          $ref: "#/components/schemas/mixedVideoLayout"
        backgroundColor:
          $ref: "#/components/schemas/backgroundColor"
        backgroundImage:
          type: string
          description: >-
            URL of the canvas background image. Displayed in cropped mode: the image is scaled
            proportionally until the canvas is filled, and excess edges are cropped.
        defaultUserBackgroundImage:
          type: string
          description: >-
            URL of the default background image shown when a user stops sending video for more than
            3.5 seconds. Overridden if a per-UID background image is set in `backgroundConfig`.
        layoutConfig:
          $ref: "#/components/schemas/layoutConfig"
        backgroundConfig:
          $ref: "#/components/schemas/backgroundConfig"
    mixedVideoLayout:
      type: integer
      default: 0
      description: >-
        Composite video layout:


        - `0`: Floating layout. The first user to join fills the entire canvas; other users appear
        as small windows arranged horizontally from bottom to top, up to 4 rows of 4 windows (17
        windows total).

        - `1`: Adaptive layout. All user windows are equal in size, automatically adjusted based on
        user count. Supports up to 17 windows.

        - `2`: Vertical layout. The `maxResolutionUid` user appears in a large window on the left;
        other users are arranged in up to two columns on the right, 8 windows per column (17 windows
        total).

        - `3`: Custom layout. Configure positions using `layoutConfig`.
    backgroundColor:
      type: string
      default: "#000000"
      description: Canvas background color as an RGB hex string (e.g., `"#FF0000"` for red).
    layoutConfig:
      type: array
      maxItems: 17
      description: >-
        Per-user screen layout settings for custom layout. Supports up to 17 users. Only applicable
        when `mixedVideoLayout` is `3`.
      items:
        type: object
        required:
          - x_axis
          - y_axis
          - width
          - height
        properties:
          uid:
            type: string
            description: >-
              The UID of the user assigned to this layout region. If not specified, layout regions
              are assigned in the order users join the channel.
          x_axis:
            type: number
            minimum: 0
            maximum: 1
            description: >-
              Horizontal coordinate of the region's upper-left corner as a relative value (6 decimal
              places). `0.0` is the far left, `1.0` is the far right.
          y_axis:
            type: number
            minimum: 0
            maximum: 1
            description: >-
              Vertical coordinate of the region's upper-left corner as a relative value (6 decimal
              places). `0.0` is the top, `1.0` is the bottom.
          width:
            type: number
            minimum: 0
            maximum: 1
            description: Relative width of the region (6 decimal places).
          height:
            type: number
            minimum: 0
            maximum: 1
            description: Relative height of the region (6 decimal places).
          alpha:
            type: number
            default: 1
            minimum: 0
            maximum: 1
            description: >-
              Transparency of the user's video window. `0.0` is fully transparent, `1.0` is fully
              opaque.
          render_mode:
            type: integer
            default: 0
            description: >-
              Display mode for the user's video window:


              - `0`: Cropped mode. The window is filled; video is scaled proportionally and cropped
              at the edges if the aspect ratio differs.

              - `1`: Fit mode. All video content is visible; the video is scaled proportionally and
              black borders may appear.
    backgroundConfig:
      type: array
      description: Per-user background image settings.
      items:
        type: object
        required:
          - uid
          - image_url
        properties:
          uid:
            type: string
            description: The UID of the user.
          image_url:
            type: string
            description: >-
              The URL of the user's background image, shown when the user stops sending video for
              more than 3.5 seconds. Supports HTTPS, JPG and BMP formats, maximum 6 MB. Settings
              take effect only after the image is successfully downloaded.
          render_mode:
            type: integer
            default: 0
            description: >-
              Display mode for the background image:


              - `0`: Cropped mode. The window is filled; image is scaled proportionally and cropped
              at the edges if the aspect ratio differs.

              - `1`: Fit mode. All image content is visible; the image is scaled proportionally and
              black borders may appear.
    recordingFileConfig:
      type: object
      properties:
        avFileType:
          type: array
          default:
            - hls
          description: |-
            The type of recorded video files:
            - `"hls"`: M3U8 and TS files.
            - `"mp4"`: MP4 files.

             In individual recording mode (non-screenshot-only), use the default value. In composite recording and web page recording modes, set to `["hls","mp4"]` to generate MP4 files. Setting to `["mp4"]` alone causes an error. In composite recording mode, a new MP4 file is created when the current file exceeds ~2 hours or ~2 GB. In web page recording mode, a new MP4 file is created when the current file exceeds `maxVideoDuration`.
          items:
            type: string
            enum:
              - hls
              - mp4
      x-docs-callouts:
        - type: info
          title: Note
          markdown: >
            Cannot be set when taking screenshots only. Required in all other cases including
            individual recording (without transcoding, with transcoding, or simultaneous recording
            and screenshots), composite recording, and web page recording.
      description: Configuration for recorded files.
    snapshotConfig:
      type: object
      required:
        - fileType
      properties:
        captureInterval:
          type: integer
          default: 10
          minimum: 5
          maximum: 3600
          description: Screenshot capture interval in seconds.
        fileType:
          type: array
          description: Screenshot file format. Currently only `jpg` is supported.
          items:
            type: string
            enum:
              - jpg
      description: >-
        Screenshot capture settings. Only applicable in individual recording mode.

        - Screenshots can be taken separately or simultaneously with recording. See Capture
        screenshots.

        - If the recording service or the recording upload service malfunctions, the screenshot may
        fail. Recording is not affected if the screenshot malfunctions.

        - `streamTypes` must be `1` or `2`. If `subscribeAudioUids` is set, `subscribeVideoUids`
        must also be set.
    extensionServiceConfig:
      type: object
      description: Configuration for extended services. Only applicable in web page recording mode.
      required:
        - extensionServices
      properties:
        errorHandlePolicy:
          type: string
          default: error_abort
          description: >-
            Error handling policy. Currently only `"error_abort"` is supported: when an error occurs
            in an extension service, all other non-extension services (such as stream subscription)
            also stop.
        extensionServices:
          type: array
          items:
            type: object
            required:
              - serviceName
              - serviceParam
            properties:
              serviceName:
                type: string
                description: |-
                  Name of the extension service:
                  - `"web_recorder_service"`: Web page recording.
                  - `"rtmp_publish_service"`: Push web page recording to CDN.
              errorHandlePolicy:
                type: string
                description: >-
                  Error handling policy within the extension service:

                  - `"error_abort"`: Default for web page recording. Stops other extension services
                  when this service encounters an error.

                  - `"error_ignore"`: Default for CDN push. Other extension services are unaffected
                  when this service encounters an error.

                   Errors in the page recording service will cause CDN push to fail, but errors in the CDN push service do not affect page recording
              serviceParam:
                $ref: "#/components/schemas/serviceParam"
    serviceParam:
      type: object
      description: Specific configuration for the extension service.
      required:
        - url
        - audioProfile
        - videoWidth
        - videoHeight
        - maxRecordingHour
      properties:
        url:
          type: string
          description: The URL of the page to record.
        audioProfile:
          type: integer
          description: |-
            Audio output sampling rate, bitrate, encoding mode, and channel count:
            - `0`: 48 kHz, music encoding, mono, ~48 Kbps.
            - `1`: 48 kHz, music encoding, mono, ~128 Kbps.
            - `2`: 48 kHz, music encoding, stereo, ~192 Kbps.
        videoWidth:
          type: integer
          description: Output video width in pixels. `videoWidth` × `videoHeight` must not exceed 1920 × 1080.
        videoHeight:
          type: integer
          description: Output video height in pixels. `videoWidth` × `videoHeight` must not exceed 1920 × 1080.
        maxRecordingHour:
          type: integer
          minimum: 1
          maximum: 720
          description: Maximum web page recording duration, in hours.
        videoBitrate:
          type: integer
          description: Output video bitrate in Kbps.
        videoFps:
          type: integer
          default: 15
          minimum: 5
          maximum: 60
          description: Output video frame rate in fps.
        mobile:
          type: boolean
          default: false
          description: Whether to enable mobile web mode.
        maxVideoDuration:
          type: integer
          default: 120
          minimum: 30
          maximum: 240
          description: >-
            Maximum MP4 file duration in minutes. A new MP4 file is created when the current file
            exceeds this duration.
        onhold:
          type: boolean
          default: false
          description: >-
            Whether to start the recording in a paused state:

            - `true`: The service opens and renders the page but does not generate slice files. Call
            `update` with `onhold: false` to resume.

            - `false`: Recording starts immediately.

             To pause and resume reliably, wait for each `update` response before sending the next one.
        readyTimeout:
          type: integer
          default: 0
          minimum: 0
          maximum: 60
          description: Page load timeout in seconds.
        outputs:
          type: array
          description: CDN output settings for web page recording push.
          items:
            type: object
            properties:
              rtmpUrl:
                type: string
                description: CDN address to which the stream is pushed.
        container:
          type: object
          properties:
            format:
              type: string
              description: Container format, such as `mp4`, `mp3`, `m4a`, or `aac`.
            sampleRate:
              type: string
              description: Audio sampling rate in Hz.
            bitrate:
              type: string
              description: Audio bitrate in Kbps.
            channels:
              type: string
              description: Number of audio channels.
    start-request:
      type: object
      required:
        - cname
        - uid
        - clientRequest
      properties:
        cname:
          $ref: "#/components/schemas/cname"
          description: The name of the channel to record. Must match the `cname` used in the `acquire` request.
        uid:
          $ref: "#/components/schemas/uid"
          description: >-
            The UID used by the cloud recording service in the channel. Must match the `uid` used in
            the `acquire` request.
        clientRequest:
          $ref: "#/components/schemas/start-clientRequest"
    update-request:
      type: object
      required:
        - cname
        - uid
        - clientRequest
      properties:
        cname:
          $ref: "#/components/schemas/cname"
        uid:
          $ref: "#/components/schemas/uid"
        clientRequest:
          $ref: "#/components/schemas/update-clientRequest"
    update-clientRequest:
      type: object
      properties:
        streamSubscribe:
          $ref: "#/components/schemas/streamSubscribe"
        webRecordingConfig:
          $ref: "#/components/schemas/webRecordingConfig"
        rtmpPublishConfig:
          $ref: "#/components/schemas/rtmpPublishConfig"
        storageConfig:
          $ref: "#/components/schemas/storageConfig"
    streamSubscribe:
      type: object
      description: >-
        Updates the subscription lists. Only applicable in individual recording and composite
        recording modes.
      properties:
        audioUidList:
          $ref: "#/components/schemas/audioUidList"
        videoUidList:
          $ref: "#/components/schemas/videoUidList"
    audioUidList:
      type: object
      properties:
        subscribeAudioUids:
          $ref: "#/components/schemas/uid-list"
          description: >-
            Audio streams to subscribe to. The array length cannot exceed 32. Set to ["#allstream#"]
            to subscribe to all UIDs. Cannot be set together with unsubscribeAudioUids.
        unsubscribeAudioUids:
          $ref: "#/components/schemas/uid-list"
      description: The audio subscription list. Only applicable when `streamTypes` is `0` or `2`.
    videoUidList:
      type: object
      properties:
        subscribeVideoUids:
          $ref: "#/components/schemas/uid-list"
          description: >-
            Video streams to subscribe to. The array length cannot exceed 32. Set to ["#allstream#"]
            to subscribe to all UIDs. Cannot be set together with unsubscribeVideoUids.
        unsubscribeVideoUids:
          $ref: "#/components/schemas/uid-list"
      description: The video subscription list. Only applicable when `streamTypes` is `1` or `2`.
    webRecordingConfig:
      type: object
      properties:
        onhold:
          type: boolean
          default: false
          description: >-
            Whether to pause web page recording. `true` pauses recording and file generation.
            `false` resumes recording.
      description: Updates web page recording settings. Only applicable in web page recording mode.
    rtmpPublishConfig:
      type: object
      properties:
        outputs:
          type: array
          items:
            type: object
            properties:
              rtmpUrl:
                type: string
                description: >-
                  The CDN URL to push the stream to. Only RTMP and RTMPS protocols are supported. A
                  maximum of one stream can be pushed to CDN at a time.
      description: Updates the CDN push configuration. Only applicable when pushing web page recording to CDN.
    updateLayout-request:
      type: object
      required:
        - cname
        - uid
        - clientRequest
      properties:
        cname:
          $ref: "#/components/schemas/cname"
          description: >-
            The name of the channel being recorded. Must match the `cname` used in the `acquire`
            request.
        uid:
          $ref: "#/components/schemas/uid"
          description: >-
            The UID used by the cloud recording service in the channel. Must match the `uid` used in
            the `acquire` request.
        clientRequest:
          $ref: "#/components/schemas/updateLayout-clientRequest"
    updateLayout-clientRequest:
      type: object
      properties:
        maxResolutionUid:
          type: string
          description: >-
            The UID of the large video window in vertical layout. Must be an integer from 1 to
            (2³²−1), cannot be `0`. Only required when `mixedVideoLayout` is `2`.
        mixedVideoLayout:
          $ref: "#/components/schemas/mixedVideoLayout"
        backgroundColor:
          $ref: "#/components/schemas/backgroundColor"
        backgroundImage:
          type: string
          description: >-
            URL of the canvas background image. Displayed in cropped mode: the image is scaled
            proportionally until the canvas is filled, and excess edges are cropped.
        defaultUserBackgroundImage:
          type: string
          description: >-
            URL of the default background image shown when a user stops sending video for more than
            3.5 seconds. Overridden if a per-UID background image is set in `backgroundConfig`.
        layoutConfig:
          $ref: "#/components/schemas/layoutConfig"
        backgroundConfig:
          $ref: "#/components/schemas/backgroundConfig"
    stop-request:
      type: object
      required:
        - cname
        - uid
        - clientRequest
      properties:
        cname:
          $ref: "#/components/schemas/cname"
        uid:
          $ref: "#/components/schemas/uid"
        clientRequest:
          type: object
          properties:
            async_stop:
              type: boolean
              default: false
              description: >-
                The response mechanism for the `stop` request:

                - `true`: Asynchronous. Returns a response immediately after the request is
                received, without waiting for the recording files to finish uploading.

                - `false`: Synchronous. Returns a response only after all recorded files have been
                uploaded to third-party cloud storage. Agora expects the upload to complete within
                20 seconds. If it exceeds this limit, the response returns error code `50`.
    acquire-response:
      allOf:
        - $ref: "#/components/schemas/base-session"
        - type: object
          properties:
            resourceId:
              type: string
              description: >-
                The cloud recording resource ID. Use this to start a cloud recording session. Valid
                for five minutes; re-request if expired.
    start-response:
      allOf:
        - $ref: "#/components/schemas/session-response"
    session-response:
      allOf:
        - $ref: "#/components/schemas/base-session"
        - type: object
          properties:
            resourceId:
              type: string
              description: >-
                The cloud recording resource ID. Valid for five minutes; re-request from `acquire`
                if expired.


                The resource ID used by cloud recording.
            sid:
              type: string
              description: >-
                The recording ID. Uniquely identifies a recording session. Generated after the cloud
                recording service starts successfully.


                The recording ID, identifying the current recording session.
    query-response:
      allOf:
        - $ref: "#/components/schemas/session-response"
        - type: object
          properties:
            serverResponse:
              $ref: "#/components/schemas/query-serverResponse"
    query-serverResponse:
      type: object
      description: >-
        The recording status. The fields returned vary depending on the recording mode and whether
        screenshot capture is enabled.
      properties:
        status:
          type: integer
          description: |-
            Current status of the cloud service:
            - `0`: Not started.
            - `1`: Initialization complete.
            - `2`: Components starting.
            - `3`: Some components ready.
            - `4`: All components ready.
            - `5`: In progress.
            - `6`: Stop requested.
            - `7`: All components stopped.
            - `8`: Exited.
            - `20`: Exited abnormally.
        extensionServiceState:
          $ref: "#/components/schemas/extensionServiceState"
        sliceStartTime:
          type: integer
          description: >-
            Recording start time, Unix timestamp in milliseconds. Only returned in individual
            recording mode.
        fileListMode:
          type: string
          description: >-
            Data format of `fileList`. Only returned in individual and composite recording modes
            when screenshot capture is not enabled.

            - `"string"`: In composite recording mode when `avFileType` is `["hls"]`.

            - `"json"`: When `avFileType` is `["hls","mp4"]` in individual or composite recording
            mode.
        fileList:
          oneOf:
            - $ref: "#/components/schemas/fileList-string"
            - $ref: "#/components/schemas/fileList-json"
          description: >-
            The recorded files. Only returned in individual and composite recording modes when
            screenshot capture is not enabled. When `fileListMode` is `"string"`, this is the
            filename of the M3U8 file. When `fileListMode` is `"json"`, this is an array of objects
            with the following fields:
    extensionServiceState:
      type: array
      items:
        type: object
        properties:
          payload:
            $ref: "#/components/schemas/payload"
          serviceName:
            type: string
            description: |-
              Extension service name:
              - `"web_recorder_service"`: Web page recording service.
              - `"rtmp_publish_service"`: CDN push service.
      description: State of each extension service. Only returned in web page recording mode.
    payload:
      type: object
      properties:
        fileList:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
                description: Name of the M3U8 or MP4 file.
              sliceStartTime:
                type: integer
                description: Recording start time of the file, Unix timestamp in seconds.
          description: Files generated during recording. Only returned by `web_recorder_service`.
        onhold:
          type: boolean
          description: >-
            Whether recording is paused. `true` if paused, `false` if running. Only returned by
            `web_recorder_service`.
        state:
          type: string
          description: |-
            Upload status:
            - `"init"`: Initializing.
            - `"inProgress"`: Running.
            - `"exit"`: Stopped.
        outputs:
          type: array
          items:
            type: object
            properties:
              rtmpUrl:
                type: string
                description: The CDN address the stream is being pushed to.
              status:
                type: string
                description: |-
                  Push status:
                  - `"connecting"`: Connecting to the CDN server.
                  - `"publishing"`: Push in progress.
                  - `"onhold"`: Push paused.
                  - `"disconnected"`: Failed to connect to the CDN server.
          description: CDN push output status. Only returned by `rtmp_publish_service`.
      description: Service-specific state.
    fileList-string:
      type: string
      description: M3U8 filename generated by recording.
    fileList-json:
      type: array
      description: Array of generated recording file information.
      items:
        type: object
        properties:
          fileName:
            type: string
            description: Name of the M3U8 or MP4 file.
          trackType:
            type: string
            description: |-
              File type:
              - `"audio"`: Audio only.
              - `"video"`: Video only.
              - `"audio_and_video"`: Audio and video.
          uid:
            type: string
            description: The UID whose stream is recorded. In composite recording mode, this is `"0"`.
          mixedAllUser:
            type: boolean
            description: >-
              `true` if all users are recorded in a single file; `false` if each user is recorded
              separately.
          isPlayable:
            type: boolean
            description: "`true` if the file can be played online; `false` if it cannot."
          sliceStartTime:
            type: integer
            description: Recording start time of the file, Unix timestamp in seconds.
    stop-response:
      allOf:
        - $ref: "#/components/schemas/session-response"
        - type: object
          properties:
            serverResponse:
              $ref: "#/components/schemas/stop-serverResponse"
    stop-serverResponse:
      type: object
      properties:
        extensionServiceState:
          type: array
          items:
            type: object
            properties:
              payload:
                $ref: "#/components/schemas/stop-payload"
              serviceName:
                type: string
                description: |-
                  Extension service name:
                  - `"upload_service"`: Upload service.
                  - `"web_recorder_service"`: Web page recording service.
          description: >-
            State of each extension service at the time of stopping. Only returned in web page
            recording mode.
        uploadingStatus:
          type: string
          description: >-
            Upload status of the recording files. Only returned in individual recording mode when
            screenshot capture is enabled, and in individual and composite recording modes when
            screenshot capture is not enabled.

            - `"uploaded"`: All recording files have been uploaded to the specified third-party
            cloud storage.

            - `"backuped"`: All files have been uploaded, but at least one TS file was uploaded to
            Agora backup cloud. The Agora server will automatically continue uploading to the
            designated third-party cloud storage.

            - `"unknown"`: Unknown status.
        fileListMode:
          type: string
          description: >-
            Data format of `fileList`. Only returned in individual and composite recording modes
            when screenshot capture is not enabled.

            - `"string"`: In composite recording mode when `avFileType` is `["hls"]`.

            - `"json"`: When `avFileType` is `["hls","mp4"]` in individual or composite recording
            mode.
        fileList:
          oneOf:
            - $ref: "#/components/schemas/fileList-string"
            - $ref: "#/components/schemas/fileList-json"
          description: >-
            The recorded files. Only returned in individual and composite recording modes when
            screenshot capture is not enabled. When `fileListMode` is `"string"`, this is the
            filename of the M3U8 file. When `fileListMode` is `"json"`, this is an array of objects
            with the following fields:
      description: >-
        The recording stop status. The fields returned vary depending on the recording mode and
        whether screenshot capture is enabled.
    stop-payload:
      type: object
      properties:
        uploadingStatus:
          type: string
          description: >-
            Upload status of the recording files. Only returned by `upload_service`.

            - `"uploaded"`: All recording files have been uploaded to the specified third-party
            cloud storage.

            - `"backuped"`: All files have been uploaded, but at least one TS file was uploaded to
            Agora backup cloud. The Agora server will automatically continue uploading to the
            designated third-party cloud storage.

            - `"unknown"`: Unknown status.
        fileList:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
                description: Name of the M3U8 or MP4 file.
              sliceStartTime:
                type: integer
                description: Recording start time of the file, Unix timestamp in seconds.
          description: Files generated during recording. Only returned by `web_recorder_service`.
        onhold:
          type: boolean
          description: >-
            Whether recording was paused at the time of stopping. `true` if paused, `false` if
            running. Only returned by `web_recorder_service`.
        state:
          type: string
          description: |-
            Upload status of the extension service. Only returned by `web_recorder_service`.
            - `"init"`: Initializing.
            - `"inProgress"`: Running.
            - `"exit"`: Stopped.
      description: Service-specific state at the time of stopping.
    ncs-ip-response:
      type: object
      properties:
        data:
          type: object
          properties:
            service:
              type: object
              properties:
                hosts:
                  type: array
                  items:
                    type: object
                    properties:
                      primaryIP:
                        type: string
                        description: IP address of the Agora message notification server.
    base-session:
      type: object
      properties:
        cname:
          $ref: "#/components/schemas/cname"
          description: |-
            The name of the channel to be recorded.

            The name of the channel being recorded.
        uid:
          $ref: "#/components/schemas/uid"
          description: The UID used by the cloud recording service in the RTC channel.
    cname:
      type: string
      description: |-
        The name of the channel to record. Must match the `cname` used in the `acquire` request.
        The name of the channel being recorded.
    uid:
      type: string
      description: >-
        The UID used by the cloud recording service in the channel. Must match the `uid` used in the
        `acquire` request.

        The UID used by the cloud recording service in the RTC channel.
    uid-list:
      type: array
      items:
        type: string
      description: >-
        Video streams to exclude. The service subscribes to all other UIDs. The array length cannot
        exceed 32. Cannot be set together with `subscribeVideoUids`.

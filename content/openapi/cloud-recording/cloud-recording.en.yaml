  /v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/updateLayout:
    post:
      summary: Update layout
      description: Updates the video mixing layout of an active composite recording.
      x-docs-sections:
        - position: after-description
          markdown: >-
            After starting a composite recording, call this endpoint to update the video mixing
            layout.


            - Each call to this endpoint overwrites all previous layout settings. For example, if
            you set `backgroundColor` to `"#FF0000"` when starting a recording and call
            `updateLayout` without setting `backgroundColor` again, the background color reverts to
            the default value `"#000000"`.

            - This endpoint is only valid within an active recording session. If the recording was
            not started successfully or has already ended, the request returns `404`.

            - If you need to call `updateLayout` multiple times in succession, wait for the previous
            response before sending the next request to avoid unexpected results.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful.


            - If the returned status code is not `200`, the request failed. See [Response status
            codes](/en/api-reference/api-ref/cloud-recording/status-codes) for troubleshooting.
        - markdown: |-
            ```json
            {
                "code": 404,
                "reason": "failed to find worker"
              }
            ```
          position: after-response-example
          title: Response example
      operationId: update-cloud-recording-layout
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request POST \
                --url https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/mix/updateLayout \
                --header 'Authorization: Basic <credentials>' \
                --header 'Content-Type: application/json' \
                --data '{
                "cname": "httpClient463224",
                "uid": "527841",
                "clientRequest": {
                  "mixedVideoLayout": 3,
                  "backgroundColor": "#FF0000",
                  "layoutConfig": [
                    {
                      "uid": "1",
                      "x_axis": 0.1,
                      "y_axis": 0.1,
                      "width": 0.1,
                      "height": 0.1,
                      "alpha": 1,
                      "render_mode": 1
                    },
                    {
                      "uid": "2",
                      "x_axis": 0.2,
                      "y_axis": 0.2,
                      "width": 0.1,
                      "height": 0.1,
                      "alpha": 1,
                      "render_mode": 1
                    }
                  ]
                }
              }'
        - lang: python

openapi: 3.1.0
info:
  version: ""
  title: Cloud Recording RESTful API
  description: >-
    Agora Cloud Recording records and saves voice calls, video calls, and interactive streaming
    sessions. Send HTTPS requests from your business server to Agora to acquire recording resources,
    start recording, query recording status, update recording settings, update composite layouts,
    stop recording, and query message notification server IP addresses.


    ## Base URL


    All requests are sent to `https://api.sd-rtn.com`.


    ## Data format


    Use `Content-Type: application/json` for requests with bodies. Request and response bodies are
    JSON.
servers:
  - url: https://api.sd-rtn.com
    description: Cloud Recording REST API host.
security:
  - basicAuth: []
paths:
  /v1/apps/{appid}/cloud_recording/acquire:
    post:
      summary: Acquire a resource ID
      description: Acquires a resource ID for a cloud recording session.
      x-docs-sections:
        - position: after-description
          markdown: >-
            Before starting cloud recording, call this endpoint to get a resource ID. A single
            resource ID can be used for only one recording session.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful.


            - If the returned status code is not `200`, the request failed. See [Response status
            codes](/en/api-reference/api-ref/cloud-recording/status-codes) for troubleshooting.
        - markdown: See Page load timeout detection.
          position: after-response-body
          title: Response
        - markdown: |-
            ```json
            {
                "code": 400,
                "reason": "invalid_appid"
              }
            ```
          position: after-response-example
          title: Response example
      operationId: acquire-cloud-recording-resource
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request POST \
                --url https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/acquire \
                --header 'Authorization: Basic <credentials>' \
                --header 'Content-Type: application/json' \
                --data '{
                "cname": "<your_channel_name>",
                "uid": "527841",
                "clientRequest": {
                  "scene": 0,
                  "resourceExpiredHour": 24
                }
              }'
        - lang: python
          label: Python
          source: |-
            import requests
              import json

              url = "https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/acquire"
              headers = {
                  "Authorization": "Basic <credentials>",
                  "Content-Type": "application/json"
              }

              data = {
                  "cname": "<your_channel_name>",
                  "uid": "527841",
                  "clientRequest": {
                      "scene": 0,
                      "resourceExpiredHour": 24
                  }
              }

              response = requests.post(url, headers=headers, data=json.dumps(data))

              print(response.status_code)
              print(response.json())
        - lang: javascript
          label: Node.js
          source: |-
            const axios = require('axios');

              const url = 'https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/acquire';
              const headers = {
                'Authorization': 'Basic <credentials>',
                'Content-Type': 'application/json'
              };

              const data = {
                cname: "<your_channel_name>",
                uid: "527841",
                clientRequest: {
                  scene: 0,
                  resourceExpiredHour: 24
                }
              };

              axios.post(url, data, { headers })
                .then(response => {
                  console.log('Status:', response.status);
                  console.log('Data:', response.data);
                })
                .catch(error => {
                  console.error('Error:', error.response ? error.response.data : error.message);
                });
      x-docs-callouts:
        - markdown: >-
            - Call `acquire` and `start` requests in pairs.

            - Call [`start`](start) within two seconds of receiving the resource ID. Batch fetching
            resource IDs followed by batch `start` requests may cause failures.

            - The resource ID is valid for five minutes and should be used as soon as possible.
          position: after-description
          title: Note
          type: info
      parameters:
        - $ref: "#/components/parameters/Content-Type"
        - $ref: "#/components/parameters/appid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/acquire-request"
            example:
              cname: httpClient463224
              uid: "527841"
              clientRequest:
                scene: 0
                resourceExpiredHour: 24
      responses:
        "200":
          description: >-
            The request succeeded. If you set `startParameter` in the request body and its value is
            invalid, the `acquire` request can still succeed, but the following `start` request
            returns an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/acquire-response"
              example:
                cname: string
                uid: string
                resourceId: string
        default:
          $ref: "#/components/responses/not-200"
  /v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/mode/{mode}/start:
    post:
      summary: Start a cloud recording task
      description: Starts a cloud recording task with an acquired resource ID.
      x-docs-sections:

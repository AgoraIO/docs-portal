            const axios = require('axios');

              const url = 'https://api.sd-rtn.com/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/stop';
              const headers = {
                'Authorization': 'Basic <credentials>',

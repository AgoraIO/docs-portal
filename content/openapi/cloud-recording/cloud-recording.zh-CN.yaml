openapi: 3.1.0
x-stoplight:
  id: s9kv7mtdlzf60
info:
  version: ''
  title: API 概述
  description: |-
    云端录制是声网针对音视频通话和直播研发的录制组件。你可以通过你的业务服务器向声网服务器发送 HTTP 请求，在服务端进行云端录制：
    - `acquire`：请求获取一个 Resource ID 用于开启云端录制。
    - `start`：获取 Resource ID 的 2 秒内调用 `start` 开始云端录制。在录制过程中，你可以按需调用如下方法：
       - `query`：查询云端录制的状态。
       - `update`：更新录制设置。
       - `updateLayout`：更新合流布局。
    - `stop`：录制完成后，调用 `stop` 离开频道，停止录制。

    > 云端录制不支持在一路录制中完成多个任务。例如，如果你需要同时对某个频道进行单流录制和合流录制，那么需要起两路录制。即，使用两个不同的 `uid` 分别调用 `acquire`，获取两个 `resourceId`，再分别调用 `start` 启动两路录制任务。两路录制均会产生费用。

    为方便你监听云端录制的状态，声网提供[消息通知服务](/zh-CN/realtime-media/cloud-recording/build/monitor-events/enable-ncs)。开通该服务后，你可以通过 Webhook 接收[云端录制相关事件](/zh-CN/realtime-media/cloud-recording/reference/ncs-events)。

    因为声网会动态调整消息通知服务器的 IP 地址，为不影响你接收事件，你需要[定期查询 IP 地址](./get-ncs-ip)并更新防火墙白名单配置。
  contact: {}
  license:
    name: ''
servers:
  - url: 'https://api.sd-rtn.com'
paths:
  '/v1/apps/{appid}/cloud_recording/acquire':
    post:
      summary: 获取云端录制资源
      description: 获取用于云端录制任务的 Resource ID。
      x-docs-sections:
        - position: after-description
          markdown: |-
            `acquire` 方法用于获取云端录制资源。

            在开始云端录制之前，你需要调用 `acquire` 方法获取一个 Resource ID。一个 Resource ID 只能用于一次云端录制服务。
      x-docs-callouts:
        - position: after-description
          markdown: |-
            - `acquire` 和 `start` 的请求需配对调用。
            - 在每次 `acquire` 请求获取到 Resource ID 后的 2 秒内立即发起对应的 [`start`](start) 请求。批量获取 Resource ID 后进行批量 `start` 请求可能导致请求失败。如请求失败，请再次调用 `acquire` 获得一个新的 Resource ID，并用该 Resource ID 再次调用 `start` 方法。
      operationId: acquire-cloud-recording-resource
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/appid'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/acquire-request'
            examples:
              单流或合流录制:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    scene: 0
                    resourceExpiredHour: 24
              页面录制:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    scene: 1
                    resourceExpiredHour: 24
      responses:
        '200':
          description: |
            如果返回的 HTTP 状态码为 `200`，表示请求成功。

            如果你在请求 Body 里设置 `startParameter` object，当其取值不合法时，不影响 `acquire` 请求成功，但是在后续 `start` 请求会收到报错。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/acquire-response'
        非 200:
          $ref: '#/components/responses/not-200'
      servers:
        - url: 'https://api.sd-rtn.com'
      x-stoplight:
        id: r1hure3gxdfj2
      security:
        - Basic Auth: []
  '/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/mode/{mode}/start':
    post:
      summary: 开始云端录制
      description: 开始一个云端录制任务。
      x-docs-sections:
        - position: after-description
          markdown: |-
            `start` 方法用于开始云端录制。

            通过 [`acquire`](acquire) 方法获取云端录制资源后，调用 `start` 方法开始云端录制。
      x-docs-callouts:
        - position: after-description
          markdown: 发起 `start` 请求后，你还需要依据[保障录制成功启动](/zh-CN/realtime-media/cloud-recording/build/optimize-and-operate/recording-status#保障录制成功启动)检查录制服务是否已经成功启动。
      operationId: start-cloud-recording
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/appid'
        - $ref: '#/components/parameters/resourceid'
        - $ref: '#/components/parameters/mode'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/start-request'
            examples:
              单流转码录制:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    token: <your_token>
                    recordingConfig:
                      channelType: 1
                      streamTypes: 2
                      streamMode: default
                      videoStreamType: 0
                      maxIdleTime: 30
                      subscribeAudioUids:
                        - '#allstream#'
                      subscribeVideoUids:
                        - '#allstream#'
                      subscribeUidGroup: 5
                    recordingFileConfig:
                      avFileType:
                        - hls
                    storageConfig:
                      vendor: 2
                      region: 3
                      bucket: <your_storage_bucket>
                      accessKey: <your_storage_access_key>
                      secretKey: <your_storage_secret_key>
                      fileNamePrefix:
                        - quickstart
                      extensionParams:
                        tag: RETENTION_DAYS=30
              单流不转码录制:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    token: <your_token>
                    recordingConfig:
                      channelType: 1
                      streamTypes: 0
                      streamMode: original
                      maxIdleTime: 30
                      subscribeAudioUids:
                        - '#allstream#'
                      subscribeUidGroup: 5
                    recordingFileConfig:
                      avFileType:
                        - hls
                    storageConfig:
                      vendor: 2
                      region: 3
                      bucket: <your_storage_bucket>
                      accessKey: <your_storage_access_key>
                      secretKey: <your_storage_secret_key>
                      fileNamePrefix:
                        - quickstart
              云端截图:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    token: <your_token>
                    recordingConfig:
                      channelType: 1
                      streamTypes: 2
                      streamMode: default
                      videoStreamType: 0
                      maxIdleTime: 30
                      subscribeAudioUids:
                        - '#allstream#'
                      subscribeVideoUids:
                        - '#allstream#'
                      subscribeUidGroup: 5
                    snapshotConfig:
                      captureInterval: 5
                      fileType:
                        - jpg
                    storageConfig:
                      vendor: 2
                      region: 3
                      bucket: <your_storage_bucket>
                      accessKey: <your_storage_access_key>
                      secretKey: <your_storage_secret_key>
                      fileNamePrefix:
                        - quickstart
              单流录制且云端截图:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    token: <your_token>
                    recordingConfig:
                      channelType: 1
                      streamTypes: 2
                      streamMode: default
                      videoStreamType: 0
                      maxIdleTime: 30
                      subscribeAudioUids:
                        - '#allstream#'
                      subscribeVideoUids:
                        - '#allstream#'
                      subscribeUidGroup: 5
                    recordingFileConfig:
                      avFileType:
                        - hls
                    snapshotConfig:
                      captureInterval: 5
                      fileType:
                        - jpg
                    storageConfig:
                      vendor: 2
                      region: 3
                      bucket: <your_storage_bucket>
                      accessKey: <your_storage_access_key>
                      secretKey: <your_storage_secret_key>
                      fileNamePrefix:
                        - quickstart
              合流录制:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    token: <your_token>
                    recordingConfig:
                      channelType: 1
                      streamTypes: 2
                      audioProfile: 2
                      videoStreamType: 0
                      maxIdleTime: 30
                      transcodingConfig:
                        width: 640
                        height: 360
                        fps: 15
                        bitrate: 500
                        mixedVideoLayout: 0
                        backgroundColor: '#000000'
                      subscribeVideoUids:
                        - '#allstream#'
                      subscribeAudioUids:
                        - '#allstream#'
                    recordingFileConfig:
                      avFileType:
                        - hls
                        - mp4
                    storageConfig:
                      vendor: 2
                      region: 3
                      bucket: <your_storage_bucket>
                      accessKey: <your_storage_access_key>
                      secretKey: <your_storage_secret_key>
                      fileNamePrefix:
                        - quickstart
              页面录制:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    token: <your_token>
                    extensionServiceConfig:
                      extensionServices:
                        - serviceName: web_recorder_service
                          serviceParam:
                            audioProfile: 2
                            maxRecordingHour: 1
                            url: <your_url_to_be_recorded>
                            videoHeight: 720
                            videoWidth: 1280
                    recordingFileConfig:
                      avFileType:
                        - hls
                        - mp4
                    storageConfig:
                      vendor: 2
                      region: 3
                      bucket: <your_storage_bucket>
                      accessKey: <your_storage_access_key>
                      secretKey: <your_storage_secret_key>
                      fileNamePrefix:
                        - quickstart
              页面录制且转推到 CDN:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    token: <your_token>
                    extensionServiceConfig:
                      extensionServices:
                        - serviceName: web_recorder_service
                          serviceParam:
                            audioProfile: 2
                            maxRecordingHour: 1
                            url: <your_url_to_be_recorded>
                            videoHeight: 720
                            videoWidth: 1280
                        - serviceName: rtmp_publish_service
                          serviceParam:
                            outputs:
                              - rtmpUrl: <your_cdn_url>
                    recordingFileConfig:
                      avFileType:
                        - hls
                        - mp4
                    storageConfig:
                      vendor: 2
                      region: 3
                      bucket: <your_storage_bucket>
                      accessKey: <your_storage_access_key>
                      secretKey: <your_storage_secret_key>
                      fileNamePrefix:
                        - quickstart
      responses:
        '200':
          description: |-
            如果返回的 HTTP 状态码为 `200`，表示请求成功。

            如需检查录制服务是否已经成功启动，请参考[监控录制状态](/zh-CN/realtime-media/cloud-recording/build/optimize-and-operate/recording-status)操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  cname:
                    $ref: '#/components/schemas/cname-r'
                  uid:
                    $ref: '#/components/schemas/uid-r'
                  resourceId:
                    $ref: '#/components/schemas/resourceId-r'
                  sid:
                    type: string
                    description: 录制 ID。成功开始云端录制后，你会得到一个 Sid （录制 ID）。该 ID 是一次录制周期的唯一标识。
        非 200:
          $ref: '#/components/responses/not-200'
      servers:
        - url: 'https://api.sd-rtn.com'
      x-stoplight:
        id: 9a191gkqbwdjn
      security:
        - Basic Auth: []
  '/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/update':
    post:
      summary: 更新云端录制设置
      description: 更新进行中的云端录制任务设置。
      x-docs-sections:
        - position: after-description
          markdown: |-
            `update` 方法用于更新云端录制设置。

            开始录制后，你可以调用 `update` 方法更新如下录制配置：

            - 对单流录制和合流录制，更新订阅名单。
            - 对页面录制，设置暂停/恢复页面录制，或更新页面录制转推到 CDN 的推流地址（URL）。
      x-docs-callouts:
        - position: after-description
          markdown: |-
            - `update` 请求仅在会话内有效。如果录制启动错误，或录制已结束，调用 `update` 将返回 `404`。
            - 如果需要连续调用 `update` 方法更新录制设置，请在收到上一次 `update` 响应后再进行调用，否则可能导致请求结果与预期不一致。
      operationId: update-cloud-recording
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/appid'
        - $ref: '#/components/parameters/resourceid'
        - $ref: '#/components/parameters/sid'
        - $ref: '#/components/parameters/mode'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-request'
            examples:
              更新单流或合流录制订阅名单:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    streamSubscribe:
                      audioUidList:
                        subscribeAudioUids:
                          - '#allstream#'
                      videoUidList:
                        unSubscribeVideoUids:
                          - <uid1_to_be_unsubscribed>
                          - <uid2_to_be_unsubscribed>
              更新页面录制设置:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    webRecordingConfig:
                      onhold: false
              更新页面录制转推设置:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    rtmpPublishConfig:
                      outputs:
                        - rtmpUrl: your_new_cdn_url
      responses:
        '200':
          description: 如果返回的 HTTP 状态码为 `200`，表示请求成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  cname:
                    $ref: '#/components/schemas/cname-r'
                  uid:
                    $ref: '#/components/schemas/uid-r'
                  resourceId:
                    type: string
                    description: 云端录制使用的 Resource ID。
                  sid:
                    type: string
                    description: 录制 ID。标识每次录制周期。
        非 200:
          $ref: '#/components/responses/not-200'
      servers:
        - url: 'https://api.sd-rtn.com'
      x-stoplight:
        id: qxk6ze5fo2irr
      security:
        - Basic Auth: []
  '/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/updateLayout':
    post:
      summary: 更新云端录制合流布局
      description: 更新进行中的合流录制任务布局。
      x-docs-sections:
        - position: after-description
          markdown: |-
            `updateLayout` 方法用于更新云端录制合流布局。

            开始合流录制后，你可以调用该方法（`updateLayout`）更新合流布局。

            每次调用该方法都会覆盖原来的布局设置。例如，在开始录制时设置了 `backgroundColor` 为 `"#FF0000"`（红色），如果调用 `updateLayout` 方法更新合流布局时如果不再设置 `backgroundColor` 字段，背景色就会变为黑色（默认值）。
      x-docs-callouts:
        - position: after-description
          markdown: |-
            - `updateLayout` 请求仅在会话内有效。如果录制启动错误，或录制已结束，调用 `updateLayout` 将返回 `404`。
            - 如果需要连续调用 `updateLayout` 方法更新合流布局，请在收到上一次 `updateLayout` 响应后再进行调用，否则可能导致请求结果与预期不一致。
      operationId: update-cloud-recording-layout
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/appid'
        - $ref: '#/components/parameters/resourceid'
        - $ref: '#/components/parameters/sid'
        - name: mode
          in: path
          description: '录制模式。只支持 `mix`，代表[合流录制模式](/zh-CN/realtime-media/cloud-recording/build/recording-modes/mix-mode/set-composite)。'
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateLayout-request'
            examples:
              更新两个用户的合流布局:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    mixedVideoLayout: 3
                    backgroundColor: '#FF0000'
                    layoutConfig:
                      - uid: <uid1_to_be_mixed>
                        x_axis: 0.1
                        y_axis: 0.1
                        width: 0.1
                        height: 0.1
                        alpha: 1
                        render_mode: 1
                      - uid: <uid2_to_be_mixed>
                        x_axis: 0.2
                        y_axis: 0.2
                        width: 0.1
                        height: 0.1
                        alpha: 1
                        render_mode: 1
      responses:
        '200':
          description: 如果返回的 HTTP 状态码为 `200`，表示请求成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  cname:
                    $ref: '#/components/schemas/cname-r'
                  uid:
                    $ref: '#/components/schemas/uid-r'
                  resourceId:
                    type: string
                    description: 云端录制使用的 Resource ID。
                  sid:
                    type: string
                    description: 录制 ID。标识一次录制周期。
        非 200:
          $ref: '#/components/responses/not-200'
      servers:
        - url: 'https://api.sd-rtn.com'
      x-stoplight:
        id: irkwr9gysxbc2
      security:
        - Basic Auth: []
  '/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/query':
    get:
      summary: 查询云端录制状态
      description: 查询云端录制任务的当前状态。
      x-docs-sections:
        - position: after-description
          markdown: |-
            `query` 方法用于查询云端录制状态。

            开始录制后，你可以调用 `query` 方法查询录制状态。
      x-docs-callouts:
        - position: after-description
          markdown: '`query` 请求仅在会话内有效。如果录制启动错误，或录制已结束，调用 `query` 将返回 `404`。'
      operationId: query-cloud-recording
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/appid'
        - $ref: '#/components/parameters/resourceid'
        - $ref: '#/components/parameters/sid'
        - $ref: '#/components/parameters/mode'
      responses:
        '200':
          description: 如果返回的 HTTP 状态码为 `200`，表示请求成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/query-response'
        非 200:
          $ref: '#/components/responses/not-200'
      servers:
        - url: 'https://api.sd-rtn.com'
      x-stoplight:
        id: popx4rhwm38lg
      security:
        - Basic Auth: []
  '/v1/apps/{appid}/cloud_recording/resourceid/{resourceid}/sid/{sid}/mode/{mode}/stop':
    post:
      summary: 停止云端录制
      description: 停止一个云端录制任务。
      x-docs-sections:
        - position: after-description
          markdown: |-
            `stop` 方法用于停止云端录制。

            开始录制后，你可以调用 `stop` 方法离开频道，停止录制。录制停止后如需再次录制，必须再调用 `acquire` 方法请求一个新的 Resource ID。
      x-docs-callouts:
        - position: after-description
          markdown: |-
            - `stop` 请求仅在会话内有效。如果录制启动错误，或录制已结束，调用 `stop` 将返回 `404`。
            - 非页面录制模式下，当频道空闲（无用户）超过预设时间（默认为 30 秒） 后，云端录制也会自动退出频道，停止录制。
            - 录制结束后，正常情况下录制文件会在 20 分钟内上传至第三方云存储，但在网络异常等特殊情况下上传时间会达到 24 小时以上。
      operationId: stop-cloud-recording
      parameters:
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/appid'
        - $ref: '#/components/parameters/resourceid'
        - $ref: '#/components/parameters/sid'
        - $ref: '#/components/parameters/mode'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stop-request'
            examples:
              Example 1:
                value:
                  cname: <your_channel_name>
                  uid: <unique_user_id>
                  clientRequest:
                    async_stop: false
      responses:
        '200':
          description: 如果返回的 HTTP 状态码为 `200`，表示请求成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stop-response'
        非 200:
          $ref: '#/components/responses/not-200'
      servers:
        - url: 'https://api.sd-rtn.com'
      x-stoplight:
        id: jxiide7pvb4gf
      security:
        - Basic Auth: []
  /v2/ncs/ip:
    get:
      summary: 查询消息通知服务器 IP
      description: 查询消息通知服务器的 IP 地址。
      x-docs-sections:
        - position: after-description
          markdown: |-
            查询消息通知服务器的 IP 地址或 IP 地址列表。

            开通消息通知服务后，声网消息通知服务可以将云端录制业务中的发生的一些事件以 HTTPS 请求的方式通知到你的服务器。声网会动态调整消息通知服务器的 IP 地址，周期为 24 小时。你可以通过本方法查询 IP 地址。查询后，你需要将 IP 地址（或 IP 地址列表）添加到白名单中。
      x-docs-callouts:
        - position: after-description
          markdown: 我们强烈推荐你至少每 24 小时进行一次查询，并自动更新防火墙配置，否则可能会影响你接收通知。
      operationId: get-ncs-ip
      responses:
        '200':
          $ref: '#/components/responses/ncs-ip'
      servers:
        - url: 'https://api.sd-rtn.com'
      x-stoplight:
        id: 18b5elyncvyip
      security:
        - Basic Auth: []
components:
  parameters:
    appid:
      name: appid
      in: path
      description: '你的项目使用的 [App ID](/zh-CN/realtime-media/cloud-recording/build/setup-and-access/enable-service#获取-app-id)。<li>对于页面录制模式，只需输入开通了云端录制服务的 App ID。</li><li>对于单流和合流录制模式，必须使用和待录制的频道相同的 App ID，且该 App ID 需要开通云端录制服务。</li>'
      required: true
      schema:
        type: string
    resourceid:
      name: resourceid
      in: path
      description: '通过 [`acquire`](./acquire) 请求获取到的 Resource ID。'
      required: true
      schema:
        type: string
    sid:
      name: sid
      in: path
      description: '通过 [`start`](./start) 获取的录制 ID。'
      required: true
      schema:
        type: string
    mode:
      name: mode
      in: path
      description: '录制模式：<li>`individual`：[单流录制模式](/zh-CN/realtime-media/cloud-recording/build/recording-modes/individual-mode/set-individual)。</li><li>`mix`：[合流录制模式](/zh-CN/realtime-media/cloud-recording/build/recording-modes/mix-mode/set-composite)。</li><li>`web`：[页面录制模式](/zh-CN/realtime-media/cloud-recording/build/recording-modes/web-mode/set-webpage-recording)。</li>'
      required: true
      schema:
        type: string
    Content-Type:
      name: Content-Type
      in: header
      description: '`application/json`。'
      required: false
      schema:
        type: string
  securitySchemes:
    Basic Auth:
      type: http
      description: '声网云端录制 RESTful API 仅支持 HTTPS 协议。发送请求时，你需要使用声网提供的客户 ID 和客户密钥生成 Base64 编码凭证，并填入请求头部的 `Authorization` 字段中。详见[实现 HTTP 基本认证](/zh-CN/realtime-media/cloud-recording/build/setup-and-access/http-basic-auth)。'
      scheme: basic
  responses:
    not-200:
      description: '如果 HTTP 状态码不为 `200`，请参考[响应状态码](/zh-CN/realtime-media/cloud-recording/reference/response-code)排查问题。'
    ncs-ip:
      description: |-
        如果返回的 HTTP 状态码为 200，表示请求成功。

        你只需关心响应 Body 中的 `PrimaryIP` 字段，无需关心响应 Header 以及响应 Body 中的其他字段。
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  service:
                    type: object
                    properties:
                      hosts:
                        type: array
                        items:
                          type: object
                          properties:
                            primaryIP:
                              type: string
                              description: 声网消息通知服务器的 IP 地址。
          examples:
            Example 1:
              value:
                data:
                  service:
                    hosts:
                      - primaryIP: xxx.xxx.xxx.xxx
                      - primaryIP: xxx.xxx.xxx.xxx
  schemas:
    acquire-request:
      type: object
      x-stoplight:
        id: hfj9gl8rzk9uu
      required:
        - cname
        - uid
        - clientRequest
      properties:
        cname:
          type: string
          description: |-
            频道名：
            - 对于单流录制和合流录制模式，该字段用于设置待录制的频道名。
            - 对于页面录制模式，该字段用于区分录制进程。字符串长度不得超过 128 字节。
            **注意**：通过 `appid`、`cname` 和 `uid` 可以定位一个唯一的录制实例。因此，如果你想针对同一个频道进行多次录制，可以使用相同的 `appId` 和 `cname`，以及不同的 `uid` 来进行管理和区分。
        uid:
          type: string
          description: |-
            字符串内容为云端录制服务在频道内使用的 UID，用于标识频道内的录制服务，例如 `"527841"`。字符串内容需满足以下条件：
            - 取值范围 1 到 (2<sup>32</sup>-1)，不可设置为 `0`。
            - 不能与当前频道内的任何 UID 重复。
            - 字段引号内为整型 UID，且频道内所有用户均使用整型 UID。
        clientRequest:
          type: object
          properties:
            scene:
              type: number
              description: |-
                云端录制资源使用场景：
                - `0`：单流录制、合流录制。
                - `1`：页面录制。
              default: 0
            resourceExpiredHour:
              type: number
              description: |-
                云端录制 RESTful API 的调用时效。从成功开启云端录制并获得 `sid` （录制 ID）后开始计算。单位为小时。
                <br>**注意**：超时后，你将无法调用 `query`，`update`，`updateLayout` 和 `stop` 方法。</br>
              minimum: 1
              maximum: 720
              default: 72
            excludeResourceIds:
              type: array
              description: '另一路或几路录制任务的 `resourceId`。该字段用于排除指定的录制资源，以便新发起的录制任务可以使用新区域的资源，实现跨区域多路录制。详见[多路任务保障](/zh-CN/realtime-media/cloud-recording/build/optimize-and-operate/rest-availability#多路任务保障)。'
              items:
                type: string
            regionAffinity:
              type: number
              description: |-
                指定使用某个区域的资源进行录制。支持取值如下：
                - `0`: 根据发起请求的区域就近调用资源。
                - `1`: 中国。
                - `2`: 东南亚。
                - `3`: 欧洲。
                - `4`: 北美。
                **注意**：
                - 为加速录制文件上传，当你使用的云存储区域和你发起请求的区域不同时，建议你将该字段设为云存储区域。
                - 指定区域可用容量不足时，会依据地理位置就近溢出。
              default: 0
            startParameter:
              $ref: '#/components/schemas/client-request'                
    client-request:
      description: |
        设置该字段后，可以提升可用性并优化负载均衡。
        > 如果填写该字段，则必须确保 `startParameter` object 和后续 `start` 请求中填写的 `clientRequest` object 完全一致，且取值合法，否则 `start` 请求会收到报错。
      type: object
      title: object
      x-stoplight:
        id: m8z4a3vq3n7vq
      required:
        - storageConfig
      properties:
        token:
          type: string
          description: |
            用于鉴权的动态密钥（Token）。如果你的项目已启用 App 证书，则务必在该字段中传入你项目的动态密钥。详见[使用 Token 鉴权](/zh-CN/realtime-media/rtc/build/setup-and-access/token-authentication)。
            <p><b>注意</b>：
            <li>仅需在<b>单流录制</b>和<b>合流录制</b>模式下设置。</li>
            <li>云端录制服务暂不支持更新 Token。为保证录制正常，请确保 Token 有效时长大于你预计的录制时长，以避免 Token 过期导致录制任务退出频道而结束录制。</li>
            </p>
        storageConfig:
          $ref: '#/components/schemas/storageConfig'
        recordingConfig:
          $ref: '#/components/schemas/recordingConfig'
        recordingFileConfig:
          $ref: '#/components/schemas/recordingFileConfig'
        snapshotConfig:
          $ref: '#/components/schemas/snapshotConfig'
        extensionServiceConfig:
          $ref: '#/components/schemas/extensionServiceConfig'
    storageConfig:
      type: object
      description: 第三方云存储的配置项。
      x-stoplight:
        id: pwaphntw0gqxq
      required:
        - vendor
        - region
        - bucket
        - accessKey
        - secretKey
      properties:
        vendor:
          type: number
          description: |-
            第三方云存储平台。
            - `1`：[Amazon S3](https://aws.amazon.com/cn/s3/?c=s&sec=srv)
            - `2`：[阿里云](https://www.aliyun.com/product/oss)
            - `3`：[腾讯云](https://cloud.tencent.com/product/cos)
            - `5`：[Microsoft Azure](https://azure.microsoft.com/zh-cn/products/storage/blobs/)
            - `6`：[谷歌云](https://cloud.google.com/storage)
            - `7`：[华为云](https://www.huaweicloud.com/product/obs.html)
            - `8`：[百度智能云](https://cloud.baidu.com/product/bos.html)
            - `11`：其他 S3 协议云存储（如 Digital Ocean、MinIO 及部分自建云存储）。你需要在 `extensionParams.endpoint` 字段中指定 S3 协议云存储的域名。 
        region:
          type: number
          description: |-
            第三方云存储指定的地区信息。
            > 为确保录制文件上传的成功率和实时性，第三方云存储的 `region` 与你发起请求的应用服务器必须在同一个区域中。例如：你发起请求的 App 服务器在中国大陆地区，则第三方云存储需要设置为中国大陆区域内。详见[第三方存储地区说明](/zh-CN/realtime-media/cloud-recording/reference/api-reference)。
        bucket:
          type: string
          description: 第三方云存储的 Bucket。Bucket 名称需要符合对应第三方云存储服务的命名规则。
        accessKey:
          type: string
          description: 第三方云存储的 Access Key（访问密钥）。
        secretKey:
          type: string
          description: 第三方云存储的 Secret Key。
        stsToken:
          type: string
          description: |
            第三方云存储的临时安全令牌。该令牌由云服务商的安全令牌服务 (Security Token Service, STS) 临时颁发，用于授予第三方云存储资源的有限访问权限。
            >- 目前支持的云服务商仅包括，`1`：Amazon S3，`2`：阿里云，`3`：腾讯云。
        stsExpiration:
          type: number
          description: |
            用于标记 `stsToken` 的过期时间戳，POSIX 时间，单位为秒。
            >- 为避免时间戳溢出问题，建议使用 Uint64 存储。
            >- 建议在申请 `stsToken` 时设置尽可能长的有效期，最短有效期需不少于 4 小时，并需要在过期前调用 `update` 方法更新 `stsToken` 的值
            >- 如录制任务持续时间超过 1 小时，需每 60 分钟重新申请 `stsToken`，并调用 `update` 更新 `storageConfig` 中的相关参数。
        fileNamePrefix:
          type: array
          description: |-
            录制文件在第三方云存储中的存储位置，与录制文件名前缀有关。如果设为 `["directory1","directory2"]`，那么录制文件名前缀为 `"directory1/directory2/"`，即录制文件名为 `directory1/directory2/xxx.m3u8`。前缀长度（包括斜杠）不得超过 128 个字符。字符串中不得出现斜杠、下划线、括号等符号字符。以下为支持的字符集范围：
            - 26 个小写英文字母 a~z
            - 26 个大写英文字母 A~Z
            - 10 个数字 0-9
          items:
            type: string
        extensionParams:
          $ref: '#/components/schemas/extensionParams'
    extensionParams:
      type: object
      description: 第三方云存储服务会按照该字段设置对已上传的录制文件进行加密和打标签。
      x-stoplight:
        id: mi9j0pliq0a24
      properties:
        sse:
          type: string
          description: |-
            加密模式。设置该字段后，第三方云存储服务会按照该加密模式将已上传的录制文件进行加密。该字段仅适用于 Amazon S3，详见 [Amazon S3 官方文档](https://docs.aws.amazon.com/zh_cn/AmazonS3/latest/userguide/UsingEncryption.html)。
            - `kms`：KMS 加密。
            - `aes256`：AES256 加密。
        tag:
          type: string
          description: '标签内容。设置该字段后，第三方云存储服务会按照该标签内容将已上传的录制文件进行打标签操作。该字段仅适用于阿里云和 Amazon S3，详见[阿里云官方文档](https://help.aliyun.com/zh/oss/developer-reference/object-tagging-10?spm=a2c4g.11186623.help-menu-31815.d_5_3_2_2_26.7732131cSR2ojD)和 [Amazon S3 官方文档](https://docs.aws.amazon.com/zh_cn/AmazonS3/latest/userguide/object-tagging.html)。'
        endpoint:
          type: string
          description: S3 协议云存储的域名。当 `vendor` 设为 `11` 时，该字段为必填。
    recordingConfig:
      type: object
      description: |-
        录制的音视频流配置项。
        <p><b>注意：</b>仅需在<b>单流录制</b>和<b>合流录制</b>模式下设置。</p>
      properties:
        channelType:
          type: number
          description: |-
            频道场景。
            - `0`：通信场景。
            - `1`：直播场景。
            > 频道场景必须与声网 RTC SDK 的设置一致，否则可能导致问题。
          default: 0
        decryptionMode:
          type: number
          description: |-
            解密模式。如果你在 SDK 客户端设置了频道加密，那么你需要对云端录制服务设置与加密相同的解密模式。
            - `0`：不加密。
            - `1`：AES_128_XTS 加密模式。128 位 AES 加密，XTS 模式。
            - `2`：AES_128_ECB 加密模式。128 位 AES 加密，ECB 模式。
            - `3`：AES_256_XTS 加密模式。256 位 AES 加密，XTS 模式。
            - `4`：SM4_128_ECB 加密模式。128 位 SM4 加密，ECB 模式。
            - `5`：AES_128_GCM 加密模式。128 位 AES 加密，GCM 模式。
            - `6`：AES_256_GCM 加密模式。256 位 AES 加密，GCM 模式。
            - `7`：AES_128_GCM2 加密模式。128 位 AES 加密，GCM 模式。相比于 AES_128_GCM 加密模式，AES_128_GCM2 加密模式安全性更高且需要设置密钥和盐。
            - `8`：AES_256_GCM2 加密模式。256 位 AES 加密，GCM 模式。相比于 AES_256_GCM 加密模式，AES_256_GCM2 加密模式安全性更高且需要设置密钥和盐。
          default: 0
        secret:
          type: string
          description: 与加解密相关的密钥。仅需在 `decryptionMode` 非 `0` 时设置。
        salt:
          type: string
          description: 与加解密相关的盐。Base64 编码、32 位字节。仅需在 `decryptionMode` 为 `7` 或 `8` 时设置。
        maxIdleTime:
          type: number
          description: |-
            最大频道空闲时间。单位为秒。最大值不超过 30 天。超出最大频道空闲时间后，录制服务会自动退出。录制服务退出后，如果你再次发起 `start` 请求，会产生新的录制文件。
            <p>频道空闲：直播频道内无任何主播，或通信频道内无任何用户。</p>
          minimum: 5
          maximum: 2592000
          default: 30
        streamTypes:
          type: number
          description: |-
            订阅的媒体流类型。
            - `0`：仅订阅音频。适用于智能语音审核场景。
            - `1`：仅订阅视频。
            - `2`：订阅音频和视频。
          default: 2
        videoStreamType:
          type: number
          description: |-
            设置订阅的视频流类型。如果你在 SDK 客户端开启了双流模式，你可以选择订阅视频大流或者小流。
            - `0`：视频大流，即高分辨率高码率的视频流
            - `1`：视频小流，即低分辨率低码率的视频流
          default: 0
        subscribeAudioUids:
          $ref: '#/components/schemas/sub-audio-uid'
        unSubscribeAudioUids:
          $ref: '#/components/schemas/unsub-audio-uid'
        subscribeVideoUids:
          $ref: '#/components/schemas/sub-video-uid'
        unSubscribeVideoUids:
          $ref: '#/components/schemas/unsub-video-uid'
        subscribeUidGroup:
          type: number
          description: |-
            预估的订阅人数峰值。
            - `0`：1 到 2 个 UID。
            - `1`：3 到 7 个 UID。
            - `2`：8 到 12 个 UID。
            - `3`：13 到 17 个 UID。
            - `4`：18 到 32 个 UID。
            - `5`：33 到 49 个 UID。
            > - 仅需在**单流录制**模式下设置，且单流录制模式下必填。
            > - 举例来说，如果 `subscribeVideoUids` 为 `["100","101","102"]`，`subscribeAudioUids` 为 `["101","102","103"]`，则订阅人数为 4 人。
        streamMode:
          type: string
          description: |-
            媒体流的输出模式。详见[媒体流输出模式](/zh-CN/realtime-media/cloud-recording/reference/api-reference#媒体流输出模式设置)。
            - `"default"`：默认模式。录制过程中音频转码，分别生成 M3U8 音频索引文件和视频索引文件。
            - `"standard"`：标准模式。声网推荐使用该模式。录制过程中音频转码，分别生成 M3U8 音频索引文件、视频索引文件和合并的音视频索引文件。如果在 Web 端使用 VP8 编码，则生成一个合并的 MPD 音视频索引文件。
            - `"original"`：原始编码模式。适用于[单流音频不转码录制](/zh-CN/realtime-media/cloud-recording/build/recording-modes/individual-mode/set-individual-without-transcoding)。仅订阅音频时（`streamTypes` 为 0）时该字段生效，录制过程中音频不转码，生成 M3U8 音频索引文件。
            > 仅需在**单流录制**模式下设置。
          default: default
        audioProfile:
          type: number
          description: |-
            设置输出音频的采样率、码率、编码模式和声道数。
            - `0`：48 kHz 采样率，音乐编码，单声道，编码码率约 48 Kbps。
            - `1`：48 kHz 采样率，音乐编码，单声道，编码码率约 128 Kbps。
            - `2`：48 kHz 采样率，音乐编码，双声道，编码码率约 192 Kbps。
            > 仅需在**合流录制**模式下设置。
          default: 0
        transcodingConfig:
          $ref: '#/components/schemas/transcodingConfig'
      required:
        - channelType
      x-stoplight:
        id: evg1ymlit9qhk
    sub-audio-uid:
      type: array
      title: sub-audio-uid
      description: |-
        指定订阅哪几个 UID 的音频流。如需订阅全部 UID 的音频流，则无需设置该字段。数组长度不得超过 32，不推荐使用空数组。该字段和 `unSubscribeAudioUids` 只能设一个。详见[设置订阅名单](/zh-CN/realtime-media/cloud-recording/reference/api-reference#订阅名单设置)。
        <p><b>注意：</b>
        <li>该字段仅适用于 <b>streamTypes</b> 设为音频，或音频和视频的情况。</li>
        <li>如果你设置了音频的订阅名单，但没有设置视频的订阅名单，云端录制服务不会订阅任何视频流。反之亦然。</li>
        <li>设为 <b>["#allstream#"]</b> 可订阅频道内所有 UID 的音频流。</li>
        </p>
      items:
        type: string
      x-stoplight:
        id: pgdeizxz1nhxb
    unsub-audio-uid:
      type: array
      title: unsub-audio-uid
      description: '指定不订阅哪几个 UID 的音频流。云端录制会订阅频道内除指定 UID 外所有 UID 的音频流。数组长度不得超过 32，不推荐使用空数组。该字段和 `subscribeAudioUids` 只能设一个。详见[设置订阅名单](/zh-CN/realtime-media/cloud-recording/reference/api-reference#订阅名单设置)。'
      items:
        type: string
      x-stoplight:
        id: 7lyalnl22ldu7
    sub-video-uid:
      type: array
      title: sub-video-uid
      description: |-
        指定订阅哪几个 UID 的视频流。如需订阅全部 UID 的视频流，则无需设置该字段。数组长度不得超过 32，不推荐使用空数组。该字段和 `unSubscribeVideoUids` 只能设一个。详见[设置订阅名单](/zh-CN/realtime-media/cloud-recording/reference/api-reference#订阅名单设置)。
        <p><b>注意：</b>
        <li>该字段仅适用于 <b>streamTypes</b> 设为视频，或音频和视频的情况。</li>
        <li>如果你设置了视频的订阅名单，但没有设置音频的订阅名单，云端录制服务不会订阅任何音频流。反之亦然。</li>
        <li>设为 <b>["#allstream#"]</b> 可订阅频道内所有 UID 的视频流。</li>
        </p>
      items:
        type: string
      x-stoplight:
        id: vnjjaxtb92i78
    unsub-video-uid:
      type: array
      title: unsub-video-uid

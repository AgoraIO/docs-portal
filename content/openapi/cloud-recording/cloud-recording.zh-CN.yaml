          - image_url
      x-stoplight:
        id: rufta9imdfs3v
    recordingFileConfig:
      type: object
      description: |-
        录制文件配置项。
        <p><b>注意</b>：<b>仅截图时不可设置</b>该字段，其他情况都需要设置该字段。其他情况包含如下：
        <li>单流录制模式下，不转码录制，转码录制，或同时录制和截图。</li>
        <li>合流录制。</li>
        <li>页面录制模式下，仅页面录制，或同时页面录制和转推到 CDN。</li>
        </p>
      properties:
        avFileType:
          type: array
          description: |-
            录制生成的视频文件类型：
            - `"hls"`：默认值。M3U8 和 TS 文件。
            - `"mp4"`：MP4 文件。
            > - **单流录制**模式下，且**非仅截图**情况，使用默认值即可。
            > - **合流录制**和**页面录制**模式下，如果你需要生成 MP4 文件，那么设为 `["hls","mp4"]`。仅设为 `["mp4"]` 会收到报错。设置后，录制文件行为如下：
            >   - 合流录制模式：录制服务会在当前 MP4 文件时长超过约 2 小时或文件大小超过约 2 GB 左右时，创建一个新的 MP4 文件。
            >   - 页面录制模式：录制服务会在当前 MP4 文件时长超过 `maxVideoDuration` 时，创建一个新的 MP4 文件。
          items:
            type: string
            default: hls
      x-stoplight:
        id: n4id1zg8bh86q
    snapshotConfig:
      type: object
      description: |-
        云端截图配置项。<p><b>注意：</b>仅需在<b>单流录制</b>模式下，且使用截图功能时设置。</p>
        **截图**使用须知：
        - 截图功能仅适用于单流录制模式（`individual`）。
        - 你可以在一个单流录制进程中仅截图，或同时录制和截图，详见[云端截图](/zh-CN/realtime-media/cloud-recording/build/recording-modes/snapshot)。同时录制和截图的情况需要设置 `recordingFileConfig` 字段。
        - 如果录制服务或录制上传服务异常，则截图失败。截图异常时，录制不受影响。
        - 使用截图时，`streamTypes` 必须设置为 1 或 2。如果设置了 `subscribeAudioUid`，则必须同时设置 `subscribeVideoUids`。
      properties:
        captureInterval:

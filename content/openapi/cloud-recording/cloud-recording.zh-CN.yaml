        id: 6c9th6l3w4syi
    render_mode:
      type: number
      title: render_mode
      description: |-
        画面显示模式：
        - `0`：裁剪模式。优先保证画面被填满。视频尺寸等比缩放，直至整个画面被视频填满。如果视频长宽与显示窗口不同，则视频流会按照画面设置的比例进行周边裁剪后填满画面。
        - `1`：缩放模式。优先保证视频内容全部显示。视频尺寸等比缩放，直至视频窗口的一边与画面边框对齐。如果视频尺寸与画面尺寸不一致，在保持长宽比的前提下，将视频进行缩放后填满画面，缩放后的视频四周会有一圈黑边。
      default: 0
      x-stoplight:
        id: q6467wa7cr4jk
    backgroundConfig-new:
      type: array
      title: backgroundConfig-new
      description: 用户的背景图设置。
      items:
        type: object
        properties:
          uid:
            type: string
            description: 字符串内容为用户 UID。
          image_url:
            type: string
            description: |-
              该用户的背景图 URL。配置背景图后，当该⽤户停止发送视频流超过 3.5 秒，画⾯将切换为该背景图。
              
              URL 支持 HTTP 和 HTTPS 协议，图片格式支持 JPG 和 BMP。图片大小不得超过 6 MB。录制服务成功下载图片后，设置才会生效；如果下载失败，则设置不⽣效。不同字段设置可能会互相覆盖，具体规则详见[设置背景色或背景图](/zh-CN/realtime-media/cloud-recording/build/recording-modes/mix-mode/set-composite-layout#进阶设置背景色或背景图)。

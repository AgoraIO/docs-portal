          description: 云端录制定期截图的截图周期。单位为秒。
          minimum: 5
          maximum: 3600
          default: 10
        fileType:
          type: array
          description: '截图的文件格式。目前只支持 `["jpg"]`，即生成 JPG 格式的截图文件。'
          items:
            type: string
            default: jpg
      required:
        - fileType
      x-stoplight:
        id: 8u8i5knrj1wu7
    extensionServiceConfig:
      type: object
      description: |-
        扩展服务配置项。
        <p><b>注意：</b>仅需在<b>页面录制</b>模式下设置。</p>
      properties:
        errorHandlePolicy:
          type: string
          description: 错误处理策略。默认且仅可设为 `"error_abort"`，表示当扩展服务发生错误后，订阅和云端录制的其他非扩展服务都停止。
          default: error_abort
        extensionServices:
          type: array
          items:
            type: object
            properties:
              serviceName:
                $ref: '#/components/schemas/serviceName'
              errorHandlePolicy:
                type: string
                description: |-
                  扩展服务内的错误处理策略：
                  - `"error_abort"`：**页面录制**时默认且只能为该值。表示当前扩展服务出错时，停止其他扩展服务。
                  - `"error_ignore"`：**转推页面录制到 CDN** 时默认且只能为该值。表示当前扩展服务出错时，其他扩展服务不受影响。
                  <p>如果页面录制服务或录制上传服务异常，那么推流到 CDN 失败，因此<b>页面录制</b>服务出错会影响<b>转推页面录制到 CDN</b> 服务。</p>
                  <p>转推到 CDN 的过程发生异常时，页面录制不受影响。</p>
              serviceParam:
                $ref: '#/components/schemas/serviceParam'
            required:
              - serviceName
              - serviceParam
      required:
        - extensionServices
      x-stoplight:
        id: sbfok69rwfqzv
    serviceName:
      type: string
      title: serviceName
      description: |-
        扩展服务的名称：
        - `web_recorder_service`：代表扩展服务为**页面录制**。
        - `rtmp_publish_service`：代表扩展服务为**转推页面录制到 CDN**。
      x-stoplight:
        id: ojksjk36wrdqr
    serviceParam:
      type: object
      title: serviceParam
      description: 扩展服务的具体配置项。
      oneOf:
        - type: object
          title: 页面录制
          description: '**页面录制**时需设置如下字段。'
          properties:
            url:
              type: string
              description: 待录制页面的地址。
            audioProfile:
              type: number
              description: |-
                输出音频的采样率、码率、编码模式和声道数。
                - `0`：48 kHz 采样率，音乐编码，单声道，编码码率约 48 Kbps。
                - `1`：48 kHz 采样率，音乐编码，单声道，编码码率约 128 Kbps。
                - `2`：48 kHz 采样率，音乐编码，双声道，编码码率约 192 Kbps。
            videoWidth:
              type: number
              description: '输出视频的宽度，单位为 pixel。`videoWidth` 和 `videoHeight` 的乘积需小于等于 1920 × 1080。推荐值可参考[如何设置页面录制移动端网页模式的输出视频分辨率](/zh-CN/api-reference/faq/integration/mobile_video_profile)。'
              minimum: 240
              maximum: 1920
            videoHeight:
              type: number
              description: '输出视频的高度，单位为 pixel。`videoWidth` 和 `videoHeight` 的乘积需小于等于 1920 × 1080。推荐值可参考[如何设置页面录制移动端网页模式的输出视频分辨率](/zh-CN/api-reference/faq/integration/mobile_video_profile)。'
              minimum: 240
              maximum: 1920
            maxRecordingHour:
              type: number
              description: |-
                页面录制的最大时长，单位为小时。超出该值后页面录制会自动停止。
                > 建议取值不超过你在 `acquire` 方法中设置的 `resourceExpiredHour` 的值。
                <p><b>计费相关</b>：页面录制停止前会持续计费，因此请根据实际业务情况设置合理的值或主动停止页面录制。</p>
              minimum: 1
              maximum: 720
            videoBitrate:
              type: number
              description: |-
                输出视频的码率，单位为 Kbps。针对不同的输出视频分辨率，`videoBitrate` 的默认值不同：
                - 输出视频分辨率大于或等于 1280 × 720：默认值为 2000。
                - 输出视频分辨率小于 1280 × 720：默认值为 1500。
            videoFps:
              type: number
              description: 输出视频的帧率，单位为 fps。
              minimum: 5
              maximum: 60
              default: 15
            mobile:
              type: boolean
              description: |-
                是否开启移动端网页模式：
                - `true`：开启。开启后，录制服务使用移动端网页渲染模式录制当前页面。
                - `false`：（默认）不开启。
              default: false
            maxVideoDuration:
              type: number
              description: 页面录制生成的 MP4 切片文件的最大时长，单位为分钟。页面录制过程中，录制服务会在当前 MP4 文件时长超过约 `maxVideoDuration` 左右时创建一个新的 MP4 切片文件。
              minimum: 30
              maximum: 240
              default: 120
            onhold:
              $ref: '#/components/schemas/onhold'
            readyTimeout:
              type: number
              description: |-
                设置页面加载超时时间，单位为秒。详见[页面加载超时检测](/zh-CN/realtime-media/cloud-recording/build/optimize-and-operate/webpage#检测页面加载超时)。
                - `0` 或不设置，表示不检测页面加载状态。
                - [1,60] 之间的整数，表示页面加载超时时间。
              minimum: 0
              maximum: 60
              default: 0
          required:
            - url
            - audioProfile
            - videoWidth
            - videoHeight
            - maxRecordingHour
        - type: object
          title: 转推页面录制到 CDN
          description: '**转推页面录制到 CDN** 时需设置如下字段。'
          properties:
            outputs:
              type: array
              items:
                type: object
                properties:
                  rtmpUrl:
                    type: string
                    description: CDN 推流地址。
                required:
                  - rtmpUrl
          required:
            - outputs
      x-stoplight:
        id: 3e3y1k366fo3b
    onhold:
      type: boolean
      title: onhold
      description: |-
        是否在启动页面录制任务时暂停页面录制。
        - `true`：在启动页面录制任务时暂停页面录制。开启页面录制任务后立即暂停录制，录制服务会打开并渲染待录制页面，但不生成切片文件。
        - `false`：启动页面录制任务并进行页面录制。

        建议你按照如下流程使用 `onhold` 字段：
        1. 调用 `start` 方法时将 `onhold` 设为 `true`，开启并暂停页面录制，自行判断页面录制开始的合适时机。
        2. 调用 `update` 并将 `onhold` 设为 `false`，继续进行页面录制。如果需要连续调用 `update` 方法暂停或继续页面录制，请在收到上一次 `update` 响应后再进行调用，否则可能导致请求结果与预期不一致。
      default: false
      x-stoplight:
        id: aqmfxozqt6uu7

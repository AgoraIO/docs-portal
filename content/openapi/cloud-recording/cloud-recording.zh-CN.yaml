            format: float
            minimum: 0
            maximum: 1
          width:
            type: number
            description: 该画面宽度的相对值，精确到小数点后六位。该字段也可以设置为整数 0 或 1。
            format: float
            minimum: 0
            maximum: 1
          height:
            type: number
            description: 该画面高度的相对值，精确到小数点后六位。该字段也可以设置为整数 0 或 1。
            format: float
            minimum: 0
            maximum: 1
          alpha:
            type: number
            description: 图像的透明度。精确到小数点后六位。`0.0` 表示图像为透明的，`1.0` 表示图像为完全不透明的。
            format: float
            minimum: 0
            maximum: 1

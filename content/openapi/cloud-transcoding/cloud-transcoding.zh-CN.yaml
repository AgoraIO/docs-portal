  /v1/ncs/ip:
    get:
      summary: 查询消息通知服务器 IP
      description: 查询消息通知服务器的 IP 地址或 IP 地址列表。
      operationId: get-v1-ncs-ip
      responses:
        '200':
          description: |-
            如果返回的 HTTP 状态码为 200，表示请求成功。

            你只需关心响应 Body 中的 `PrimaryIP` 字段，无需关心响应 Header 以及响应 Body 中的其他字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      service:
                        type: object
                        properties:
                          hosts:
                            type: array
                            items:
                              type: object
                              properties:
                                primaryIP:
                                  type: string
                                  description: 声网消息通知服务器的 IP 地址。
              examples:
                Example 1:
                  value:
                    data:
                      service:
                        hosts:
                        - primaryIP: xxx.xxx.xxx.xxx
                        - primaryIP: xxx.xxx.xxx.xxx
      servers:
      - url: https://api.sd-rtn.com
      x-stoplight:
        id: 6ayz3ts6tfq05
      security:
      - Basic Auth: []
      tags:
      - 消息通知服务
      x-docs-sections:
      - position: after-description
        markdown: |-
          **背景**：开通消息通知服务后，声网消息通知服务可以将云端转码业务中的一些事件以 HTTPS 请求的方式通知到你的服务器。声网会动态调整消息通知服务器的 IP 地址，周期为 24 小时。

          **用法**：你可以通过本方法查询 IP 地址。查询后，需要将 IP 地址或 IP 地址列表添加到白名单中。
      x-docs-callouts:
      - type: info
        title: 注意
        position: after-description
        markdown: 我们强烈推荐你至少每 24 小时进行一次查询，并自动更新防火墙配置，否则可能会影响你接收通知。

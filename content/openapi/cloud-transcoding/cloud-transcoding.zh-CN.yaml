                              rtcChannel: your-channel-name
                              rtcUid: your-uid-2
                              rtcToken: cloudTranscoder-robot-token-generated-with-uid-0
                            placeholderImageUrl: https://example.jpg
                            region:
                              x: 320
                              y: 0
                              width: 320
                              height: 320
                              zOrder: 2
                          outputs:
                          - rtc:
                              rtcChannel: your-channel-name
                              rtcUid: your-uid
                              rtcToken: cloudTranscoder-robot-token-follow-rtcUid
                            audioOption:
                              profileType: AUDIO_PROFILE_MUSIC_STANDARD
                            videoOption:
                              fps: 30
                              codec: H264
                              bitrate: 800
                              width: 960
                              height: 480
                              lowBitrateHighQuality: false
                            seiOption:
                              source:
                                agora:
                                  uidVideoLayout: true
                              sink:
                                type: 100
              视频不转码推流到 CDN:
                value:
                  services:
                    cloudTranscoder:
                      serviceType: cloudTranscoderV2
                      config:
                        transcoder:
                          streamProcessMode: heterogeneous-single
                          idleTimeout: 300
                          audioInputs:
                          - rtc:
                              rtcChannel: your-channel-name
                              rtcUid: your-uid
                              rtcToken: cloudTranscoder-robot-token-generated-with-uid-0
                          videoInputs:
                          - rtc:

                          canvas:
                            width: 960
                            height: 480
                            color: 255
                          outputs:
                          - streamUrl: rtmp://xxx/live/yyy
                            audioOption:
                              profileType: AUDIO_PROFILE_MUSIC_STANDARD
                            videoOption:
                              fps: 20
                              codec: H264
                              bitrate: 800
                              width: 960

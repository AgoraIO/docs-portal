              schema:
                type: object
                properties:
                  createTs:
                    $ref: '#/components/schemas/createTs-acquire-r'
                  instanceId:
                    $ref: '#/components/schemas/instanceId-acquire-r'
                  tokenName:
                    $ref: '#/components/schemas/tokenName-acquire-r'

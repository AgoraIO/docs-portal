                            region:
                              x: 320
                              y: 0
                              width: 320
                              height: 320
                              zOrder: 2
                          outputs:
                          - rtc:
                              rtcChannel: test02
                              rtcUid: 1000
                              rtcToken: aab8b8f5a8cd4469a63042fcfafe7***

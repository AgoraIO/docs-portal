      - Basic Auth: []
      x-docs-sections:
      - position: after-description
        markdown: '`Acquire` 方法用于在开始云端转码前获取云端转码资源。'
      x-docs-callouts:
      - type: info
        title: 注意
        position: after-description
        markdown: |-
          - 调用成功后，你可以在响应包体中得到一个 `builderToken`。一个 `builderToken` 仅可用于一次云端转码任务，同一时间仅允许一个 `builderToken` 运行任务。
          - `builderToken` 用于创建云端转码的有效期为 5 分钟。为确保成功进行云端转码，建议你在每次 `Acquire` 请求获取到 `builderToken` 后的 2 秒内立即发起对应的 [`Create`](create) 请求。
          - 成功创建后，如果需要调用 `Update`/`Delete`，请求中传入的 `builderToken` 需要和创建云端转码时传入的 `builderToken` 一致。
          - 在批量获取 `builderToken` 后进行批量 `Create` 请求可能导致请求失败。
  /v1/projects/{appId}/rtsc/cloud-transcoder/tasks:
    post:
      tags:
      - 云端转码
      summary: 创建云端转码
      description: 创建云端转码任务并输出转码后的媒体流。

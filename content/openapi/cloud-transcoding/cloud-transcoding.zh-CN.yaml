        description: ''
        content:
          application/json:
            schema:
              type: object
              required:
              - services
              properties:
                services:
                  type: object
                  required:
                  - cloudTranscoder
                  properties:
                    cloudTranscoder:
                      type: object
                      required:
                      - serviceType
                      - config
                      properties:
                        serviceType:
                          $ref: '#/components/schemas/serviceType'
                        config:
                          type: object
                          required:
                          - transcoder
                          properties:
                            transcoder:
                              $ref: '#/components/schemas/transcoder'

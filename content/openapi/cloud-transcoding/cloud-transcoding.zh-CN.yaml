- name: 消息通知服务
components:
  parameters:
    builderToken:
      name: builderToken
      in: query
      description: |-
        通过 `Acquire` 方法的响应包体得到的 `tokenName` 的值。
        > 同一时间仅允许一个 `builderToken` 运行任务。
      required: true
      schema:
        type: string
    sequenceId:
      name: sequenceId
      in: query
      description: |-
        `Update` 请求的序列号。取值需要大于 0。请确保后一次 `Update` 请求的序列号大于前一次 `Update` 请求的序列号。序列号可以确保声网服务器按照你指定的最新配置来更新 Cloud transcoder。

        **使用建议**：声网推荐你在第一次调用 `Update` 时，将 `sequence` 设置为 `1`。在第二次调用 `Update` 时，将 `sequence` 设置为 `2`。在第三次调用 `Update` 时，将 `sequence` 设置为 `3`。依次类推。声网服务器会按照最新 `Update` 请求（即最大的序列号）更新 Cloud transcoder。
      required: true
      schema:
        type: string
    updateMask:
      name: updateMask
      in: query
      description: 指定的更新配置项。需要填为 `services.cloudTranscoder.config`，代表全量更新。
      required: true
      schema:
        type: string
    taskId:
      name: taskId
      in: path
      description: 转码任务 ID，为 UUID，用于标识本次请求操作的 Cloud transcoder。
      required: true
      schema:
        type: string
    codecId:
      name: codecId
      in: path
      description: |-
        转码模板的 ID。字符串长度不超过 64 字节，支持的字符集范围（共 89 个字符）如下：

        - 26 个小写英文字母 a~z
        - 26 个大写英文字母 A~Z
        - 10 个数字 0~9
        - 空格
        - `!`、`#`、`$`、`%`、`&`、`(`、`)`、`+`、`-`、`:`、`;`、`<`、`=`、`.`、`>`、`?`、`@`、`[`、`]`、`^`、`_`、`{`、`}`、`|`、`~`、`,`

        **用法说明**：假设你在频道名为 `channel` 的频道中开启观众端多码率功能，并且创建转码模板，设置转码模板 ID 为 `codecId`。那么，观众端进入对应的 `channel_codecId` 频道即可订阅经过转码模板处理过的多码率主播流。
      required: true
      schema:
        type: string
        examples:
        - '"720p"'
    appId:
      name: appId
      in: path
      description: 声网为每个开发者提供的 **App ID**。在声网控制台创建一个项目后即可得到一个 App ID。一个 App ID 是一个项目的唯一标识。
      required: true
      schema:
        type: string
    Content-Type:
      name: Content-Type
      in: header
      description: '`application/json`'
      required: true
      schema:
        type: string
    builderToken2:
      name: builderToken
      in: query
      required: true
      schema:
        type: string
      description: "通过 `Acquire` 方法的响应包体得到的 `tokenName` 的值。 \n> 请确保填入的 `builderToken`\
        \ 和你在 `Create` 接口中传入的 `builderToken` 一致。"

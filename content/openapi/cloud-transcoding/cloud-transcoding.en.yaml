          description: The request succeeded and returned task information.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cloud-transcoder-task"
              example:
                createTs: 1661324613
                eventHandlers: {}
                execution:
                  workflows: {}
                properties: {}
                sequenceId: "0"
                services:
                  cloudTranscoder:
                    config: {}
                    createTs: 1661324614
                    details: {}
                    message: OnSlaveServiceStopped
                    serviceType: cloudTranscoderV2
                    status: serviceCompleted
                status: STOPPED
                taskId: 609f28f2644f1ae1ceb041b7047e3***
                variables: {}
                workflows: {}
        "206":
          description: >-
            The server hasn't finished processing the request. Call `Query` with a backoff strategy
            to confirm the task status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
              example:
                message: request not completed
        default:
          $ref: "#/components/responses/not-200"
  /v1/ncs/ip:
    get:
      summary: Query message notification server IP
      description: Retrieves message notification server IP addresses.
      x-docs-sections:
        - position: after-description
          markdown: >-
            The Agora message notification service notifies your server of Cloud Transcoding events
            through HTTPS requests. Agora dynamically adjusts the IP addresses of the message
            notification server. Call this endpoint regularly and update your firewall configuration
            whenever the addresses change.
        - title: Request
          position: after-parameters
          markdown: "- This endpoint has no path parameters or request body."
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. Only the `primaryIP`
            field in the response body is relevant; the response header and all other fields can be
            ignored.


            - If the returned status code is not `200`, the request failed. See [Response status
            codes](/en/api-reference/api-ref/cloud-transcoding/status-codes) for troubleshooting.
      operationId: query-cloud-transcoding-ncs-ip
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request GET \
                --url https://api.sd-rtn.com/v1/ncs/ip \
                --header 'Authorization: Basic <credentials>'
        - lang: python
          label: Python
          source: |-
            import requests

              url = "https://api.sd-rtn.com/v1/ncs/ip"
              headers = {
                  "Authorization": "Basic <credentials>"
              }

              response = requests.get(url, headers=headers)

              print(response.status_code)
              print(response.json())
        - lang: javascript
          label: Node.js
          source: |-
            const axios = require('axios');

              const url = 'https://api.sd-rtn.com/v1/ncs/ip';
              const headers = {
                'Authorization': 'Basic <credentials>'
              };

              axios.get(url, { headers })
                .then(response => {
                  console.log('Status:', response.status);
                  console.log('Data:', response.data);
                })
                .catch(error => {
                  console.error('Error:', error.response ? error.response.data : error.message);
                });
      x-docs-callouts:
        - markdown: >-
            Query the IP addresses at least once every 24 hours and update your firewall whitelist
            automatically to avoid interruptions in notification delivery.
          position: after-description
          title: Note
          type: info
      responses:
        "200":
          description: The request succeeded and returned message notification server IP addresses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ncs-ip-response"
              example:
                data:
                  service:
                    hosts:
                      - primaryIP: xxx.xxx.xxx.xxx
                      - primaryIP: xxx.xxx.xxx.xxx
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic HTTP authentication using your Agora customer ID and customer secret.
  headers:
    X-Request-ID:
      description: >-
        The unique request ID. If the request fails, use this value in the log to troubleshoot the
        problem.
      schema:
        type: string
  parameters:
    Content-Type:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        enum:
          - application/json
      description: The request content type. Use `application/json`.
    X-Request-ID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
      description: >-
        UUID (Universally Unique Identifier), used to identify this request.


        If the request fails, print out the value in the log to troubleshoot the problem. If the
        response status code of the request is not 2XX, then the response header may not contain
        this field.
    appId:
      name: appId
      in: path
      required: true
      schema:
        type: string
      description: The App ID of your project from Agora Console.
    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
      description: A UUID used to identify the cloud transcoder for this request operation.
    builderToken:
      name: builderToken
      in: query
      required: true
      schema:
        type: string
      description: >-
        The `tokenName` you obtained in the response body of the `Acquire` method. See Acquire a
        builder token.
  responses:
    not-200:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
          example:
            message: Describes why the request failed.
  schemas:
    acquire-builder-token-request:
      type: object
      required:
        - instanceId
        - services
      properties:
        instanceId:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: The `instanceId` you specified in the request.
        services:
          $ref: "#/components/schemas/cloud-transcoder-services"
    acquire-builder-token-response:
      type: object
      properties:
        createTs:
          type: number
          description: Unix timestamp (seconds) when the `builderToken` was generated
        instanceId:
          type: string
          description: The user-specified instance ID.
        tokenName:
          type: string
          description: >-
            The value of the `builderToken`. Use this value when calling other methods for this
            instance.
    cloud-transcoder-request:
      type: object
      required:
        - services
      properties:
        services:
          $ref: "#/components/schemas/cloud-transcoder-services"
    cloud-transcoder-services:
      type: object
      required:
        - cloudTranscoder
      properties:
        cloudTranscoder:
          type: object
          required:
            - serviceType
            - config
          properties:
            serviceType:
              type: string
              enum:
                - cloudTranscoderV2
              description: |-
                Should be `"cloudTranscoderV2"`.

                The service type. Use "cloudTranscoderV2".
            config:
              type: object
              required:
                - transcoder
              properties:
                transcoder:
                  $ref: "#/components/schemas/transcoder-config"
              description: Same as the fields you set in the `Create` request body.
    transcoder-config:
      type: object
      required:
        - canvas
        - outputs
      properties:
        idleTimeout:
          type: number
          default: 300
          minimum: 1
          maximum: 86400
          description: >-
            The maximum period, in seconds, that Cloud Transcoder can be idle. If the idle state
            exceeds this value, Cloud Transcoder is automatically destroyed.
        streamProcessMode:
          type: string
          default: mix
          enum:
            - mix
            - heterogeneous-single
            - single
          description: >-
            If this parameter is not specified, the working mode of Cloud transcoder is the merge
            mode. You can specify the following modes:

            - `heterogeneous-single`: Heterogeneous single stream mode. The types of input stream
            and output stream can be different or the same. The currently supported stream types are
            RTC and CDN.

            - `single`: RTC stream relay mode. Relays the host's audio and video data and signaling
            in the source channel to the destination channel.
          x-docs-callouts:
            - type: info
              title: Note
              markdown: >
                - If you set `streamProcessMode` to `heterogeneous-single` or `single`, then the
                `audioInputs` or `videoInputs` list may contain at most one item.


                - If you need to mix audio, combine images, or mix audio and combine images, no
                `streamProcessMode` settings are required.
        audioInputs:
          type: array
          description: >-
            Audio input source list, supports two types: RTC audio stream and CDN audio stream. If
            you specify multiple input audio sources, the streams are mixed.
          items:
            $ref: "#/components/schemas/audio-input"
          x-docs-callouts:
            - type: info
              title: Note
              markdown: |
                Either `rtc` or `streamUrl` must be filled in.
        videoInputs:
          type: array
          description: >-
            Video input source list, supports RTC video stream and CDN video stream. If you specify
            multiple input video sources, the streams are merged.
          items:
            $ref: "#/components/schemas/video-input"
        canvas:
          $ref: "#/components/schemas/canvas"
        waterMarks:
          type: array
          minItems: 1
          description: >-
            Watermark list. To add no watermarks, omit this field. An empty list isn't
            accepted.
          items:
            $ref: "#/components/schemas/watermark"
        outputs:
          type: array
          minItems: 1
          maxItems: 1
          description: |-
            Configure output settings to publish to a single RTC channel or to CDN addresses.
            The array can contain only one output.

            RTC and CDN outputs are mutually exclusive. You must specify either `streamUrl` or `rtc`, but not both.
          items:
            $ref: "#/components/schemas/transcoder-output"
    audio-input:
      type: object
      properties:
        streamUrl:
          type: string
          description: The URL of the audio source stream. Required when the audio input source is CDN.
        volume:
          type: number
          default: 100
          minimum: 0
          maximum: 200
          description: >-
            The volume of the audio source stream. This parameter only takes effect when the audio
            input source is CDN.
        repeat:
          type: number
          default: 1
          description: >-
            The number of times to play the media stream. `1` means play once, `-1` means loop, and
            any positive integer specifies a playback count.
        rtc:
          $ref: "#/components/schemas/rtc-source"
          description: When the audio input source is RTC, this object is required.
    video-input:
      type: object
      required:
        - region
      properties:
        streamUrl:
          type: string
          description: The URL of the video source stream. Required when the video input source is CDN.
        repeat:
          type: number
          default: 1
          description: >-
            The number of times to play the media stream. `1` means play once, `-1` means loop, and
            any positive integer specifies a playback count.
        rtc:
          $ref: "#/components/schemas/rtc-source"
          description: This object is required when the video input source is RTC.
        placeholderImageUrl:
          type: string
          description: >-
            The URL of the placeholder image displayed when the user is offline. It must be a valid
            image URL and contain the `jpg` or `png` suffix.
        region:
          $ref: "#/components/schemas/region"
    rtc-source:
      type: object
      required:
        - rtcChannel
        - rtcUid
        - rtcToken
      properties:
        rtcChannel:
          type: string
          description: >-
            The RTC channel name for the input source. Currently, you can only subscribe to
            audio and video sources from a single channel; the audio and video sources must belong
            to the same channel.
        rtcUid:
          type: number
          description: >-
            The UID of the input source user. This UID uniquely identifies the user whose
            audio or video stream is being transcoded in the RTC channel.
        rtcToken:
          type: string
          description: |-
            The token that Cloud Transcoder uses to join the input RTC channel for transcoding. Using
            a token ensures channel security and prevents malicious users from disrupting other
            users in the channel. See [Token authentication](/en/realtime-media/rtc/build/authenticate-users/authentication-workflow) for details.

            Cloud Transcoder's UID in the input RTC channel is randomly assigned by Agora.
            When generating this token, set `uid` to `0`.
    rtc-output:
      type: object
      required:
        - rtcChannel
        - rtcUid
        - rtcToken
      properties:
        rtcChannel:
          type: string
          description: The RTC channel name for the transcoded audio and video.
        rtcUid:
          type: number
          description: >-
            The UID of Cloud Transcoder in the output RTC channel. Make sure this value is
            different from the UID of other users in the channel.
        rtcToken:
          type: string
          description: |-
            The token that the Cloud Transcoder uses to join the output RTC channel. Using a token
            ensures channel security and prevents malicious users from disrupting other users in the
            channel. See [Token authentication](/en/realtime-media/rtc/build/authenticate-users/authentication-workflow) for details.

            When generating this token, set `uid` to the value of `outputs.rtc.rtcUid`.
      description: Required for publishing to an RTC channel. Currently, you can publish to only one RTC channel.
    canvas:
      type: object
      required:
        - width
        - height
        - color
      properties:
        width:
          type: number
          minimum: 120
          maximum: 1920
          description: The width of the canvas (px).
        height:
          type: number
          minimum: 120
          maximum: 1920
          description: The height of the canvas (px).
        color:
          type: number
          minimum: 0
          maximum: 16777215
          description: The background color of the canvas as a decimal RGB value.
        backgroundImage:
          type: string
          description: >-
            Canvas background image. Must be a valid image URL with a `jpg` or `png` suffix. If
            omitted, there is no canvas background image.
        fillMode:
          type: string
          default: FILL
          enum:
            - FILL
            - FIT
          description: Fill mode for the canvas background image.
    watermark:
      type: object
      required:
        - imageUrl
        - region
      properties:
        imageUrl:
          type: string
          description: The URL of the watermark image.
        region:
          $ref: "#/components/schemas/watermark-region"
        fillMode:
          type: string
          default: FILL
          enum:
            - FILL
            - FIT
          description: >-
            Watermark fill mode:

            - `"FILL"`: Scale the image and crop it in the center while maintaining the aspect
            ratio.

            - `"FIT"`: Scale the image to fill the display while maintaining the aspect ratio.
    region:
      type: object
      required:
        - x
        - "y"
        - width
        - height
        - zOrder
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1920
          description: >-
            The x coordinate of the image on the canvas (px). The x coordinate is the horizontal
            displacement of the upper left corner of the image relative to the origin, where the
            upper left corner of the canvas is the origin.
        "y":
          type: number
          minimum: 0
          maximum: 1920
          description: >-
            The y coordinate of the image on the canvas (px). The y coordinate is the vertical
            displacement of the upper left corner of the image relative to the origin, where the
            upper left corner of the canvas is the origin.
        width:
          type: number
          minimum: 120
          maximum: 1920
          description: >-
            The width of the video region (px). The region must fit within the canvas and can't
            exceed 1920 × 1080.
        height:
          type: number
          minimum: 120
          maximum: 1920
          description: >-
            The height of the video region (px). The region must fit within the canvas and can't
            exceed 1920 × 1080.
        zOrder:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            The layer order of the host screen. `0` represents the bottom layer. `100` represents
            the top layer.
    watermark-region:
      type: object
      required:
        - x
        - "y"
        - width
        - height
        - zOrder
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1920
          description: >-
            The x coordinate of the watermark on the canvas (px). The x coordinate is the horizontal
            displacement of the upper left corner of the watermark relative to the upper left corner
            of the canvas.
        "y":
          type: number
          minimum: 0
          maximum: 1920
          description: >-
            The y coordinate of the watermark on the canvas (px). The y coordinate is the vertical
            displacement of the upper left corner of the watermark relative to the upper left corner
            of the canvas.
        width:
          type: number
          minimum: 120
          maximum: 1920
          description: The width of the watermark (px).
        height:
          type: number
          minimum: 120
          maximum: 1920
          description: The height of the watermark (px).
        zOrder:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            The layer order of the watermark. `0` represents the bottom layer. `100` represents the
            top layer.
    transcoder-output:
      type: object
      properties:
        streamUrl:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
          description: >-
            The CDN addresses to publish the transcoded stream to. You can specify up to 10
            addresses. All addresses share the `audioOption` and `videoOption` settings of this
            output.
        rtc:
          $ref: "#/components/schemas/rtc-output"
        audioOption:
          $ref: "#/components/schemas/audio-option"
        videoOption:
          $ref: "#/components/schemas/video-option"
    audio-option:
      type: object
      properties:
        profileType:
          type: string
          default: AUDIO_PROFILE_DEFAULT
          enum:
            - AUDIO_PROFILE_DEFAULT
            - AUDIO_PROFILE_SPEECH_STANDARD
            - AUDIO_PROFILE_MUSIC_STANDARD
            - AUDIO_PROFILE_MUSIC_STANDARD_STEREO
            - AUDIO_PROFILE_MUSIC_HIGH_QUALITY
            - AUDIO_PROFILE_MUSIC_HIGH_QUALITY_STEREO
          description: >-
            Audio properties of the transcoded output:

            - `"AUDIO_PROFILE_DEFAULT"`: 48 kHz sampling rate, music encoding, mono channel, maximum
            encoding bitrate is 64 Kbps.

            - `"AUDIO_PROFILE_SPEECH_STANDARD"`: 32 kHz sampling rate, speech encoding, mono
            channel, maximum encoding bitrate is 18 Kbps.

            - `"AUDIO_PROFILE_MUSIC_STANDARD"`: 48 KHz sampling rate, music encoding, mono channel,
            maximum encoding bitrate is 64 Kbps.

            - `"AUDIO_PROFILE_MUSIC_STANDARD_STEREO"`: 48 KHz sampling rate, music encoding, stereo
            channel, maximum encoding bitrate is 80 Kbps.

            - `"AUDIO_PROFILE_MUSIC_HIGH_QUALITY"`: 48 KHz sampling rate, music encoding, mono
            channel, maximum encoding bitrate is 96 Kbps.

            - `"AUDIO_PROFILE_MUSIC_HIGH_QUALITY_STEREO"`: 48 kHz sampling rate, music encoding,
            dual channels, and a maximum encoding bitrate of 128 Kbps.
    video-option:
      type: object
      required:
        - width
        - height
        - bitrate
        - codec
      properties:
        width:
          type: number
          minimum: 120
          maximum: 1920
          description: >-
            The width of the transcoded output video (px). The output resolution can't exceed
            1920 × 1080.
        height:
          type: number
          minimum: 120
          maximum: 1920
          description: >-
            The height of the transcoded output video (px). The output resolution can't exceed
            1920 × 1080.
        bitrate:
          type: number
          minimum: 1
          maximum: 10000
          description: The bitrate of the transcoded output video.
        codec:
          type: string
          enum:
            - H264
            - H265
            - VP8
          description: |-
            The codec used to transcode the output video.

             **Possible values**:
            - `"H264"`: Standard H.264 encoding. Supported for RTC and CDN outputs.
            - `"H265"`: Standard H.265 encoding. Supported for RTC and CDN outputs.
            - `"VP8"`: Standard VP8 encoding. Supported for RTC outputs only.
        fps:
          type: number
          default: 15
          minimum: 1
          maximum: 30
          description: The frame rate (fps) of the transcoded output video.
        mode:
          type: string
          description: >-
            Can be set to `RAW`, which means the output video is not transcoded. The encoding format
            of the input video remains unchanged.

             If the output video is transcoded, do not set this field.
             In `RAW` mode, the number of inputs set in `videoInputs` can only be 1.
        lowBitrateHighQuality:
          type: boolean
          description: Whether to enable low-bitrate high-quality mode.
    cloud-transcoder-task:
      type: object
      properties:
        taskId:
          type: string
          description: A UUID used to identify the cloud transcoder for this request operation.
        createTs:
          type: number
          description: Unix timestamp (seconds) when the transcoding task was created.
        status:
          type: string
          description: |-
            The running status of the transcoding task:
            - `"IDLE"`: Task not started.
            - `"PREPARED"`: The task has received a start request.
            - `"STARTING"`: The task is starting.
            - `"CREATED"`: Task initialization completed.
            - `"STARTED"`: The task has started.
            - `"IN_PROGRESS"`: Task in progress.
            - `"STOPPING"`: The task is stopping.
            - `"STOPPED"`: The task has stopped.
            - `"EXIT"`: The task exited normally.
            - `"FAILURE_STOP"`: The task exited abnormally.
        sequenceId:
          type: string
          description: The sequence ID.
        services:
          type: object
          properties:
            cloudTranscoder:
              type: object
              properties:
                config:
                  type: object
                  additionalProperties: true
                  description: Same as the fields you set in the `Create` request body.
                createTs:
                  type: number
                  description: Unix timestamp (in seconds) when the service was created.
                details:
                  type: object
                  additionalProperties: true
                  description: Reserved field.
                message:
                  type: string
                  description: Reserved field.
                serviceType:
                  type: string
                  description: Should be `"cloudTranscoderV2"`.
                status:
                  type: string
                  description: >-
                    The running status of the transcoding service in the transcoding task:

                    - `"serviceIdle"`: The service has not started.

                    - `"serviceReady"`: The service is ready to start.

                    - `"serviceStarted"`: The service has started.

                    - `"serviceInProgress"`: The service is currently running.

                    - `"serviceCompleted"`: The service has stopped, and all tasks have been
                    completed.

                    - `"servicePartialCompleted"`: The service has stopped, but the task was only
                    partially completed.

                    - `"serviceValidationFailed"`: The service failed due to invalid parameters.

                    - `"serviceAbnormal"`: The service exited unexpectedly.

                    - `"serviceUnknown"`: The service status is unknown.

                     This field is meant for the Agora technical team to investigate any issues. You do not need to focus on it.
        eventHandlers:
          type: object
          additionalProperties: true
        execution:
          type: object
          additionalProperties: true
        properties:
          type: object
          additionalProperties: true
        variables:
          type: object
          additionalProperties: true
        workflows:
          type: object
          additionalProperties: true
    ncs-ip-response:
      type: object
      properties:
        data:
          type: object
          properties:
            service:
              type: object
              properties:
                hosts:
                  type: array
                  items:
                    type: object
                    properties:
                      primaryIP:
                        type: string
                        description: The IP address of the Agora message notification server.
    error-response:
      type: object
      properties:
        message:
          type: string
          description: Describes why the request failed.

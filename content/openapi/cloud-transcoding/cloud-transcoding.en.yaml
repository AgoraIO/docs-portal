openapi: 3.1.0
info:
  version: ""
  title: Cloud Transcoding RESTful API
  description: >-
    Agora Cloud Transcoding transcodes media streams on Agora servers and outputs the result to an
    RTC channel. Send HTTPS requests from your business server to acquire builder tokens, create,
    query, update, and destroy cloud transcoding tasks, manage transcoding templates, and query
    message notification server IP addresses.


    ## Base URL


    All requests are sent to `https://api.sd-rtn.com`.


    ## Data format


    Use `Content-Type: application/json` for requests with bodies. Request and response bodies are
    JSON.
servers:
  - url: https://api.sd-rtn.com
    description: Cloud Transcoding REST API host.
security:
  - basicAuth: []
paths:
  /v1/projects/{appId}/rtsc/cloud-transcoder/builderTokens:

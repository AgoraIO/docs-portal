        content:
          application/json:
            schema:
              $ref: "#/components/schemas/transcoding-template"
            example:
              enabled: true
              video:
                width: 1280
                height: 720
                fps: 15
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/template-status-response"
              example:
                status: success
        default:
          $ref: "#/components/responses/template-not-200"
  /v1/projects/{appId}/rtls/abr/config/codecs:
    get:
      summary: Query transcoding templates
      description: Queries all transcoding template configurations under the specified App ID.
      x-docs-sections:
        - title: Response
          position: before-response-body
          markdown: |-
            - If the returned status code is `200`, the request was successful. The response body contains the result of the request.

            - If the returned status code is not `200`, the request failed. The response body includes the `detail` and `reason` for failure. Refer to [status codes](../rest-api/reference#response-status-codes) to understand the possible reasons for failure.
      operationId: query-transcoding-templates
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request get \
                  --url https://api.sd-rtn.com/v1/projects/:appId/rtls/abr/config/codecs \
                  --header 'Authorization: Basic <credentials>' \
                  --header 'Content-Type: <string>'
        - lang: python
          label: Python
          source: |-
            import requests

                url = "https://api.sd-rtn.com/v1/projects/:appId/rtls/abr/config/codecs"

                headers = {
                    "Authorization": "Basic <credentials>",
                    "Content-Type": "<string>"
                }

                response = requests.request("get", url, headers=headers)

                print(response.text)
        - lang: javascript
          label: Node.js
          source: >-
            const url =
            'https://api.sd-rtn.com/v1/projects/:appId/rtls/abr/config/codecs';
                const options = {
                  method: 'get',
                  headers: {Authorization: 'Basic <credentials>', 'Content-Type': '<string>'}
                };

                fetch(url, options)
                  .then(res => res.json())
                  .then(json => console.log(json))
                  .catch(err => console.error(err));
      parameters:
        - $ref: "#/components/parameters/Content-Type"
        - $ref: "#/components/parameters/appId"
      responses:
        "200":
          description: The request succeeded and returned template data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/query-templates-response"
              example:
                status: success
                data:
                  enabled: true
                  codecs:
                    - id: The ID of the transcoding template.
                      enabled: true
                      video:
                        width: 0
                        height: 0
                        fps: 0
        default:
          $ref: "#/components/responses/template-not-200"
  /v1/ncs/ip:
    get:
      summary: Query message notification server IP
      description: >-
        Gets the message notification server IP address list. Add the IP addresses to
        your firewall whitelist. Agora dynamically adjusts message notification server
        IP addresses in a 24-hour cycle and recommends that you query at least once
        every 24 hours.
      x-docs-sections:
        - title: Request
          position: after-parameters
          markdown: |-
            - This endpoint has no path parameters or request body.
        - title: Response
          position: before-response-body
          markdown: |-
            - If the returned status code is `200`, the request was successful. Only the `primaryIP` field in the response body is relevant; the response header and all other fields can be ignored.

            - If the returned status code is not `200`, the request failed. See [Response status codes](../reference/common-errors#status-codes) for troubleshooting.
      operationId: query-cloud-transcoding-ncs-ip
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            curl --request GET \
                --url https://api.sd-rtn.com/v1/ncs/ip \
                --header 'Authorization: Basic <credentials>'
        - lang: python
          label: Python
          source: |-
            import requests

              url = "https://api.sd-rtn.com/v1/ncs/ip"
              headers = {
                  "Authorization": "Basic <credentials>"
              }

              response = requests.get(url, headers=headers)

              print(response.status_code)
              print(response.json())
        - lang: javascript
          label: Node.js
          source: |-
            const axios = require('axios');

              const url = 'https://api.sd-rtn.com/v1/ncs/ip';
              const headers = {
                'Authorization': 'Basic <credentials>'
              };

              axios.get(url, { headers })
                .then(response => {
                  console.log('Status:', response.status);
                  console.log('Data:', response.data);
                })
                .catch(error => {
                  console.error('Error:', error.response ? error.response.data : error.message);
                });
      x-docs-callouts:
        - type: info
          title: Note
          position: after-description
          markdown: >
            Query the IP addresses at least once every 24 hours and update your firewall
            whitelist automatically to avoid interruptions in notification delivery.
      responses:
        "200":
          description: The request succeeded and returned message notification server IP addresses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ncs-ip-response"
              example:
                data:
                  service:
                    hosts:
                      - primaryIP: xxx.xxx.xxx.xxx
                      - primaryIP: xxx.xxx.xxx.xxx
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic HTTP authentication using your Agora customer ID and customer secret.
  headers:
    X-Request-ID:
      description: >-
        The unique request ID. If the request fails, use this value in the log to
        troubleshoot the problem.
      schema:
        type: string
  parameters:
    Content-Type:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        enum:
          - application/json
      description: The request content type. Use `application/json`.
    X-Request-ID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
      description: >-
        The unique request ID. If you pass in this field, the Agora server returns the
        same value in the response header. If omitted, the Agora server automatically
        generates a request ID and returns it.
    appId:
      name: appId
      in: path
      required: true
      schema:
        type: string
      description: The App ID of your project from Agora Console.
    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
      description: The transcoding task UUID used to identify the cloud transcoder.
    builderToken:
      name: builderToken
      in: query
      required: true
      schema:
        type: string
      description: >-
        The `tokenName` you obtained in the response body of the `Acquire a builder
        token` API.
  responses:
    not-200:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
          example:
            message: Describes why the request failed.
    template-not-200:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/template-error-response"
          example:
            status: error
            message: Description of the reason for the request failure.
  schemas:
    acquire-builder-token-request:
      type: object
      required:
        - instanceId
        - services
      properties:
        instanceId:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            User-specified instance ID. The length must be within 64 characters.
            Supported characters are lowercase letters, uppercase letters, numbers,
            hyphens, and underscores.
        services:
          $ref: "#/components/schemas/cloud-transcoder-services"
    acquire-builder-token-response:
      type: object
      properties:
        createTs:
          type: number
          description: The Unix timestamp when the token was created.
        instanceId:
          type: string
          description: The user-specified instance ID.
        tokenName:
          type: string
          description: The builder token used to initiate a task request.
    cloud-transcoder-request:
      type: object
      required:
        - services
      properties:
        services:
          $ref: "#/components/schemas/cloud-transcoder-services"
    cloud-transcoder-services:
      type: object
      required:
        - cloudTranscoder
      properties:
        cloudTranscoder:
          type: object
          required:
            - serviceType
            - config
          properties:
            serviceType:
              type: string
              enum:
                - cloudTranscoderV2
              description: The service type. Use `cloudTranscoderV2`.
            config:
              type: object
              required:
                - transcoder
              properties:
                transcoder:
                  $ref: "#/components/schemas/transcoder-config"
    transcoder-config:
      type: object
      required:
        - canvas
        - watermarks
        - outputs
      properties:
        idleTimeout:
          type: number
          default: 300
          minimum: 1
          maximum: 86400
          description: >-
            The maximum period, in seconds, that Cloud Transcoder can be idle. If the
            idle state exceeds this value, Cloud Transcoder is automatically destroyed.
        streamProcessMode:
          type: string
          default: mix
          enum:
            - mix
            - heterogeneous-single
            - single
          description: >-
            The working mode of Cloud Transcoder. If this parameter is omitted, Cloud
            Transcoder works in merge mode.
          x-docs-callouts:
            - type: info
              title: Note
              markdown: >
                - If you set `streamProcessMode` to `heterogeneous-single` or `single`,
                then the `audioInputs` or `videoInputs` list may contain at most one
                item.


                - If you need to mix audio, combine images, or mix audio and combine
                images, no `streamProcessMode` settings are required.
        audioInputs:
          type: array
          description: >-
            Audio input source list. Supports RTC audio streams and CDN audio streams.
            If you specify multiple input audio sources, the streams are mixed.
          items:
            $ref: "#/components/schemas/audio-input"
          x-docs-callouts:
            - type: info
              title: Note
              markdown: |
                Either `rtc` or `streamUrl` must be filled in.
        videoInputs:
          type: array
          description: >-
            Video input source list. Supports RTC video streams and CDN video streams.
            If you specify multiple input video sources, the streams are merged.
          items:
            $ref: "#/components/schemas/video-input"
        canvas:
          $ref: "#/components/schemas/canvas"
        watermarks:
          type: array
          description: Watermark list.
          items:
            $ref: "#/components/schemas/watermark"
        outputs:
          type: array
          description: Output stream list.
          items:
            $ref: "#/components/schemas/transcoder-output"
    audio-input:
      type: object
      properties:
        streamUrl:
          type: string
          description: >-
            The URL of the audio source stream. Required when the audio input source is
            CDN.
        volume:
          type: number
          default: 100
          minimum: 0
          maximum: 200
          description: The volume of the CDN audio source stream.
        repeat:
          type: number
          default: 1
          description: >-
            The number of times to play the media stream. `1` means play once, `-1`
            means loop, and any positive integer specifies a playback count.
        rtc:
          $ref: "#/components/schemas/rtc-source"
    video-input:
      type: object
      required:
        - region
      properties:
        streamUrl:
          type: string
          description: >-
            The URL of the video source stream. Required when the video input source is
            CDN.
        repeat:
          type: number
          default: 1
          description: >-
            The number of times to play the media stream. `1` means play once, `-1`
            means loop, and any positive integer specifies a playback count.
        rtc:
          $ref: "#/components/schemas/rtc-source"
        placeholderImageUrl:
          type: string
          description: >-
            The URL of the placeholder image displayed when the user is offline. It must
            be a valid image URL and contain the `jpg` or `png` suffix.
        region:
          $ref: "#/components/schemas/region"
    rtc-source:
      type: object
      required:
        - rtcChannel
        - rtcUid
        - rtcToken
      properties:
        rtcChannel:
          type: string
          description: The RTC channel name.
        rtcUid:
          type: number
          description: The UID corresponding to the source or output stream.
        rtcToken:
          type: string
          description: >-
            The token that Cloud Transcoder uses to join the RTC channel for
            transcoding.
    canvas:
      type: object
      required:
        - width
        - height
        - color
      properties:
        width:
          type: number
          minimum: 120
          maximum: 3840
          description: The width of the canvas in pixels.
        height:
          type: number
          minimum: 120
          maximum: 3840
          description: The height of the canvas in pixels.
        color:
          type: number
          minimum: 0
          maximum: 16777215
          description: The background color of the canvas as a decimal RGB value.
        backgroundImage:
          type: string
          description: Canvas background image URL.
        fillMode:
          type: string
          default: FILL
          enum:
            - FILL
            - FIT
          description: Fill mode for the canvas background image.
    watermark:
      type: object
      required:
        - imageUrl
        - region
      properties:
        imageUrl:
          type: string
          description: The URL of the watermark image.
        region:
          $ref: "#/components/schemas/watermark-region"
        fillMode:
          type: string
          default: FILL
          enum:
            - FILL
            - FIT
          description: Fill mode for the watermark image.
    region:
      type: object
      required:
        - x
        - "y"
        - width
        - height
        - zOrder
      properties:
        x:
          type: number
          minimum: 0
          maximum: 3840
          description: The x coordinate of the image on the canvas in pixels.
        "y":
          type: number
          minimum: 0
          maximum: 3840
          description: The y coordinate of the image on the canvas in pixels.
        width:
          type: number
          minimum: 120
          maximum: 3840
          description: The width of the image in pixels.
        height:
          type: number
          minimum: 120
          maximum: 3840
          description: The height of the image in pixels.
        zOrder:
          type: number
          minimum: 2
          maximum: 100
          description: The layer order of the host screen.
    watermark-region:
      allOf:
        - $ref: "#/components/schemas/region"
        - type: object
          properties:
            zOrder:
              type: number
              minimum: 0
              maximum: 100
              description: The layer order of the watermark.
    transcoder-output:
      type: object
      required:
        - rtc
      properties:
        streamUrl:
          type: string
          description: The CDN output stream URL.
        rtc:
          $ref: "#/components/schemas/rtc-source"
        audioOption:
          $ref: "#/components/schemas/audio-option"
        videoOption:
          $ref: "#/components/schemas/video-option"
    audio-option:
      type: object
      properties:
        profileType:
          type: string
          default: AUDIO_PROFILE_DEFAULT
          enum:
            - AUDIO_PROFILE_DEFAULT
            - AUDIO_PROFILE_SPEECH_STANDARD
            - AUDIO_PROFILE_MUSIC_STANDARD
            - AUDIO_PROFILE_MUSIC_STANDARD_STEREO
            - AUDIO_PROFILE_MUSIC_HIGH_QUALITY
            - AUDIO_PROFILE_MUSIC_HIGH_QUALITY_STEREO
          description: The audio profile of the output stream.
    video-option:
      type: object
      required:
        - width
        - height
        - bitrate
        - codec
      properties:
        width:
          type: number
          minimum: 120
          maximum: 3840
          description: The width of the output video in pixels.
        height:
          type: number
          minimum: 120
          maximum: 3840
          description: The height of the output video in pixels.
        bitrate:
          type: number
          minimum: 1
          maximum: 10000
          description: The output video bitrate.
        codec:
          type: string
          enum:
            - H264
            - H265
          description: The output video codec.
        fps:
          type: number
          default: 15
          minimum: 1
          maximum: 30
          description: The output video frame rate.
        mode:
          type: string
          description: The output video mode.
        lowBitrateHighQuality:
          type: boolean
          description: Whether to enable low-bitrate high-quality mode.
    cloud-transcoder-task:
      type: object
      properties:
        taskId:
          type: string
          description: The task ID.
        createTs:
          type: number
          description: The Unix timestamp when the task was created.
        status:
          type: string
          description: The task status.
        sequenceId:
          type: string
          description: The sequence ID.
        services:
          type: object
          properties:
            cloudTranscoder:
              type: object
              properties:
                config:
                  type: object
                  additionalProperties: true
                createTs:
                  type: number
                details:
                  type: object
                  additionalProperties: true
                message:
                  type: string
                serviceType:
                  type: string
                status:
                  type: string
        eventHandlers:
          type: object
          additionalProperties: true
        execution:
          type: object
          additionalProperties: true
        properties:
          type: object
          additionalProperties: true
        variables:
          type: object
          additionalProperties: true
        workflows:
          type: object
          additionalProperties: true
    transcoding-template:
      type: object
      required:
        - enabled
        - video
      properties:
        enabled:
          type: boolean
          description: Whether to enable the transcoding template.
        video:
          type: object
          required:
            - width
            - height
            - fps
          properties:
            width:
              type: number
              description: The width of the transcoded output video in pixels.
            height:
              type: number
              description: The height of the transcoded output video in pixels.
            fps:
              type: number
              description: The frame rate of the transcoded output video.
    template-status-response:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
            - error
          description: The status of the request.
    query-templates-response:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
            - error
          description: The status of the request.
        data:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether to enable the multi-bitrate function on the viewer side.
            codecs:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the transcoding template.
                  enabled:
                    type: boolean
                    description: Whether to enable this transcoding template.
                  Video:
                    type: object
                    properties:
                      width:
                        type: number
                        description: The width of the transcoded output video in pixels.
                      height:
                        type: number
                        description: The height of the transcoded output video in pixels.
                      fps:
                        type: number
                        description: The frame rate of the transcoded output video.
    ncs-ip-response:
      type: object
      properties:
        data:
          type: object
          properties:
            service:
              type: object
              properties:
                hosts:
                  type: array
                  items:
                    type: object
                    properties:
                      primaryIP:
                        type: string
                        description: The IP address of the Agora message notification server.
    error-response:
      type: object
      properties:
        message:
          type: string
          description: Describes why the request failed.
    template-error-response:
      allOf:
        - $ref: "#/components/schemas/template-status-response"
        - type: object
          properties:
            message:
              type: string
              description: Description of the reason for the request failure.

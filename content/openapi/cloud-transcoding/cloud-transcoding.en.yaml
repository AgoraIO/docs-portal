      x-docs-sections:
        - position: after-description
          markdown: >-
            Before you create a Cloud Transcoding task, call the `builderTokens` endpoint to
            retrieve a builder token.
        - title: Reference
          position: after-response-body
          markdown: >
            Note the following guidelines when using a `builderToken`:


            - After calling this endpoint successfully, you receive a `builderToken` in the response
            body. You can use a `builderToken` for a single Cloud Transcoding task.

            - The validity period of a `builderToken` for creating Cloud Transcoding is 5 minutes.
            To ensure successful Cloud Transcoding, best practice is to initiate the corresponding
            `Create` request within 2 seconds after each `Acquire` response is received.

            - Making batch `Create` requests after batch `builderToken` requests may cause the
            request to fail.


            **Output destination constraints**


            - A single transcoding task cannot push to both a CDN address and an RTC channel
            simultaneously. To push to both destinations, create two separate tasks.

            - If the audio or video configurations differ between the two destinations, create two
            separate tasks.

            - To push to multiple CDN addresses, include up to 10 addresses in the `streamUrl` array
            of a single `outputs` object.

            - Each transcoding task can push to only one RTC channel. To push to two different RTC
            channels, create two separate tasks.
        - title: Response
          position: before-response-body
          markdown: >-
            - If the returned status code is `200`, the request was successful. The response body
            contains the result of the request.


            - If the returned status code is not `200`, the request failed.

openapi: 3.1.0
info:
  version: ''
  title: API 概述
  summary: ''
  description: |
    本页介绍声网弹幕玩法服务端 RESTful API 的基本信息。

    ## 基本功能

    声网弹幕玩法服务端 RESTful API 提供以下功能：

    ### 移动端云开播

    - [获取云游戏列表](get-cloud-game-list)
    - [获取云游戏详情](get-cloud-game-detail)
    - [启动云游戏服务](start-cloud-game)
    - [关闭云游戏服务](stop-cloud-game)
    - [查询云游戏任务状态](get-cloud-game-status)
    - [更新云游戏推流 Token](renew-cloud-game-token)
    - [推送直播间消息](push-message)

    ### Windows 端开播

    - [启动云游戏服务](start-pc-game)
    - [关闭云游戏服务](stop-pc-game)
    - [推送直播间消息](push-message)

    ## 响应状态码

    调用弹幕玩法 RESTful API 可能返回的响应状态码详见[响应状态码](/zh-CN/realtime-media/danmaku/reference/response-code)。
servers:
- url: https://{domain}/v2/projects/{appid}
  description: ''
  variables:
    domain:
      description: |-
        API 域名。分为以下两种：

        - 正式环境域名：`api.sd-rtn.com`，切换后会按照礼物消息进行计量计费。访问正式环境域名的最佳实践，请参考[保障 REST 服务高可用](/zh-CN/realtime-media/rtc/build/optimize-and-operate/rest-availability)。
        - 测试环境域名：`api-test.agora.io`，有调用容量限制，不保证可用性。
      default: ''
    appid:
      description: 你的项目使用的 [App ID](/zh-CN/realtime-media/danmaku/build/setup-and-access/enable-service#获取开发参数)。
      default: ''
paths:
  /cloud-bullet-game/api/live-data/games:
    get:
      tags:
      - 移动端云开播
      summary: 获取云游戏列表
      description: 获取指定游戏的游戏商、支持的礼物列表和弹幕指令等信息。
      operationId: get-cloud-game-list
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/page_num'
      - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    $ref: '#/components/schemas/list'
                  page_num:
                    $ref: '#/components/schemas/page_num'
                  page_size:
                    $ref: '#/components/schemas/page_size'
              examples:
                Example 1:
                  value:
                    list:
                    - game_id: pkzb
                      name: pwnk争霸
                      vendor: pwnk
                      thumbnail: /pwnk.png
                      introduce: pwnk争霸，是兄弟，就来砍一刀
                    page_num: 1
                    page_size: 10
      servers:
      - url: https://{domain}/v2/projects/{appid}
        description: ''
        variables:
          domain:
            description: |-
              API 域名。分为以下两种：

              - 正式环境域名：`api.sd-rtn.com`，切换后会按照礼物消息进行计量计费。访问正式环境域名的最佳实践，请参考[保障 REST 服务高可用](/zh-CN/realtime-media/rtc/build/optimize-and-operate/rest-availability)。
              - 测试环境域名：`api-test.agora.io`，有调用容量限制，不保证可用性。
            default: ''
          appid:
            description: 你的项目使用的 [App ID](/zh-CN/realtime-media/danmaku/build/setup-and-access/enable-service#获取开发参数)。
            default: ''
      x-docs-callouts:
      - position: after-description
        markdown: '- 调用频率限制：单个 APP ID 调用上限为 10 次/秒。'
  /cloud-bullet-game/api/live-data/games/{gameid}:
    get:
      tags:
      - 移动端云开播
      summary: 获取云游戏详情
      description: 获取指定云游戏的详情、礼物列表和弹幕指令等信息。
      operationId: get-cloud-game-detail
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/gameid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  err_no:
                    $ref: '#/components/schemas/err_no'
                  err_msg:
                    $ref: '#/components/schemas/err_msg'
                  logid:
                    $ref: '#/components/schemas/logid'
                  game_id:
                    $ref: '#/components/schemas/game_id'
                  name:
                    $ref: '#/components/schemas/name'
                  vendor:
                    $ref: '#/components/schemas/vendor'
                  thumbnail:
                    $ref: '#/components/schemas/thumbnail'
                  feature:
                    type: object
                    properties:
                      like:
                        type: number
                        description: |-
                          是否支持点赞：
                          - `1`：支持。
                          - `0`：不支持。
                      comment:
                        type: number
                        description: |-
                          是否支持评论：
                          - `1`：支持。
                          - `0`：不支持。
                  gifts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/gfit_id'
                        name:
                          $ref: '#/components/schemas/gift_name'
                        price:
                          $ref: '#/components/schemas/price'
                        thumbnail:
                          $ref: '#/components/schemas/gift_thumb'
                        game_id:
                          $ref: '#/components/schemas/game_id'
                  instruct:
                    type: array
                    description: 游戏支持的弹幕指令。
              examples:
                Example 1:
                  value:
                    game_id: pkzb
                    name: pwnk争霸
                    vendor: pwnk
                    thumbnail: /game.png
                    feature:
                      like: 1
                      comment: 1
                    gifts:
                    - id: 10000
                      name: 礼物 1
                      price: 100
                      thumbnail: /gift.png
                      game_id: pkzb
                    instruct: []
      servers:
      - url: https://{domain}/v2/projects/{appid}
        description: ''
        variables:
          domain:
            description: |-
              API 域名。分为以下两种：

              - 正式环境域名：`api.sd-rtn.com`，切换后会按照礼物消息进行计量计费。访问正式环境域名的最佳实践，请参考[保障 REST 服务高可用](/zh-CN/realtime-media/rtc/build/optimize-and-operate/rest-availability)。
              - 测试环境域名：`api-test.agora.io`，有调用容量限制，不保证可用性。
            default: ''
          appid:
            description: 你的项目使用的 [App ID](/zh-CN/realtime-media/danmaku/build/setup-and-access/enable-service#获取开发参数)。
            default: ''
      x-docs-callouts:
      - position: after-description
        markdown: '- 调用频率限制：单个 APP ID 调用上限为 10 次/秒。'
  /cloud-bullet-game/api/live-data/games/{gameid}/mode/cloud/rooms/{roomid}:start:
    post:
      tags:
      - 移动端云开播
      summary: 启动云游戏服务
      description: 启动移动端云游戏服务。
      operationId: start-cloud-game
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/roomid'
      - $ref: '#/components/parameters/gameid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                openid:
                  $ref: '#/components/schemas/openid'
                nickname:
                  $ref: '#/components/schemas/nickname'
                avatar_url:
                  $ref: '#/components/schemas/avatar_url'
                rtc_config:
                  type: object
                  description: RTC 推拉流相关配置。
                  properties:
                    broadcast_uid:
                      type: integer
                      description: 主播 RTC uid，用于云游戏识别主播、处理主播游戏控制指令和控制离线超时停止游戏。
                      examples:
                      - 2345
                    uid:
                      type: integer
                      description: 云游戏推流 uid，用于标识云游戏视频流。
                      examples:
                      - 1234
                    token:
                      type: string
                      description: 云游戏推流使用的 RTC Token，生成方法详见[使用 Token 鉴权](/zh-CN/realtime-media/rtc/build/setup-and-access/token-authentication)。
                    channel_name:
                      type: string
                      description: 云游戏推流频道名。
                    encryption:
                      type: object
                      description: RTC 内置加密设置。详见[`enableEncrption`](/zh-CN/api-reference/rtc/cpp-all-platforms/network#api_irtcengine_enableencryption)。
                      properties:
                        mode:
                          type: string
                          description: 加密模式。
                        secret:
                          type: string
                          description: 加密密钥。
                        salt:
                          type: string
                          description: 盐。
                  required:
                  - broadcast_uid
                  - uid
                  - token
                  - channel_name
              required:
              - openid
              - nickname
              - avatar_url
              - rtc_config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  err_no:
                    $ref: '#/components/schemas/err_no'
                  err_msg:
                    $ref: '#/components/schemas/err_msg'
                  logid:
                    $ref: '#/components/schemas/logid'
                  data:
                    type: object
                    properties:
                      taskid:
                        type: string
                        description: 云游戏任务 ID，标识一次云游戏开播任务。
                        examples:
                        - xxxxx
              examples:
                Example 1:
                  value:
                    err_no: 0
                    err_msg: success
                    logid: '16000000000000052'
                    data:
                      task_id: xxxxxxxxx
      servers:
      - url: https://{domain}/v2/projects/{appid}
        description: ''
        variables:
          domain:
            description: |-
              API 域名。分为以下两种：

              - 正式环境域名：`api.sd-rtn.com`，切换后会按照礼物消息进行计量计费。访问正式环境域名的最佳实践，请参考[保障 REST 服务高可用](/zh-CN/realtime-media/rtc/build/optimize-and-operate/rest-availability)。
              - 测试环境域名：`api-test.agora.io`，有调用容量限制，不保证可用性。
            default: ''
          appid:
            description: 你的项目使用的 [App ID](/zh-CN/realtime-media/danmaku/build/setup-and-access/enable-service#获取开发参数)。
            default: ''
      x-docs-callouts:
      - position: after-description
        markdown: '- 调用频率限制：单个 APP ID 调用上限为 10 次/秒。'
  /cloud-bullet-game/api/live-data/games/{gameid}/mode/cloud/rooms/{roomid}:stop:
    post:
      tags:
      - 移动端云开播
      summary: 关闭云游戏服务
      description: 关闭移动端云游戏服务。
      operationId: stop-cloud-game
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/gameid'
      - $ref: '#/components/parameters/roomid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                openid:
                  $ref: '#/components/schemas/openid'
                taskid:
                  $ref: '#/components/schemas/taskid'
              required:
              - openid
              - taskid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  err_no:
                    $ref: '#/components/schemas/err_no'
                  err_msg:
                    $ref: '#/components/schemas/err_msg'
                  logid:
                    $ref: '#/components/schemas/logid'
                  data:
                    type: object
                    description: 请求成功时返回空对象。
                x-examples:
                  Example 1:
                    err_no: 0
                    err_msg: success
                    logid: '1690981765801316352'
                    data: {}
              examples:
                Example 1:
                  value:
                    err_no: 0
                    err_msg: success
                    logid: '160000000000000352'
                    data: {}
      servers:
      - url: https://{domain}/v2/projects/{appid}
        description: ''
        variables:
          domain:
            description: |-
              API 域名。分为以下两种：

              - 正式环境域名：`api.sd-rtn.com`，切换后会按照礼物消息进行计量计费。访问正式环境域名的最佳实践，请参考[保障 REST 服务高可用](/zh-CN/realtime-media/rtc/build/optimize-and-operate/rest-availability)。
              - 测试环境域名：`api-test.agora.io`，有调用容量限制，不保证可用性。
            default: ''
          appid:
            description: 你的项目使用的 [App ID](/zh-CN/realtime-media/danmaku/build/setup-and-access/enable-service#获取开发参数)。
            default: ''
      x-docs-callouts:
      - position: after-description
        markdown: '- 调用频率限制：单个 APP ID 调用上限为 10 次/秒。'
  /cloud-bullet-game/api/live-data/tasks/{taskid}/status:
    get:
      tags:
      - 移动端云开播
      summary: 查询云游戏任务状态
      description: 查询指定云游戏任务的当前状态。
      operationId: get-cloud-game-status
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/taskid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  err_no:
                    $ref: '#/components/schemas/err_no'
                  err_msg:
                    $ref: '#/components/schemas/err_msg'
                  logid:
                    $ref: '#/components/schemas/logid'
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        description: |-
                          云游戏任务状态。可能为以下值：

                          - `schedule`：调度中。
                          - `scheduled`：调度成功。
                          - `starting`：任务启动中。
                          - `start_failed`：任务启动失败。
                          - `started`：任务启动成功。
                          - `stopping`：任务停止中。
                          - `stopped`：任务已停止。
                x-examples:
                  Example 1:
                    err_no: 0
                    err_msg: success
                    logid: '1690981765801316352'
                    data: {}
              examples:
                Example 1:
                  value:
                    err_no: 0
                    err_msg: success
                    logid: '1690000000352'
                    data:
                      status: starting
      servers:
      - url: https://{domain}/v2/projects/{appid}
        description: ''
        variables:
          domain:
            description: |-
              API 域名。分为以下两种：

              - 正式环境域名：`api.sd-rtn.com`，切换后会按照礼物消息进行计量计费。访问正式环境域名的最佳实践，请参考[保障 REST 服务高可用](/zh-CN/realtime-media/rtc/build/optimize-and-operate/rest-availability)。
              - 测试环境域名：`api-test.agora.io`，有调用容量限制，不保证可用性。
            default: ''
          appid:
            description: 你的项目使用的 [App ID](/zh-CN/realtime-media/danmaku/build/setup-and-access/enable-service#获取开发参数)。
            default: ''
      x-docs-callouts:
      - position: after-description
        markdown: '- 调用频率限制：单个 taskid 调用上限为 5 次/秒。'
  /cloud-bullet-game/api/live-data/tasks/{taskid}/renew-token:
    post:
      tags:
      - 移动端云开播
      summary: 更新云游戏推流 Token
      description: 更新指定云游戏任务使用的 RTC Token。
      operationId: renew-cloud-game-token
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/taskid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                openid:
                  $ref: '#/components/schemas/openid'
                rtc_uid:
                  type: integer
                  description: 启动云游戏时设置的推流 uid。
                  examples:
                  - 12345
                rtc_token:
                  type: string
                  description: 新生成的 RTC Token，建议在旧 token 快过期的前几分钟，重新生成并调用该接口。
                  examples:
                  - abcxxxxxxxx321
              required:
              - openid
              - rtc_uid
              - rtc_token
              x-examples:
                Example 1:
                  openid: '{appid}_xxxx'
                  rtc_uid: 12345
                  rtc_token: xxxx
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  err_no:
                    $ref: '#/components/schemas/err_no'
                  err_msg:
                    $ref: '#/components/schemas/err_msg'
                  logid:
                    $ref: '#/components/schemas/logid'
                  data:
                    type: object
                    description: 请求成功时返回空对象。
              examples:
                Example 1:
                  value:
                    err_no: 0
                    err_msg: success
                    logid: '16900000000000000352'
                    data: {}
      servers:
      - url: https://{domain}/v2/projects/{appid}
        description: ''
        variables:
          domain:
            description: |-
              API 域名。分为以下两种：

              - 正式环境域名：`api.sd-rtn.com`，切换后会按照礼物消息进行计量计费。访问正式环境域名的最佳实践，请参考[保障 REST 服务高可用](/zh-CN/realtime-media/rtc/build/optimize-and-operate/rest-availability)。
              - 测试环境域名：`api-test.agora.io`，有调用容量限制，不保证可用性。
            default: ''
          appid:
            description: 你的项目使用的 [App ID](/zh-CN/realtime-media/danmaku/build/setup-and-access/enable-service#获取开发参数)。
            default: ''
      x-docs-callouts:
      - position: after-description
        markdown: '- 调用频率限制：单个 taskid 调用上限为 5 次/秒。'
  /bullet-game/api/live-data/games/{gameid}/rooms/${roomid}/msgType/{msg_type}:push:
    post:
      tags:
      - 移动端云开播
      - PC 端开播
      summary: 推送直播间消息
      description: 向直播间推送礼物、评论和点赞消息。
      operationId: push-message
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/gameid'
      - $ref: '#/components/parameters/roomid'
      - name: msg_type
        in: path
        description: |-
          消息类型，支持以下三种：

          - `live_gift`：礼物消息。
          - `live_comment`：评论消息。
          - `live_like`：点赞消息。
        required: true
        schema:
          type: string
      requestBody:
        description: |-
          根据推送的消息类型不同，请求包体中的 `payload` 字段内容也有所不同。
          > - 支持单次调用提交多个与路径参数中的 `msg_type` 类型一致的 `payload`。
          > - 三种消息类型的 `payload` 字段名均为 `payload`，参数说明中的中文仅作区分用，实际调用时需要删除。
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  礼物-payload:
                    type: object
                    properties:
                      msg_id:
                        $ref: '#/components/schemas/msg_id'
                      openid:
                        $ref: '#/components/schemas/openid'
                      gift_id:
                        type: number
                        description: 礼物 ID，需按约定的礼物编号发送。
                        examples:
                        - 10001
                      gift_num:
                        type: integer
                        description: 送出的礼物数量。
                        examples:
                        - 10
                      gift_value:
                        type: integer
                        description: 礼物的价值，折算成分。
                        examples:
                        - 10000
                      avatar_url:
                        $ref: '#/components/schemas/avatar_url'
                      nickname:
                        $ref: '#/components/schemas/nickname'
                      timestamp:
                        $ref: '#/components/schemas/timestamp'
                    required:
                    - msg_id
                    - openid
                    - gift_id
                    - gift_num
                    - gift_value
                    - avatar_url
                    - nickname
                    - timestamp
                  评论-payload:
                    type: object
                    properties:
                      msg_id:
                        $ref: '#/components/schemas/msg_id'
                      openid:
                        $ref: '#/components/schemas/openid'
                      content:
                        type: string
                        description: 评论内容。
                      avatar_url:
                        $ref: '#/components/schemas/avatar_url'
                      nickname:
                        $ref: '#/components/schemas/nickname'
                      timestamp:
                        $ref: '#/components/schemas/timestamp'
                    required:
                    - msg_id
                    - openid
                    - content
                    - avatar_url
                    - nickname
                    - timestamp
                  点赞-payload:
                    type: object
                    properties:
                      msg_id:
                        $ref: '#/components/schemas/msg_id'
                      openid:
                        $ref: '#/components/schemas/openid'
                      like_num:
                        type: integer
                        description: 点赞数量，上游每 2 秒合并一次数据。
                        examples:
                        - 123
                      avatar_url:
                        $ref: '#/components/schemas/avatar_url'
                      nickname:
                        $ref: '#/components/schemas/nickname'
                      timestamp:
                        $ref: '#/components/schemas/timestamp'
                    required:
                    - msg_id
                    - openid
                    - like_num
                    - avatar_url
                    - nickname
                    - timestamp
            examples:
              Example 1:
                value:
                - 礼物-payload:
                    msg_id: abcxxxxxxxxx321_12345678
                    openid: abcxxxxxxxxx321_testopenid
                    gift_id: 10001
                    gift_num: 10
                    gift_value: 10000
                    avatar_url: http://127.0.0.1/xxxxx.jpg
                    nickname: Player
                    timestamp: 1699068964
                  评论-payload:
                    msg_id: abcxxxxxxxxx321_12345678
                    openid: abcxxxxxxxxx321_testopenid
                    content: string
                    avatar_url: http://127.0.0.1/xxxxx.jpg
                    nickname: Player
                    timestamp: 1699068964

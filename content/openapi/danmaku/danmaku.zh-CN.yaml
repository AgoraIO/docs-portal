tags:
- name: 移动端云开播
- name: PC 端开播
components:
  parameters:
    page_num:
      name: page_num
      in: query
      description: 列表展示的起始页码 ，默认为从第一页开始展示。
      required: true
      schema:
        type: integer
        default: 1
    page_size:
      name: page_size
      in: query
      description: 每页展示的数据条数。
      required: true
      schema:
        type: integer
        maximum: 100
        default: 10
    gameid:
      name: gameid
      in: path
      description: 游戏编号，调用[获取云游戏列表](get-cloud-game-list)获得。
      required: true
      schema:
        type: string
    roomid:
      name: roomid
      in: path
      description: 房间编号，以 `appid` 作为前缀的全局唯一房间 ID。
      required: true
      schema:
        type: string
        examples:
        - abcxxxxx321_testroom
    taskid:
      name: taskid
      in: path
      description: 云游戏任务 ID，调用[启动云游戏服务](start-cloud-game)获得。
      required: true
      schema:
        type: string
    gameid-pc:
      name: gameid
      in: path
      description: 游戏编号，每款游戏编号唯一，从声网对接人员获得。
      required: true
      schema:
        type: string
    Authorization:
      name: Authorization
      in: header
      description: 发送 HTTP 请求时，你需要将用于游戏推流使用的 RTC Token 填入 HTTP 请求头部的 `Authorization` 字段。Token 生成方式请参考[使用 Token 鉴权](/zh-CN/realtime-media/rtc/build/setup-and-access/token-authentication)。
      required: true
      schema:
        type: string
        examples:
        - agora token=abcxxxxxxxxxxxxxx123
    Content-Type:
      name: Content-Type
      in: header
      description: 数据类型，必须包含 `application/json`。
      required: true
      schema:
        type: string
        examples:
        - application/json
  schemas:
    list:
      type: array
      title: list
      description: 当前支持的游戏列表。
      examples:
      - - game_id: pkzb
          name: pwnk争霸
          vendor: pwnk
          thumbnail: /pwnk.png
          introduce: pwnk争霸，是兄弟，就来砍一刀
      items:
        type: object
        properties:
          game_id:
            $ref: '#/components/schemas/game_id'
          name:
            $ref: '#/components/schemas/name'
          vendor:
            $ref: '#/components/schemas/vendor'
          thumbnail:
            $ref: '#/components/schemas/thumbnail'
          introduce:
            $ref: '#/components/schemas/introduce'
    game_id:
      type: string
      title: game_id
      description: 游戏 ID。
    name:
      type: string
      title: name
      description: 游戏名称。
    vendor:
      type: string
      title: vendor
      description: 游戏商。
    thumbnail:
      type: string
      title: thumbnail
      description: 游戏缩略图路径。
      examples:
      - /game.png
    introduce:
      type: string
      title: introduce
      description: 游戏介绍。
    page_num:
      type: integer
      title: page_num
      description: 当前页码。
      examples:
      - 1
    page_size:
      type: integer
      title: page_size
      description: 每页展示的数据条数。
      examples:
      - 10
    err_no:
      type: integer
      title: err_no
      description: 请求错误码，`0` 表示请求成功，非 `0` 表示请求失败，对应的错误原因和解决方案详见[响应状态码](/zh-CN/realtime-media/danmaku/reference/response-code)。
      examples:
      - 0
    err_msg:
      type: string
      title: err_msg
      description: '`err_no` 为非 `0` 时附带的错误提示信息。'
      examples:
      - success
    logid:
      type: string
      title: logid
      description: 请求链路 id, 用于出现未知问题时提供给声网技术支持以便定位问题。
      examples:
      - '1690000000352'
    gfit_id:
      type: number
      title: id
      description: 游戏礼物 ID。
      examples:
      - 10000
    gift_name:
      type: string
      title: gift_name
      description: 礼物名。
      examples:
      - 礼物 1
    price:
      type: number
      title: price
      description: 礼物单价。单位：分。
      examples:
      - 100
    gift_thumb:
      type: string
      title: thumbnail
      description: 礼物图标缩略图路径。
      examples:
      - /gift.png
    openid:
      type: string
      title: openid
      description: 主播编号。以 `appid` 作为前缀的全局唯一主播 ID。
      examples:
      - abcxxxxxxxxx321_testopenid
    nickname:
      type: string
      title: nickname
      description: 主播昵称，会显示在游戏中。
      examples:
      - Player
    avatar_url:
      type: string
      title: avatar_url
      description: 主播头像 URL 地址，会显示在游戏中。
      examples:
      - http://127.0.0.1/xxxxx.jpg
    taskid:
      type: string
      title: taskid
      description: 云游戏任务 ID，调用[启动云游戏服务](start-cloud-game)获得。
    msg_id:
      type: string
      title: msg_id
      description: 全局唯一的消息 ID，以 APP ID 为前缀。
      examples:
      - abcxxxxxxxxx321_12345678
    timestamp:
      type: number
      title: timestamp
      description: 消息推送时刻的毫秒级时间戳。误差须小于 60 秒，否则即使推送成功业务侧也无响应。
      examples:
      - 1699068964

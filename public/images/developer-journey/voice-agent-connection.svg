<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">How people connect with a voice agent</title>
<desc id="desc">Your backend supplies client credentials and uses the Agent SDK to start or stop an Agora-hosted Conversational AI Engine session. The engine adds an agent to the RTC channel. The client and agent exchange audio, using your configured models and tools.</desc>
<defs>
<style>:root{--canvas:#ffffff;--surface:#f7f9fc;--border:#cbd5df;--agora:#f0f8fb;--agora-border:#8ebdcd;--hatch:#d2e5ed;--channel-border:#a9cfdb;--node:#ffffff;--node-border:#92b7c6;--text:#182b3d;--region:#526578;--muted:#526578;--label:#283d50;--control:#617386;--media:#007e9a;--icon:#234a60;--pill:#eaf0f5;--pill-border:#c6d3de;}@media(prefers-color-scheme:dark){:root{--canvas:#090c0f;--surface:#0d1115;--border:#30373f;--agora:#0a161c;--agora-border:#245766;--hatch:#16353d;--channel-border:#204653;--node:#101820;--node-border:#375563;--text:#eceff2;--region:#acb5bf;--muted:#aeb9c4;--label:#d9dfe5;--control:#a7afb8;--media:#52cde3;--icon:#e7f8fb;--pill:#20272d;--pill-border:#354049;}}</style>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 10L10 0M8 12L12 8" stroke="var(--hatch)" stroke-width="1"/></pattern>
<marker id="control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--control)" stroke-width="1.4"/></marker>
<marker id="media" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--media)" stroke-width="1.4"/></marker>
<g id="person" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-7" r="5"/><path d="M-10 12c0-12 20-12 20 0Z"/></g>
<g id="agent" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M-12-4V4M-6-10V10M0-15V15M6-9V9M12-3V3"/></g>
<g id="server" fill="none" stroke="currentColor" stroke-width="2"><rect x="-16" y="-13" width="32" height="11" rx="3"/><rect x="-16" y="3" width="32" height="11" rx="3"/><path d="M-10-7h1M-10 9h1M-4-7H10M-4 9H10"/></g>
</defs>
<rect width="1200" height="560" rx="18" fill="var(--canvas)"/>
<rect x="20" y="20" width="1160" height="520" rx="16" fill="none" stroke="var(--border)" stroke-width="1.3"/>
<g transform="translate(0 -398)"><text x="48" y="460" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" fill="var(--text)" font-weight="600" text-anchor="start">Human-to-agent · Conversational AI Engine</text>
<text x="185" y="502" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" fill="var(--region)" font-weight="400" text-anchor="middle" letter-spacing="2">YOUR APPLICATION</text>
<text x="938" y="502" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" fill="var(--region)" font-weight="400" text-anchor="middle" letter-spacing="2">AGORA SERVICES</text>
<rect x="48" y="520" width="274" height="371" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.3"/>
<rect x="72" y="540" width="226" height="90" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.3"/>
<use href="#server" transform="translate(108 577)" color="var(--icon)"/>
<text x="141" y="578" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="var(--text)" font-weight="550" text-anchor="start">Your backend</text>
<text x="141" y="605" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="start">Agent SDK</text>
<path d="M185 631V777" fill="none" stroke="var(--control)" stroke-width="1.8" marker-end="url(#control)"/>
<rect x="122" y="689" width="126" height="30" rx="15" fill="var(--pill)" stroke="var(--pill-border)" stroke-width="1.3"/>
<text x="185.0" y="710" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="var(--label)" font-weight="400" text-anchor="middle">Credentials</text>
<rect x="72" y="782" width="226" height="90" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.3"/>
<use href="#person" transform="translate(108 820)" color="var(--icon)"/>
<text x="141" y="821" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="var(--text)" font-weight="550" text-anchor="start">Client app</text>
<text x="141" y="848" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="start">RTC SDK</text>
<rect x="728" y="520" width="420" height="371" rx="12" fill="var(--agora)" stroke="var(--agora-border)" stroke-width="1.3"/>
<rect x="750" y="540" width="376" height="90" rx="10" fill="var(--node)" stroke="var(--node-border)" stroke-width="1.3"/>
<use href="#agent" transform="translate(782 574)" color="var(--icon)"/>
<text x="811" y="575" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="var(--text)" font-weight="550" text-anchor="start">Conversational AI Engine</text>
<text x="811" y="604" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="var(--muted)" font-weight="400" text-anchor="start">Uses configured models and tools</text>
<path d="M310 585H740" fill="none" stroke="var(--control)" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/>
<rect x="371" y="548" width="290" height="30" rx="15" fill="var(--pill)" stroke="var(--pill-border)" stroke-width="1.3"/>
<text x="516.0" y="569" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="var(--label)" font-weight="400" text-anchor="middle">Start / stop the agent session</text>
<text x="750" y="713" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" fill="var(--region)" font-weight="400" text-anchor="start" letter-spacing="2">RTC CHANNEL</text>
<rect x="744" y="731" width="388" height="144" rx="6" fill="url(#hatch)" stroke="var(--channel-border)" stroke-width="1.3"/>
<rect x="770" y="751" width="119" height="108" rx="10" fill="var(--node)" stroke="var(--node-border)" stroke-width="1.3"/>
<use href="#person" transform="translate(830 783)" color="var(--icon)"/>
<text x="830" y="830" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="var(--text)" font-weight="550" text-anchor="middle">Person</text>
<rect x="988" y="751" width="119" height="108" rx="10" fill="var(--node)" stroke="var(--node-border)" stroke-width="1.3"/>
<use href="#agent" transform="translate(1048 783)" color="var(--icon)"/>
<text x="1048" y="830" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="var(--text)" font-weight="550" text-anchor="middle">AI agent</text>
<path d="M1048 631V741" fill="none" stroke="var(--control)" stroke-width="1.8" marker-end="url(#control)"/>
<rect x="971" y="665" width="154" height="30" rx="15" fill="var(--pill)" stroke="var(--pill-border)" stroke-width="1.3"/>
<text x="1048.0" y="686" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="var(--label)" font-weight="400" text-anchor="middle">Agent joins</text>
<path d="M899 813H978" fill="none" stroke="var(--media)" stroke-width="1.8" marker-end="url(#media)" marker-start="url(#media)"/>
<text x="938" y="785" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--media)" font-weight="400" text-anchor="middle">Audio</text>
<path d="M310 827H718" fill="none" stroke="var(--media)" stroke-width="1.8" marker-end="url(#media)" marker-start="url(#media)"/>
<rect x="375" y="787" width="282" height="30" rx="15" fill="var(--pill)" stroke="var(--pill-border)" stroke-width="1.3"/>
<text x="516.0" y="808" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="var(--label)" font-weight="400" text-anchor="middle">Exchange live audio</text>
<text x="516" y="855" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="middle">Client and agent share the same channel</text>
</g>
<g transform="translate(0 -410)"><path d="M48 934H92" fill="none" stroke="var(--media)" stroke-width="1.8" marker-end="url(#media)" marker-start="url(#media)"/>
<text x="105" y="940" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="start">Live media</text>
<path d="M260 934H304" fill="none" stroke="var(--control)" stroke-width="1.8" marker-end="url(#control)"/>
<text x="317" y="940" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="start">Access / session control</text>
<text x="1148" y="940" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="end">Channel = logical participant group</text>
</g>
</svg>

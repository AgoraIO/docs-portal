<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">用户如何通过实时互动 RTC 连接</title>
<desc id="desc">你的后端向客户端应用提供凭证。用户加入同一个 RTC 频道，发布和订阅音视频，并在会话结束时离开。频道用于组织已连接的参与者。</desc>
<defs>
<style>:root{--canvas:#ffffff;--surface:#f7f9fc;--border:#cbd5df;--agora:#f0f8fb;--agora-border:#8ebdcd;--hatch:#d2e5ed;--channel-border:#a9cfdb;--node:#ffffff;--node-border:#92b7c6;--text:#182b3d;--region:#526578;--muted:#526578;--label:#283d50;--control:#617386;--media:#007e9a;--icon:#234a60;--pill:#eaf0f5;--pill-border:#c6d3de;}@media(prefers-color-scheme:dark){:root{--canvas:#090c0f;--surface:#0d1115;--border:#30373f;--agora:#0a161c;--agora-border:#245766;--hatch:#16353d;--channel-border:#204653;--node:#101820;--node-border:#375563;--text:#eceff2;--region:#acb5bf;--muted:#aeb9c4;--label:#d9dfe5;--control:#a7afb8;--media:#52cde3;--icon:#e7f8fb;--pill:#20272d;--pill-border:#354049;}}</style>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 10L10 0M8 12L12 8" stroke="var(--hatch)" stroke-width="1"/></pattern>
<marker id="control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--control)" stroke-width="1.4"/></marker>
<marker id="media" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--media)" stroke-width="1.4"/></marker>
<g id="person" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-7" r="5"/><path d="M-10 12c0-12 20-12 20 0Z"/></g>
<g id="agent" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M-12-4V4M-6-10V10M0-15V15M6-9V9M12-3V3"/></g>
<g id="server" fill="none" stroke="currentColor" stroke-width="2"><rect x="-16" y="-13" width="32" height="11" rx="3"/><rect x="-16" y="3" width="32" height="11" rx="3"/><path d="M-10-7h1M-10 9h1M-4-7H10M-4 9H10"/></g>
</defs>
<rect width="1200" height="460" rx="18" fill="var(--canvas)"/>
<rect x="20" y="20" width="1160" height="420" rx="16" fill="none" stroke="var(--border)" stroke-width="1.3"/>
<g transform="translate(0 0)"><text x="48" y="65" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" fill="var(--text)" font-weight="600" text-anchor="start">人与人互动 · 实时互动 RTC</text>
<text x="185" y="104" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" fill="var(--region)" font-weight="400" text-anchor="middle" letter-spacing="2">你的应用</text>
<text x="938" y="104" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" fill="var(--region)" font-weight="400" text-anchor="middle" letter-spacing="2">声网服务</text>
<rect x="48" y="122" width="274" height="252" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.3"/>
<rect x="72" y="140" width="226" height="72" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.3"/>
<use href="#server" transform="translate(106 175)" color="var(--icon)"/>
<text x="138" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="var(--text)" font-weight="550" text-anchor="start">你的后端</text>
<path d="M185 213V278" fill="none" stroke="var(--control)" stroke-width="1.8" marker-end="url(#control)"/>
<rect x="122" y="229" width="126" height="30" rx="15" fill="var(--pill)" stroke="var(--pill-border)" stroke-width="1.3"/>
<text x="185.0" y="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="var(--label)" font-weight="400" text-anchor="middle">凭证</text>
<rect x="72" y="282" width="226" height="74" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.3"/>
<use href="#person" transform="translate(102 311)" color="var(--icon)"/>
<use href="#person" transform="translate(133 311)" color="var(--icon)"/>
<text x="160" y="310" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="var(--text)" font-weight="550" text-anchor="start">客户端应用</text>
<text x="160" y="337" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="start">RTC SDK</text>
<rect x="728" y="122" width="420" height="252" rx="12" fill="var(--agora)" stroke="var(--agora-border)" stroke-width="1.3"/>
<text x="938" y="157" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" fill="var(--region)" font-weight="400" text-anchor="middle" letter-spacing="2">RTC 频道</text>
<rect x="744" y="176" width="388" height="182" rx="6" fill="url(#hatch)" stroke="var(--channel-border)" stroke-width="1.3"/>
<rect x="770" y="213" width="119" height="108" rx="10" fill="var(--node)" stroke="var(--node-border)" stroke-width="1.3"/>
<use href="#person" transform="translate(830 245)" color="var(--icon)"/>
<text x="830" y="292" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="var(--text)" font-weight="550" text-anchor="middle">用户 A</text>
<rect x="988" y="213" width="119" height="108" rx="10" fill="var(--node)" stroke="var(--node-border)" stroke-width="1.3"/>
<use href="#person" transform="translate(1048 245)" color="var(--icon)"/>
<text x="1048" y="292" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="var(--text)" font-weight="550" text-anchor="middle">用户 B</text>
<path d="M899 271H978" fill="none" stroke="var(--media)" stroke-width="1.8" marker-end="url(#media)" marker-start="url(#media)"/>
<text x="938" y="242" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="var(--media)" font-weight="400" text-anchor="middle">音频 / 视频</text>
<path d="M310 319H718" fill="none" stroke="var(--media)" stroke-width="1.8" marker-end="url(#media)" marker-start="url(#media)"/>
<rect x="352" y="279" width="326" height="30" rx="15" fill="var(--pill)" stroke="var(--pill-border)" stroke-width="1.3"/>
<text x="515.0" y="300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="var(--label)" font-weight="400" text-anchor="middle">发布 / 订阅媒体</text>
<text x="514" y="345" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="middle">两端加入同一频道</text>
</g>
<g transform="translate(0 -510)"><path d="M48 934H92" fill="none" stroke="var(--media)" stroke-width="1.8" marker-end="url(#media)" marker-start="url(#media)"/>
<text x="105" y="940" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="start">实时媒体</text>
<path d="M260 934H304" fill="none" stroke="var(--control)" stroke-width="1.8" marker-end="url(#control)"/>
<text x="317" y="940" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="start">访问 / 会话控制</text>
<text x="1148" y="940" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="var(--muted)" font-weight="400" text-anchor="end">频道 = 参与者逻辑分组</text>
</g>
</svg>

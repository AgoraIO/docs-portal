<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">A voice agent app conversation</title><desc id="desc">The client joins RTC, asks its backend to start an agent, and exchanges audio with the agent through RTC. To end the conversation the backend stops the agent and both participants leave.</desc><defs><style>:root{--canvas:#ffffff;--surface:#f3f7fb;--node-border:#d7e2eb;--lifeline:#c9d5e0;--text:#20354e;--media:#087eaf;--control:#637388;--model:#8563a9;}@media(prefers-color-scheme:dark){:root{--canvas:#090c0f;--surface:#0d1115;--node-border:#375563;--lifeline:#2b3a45;--text:#eceff2;--media:#52cde3;--control:#a7afb8;--model:#bfa3e6;}}</style><marker id="media" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--media)"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--control)"/></marker><marker id="model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--model)"/></marker></defs><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="100%" height="100%" fill="var(--canvas)"/><text x="36" y="44" text-anchor="start" font-size="28" font-weight="650" fill="var(--text)">From starting a conversation to ending it</text><rect x="42" y="80" width="226" height="77" rx="12" fill="var(--surface)" stroke="var(--node-border)"/><text x="155" y="112" text-anchor="middle" font-size="22" font-weight="600" fill="var(--text)">Your client</text><text x="155" y="141" text-anchor="middle" font-size="17" font-weight="400" fill="var(--text)">RTC SDK</text><path d="M155 165 V700" stroke="var(--lifeline)" stroke-dasharray="4 6"/><rect x="312" y="80" width="226" height="77" rx="12" fill="var(--surface)" stroke="var(--node-border)"/><text x="425" y="112" text-anchor="middle" font-size="22" font-weight="600" fill="var(--text)">Your backend</text><text x="425" y="141" text-anchor="middle" font-size="17" font-weight="400" fill="var(--text)">Agent SDK / API</text><path d="M425 165 V700" stroke="var(--lifeline)" stroke-dasharray="4 6"/><rect x="622" y="80" width="226" height="77" rx="12" fill="var(--surface)" stroke="var(--node-border)"/><text x="735" y="112" text-anchor="middle" font-size="22" font-weight="600" fill="var(--text)">Agora RTC</text><text x="735" y="141" text-anchor="middle" font-size="17" font-weight="400" fill="var(--text)">Media channel</text><path d="M735 165 V700" stroke="var(--lifeline)" stroke-dasharray="4 6"/><rect x="877" y="80" width="226" height="77" rx="12" fill="var(--surface)" stroke="var(--node-border)"/><text x="990" y="106" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text)">Conversational AI</text><text x="990" y="128" text-anchor="middle" font-size="19" font-weight="600" fill="var(--text)">Engine</text><text x="990" y="148" text-anchor="middle" font-size="15" font-weight="400" fill="var(--text)">Agent session</text><path d="M990 165 V700" stroke="var(--lifeline)" stroke-dasharray="4 6"/><path d="M155 205 L735 205" fill="none" stroke="var(--media)" stroke-width="2.5" marker-end="url(#media)" /><text x="445.0" y="193" text-anchor="middle" font-size="19" font-weight="400" fill="var(--media)">Join the channel</text><path d="M155 270 L425 270" fill="none" stroke="var(--control)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#control)" /><text x="290.0" y="258" text-anchor="middle" font-size="19" font-weight="400" fill="var(--control)">Request an agent</text><path d="M425 335 L990 335" fill="none" stroke="var(--control)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#control)" /><text x="707.5" y="323" text-anchor="middle" font-size="19" font-weight="400" fill="var(--control)">Start the agent (API)</text><path d="M990 400 L735 400" fill="none" stroke="var(--media)" stroke-width="2.5" marker-end="url(#media)" /><text x="862.5" y="388" text-anchor="middle" font-size="19" font-weight="400" fill="var(--media)">Agent joins</text><path d="M155 474 L735 474" fill="none" stroke="var(--media)" stroke-width="2.5" marker-end="url(#media)" marker-start="url(#media)"/><text x="445.0" y="462" text-anchor="middle" font-size="19" font-weight="400" fill="var(--media)">Speech and audio response</text><path d="M735 474 L990 474" fill="none" stroke="var(--media)" stroke-width="2.5" marker-end="url(#media)" marker-start="url(#media)"/><text x="862.5" y="462" text-anchor="middle" font-size="19" font-weight="400" fill="var(--media)">Agent audio</text><path d="M155 549 L425 549" fill="none" stroke="var(--control)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#control)" /><text x="290.0" y="537" text-anchor="middle" font-size="19" font-weight="400" fill="var(--control)">End the conversation</text><path d="M425 610 L990 610" fill="none" stroke="var(--control)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#control)" /><text x="707.5" y="598" text-anchor="middle" font-size="19" font-weight="400" fill="var(--control)">Stop the agent (API)</text><path d="M990 670 L735 670" fill="none" stroke="var(--media)" stroke-width="2.5" marker-end="url(#media)" /><text x="862.5" y="658" text-anchor="middle" font-size="19" font-weight="400" fill="var(--media)">Agent leaves</text><path d="M155 715 L735 715" fill="none" stroke="var(--media)" stroke-width="2.5" marker-end="url(#media)" /><text x="445.0" y="703" text-anchor="middle" font-size="19" font-weight="400" fill="var(--media)">Client leaves</text><text x="36" y="766" text-anchor="start" font-size="18" font-weight="400" fill="var(--text)">Audio travels through RTC. Your backend controls the session.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-label="动态配置操作流程"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect width="1040" height="720" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;font-size:18px}.small{font-size:15px;fill:#475569}.box{fill:white;stroke:#94a3b8;stroke-width:1.5;rx:10}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style><text x="520" y="40" text-anchor="middle" style="font-size:25px;font-weight:bold">动态配置：从编辑到 SDK 生效</text><rect class="box" x="370" y="65" width="300" height="50"/><text x="520.0" y="96.0" text-anchor="middle">登录配置平台</text><rect class="box" x="70" y="155" width="390" height="60"/><text x="265.0" y="191.0" text-anchor="middle">导入与下载：选平台，导入 JSON / 模板</text><rect class="box" x="580" y="155" width="390" height="60"/><text x="775.0" y="191.0" text-anchor="middle">托管配置：选 OSS 连接与平台</text><rect class="box" x="320" y="265" width="400" height="55"/><text x="520.0" y="298.5" text-anchor="middle">编辑参数 → 保存草稿 → 提交 AI 审核</text><rect class="box" x="70" y="385" width="390" height="55"/><text x="265.0" y="418.5" text-anchor="middle">导入模式通过：下载配置并自行上传</text><rect class="box" x="580" y="385" width="390" height="55"/><text x="775.0" y="418.5" text-anchor="middle">托管模式通过：直接发布或提交人工审核</text><rect class="box" x="580" y="485" width="390" height="55"/><text x="775.0" y="518.5" text-anchor="middle">确认发布完成，复制当前平台接入地址</text><rect class="box" x="320" y="585" width="400" height="55"/><text x="520.0" y="618.5" text-anchor="middle">SDK 设置 region → 平台 URL 映射</text><path class="line" d="M520 115 V135 H265 V155"/><path class="line" d="M520 135 H775 V155"/><path class="line" d="M265 215 V240 H520 V265"/><path class="line" d="M775 215 V240 H520"/><path class="line" d="M520 320 V355 H265 V385"/><path class="line" d="M520 355 H775 V385"/><path class="line" d="M775 440 V485"/><path class="line" d="M265 440 V560 H520 V585"/><path class="line" d="M775 540 V560 H520"/><text x="520" y="680" text-anchor="middle">下一次加入房间前加载；读取失败回退本地配置</text><text x="520" y="707" text-anchor="middle" class="small">审核未通过或需修改时，查看意见、编辑草稿并重新提交；每份草稿仅对应一个平台</text></svg>
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>页面未找到 · 声网文档</title>
    <link rel="icon" href="/shengwang-favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #fbfaf7; --card: #fefcf8; --ink: #0e0f12; --muted: #5b606b; --line: #deddd9; --button: #2a2c33; --button-text: #fff; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; }
      article { width: 100%; max-width: 560px; padding: 48px 32px; border: 1px solid var(--line); border-radius: 24px; background: var(--card); text-align: center; }
      .brand { margin: 0 0 40px; font-size: 14px; color: var(--muted); }
      .code { margin: 0 0 16px; font-size: 14px; letter-spacing: .2em; font-weight: 600; }
      h1 { margin: 0 0 20px; font-size: clamp(28px, 6vw, 36px); letter-spacing: -.03em; }
      .description { margin: 0; color: var(--muted); line-height: 1.8; }
      nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 20px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 15px; }
      a.primary { color: var(--button-text); background: var(--button); border-color: var(--button); }
      a:hover { text-decoration: underline; text-underline-offset: 4px; }
      a:focus-visible { outline: 3px solid #008ac4; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e0f12; --card: #17191e; --ink: #f5f4ef; --muted: #a6a9b2; --line: #34373f; --button: #f5f4ef; --button-text: #0e0f12; } }
      @media (max-width: 380px) { article { padding: 36px 20px; } }
    </style>
  </head>
  <body>
    <main>
      <article aria-labelledby="not-found-title">
        <p class="brand">声网文档</p>
        <p class="code">404</p>
        <h1 id="not-found-title">页面未找到</h1>
        <p class="description">你访问的页面不存在或已被移除。<br />请检查链接，或搜索你需要的文档。</p>
        <nav aria-label="继续浏览文档">
          <a class="primary" href="/">返回首页</a>
          <a href="/search">搜索文档</a>
        </nav>
      </article>
    </main>
  </body>
</html>

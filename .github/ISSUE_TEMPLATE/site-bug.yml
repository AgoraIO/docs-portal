name: Docs site bug
description: Report a docs portal rendering, search, navigation, or build behavior bug.
title: "[Site bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for the docs website itself. For documentation content problems, use "Documentation issue".
  - type: input
    id: page-url
    attributes:
      label: Page URL or route
      placeholder: https://docs.agora.io/...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include browser, viewport, locale, and search query details when relevant.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Add visual evidence if it helps explain the issue.
    validations:
      required: false

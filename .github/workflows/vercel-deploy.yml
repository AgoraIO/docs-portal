name: Vercel Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      pr_number:
        description: Optional PR number to comment on for preview deploys
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-deploy-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name == 'push' && 'production' || inputs.deploy_target || 'preview' }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview to Vercel
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name != 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'preview')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Resolve preview context
        id: preview-context
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request') {
              const sameRepo = context.payload.pull_request?.head?.repo?.full_name === context.payload.repository?.full_name;
              core.setOutput('should_deploy', sameRepo ? 'true' : 'false');
              core.setOutput('pr_number', sameRepo ? String(context.payload.pull_request.number) : '');
              core.setOutput('reason', sameRepo ? 'same-repo pull request' : 'forked pull request');
              return;
            }

            if (context.eventName === 'workflow_dispatch') {
              const manualInput = `${{ toJson(inputs.pr_number) }}`;
              if (manualInput && manualInput !== 'null' && manualInput !== '') {
                core.setOutput('should_deploy', 'true');
                core.setOutput('pr_number', manualInput);
                core.setOutput('reason', 'manual preview deploy');
                return;
              }
            }

            const branch = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;
            const response = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 1,
            });

            if (response.data.length > 0) {
              core.setOutput('should_deploy', 'true');
              core.setOutput('pr_number', String(response.data[0].number));
              core.setOutput('reason', 'branch push with open pull request');
              return;
            }

            core.setOutput('should_deploy', context.eventName === 'workflow_dispatch' ? 'true' : 'false');
            core.setOutput('pr_number', '');
            core.setOutput('reason', context.eventName === 'workflow_dispatch' ? 'manual preview deploy without PR' : 'branch push without open pull request');

      - name: Skip unsupported preview trigger
        if: steps.preview-context.outputs.should_deploy != 'true'
        run: |
          echo "Skipping preview deploy: ${{ steps.preview-context.outputs.reason }}"
          {
            echo "## Vercel Preview"
            echo
            echo "Skipped: ${{ steps.preview-context.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Checkout
        if: steps.preview-context.outputs.should_deploy == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun
        if: steps.preview-context.outputs.should_deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        if: steps.preview-context.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        if: steps.preview-context.outputs.should_deploy == 'true'
        run: npm install --global vercel@latest

      - name: Install dependencies
        if: steps.preview-context.outputs.should_deploy == 'true'
        run: bun install --frozen-lockfile

      - name: Pull Vercel preview environment
        if: steps.preview-context.outputs.should_deploy == 'true'
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build with Vercel
        if: steps.preview-context.outputs.should_deploy == 'true'
        run: vercel build --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify Vercel output
        if: steps.preview-context.outputs.should_deploy == 'true'
        run: |
          test -f .vercel/output/config.json
          test -d .vercel/output/static
          test -f .vercel/output/static/index.html
          test ! -d .vercel/output/functions

      - name: Deploy prebuilt output
        if: steps.preview-context.outputs.should_deploy == 'true'
        id: vercel-deploy
        run: |
          url="$(vercel deploy --prebuilt --archive=tgz --yes --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        if: steps.preview-context.outputs.should_deploy == 'true'
        env:
          DEPLOY_URL: ${{ steps.vercel-deploy.outputs.url }}
        run: |
          {
            echo "## Vercel Preview"
            echo
            echo "Preview URL: ${DEPLOY_URL}"
            echo
            echo "Trigger: ${{ steps.preview-context.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: steps.preview-context.outputs.should_deploy == 'true' && steps.preview-context.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.vercel-deploy.outputs.url }}
        with:
          script: |
            const body = [
              '## Vercel Preview',
              '',
              `Preview URL: ${process.env.DEPLOY_URL}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = Number('${{ steps.preview-context.outputs.pr_number }}');
            const marker = '## Vercel Preview';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

  deploy-production:
    name: Deploy Production to Vercel
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build with Vercel
        run: vercel build --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify Vercel output
        run: |
          test -f .vercel/output/config.json
          test -d .vercel/output/static
          test -f .vercel/output/static/index.html
          test ! -d .vercel/output/functions

      - name: Deploy prebuilt output
        id: vercel-deploy
        run: |
          url="$(vercel deploy --prebuilt --archive=tgz --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        env:
          DEPLOY_URL: ${{ steps.vercel-deploy.outputs.url }}
        run: |
          {
            echo "## Vercel Production"
            echo
            echo "Production URL: ${DEPLOY_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

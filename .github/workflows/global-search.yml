name: Global production search

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA deployed to Global production
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: global-production-search
  queue: max

jobs:
  sync-search:
    name: Sync and verify Global search
    if: github.repository == 'AgoraIO/docs-portal' && github.ref == 'refs/heads/release/prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production release branch
        uses: actions/checkout@v7.0.1
        with:
          ref: release/prod

      - name: Verify deployed revision
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::Release branch has moved. Check the latest production deployment before retrying."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Algolia search index
        env:
          VITE_DOCS_REGION: global
          VITE_ALGOLIA_APP_ID: ${{ secrets.VITE_ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
        run: |
          : "${VITE_ALGOLIA_APP_ID:?Missing Algolia application ID}"
          : "${ALGOLIA_ADMIN_API_KEY:?Missing Algolia indexing key}"
          bun run search:sync

      - name: Replay Global search golden queries
        env:
          VITE_ALGOLIA_APP_ID: ${{ secrets.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_API_KEY: ${{ secrets.VITE_ALGOLIA_SEARCH_API_KEY }}
          VITE_ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
          VITE_SEARCH_RANKING_V2: 'true'
        run: bun run search:replay -- --out=global-search-replay.json --wait-for-index

      - name: Upload Global search replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-search-replay
          path: global-search-replay.json
          if-no-files-found: warn

name: Promote Production

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag, or commit to promote
        required: true
        default: main
        type: string
      release_tag:
        description: Production release tag to create
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote source to release/prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote release branch
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --prune origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            "+refs/tags/*:refs/tags/*"

          if [[ ! "$RELEASE_TAG" =~ ^(v[0-9]+(\.[0-9]+){1,3}|prod-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?)$ ]]; then
            echo "Invalid release_tag: $RELEASE_TAG"
            echo "Use vYYYY.MM.DD, vMAJOR.MINOR[.PATCH], or prod-YYYY.MM.DD[-N]."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag already exists: $RELEASE_TAG"
            exit 1
          fi

          source_revision="$SOURCE_REF"
          if git rev-parse -q --verify "refs/remotes/origin/$SOURCE_REF" >/dev/null; then
            source_revision="origin/$SOURCE_REF"
          fi

          source_sha="$(git rev-parse --verify "$source_revision^{commit}")"
          release_sha="$(git rev-parse --verify "origin/release/prod^{commit}")"

          if ! git merge-base --is-ancestor "$release_sha" "$source_sha"; then
            echo "release/prod is not an ancestor of $SOURCE_REF."
            echo "Refusing to promote because this would not be a fast-forward release."
            exit 1
          fi

          if [[ "$source_sha" == "$release_sha" ]]; then
            echo "release/prod already points at $source_sha."
          fi

          git tag -a "$RELEASE_TAG" "$source_sha" -m "Production release $RELEASE_TAG"
          git push --atomic origin "refs/tags/$RELEASE_TAG" "$source_sha:refs/heads/release/prod"

          {
            echo "## Promote Production"
            echo
            echo "Source ref: \`$SOURCE_REF\`"
            echo "Source commit: \`$source_sha\`"
            echo "Release tag: \`$RELEASE_TAG\`"
            echo "Updated branch: \`release/prod\`"
          } >> "$GITHUB_STEP_SUMMARY"

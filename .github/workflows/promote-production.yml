name: Promote Production

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag, or commit to promote
        required: true
        default: main
        type: string
      release_tag:
        description: Production release tag base, for example release/2026.07.01.2
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote source to release/prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote release branch
        id: promote
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --prune origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            "+refs/tags/*:refs/tags/*"

          if [[ ! "$RELEASE_TAG" =~ ^release/[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid release_tag: $RELEASE_TAG"
            echo "Use release/YYYY.MM.DD.N. The short commit hash is appended automatically."
            exit 1
          fi

          source_revision="$SOURCE_REF"
          if git rev-parse -q --verify "refs/remotes/origin/$SOURCE_REF" >/dev/null; then
            source_revision="origin/$SOURCE_REF"
          fi

          source_sha="$(git rev-parse --verify "$source_revision^{commit}")"
          release_sha="$(git rev-parse --verify "origin/release/prod^{commit}")"
          source_short_sha="$(git rev-parse --short=8 "$source_sha")"
          final_release_tag="$RELEASE_TAG-$source_short_sha"

          if git rev-parse -q --verify "refs/tags/$final_release_tag" >/dev/null; then
            echo "Tag already exists: $final_release_tag"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_sha" "$source_sha"; then
            echo "release/prod is not an ancestor of $SOURCE_REF."
            echo "Refusing to promote because this would not be a fast-forward release."
            exit 1
          fi

          if [[ "$source_sha" == "$release_sha" ]]; then
            echo "release/prod already points at $source_sha."
          fi

          git tag -a "$final_release_tag" "$source_sha" -m "Production release $final_release_tag"
          git push --atomic origin "refs/tags/$final_release_tag" "$source_sha:refs/heads/release/prod"

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$final_release_tag" >> "$GITHUB_OUTPUT"

          {
            echo "## Promote Production"
            echo
            echo "Source ref: \`$SOURCE_REF\`"
            echo "Source commit: \`$source_sha\`"
            echo "Release tag: \`$final_release_tag\`"
            echo "Updated branch: \`release/prod\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch production deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'vercel-deploy.yml',
              ref: 'release/prod',
              inputs: {
                deploy_target: 'production',
                release_sha: '${{ steps.promote.outputs.source_sha }}',
              },
            });

name: Signaling Apple code check

# Compile-checks the Swift and Objective-C samples in the Signaling docs against
# the real AgoraRtmKit SDK. iOS and macOS are the only Signaling platforms whose
# samples have never been verified, because Swift and Objective-C need Xcode on
# macOS and the docs team works on Windows. A macOS runner is the way in.
#
# This reports findings rather than gating pull requests: the samples are known
# to have unverified defects. To make it run on every pull request that touches
# the Signaling docs, add a `pull_request` trigger with a
# `content/docs/en/realtime-media/rtm/**` path filter. The check step already
# exits 0 when blocks fail, so it would report without blocking.

on:
  # TEMPORARY, REMOVE BEFORE MERGING. GitHub only offers workflow_dispatch for
  # workflows that already exist on the default branch, so until this lands on
  # main the only way to run it is a push trigger scoped to its own branch.
  push:
    branches:
      - signaling-ios-code-check

  workflow_dispatch:
    inputs:
      platform:
        description: Which PlatformStructured range to check
        type: choice
        options:
          - ios
          - macos
        default: ios
      files:
        description: Space-separated .mdx paths to check
        type: string
        default: content/docs/en/realtime-media/rtm/quickstart.mdx
      rtm_version:
        description: AgoraRtmKit xcframework version
        type: string
        default: "2.3.0"
      aosl_version:
        description: aosl xcframework version (a transitive dependency of AgoraRtmKit)
        type: string
        default: "1.3.5"

permissions:
  contents: read

# A push event carries no inputs, so every setting falls back to the same
# default the dispatch form offers.
env:
  PLATFORM: ${{ inputs.platform || 'ios' }}
  # Set per batch while the pages are worked through; the dispatch form can
  # still override it. Reverts to the quickstart at cleanup time.
  FILES: ${{ inputs.files || 'content/docs/en/realtime-media/rtm/quickstart.mdx content/docs/en/realtime-media/rtm/build/connect-and-authenticate/authentication-workflow.mdx content/docs/en/realtime-media/rtm/build/connect-and-authenticate/client-configuration.mdx content/docs/en/realtime-media/rtm/build/connect-and-authenticate/connection/connection-management.mdx content/docs/en/realtime-media/rtm/build/connect-and-authenticate/connection/connection-state-transitions.mdx content/docs/en/realtime-media/rtm/build/send-and-receive-messages/add-event-listener.mdx content/docs/en/realtime-media/rtm/build/send-and-receive-messages/message-history.mdx content/docs/en/realtime-media/rtm/build/send-and-receive-messages/message-payload-structuring.mdx content/docs/en/realtime-media/rtm/build/work-with-channels/message-channel.mdx content/docs/en/realtime-media/rtm/build/work-with-channels/stream-channel.mdx content/docs/en/realtime-media/rtm/build/work-with-channels/topics.mdx content/docs/en/realtime-media/rtm/build/work-with-channels/user-channel.mdx content/docs/en/realtime-media/rtm/build/manage-presence-and-metadata/presence.mdx content/docs/en/realtime-media/rtm/build/manage-presence-and-metadata/storage/store-channel-metadata.mdx content/docs/en/realtime-media/rtm/build/manage-presence-and-metadata/storage/store-user-metadata.mdx content/docs/en/realtime-media/rtm/build/secure-your-app-and-data/data-encryption.mdx content/docs/en/realtime-media/rtm/build/secure-your-app-and-data/geofencing.mdx' }}
  RTM_VERSION: ${{ inputs.rtm_version || '2.3.0' }}
  AOSL_VERSION: ${{ inputs.aosl_version || '1.3.5' }}

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out the docs
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record the toolchain
        run: |
          xcode-select -p
          xcrun swiftc --version
          xcrun clang --version

      - name: Restore the cached SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .sdk
          key: agora-rtm-apple-${{ env.RTM_VERSION }}-${{ env.AOSL_VERSION }}

      # The SDK is distributed as plain xcframework archives, the same ones the
      # AgoraRtm_Apple Swift package points its binary targets at. Downloading
      # them directly avoids needing an Xcode project, CocoaPods or SPM.
      - name: Download the Signaling SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .sdk
          curl -fsSL -o /tmp/AgoraRtmKit.zip \
            "https://download.agora.io/rtm2/release/AgoraRtmKit.xcframework_${RTM_VERSION}.zip"
          unzip -q /tmp/AgoraRtmKit.zip -d .sdk

      - name: Download the aosl dependency
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/aosl.zip \
            "https://download.agora.io/rtm2/release/aosl.xcframework_${AOSL_VERSION}.zip"
          unzip -q /tmp/aosl.zip -d .sdk

      # The first run is also a reconnaissance run: print the slice names, the
      # headers and the Swift module map, so the layout is on the record.
      - name: Show what the SDK archives contain
        run: |
          find .sdk -maxdepth 3 -type d | sort
          echo '--- headers and module maps ---'
          find .sdk -name '*.h' -o -name 'module.modulemap' -o -name '*.swiftinterface' | sort

      # The inputs go through the environment rather than straight into the
      # script body, so a crafted input cannot inject shell.
      - name: Extract the documented code blocks
        run: |
          node scripts/signaling-code-check/extract-blocks.mjs \
            --platform "$PLATFORM" \
            --langs swift,objc \
            --out blocks.json \
            $FILES

      - name: Compile-check the blocks
        run: |
          node scripts/signaling-code-check/check-apple.mjs \
            --blocks blocks.json \
            --frameworks .sdk \
            --platform "$PLATFORM" \
            --out report.json \
            --summary summary.md

      # Guarded because a harness failure, such as the smoke test rejecting the
      # SDK, exits before any summary is written.
      - name: Publish the summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The check did not get far enough to write a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signaling-${{ env.PLATFORM }}-code-check
          path: |
            blocks.json
            report.json
            summary.md

          schema:
            type: string
            examples:
              - TEST
        - name: from_time
          in: query
          description: Start timestamp (s) for the list query. Defaults to one day ago.
          schema:
            type: integer
            examples:
              - 1733013296
        - name: to_time
          in: query
          description: End timestamp (s) for the list query. Defaults to the current time.
          schema:
            type: integer
            examples:
              - 1734016896
        - name: state
          in: query
          description: Specify the agent status to query. A single query does not support multiple statuses:<li>`IDLE` (0): Idle agent.</li><li>`STARTING` (1): Agent is starting.</li><li>`RUNNING` (2): Agent is running.</li><li>`STOPPING` (3): Agent is stopping.</li><li>`STOPPED` (4): Agent has fully exited.</li><li>`RECOVERING` (5): Agent is recovering.</li><li>`FAILED` (6): Agent execution failed.</li>
          schema:
            type: string
            default: '2'
            examples:
              - '1'
        - name: limit
          in: query
          description: Maximum number of items returned in a single paginated query.
          schema:
            type: integer
            default: 20
            examples:
              - 20
        - name: cursor
          in: query
          description: Pagination cursor, that is, the `agent_id` of the starting position for pagination.
          schema:
            type: string
            examples:
              - agent_id
      responses:
        '200':
          description: "- If the returned status code is `200`, the request is successful and the response body contains the result of this request.\r\n- If the returned status code is not `200`, the request has failed. The response body contains the error type and description. For possible reasons, see [Response Status Codes](https://doc.shengwang.cn/doc/convoai/restful/api/response-code)."
          content:

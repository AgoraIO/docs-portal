                  agent_id:
                    $ref: '#/components/schemas/agent_id'
                  channel:
                    $ref: '#/components/schemas/channel'
                  start_ts:
                    $ref: '#/components/schemas/start_ts'
              examples:
                Example 1:
                  value:
                    agent_id: 1NT29XxxxxxxxxELWEHC8OS
                    channel: test_channel
                    start_ts: 1744877089
      operationId: agent-speak
      description: "Make the specified agent speak a custom message.\r\n\r\nDuring interaction with the agent, calling this API makes the agent immediately speak the custom message through the TTS module. After receiving the request, the speaking behavior interrupts the current speaking and thinking flow."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Text content to be spoken. The maximum length is 512 bytes.
                priority:
                  type: string
                  description: |-
                    Priority of the speaking behavior. Supported values:
                    - `"INTERRUPT"`: (default) High priority. Interrupt and speak immediately. The agent terminates the current interaction and directly speaks the message.
                    - `"APPEND"`: Medium priority. Append for later playback. The agent speaks the message after the current interaction ends.
                    - `"IGNORE"`: Low priority. Speak only when idle. If the agent is currently in an interaction, it directly ignores and discards the message. The message is spoken only when the agent is not interacting.
                interruptable:
                  type: boolean
                  description: "Whether to allow user speech to interrupt agent playback:\r\n- `true`: (default) Allowed.\r\n- `false`: Not allowed."
                  default: true
            examples:
              Example 1:
                value:
                  text: Sorry, the conversation content does not comply with policy.
                  priority: INTERRUPT
                  interruptable: false
  '/v2/projects/{appid}/agents/{agentId}/interrupt':
    parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/appid'
      - $ref: '#/components/parameters/agentId'
    post:
      summary: Interrupt an Agent
      # tags:
      #   - Agent Management
      responses:
        default:
          description: "- If the returned status code is `200`, the request is successful and the response body contains agent information.\r\n- If the returned status code is not `200`, the request has failed. The response body contains the error type and description. For possible reasons, see [Response Status Codes](https://doc.shengwang.cn/doc/convoai/restful/api/response-code)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    $ref: '#/components/schemas/agent_id'
                  channel:
                    $ref: '#/components/schemas/channel'
                  start_ts:
                    $ref: '#/components/schemas/start_ts'
              examples:
                Example 1:
                  value:
                    agent_id: 1NT29XxxxxxxxxELWEHC8OS
                    channel: test_channel
                    start_ts: 1744877089
      operationId: agent-interrupt
      description: Interrupt the specified agent while it is speaking or thinking.
      requestBody:
        description: The request body is empty.
        content:
          application/json:
            schema:
              type: object
              properties: {}
            examples:
              Example 1:
                value: {}
  '/v2/projects/{appid}/agents/{agentId}/think':
    parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/appid'
      - $ref: '#/components/parameters/agentId'
    post:
      summary: Send a Custom Instruction
      # tags:
      #   - Agent Management
      operationId: agent-think
      description: |
        Send a custom text instruction to the specified agent.

        This API injects the input text into the current conversation flow as user input, and the Conversational AI Engine continues reasoning and responding by using the standard user-input processing logic. You can use this API for scenarios such as implicit instruction injection, client event triggering, and voice-text coordination.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Custom instruction text. The system injects it into the current conversation flow as user input.
                on_listening_action:
                  type: string
                  description: |
                    Action to take when the agent is in the listening state. Supported values:
                    - `"inject"`: (default) Inject the custom text instruction into the current turn without interrupting it.
                    - `"ignore"`: Ignore this request.
                on_thinking_action:
                  type: string
                  description: |
                    Action to take when the agent is in the thinking state. Supported values:
                    - `"interrupt"`: (default) Interrupt the current state and start a new conversation turn.
                    - `"ignore"`: Ignore this request.
                on_speaking_action:
                  type: string
                  description: |
                    Action to take when the agent is in the speaking state. Supported values:
                    - `"interrupt"`: Interrupt the current state and start a new conversation turn.
                    - `"ignore"`: (default) Ignore this request.
                interruptable:
                  type: boolean
                  description: |
                    Whether to allow user speech to interrupt the custom instruction:
                    - `true`: (default) Allowed.
                    - `false`: Not allowed.
                  default: true
                metadata:
                  type: object
                  description: Custom metadata. You can use this field to pass additional information such as business identifiers.
                  additionalProperties: {}
            examples:
              Example 1:
                value:
                  text: The user just clicked the purchase button.
                  on_listening_action: inject
                  on_thinking_action: interrupt
                  on_speaking_action: ignore
                  interruptable: true
                  metadata:
                    publisher: user123
                    model: deepseek-r1
      responses:
        '200':
          description: "- If the returned status code is `200`, the request is successful and the response body contains agent information.\r\n- If the returned status code is not `200`, the request has failed. The response body contains the error type and description. For possible reasons, see [Response Status Codes](https://doc.shengwang.cn/doc/convoai/restful/api/response-code)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    $ref: '#/components/schemas/agent_id'
                  channel:
                    $ref: '#/components/schemas/channel'
                  start_ts:
                    $ref: '#/components/schemas/start_ts'
              examples:
                Example 1:
                  value:
                    agent_id: 1NT29XxxxxxxxxELWEHC8OS
                    channel: test_channel
                    start_ts: 1744877089
  '/v2/projects/{appid}/agents/{agentId}/history':
    parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/appid'
      - $ref: '#/components/parameters/agentId'
    get:
      # tags:
      #   - Agent Management
      summary: Get Agent Short-Term Memory
      operationId: get-history
      description: "Get the short-term memory of the conversation between the user and the agent.\r\nYou can call this API while the agent is running (`RUNNING`) to retrieve the short-term memory stored from agent creation to the present, including:\r\n- Agent creation and stop timestamps\r\n- Conversation messages between the user and the agent"
      responses:
        default:
          description: "- If the returned status code is `200`, the request is successful and the response body contains the result of this request.\r\n- If the returned status code is not `200`, the request has failed. The response body contains the error type and description. For possible reasons, see [Response Status Codes](https://doc.shengwang.cn/doc/convoai/restful/api/response-code)."
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    agent_id: xxxx
                    start_ts: 123
                    end_ts: 144
                    status: STOPPED
                    contents:
                      - role: user
                        content: hello.
                      - role: assistant
                        content: 'hi, how can I help you?'
                    # tool_calls:
                    #   - index: 0
                    #     type: function
                    #     id: call_u9oldpnqdxxxxxxaqdkaqjzq
                    #     function:
                    #       name: _publish_message
                    #       arguments: '{"content": "hello"}'
                    # - role: tool
                    #   content: '{"result": "ok"}'
                    # tool_call_id: call_u9oldpnqdxxxxxxaqdkaqjzq
                properties:
                  agent_id:
                    type: string
                    description: Unique agent identifier.
                  start_ts:
                    type: integer
                    description: Agent creation timestamp.
                  status:
                    type: string
                    description: Agent running status. Only querying agents whose status is `RUNNING` (2) is supported.
                  contents:
                    type: array
                    description: Agent short-term memory.
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                          description: "Message sender. Possible values:\r\n- `user`: User.\r\n- `assistant`: Agent."
                        content:
                          type: string
                          description: Message content.
              #           tool_calls:
              #             type: array
              #             description: Tool call information. Returned only when `role` is `assistant` and this message triggered a tool call. Contains the following fields:
              #             items:
              #               type: object
              #               properties:
              #                 index:
              #                   type: integer
              #                   description: Tool call index.
              #                 type:
              #                   type: string
              #                   description: Tool call type. Currently only `function`, that is, function invocation, is supported.
              #                 id:
              #                   type: string
              #                   description: Tool call ID. A unique ID is generated for each tool invocation request.
              #                 function:
              #                   type: object
              #                   description: Function call information.
              #                   properties:
              #                     name:
              #                       type: string
              #                       description: "Function name. Currently supported:\r\n- `_publish_message`: Publish a message to the client side."
              #                     arguments:
              #                       type: string
              #                       description: Function arguments.
              #           tool_call_id:
              #             type: string
              #             description: Tool call ID. Returned only when `role` is `tool`, corresponding to the tool call result reflected in `content`.
              examples:
                Example 1:
                  value:
                    agent_id: xxxx
                    start_ts: 123
                    status: RUNNING
                    contents:
                      - role: user
                        content: hello.
                      - role: assistant
                        content: 'hi, how can I help you?'
                    #           tool_calls:
                    #             - index: 0
                    #               type: function
                    #               id: call_u9oldpnqdxxxxxxaqdkaqjzq
                    #               function:
                    #                 name: _publish_message
                    #                 arguments: '{"content": "hello"}'
                    #         - role: tool
                    #           content: '{"result": "ok"}'
                    #           tool_call_id: call_u9oldpnqdxxxxxxaqdkaqjzq
  '/v2/projects/{appid}/agents/{agentId}/turns':
    get:
      summary: Query Conversation Turn Information
      description: |
        After a session with an agent ends, call this API to query the conversation turn information for that session, including the start information, end information, and performance metrics for each turn.
        > Only sessions from the last 7 days are supported.
      operationId: get-turns
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/appid'
        - $ref: '#/components/parameters/agentId'
      responses:
        '200':
          description: "- If the returned status code is `200`, the request is successful and the response body contains the result of this request.\r\n- If the returned status code is not `200`, the request has failed. The response body contains the error type and description. For possible reasons, see [Response Status Codes](https://doc.shengwang.cn/doc/convoai/restful/api/response-code)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  turns:
                    type: array
                    description: Conversation turn list.
                    items:
                      type: object
                      properties:
                        agent_id:
                          type: string
                          description: Unique agent identifier.
                        channel:
                          type: string
                          description: Conversation channel name.
                        turn_id:
                          type: integer
                          description: Conversation turn ID, incrementing from 1.
                        start:
                          type: object
                          description: Turn start information.
                          properties:
                            start_at:
                              type: integer
                              description: Start timestamp in millisecond-level UTC time.
                            type:
                              type: string
                              description: |
                                Start type:
                                - `voice_input`: Started due to user voice input.
                                - `greeting`: Started because the agent played a greeting.
                                - `silence_timeout`: Started because the agent reached a silence timeout.
                                - `api_speak`: Started because information was spoken by calling the [Speak a Custom Message](/doc/convoai/restful/convoai/operations/agent-speak) API.
                            metadata:
                              $ref: '#/components/schemas/sos_metadata'
                              description: Start metadata. Contains different fields depending on the value of `type`.
                        end:
                          type: object
                          description: Turn end information.
                          properties:
                            end_at:
                              type: integer
                              description: End timestamp in millisecond-level UTC time.
                            type:
                              type: string
                              description: |
                                Turn end type:
                                - `ok`: Ended normally.
                                - `interrupted`: Interrupted.
                                - `ignored`: Ignored.
                                - `error`: Execution error.
                            metadata:
                              $ref: '#/components/schemas/eos_metadata'
                              description: End metadata. Contains different fields depending on the value of `type`.
                        metrics:
                          type: object
                          description: Detailed performance metrics for the conversation turn.
                          properties:
                            e2e_latency_ms:
                              type: integer
                              description: End-to-end total latency (ms).
                            segmented_latency_ms:
                              type: array
                              description: Detailed list of segmented latency metrics.
                              items:
                                type: object
                                properties:
                                  name:
                                    $ref: '#/components/schemas/metrics_modality'
                                    description: Name of the latency module. Different latency modules are returned depending on the LLM input modality configured when [creating the conversational AI agent](/doc/convoai/restful/convoai/operations/start-agent).
                                  latency:
                                    type: integer
                                    description: Latency (ms).
              examples:
                Example 1:
                  value:
                    turns:
                      - agent_id: A42Axxxxxxxxx37MT56J
                        channel: test_channel
                        turn_id: 1
                        start:
                          start_at: 1774579820147
                          type: greeting
                          metadata:
                            greeting_nth: 1
                        end:
                          end_at: 1774579822412
                          type: interrupted
                          metadata:
                            caused_by: api_interrupt
                            transport: rtm
                        metrics:
                          e2e_latency_ms: 337
                          segmented_latency_ms:
                            - name: tts_ttfb
                              latency: 337
      servers:
        - url: 'https://api.agora.io/cn/api/conversational-ai-agent'
          description: ''
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: 'When sending an HTTP request, choose one of the following authentication methods:<ol><li>**(Recommended) Use an RTC Token**: Put the RTC Token used by your Agora Conversational AI Engine project in the `Authorization` field. You can get a token in the following ways:<ul><li>In a test environment, you can generate a temporary token for your project from the [Agora Console](https://console.shengwang.cn/). It is valid for 24 hours.</li><li>In a production environment, you can deploy a token server by referring to [Use Token Authentication](https://doc.shengwang.cn/doc/rtc/android/basic-features/token-authentication) to generate tokens.</li></ul>Example parameter: `Authorization: agora token="007abcxxxxxxx123"`</li><li>**Use Basic Auth**: Generate a Base64-encoded `Authorization` field by following [Implement HTTP Authentication](https://doc.shengwang.cn/doc/convoai/restful/user-guides/http-basic-auth).<br/>Example parameter: `Authorization: Basic NDI1OTQ3N2I4MzYy...YwZjA=`</li></ol>'
      required: true
      schema:
        type: string
        example: agora token=007abcxxxxxxxxxxxxxx123
    appid:
      name: appid
      in: path
      description: 'The [App ID](http://doc.shengwang.cn/doc/convoai/restful/get-started/enable-service#%E8%8E%B7%E5%8F%96-app-id) used by your project.'
      required: true
      schema:
        type: string
    agentId:
      name: agentId
      in: path
      description: 'Agent instance ID, that is, the unique identifier of the agent. It is returned in the response body after [POST Create a Conversational AI Agent](https://doc.shengwang.cn/doc/convoai/restful/convoai/operations/start-agent) succeeds.'
      required: true
      schema:
        type: string
    phone_number:
      name: phone_number
      in: path
      description: Phone number in E.164 format, for example `+11234567890`, used as a unique identifier.
      required: true
      schema:
        type: string
  responses:
    '200':
      description: |-
        - If the returned status code is `200`, the request is successful and the response body contains the result of this request.
        - If the returned status code is not `200`, the request has failed. The response body contains the error type and description. For possible reasons, see [Response Status Codes](https://doc.shengwang.cn/doc/convoai/restful/api/response-code).
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                agent_id: 1NT29X10YHxxxxxWJOXLYHNYB
                create_ts: 1737111452
                state: RUNNING
            properties:
              agent_id:
                $ref: '#/components/schemas/agent_id'
                description: Unique agent identifier.
              create_ts:
                $ref: '#/components/schemas/start_ts'
                description: Agent creation timestamp.
              status:
                type: string
                description: "Agent running status:\r\n- `IDLE` (0): Idle agent.\r\n- `STARTING` (1): Agent is starting.\r\n- `RUNNING` (2): Agent is running.\r\n- `STOPPING` (3): Agent is stopping.\r\n- `STOPPED` (4): Agent has fully exited.\r\n- `RECOVERING` (5): Agent is recovering.\r\n- `FAILED` (6): Agent execution failed."
          examples:
            Example 1:
              value:
                agent_id: 1NT29X10YHxxxxxWJOXLYHNYB
                create_ts: 1737111452
                status: RUNNING
    phone_number_error:
      description: |
        If the returned HTTP status code is not a success status code, the request has failed. The response body contains a JSON object with the error type and description.
        
        **Possible status codes and reasons:**
        
        - 401 `unauthorized`: Authentication failed. Check your credentials.
        - 404 `not_found`: The specified phone number was not found.
        - 409 `phone_number_exists`: The phone number already exists and cannot be imported again.
        - 409 `conflict`: Concurrent modification conflict or resource lock.
        - 422 `unprocessable_content`: Invalid request format or parameter validation failed.
        - 500 `internal_server_error`: Internal server error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error_type:
                type: string
                description: Error type.
              description:
                type: string
                description: Error description.
          examples:
            Example 1:
              value:
                error_type: "unauthorized"
                description: "Authentication failed. Check your credentials."
    outbound_call_error:
      description: |
        If the returned HTTP status code is not 200, the request has failed. The response body contains a JSON object with the error type and description.
        
        **Possible status codes and reasons:**
        
        - 400 `invalid_phone_format`: Invalid phone number format, not in E.164 format.
        - 401 `unauthorized`: Authentication failed. Check your credentials.
        - 500 `internal_server_error`: Internal server error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error_type:
                type: string
                description: Error type.
              description:
                type: string
                description: Error description.
          examples:
            Example 1:
              value:
                error_type: "invalid_phone_format"
                description: "Invalid phone number format, not in E.164 format."
  schemas:
    voice_id:
      type: string
      title: voice_id
      description: 'Agent voice ID. For supported voice IDs, see the [Voice ID Table](https://doc.shengwang.cn/doc/convoai/doc/convoai/restful/api/voice-ids).'
    max_history:
      type: integer
      description: Number of short-term memory entries cached in the LLM. The value range is `[1,1024]`. Short-term memory includes conversation messages between the user and the agent, tool call information, and timestamps. Agent and user entries are recorded separately.
      default: 32
    tts_params:
      title: params
      description: |-
        TTS configuration parameters. The structure of this parameter differs by TTS provider.
        > Agora Conversational AI Engine does not guarantee full support for parameters that are not mentioned in the sample code for each provider.
      oneOf:
        - $ref: '#/components/schemas/tts_minimax'
        - $ref: '#/components/schemas/tts_tencent'
        - $ref: '#/components/schemas/tts_bytedance'
        - $ref: '#/components/schemas/tts_microsoft'
        - $ref: '#/components/schemas/tts_cosyvoice'
        - $ref: '#/components/schemas/tts_duplex'
        - $ref: '#/components/schemas/tts_stepfun'
    tts_minimax:
      title: Minimax
      type: object
      additionalProperties: {}
      description: |-
        Minimax TTS. For the detailed protocol, see the [official Minimax documentation](https://platform.minimaxi.com/docs/api-reference/speech-t2a-http). Example:
        ```json
        "params": {
            "key": "xxxx",
            "model": "speech-01-turbo",
            "voice_setting": {
                "voice_id": "female-shaonv",
                "speed": 1,
                "vol": 1,
                "pitch": 0,
                "emotion": "happy",
                "latex_read": True,
                "english_normalization": True,
            },
            "audio_setting": {
                "sample_rate": 16000
            },
            "pronunciation_dict": {
                "tone": ["hello/(he1)(llo1)", "message/(me1)(ssa1)(ge1)"]
            },
            # Either voice_id or timber_weights is required
            # "timber_weights": [{
            #     "voice_id": "male-qn-qingse",
            #     "weight": 1
            # },
            # {
            #     "voice_id": "female-shaonv",
            #     "weight": 5
            # }],
            "language_boost": "auto"
        }
        ```
    tts_tencent:
      title: Tencent
      type: object
      additionalProperties: {}
      description: |-
        Tencent Cloud TTS. For the detailed protocol, see the [official Tencent Cloud documentation](https://cloud.tencent.com/document/product/1073/94308). Example:
        ```json
        "params": {
            "app_id": "xxxx",
            "secret_id": "xxxx",
            "secret_key": "xxxx",
            "voice_type": 601005,
            "volume": 0,
            "speed": 0,
            "emotion_category": "happy",
            "emotion_intensity": 100
        }
        ```
    tts_bytedance:
      title: Bytedance
      type: object
      description: |-
        Volcengine TTS. For the detailed protocol, see the [official Volcengine documentation](https://www.volcengine.com/docs/6561/79823). Example:
        ```json
        "params": {
            "token": "xxxxx",
            "app_id": "xxxx",
            "cluster": "volcano_tts",
            "voice_type": "BV700_streaming",
            "speed_ratio": 1.0,
            "volume_ratio": 1.0,
            "pitch_ratio": 1.0,
            "emotion": "happy"
        }
        ```
      additionalProperties: {}
    tts_cosyvoice:
      title: CosyVoice
      type: object
      additionalProperties: {}
      description: |-
        Alibaba Cloud CosyVoice TTS. For the detailed protocol, see the [official Alibaba Cloud documentation](https://help.aliyun.com/zh/model-studio/cosyvoice-large-model-for-speech-synthesis/). Example:
        ```json
        "params": {
          "api_key": "your_cosyvoice_api_key",
          "model": "cosyvoice-v1",
          "sample_rate": 16000,
          "voice": "longxiaochun"
        }
        ```
    tts_duplex:
      title: Bytedance Duplex
      type: object
      additionalProperties: {}
      description: |-
       Volcengine bidirectional streaming TTS. For the detailed protocol, see the [official Volcengine documentation](https://www.volcengine.com/docs/6561/1329505). Example:
        ```json
        "params": {
          "app_id": "your_bytedance_tts_app_id",
          "token": "your_bytedance_tts_token",
          "speaker": "zh_female_shuangkuaisisi_moon_bigtts"
        }
        ```
    tts_stepfun:
      title: StepFun
      type: object
      additionalProperties: {}
      description: |-
       StepFun TTS. For the detailed protocol, see the [official StepFun documentation](https://platform.stepfun.com/docs/api-reference/audio/ws_audio). Example:
        ```json
        "params": {
          "api_key": "your_stepfun_tts_key",
          "model": "step-tts-mini",
          "voice_id": "cixingnansheng"
        }
        ```

    agent_id:
      title: agent_id
      type: string
      description: Conversational AI agent ID, that is, the unique identifier of the agent.
    channel:
      title: channel
      type: string
      description: RTC channel name where the agent is located.
    start_ts:
      title: start_ts
      type: integer
      description: Agent creation timestamp.
    tts_microsoft:
      title: Microsoft
      type: object
      additionalProperties: {}
      description: |-
        Microsoft Azure TTS. The following example and parameter descriptions apply:
        ```json
        "params": {
            "key": "<your_microsoft_key>",
            "region": "chinaeast2",
            "voice_name": "zh-CN-YunxiNeural",
            "speed": 1.0,
            "volume": 70
        }
        ```
        - `key`: (required) String. API key for Microsoft Azure.
        - `region`: (required) String. Region of the Microsoft TTS service.
        - `voice_name`: (required) String. Voice.
        - `speed`: (optional) Number. Speech rate. The value range is [0.5, 2.0], and the default is 1.0. It indicates the speaking speed of the text and can be applied at the word or sentence level.
        - `volume`: (optional) Number. Volume. The value range is [0.0, 100.0], and the default is 100. For example, a value of 75 means the volume is set to 75% of the maximum.
        - `sample_rate`: (optional) Integer. Audio sample rate (Hz). Supported values are [16000, 24000, 48000], and the default is 24000.

        > For more information, see the [official Microsoft documentation](https://docs.azure.cn/zh-cn/ai-services/speech-service/).
    metrics_modality:
      title: modality
      type: string
      description: Name of the latency module. Different latency modules are returned depending on the LLM input modality configured when [creating the conversational AI agent](/doc/convoai/restful/convoai/operations/start-agent).
      oneOf:
        - $ref: '#/components/schemas/metrics_modality_text'
        - $ref: '#/components/schemas/metrics_modality_audio'
    metrics_modality_text:
      title: text
      type: string
      description: |
        When the LLM input modality is `text`, the following latency modules are returned:
          - `algorithm_processing`: Algorithm processing latency.
          - `asr_ttlw`: TTLW (Time To Last Word) metric of the ASR module, indicating the latency from detection of the end of user speech to ASR output of the last word.
          - `llm_ttft`: TTFT (Time To First Token) metric of the LLM module, indicating the latency from the end of user speech to the first token output by the LLM.
          - `llm_ftfs`: FTFS (First token To First Sentence) metric of the LLM module, indicating the latency from the first token output by the LLM to the first complete sentence.
          - `tts_ttfb`: TTFB (Time To First Byte) metric of the TTS module, indicating the latency from when the TTS module receives the text request to when it outputs the first audio byte.
          - `transport`: Network transport latency (ms). Currently, this field is not returned when the user uses the RTC Web SDK.
    metrics_modality_audio:
      title: audio
      type: string
      description: |
        When the LLM input modality is `audio`, the following latency modules are returned:
          - `algorithm_processing`: Algorithm processing latency.
          - `asr_ttlw`: TTLW (Time To Last Word) metric of the ASR module, indicating the latency from detection of the end of user speech to ASR output of the last word.
          - `llm_ttfa`: TTFA (Time To First Audio to First Byte) metric of the LLM module, indicating the latency from the end of user speech to the first audio byte output by the LLM and received by the TTS module.
          - `transport`: Network transport latency (ms). Currently, this field is not returned when the user uses the RTC Web SDK.
    eos_metadata:
      title: metadata
      description: |-
        End metadata. Contains different fields depending on the value of `type`.
      oneOf:
        - $ref: '#/components/schemas/eos_metadata_ok'
        - $ref: '#/components/schemas/eos_metadata_interrupted'
        - $ref: '#/components/schemas/eos_metadata_ignored'
        - $ref: '#/components/schemas/eos_metadata_error'
    eos_metadata_ok:
      title: ok
      type: object
      description: Metadata for a normal end.
      properties:
        playback_duration_ms:
          type: integer
          description: Voice playback duration (ms).
    eos_metadata_interrupted:
      title: interrupted
      type: object
      description: Metadata for interruption.
      properties:
        caused_by:
          type: string
          description: |
            Reason why the turn was interrupted:
            - `start_of_speech`: A new voice request started.
            - `api_speak`: Interrupted because information was spoken by calling the [Speak a Custom Message](/doc/convoai/restful/convoai/operations/agent-speak) API.
            - `api_interrupt`: Interrupted because the [Interrupt an Agent](/doc/convoai/restful/convoai/operations/agent-interrupt) API was called.
            - `api_leave`: Interrupted because the [Stop a Conversational AI Agent](/doc/convoai/restful/convoai/operations/leave-channel) API was called to leave the channel.
        transport:
          type: string
          description: |
            Transport protocol, returned when `caused_by` is `api_speak` or `api_interrupt`:
            - `http`: HTTP protocol.
            - `rtm`: Transmitted through the RTM Presence channel.
    eos_metadata_ignored:
      title: ignored
      type: object
      description: Metadata for an ignored turn.
      properties:
        caused_by:
          type: string
          description: |
            Reason why the turn was ignored:
            - `semantic`: Ignored because graceful interruption was enabled when [creating the conversational AI agent](/doc/convoai/restful/convoai/operations/start-agent) (`turn_detection.config.end_of_speech.mode` was `semantic`) and semantic rules determined that no response was needed.
            - `keywords`: Ignored because keyword-based turn start detection was enabled when [creating the conversational AI agent](/doc/convoai/restful/convoai/operations/start-agent) (`turn_detection.config.start_of_speech.mode` was `keywords`) and no start keyword was matched.
            - `disable`: Ignored because turn detection was configured as non-interruptible.
    eos_metadata_error:
      title: error
      type: object
      description: Metadata for an error.
      properties:
        reason:
          type: string
          description: |
            Error type. Possible values include:
            - `LLM_REQUEST_ERR`: LLM request error.
            - `INTERNAL_ERR`: Internal error.
        details:
          type: string
          description: Error details.
    sos_metadata:
      title: metadata
      description: |-
        Start metadata. Contains different fields depending on the value of `type`.
      oneOf:
        - $ref: '#/components/schemas/sos_metadata_voice_input'
        - $ref: '#/components/schemas/sos_metadata_greeting'
        - $ref: '#/components/schemas/sos_metadata_silence_timeout'
        - $ref: '#/components/schemas/sos_metadata_api_speak'
    sos_metadata_voice_input:
      title: voice_input
      type: object
      description: Metadata for voice input.
      properties:
        speech_duration_ms:
          type: integer
          description: Speech duration (ms).
        interrupt_duration_ms:
          type: integer
          description: Human-speech duration threshold (ms) when the agent is idle or listening.
    sos_metadata_greeting:
      title: greeting
      type: object
      description: Metadata for a greeting.
      properties:
        greeting_nth:
          type: integer
          description: Greeting playback count.
    sos_metadata_silence_timeout:
      title: silence_timeout
      type: object
      description: Metadata for silence timeout.
      properties:
        action:
          type: string
          description: |
            - `speak`: Speak the silence prompt content.
            - `think`: Append the silence prompt content to the end of the context and pass it to the LLM.
    sos_metadata_api_speak:
      title: api_speak
      type: object
      description: Metadata for speaking custom information.
      properties:
        transport:
          type: string
          description: |
            Transport protocol:
            - `http`: HTTP protocol.
            - `rtm`: Transmitted through the RTM Presence channel.
    asr_params:
      title: params
      description: |-
        ASR configuration parameters. The structure of this parameter differs by ASR provider.
        > Agora Conversational AI Engine does not guarantee full support for parameters that are not mentioned in the sample code for each provider.
      oneOf:
        - $ref: '#/components/schemas/asr_tencent'
        - $ref: '#/components/schemas/asr_microsoft'
        - $ref: '#/components/schemas/asr_xfyun'
        - $ref: '#/components/schemas/asr_xfyun_bigmodel'
        - $ref: '#/components/schemas/asr_xfyun_dialect'
    asr_tencent:
      title: Tencent
      type: object
      additionalProperties: {}
      description: |-
        Tencent Cloud ASR. For the detailed protocol, see the [official Tencent Cloud documentation](https://cloud.tencent.com/document/product/1093/48982). Example:
        ```json
        "params": {
            "key": secret_key,
            "app_id": app_id,
            "secret": secret,
            "engine_model_type": "16k_zh",
            "voice_id": "TBgVFCsxdn3i2DGt",
        }
        ```
    asr_xfyun:
      title: xfyun
      type: object
      additionalProperties: {}
      description: |-
        iFlytek traditional speech transcription and recognition service. For the detailed protocol, see the [official iFlytek documentation](https://www.xfyun.cn/doc/spark/asr_llm/rtasr_llm.html). Example:
        ```json
        "params": {
            "api_key": "XFYUN_ASR_API_KEY",
            "app_id": "XFYUN_ASR_APP_ID",
            "api_secret": "XFYUN_ASR_API_SECRET",
            "language": "zh_cn"
        }
        ```
    asr_xfyun_bigmodel:
      title: xfyun_bigmodel
      type: object
      additionalProperties: {}
      description: |-
        iFlytek large-model speech recognition service. For the detailed protocol, see the [official iFlytek documentation](https://www.xfyun.cn/doc/spark/asr_llm/rtasr_llm.html). Example:
        ```json
        "params": {
            "api_key": "XFYUN_ASR_BIGMODEL_API_KEY",
            "app_id": "XFYUN_ASR_BIGMODEL_APP_ID",
            "api_secret": "XFYUN_ASR_BIGMODEL_API_SECRET",
            "language_name": "cn",
            "language":"mix"
        }
        ```
    asr_xfyun_dialect:
      title: xfyun_dialect
      type: object
      additionalProperties: {}
      description: |-
        iFlytek dialect free-speech recognition service. For the detailed protocol, see the [official iFlytek documentation](https://www.xfyun.cn/doc/spark/asr_llm/rtasr_llm.html). Example:
        ```json
        "params": {
            "app_id": "XFYUN_ASR_DIALOG_APP_ID",
            "access_key_id": "XFYUN_ASR_DIALOG_ACCESS_KEY_ID",
            "access_key_secret":"XFYUN_ASR_DIALOG_ACCESS_KEY_SECRET",
            "language": "zh-CN"
        }
        ```
    asr_microsoft:
      title: Microsoft
      type: object
      additionalProperties: {}
      description: |-
        Microsoft ASR. Example:
        ```json
        "params": {
            "key": "<your_microsoft_key>",
            "region": "chinaeast2",
            "language": "zh-CN",
            "phrase_list": ["agora", "fengming"],
        }
        ```
        - `key`: (required) String. API key for the Microsoft ASR service.
        - `region`: (required) String. Region of the Microsoft ASR service. See [supported regions](https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support?tabs=stt).
        - `language`: (required) String. Language. See [supported languages](https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support?tabs=stt).
        - `phrase_list`: (optional) Array[String]. Hotword list.
    avatar_params:
      title: params
      description: |-
        Digital human configuration parameters. The structure of this parameter differs by digital human provider.
        > Agora Conversational AI Engine does not guarantee full support for parameters that are not mentioned in the sample code for each provider.
      oneOf:
        - $ref: '#/components/schemas/avatar_sensetime'
    avatar_sensetime:
      title: Sensetime
      type: object
      additionalProperties: {}
      description: |-
        Sensetime digital human configuration parameters. For the detailed protocol, see the [official Sensetime documentation](https://aigc.softsugar.com/html/help/5-%E7%9B%B4%E6%92%AD.html#%E7%9B%B4%E6%92%AD%E8%84%9A%E6%9C%ACjson%E5%AE%9A%E4%B9%89%E8%AF%B4%E6%98%8E). Example:
        ```json
        "params": {
            "agora_token": "agora_token",
            "agora_uid": "agora_uid",
            "appId": "sensetime_app_id",
            "app_key": "sensetime_app_key",
            "sceneList": [
                {
                    "digital_role": {
                        "face_feature_id": "face_feature_id",
                        "position": {"x": 0, "y": 0},
                        "url": "https://example-digital-human-models/avatar_id.zip"
                    }
                }
            ]
        }
        ```
        > - The following Sensetime digital human configuration fields are currently not supported for passthrough in `params`: `tts_config`, `tts_query`, `audios`, `quick_response`, `quick_response_preload_list`, `opening_words`.
        > - `agora_uid` must be a numeric string no longer than 32 bits (`0` to `2^32-1`), for example `"1234"`.
    filler_words_trigger_config:
      title: config
      description: |-
        Filler-word trigger configuration parameters. The parameter name and structure differ by trigger mode.
        > - The configuration type you pass must match `mode`. For example, when `mode` is `"fixed_time"`, pass the configuration for `fixed_time_config`.
        > - Do not pass multiple mode configurations at the same time.
      oneOf:
        - $ref: '#/components/schemas/filler_words_trigger_fixed_time_config'
        # - $ref: '#/components/schemas/filler_words_trigger_semantic_config'
    filler_words_trigger_fixed_time_config:
      title: fixed_time_config
      type: object
      description: |-
        Fixed-time trigger configuration. Example:
        ```json
        "config": {
            "response_wait_ms": 1500
        }
        ```
      properties:
        response_wait_ms:
          type: integer
          description: LLM response wait threshold (ms), with a value range of [100, 10000]. When the LLM remains in a waiting state, for example while waiting for RAG retrieval results or tool-call results, for at least this threshold and has not yet generated response content, filler-word playback is triggered.
          default: 1500
    # filler_words_trigger_semantic_config:
    #   title: semantic_config
    #   type: object
    #   description: |-
    #     Semantic trigger configuration (future support). Example:
    #     ```json
    #     "config": {
    #     }
    #     ```
    #   properties: {}
    filler_words_content_config:
      title: config
      description: |-
        Filler-word content configuration parameters. The parameter name and structure differ by content mode.
        > - The configuration type you pass must match `mode`. For example, when `mode` is `"static"`, pass the configuration for `static_config`.
        > - Do not pass multiple mode configurations at the same time.
      oneOf:
        - $ref: '#/components/schemas/filler_words_content_static_config'
        # - $ref: '#/components/schemas/filler_words_content_generated_config'
    filler_words_content_static_config:
      title: static_config
      type: object
      description: |-
        Static filler-word configuration. Example:
        ```json
        "static_config": {
            "phrases": [
                "Please hold on.",
                "Okay.",
                "Mm-hmm."
            ],
            "selection_rule": "shuffle"
        }
        ```
      properties:
        phrases:
          type: array
          description: |-
            List of filler phrases.
            > - Up to 100 filler phrases are supported.
            > - Each filler phrase must not exceed 50 Chinese characters or 50 English words.
          items:
            type: string
          maxItems: 100
        selection_rule:
          type: string
          description: |-
            Filler-word selection rule. Supported values:
            - `"shuffle"`: Random shuffle. Previously used filler phrases are not repeated until all phrases have been used once. After all phrases have been played, the list is shuffled again and a new round begins.
            - `"round_robin"`: Round-robin. Filler phrases are selected and played in order from the list. After all phrases have been played once, a new cycle begins.
          enum:
            - shuffle
            - round_robin
          default: shuffle
    # filler_words_content_generated_config:
    #   title: generated_config
    #   type: object
    #   description: |-
    #     Dynamic filler-word generation configuration (future support). Example:
    #     ```json
    #     "config": {
    #         "llm_provider": "tongyi_qianwen",
    #         "prompt": "Generate a brief reply within 5 words to indicate that processing is in progress",
    #         "fallback_strategy": "none",
    #         "generation_timeout_ms": 2000
    #     }
    #     ```
    #   properties:
    #     llm_provider:
    #       type: string
    #       description: |-
    #         LLM provider used to generate filler words. Supported values:
    #         - `"tongyi_qianwen"`: Tongyi Qianwen.
    #         - `"openai"`: OpenAI.
    #     prompt:
    #       type: string
    #       description: Prompt instruction used to generate filler words. For example: "Generate a brief reply within 5 words to indicate that processing is in progress".
    #     fallback_strategy:
    #       type: string
    #       description: |-
    #         Fallback strategy when generation fails. Supported values:
    #         - `"none"`: No fallback. Do not play filler words.
    #       enum:
    #         - none
    #     generation_timeout_ms:
    #       type: integer
    #       description: Generation timeout (ms), with a value range of [100, 5000]. After a timeout, the system handles it according to `fallback_strategy`.
    #       default: 2000
    #       minimum: 100
    #       maximum: 5000
    start_of_speech_config:
      title: '{mode}_config'
      description: |-
        Configuration parameters for start-of-speech detection. The structure and supported fields differ by detection mode.
        Pass the corresponding configuration field according to `mode`. For example, when `mode` is `"vad"`, pass `vad_config`. Do not pass multiple mode configurations at the same time.
      oneOf:
        - $ref: '#/components/schemas/start_of_speech_vad_config'
        - $ref: '#/components/schemas/start_of_speech_keywords_config'
        - $ref: '#/components/schemas/start_of_speech_disabled_config'
    start_of_speech_vad_config:
      title: vad_config
      type: object
      description: |-
        VAD-based start-of-speech detection configuration. Example:
        ```json
        "vad_config": {
            "interrupt_duration_ms": 160,
            "speaking_interrupt_duration_ms": 160,
            "prefix_padding_ms": 800,
        }
        ```
      properties:
        interrupt_duration_ms:
          type: integer
          description: Human-speech duration threshold (ms) when the agent is idle or listening, with a value range of [120, 1200]. This is the minimum duration for which human speech must be continuously detected to avoid false interruption.
          default: 160
        speaking_interrupt_duration_ms:
          type: integer
          description: Human-speech duration threshold (ms) when the agent is speaking, with a value range of [120, 1200]. This is the minimum duration for which human speech must be continuously detected to avoid false interruption. It is usually set higher than `interrupt_duration_ms` to avoid falsely interrupting the agent due to brief human speech while the agent is speaking.
          default: 160
        prefix_padding_ms:
          type: integer
          description: Prefix padding threshold (ms), with a value range of [0, 5000]. This is the minimum speech duration required to start a new speech segment and helps prevent very short sounds from triggering speech activity detection.
          default: 800
        # ignored_words:
        #   type: array
        #   description: |-
        #     Ignore-word list. The semantic module recognizes these words and does not trigger conversation start when they are detected, for example "uh-huh" or "okay".
        #     > - Recognition quality for ignore words depends on the ASR provider you selected.
        #     > - Up to 128 ignore words can be configured.
        #   items:
        #     type: string
        #   maxItems: 128
    start_of_speech_keywords_config:
      title: keywords_config
      type: object
      deprecated: true
      description: Deprecated. Use top-level `interruption.mode = "keywords"` together with `interruption.keywords_config.trigger_keywords` to implement keyword-based interruption.
      properties: {}
    start_of_speech_semantic_config:
      title: semantic_config
      type: object
      description: |-
        Semantic-based start-of-speech detection configuration. Example:
        ```json
        "semantic_config": {
            "interrupt_duration_ms": 160,
            "prefix_padding_ms": 800,
        }
        ```
      properties:
        interrupt_duration_ms:
          type: integer
          description: Human-speech duration threshold (ms), with a value range of [120, 1200]. This is the minimum duration for which human speech must be continuously detected to avoid false interruption.
          default: 160
        prefix_padding_ms:
          type: integer
          description: Prefix padding threshold (ms), with a value range of [0, 5000]. This is the minimum speech duration required to start a new speech segment and helps prevent very short sounds from triggering speech activity detection.
          default: 800
        # ignored_words:
        #   type: array
        #   description: |-
        #     Ignore-word list. The semantic module recognizes these words and does not trigger conversation start when they are detected.
        #     > - This field is optional. If it is not set, any semantic trigger starts the conversation.
        #     > - If this field is set, conversation starts only when no ignore word is matched and the semantic trigger fires.
        #     > - Recognition quality for ignore words depends on the ASR provider you selected.
        #     > - Up to 128 ignore words can be configured.
        #   items:
        #     type: string
        #   maxItems: 128
    start_of_speech_disabled_config:
      title: disabled_config
      type: object
      deprecated: true
      description: Deprecated. Use `interruption.enable = false` together with `interruption.disabled_config.strategy` to configure the post-disable interruption strategy.
      properties: {}
    end_of_speech_config:
      title: '{mode}_config'
      description: |-
        Configuration parameters for end-of-speech detection. The structure and supported fields differ by detection mode.
        Pass the corresponding configuration field according to `mode`. For example, when `mode` is `"vad"`, pass `vad_config`. Do not pass multiple mode configurations at the same time.
      oneOf:
        - $ref: '#/components/schemas/end_of_speech_vad_config'
        - $ref: '#/components/schemas/end_of_speech_semantic_config'
    end_of_speech_vad_config:
      title: vad_config
      type: object
      description: |-
        VAD-based end-of-speech detection configuration. Example:
        ```json
        "vad_config": {
            "silence_duration_ms": 480
        }
        ```
      properties:
        silence_duration_ms:
          type: integer
          description: Silence duration threshold (ms), with a value range of [120, 2000]. This is the minimum duration of silence at the end of speech to ensure that brief pauses do not end the speech segment too early.
          default: 480
    end_of_speech_semantic_config:
      title: semantic_config
      type: object
      description: |-
        Semantic-based end-of-speech detection configuration. Example:
        ```json
        "semantic_config": {
            "silence_duration_ms": 240,
            "max_wait_ms": 3000,
            "pause_state_enabled": true
        }
        ```
      properties:
        silence_duration_ms:
          type: integer
          description: Silence duration threshold (ms), with a value range of [120, 2000]. This is the minimum duration of silence at the end of speech to ensure that brief pauses do not end the speech segment too early.
          default: 240
        max_wait_ms:
          type: integer
          description: Maximum wait time (ms), with a value range of [500, 10000]. Pass `-1` to wait indefinitely. This is the maximum time to wait for semantic judgment. After timeout, the system determines whether the conversation has ended based on the current state.
          default: 3000
        pause_state_enabled:
          type: boolean
          default: true
          description: |
            Whether to determine that the user intends to pause the conversation:
            - `true`: (default) The agent determines semantically whether the user wants to pause the conversation. For example, when the user's input ends with phrases such as "wait a moment" or "hold on", the agent can determine that the user intends to pause and wait for follow-up input instead of immediately sending the input to the LLM.
            - `false`: The agent does not determine whether the user wants to pause the conversation.
    phone_number_object:
      title: phone_number_object
      type: object
      description: Phone number object that contains detailed information about the phone number.
      properties:
        provider:
          type: string
          description: |
            Number provider. Supported values:
            - `"byo"`: BYO (Bring Your Own).
            - `"aliyun"`: Alibaba Cloud.
        phone_number:
          type: string
          description: Phone number in E.164 format, used as the unique identifier.
        label:
          type: string
          description: Label used to identify the phone number.
        inbound:
          type: boolean
          description: Whether the phone number supports inbound calls.
        outbound:
          type: boolean
          description: Whether the phone number supports outbound calls.
        associated_pipeline:
          type: object
          nullable: true
          description: Associated pipeline information, or `null`.
          properties:
            pipeline_id:
              type: string
              description: Pipeline ID.
            pipeline_name:
              type: string
              description: Pipeline name.
        inbound_config:
          type: object
          nullable: true
          description: Details of SIP inbound call configuration, or `null`.
        outbound_config:
          type: object
          nullable: true
          description: Details of SIP outbound call configuration, or `null`.
  securitySchemes:
    Basic Auth:
      type: http
      scheme: basic
      description: 'When sending an HTTP request, use Basic HTTP Authentication and put the generated credential into the `Authorization` header of the HTTP request. For details on how to generate the `Authorization` field, see [Implement HTTP Authentication](https://doc.shengwang.cn/doc/convoai/restful/user-guides/http-basic-auth).'
security:
  - {}
  - Basic Auth: []

openapi: 3.1.0
info:
  version: ''
  title: Conversational AI Agent API Overview
  description: |-
    This document introduces the basic information for the Agora Conversational AI Agent RESTful API.

    ## Data Format

    All HTTP requests must use the `application/json` `Content-Type` request header. All request and response bodies use JSON.
servers:
  - url: 'https://api.agora.io/cn/api/conversational-ai-agent'
    description: ''
paths:
  '/v2/projects/{appid}/join':
    post:
      # tags:
      #   - Agent Management
      summary: Create Conversational AI Agent
      description: Create a Conversational AI agent instance and have it join an RTC channel.
      operationId: start-agent
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/appid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - properties
              properties:
                name:
                  type: string
                  description: Unique agent identifier. The same identifier cannot be used to create multiple agents.
                properties:
                  type: object
                  description: Detailed agent configuration.
                  required:
                    - channel
                    - agent_rtc_uid
                    - remote_rtc_uids
                    - tts
                    - llm
                  properties:
                    channel:
                      type: string
                      description: RTC channel name that the agent joins.
                    token:
                      type: string
                      description: "Token used to join the RTC channel, that is, the dynamic credential used for authentication. If your project has enabled an App Certificate, you must pass your project's dynamic token in this field. For details, see [Use a Token for Authentication](https://doc.shengwang.cn/doc/rtc/android/basic-features/token-authentication)."
                    agent_rtc_uid:
                      type: string
                      description: User ID of the agent in the RTC channel.
                    remote_rtc_uids:
                      type: array
                      description: "List of user IDs that the agent subscribes to in the RTC channel. Only subscribed users can interact with the agent. Currently, only one user ID is supported."
                      items:
                        type: string
                    # agent_rtm_uid:
                    #   type: string
                    #   description: |-
                    #     > This field is deprecated. See the [FAQ](https://doc.shengwang.cn/faq/integration-issues/generate-token) to generate a token with both RTC and RTM permissions, and use the `agent_rtc_uid` field instead.

                    #     User ID of the agent in the RTM channel. This field takes effect only when `advanced_features.enable_rtm` is `true`.
                    enable_string_uid:
                      type: boolean
                      default: false
                      description: |
                        Whether to enable String UID:
                        - `true`: Both the agent ID and subscribed user IDs use String UID.
                        - `false`: (default) Both the agent ID and subscribed user IDs use Int UID.
                        > Int and String user IDs cannot be mixed in the same channel. For more information, see [How to Use String User IDs](https://doc.shengwang.cn/faq/integration-issues/string-uid).
                    idle_timeout:
                      type: integer
                      description: Maximum RTC channel idle time in seconds. The channel is considered idle after all users specified in `remote_rtc_uids` leave the channel. When the idle time exceeds this value, the agent in the channel automatically stops and leaves the channel. If set to `0`, the agent keeps running until it is manually stopped.
                      default: 30
                    # silence_timeout:
                    #   type: integer
                    #   default: 0
                    #   description: |-
                    #     > This field is deprecated. Use `parameters.silence_config` instead.

                    #     Maximum agent silence time in seconds, in the range [0,60]. After the agent is created and a user joins the channel, the period during which the agent is neither listening, thinking, nor speaking is considered agent silence time. When the silence time reaches the configured value, the agent broadcasts the silence prompt configured in `llm.silence_message`, and then the silence timer starts over.
                    #     - Set to `0` (default): This feature is disabled.
                    #     - Set to (0,60]: You must also set `llm.silence_message`; otherwise the silence prompt cannot be broadcast and the setting does not take effect.
                    advanced_features:
                      type: object
                      description: Advanced feature configuration.
                      properties:
                        # enable_aivad:
                        #   type: boolean
                        #   default: false
                        #   description: |-
                        #     > This field is deprecated. Use `turn_detection.config.end_of_speech.mode = "semantic"` instead.
                        enable_rtm:
                          type: boolean
                          description: |-
                            Whether to enable the RTM real-time messaging service. When enabled, the agent automatically logs in to RTM and subscribes to the channel specified in `channel`. You can combine this with RTM capabilities to implement advanced features, such as [passing custom data](https://doc.shengwang.cn/doc/convoai/restful/user-guides/custom-data).

                            > Before enabling RTM, make sure the token has both RTC and RTM permissions. The agent reuses the token configured in the `token` field when joining the RTM channel. See the [FAQ](https://doc.shengwang.cn/faq/integration-issues/generate-token) to learn how to generate a token with both RTC and RTM permissions.
                          default: false
                        enable_sal:
                          type: boolean
                          description: |-
                            Whether to enable Selective Attention Locking (SAL). When enabled, configure the related options in the `sal` field so the agent can identify the user's voiceprint, distinguish between speakers, and suppress 95% of surrounding speech and noise.
                            > This feature is currently in beta.
                          default: false
                        enable_tools:
                          type: boolean
                          description: |-
                            Whether to enable tool calls. When enabled, the agent can call tools provided by MCP servers to implement more complex business logic.
                          default: false
                    asr:
                      type: object
                      description: Automatic speech recognition (ASR) configuration.
                      properties:
                        language:
                          type: string
                          description: "Language used when the user interacts with the agent:\r\n- `zh-CN`: Chinese (supports mixed Chinese and English)\r\n- `en-US`: English"
                          default: zh-CN
                        vendor:
                          type: string
                          description: |-
                            ASR provider. Supported values:
                            - `fengming`: (default) Agora Fengming ASR.
                            - `tencent`: Tencent ASR.
                            - `microsoft`: Microsoft ASR.
                            - `xfyun`: iFlytek real-time speech transcription service.
                            - `xfyun_bigmodel`: iFlytek large-model speech recognition service.
                            - `xfyun_dialect`: iFlytek dialect free-speech recognition service.
                        params:
                          $ref: '#/components/schemas/asr_params'
                          description: |
                            Configuration parameters for the selected ASR provider.
                            > See the request examples for parameter samples for different ASR providers.
                    tts:
                      type: object
                      description: Text-to-speech (TTS) module configuration.
                      required:
                        - vendor
                        - params
                      properties:
                        vendor:
                          type: string
                          description: |
                            TTS provider. Supported values:
                            - `minimax`：Minimax TTS
                            - `tencent`: Tencent TTS
                            - `bytedance`: Volcengine TTS
                            - `microsoft`: Microsoft Azure TTS
                            - `cosyvoice`: Alibaba Cloud CosyVoice TTS
                            - `bytedance_duplex`: Volcengine bidirectional streaming TTS
                            - `stepfun`: StepFun TTS
                        skip_patterns:
                          type: array
                          description: |
                            Filtering patterns that control whether content inside brackets in LLM output is skipped, so the agent does not read unnecessary structural hints such as tone or action descriptions aloud. The default value is `[]`, which means nothing is filtered. Supported values are as follows. Pass a value to enable that filter:
                            
                            - `1`: Skip content inside Chinese round brackets （ ）.
                            - `2`: Skip content inside Chinese square brackets.
                            - `3`: Skip content inside English round brackets ( ).
                            - `4`: Skip content inside English square brackets [ ].
                            - `5`: Skip content inside English curly braces \{ }.

                            > - If the input text contains nested brackets and multiple bracket types are configured to be skipped, the agent processes only the outermost bracket pair. The system matches from the beginning of the text, and once it finds the first outermost bracket pair that meets a skip rule, that pair and all of its contents, including any nested brackets of other types, are skipped as a whole.
                            > - Whether or not [real-time subtitles](https://doc.shengwang.cn/doc/convoai/restful/user-guides/realtime-sub) are enabled, the agent's short-term memory still contains the filtered content, that is, the complete text generated by the LLM.
                            > - When [real-time subtitles](https://doc.shengwang.cn/doc/convoai/restful/user-guides/realtime-sub) are enabled, the filtered content is omitted while TTS is speaking the sentence, and then added back to the subtitles after that sentence finishes playing.
                            > - Volcengine bidirectional streaming TTS does not currently support this feature.
                          items:
                            type: integer
                          default: []
                        params:
                          $ref: '#/components/schemas/tts_params'
                          description: |
                            Configuration parameters for the selected TTS provider.
                            > See the request examples for parameter samples for different TTS providers.
                    llm:
                      type: object
                      description: Large language model (LLM) configuration.
                      required:
                        - url
                      properties:
                        url:
                          type: string
                          description: LLM callback URL. It must be compatible with the OpenAI protocol.
                        api_key:
                          type: string
                          description: API key used to authenticate with the LLM. Empty by default. In production, enable API key authentication.
                        system_messages:
                          type: array
                          description: A set of predefined messages prepended to every LLM call to control the LLM output. These can include role definitions, prompts, and example responses. It must be compatible with the OpenAI protocol.
                          items:
                            type: object
                            additionalProperties: {}
                        max_history:
                          $ref: '#/components/schemas/max_history'
                        input_modalities:
                          type: array
                          
                          description: "Input modalities for the LLM. Supported values:\r\n- `[\"text\"]`: (default) Text only.\r\n- `[\"text\", \"image\"]`: Text plus images. The selected LLM must support vision input."
                          items:
                            type: string
                            default: text
                        output_modalities:
                          type: array
                          
                          description: "Output modalities for the LLM. Supported values:\r\n- `[\"text\"]`: (default) Text only. The text output is converted to speech by the TTS module and published to the RTC channel.\r\n- `[\"audio\"]`: Audio only. The audio is published directly to the RTC channel.\r\n- `[\"text\", \"audio\"]`: Text plus audio. You can implement your own logic to handle the LLM output as needed."
                          items:
                            type: string
                        greeting_message:
                          type: string
                          description: Agent greeting. If configured, when none of the users in the subscribed user list (`remote_rtc_uids`) are currently in the channel, the agent automatically sends the greeting to the first subscribed user who joins.
                          
                        greeting_configs:
                          type: object
                          description: |
                            Agent greeting playback configuration.
                          properties:
                            mode:
                              type: string
                              description: |
                                Agent greeting playback mode. Supported options:
                                - `"single_every"`: (default) The agent plays the greeting every time a user joins an empty channel.
                                - `"single_first"`: The agent plays the greeting only when the first user joins an empty channel.
                            delay_ms:
                              type: integer
                              description: Delay before the greeting is played, in milliseconds. The value range is [0, 5000]. When configured, the agent waits for the specified duration after the user joins before playing the greeting.
                        # greeting_interruptable:
                        #   type: boolean
                        #   description: |
                        #     Whether the agent greeting can be interrupted:
                        #     - `true`: (default) Interruptible. Follows the global interruption configuration (`turn_detection.start_of_speech`).
                        #     - `false`: Not interruptible. The greeting is played in full. User speech during playback is either ignored or appended to the LLM session, depending on the global interruption configuration.
                        template_variables:
                          type: object
                          description: |-
                            Dynamic parameter configuration used to insert variables into the agent's `system_messages`, `greeting_message`, `failure_message`, and `parameters.silence_config.content` text. The format is key-value pairs, where the key is the variable name and the value is the variable value.
                            
                            **Usage**: In prompt text, reference variables with the `{{variable_name}}` format. The system automatically replaces them with the corresponding values defined in `template_variables`.
                            > Note: Variable names and values cannot reference other variables. For example, in the custom variable `"farewell": "Looking forward to seeing you again, {{name}}"`, `{{name}}` is not resolved.
                          additionalProperties:
                            type: string
                        failure_message:
                          type: string
                          description: Agent failure prompt. If configured, it is returned through the TTS module when the LLM call fails.
                        # silence_message:
                        #   type: string
                          
                        #   description: |-
                        #     > This field is deprecated. Use `parameters.silence_config` instead.

                        #     Silence prompt message. The default value is an empty string. After the agent is created successfully and the user joins the channel, the time during which the agent is neither listening, thinking, nor speaking is considered silence time. When the silence time reaches the value set in `silence_timeout`, the agent plays the silence prompt. This parameter does not take effect when `silence_timeout` is set to `0`.
                        # style:
                        #   type: string
                        #   description: "LLM protocol. Supported values:\r\n- `\"openai\"` (default)\r\n- `\"dify\"`\r\n- `\"gemini\"`\r\n- `\"anthropic\"`"
                        vendor:
                          type: string
                          
                          description: |-
                            LLM provider. Two types of settings are supported:
                            - Commercial LLM providers, with the following supported values:
                              - `aliyun`: Alibaba Cloud
                              - `bytedance`: ByteDance
                              - `deepseek`: DeepSeek
                              - `tencent`: Tencent

                              Setting this improves compatibility and reduces request failures caused by carrying information unsupported by the LLM.
                            - A custom LLM, set to `"custom"`. When configured, the agent sends the following additional information when calling the custom LLM, in addition to `role` and `content`:
                              - `turn_id`: Unique conversation turn identifier. `turn_id` starts at 0 and increments by one. One turn between the user and the agent corresponds to one `turn_id`.
                              - `timestamp`: Request timestamp in milliseconds.
                        mcp_servers:
                          type: array
                          description: List of MCP (Model Context Protocol) server configurations. By configuring MCP servers, the agent can call tools provided by external services to implement more complex business logic.
                          items:
                            type: object
                            required:
                              - name
                              - endpoint
                            properties:
                              name:
                                type: string
                                description: |
                                  Unique identifier of the MCP server. Maximum length is 48 characters. The following characters are supported:
                                  - Lowercase letters: a to z
                                  - Uppercase letters: A to Z
                                  - Digits: 0 to 9
                                  - "." and "-"
                              endpoint:
                                type: string
                                description: Endpoint URL of the MCP server. The agent communicates with the MCP server through this address.
                              transport:
                                type: string
                                description: |
                                  Transport protocol. Supported values:
                                  - `"streamable_http"`: Streamable HTTP protocol
                              headers:
                                type: object
                                description: HTTP headers included when requesting the MCP server, such as authentication information.
                                additionalProperties:
                                  type: string
                              allowed_tools:
                                type: array
                                description: |
                                  List of tools the agent is allowed to call. Only tools in this list can be used by the agent.
                                  > `allowed_tools` behavior:
                                  > - If `allowed_tools` is omitted: all tools are enabled
                                  > - If `allowed_tools` is provided:
                                  >    - `[]`: no tools are enabled
                                  >    - `["*"]`: all tools are enabled
                                  >    - `["aa", "bb", "cc"]`: `aa`, `bb`, and `cc` are enabled
                                  >    - `["aa", "bb", "*"]`: all tools are enabled
                                items:
                                  type: string
                              timeout_ms:
                                type: integer
                                description: Timeout for MCP server requests, in milliseconds. After a timeout, the agent does not wait for the MCP server response and instead continues with subsequent logic.
                                default: 10000
                        headers:
                          type: object
                          description: |
                            Custom request headers attached when calling the LLM. You can use this field to pass through business-specific fields, tenant identifiers, and similar information.
                            > - Headers passed in this parameter are merged with the default headers generated by the Conversational AI Engine. If keys conflict, the headers generated by the Conversational AI Engine take precedence, for example authentication-related headers.
                            > - Header keys are merged using exact string matching and are case-sensitive. Agora recommends using standard canonical casing to avoid ambiguity caused by different letter case in the same header name.
                          additionalProperties: {}
                        params:
                          type: object
                          
                          description: Additional LLM information transmitted in the request body, such as the model used and the maximum token limit. Supported configurations vary by LLM provider. See the corresponding provider documentation and fill in the fields as needed.
                          additionalProperties: {}
                    avatar:
                      type: object
                      description: Avatar configuration.
                      properties:
                        enable:
                          type: boolean
                          description: |
                            Whether to enable the avatar feature for the agent:
                            - `true`: Enabled. When enabled, you must configure the `vendor` and `params` fields.
                            - `false`: (default) Disabled.

                            > Enabling the avatar feature incurs RTC video call charges. For details, see [RTC Billing](https://doc.shengwang.cn/doc/rtc/android/billing/billing-strategy).
                        vendor:
                          type: string
                          description: |
                            Avatar provider. Supported values:
                            - `sensetime`: SenseTime avatar
                        params:
                          $ref: '#/components/schemas/avatar_params'
                          description: |
                            Configuration parameters for the selected avatar provider.
                            > See the request examples for parameter samples for different avatar providers.
                    turn_detection:
                      type: object
                      description: |-
                        Conversation turn detection settings used to control voice activity detection and conversation turn determination logic.

                        > Since v2.6, `turn_detection` only handles Start of Speech (SoS) and End of Speech (EoS) detection. Keyword interruption and the handling strategy after interruption is disabled have been moved to the top-level `interruption` field.
                      properties:
                        mode:
                          type: string
                          
                          description: |-
                            Conversation turn detection mode. Currently supported values:
                            - `"default"`: (default) Default mode, which uses the standard conversation turn detection configuration.
                          enum:
                            - default
                          default: default
                        config:
                          type: object
                          
                          description: Detailed configuration for conversation turn detection.
                          properties:
                            speech_threshold:
                              type: number
                              description: Speech detection sensitivity, with a value range of (0.0, 1.0). It determines what level of sound in the audio signal is treated as voice activity. Lower values make the agent more likely to detect speech, while higher values may ignore faint sounds.
                              format: float
                              default: 0.5
                            start_of_speech:
                              type: object
                              description: Start of Speech (SoS) detection configuration, used to determine when the user starts speaking.
                              properties:
                                mode:
                                  type: string
                                  description: |-
                                    Start-of-speech detection mode. Supported values:
                                    - `"vad"`: (default) Triggered based on VAD (voice activity detection), using audio-signal detection.
                                    - `"keywords"`: Deprecated. Use `properties.interruption.mode = "keywords"` to configure keyword interruption.
                                    - `"disabled"`: Deprecated. Use `properties.interruption.enable = false` together with `properties.interruption.disabled_config.strategy` to configure the handling strategy after interruption is disabled.                                    

                                '{mode}_config':
                                  $ref: '#/components/schemas/start_of_speech_config'
                                  description: |
                                    Start-of-speech configuration parameters. Pass the corresponding configuration field according to `mode`.
                            end_of_speech:
                              type: object
                              description: End of Speech (EoS) detection configuration, used to determine when the user finishes speaking.
                              properties:
                                mode:
                                  type: string
                                  description: |-
                                    End-of-speech detection mode. Supported values:
                                    - `"vad"`: (default) Triggered based on VAD (voice activity detection), using silence duration detection.
                                    - `"semantic"`: Triggered semantically, using a semantic understanding module to determine whether the conversation turn has ended. This mode currently supports only Chinese and English text.
                                '{mode}_config':
                                  $ref: '#/components/schemas/end_of_speech_config'
                                  description: |
                                    End-of-speech configuration parameters. Pass the corresponding configuration field according to `mode`.
                    interruption:
                      type: object
                      description: |-
                        Intelligent interruption control configuration used to centrally manage how the agent behaves when interrupted by the user.
                      properties:
                        enable:
                          type: boolean
                          default: true
                          description: |-
                            Whether to enable agent interruption:
                            - `true`: (default) Enabled.
                            - `false`: Disabled. When disabled, the agent cannot be interrupted in the middle of an interaction.
                        mode:
                          type: string
                          default: start_of_speech
                          description: |-
                            Interruption trigger method. Supported values:
                            - `"start_of_speech"`: (default) Trigger interruption when the user starts speaking.
                            - `"keywords"`: Trigger interruption when the user speaks specified keywords. Configure the keywords in the `keywords_config` field.
                        keywords_config:
                          type: object
                          description: |-
                            Configuration for keyword-triggered interruption. Takes effect only when `mode = "keywords"`.
                          properties:
                            trigger_keywords:
                              type: array
                              description: List of keywords that trigger interruption. Up to 128 keywords are supported.
                              items:
                                type: string
                        disabled_config:
                          type: object
                          description: |-
                            Handling strategy after interruption is disabled. Takes effect only when `interruption.enable` is `false`.
                          properties:
                            strategy:
                              type: string
                              description: |
                                Handling strategy after interruption is disabled. Supported values:
                                - `"append"`: Append mode. User speech does not interrupt the agent. The agent processes the received speech request after the current interaction ends.
                                - `"ignore"`: Ignore mode. The agent ignores user speech requests. If user speech is received while the agent is speaking or thinking, the request is ignored, discarded, and not stored in context.
                    sal:
                      type: object
                      description: |-
                        Selective Attention Locking (SAL) configuration.
                        > This feature is currently in beta.
                      properties:
                        sal_mode: 
                          type: string
                          description: |-
                            Selective Attention Locking mode. Supported options:
                            - `"locking"`: (default) Primary speaker locking mode. The agent locks onto the primary speaker and suppresses 95% of surrounding speech and noise. This mode can be enabled in two ways:
                              - Passive identification: The user speaks loudly and clearly at the beginning of the conversation, and the agent automatically identifies the user as the primary speaker.
                              - Pre-registration: When creating the agent, pre-register a primary speaker voiceprint URL through the `sample_urls` field. The agent then locks onto the primary speaker based on the pre-registered voiceprint URL.
                            - `"recognition"`: Voiceprint recognition mode. You can pre-register voiceprint URLs through the `sample_urls` field. Currently, only a single voiceprint can be registered. The agent identifies different speakers and suppresses other background speech and environmental noise. Identified speaker identities are labeled in the `vpids` field under `metadata` and sent to the LLM. You need to set `llm.vendor` to `"custom"` and refer to [Custom LLM](/doc/convoai/restful/user-guides/custom-llm) to learn how to let the LLM process speaker information.
                          default: "locking"
                        sample_urls:
                          type: object
                          description: |-
                            Registered voiceprint URLs in key-value format. The key is the registered voiceprint name, and the value is the download URL of the corresponding speaker's voiceprint.
                            > - The voiceprint name cannot be set to `"unknown"`. This is a reserved keyword used to identify unknown speakers.
                            > - Registered voiceprints must meet the following requirements:
                            >   - Quantity: Currently, only one registered voiceprint URL is supported per task request.
                            >   - Size: Each voiceprint file must not exceed 2 MB.
                            >   - Duration: 10 to 15 seconds, with at least 8 seconds of effective audio and not too much silence.
                            >   - Format: PCM audio file with a 16 kHz sample rate, 16-bit depth, and mono channel. The file name suffix must be `.pcm`.
                    labels:
                      type: object
                      description: |-
                        Custom labels in key-value format, where the key is the label name and the value is the label value. These are used to let the agent carry custom business information.
                        
                        This custom information is bound to the agent and returned in the `payload` field of all message notification callbacks from the Conversational AI Engine. It can be used to implement custom business logic, such as marking campaign IDs, customer groups, and business scenarios.
                      additionalProperties:
                        type: string
                    rtc:
                      type: object
                      description: RTC media content encryption configuration.
                      properties:
                        encryption_key:
                          type: string
                          description: |-
                            Encryption key as a string. The length is not limited. Agora recommends using a 32-byte key.
                            > If the encryption key is not set or is set to an empty value, built-in encryption cannot be used.
                        encryption_salt:
                          type: string
                          description: |-
                            Salt used for encryption, as a Base64-encoded string whose decoded length is 32 bytes.
                            > This parameter takes effect only when `encryption_mode` is set to `7` (AES_128_GCM2) or `8` (AES_256_GCM2). In this case, make sure this parameter is not empty.
                        encryption_mode:
                          type: integer
                          description: |-
                            Built-in encryption mode. Supported values:
                            - `1`: AES_128_XTS - 128-bit AES encryption, XTS mode.
                            - `2`: AES_128_ECB - 128-bit AES encryption, ECB mode.
                            - `3`: AES_256_XTS - 256-bit AES encryption, XTS mode.
                            - `4`: SM4_128_ECB - 128-bit SM4 encryption, ECB mode.
                            - `5`: AES_128_GCM - 128-bit AES encryption, GCM mode.
                            - `6`: AES_256_GCM - 256-bit AES encryption, GCM mode.
                            - `7`: AES_128_GCM2 - 128-bit AES encryption, GCM mode. This mode requires `salt` (`encryption_salt`).
                            - `8`: AES_256_GCM2 - 256-bit AES encryption, GCM mode. This mode requires `salt` (`encryption_salt`).
                            
                            > Agora recommends using mode `7` (AES_128_GCM2) or `8` (AES_256_GCM2), because both modes support encryption salt for improved security.
                    filler_words:
                      type: object
                      description: |-
                        Filler words feature (Beta) configuration, used to play filler phrases while waiting for the LLM response, reducing user anxiety during waiting and improving conversational fluency.
                        
                        Filler-word playback follows these rules:
                        - **Playback order**: When multiple filler phrases or waiting LLM responses need to be played, they are played in the order in which the text arrives.
                        - **Interruption control**: Inherits the interruption mode configured globally in `turn_detection.config`.
                      properties:
                        enable:
                          type: boolean
                          description: |-
                            Whether to enable the filler words feature:
                            - `true`: Enabled.
                            - `false`: (default) Disabled.
                          default: false
                        trigger:
                          type: object
                          description: Filler-word trigger configuration, which defines when filler-word playback is triggered.
                          properties:
                            mode:
                              type: string
                              description: |-
                                Filler-word trigger mode. Supported values:
                                - `"fixed_time"`: Fixed-time trigger. Filler-word playback is triggered when the LLM response waiting time exceeds the configured threshold.
                            '{mode}_config':
                              $ref: '#/components/schemas/filler_words_trigger_config'
                              description: |
                                Filler-word trigger configuration parameters. Select the corresponding configuration according to `mode`.
                        content:
                          type: object
                          description: Filler-word content configuration, which defines the source and selection rule for filler phrases.
                          properties:
                            mode:
                              type: string
                              description: |-
                                Filler-word content mode. Supported values:
                                - `"static"`: Static filler words. Uses a predefined filler phrase list.
                            '{mode}_config':
